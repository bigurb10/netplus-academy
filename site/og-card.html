<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>FieldReady Academy</title>
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}

<div class="brand"><span class="mark">FR</span> FieldReady Academy</div>
