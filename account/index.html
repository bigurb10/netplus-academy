<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Your progress - FieldReady Academy</title>
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="../catalog.css">
</head>
<body>
<header class="hero slim">
  <div class="wrap">
    <div class="brand-row">
      <a class="brand" href="/"><span class="mark">FR</span> FieldReady Academy</a>
      <nav class="top-links"><a class="discord" href="https://discord.gg/8mvaA7q9Er" target="_blank" rel="noopener" aria-label="Join the FieldReady Academy Discord" title="Join the Discord"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M20.317 4.37a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.74 19.74 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.058a.082.082 0 0 0 .031.056 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.1 13.1 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.126-.094.252-.192.372-.291a.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.3 12.3 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.84 19.84 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg></a></nav>
      <div class="acct-slot" id="acct"></div>
    </div>
    <h1 id="heading">Your progress</h1>
    <p id="detail" class="muted"></p>
  </div>
</header>
<main class="wrap">
  <div class="cards" id="courses"></div>
</main>
<script src="../engine/auth.js"></script>
<script src="../engine/summary.js"></script>
<script src="../engine/strength.js"></script>
<script>
(function () {
  // FRA account page: read-only over the account's synced copy. It never writes, never
  // merges, and never reads this device's local progress -- the course pages push within
  // seconds of a change, so a stale number here is a sync problem to fix at the source.
  var A = window.FRAAuth, SUM = window.FRASummary, ST = window.FRAStrength;
  // Injected by build.py (window.FRA_COURSES): id, name, exam, lessons, labs, passPct,
  // passesNeeded, passWindow, examQuestions, checkpointN, domains, lessonList, in catalog order.
  var COURSES = Array.isArray(window.FRA_COURSES) ? window.FRA_COURSES : [];
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]; }); };
  var api = function (p) { return A.CONFIG.apiBase + p; };
  function dateOf(ms) { try { return new Date(ms).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' }); } catch (e) { return ''; } }
  function ago(ms) {
    var d = Date.now() - ms;
    if (!(d >= 0)) return 'just now';
    var m = Math.floor(d / 60000), h = Math.floor(m / 60), days = Math.floor(h / 24);
    if (m < 1) return 'just now';
    if (m < 60) return m + (m === 1 ? ' minute ago' : ' minutes ago');
    if (h < 24) return h + (h === 1 ? ' hour ago' : ' hours ago');
    if (days < 30) return days + (days === 1 ? ' day ago' : ' days ago');
    return dateOf(ms);
  }
  function Unauthorized() { this.status = 401; }

  function signedOut(note) {
    $('heading').textContent = 'Your progress';
    $('detail').textContent = note || 'Sign in to see your progress on every course.';
    $('acct').innerHTML = '<button class="btn small" data-act="sign-in">Sign in</button>';
    $('courses').innerHTML = '';
  }
  function header(u) {
    $('heading').textContent = u.name || 'Your progress';
    // The one place the email is shown: this page exists to answer "which account is this".
    $('detail').textContent = u.email ? 'Signed in as ' + u.email : '';
    $('acct').innerHTML = '<button class="btn ghost small" data-act="sign-out">Sign out</button>';
  }
  function fact(k, v) { return '<div class="fact"><dt>' + esc(k) + '</dt><dd>' + esc(v) + '</dd></div>'; }
  // Where the learner stands on this course: exam domains ranked strongest to weakest over the
  // last two tests and recent checkpoints (engine/strength.js), then the three weakest topics as
  // links into the course. Nothing until there is a test or a checkpoint to rank.
  function strength(state, c) {
    if (!ST || !Array.isArray(c.domains) || !Array.isArray(c.lessonList)) return '';
    var r = ST.compute(state, { domains: c.domains, lessons: c.lessonList, checkpointN: c.checkpointN || 4 });
    if (!r.hasData) return '';
    var bars = r.domains.map(function (d) {
      return '<div class="sbar" title="' + esc(d.name) + '"><span>' + esc(d.short) + '</span><i' + (d.acc == null ? ' class="dim"' : '') + ' style="width:' + (d.acc == null ? 100 : d.acc) + '%"></i><b>' + (d.acc == null ? '&ndash;' : d.acc + '%') + '</b></div>';
    }).join('');
    var weak = r.weakest.slice(0, 3).map(function (x) { return '<a href="/' + encodeURIComponent(c.id) + '/app/#lesson/' + encodeURIComponent(x.id) + '">' + esc(x.title) + '</a>'; }).join(', ');
    return '<div class="sbars" title="Strongest to weakest: your last two tests and recent checkpoints">' + bars + '</div>' + (weak ? '<p class="weakest muted">Weakest: ' + weak + '</p>' : '');
  }
  function card(it) {
    // href is the landing page (the course name heading); appHref is where the actual
    // action buttons go -- this is a progress page, so Start/Open/Continue drop the
    // learner straight into the app rather than the marketing landing page.
    var c = it.course, href = '/' + encodeURIComponent(c.id) + '/', appHref = '/' + encodeURIComponent(c.id) + '/app/';
    var head = '<h3><a href="' + href + '">' + esc(c.name) + '</a></h3><p class="exam">' + esc(c.exam) + '</p>';
    if (!it.row) return '<div class="card"><div class="pill soon">Not started</div>' + head + '<a class="go" href="' + appHref + '">Start the course</a></div>';
    if (it.err || !it.state) return '<div class="card"><div class="pill soon">Progress unavailable</div>' + head + '<p class="muted">Couldn\'t read this course\'s progress.</p><a class="go" href="' + appHref + '">Open the course</a></div>';
    var s = SUM.summarize(it.state, c);
    var pct = s.lessonsTotal ? Math.round(100 * Math.min(s.lessonsPassed, s.lessonsTotal) / s.lessonsTotal) : 0;
    var synced = it.row.updated_at ? Date.parse(it.row.updated_at) : NaN;
    return '<div class="card">'
      + '<div class="pill' + (s.stage === 'ready' ? '' : ' soon') + '">' + esc(s.stageLabel) + '</div>'
      + head
      + '<div class="bar" title="' + pct + '% of lessons passed"><span style="width:' + pct + '%"></span></div>'
      + '<dl class="facts">'
      + fact('Lessons passed', s.lessonsPassed + ' of ' + s.lessonsTotal)
      + (c.labs > 0 ? fact('Labs done', s.labsDone + ' of ' + s.labsTotal) : '')
      + (c.pbqs > 0 ? fact('PBQs done', s.pbqsDone + ' of ' + s.pbqsTotal) : '')
      + fact('Best practice score', s.bestPct == null ? 'No test yet' : s.bestPct + '%')
      + fact('Passes', s.passes + ' of ' + s.passesNeeded + ' in last ' + s.passWindow)
      + fact('Official-format test', s.official && s.official.date ? 'Passed ' + dateOf(s.official.date) : 'Not yet')
      + fact('Last studied', s.lastStudied ? ago(s.lastStudied) : 'Not yet')
      + fact('Last synced', synced === synced ? ago(synced) : 'Unknown')
      + '</dl>' + strength(it.state, c) + '<a class="go" href="' + appHref + '">Continue</a></div>';
  }
  function get(tok, p) {
    return fetch(api(p), { headers: { Authorization: 'Bearer ' + tok } }).then(function (r) {
      if (r.status === 401) throw new Unauthorized();
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    });
  }
  function load() {
    var u = A.isSignedIn() ? A.user() : null;
    if (!u) { signedOut(); return Promise.resolve(); }
    header(u);
    $('courses').innerHTML = '<p class="muted">Loading your progress...</p>';
    return A.accessToken().then(function (tok) {
      if (!tok) throw new Unauthorized();
      return get(tok, '/v1/progress').then(function (rows) {
        var byId = {};
        (Array.isArray(rows) ? rows : []).forEach(function (r) { if (r && r.course_id) byId[r.course_id] = r; });
        return Promise.all(COURSES.map(function (c) {
          var row = byId[c.id];
          if (!row) return { course: c, row: null };
          return get(tok, '/v1/progress/' + encodeURIComponent(c.id)).then(
            function (b) { return { course: c, row: row, state: b && b.state }; },
            function (e) { if (e instanceof Unauthorized) throw e; return { course: c, row: row, err: true }; });
        }));
      });
    }).then(function (items) {
      $('courses').innerHTML = items.map(card).join('');
    }, function (e) {
      if (e instanceof Unauthorized) { A.signOut(); signedOut('Your session ended. Sign in again to see your progress.'); return; }
      $('courses').innerHTML = '<div class="card"><p>Couldn\'t load your progress.</p><div><button class="btn small" data-act="retry">Retry</button></div></div>';
    });
  }
  document.addEventListener('click', function (ev) {
    var b = ev.target && ev.target.closest ? ev.target.closest('[data-act]') : null;
    if (!b) return;
    var act = b.getAttribute('data-act');
    if (act === 'sign-in') A.beginSignIn('/account/');
    else if (act === 'sign-out') { A.signOut(); signedOut(); }
    else if (act === 'retry') load();
  });
  // card is on the surface so a test can render one course's card from one state without
  // standing up a server row for it; the page itself only ever calls load().
  window.FRA_ACCOUNT = { load: load, card: card };
  window.FRA_ACCOUNT.ready = load();
})();
</script>
</body>
</html>
