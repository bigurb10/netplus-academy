{id:"u3l1-6",t:"u3l1",q:"A data center needs an inexpensive 25 Gbps link between a switch and a server three meters away. Which cabling option fits BEST?",a:["Cat 5e UTP","Single-mode fiber with LR optics","Direct attach twinaxial cable","RG-6 coaxial"],c:2,e:"Direct attach twinaxial cables have transceivers built into both ends and are the low-cost choice for very short high-speed links."},
{id:"u3l1-7",t:"u3l1",q:"Cabling must be installed near large motors on a factory floor. Which cable type BEST resists the electrical noise?",a:["UTP","STP","Cat 5e","RG-59 coax"],c:1,e:"Shielded twisted pair adds foil or braid around the pairs to block electromagnetic interference."},

// u3l2 Fiber
{id:"u3l2-1",t:"u3l2",q:"Two buildings on a campus are 3 kilometers apart and must be connected at 10 Gbps. Which fiber type should be used?",a:["Multimode OM3","Multimode OM4","Single-mode","Twinaxial"],c:2,e:"Multimode fiber reaches a few hundred meters at 10 Gbps. Kilometer distances require single-mode fiber."},
{id:"u3l2-2",t:"u3l2",q:"Which fiber connector is small, square, and snaps into most modern SFP transceivers?",a:["ST","SC","LC","MPO"],c:2,e:"LC is the compact connector standard on SFP and SFP+ modules. SC is larger and ST is a round bayonet."},
{id:"u3l2-3",t:"u3l2",q:"A technician needs to extend a copper Ethernet link across a 400-meter parking lot using existing fiber. Which device is required?",a:["Repeater hub","Media converter","Load balancer","Patch panel"],c:1,e:"A media converter changes the copper signal to fiber and back without altering the data."},
{id:"u3l2-4",t:"u3l2",q:"A fiber patch cord has green connectors. What does the green color indicate?",a:["Multimode fiber","Single-mode UPC polish","APC angled polish","A damaged cable"],c:2,e:"Green connectors indicate an angled physical contact (APC) polish. Blue indicates UPC. The two should not be mated together."},
{id:"u3l2-5",t:"u3l2",q:"Which connector carries 12 or 24 fibers in a single plug for 40 and 100 gigabit links?",a:["LC","SC","MPO","ST"],c:2,e:"MPO (also MTP) is the multi-fiber ribbon connector used with parallel optics at 40G and 100G."},
{id:"u3l2-6",t:"u3l2",q:"Which fiber type has the smaller core, uses a laser light source, and reaches the longest distances?",a:["Multimode","Single-mode","Plenum","Twinaxial"],c:1,e:"Single-mode fiber has a roughly 9-micron core, carries one light path from a laser, and reaches 10 kilometers or more."},

// u3l3 Transceivers and Ethernet
{id:"u3l3-1",t:"u3l3",q:"A switch link runs at 10 Gbps over a fiber module. Which form factor is the module MOST likely to be?",a:["SFP","SFP+","QSFP","GBIC"],c:1,e:"SFP+ is the 10 Gbps version of the small form-factor pluggable. SFP is 1 Gbps and QSFP is 40 Gbps."},
{id:"u3l3-2",t:"u3l3",q:"A technician installs a 10GBASE-SR module in one switch and a 10GBASE-LR module in the other and connects them with single-mode fiber. The link does not come up. Why?",a:["SR and LR use different wavelengths and fiber types and must match on both ends","Single-mode fiber cannot carry 10 Gbps","The modules require Cat 6A instead","SR modules only work at 1 Gbps"],c:0,e:"Both ends need the same standard. SR is short reach over multimode; LR is long reach over single-mode. Mismatched optics will not link."},
{id:"u3l3-3",t:"u3l3",q:"Which Ethernet standard runs 10 Gbps over single-mode fiber to about 10 kilometers?",a:["10GBASE-T","10GBASE-SR","10GBASE-LR","1000BASE-LX"],c:2,e:"10GBASE-LR is long reach single-mode to 10 km. SR is multimode to about 300 meters; ER reaches 40 km."},
{id:"u3l3-4",t:"u3l3",q:"One end of a link is hard-coded to 100 Mbps full duplex and the other is set to auto-negotiate. The link shows late collisions and CRC errors. What is the cause?",a:["Attenuation","Duplex mismatch","Wrong fiber polish","VLAN mismatch"],c:1,e:"When one side is forced and the other auto-negotiates, the auto side falls back to half duplex. The resulting mismatch produces late collisions and CRC errors."},
{id:"u3l3-5",t:"u3l3",q:"What does the first half of a MAC address such as 3C:52:82:1A:9F:07 identify?",a:["The host's IP subnet","The manufacturer (OUI)","The VLAN ID","The switch port"],c:1,e:"The first 24 bits of a MAC address are the Organizationally Unique Identifier assigned to the manufacturer."},
{id:"u3l3-6",t:"u3l3",q:"Which transceiver form factor supports 100 Gbps?",a:["SFP","SFP+","QSFP+","QSFP28"],c:3,e:"QSFP28 carries four 25 Gbps lanes for 100 Gbps. QSFP+ is 40 Gbps."},
{id:"u3l3-7",t:"u3l3",q:"In the standard name 1000BASE-T, what does the T indicate?",a:["Ten kilometers","Twisted pair copper","Terabit","Twinaxial"],c:1,e:"T means twisted-pair copper. S and L denote short and long reach fiber."},

// u3l4 Traffic types and wireless media
{id:"u3l4-1",t:"u3l4",q:"Which traffic type delivers a packet to the nearest one of several servers that all share the same IP address?",a:["Unicast","Broadcast","Multicast","Anycast"],c:3,e:"Anycast assigns one address to many servers and routes each request to the closest instance. DNS root servers and CDNs use it."},
{id:"u3l4-2",t:"u3l4",q:"A DHCP client sends a Discover message to 255.255.255.255. Which traffic type is this?",a:["Unicast","Broadcast","Multicast","Anycast"],c:1,e:"255.255.255.255 is the limited broadcast address, delivered to every host on the local segment."},
{id:"u3l4-3",t:"u3l4",q:"A video training stream is sent once and received only by the workstations that joined the group address 239.1.1.10. Which traffic type is in use?",a:["Unicast","Broadcast","Multicast","Anycast"],c:2,e:"Multicast delivers one stream to a group of subscribers using a Class D address in the 224 to 239 range."},
{id:"u3l4-4",t:"u3l4",q:"Why does a router not forward an ARP request from one subnet to another?",a:["ARP uses TCP","ARP requests are broadcasts, and routers do not forward broadcasts","ARP is encrypted","Routers operate only at Layer 1"],c:1,e:"ARP requests are Layer 2 broadcasts. Routers separate broadcast domains and never forward broadcast traffic."},
{id:"u3l4-5",t:"u3l4",q:"A remote research station uses a geostationary satellite link. Which characteristic MOST affects interactive applications?",a:["High latency of roughly half a second","Lack of encryption","Limited to 2.4 GHz","Requires Cat 6A cabling"],c:0,e:"Geostationary satellites orbit about 36,000 km up, adding roughly 500 to 600 ms of round-trip latency that hurts voice and interactive traffic."},
{id:"u3l4-6",t:"u3l4",q:"Which statement about broadcast traffic in IPv6 is correct?",a:["IPv6 uses broadcast for neighbor discovery","IPv6 has no broadcast and uses multicast instead","IPv6 broadcasts are limited to 64 hosts","IPv6 broadcasts are routed across the internet"],c:1,e:"IPv6 eliminated broadcast. Functions that used broadcast in IPv4, such as address resolution, use multicast groups like ff02::1."},
{id:"u3l4-7",t:"u3l4",q:"A branch office in a rural area has no wired provider. Which WAN option can provide primary connectivity using carrier networks?",a:["Twinaxial","Cellular 4G or 5G","Multimode fiber","Cat 8"],c:1,e:"Cellular service from a carrier provides WAN connectivity where wired service is unavailable and is also common as a backup link."}
);

// NetPlus Academy question bank: unit 4 (IP addressing) and unit 5 lessons 1-2 (transport and ports).
window.FRA = window.FRA || {};
FRA.questions = FRA.questions || [];
FRA.questions.push(
// u4l1 IPv4 basics and classes
{id:"u4l1-1",t:"u4l1",q:"What is the CIDR prefix length for the subnet mask 255.255.255.240?",a:["/26","/27","/28","/29"],c:2,e:"240 in binary is 11110000, four network bits in the last octet. 24 plus 4 equals /28."},
{id:"u4l1-2",t:"u4l1",q:"A host has the address 172.20.5.9 with no mask specified. To which historical address class does it belong, and what is its default mask?",a:["Class A, /8","Class B, /16","Class C, /24","Class D, multicast"],c:1,e:"First octets from 128 to 191 are Class B with a default /16 mask."},
{id:"u4l1-3",t:"u4l1",q:"Which subnet mask corresponds to /20?",a:["255.255.224.0","255.255.240.0","255.255.248.0","255.255.255.240"],c:1,e:"/20 is 16 bits plus 4 more in the third octet. Four bits gives 240, so the mask is 255.255.240.0."},
{id:"u4l1-4",t:"u4l1",q:"Why is 127.0.0.1 never assigned to a network interface?",a:["It is a Class D multicast address","It is reserved for loopback to the local host","It is the default gateway of every network","It is a broadcast address"],c:1,e:"The entire 127.0.0.0/8 block is reserved for loopback, and 127.0.0.1 always refers to the host itself."},
{id:"u4l1-5",t:"u4l1",q:"How many host bits remain in a /27 network?",a:["3","5","27","29"],c:1,e:"An IPv4 address has 32 bits. 32 minus 27 leaves 5 host bits, which allows 30 usable hosts."},
{id:"u4l1-6",t:"u4l1",q:"What is the decimal value of the binary octet 11100000?",a:["192","224","240","248"],c:1,e:"128 plus 64 plus 32 equals 224."},
{id:"u4l1-7",t:"u4l1",q:"Which address is in the Class C range?",a:["10.200.1.1","126.5.5.5","191.255.1.1","203.0.113.7"],c:3,e:"Class C spans first octets 192 through 223. 203 falls in that range."},

// u4l2 Special addresses
{id:"u4l2-1",t:"u4l2",q:"A laptop cannot reach any network resources and shows the address 169.254.33.7. What does this indicate?",a:["It received a valid lease from the DHCP server","It could not reach a DHCP server and assigned itself an APIPA address","It has a static public address","It is configured with an IPv6 link-local address"],c:1,e:"169.254.0.0/16 is the automatic private IP addressing range used when DHCP fails."},
{id:"u4l2-2",t:"u4l2",q:"Which address is NOT in a private RFC 1918 range?",a:["10.255.0.1","172.31.4.4","172.32.0.9","192.168.250.1"],c:2,e:"The Class B private range runs 172.16.0.0 through 172.31.255.255. 172.32.0.9 is just outside it and is a public address."},
{id:"u4l2-3",t:"u4l2",q:"Why do private addresses require NAT to reach the internet?",a:["They are too long","They are not routable on the public internet","They use UDP only","They expire every 24 hours"],c:1,e:"Internet routers drop RFC 1918 addresses. NAT translates them to a public address at the network edge."},
{id:"u4l2-4",t:"u4l2",q:"Which CIDR block represents the 192.168 private range in its entirety?",a:["192.168.0.0/8","192.168.0.0/12","192.168.0.0/16","192.168.0.0/24"],c:2,e:"RFC 1918 reserves the whole 192.168.0.0/16 block, 192.168.0.0 through 192.168.255.255, as private space. 192.168.0.0/24 is only one of the 256 subnets inside it; home routers use a /24 like that, which is why it looks familiar, but it is not the entire range. /8 and /12 belong to the 10.0.0.0 and 172.16.0.0 private blocks."},
{id:"u4l2-5",t:"u4l2",q:"Which address range is reserved for multicast in IPv4?",a:["127.0.0.0 to 127.255.255.255","169.254.0.0 to 169.254.255.255","224.0.0.0 to 239.255.255.255","240.0.0.0 to 255.255.255.254"],c:2,e:"Class D, 224.0.0.0 through 239.255.255.255, is reserved for multicast groups."},
{id:"u4l2-6",t:"u4l2",q:"Several new users on a subnet receive 169.254.x.x addresses while existing users are fine. What should the technician check FIRST?",a:["The cable category","The DHCP scope for available addresses","The DNS server","The spanning tree root bridge"],c:1,e:"New clients failing while old ones work points to an exhausted DHCP scope. Clients that cannot get a lease self-assign APIPA addresses."},

// u4l3 Subnetting
{id:"u4l3-1",t:"u4l3",q:"A host is configured as 192.168.1.100 with mask 255.255.255.224. What is the broadcast address of its subnet?",a:["192.168.1.127","192.168.1.128","192.168.1.255","192.168.1.96"],c:0,e:"Block size is 256 minus 224, which is 32. The host is in the 96 block, so the network is .96 and the broadcast is one below the next block, .127."},
{id:"u4l3-2",t:"u4l3",q:"How many usable host addresses does a /26 subnet provide?",a:["30","62","126","254"],c:1,e:"A /26 leaves 6 host bits. 2 to the 6th is 64, minus the network and broadcast addresses, gives 62."},
{id:"u4l3-3",t:"u4l3",q:"What is the network address for the host 10.5.37.200/20?",a:["10.5.0.0","10.5.32.0","10.5.37.0","10.5.36.0"],c:1,e:"/20 is 255.255.240.0, block size 16 in the third octet. 37 falls in the 32 to 47 block, so the network is 10.5.32.0."},
{id:"u4l3-4",t:"u4l3",q:"A router link needs exactly two usable addresses. Which mask is the MOST efficient?",a:["/28","/29","/30","/32"],c:2,e:"/30 leaves 2 host bits: 4 addresses, 2 usable. /31 is also used on point-to-point links, but /30 is the classic answer with a broadcast address."},
{id:"u4l3-5",t:"u4l3",q:"A network 172.16.0.0/16 is subnetted with a /22 mask. How many subnets are created?",a:["16","32","64","1024"],c:2,e:"Going from /16 to /22 borrows 6 bits. 2 to the 6th is 64 subnets, each with 1022 usable hosts."},
{id:"u4l3-6",t:"u4l3",q:"Which two hosts are in the same subnet if the mask is 255.255.255.192?",a:["10.1.1.60 and 10.1.1.70","10.1.1.130 and 10.1.1.190","10.1.1.120 and 10.1.1.130","10.1.1.190 and 10.1.1.200"],c:1,e:"Block size 64 gives subnets at 0, 64, 128, and 192. Both .130 and .190 fall in the 128 to 191 block."},
{id:"u4l3-7",t:"u4l3",q:"What is the last usable host address in the subnet 192.168.50.64/27?",a:["192.168.50.94","192.168.50.95","192.168.50.96","192.168.50.126"],c:0,e:"Block size 32: the subnet runs .64 to .95. The broadcast is .95, so the last usable host is .94."},
{id:"u4l3-8",t:"u4l3",q:"A workstation at 192.168.10.45/28 is configured with default gateway 192.168.10.30. Why can it not reach the internet?",a:["The gateway is in a different subnet than the host","/28 does not support a default gateway","The address is an APIPA address","The gateway must end in .1"],c:0,e:"With block size 16, .45 is in the 32 to 47 subnet and .30 is in the 16 to 31 subnet. The gateway must be inside the host's own subnet."},

// u4l4 Design and VLSM
{id:"u4l4-1",t:"u4l4",q:"A department needs 50 hosts. Which mask provides enough addresses with the least waste?",a:["/25","/26","/27","/28"],c:1,e:"50 hosts plus network and broadcast needs 52 addresses. The next power of two is 64, so 6 host bits, mask /26 with 62 usable."},
{id:"u4l4-2",t:"u4l4",q:"Which technique allows one network to use several different subnet mask lengths so each subnet fits its host count?",a:["NAT","VLSM","CIDR aggregation","Supernetting"],c:1,e:"Variable length subnet masking sizes each subnet individually. Supernetting goes the other direction, combining networks."},
{id:"u4l4-3",t:"u4l4",q:"The routes 10.4.0.0/24, 10.4.1.0/24, 10.4.2.0/24, and 10.4.3.0/24 are advertised as one summary. What is the summary route?",a:["10.4.0.0/22","10.4.0.0/23","10.4.0.0/24","10.4.0.0/21"],c:0,e:"Four consecutive /24s aligned on a multiple of 4 summarize into a single /22."},
{id:"u4l4-4",t:"u4l4",q:"Which of the following is NOT a valid subnet?",a:["192.168.1.64/26","192.168.1.128/25","192.168.1.96/26","192.168.1.32/27"],c:2,e:"A /26 has a block size of 64 and must start on a multiple of 64. 96 is not, so 192.168.1.96/26 is not a valid network address."},
{id:"u4l4-5",t:"u4l4",q:"An organization needs a subnet for exactly 31 hosts. Which mask is required?",a:["/27","/26","/28","/25"],c:1,e:"A /27 gives only 30 usable hosts, one short. 31 hosts requires the next size, /26 with 62 usable."},
{id:"u4l4-6",t:"u4l4",q:"When assigning VLSM subnets from a single block, which order avoids alignment problems?",a:["Smallest subnets first","Largest subnets first","Alphabetical by department","Random order"],c:1,e:"Allocating the largest subnets first keeps each block starting on a multiple of its own size, avoiding gaps and overlaps."},

// u4l5 IPv6 addressing
{id:"u4l5-1",t:"u4l5",q:"Which is the correctly shortened form of 2001:0db8:0000:0000:0000:ff00:0042:8329?",a:["2001:db8::ff00:42:8329","2001:db8:0:0:0:ff:42:8329","2001:0db8::ff00::8329","2001:db8:::ff00:42:8329"],c:0,e:"Drop leading zeros in each group and collapse the single longest run of zero groups to ::. The double colon may appear only once."},
{id:"u4l5-2",t:"u4l5",q:"An IPv6 address begins with fe80. What kind of address is it?",a:["Global unicast","Link-local","Unique local","Multicast"],c:1,e:"fe80::/10 is link-local. Every IPv6 interface has one and it is never routed off the local link."},
{id:"u4l5-3",t:"u4l5",q:"Hosts on an IPv6 network build their own addresses from a prefix advertised by the router without contacting a DHCP server. What is this called?",a:["DHCPv6","SLAAC","NAT64","EUI-64 tunneling"],c:1,e:"Stateless address autoconfiguration uses router advertisements to supply the prefix; the host generates its own interface identifier."},
{id:"u4l5-4",t:"u4l5",q:"What is the standard prefix length for an IPv6 LAN segment?",a:["/32","/48","/64","/128"],c:2,e:"IPv6 LANs use /64: 64 bits of network prefix and 64 bits of interface identifier, which SLAAC requires."},
{id:"u4l5-5",t:"u4l5",q:"Which IPv6 address range is used for private addressing routable only within an organization?",a:["2000::/3","fe80::/10","fc00::/7","ff00::/8"],c:2,e:"Unique local addresses come from fc00::/7 and in practice begin with fd. They are the IPv6 equivalent of RFC 1918 space."},
{id:"u4l5-6",t:"u4l5",q:"Which protocol replaces ARP in IPv6 for resolving a neighbor's MAC address?",a:["ICMPv6 Neighbor Discovery","DHCPv6","IGMP","RARP"],c:0,e:"Neighbor Discovery Protocol uses ICMPv6 neighbor solicitation and advertisement messages over multicast instead of ARP broadcasts."},
{id:"u4l5-7",t:"u4l5",q:"How does EUI-64 create a 64-bit interface identifier from a 48-bit MAC address?",a:["Appends 16 zero bits to the end","Inserts ff:fe in the middle and flips the seventh bit","Hashes the MAC with SHA-256","Prepends the subnet ID"],c:1,e:"EUI-64 splits the MAC in half, inserts fffe between the halves, and inverts the universal/local bit, which is the seventh bit of the first byte."},

// u4l6 Coexistence
{id:"u4l6-1",t:"u4l6",q:"An IPv6-only mobile network must let its users reach websites that only have IPv4 addresses. Which technology performs the translation?",a:["Dual stack","6to4 tunneling","NAT64","SLAAC"],c:2,e:"NAT64, usually paired with DNS64, translates between IPv6 clients and IPv4 servers."},
{id:"u4l6-2",t:"u4l6",q:"Two IPv6 sites are separated by an ISP network that supports only IPv4. Which approach connects them?",a:["NAT64","Tunneling IPv6 inside IPv4","Dual stack on the ISP routers","Assigning APIPA addresses"],c:1,e:"Tunneling encapsulates IPv6 packets in IPv4 so they can cross an IPv4-only network between two IPv6 islands."},
{id:"u4l6-3",t:"u4l6",q:"Every host and router in an organization runs both IPv4 and IPv6 at the same time. What is this strategy called?",a:["Dual stack","NAT64","Teredo","Anycast"],c:0,e:"Dual stack runs both protocols in parallel and uses whichever the destination supports."},
{id:"u4l6-4",t:"u4l6",q:"What is the primary reason IPv6 was developed?",a:["Faster routing algorithms","Exhaustion of the IPv4 address space","Elimination of the need for switches","Support for wireless networks"],c:1,e:"The roughly 4.3 billion IPv4 addresses ran out. IPv6's 128-bit space solves address exhaustion."},
{id:"u4l6-5",t:"u4l6",q:"A tunnel between two IPv6 sites over IPv4 causes some large packets to be dropped. What is the MOST likely reason?",a:["Tunneling adds header overhead that reduces the effective MTU","IPv6 cannot carry packets over 1000 bytes","The tunnel uses UDP","The sites need NAT64 instead"],c:0,e:"Encapsulation adds headers, so the largest payload that fits shrinks. Packets sized for a 1500-byte MTU no longer fit without fragmentation."},

// u5l1 TCP, UDP, protocol types
{id:"u5l1-1",t:"u5l1",q:"Which sequence correctly describes the TCP three-way handshake?",a:["SYN, ACK, FIN","SYN, SYN-ACK, ACK","ACK, SYN, ACK","SYN, RST, ACK"],c:1,e:"The client sends SYN, the server replies with SYN-ACK, and the client completes the connection with ACK."},
{id:"u5l1-2",t:"u5l1",q:"A video conferencing application prefers speed over guaranteed delivery. Which transport protocol is it MOST likely using?",a:["TCP","UDP","ICMP","GRE"],c:1,e:"UDP is connectionless with no retransmission, so it delivers real-time media with minimal delay. A late retransmitted packet is useless for live video."},
{id:"u5l1-3",t:"u5l1",q:"Which IPsec component provides encryption of the payload?",a:["AH","ESP","IKE","GRE"],c:1,e:"Encapsulating Security Payload encrypts data. Authentication Header provides integrity only, and IKE negotiates keys."},
{id:"u5l1-4",t:"u5l1",q:"Which protocol is used by the ping utility to test reachability?",a:["TCP","UDP","ICMP","ARP"],c:2,e:"Ping sends ICMP echo requests and listens for echo replies."},
{id:"u5l1-5",t:"u5l1",q:"An administrator needs a simple tunnel to carry multicast routing traffic between two sites and does not require encryption. Which protocol fits?",a:["GRE","ESP","AH","SSH"],c:0,e:"Generic Routing Encapsulation is a lightweight tunneling protocol with no encryption. Add IPsec if confidentiality is needed."},
{id:"u5l1-6",t:"u5l1",q:"Which TCP feature prevents a fast sender from overwhelming a slow receiver?",a:["Three-way handshake","Flow control using the receive window","Port numbers","Time to live"],c:1,e:"The receiver advertises a window size that limits how much unacknowledged data the sender may have in flight."},
{id:"u5l1-7",t:"u5l1",q:"Which protocol negotiates the encryption keys for an IPsec tunnel and uses UDP port 500?",a:["ESP","AH","IKE","TLS"],c:2,e:"Internet Key Exchange establishes security associations and keys for IPsec over UDP 500."},

// u5l2 Ports
{id:"u5l2-1",t:"u5l2",q:"A monitoring server polls switches successfully but never receives their alerts. Which port must be allowed inbound to the monitoring server?",a:["UDP 161","UDP 162","UDP 514","UDP 123"],c:1,e:"SNMP polling goes to the agent on UDP 161. Traps travel from the agent to the manager on UDP 162."},
{id:"u5l2-2",t:"u5l2",q:"A firewall must allow encrypted directory queries from clients to a domain controller. Which port should be opened?",a:["389","443","636","3389"],c:2,e:"LDAPS uses TCP 636. Plain LDAP is 389, HTTPS is 443, and RDP is 3389."},
{id:"u5l2-3",t:"u5l2",q:"Which port does SSH use by default?",a:["TCP 21","TCP 22","TCP 23","TCP 25"],c:1,e:"SSH, along with SFTP and SCP, uses TCP 22. FTP control is 21, Telnet is 23, SMTP is 25."},
{id:"u5l2-4",t:"u5l2",q:"Devices are failing to synchronize their clocks with the time server. Which port is MOST likely blocked?",a:["UDP 53","UDP 67","UDP 123","UDP 161"],c:2,e:"NTP uses UDP 123."},
{id:"u5l2-5",t:"u5l2",q:"A technician needs to allow Remote Desktop connections to a Windows server through a firewall. Which port is required?",a:["TCP 22","TCP 443","TCP 3389","TCP 1433"],c:2,e:"RDP uses TCP 3389. Port 1433 is SQL Server, 22 is SSH, and 443 is HTTPS."},
{id:"u5l2-6",t:"u5l2",q:"Which pair correctly matches a plaintext protocol with its encrypted alternative?",a:["HTTP 80 and HTTPS 8080","Telnet 23 and SSH 22","FTP 21 and TFTP 69","SMTP 25 and POP3 110"],c:1,e:"Telnet on 23 is replaced by SSH on 22. HTTPS is 443, TFTP is not an encrypted FTP, and POP3 is a different protocol from SMTP."},
{id:"u5l2-7",t:"u5l2",q:"Which ports does DHCP use?",a:["UDP 53 and 54","UDP 67 and 68","TCP 80 and 443","UDP 161 and 162"],c:1,e:"DHCP servers listen on UDP 67 and clients use UDP 68."},
{id:"u5l2-8",t:"u5l2",q:"A network device should send its log messages to a central collector. Which port and protocol does syslog use by default?",a:["TCP 514","UDP 514","UDP 162","TCP 445"],c:1,e:"Syslog traditionally uses UDP 514."},
{id:"u5l2-9",t:"u5l2",q:"Which port is used by Windows file and printer sharing over SMB?",a:["TCP 139 only","TCP 445","UDP 69","TCP 993"],c:1,e:"Modern SMB runs directly over TCP 445."},
{id:"u5l2-10",t:"u5l2",q:"A mail client is configured to retrieve messages securely using IMAP over TLS. Which port should it use?",a:["143","993","995","587"],c:1,e:"IMAPS is TCP 993. Plain IMAP is 143, POP3S is 995, and 587 is SMTP submission."},
{id:"u5l2-11",t:"u5l2",q:"DNS zone transfers and very large responses use which transport?",a:["UDP 53 only","TCP 53","TCP 853 only","UDP 5353"],c:1,e:"Ordinary DNS queries use UDP 53, but zone transfers and responses too large for UDP use TCP 53."},
{id:"u5l2-12",t:"u5l2",q:"Which port range is reserved for well-known services?",a:["0 to 1023","1024 to 49151","49152 to 65535","1 to 65535"],c:0,e:"Well-known ports are 0 through 1023. Registered ports run 1024 to 49151 and dynamic or ephemeral ports 49152 to 65535."}
);

// NetPlus Academy question bank: unit 6 (switching and wireless).
window.FRA = window.FRA || {};
FRA.questions = FRA.questions || [];
FRA.questions.push(
// u6l1 How switches work
{id:"u6l1-1",t:"u6l1",q:"A switch receives a frame whose destination MAC address is not in its MAC address table. What does it do?",a:["Drops the frame","Sends the frame to the default gateway","Floods the frame out all ports in the VLAN except the one it arrived on","Sends an ARP request"],c:2,e:"Unknown unicast frames are flooded within the VLAN so the destination can respond and the switch can learn its port."},
{id:"u6l1-2",t:"u6l1",q:"How does a switch populate its MAC address table?",a:["By reading the destination MAC of incoming frames","By reading the source MAC of incoming frames and noting the arrival port","From the DHCP server","From the routing table"],c:1,e:"Switches learn by recording the source MAC address of each frame along with the port it arrived on."},
{id:"u6l1-3",t:"u6l1",q:"A 24-port switch has all ports in VLAN 10. How many collision domains and broadcast domains does it create?",a:["1 collision domain, 24 broadcast domains","24 collision domains, 1 broadcast domain","1 of each","24 of each"],c:1,e:"Each switch port is its own collision domain. All ports in one VLAN share a single broadcast domain."},
{id:"u6l1-4",t:"u6l1",q:"A technician needs to configure a switch that has no IP address yet and is not reachable over the network. Which method should be used?",a:["SSH to the management VLAN","Telnet to the default gateway","Console cable connection","SNMP set commands"],c:2,e:"The console port provides out-of-band access that does not depend on any network configuration."},
{id:"u6l1-5",t:"u6l1",q:"Which device is required to allow hosts in two different VLANs to communicate?",a:["A hub","An additional Layer 2 switch","A router or Layer 3 switch","A repeater"],c:2,e:"Each VLAN is a separate broadcast domain and subnet. Traffic between them must be routed."},
{id:"u6l1-6",t:"u6l1",q:"Which of the following is one of the three primary functions of a Layer 2 switch?",a:["Assigning IP addresses","Loop avoidance","Name resolution","Encrypting frames"],c:1,e:"Switches perform address learning, forward/filter decisions, and loop avoidance. IP assignment and name resolution are DHCP and DNS."},

// u6l2 VLANs and trunking
{id:"u6l2-1",t:"u6l2",q:"Two switches must be connected by one link that carries traffic for VLANs 10, 20, and 30. How should the ports on each end be configured?",a:["As access ports in VLAN 1","As an 802.1Q trunk","With port mirroring","As a voice VLAN"],c:1,e:"An 802.1Q trunk tags each frame with its VLAN ID so multiple VLANs can share one physical link."},
{id:"u6l2-2",t:"u6l2",q:"A user moves to a new desk. The link light is on and the PC gets an IP address, but in a different range than before, and it cannot reach its file server. What is the MOST likely cause?",a:["The new port is assigned to the wrong VLAN","A bad patch cable","A duplicate IP address","The DNS server is down"],c:0,e:"A different address range means a different DHCP scope, which means the access port belongs to a different VLAN than the user needs."},
{id:"u6l2-3",t:"u6l2",q:"On an 802.1Q trunk, which VLAN's frames are sent without a tag?",a:["VLAN 4094","The management VLAN","The native VLAN","The voice VLAN"],c:2,e:"The native VLAN crosses the trunk untagged. It is VLAN 1 by default and must match on both ends of the trunk."},
{id:"u6l2-4",t:"u6l2",q:"An IP phone with a PC plugged into its pass-through port connects to one switch port. Which feature lets the phone's traffic use a separate VLAN from the PC's?",a:["Port mirroring","Voice VLAN","Spanning tree","Link aggregation"],c:1,e:"A voice VLAN on the access port lets the phone tag its frames into the voice VLAN while the PC's untagged traffic stays in the data VLAN."},
{id:"u6l2-5",t:"u6l2",q:"A Layer 3 switch needs a gateway address for VLAN 20 so hosts in that VLAN can be routed. What is configured?",a:["A subinterface","A switch virtual interface (SVI)","A trunk port","A static MAC entry"],c:1,e:"An SVI, such as interface vlan 20, gives the switch a routed IP interface in that VLAN."},
{id:"u6l2-6",t:"u6l2",q:"Switches log native VLAN mismatch errors on a trunk link. What is the risk if this is not corrected?",a:["The trunk speed drops to 10 Mbps","Untagged traffic leaks between the two mismatched VLANs","The switches lose their MAC tables","DHCP stops working on all VLANs"],c:1,e:"Each side treats untagged frames as belonging to its own native VLAN, so traffic crosses between two different VLANs without any routing or filtering."},
{id:"u6l2-7",t:"u6l2",q:"A router with a single physical interface must route between four VLANs on a trunk. What does the administrator configure on the router?",a:["Four SVIs","Four subinterfaces, each tagged with a VLAN and addressed in that subnet","Four static routes","Four access ports"],c:1,e:"Router on a stick uses one trunk with a subinterface per VLAN. SVIs are the Layer 3 switch equivalent."},

// u6l3 STP
{id:"u6l3-1",t:"u6l3",q:"After a technician adds a second cable between two switches for redundancy, the network floods with broadcast traffic and becomes unusable. Which protocol, if enabled, would have prevented this?",a:["LACP","STP","LLDP","VRRP"],c:1,e:"Spanning Tree Protocol blocks redundant Layer 2 paths to prevent loops and broadcast storms. LACP would bundle the links but must be deliberately configured."},
{id:"u6l3-2",t:"u6l3",q:"How is the root bridge selected in a spanning tree topology?",a:["The switch with the most ports","The switch with the lowest bridge ID","The switch with the highest IP address","The first switch powered on"],c:1,e:"The lowest bridge ID, which is priority followed by MAC address, wins. Administrators lower the priority on the core switch to make it root."},
{id:"u6l3-3",t:"u6l3",q:"Which STP port state receives BPDUs but does not forward frames or learn MAC addresses?",a:["Forwarding","Learning","Blocking","Listening"],c:2,e:"A blocking port stays quiet to prevent a loop, listening only for BPDUs so it can transition if the topology changes."},
{id:"u6l3-4",t:"u6l3",q:"Which feature should be enabled on access ports so a user cannot plug in an unauthorized switch and affect the spanning tree?",a:["PortFast only","BPDU guard","Root guard on the core","Loop guard"],c:1,e:"BPDU guard shuts down an access port if it receives a BPDU, which only a switch would send."},
{id:"u6l3-5",t:"u6l3",q:"A network needs redundant switch links but cannot tolerate 30 to 50 seconds of outage when a link fails. Which protocol should be used?",a:["802.1D STP","802.1w Rapid Spanning Tree","802.1Q","802.3ad"],c:1,e:"RSTP converges in a few seconds compared with the 30 to 50 seconds of classic STP."},
{id:"u6l3-6",t:"u6l3",q:"An access switch with default settings became the root bridge because it had the lowest MAC address, causing traffic to take inefficient paths. What is the fix?",a:["Disable STP on the access switch","Set a lower bridge priority on the intended core switch","Add more links to the access switch","Change the access switch's IP address"],c:1,e:"Root selection is by lowest bridge ID. Lowering the core switch's priority makes it win regardless of MAC address."},
{id:"u6l3-7",t:"u6l3",q:"Which symptom MOST strongly indicates a Layer 2 loop?",a:["Users receive APIPA addresses","MAC addresses flapping between ports and switch CPU near 100 percent","Ping works by IP but not by name","A single port shows administratively down"],c:1,e:"In a loop, the same MAC appears on multiple ports as frames circle, and the flood of broadcasts saturates the switch CPU."},

// u6l4 Switch features
{id:"u6l4-1",t:"u6l4",q:"A new access point requires about 25 watts over its Ethernet cable. Which PoE standard must the switch port support at minimum?",a:["802.3af","802.3at","802.3bt Type 4","802.1X"],c:1,e:"802.3af delivers about 13 watts to the device. 802.3at, PoE+, delivers about 25.5 watts. 802.3bt goes to 60 and 90 watts."},
{id:"u6l4-2",t:"u6l4",q:"Several PoE cameras on a switch work, but the last two added never power on. The switch ports are fine. What is the MOST likely cause?",a:["Wrong VLAN assignment","The switch's PoE power budget is exceeded","Spanning tree blocking","Duplex mismatch"],c:1,e:"Each switch has a total PoE budget. Once it is consumed, additional powered devices cannot be powered even though the ports work."},
{id:"u6l4-3",t:"u6l4",q:"A security analyst needs to capture all traffic passing through a specific switch port using a laptop running a protocol analyzer. Which switch feature is required?",a:["Port security","Port mirroring","Link aggregation","Jumbo frames"],c:1,e:"Port mirroring, also called SPAN, copies traffic from one or more ports to the port where the analyzer is connected."},
{id:"u6l4-4",t:"u6l4",q:"Which protocol negotiates the bundling of several physical links between two switches into one logical link?",a:["STP","LACP","VTP","CDP"],c:1,e:"Link Aggregation Control Protocol negotiates and maintains the bundle. Both ends need matching speed, duplex, and VLAN configuration."},
{id:"u6l4-5",t:"u6l4",q:"A storage network needs to move large amounts of data efficiently. Which switch setting reduces per-frame overhead?",a:["Enable jumbo frames end to end","Set all ports to half duplex","Reduce the MTU to 576","Enable PortFast"],c:0,e:"Jumbo frames raise the MTU to about 9000 bytes so fewer, larger frames carry the same data. Every device in the path must support it."},
{id:"u6l4-6",t:"u6l4",q:"A port shows err-disabled after a user plugged in a small unmanaged switch. Which feature MOST likely triggered this?",a:["Port security limiting learned MAC addresses","Jumbo frames","Auto-negotiation","Voice VLAN"],c:0,e:"Port security restricts the number or identity of MAC addresses on a port. Multiple devices behind an unmanaged switch violate it and the port is error-disabled."},
{id:"u6l4-7",t:"u6l4",q:"A pan-tilt-zoom camera requires 60 watts of PoE. Which standard is required?",a:["802.3af","802.3at","802.3bt","802.11ax"],c:2,e:"Only 802.3bt, PoE++, delivers 60 watts (Type 3) or 90 watts (Type 4)."},

// u6l5 Wireless fundamentals
{id:"u6l5-1",t:"u6l5",q:"Which three channels should adjacent access points use in the 2.4 GHz band to avoid overlapping frequencies?",a:["1, 6, and 11","1, 5, and 9","36, 40, and 44","2, 7, and 12"],c:0,e:"2.4 GHz channels are 5 MHz apart but 20 MHz wide, so only 1, 6, and 11 do not overlap. Channels 36, 40, and 44 are 5 GHz."},
{id:"u6l5-2",t:"u6l5",q:"Which wireless standard introduced operation in the 6 GHz band?",a:["802.11n","802.11ac","802.11ax (Wi-Fi 6E)","802.11g"],c:2,e:"Wi-Fi 6E extends 802.11ax into the 6 GHz band. Wi-Fi 5 (802.11ac) is 5 GHz only."},
{id:"u6l5-3",t:"u6l5",q:"What does a BSSID identify?",a:["The network name shown to users","The MAC address of a specific access point radio","A group of access points sharing one SSID","The wireless channel in use"],c:1,e:"The BSSID is the MAC address of one radio on one access point. The SSID is the human-readable name, and an ESSID spans multiple APs."},
{id:"u6l5-4",t:"u6l5",q:"Two office buildings 800 meters apart need a wireless link. Which antenna type should be used on each end?",a:["Omnidirectional","Directional","Dipole","Isotropic"],c:1,e:"Directional antennas focus energy along one path, providing the gain and range needed for building-to-building links."},
{id:"u6l5-5",t:"u6l5",q:"A campus deploys 60 access points that must be configured and monitored from one place, with automatic channel and power coordination. Which design is appropriate?",a:["Autonomous APs configured individually","Lightweight APs managed by a wireless LAN controller","Ad hoc mode on all devices","A single high-power AP"],c:1,e:"Lightweight APs receive configuration from a wireless LAN controller, which also coordinates channels, power, and roaming."},
{id:"u6l5-6",t:"u6l5",q:"Which wireless network type connects devices directly to each other without an access point?",a:["Infrastructure","Ad hoc","Mesh","Point-to-multipoint"],c:1,e:"Ad hoc, or IBSS, mode lets devices communicate peer to peer with no access point."},
{id:"u6l5-7",t:"u6l5",q:"In a dense apartment environment, a technician sets the 2.4 GHz radios to 20 MHz channel width instead of 40 MHz. Why?",a:["Wider channels do not work in 2.4 GHz","Narrower channels reduce overlap and interference with neighbors","20 MHz is required by WPA3","The switch only supports 20 MHz"],c:1,e:"Wider channels consume more of the limited 2.4 GHz spectrum and overlap more neighbors. 20 MHz keeps the three non-overlapping channels usable."},
{id:"u6l5-8",t:"u6l5",q:"Which technology lets multiple access points share one network name so clients can move between them without reconnecting?",a:["BSSID","ESSID","Ad hoc","Band steering"],c:1,e:"An extended service set uses the same SSID across many APs, allowing clients to roam."},

// u6l6 Wireless security and design
{id:"u6l6-1",t:"u6l6",q:"A company wants each employee to authenticate to Wi-Fi with individual credentials verified by a RADIUS server, using the strongest available protection. What should be configured?",a:["WPA2-Personal","WPA3-Enterprise","WEP with MAC filtering","An open network with a captive portal"],c:1,e:"Enterprise mode uses 802.1X with RADIUS for per-user authentication. WPA3 is the current strongest standard."},
{id:"u6l6-2",t:"u6l6",q:"Which WPA3 feature protects a personal-mode network against offline dictionary attacks on the passphrase?",a:["TKIP","SAE","WEP keys","MAC filtering"],c:1,e:"Simultaneous Authentication of Equals replaces the pre-shared key handshake so captured traffic cannot be used to crack the passphrase offline."},
{id:"u6l6-3",t:"u6l6",q:"Visitors must accept terms of use in a web page before browsing on the guest Wi-Fi. Which feature provides this?",a:["802.1X","Captive portal","Band steering","Pre-shared key"],c:1,e:"A captive portal intercepts the first web request and presents a page for acceptance or login before granting access."},
{id:"u6l6-4",t:"u6l6",q:"What is the purpose of a wireless site survey?",a:["To register the SSID with the FCC","To measure coverage, signal strength, and interference and produce a heat map","To assign IP addresses to access points","To configure WPA3 keys"],c:1,e:"A site survey measures the RF environment so APs can be placed and channels planned. Its output is a heat map."},
{id:"u6l6-5",t:"u6l6",q:"Many dual-band clients stay on the crowded 2.4 GHz band even though 5 GHz is available. Which feature encourages them to move?",a:["Captive portal","Band steering","PortFast","Channel bonding"],c:1,e:"Band steering nudges capable clients from 2.4 GHz to 5 GHz to relieve congestion."},
{id:"u6l6-6",t:"u6l6",q:"A small business relies on a hidden SSID and MAC filtering for wireless security. Which statement is accurate?",a:["This is equivalent to WPA2","These are weak controls that are easily bypassed and must be paired with WPA2 or WPA3 encryption","Hidden SSIDs prevent all unauthorized access","MAC filtering encrypts traffic"],c:1,e:"SSIDs are revealed in client traffic and MAC addresses are trivially spoofed. Neither provides encryption or real authentication."},
{id:"u6l6-7",t:"u6l6",q:"Users report that laptops drop connections when walking between two parts of the office. A survey shows the two AP cells barely touch. What is the MOST likely issue?",a:["Insufficient cell overlap for roaming","Too many non-overlapping channels","The APs use WPA3","The wrong antenna polish"],c:0,e:"Roaming requires adjacent cells to overlap by roughly 15 to 20 percent so the client can associate with the next AP before losing the current one."},
{id:"u6l6-8",t:"u6l6",q:"Which wireless encryption standard should NEVER be used because it can be cracked in minutes?",a:["WPA2-AES","WPA3-SAE","WEP","WPA2-Enterprise"],c:2,e:"WEP has fundamental flaws in its use of RC4 and initialization vectors and is trivially broken."}
);

// NetPlus Academy question bank: unit 7 (routing, appliances, cloud, modern networking, physical installations).
window.FRA = window.FRA || {};
FRA.questions = FRA.questions || [];
FRA.questions.push(
// u7l1 Routing fundamentals
{id:"u7l1-1",t:"u7l1",q:"A user can communicate with devices on the local subnet but cannot reach any remote networks or the internet. Which setting is MOST likely wrong?",a:["DNS server address","Default gateway","NTP server","DHCP lease time"],c:1,e:"Local traffic never touches the gateway, so a wrong gateway breaks only remote destinations."},
{id:"u7l1-2",t:"u7l1",q:"As a packet travels from a workstation through two routers to a server, which of the following remains unchanged?",a:["The source and destination MAC addresses","The source and destination IP addresses","The frame check sequence","The TTL value"],c:1,e:"Routers rewrite the frame at each hop and decrement the TTL, but the IP addresses in the packet stay the same unless NAT is applied."},
{id:"u7l1-3",t:"u7l1",q:"A branch router has routes only to its local subnets. Users cannot reach the internet. Which route should be added?",a:["A route to 127.0.0.0/8","A default route 0.0.0.0/0 pointing to the ISP","A route to 169.254.0.0/16","A host route to the DNS server"],c:1,e:"The default route matches any destination not otherwise in the table and sends it toward the internet."},
{id:"u7l1-4",t:"u7l1",q:"Which routing method requires an administrator to manually enter every route and does not adapt when a link fails?",a:["Dynamic routing","Static routing","Link-state routing","Policy routing"],c:1,e:"Static routes are typed in by hand. They are predictable and low overhead but do not change automatically."},
{id:"u7l1-5",t:"u7l1",q:"A host wants to send a packet to a destination on a different subnet. Which MAC address does it place in the frame's destination field?",a:["The destination host's MAC","The default gateway's MAC","The broadcast MAC","Its own MAC"],c:1,e:"For remote destinations the host frames the packet to its default gateway, learned through ARP, and the router takes it from there."},
{id:"u7l1-6",t:"u7l1",q:"A packet reaches the remote server but the reply never arrives back at the client. What is a likely cause?",a:["The client's DNS is wrong","The remote network lacks a return route to the client's subnet","The client's MAC address is invalid","The TTL is too high"],c:1,e:"Routing must work in both directions. A missing or incorrect route back to the source drops replies."},

// u7l2 Routing protocols and selection
{id:"u7l2-1",t:"u7l2",q:"A router learns a route to the same destination prefix from OSPF, from EIGRP, and from a manually configured static route. Which route is placed in the routing table?",a:["The OSPF route, because it is link-state","The EIGRP route, because it has the best metric","The static route, because it has the lowest administrative distance","All three are load-balanced"],c:2,e:"For identical prefixes, administrative distance decides. Static is 1, EIGRP is 90, OSPF is 110. Lower wins."},
{id:"u7l2-2",t:"u7l2",q:"A routing table contains 10.1.0.0/16, 10.1.1.0/24, and a default route. A packet arrives for 10.1.1.50. Which route is used?",a:["10.1.0.0/16","10.1.1.0/24","The default route","The route with the lowest metric"],c:1,e:"Longest prefix match is evaluated first. The /24 is the most specific match, so it wins before administrative distance or metric are considered."},
{id:"u7l2-3",t:"u7l2",q:"Which routing protocol is used between autonomous systems on the internet?",a:["OSPF","EIGRP","RIP","BGP"],c:3,e:"Border Gateway Protocol is the exterior gateway protocol that exchanges routes between autonomous systems."},
{id:"u7l2-4",t:"u7l2",q:"Which routing protocol uses hop count as its metric and is limited to 15 hops?",a:["OSPF","RIP","BGP","IS-IS"],c:1,e:"RIP counts hops with a maximum of 15. OSPF uses cost, EIGRP a composite metric, and BGP path attributes."},
{id:"u7l2-5",t:"u7l2",q:"Which statement describes a link-state routing protocol?",a:["Each router knows only what its neighbors advertise","Each router builds a complete map of the area and computes shortest paths","It sends its full routing table every 30 seconds","It is used only between autonomous systems"],c:1,e:"Link-state protocols such as OSPF flood link information so every router has the full topology and runs a shortest-path algorithm."},
{id:"u7l2-6",t:"u7l2",q:"Which is the default administrative distance of OSPF?",a:["1","90","110","120"],c:2,e:"OSPF is 110. EIGRP is 90, RIP is 120, static is 1, connected is 0."},
{id:"u7l2-7",t:"u7l2",q:"An organization with two internet providers wants to influence which provider is used for inbound and outbound traffic based on policy. Which protocol is designed for this?",a:["RIP","OSPF","BGP","VRRP"],c:2,e:"BGP is path-vector and policy based, which is why multihomed organizations use it to control traffic across providers."},
{id:"u7l2-8",t:"u7l2",q:"Two routes to the same prefix are learned from the same OSPF process. How does the router choose between them?",a:["Lowest administrative distance","Lowest metric (cost)","Longest prefix","Highest router ID"],c:1,e:"When prefix and administrative distance are equal, the metric decides. For OSPF that is cost."},

// u7l3 NAT and FHRP
{id:"u7l3-1",t:"u7l3",q:"A small office with 50 internal hosts reaches the internet through a single public IP address. Which technology makes this possible?",a:["Static NAT","PAT, also called NAT overload","VLSM","DHCP relay"],c:1,e:"Port address translation maps many private addresses to one public address by tracking source port numbers."},
{id:"u7l3-2",t:"u7l3",q:"Which protocol allows two routers to share one virtual gateway IP address so hosts keep connectivity if the primary router fails, and is an open standard?",a:["HSRP","VRRP","BGP","LACP"],c:1,e:"VRRP is the open-standard first hop redundancy protocol. HSRP is Cisco proprietary."},
{id:"u7l3-3",t:"u7l3",q:"An internal web server at 10.0.0.25 must be reachable from the internet at a fixed public address. Which NAT type is appropriate?",a:["Static NAT","Dynamic NAT","PAT","NAT64"],c:0,e:"Static NAT provides a permanent one-to-one mapping between a private and a public address, suitable for publishing a server."},
{id:"u7l3-4",t:"u7l3",q:"In NAT terminology, what is the inside global address?",a:["The private address of an internal host","The public address that represents an internal host to the outside","The address of the ISP router","The address of an external web server"],c:1,e:"Inside local is the private address before translation; inside global is its public translation."},
{id:"u7l3-5",t:"u7l3",q:"Hosts use 192.168.1.1 as their gateway. Two routers participate in an FHRP with that address as the virtual IP. What happens when the active router fails?",a:["Hosts must be reconfigured with the standby router's address","The standby router takes over the virtual IP and MAC, and hosts continue without change","All hosts lose connectivity until the router is replaced","DHCP issues new gateway addresses"],c:1,e:"FHRPs make failover transparent. The standby assumes the virtual address and hosts keep using the same gateway."},
{id:"u7l3-6",t:"u7l3",q:"A router's single WAN interface must carry three provider circuits, each on its own VLAN tag with its own IP address. What is configured?",a:["Three physical interfaces","Three subinterfaces","Three SVIs","Three loopbacks"],c:1,e:"Subinterfaces split one physical interface into tagged logical interfaces, each with its own addressing."},

// u7l4 Appliances
{id:"u7l4-1",t:"u7l4",q:"A security team wants a device placed inline that can automatically drop malicious packets rather than only generating alerts. Which device meets this requirement?",a:["IDS","IPS","Proxy server","Load balancer"],c:1,e:"An IPS sits in the traffic path and blocks in real time. An IDS is passive and only alerts."},
{id:"u7l4-2",t:"u7l4",q:"A company's web application runs on six identical servers. Which device distributes incoming client connections across them and removes a failed server from rotation?",a:["Proxy server","Load balancer","IDS","VPN concentrator"],c:1,e:"A load balancer spreads connections across a server pool using health checks to route around failures."},
{id:"u7l4-3",t:"u7l4",q:"Servers need block-level access to shared storage that appears to each server as a local disk. Which solution fits?",a:["NAS","SAN","CDN","Proxy"],c:1,e:"A storage area network provides block-level storage over iSCSI or Fibre Channel. NAS provides file-level shares."},
{id:"u7l4-4",t:"u7l4",q:"A global company wants users in every region to download its videos from a nearby cache instead of the origin data center. Which solution provides this?",a:["Load balancer","Content delivery network","Reverse proxy in the data center","NAS"],c:1,e:"A CDN caches content on distributed edge servers so users fetch it from the closest node."},
{id:"u7l4-5",t:"u7l4",q:"Which device caches web content, filters URLs, and hides internal client addresses when users browse the internet?",a:["Forward proxy","Load balancer","IPS","Router"],c:0,e:"A forward proxy makes requests on behalf of internal clients, providing caching, filtering, and address hiding."},
{id:"u7l4-6",t:"u7l4",q:"Voice traffic must be prioritized over file downloads when a WAN link is congested. Which function is required?",a:["NAT","QoS","STP","DHCP"],c:1,e:"Quality of service classifies and prioritizes traffic so latency-sensitive applications get through during congestion."},
{id:"u7l4-7",t:"u7l4",q:"Which device terminates many encrypted tunnels from remote workers at the network edge?",a:["VPN concentrator","Wireless LAN controller","Load balancer","Media converter"],c:0,e:"A VPN concentrator is purpose-built to terminate large numbers of VPN connections."},
{id:"u7l4-8",t:"u7l4",q:"A device monitors a copy of network traffic from a mirror port and sends an alert when it detects an attack signature but cannot stop the traffic. What is it?",a:["IPS","IDS","Firewall","Proxy"],c:1,e:"An intrusion detection system is passive and out of band. It detects and alerts but does not block."},

// u7l5 Cloud
{id:"u7l5-1",t:"u7l5",q:"A company rents virtual machines from a cloud provider and installs and manages its own operating systems and applications while the provider manages the hardware and hypervisors. Which service model is this?",a:["SaaS","PaaS","IaaS","DaaS"],c:2,e:"Infrastructure as a service provides compute, storage, and network; the customer manages everything from the OS up."},
{id:"u7l5-2",t:"u7l5",q:"Developers deploy code to a cloud platform that manages the operating system, runtime, and scaling for them. Which service model is this?",a:["IaaS","PaaS","SaaS","Private cloud"],c:1,e:"Platform as a service provides the runtime environment; developers supply only the application code."},
{id:"u7l5-3",t:"u7l5",q:"Which cloud construct applies stateful firewall rules to the network interface of an individual virtual machine?",a:["Network security list","Network security group","Internet gateway","VPC"],c:1,e:"Security groups attach to instances or their interfaces. Network security lists or network ACLs apply to whole subnets and are stateless."},
{id:"u7l5-4",t:"u7l5",q:"Virtual machines in a private cloud subnet must download updates from the internet but must not be reachable from the internet. Which component provides this?",a:["Internet gateway","NAT gateway","Direct connect","VPN concentrator"],c:1,e:"A NAT gateway allows outbound connections from private subnets while blocking unsolicited inbound traffic."},
{id:"u7l5-5",t:"u7l5",q:"An application automatically adds servers during peak hours and removes them at night, and the company pays only for what runs. Which cloud characteristic is this?",a:["Multitenancy","Elasticity","Data locality","Redundancy"],c:1,e:"Elasticity is automatic scaling up and down with demand. Scalability is the ability to grow; elasticity adds the automatic shrink."},
{id:"u7l5-6",t:"u7l5",q:"A company keeps its database on premises but runs its web front end in a public cloud, connected by a VPN. Which deployment model is this?",a:["Public","Private","Hybrid","Community"],c:2,e:"Hybrid cloud combines on-premises or private resources with public cloud services."},
{id:"u7l5-7",t:"u7l5",q:"Which term describes running routers, firewalls, and load balancers as software instances instead of dedicated hardware appliances?",a:["NFV","VPC","SDN","IaC"],c:0,e:"Network functions virtualization delivers network functions as virtual machines or containers."},
{id:"u7l5-8",t:"u7l5",q:"A company needs predictable bandwidth and latency to its cloud provider and is willing to pay for a dedicated circuit. Which connectivity option fits?",a:["Site-to-site VPN over the internet","Direct connect private link","Clientless VPN","Satellite"],c:1,e:"A direct connection is a dedicated private circuit to the provider with guaranteed performance, unlike a VPN over the public internet."},

// u7l6 Modern networking
{id:"u7l6-1",t:"u7l6",q:"Which security model assumes no user or device is trusted by default, even inside the network perimeter, and verifies every access request?",a:["Defense in depth","Zero trust","Screened subnet","Implicit trust"],c:1,e:"Zero trust means never trust, always verify, with policy-based authentication and least privilege for every request."},
{id:"u7l6-2",t:"u7l6",q:"In software-defined networking, which plane makes forwarding decisions and is centralized in a controller?",a:["Data plane","Control plane","Management plane","Physical plane"],c:1,e:"SDN separates the control plane, now in a controller, from the data plane that forwards packets on each device."},
{id:"u7l6-3",t:"u7l6",q:"A branch office uses a broadband connection and an LTE connection, and a central controller steers each application over the best path in real time. Which technology is this?",a:["MPLS","SD-WAN","VXLAN","BGP"],c:1,e:"SD-WAN is application aware and transport agnostic, using policy from a central controller to choose paths."},
{id:"u7l6-4",t:"u7l6",q:"Which technology encapsulates Layer 2 frames in UDP so a VLAN can extend across a routed network between data centers?",a:["802.1Q","VXLAN","GRE","LACP"],c:1,e:"VXLAN stretches Layer 2 over Layer 3 with a 24-bit identifier supporting about 16 million segments."},
{id:"u7l6-5",t:"u7l6",q:"A network team stores device configurations as templates in a version control system and uses automation to detect and correct devices whose running configuration has diverged. What is this practice?",a:["Infrastructure as code","Port mirroring","Change advisory board","Out-of-band management"],c:0,e:"Infrastructure as code manages configuration in files under source control, deploying automatically and correcting configuration drift."},
{id:"u7l6-6",t:"u7l6",q:"A new SD-WAN appliance shipped to a branch downloads its complete configuration automatically when connected, with no on-site technician. Which feature is this?",a:["Zero-touch provisioning","Split tunneling","Port security","Route summarization"],c:0,e:"Zero-touch provisioning lets devices self-configure from a central controller when first powered on."},
{id:"u7l6-7",t:"u7l6",q:"Which cloud-delivered service combines SD-WAN networking with security functions such as secure web gateway, firewall, and zero trust access for remote users and branches?",a:["SASE","VPC","NFV","IaC"],c:0,e:"Secure access service edge merges networking and security into one cloud service. SSE is the security portion without SD-WAN."},
{id:"u7l6-8",t:"u7l6",q:"In an SDN architecture, which interface do applications use to request services from the controller?",a:["Southbound API","Northbound API","Console port","Trunk port"],c:1,e:"Northbound APIs connect applications to the controller. Southbound APIs connect the controller to the network devices."},

// u7l7 Physical installations
{id:"u7l7-1",t:"u7l7",q:"Which location in a building houses the provider's demarcation point and the core network equipment, and connects to the smaller wiring closets on each floor?",a:["IDF","MDF","PDU","Patch panel"],c:1,e:"The main distribution frame is the primary wiring room with the demarc. IDFs are the per-floor closets that connect back to it."},
{id:"u7l7-2",t:"u7l7",q:"How tall is one rack unit?",a:["1 inch","1.75 inches","2.5 inches","4 inches"],c:1,e:"A rack unit, 1U, is 1.75 inches (44.45 mm). Equipment height is described in multiples of U."},
{id:"u7l7-3",t:"u7l7",q:"A server room's racks are arranged with all equipment fronts facing one aisle. What is the purpose of this layout?",a:["To simplify cable labeling","To create hot and cold aisles so intake and exhaust air do not mix","To reduce the number of PDUs required","To comply with plenum cable rules"],c:1,e:"Equipment draws cool air from the front and exhausts hot air to the rear. Hot and cold aisle containment keeps the two separate and improves cooling."},
{id:"u7l7-4",t:"u7l7",q:"Which device provides battery power to keep equipment running through a short outage and gives time for a clean shutdown or generator start?",a:["PDU","UPS","Surge protector","Inverter"],c:1,e:"An uninterruptible power supply bridges outages with battery power and conditions the incoming power."},
{id:"u7l7-5",t:"u7l7",q:"What is the recommended relative humidity range for a network equipment room?",a:["10 to 20 percent","40 to 60 percent","70 to 80 percent","90 to 100 percent"],c:1,e:"Around 40 to 60 percent balances the static discharge risk of dry air against the condensation risk of humid air."},
{id:"u7l7-6",t:"u7l7",q:"Horizontal cabling from wall jacks terminates in the wiring closet on which component, so that permanent cables are never re-terminated when connections change?",a:["PDU","Patch panel","UPS","Media converter"],c:1,e:"Patch panels terminate the permanent runs; short patch cords connect panel ports to switch ports and can be moved freely."},
{id:"u7l7-7",t:"u7l7",q:"A switch is installed in a rack where air flows from the cold aisle at the rear to the hot aisle at the front. Which switch airflow option should be selected?",a:["Port-side exhaust","Port-side intake","Side-to-side","Any; airflow does not matter for switches"],c:0,e:"If the switch ports face the hot aisle at the front, air must exit on the port side, so a port-side exhaust model matches the room's airflow."},
{id:"u7l7-8",t:"u7l7",q:"Which fire suppression approach is appropriate for a room full of network equipment?",a:["Water sprinklers only","A clean agent or inert gas system","Foam","No suppression is needed"],c:1,e:"Clean agent and gas systems extinguish fires without destroying electronics. Water is a last resort in equipment rooms."}
);

// NetPlus Academy question bank: network services (unit 5 lessons 3-5) and operations (unit 8 lessons 1-6).
window.FRA = window.FRA || {};
FRA.questions = FRA.questions || [];
FRA.questions.push(
// u5l3 DHCP
{id:"u5l3-1",t:"u5l3",q:"Clients on a remote subnet with no local DHCP server fail to obtain addresses. What should be configured on the router interface for that subnet?",a:["A DHCP reservation","A DHCP relay, also called an IP helper address","A DHCP exclusion","A DNS forwarder"],c:1,e:"DHCP Discover is a broadcast that routers do not forward. A relay converts it to a unicast to the central server."},
{id:"u5l3-2",t:"u5l3",q:"A network printer must always receive the same IP address but the administrator wants to keep managing addresses centrally. What should be configured?",a:["A static address on the printer only","A DHCP reservation for the printer's MAC address","A shorter lease time","A second scope"],c:1,e:"A reservation ties an address to a MAC so the device always gets the same lease while DHCP still manages it."},
{id:"u5l3-3",t:"u5l3",q:"Which is the correct order of the DHCP lease process?",a:["Discover, Offer, Request, Acknowledge","Request, Offer, Discover, Acknowledge","Offer, Discover, Acknowledge, Request","Discover, Request, Offer, Acknowledge"],c:0,e:"DORA: the client Discovers, the server Offers, the client Requests, the server Acknowledges."},
{id:"u5l3-4",t:"u5l3",q:"A server was manually assigned 192.168.1.150, which is inside the DHCP scope. Later a laptop receives the same address and both devices have intermittent connectivity. How should this be prevented?",a:["Shorten the lease time","Add an exclusion for 192.168.1.150 in the scope","Enable DHCP snooping","Add a DNS PTR record"],c:1,e:"An exclusion tells the server never to lease that address, preventing the duplicate."},
{id:"u5l3-5",t:"u5l3",q:"Which DHCP option delivers the default gateway to clients?",a:["Option 3","Option 6","Option 15","Option 66"],c:0,e:"Option 3 is the router (default gateway). Option 6 is DNS servers, 15 is domain name, and 66 is the TFTP server used for phone provisioning."},
{id:"u5l3-6",t:"u5l3",q:"At what point in the lease does a DHCP client normally try to renew?",a:["At 25 percent of the lease","At 50 percent of the lease","Only when the lease expires","Every 60 seconds"],c:1,e:"Clients attempt renewal with the original server at half the lease time, then broadcast for any server at 87.5 percent."},
{id:"u5l3-7",t:"u5l3",q:"Users on a floor receive addresses with a gateway that does not exist and lose connectivity. The DHCP server's log shows no leases for them. What is the MOST likely cause?",a:["Scope exhaustion","A rogue DHCP server on the segment","A missing DNS record","An STP loop"],c:1,e:"An unauthorized DHCP server answering first hands out incorrect settings. DHCP snooping on switches blocks it."},

// u5l4 DNS
{id:"u5l4-1",t:"u5l4",q:"Which DNS record type resolves an IP address back to a hostname?",a:["A","MX","PTR","TXT"],c:2,e:"PTR records live in the reverse zone and map addresses to names."},
{id:"u5l4-2",t:"u5l4",q:"A company changes its email provider. Which DNS record must be updated so mail is delivered to the new servers?",a:["A","CNAME","MX","NS"],c:2,e:"MX records specify the mail exchangers for a domain."},
{id:"u5l4-3",t:"u5l4",q:"Users can reach servers by IP address but not by hostname. What is the MOST likely cause?",a:["Incorrect default gateway","DNS misconfiguration","Duplicate MAC address","Spanning tree loop"],c:1,e:"If IP connectivity works but names do not resolve, name resolution is the failing service."},
{id:"u5l4-4",t:"u5l4",q:"Which record type makes www.example.com an alias for webserver01.example.com?",a:["A","AAAA","CNAME","SRV"],c:2,e:"A CNAME points one name to another name. A and AAAA point names to addresses."},
{id:"u5l4-5",t:"u5l4",q:"Which technology digitally signs DNS records so resolvers can verify they were not forged?",a:["DNS over HTTPS","DNSSEC","DNS over TLS","Dynamic DNS"],c:1,e:"DNSSEC provides integrity and authenticity through signatures. DoH and DoT encrypt the transport for privacy."},
{id:"u5l4-6",t:"u5l4",q:"A record type stores SPF and domain-verification strings. Which is it?",a:["TXT","SOA","NS","PTR"],c:0,e:"TXT records hold arbitrary text and are used for SPF, DKIM, DMARC, and ownership verification."},
{id:"u5l4-7",t:"u5l4",q:"A DNS server returns an answer from its cache rather than from the zone it hosts. How is that answer described?",a:["Authoritative","Non-authoritative","Recursive","Iterative"],c:1,e:"Only servers hosting the zone give authoritative answers. Cached answers from a resolver are non-authoritative."},
{id:"u5l4-8",t:"u5l4",q:"Which protocol encrypts DNS queries between a client and its resolver using TCP port 853?",a:["DNSSEC","DNS over TLS","DNS over HTTPS","LDAPS"],c:1,e:"DoT uses TCP 853. DoH uses HTTPS on 443. DNSSEC signs but does not encrypt."},
{id:"u5l4-9",t:"u5l4",q:"Which record type does an IPv6 host need to resolve a name to an IPv6 address?",a:["A","AAAA","PTR","MX"],c:1,e:"AAAA records map names to 128-bit IPv6 addresses."},

// u5l5 Time services
{id:"u5l5-1",t:"u5l5",q:"Users cannot log in to the domain after a switch's clock drifted 20 minutes from the domain controllers. Which service should be fixed?",a:["DNS","NTP","DHCP","SNMP"],c:1,e:"Kerberos authentication fails when clocks differ by more than about five minutes. NTP keeps them synchronized."},
{id:"u5l5-2",t:"u5l5",q:"A trading firm requires clock synchronization accurate to less than a microsecond. Which protocol is designed for this?",a:["NTP","PTP","NTS","SNTP"],c:1,e:"Precision Time Protocol uses hardware timestamps for sub-microsecond accuracy; NTP is millisecond-class."},
{id:"u5l5-3",t:"u5l5",q:"What does an NTP stratum 1 server synchronize to?",a:["Another stratum 1 server","A stratum 0 reference clock such as GPS or an atomic clock","The nearest stratum 2 server","A DHCP server"],c:1,e:"Stratum 0 is the reference clock itself. Stratum 1 servers are directly attached to one and stratum numbers increase with distance."},
{id:"u5l5-4",t:"u5l5",q:"Which protocol adds authentication and encryption to time synchronization so an attacker cannot feed false time to clients?",a:["PTP","NTS","DNSSEC","IPsec AH"],c:1,e:"Network Time Security protects NTP with authenticated, encrypted key exchange."},
{id:"u5l5-5",t:"u5l5",q:"Security analysts cannot correlate events across firewalls, switches, and servers because timestamps disagree. What is the underlying problem?",a:["Syslog is using the wrong port","Devices are not synchronized to a common NTP source","The SIEM has too little storage","SNMPv3 is not enabled"],c:1,e:"Log correlation depends on consistent time. All devices should sync to the same internal NTP hierarchy."},

// u8l1 Documentation
{id:"u8l1-1",t:"u8l1",q:"Which document shows how traffic flows between networks, including IP addressing, VLANs, and routing, rather than where devices physically sit?",a:["Physical network diagram","Logical network diagram","Rack diagram","Cable map"],c:1,e:"Logical diagrams depict addressing and data flow. Physical diagrams, rack diagrams, and cable maps show location and wiring."},
{id:"u8l1-2",t:"u8l1",q:"A technician must find which patch panel port connects to wall jack 3B-14 without tracing cables. Which document should exist for this?",a:["Logical diagram","Cable map","SLA","Heat map"],c:1,e:"A cable map or wiring diagram records jack-to-panel-to-switch-port connections."},
{id:"u8l1-3",t:"u8l1",q:"Which record is the authoritative source for every subnet and assigned address, preventing duplicates and overlaps?",a:["Asset inventory","IPAM","Rack diagram","Change log"],c:1,e:"IP address management tracks subnets, addresses, and assignments."},
{id:"u8l1-4",t:"u8l1",q:"An ISP contract promises 99.9 percent uptime and four-hour response to outages. What is this document called?",a:["MOU","NDA","SLA","AUP"],c:2,e:"A service level agreement defines guaranteed performance and the remedies if it is missed."},
{id:"u8l1-5",t:"u8l1",q:"Which diagram shows the front of each equipment cabinet with the rack unit position of every device?",a:["Layer 3 diagram","Rack diagram","Floor plan","Logical diagram"],c:1,e:"Rack diagrams document device placement by rack unit within each rack."},
{id:"u8l1-6",t:"u8l1",q:"Which inventory item helps a team decide when a switch must be replaced because the vendor will stop providing support?",a:["Its MAC address","Its warranty and support status","Its VLAN assignments","Its patch panel port"],c:1,e:"Asset inventories track warranty and support dates so end-of-support devices are refreshed before they become a risk."},
{id:"u8l1-7",t:"u8l1",q:"Which type of diagram would show switches, trunks, VLANs, and the spanning tree root?",a:["Layer 1 diagram","Layer 2 diagram","Layer 3 diagram","Rack diagram"],c:1,e:"Layer 2 diagrams cover switching topology. Layer 1 covers cabling and Layer 3 covers routing and subnets."},

// u8l2 Life cycle and change
{id:"u8l2-1",t:"u8l2",q:"A technician plans to upgrade firmware on a core switch. According to change management, what should happen FIRST?",a:["Perform the upgrade immediately to reduce risk exposure","Submit a change request with an impact assessment and rollback plan, then obtain approval","Notify users after the upgrade is complete","Disable logging so the change is not recorded"],c:1,e:"Change management requires a request, impact analysis, rollback plan, and approval before work begins in a scheduled window."},
{id:"u8l2-2",t:"u8l2",q:"A vendor announces that a firewall model will receive no further security patches. Which milestone has it reached?",a:["End of sale","End of life","End of support","Decommissioning"],c:2,e:"End of support means no more fixes or help. The device becomes a security liability and should be replaced."},
{id:"u8l2-3",t:"u8l2",q:"Which configuration is the approved standard build against which running configurations are compared to detect unauthorized changes?",a:["Production configuration","Backup configuration","Baseline or golden configuration","Startup configuration"],c:2,e:"The golden configuration is the reference standard. Deviations from it indicate drift or unauthorized changes."},
{id:"u8l2-4",t:"u8l2",q:"What should be done to a router immediately before applying an approved change?",a:["Erase its configuration","Save a backup of the current configuration","Disable its interfaces","Remove it from monitoring permanently"],c:1,e:"A backup taken before the change makes the rollback plan possible."},
{id:"u8l2-5",t:"u8l2",q:"A user requests a routine, pre-approved password reset for a network device account. Which process handles this?",a:["A full change advisory board review","A service request","An emergency change","A decommissioning procedure"],c:1,e:"Service requests cover low-risk, standard tasks that do not require the full change management review."},
{id:"u8l2-6",t:"u8l2",q:"When decommissioning a switch, which step protects the organization's information?",a:["Leave the configuration in place for the buyer","Wipe the configuration and any stored data, then update inventory","Remove only the power cord","Change its VLAN to 1"],c:1,e:"Decommissioning includes securely erasing configuration and data, updating documentation, and recovering licenses."},

// u8l3 Monitoring methods
{id:"u8l3-1",t:"u8l3",q:"An administrator wants to poll switches with SNMP and requires the traffic to be authenticated and encrypted. Which version must be used?",a:["SNMPv1","SNMPv2c","SNMPv3","SNMP over syslog"],c:2,e:"Versions 1 and 2c use plaintext community strings. Version 3 adds authentication and privacy."},
{id:"u8l3-2",t:"u8l3",q:"An administrator needs to see which hosts and applications consume the most WAN bandwidth without capturing every packet. Which method provides this?",a:["Syslog","Flow data such as NetFlow","Full packet capture","SNMP traps"],c:1,e:"Flow data summarizes conversations by source, destination, port, and volume. Packet capture records everything and syslog records events."},
{id:"u8l3-3",t:"u8l3",q:"In SNMP, what is an OID?",a:["The community string","The unique identifier of a variable in the MIB","The trap destination address","The polling interval"],c:1,e:"Object identifiers address individual variables in the management information base."},
{id:"u8l3-4",t:"u8l3",q:"A switch interface goes down and the switch immediately notifies the management station without being polled. What kind of message is this?",a:["SNMP Get","SNMP Set","SNMP trap","Syslog query"],c:2,e:"Traps are unsolicited notifications sent by the agent to the manager on UDP 162."},
{id:"u8l3-5",t:"u8l3",q:"A security team wants to collect logs from firewalls, servers, and switches in one place and receive alerts when patterns across them indicate an attack. Which system provides this?",a:["Protocol analyzer","SIEM","IPAM","NetFlow collector"],c:1,e:"A security information and event management system aggregates and correlates logs from many sources."},
{id:"u8l3-6",t:"u8l3",q:"Monitoring should alert when a link's utilization is unusual compared with its normal pattern for that time of day, not just when it crosses a fixed number. What must be established first?",a:["A default route","A baseline","A trap destination","A VLAN"],c:1,e:"A baseline captures normal behavior over time so deviations, or anomalies, can be detected."},
{id:"u8l3-7",t:"u8l3",q:"A technician needs to inspect the full contents of packets between a client and a server to debug an application. Which tool is appropriate?",a:["SNMP polling","Flow analyzer","Protocol analyzer with a mirror port or tap","Syslog server"],c:2,e:"Only a packet capture shows full payloads. Feed the analyzer from a SPAN port or a tap."},
{id:"u8l3-8",t:"u8l3",q:"Which syslog severity level indicates the most serious condition?",a:["7 Debug","4 Warning","0 Emergency","6 Informational"],c:2,e:"Syslog severities run from 0 (emergency) to 7 (debug); lower numbers are more severe."},

// u8l4 Monitoring solutions and metrics
{id:"u8l4-1",t:"u8l4",q:"A VoIP call has choppy, garbled audio. Monitoring shows packets arriving with widely varying delay between them. Which condition is this?",a:["Latency","Jitter","Packet loss","Bandwidth saturation"],c:1,e:"Jitter is variation in delay. Steady latency is tolerable for voice; variable delay is not."},
{id:"u8l4-2",t:"u8l4",q:"Which monitoring solution reports whether services are reachable and calculates uptime against the SLA?",a:["Configuration monitoring","Availability monitoring","Traffic analysis","Network discovery"],c:1,e:"Availability monitoring checks reachability and tracks uptime percentages."},
{id:"u8l4-3",t:"u8l4",q:"A link rated at 1 Gbps consistently carries 850 Mbps during business hours. Which metric describes this, and what does it indicate?",a:["Latency; the link is slow","Utilization; the link is approaching congestion","Jitter; the link is unstable","MTBF; the link will fail soon"],c:1,e:"Utilization is throughput divided by capacity. Sustained utilization above roughly 70 to 80 percent signals imminent congestion."},
{id:"u8l4-4",t:"u8l4",q:"Which tool automatically finds devices on the network and how they interconnect, using SNMP, LLDP, and ping sweeps?",a:["Network discovery","Availability monitoring","Log aggregation","IPAM"],c:0,e:"Network discovery maps the devices and topology, either ad hoc or on a schedule."},
{id:"u8l4-5",t:"u8l4",q:"A file transfer to a remote site is slow even though the link has plenty of free bandwidth. Round-trip time is 300 ms. Which metric is limiting performance?",a:["Utilization","Latency","Jitter","Packet loss"],c:1,e:"High latency limits TCP throughput regardless of available bandwidth because acknowledgments take longer to return."},
{id:"u8l4-6",t:"u8l4",q:"Which monitoring type alerts when a device's running configuration differs from its approved baseline?",a:["Performance monitoring","Configuration monitoring","Traffic analysis","Availability monitoring"],c:1,e:"Configuration monitoring watches for changes and compliance against the golden configuration."},

// u8l5 DR and HA
{id:"u8l5-1",t:"u8l5",q:"A company decides it can afford to lose at most one hour of data if a disaster strikes. Which metric does this define?",a:["RTO","RPO","MTTR","MTBF"],c:1,e:"Recovery point objective is the maximum acceptable data loss measured in time. RTO is the time to restore service."},
{id:"u8l5-2",t:"u8l5",q:"Which type of recovery site has power, cooling, and networking equipment in place, but data must be restored and systems started before it can take over?",a:["Hot site","Warm site","Cold site","Cloud site"],c:1,e:"A warm site has infrastructure but not current data. A hot site runs continuously; a cold site is empty space."},
{id:"u8l5-3",t:"u8l5",q:"Which recovery site is the cheapest to maintain and the slowest to bring online?",a:["Hot site","Warm site","Cold site","Active-active site"],c:2,e:"A cold site provides only space, power, and cooling with no equipment or data, so recovery takes days or weeks."},
{id:"u8l5-4",t:"u8l5",q:"A pair of firewalls both pass traffic simultaneously and share the load; if one fails, the other carries everything. Which configuration is this?",a:["Active-passive","Active-active","Cold standby","Warm site"],c:1,e:"Active-active means all nodes serve traffic at once. Active-passive keeps a standby idle until failover."},
{id:"u8l5-5",t:"u8l5",q:"The disaster recovery team meets in a conference room and talks through how they would respond to a data center fire, without touching any systems. What is this exercise called?",a:["Validation test","Tabletop exercise","Failover test","Penetration test"],c:1,e:"A tabletop exercise walks through the plan verbally to find gaps. A validation test actually performs the recovery."},
{id:"u8l5-6",t:"u8l5",q:"A business requires that its ordering system be back online within two hours of any failure. Which metric is this?",a:["RPO","RTO","MTBF","SLA"],c:1,e:"Recovery time objective is the maximum time a service may be down."},
{id:"u8l5-7",t:"u8l5",q:"Which metric would a planner use to estimate how often a component is expected to fail and how many spares to stock?",a:["MTTR","MTBF","RPO","RTO"],c:1,e:"Mean time between failures is the expected operating time between failures of a component."},
{id:"u8l5-8",t:"u8l5",q:"Which server feature combines two network adapters so that if one link fails the server stays connected?",a:["Multipathing","NIC teaming","Load balancing","Port mirroring"],c:1,e:"NIC teaming bonds adapters for redundancy and sometimes bandwidth. Multipathing does the equivalent for storage paths."},

// u8l6 Remote access and management
{id:"u8l6-1",t:"u8l6",q:"A company requires administrators to reach network devices even if the production network is completely down. Which management approach provides this?",a:["In-band management over SSH","Out-of-band management using console servers or a dedicated management network","A client-to-site VPN","A web GUI over HTTPS"],c:1,e:"Out-of-band management uses a separate path that does not depend on the production network."},
{id:"u8l6-2",t:"u8l6",q:"Remote employees connect to the corporate network using VPN software on their laptops. Which VPN type is this?",a:["Site-to-site","Client-to-site","Clientless","Full mesh"],c:1,e:"Client-to-site, or remote access VPN, connects individual users through client software."},
{id:"u8l6-3",t:"u8l6",q:"With a particular VPN configuration, only traffic destined for corporate subnets goes through the tunnel while web browsing goes directly to the internet. What is this called?",a:["Full tunnel","Split tunnel","Clientless VPN","Site-to-site"],c:1,e:"Split tunneling sends only corporate traffic through the VPN. It saves bandwidth but bypasses corporate inspection for other traffic."},
{id:"u8l6-4",t:"u8l6",q:"Administrators must first connect to a single hardened server and from there open sessions to internal devices. What is this server called?",a:["Proxy server","Jump box","Load balancer","Root bridge"],c:1,e:"A jump box or bastion host funnels administrative access through one monitored, hardened point."},
