<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Self-paced CompTIA Network+ N10-009 course with adaptive training and practice exams.">
<title>NetPlus Academy</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* NetPlus Academy design tokens and components */
:root {
  --bg: #F3F5F8;
  --surface: #FFFFFF;
  --surface-2: #E9EDF2;
  --ink: #14212E;
  --ink-2: #4A5A6B;
  --muted: #7C8A99;
  --line: #D5DCE4;
  --accent: #C25E1F;
  --accent-ink: #FFFFFF;
  --accent-soft: #F8E7DC;
  --good: #1E8E5A;
  --good-soft: #E1F3EA;
  --warn: #B58A1B;
  --warn-soft: #F7EED3;
  --bad: #C8322B;
  --bad-soft: #F9E2E0;
  --led-off: #C9D1DA;
  --focus: #2F6FBF;
  --shadow: 0 1px 2px rgba(20,33,46,.06), 0 8px 24px rgba(20,33,46,.06);
  --font-display: "Archivo", "Segoe UI", system-ui, sans-serif;
  --font-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --radius: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F161E; --surface: #17212B; --surface-2: #1F2B37; --ink: #E6ECF2; --ink-2: #A7B4C2; --muted: #7E8C9B;
    --line: #2C3947; --accent: #E08744; --accent-ink: #14212E; --accent-soft: #3A2418; --good: #3DBB7F; --good-soft: #16332A;
    --warn: #D9AC3A; --warn-soft: #3A3016; --bad: #E5605A; --bad-soft: #3D1C1B; --led-off: #33414F; --focus: #7FB0F5;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F161E; --surface: #17212B; --surface-2: #1F2B37; --ink: #E6ECF2; --ink-2: #A7B4C2; --muted: #7E8C9B;
  --line: #2C3947; --accent: #E08744; --accent-ink: #14212E; --accent-soft: #3A2418; --good: #3DBB7F; --good-soft: #16332A;
  --warn: #D9AC3A; --warn-soft: #3A3016; --bad: #E5605A; --bad-soft: #3D1C1B; --led-off: #33414F; --focus: #7FB0F5;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.3); color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 17px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4 { font-family: var(--font-display); font-weight: 600; line-height: 1.2; margin: 0; text-wrap: balance; color: var(--ink); }
h1 { font-size: 1.9rem; letter-spacing: -0.01em; }
h2 { font-size: 1.45rem; }
h3 { font-size: 1.12rem; }
p { margin: 0; }
a { color: var(--accent); }
code, .mono { font-family: var(--font-mono); font-size: 0.92em; }
code { background: var(--surface-2); padding: 0.08em 0.4em; border-radius: 5px; color: var(--ink); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.muted { color: var(--muted); }
.ink2 { color: var(--ink-2); }
.eyebrow { font-family: var(--font-display); font-size: 0.72rem; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); }
.tnum { font-variant-numeric: tabular-nums; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.spread { justify-content: space-between; }
.hidden { display: none !important; }

/* Shell */
.shell { display: grid; grid-template-columns: 290px minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); min-height: 100vh; }
.topbar { grid-column: 1 / -1; display: flex; align-items: center; gap: 18px; padding: 10px 20px; background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; letter-spacing: -0.01em; text-decoration: none; color: var(--ink); background: none; border: 0; padding: 0; }
.brand .mark { width: 28px; height: 28px; border-radius: 7px; background: var(--ink); color: var(--bg); display: grid; place-items: center; font-family: var(--font-mono); font-size: 0.8rem; font-weight: 500; }
.nav { display: flex; gap: 4px; margin-left: 8px; }
.nav button { background: none; border: 0; padding: 8px 12px; border-radius: 8px; font-family: var(--font-display); font-weight: 500; font-size: 0.92rem; color: var(--ink-2); }
.nav button:hover { background: var(--surface-2); color: var(--ink); }
.nav button[aria-current="page"] { background: var(--accent-soft); color: var(--ink); }
.nav a { display: inline-flex; align-items: center; padding: 8px 12px; border-radius: 8px; font-family: var(--font-display); font-weight: 500; font-size: 0.92rem; color: var(--muted); text-decoration: none; }
.nav a:hover { background: var(--surface-2); color: var(--ink); }
.readiness { margin-left: auto; display: flex; align-items: center; gap: 10px; min-width: 200px; }
.readiness .eyebrow { white-space: nowrap; }
.rail-toggle { display: none; background: none; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }

.rail { background: var(--surface); border-right: 1px solid var(--line); padding: 18px 14px 40px; overflow-y: auto; position: sticky; top: 57px; height: calc(100vh - 57px); }
.unit { margin-bottom: 8px; }
.unit-head { width: 100%; display: flex; align-items: center; gap: 10px; text-align: left; background: none; border: 0; padding: 8px 8px; border-radius: 8px; }
.unit-head:hover { background: var(--surface-2); }
.unit-num { font-family: var(--font-mono); font-size: 0.78rem; color: var(--muted); width: 22px; }
.unit-title { font-family: var(--font-display); font-weight: 600; font-size: 0.95rem; flex: 1; }
.unit-meta { font-size: 0.78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.unit.skipped .unit-title { color: var(--ink-2); }
.lesson-list { list-style: none; margin: 2px 0 0; padding: 0 0 0 10px; border-left: 2px solid var(--line); margin-left: 18px; }
.lesson-link { width: 100%; display: flex; align-items: center; gap: 10px; text-align: left; background: none; border: 0; padding: 7px 8px; border-radius: 8px; font-size: 0.92rem; color: var(--ink-2); }
.lesson-link:hover { background: var(--surface-2); color: var(--ink); }
.lesson-link[aria-current="page"] { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
.led { width: 10px; height: 10px; border-radius: 50%; background: var(--led-off); flex: none; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); }
.led.green { background: var(--good); box-shadow: 0 0 0 3px var(--good-soft); }
.led.amber { background: var(--warn); box-shadow: 0 0 0 3px var(--warn-soft); }
.led.lg { width: 14px; height: 14px; }

.main { padding: 28px 32px 80px; min-width: 0; }
.content { max-width: 760px; margin: 0 auto; }
.wide { max-width: 1080px; margin: 0 auto; }

/* Cards and buttons */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px 24px; }
.card.lift { box-shadow: var(--shadow); }
.card.soft { background: var(--surface-2); border-color: transparent; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 10px 16px; border-radius: 9px; font-family: var(--font-display); font-weight: 600; font-size: 0.95rem; text-decoration: none; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(0.95); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--surface-2); color: var(--ink); }
.btn.danger { color: var(--bad); border-color: var(--bad); background: transparent; }
.btn.small { padding: 6px 11px; font-size: 0.85rem; }
.btn.lg { padding: 13px 22px; font-size: 1.05rem; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-family: var(--font-display); font-size: 0.75rem; font-weight: 600; letter-spacing: 0.02em; background: var(--surface-2); color: var(--ink-2); }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.accent { background: var(--accent-soft); color: var(--accent); }
.pill.dN { background: var(--surface-2); }

/* Meters and bars */
.meter { height: 8px; background: var(--surface-2); border-radius: 999px; overflow: hidden; flex: 1; }
.meter > i { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .4s ease; }
.meter.good > i { background: var(--good); }
.bars { display: grid; gap: 10px; }
.bar-row { display: grid; grid-template-columns: 150px 1fr 64px; align-items: center; gap: 12px; font-size: 0.95rem; }
.bar-row .label { color: var(--ink-2); }
.bar-row .value { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink); font-family: var(--font-display); font-weight: 600; }
.bar-row .track { height: 10px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.bar-row .track > i { display: block; height: 100%; background: var(--accent); border-radius: 4px 0 0 4px; }
.bar-row .track > i.dim { background: var(--led-off); }

/* Stats */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.stat .big { font-family: var(--font-display); font-weight: 700; font-size: 1.7rem; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.stat .big small { font-size: 0.95rem; font-weight: 500; color: var(--muted); }

/* Onboarding levels */
.levels { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
.level-card { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 6px; min-height: 150px; transition: transform .12s ease, border-color .12s ease; }
.level-card:hover { border-color: var(--accent); transform: translateY(-2px); }
.level-card .level-num { font-family: var(--font-display); font-weight: 700; font-size: 1.6rem; color: var(--accent); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.level-card .level-title { font-family: var(--font-display); font-weight: 600; font-size: 1rem; }
.level-card .level-desc { font-size: 0.9rem; color: var(--ink-2); }
.level-card.final { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.level-card.final .level-title, .level-card.final .level-desc { color: var(--bg); }
.level-card.final .level-num { color: var(--accent); }

/* Lesson body */
.lesson-head { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }
.lesson-body { font-size: 1.05rem; }
.lesson-body h3 { margin: 26px 0 8px; font-size: 1.05rem; color: var(--ink); }
.lesson-body p { margin: 0 0 12px; }
.lesson-body ul { margin: 0 0 12px; padding-left: 22px; }
.lesson-body li { margin: 4px 0; }
.lesson-body .tip { margin: 18px 0 12px; padding: 12px 16px; border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 0 8px 8px 0; color: var(--ink); }
.hook { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; background: var(--surface-2); border-radius: var(--radius); }
.hook .eyebrow { color: var(--accent); padding-top: 3px; white-space: nowrap; }
details.lesson-fold summary { cursor: pointer; font-family: var(--font-display); font-weight: 600; color: var(--ink-2); padding: 6px 0; }

/* Quiz */
.quiz { display: flex; flex-direction: column; gap: 16px; }
.q-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.q-stem { font-size: 1.12rem; line-height: 1.5; }
.options { display: grid; gap: 8px; }
.option { display: flex; align-items: flex-start; gap: 12px; text-align: left; width: 100%; background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; padding: 12px 14px; font-size: 1rem; line-height: 1.4; transition: border-color .1s ease, background .1s ease; }
.option:hover:not(:disabled) { border-color: var(--ink-2); }
.option .key { flex: none; width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 0.8rem; background: var(--surface-2); color: var(--ink-2); }
.option[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.option[aria-pressed="true"] .key { background: var(--accent); color: var(--accent-ink); }
.option.correct { border-color: var(--good); background: var(--good-soft); }
.option.correct .key { background: var(--good); color: #fff; }
.option.wrong { border-color: var(--bad); background: var(--bad-soft); }
.option.wrong .key { background: var(--bad); color: #fff; }
.option:disabled { cursor: default; }
.confidence { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.confidence .eyebrow { margin-right: 4px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 0.88rem; font-family: var(--font-display); font-weight: 500; color: var(--ink-2); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip .k { font-family: var(--font-mono); font-size: 0.75rem; opacity: 0.7; margin-right: 4px; }
.feedback { border-radius: var(--radius); padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; border: 1px solid transparent; }
.feedback.good { background: var(--good-soft); border-color: var(--good); }
.feedback.bad { background: var(--bad-soft); border-color: var(--bad); }
.feedback .verdict { font-family: var(--font-display); font-weight: 700; }
.feedback.good .verdict { color: var(--good); }
.feedback.bad .verdict { color: var(--bad); }
.dots { display: flex; gap: 5px; flex-wrap: wrap; }
.dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--led-off); }
.dots i.good { background: var(--good); }
.dots i.bad { background: var(--bad); }
.dots i.cur { background: var(--accent); }

/* Exam */
.exam-head { display: flex; align-items: center; gap: 16px; padding: 12px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 16px; position: sticky; top: 66px; z-index: 5; }
.timer { font-family: var(--font-mono); font-size: 1.05rem; font-variant-numeric: tabular-nums; }
.timer.low { color: var(--bad); }
.score-hero { display: grid; grid-template-columns: auto 1fr; gap: 22px; align-items: center; }
.score-ring { width: 128px; height: 128px; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(var(--ring-color) calc(var(--pct) * 1%), var(--surface-2) 0); }
.score-ring > div { width: 98px; height: 98px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 1.7rem; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.review-item { border-top: 1px solid var(--line); padding: 14px 0; }
.review-item .stem { font-weight: 600; }
.review-item .ans { font-size: 0.95rem; margin-top: 4px; }
table.plain { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
table.plain th { text-align: left; font-family: var(--font-display); font-size: 0.78rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line); }
table.plain td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.table-wrap { overflow-x: auto; }
textarea.io { width: 100%; min-height: 120px; font-family: var(--font-mono); font-size: 0.8rem; background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 10px; resize: vertical; }
.toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-family: var(--font-display); font-weight: 600; font-size: 0.9rem; z-index: 50; box-shadow: var(--shadow); }
.ready-banner { background: var(--good-soft); border: 1px solid var(--good); border-radius: var(--radius); padding: 18px 20px; }
.kbd-hint { font-size: 0.82rem; color: var(--muted); }
.kbd-hint kbd { font-family: var(--font-mono); background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; font-size: 0.78rem; }
.topic-list { display: grid; gap: 8px; }
.topic-item { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 10px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.topic-item .t-title { font-weight: 600; }
.topic-item .t-sub { font-size: 0.85rem; color: var(--muted); }

@media (max-width: 900px) {
  .shell { grid-template-columns: 1fr; }
  .rail { position: fixed; left: 0; top: 57px; bottom: 0; width: min(320px, 86vw); transform: translateX(-102%); transition: transform .2s ease; z-index: 30; box-shadow: var(--shadow); height: auto; }
  .rail.open { transform: translateX(0); }
  .rail-toggle { display: inline-flex; }
  .main { padding: 18px 16px 90px; }
  .nav { display: none; }
  .readiness { min-width: 0; }
  .readiness .eyebrow { display: none; }
  .topbar { gap: 10px; padding: 10px 12px; }
  .bar-row { grid-template-columns: 110px 1fr 54px; }
  .score-hero { grid-template-columns: 1fr; justify-items: center; text-align: center; }
  .exam-head { position: static; }
  .mobile-nav { display: flex; position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-top: 1px solid var(--line); z-index: 25; }
  .mobile-nav button { flex: 1; background: none; border: 0; padding: 10px 4px 12px; font-family: var(--font-display); font-size: 0.75rem; font-weight: 600; color: var(--ink-2); }
  .mobile-nav button[aria-current="page"] { color: var(--accent); }
}
@media (min-width: 901px) { .mobile-nav { display: none; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }

/* Personalization callouts, plan markers, stage strip */
.callout { border-radius: var(--radius); padding: 14px 16px; border: 1px solid var(--line); border-left-width: 4px; background: var(--surface); display: flex; flex-direction: column; gap: 6px; }
.callout.bad { border-left-color: var(--bad); background: var(--bad-soft); }
.callout.warn { border-left-color: var(--warn); background: var(--warn-soft); }
.callout .stem { font-weight: 600; }
.callout .ans { font-size: 0.95rem; }
.lesson-link .inplan { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none; }
.stage-strip { display: flex; gap: 6px; flex-wrap: wrap; }
.stage { display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-family: var(--font-display); font-size: 0.82rem; font-weight: 600; color: var(--muted); }
.stage.done { color: var(--ink-2); }
.stage.cur { color: var(--ink); border-color: var(--accent); background: var(--accent-soft); }

/* Cheat sheet */
.cs h1 { font-size: 1.7rem; }
.cs-toc { display: flex; flex-wrap: wrap; gap: 6px; }
.cs-toc a { font-family: var(--font-display); font-size: 0.82rem; font-weight: 600; text-decoration: none; color: var(--ink-2); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 5px 11px; }
.cs-toc a:hover { border-color: var(--accent); color: var(--ink); }
.cs-section { margin-top: 10px; scroll-margin-top: 70px; }
.cs-section h2 { display: flex; align-items: center; gap: 10px; padding-bottom: 6px; border-bottom: 2px solid var(--ink); margin-bottom: 12px; font-size: 1.25rem; }
.cs-num { font-family: var(--font-mono); font-size: 0.8rem; font-weight: 500; color: var(--accent); }
.cs-section h3 { font-size: 0.95rem; margin: 14px 0 6px; color: var(--ink-2); }
.cs-table { width: 100%; border-collapse: collapse; font-size: 0.92rem; margin: 6px 0 14px; }
.cs-table th { text-align: left; font-family: var(--font-display); font-size: 0.74rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); padding: 6px 8px; border-bottom: 1px solid var(--ink); }
.cs-table td { padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.cs-table td:first-child { font-weight: 600; }
.cs-list ul { margin: 0 0 12px; padding-left: 20px; }
.cs-list li { margin: 3px 0; font-size: 0.95rem; break-inside: avoid; }
.cs-list.two ul { columns: 2; column-gap: 28px; }
.print-only { display: none; }
.callout.accent { border-left-color: var(--accent); background: var(--accent-soft); }
@media (max-width: 700px) { .cs-list.two ul { columns: 1; } }

/* Deeper explanations */
.deep-cta { padding: 4px 0; }
.deep { border-left: 4px solid var(--accent); }
.lesson-body ol { margin: 0 0 12px; padding-left: 24px; }
.lesson-body ol li { margin: 5px 0; }
.lesson-body pre { margin: 10px 0 14px; padding: 12px 14px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; overflow-x: auto; font-family: var(--font-mono); font-size: 0.84rem; line-height: 1.45; color: var(--ink); white-space: pre; }
.deep-body h3:first-child { margin-top: 4px; }

/* Feedback */
.fb-btn { font-size: 0.8rem; padding: 4px 8px; color: var(--muted); white-space: nowrap; }
.fb-btn:hover { color: var(--ink); }
.modal-back { position: fixed; inset: 0; background: rgba(20,33,46,0.45); z-index: 60; display: grid; place-items: center; padding: 16px; }
.modal { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px 24px; width: min(560px, 100%); box-shadow: var(--shadow); max-height: 90vh; overflow-y: auto; }
.field { display: flex; flex-direction: column; gap: 6px; font-family: var(--font-display); font-weight: 600; font-size: 0.85rem; color: var(--ink-2); }
.field select, .field textarea { font: inherit; font-family: var(--font-body); font-weight: 400; font-size: 1rem; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; width: 100%; }
.field textarea { resize: vertical; min-height: 96px; }
@media (max-width: 900px) { .mobile-nav button { padding: 10px 2px 12px; font-size: 0.7rem; } }

/* Print: only the page content, light colors, compact tables */
@media print {
  @page { margin: 12mm; }
  :root, :root[data-theme="dark"] { --bg: #fff; --surface: #fff; --surface-2: #f1f1f1; --ink: #000; --ink-2: #222; --muted: #555; --line: #bbb; --accent: #000; --accent-soft: #eee; --shadow: none; color-scheme: light; }
  html, body { background: #fff !important; color: #000; font-size: 10.5pt; }
  .topbar, .rail, .mobile-nav, .no-print, .toast, .modal-back { display: none !important; }
  .shell { display: block; min-height: 0; }
  .main { padding: 0; }
  .wide, .content { max-width: none; }
  .table-wrap { overflow: visible; }
  .print-only { display: block; }
  .cs-print-head h1 { font-size: 16pt; }
  .cs-print-head p { font-size: 9.5pt; color: #333; margin: 4pt 0 10pt; }
  .cs-section { margin-top: 12pt; }
  .cs-section h2 { font-size: 12.5pt; border-bottom: 1.5pt solid #000; break-after: avoid; margin-bottom: 6pt; }
  .cs-section h3 { font-size: 10pt; margin: 8pt 0 3pt; break-after: avoid; }
  .cs-table { font-size: 8.8pt; margin: 3pt 0 8pt; }
  .cs-table th { font-size: 7pt; padding: 2pt 4pt; }
  .cs-table td { padding: 2.5pt 4pt; }
  .cs-table thead { display: table-header-group; }
  .cs-table tr { break-inside: avoid; }
  .cs-list li { font-size: 9.2pt; margin: 1.5pt 0; }
  .cs-list ul { margin-bottom: 6pt; }
  .cs-list.two ul { columns: 2; column-gap: 20pt; }
  .tip { border-left: 2pt solid #000; background: none; padding: 3pt 8pt; margin: 6pt 0; font-size: 9.2pt; break-inside: avoid; }
  a { color: inherit; text-decoration: none; }
}

  assumes: "Nothing. Start here if you are new to networking.",
  lessons: [
    {
      id: "u1l1", title: "Networks and Their Types", domain: 1, obj: "1.6", minutes: 6,
      body: `A network is two or more devices that can exchange data. Everything on the exam builds on a few ways of describing networks: by how far they reach and by who is in charge.

## Networks by reach
- **LAN** (local area network): one building or campus, high speed, owned by one organization.
- **WLAN**: a LAN delivered over Wi-Fi.
- **WAN** (wide area network): connects LANs across cities or countries, usually over links leased from a provider. The internet is the largest WAN.
- **MAN**: a metro-sized network, bigger than a LAN, smaller than a WAN.
- **PAN**: a personal-scale network such as Bluetooth between a phone and headphones.
- **SAN**: a storage area network that gives servers block-level access to disk arrays, separate from the user network.

## Networks by control
- **Client-server**: dedicated servers hold resources and enforce access. Scales well and is what you will see in business.
- **Peer-to-peer**: every host shares and consumes directly. Cheap, but every device manages its own security, so it does not scale.

> Exam tip: when a question describes centralized authentication, file storage, or "one place to manage users," the answer involves a client-server design.`,
      hook: "Reach: PAN < LAN < MAN < WAN. Control: client-server centralizes, peer-to-peer distributes."
    },
    {
      id: "u1l2", title: "Physical and Logical Topologies", domain: 1, obj: "1.6", minutes: 8,
      body: `A topology is the shape of a network. The **physical** topology is how cables actually run. The **logical** topology is how data flows. They can differ: a modern office is a physical star wired to a switch, and it behaves logically like a star too, but old Token Ring was a physical star with a logical ring.

## The shapes you must recognize
- **Star** (also called **hub and spoke**): every device connects to one central device. Easy to add or remove hosts and one cable fault affects one host, but the center is a single point of failure. This is the standard LAN design.
- **Mesh**: devices interconnect with each other. **Full mesh** links every pair, which gives maximum redundancy but the link count explodes: n(n-1)/2 links for n devices, so 6 devices need 15 links. **Partial mesh** links only the important pairs. WAN cores and wireless mesh systems use partial mesh.
- **Point-to-point**: one direct link between two endpoints, such as a leased line between two offices or a wireless bridge between buildings.
- **Point-to-multipoint**: one central endpoint talks to many, such as a wireless access point serving clients.
- **Ring**: each device connects to two neighbors. A single break can stop the ring unless a second counter-rotating ring exists.
- **Bus**: one shared cable with terminators at each end. A single break kills everyone. Legacy only.
- **Hybrid**: any combination, which describes almost every real network.

> Exam tip: "the most fault tolerant" means full mesh. "The easiest to troubleshoot and expand" means star. "A single cable break brings down the whole segment" means bus or a single ring.`,
      hook: "Star = one center; mesh = redundancy with n(n-1)/2 links; bus and ring die from one break."
    },
    {
      id: "u1l3", title: "Enterprise Architectures and Traffic Flow", domain: 1, obj: "1.6", minutes: 8,
      body: `Large networks are organized in layers so that each layer has one job.

## The three-tier hierarchy
- **Access layer**: where end devices plug in. Access switches provide ports, PoE, and VLAN assignment.
- **Distribution layer**: aggregates access switches, applies policy such as ACLs and QoS, and routes between VLANs.
- **Core layer**: a fast, simple backbone that moves traffic between distribution blocks. No policy, just speed.

## Collapsed core
Small and medium networks merge the core and distribution layers into one pair of devices. Cheaper and simpler, at the cost of scalability.

## Spine and leaf
Data centers use a two-tier fabric. Every **leaf** switch (where servers connect) links to every **spine** switch, and leaves never connect to leaves. Any server can reach any other in exactly two hops, so bandwidth is predictable and the fabric grows by adding spines or leaves. It is built for traffic that moves sideways between servers.

## Traffic flows
- **North-south**: traffic entering or leaving the data center, for example a user reaching a web server. It crosses the perimeter and the firewall.
- **East-west**: traffic between servers inside the data center, for example a web server querying a database. In modern applications most traffic is east-west, which is why spine and leaf exists.

> Exam tip: "every access switch connects to every upper switch and same-tier switches never connect" is the textbook description of spine and leaf.`,
      hook: "Access plugs in, distribution decides, core moves. Spine-leaf: two hops, built for east-west."
    }
  ]
});

FRA.units.push({
  id: "u2", n: 2, title: "The OSI Model", domain: 1,
  blurb: "The seven-layer map the exam uses to describe every protocol, device, and problem.",
  assumes: "You know what a LAN, a WAN, and a switch are.",
  lessons: [
    {
      id: "u2l1", title: "Layers 1 to 3: Physical, Data Link, Network", domain: 1, obj: "1.1", minutes: 8,
      body: `The OSI model is a seven-layer description of how data moves from an application on one host to an application on another. The exam uses it as a common language: a "Layer 2 problem" is a switching or MAC address problem, a "Layer 3 device" is a router. Learn the lower three layers first because most hands-on troubleshooting lives there.

## Layer 1, Physical
Bits on a wire, fiber, or radio. Cables, connectors, hubs, repeaters, transceivers, voltage levels, and radio frequencies. The unit of data is the **bit**. Problems here: bad cable, wrong connector, no link light, interference.

## Layer 2, Data Link
Moves **frames** between devices on the same network segment using **MAC addresses**. Switches and network cards live here, as do Ethernet and Wi-Fi (802.11) framing. It has two sublayers: **MAC** (addressing and media access, such as CSMA/CD) and **LLC** (identifies which upper protocol is inside). Error detection with the frame check sequence happens here. Problems: MAC table issues, VLAN mismatches, spanning tree loops, duplex mismatches.

## Layer 3, Network
Moves **packets** between different networks using logical addresses, meaning **IP addresses**. Routers and Layer 3 switches operate here. IP, ICMP (used by ping), and routing protocols are Layer 3. Problems: wrong default gateway, wrong subnet mask, missing route.

> Exam tip: a MAC address is rewritten at every router hop; an IP address stays the same end to end. If a question says "hardware address" or "frame," think Layer 2. If it says "logical address," "packet," or "routing," think Layer 3.`,
      hook: "1 bits and cables, 2 frames and MACs (switch), 3 packets and IPs (router)."
    },
    {
      id: "u2l2", title: "Layers 4 to 7: Transport to Application", domain: 1, obj: "1.1", minutes: 8,
      body: `The upper layers turn a stream of packets into something an application can use.

## Layer 4, Transport
End-to-end delivery between processes, identified by **port numbers**. **TCP** provides reliable, ordered delivery with acknowledgments, the three-way handshake (SYN, SYN-ACK, ACK), flow control, and retransmission. **UDP** is connectionless and fast with no delivery guarantee. The unit is the **segment** (TCP) or **datagram** (UDP). Firewalls that filter by port are working at Layer 4.

## Layer 5, Session
Sets up, maintains, and tears down conversations between applications. Think of the "dialog control" between two hosts, such as keeping several streams of a video call in step. Exam questions rarely go deep here.

## Layer 6, Presentation
Formats data so both sides understand it: character encoding, compression, and **encryption**. When a question mentions TLS encryption, JPEG or MPEG formats, or ASCII versus Unicode, the answer is Presentation.

## Layer 7, Application
The interface between the network and the software people use. HTTP, HTTPS, SMTP, DNS, DHCP, FTP, SSH, SNMP, and Telnet are all Application layer protocols. A **proxy** or a **web application firewall** inspects traffic at this layer.

## Mnemonics
Bottom up: Please Do Not Throw Sausage Pizza Away. Top down: All People Seem To Need Data Processing.

> Exam tip: "port number" always points to Layer 4. "Encryption, compression, or formatting" points to Layer 6. A named protocol a user runs, such as HTTP or SMTP, is Layer 7.`,
      hook: "4 ports and segments, 5 sessions, 6 formatting and encryption, 7 the protocols users touch."
    },
    {
      id: "u2l3", title: "Encapsulation, PDUs, and the TCP/IP Model", domain: 1, obj: "1.1", minutes: 7,
      body: `Data does not travel as one blob. Each layer wraps the data from the layer above in its own header. That wrapping is **encapsulation**; unwrapping at the receiver is **decapsulation**.

## Protocol data units, top to bottom
- Layers 7 to 5: **data**
- Layer 4: **segment** (TCP) or **datagram** (UDP), header adds source and destination **ports**
- Layer 3: **packet**, header adds source and destination **IP addresses** and a **TTL** (time to live) that drops by one at each router
- Layer 2: **frame**, header adds source and destination **MAC addresses**, trailer adds the frame check sequence
- Layer 1: **bits**

## Sizes that matter
The **MTU** (maximum transmission unit) is the largest payload a frame can carry, 1500 bytes on standard Ethernet. Packets bigger than the MTU are fragmented or dropped. **Jumbo frames** raise the MTU to about 9000 bytes on links that support it, which helps storage and backup traffic.

## The TCP/IP model
The four-layer TCP/IP model is what the protocols were actually built on: **Application** (OSI 5 to 7), **Transport** (OSI 4), **Internet** (OSI 3), and **Network Access** or Link (OSI 1 and 2). Questions may use either model, so be able to translate.

> Exam tip: when reading a packet capture, the outermost header is the frame (MACs), then the IP header (addresses, TTL), then the TCP or UDP header (ports), then the application payload. That order is encapsulation in reverse.`,
      hook: "Data, segment, packet, frame, bits. Ports at 4, IPs at 3, MACs at 2. MTU 1500, jumbo 9000."
    }
  ]
});

FRA.units.push({
  id: "u3", n: 3, title: "Media, Connectors, and Ethernet", domain: 1,
  blurb: "Copper, fiber, transceivers, Ethernet standards, and the four ways traffic is addressed.",
  assumes: "You can name the OSI layers and know that switches use MAC addresses.",
  lessons: [
    {
      id: "u3l1", title: "Copper Cabling and Connectors", domain: 1, obj: "1.5", minutes: 9,
      body: `Most LAN connections still run over copper. Know the cable types, their limits, and the connector on each.

## Twisted pair
Four pairs of wires twisted to cancel interference. **UTP** (unshielded) is the default. **STP** (shielded) adds foil or braid for noisy environments such as factory floors. The connector is the **RJ45** (8P8C). Telephone lines use the smaller **RJ11**.
- **Cat 5e**: 1 Gbps to 100 meters.
- **Cat 6**: 1 Gbps to 100 meters, 10 Gbps only to 55 meters.
- **Cat 6A**: 10 Gbps to the full 100 meters.
- **Cat 7**: shielded, 10 Gbps, uses non-RJ45 connectors, rare in the US.
- **Cat 8**: 25 or 40 Gbps to 30 meters, meant for short data center runs.
All twisted-pair Ethernet is limited to **100 meters** (328 feet) per run including patch cords.

## Wiring standards
**T568A** and **T568B** define which pair goes to which pin. Same standard on both ends is a **straight-through** cable (host to switch). Different standards on each end is a **crossover** cable (switch to switch or host to host on older gear without auto-MDIX). In T568B the orange pair is on pins 1 and 2 and the green pair on pins 3 and 6.

## Coaxial and twinaxial
**Coax** carries cable modem and video signals over an **F-type** screw connector; older LANs used **BNC**. RG-6 is the modern coax grade. **Twinaxial**, sold as a **direct attach cable (DAC)**, has transceivers permanently attached at both ends and links switches to servers over a few meters at 10 to 100 Gbps. It is cheaper than optics for short distances.

## Ratings
**Plenum-rated** cable has a fire-resistant, low-smoke jacket and is required in air-handling spaces such as above drop ceilings. **Riser-rated** is for vertical runs between floors. Non-plenum PVC is fine inside walls of a single floor.

> Exam tip: a run longer than 100 meters that flaps or fails to link is attenuation; the fix is a switch or repeater in the middle, or fiber. "Above the ceiling tiles" means plenum.`,
      hook: "Copper stops at 100 m. Cat 6A for 10 Gbps at 100 m. Same pinout both ends = straight-through. Plenum above the ceiling."
    },
    {
      id: "u3l2", title: "Fiber Optics", domain: 1, obj: "1.5", minutes: 8,
      body: `Fiber carries light instead of electricity, so it ignores electromagnetic interference and reaches much farther than copper.

## Two kinds of glass
- **Single-mode fiber (SMF)**: a tiny core (about 9 microns) that carries one light path from a laser. Reaches 10 kilometers or more. Yellow jacket by convention. Used between buildings and across cities.
- **Multimode fiber (MMF)**: a wider core (50 or 62.5 microns) that carries many light paths from an LED or cheaper laser. Reaches roughly 300 to 550 meters at 10 Gbps. Orange or aqua jacket. Used inside buildings and data centers.
You cannot mix them on one link without a media converter; the core sizes do not match.

## Connectors
- **LC**: small, square, snap-in. The most common connector on modern transceivers.
- **SC**: larger square push-pull connector. Common on older gear and patch panels.
- **ST**: round bayonet twist-lock. Legacy.
- **MPO/MTP**: a multi-fiber ribbon connector, 12 or 24 fibers in one plug, used for 40 and 100 gigabit links.
Fiber connectors also come in polish types. **UPC** (blue) is flat; **APC** (green) is angled to reduce reflection and is used in long-haul and passive optical networks. Do not mate UPC to APC.

## Media converters
A media converter changes one medium to another without changing the data: single-mode to Ethernet copper, multimode to copper, or single-mode to multimode. Use one when you must extend a copper link with fiber.

> Exam tip: distance decides fiber type. Under a few hundred meters inside a building, multimode is cheaper. Kilometers between sites means single-mode. "Two buildings 2 km apart" is always single-mode.`,
      hook: "Single-mode: small core, laser, kilometers, yellow. Multimode: big core, hundreds of meters, orange or aqua. LC is the little one."
    },
    {
      id: "u3l3", title: "Transceivers and Ethernet Standards", domain: 1, obj: "1.5", minutes: 9,
      body: `Switches and routers use pluggable transceivers so one port can be copper or fiber, short or long reach, depending on the module you insert.

## Form factors
- **SFP**: small form-factor pluggable, 1 Gbps.
- **SFP+**: same size, 10 Gbps.
- **QSFP** and **QSFP+**: quad, four lanes, 40 Gbps.
- **QSFP28**: 100 Gbps. QSFP-DD and OSFP push to 400 Gbps.
Both ends of a link need matching wavelength, fiber type, and speed. A single-mode module on multimode fiber, or an SR module at one end and an LR module at the other, will not link.

## Naming the standards
Ethernet names read speed, signaling, medium: **1000BASE-T** is 1 Gbps over twisted pair. Common ones:
- **1000BASE-T**: 1 Gbps, Cat 5e or better, 100 m.
- **10GBASE-T**: 10 Gbps, Cat 6A, 100 m.
- **1000BASE-SX**: 1 Gbps, multimode, up to about 550 m.
- **1000BASE-LX**: 1 Gbps, single-mode, up to 10 km.
- **10GBASE-SR**: short reach, multimode, about 300 m (400 m on OM4).
- **10GBASE-LR**: long reach, single-mode, 10 km.
- **10GBASE-ER**: extended reach, single-mode, 40 km.
Pattern: **S** means short and multimode, **L** means long and single-mode, **T** means twisted pair.

## How Ethernet shares the wire
Classic Ethernet used **CSMA/CD**: listen before sending, and back off if a collision is detected. Full-duplex switched links have no collisions, so CSMA/CD is effectively retired. A **duplex mismatch** (one side full, one side half) causes late collisions and CRC errors. Auto-negotiation should agree on speed and duplex; hard-coding one side and leaving the other on auto is a classic cause of mismatch.

## MAC addresses
48 bits written as 12 hex digits, such as {{3C:52:82:1A:9F:07}}. The first 24 bits are the **OUI**, the manufacturer code. The address is burned into the network card and is used only on the local segment.

> Exam tip: "SR" plus "single-mode" in the same sentence is a mismatch. So is 10GBASE-SR at 2 km; it runs out at a few hundred meters.`,
      hook: "SFP 1G, SFP+ 10G, QSFP 40G, QSFP28 100G. SR short multimode, LR long single-mode. Duplex mismatch = late collisions."
    },
    {
      id: "u3l4", title: "Traffic Types and Wireless Media", domain: 1, obj: "1.5", minutes: 7,
      body: `Every packet is addressed to one, some, or all hosts. The exam names four traffic types.

## The four traffic types
- **Unicast**: one sender to one receiver. Normal web browsing, email, file transfer.
- **Broadcast**: one sender to every host on the local segment. ARP requests and DHCP Discover are broadcasts. Routers do not forward them, which is why a subnet is also a **broadcast domain**. IPv6 has no broadcast at all.
- **Multicast**: one sender to a group of subscribers who asked for the stream. Efficient for video, routing protocol updates (OSPF uses 224.0.0.5 and 224.0.0.6), and IPv6 neighbor discovery. IPv4 multicast addresses are the Class D range, 224.0.0.0 to 239.255.255.255.
- **Anycast**: the same address assigned to many servers, and the network delivers each request to the **nearest** one. DNS root servers and content delivery networks use anycast so users everywhere get a close, fast answer.

## Wireless media
- **802.11 Wi-Fi**: unlicensed 2.4, 5, and 6 GHz bands. Covered in depth in the wireless unit.
- **Cellular**: 4G LTE and 5G from carriers. Used for mobile devices, backup WAN links, and remote sites where wired service is unavailable.
- **Satellite**: reaches anywhere with a view of the sky. Geostationary satellites add roughly 500 to 600 ms of latency, which hurts voice and interactive apps; newer low-earth-orbit constellations cut that dramatically. Weather can degrade the signal.

> Exam tip: "delivered to the closest of many servers sharing one address" is anycast. "Sent to everyone on the segment" is broadcast. "Only to hosts that joined a group" is multicast.`,
      hook: "Unicast one, broadcast all (local only), multicast the group, anycast the nearest."
    }
  ]
});
