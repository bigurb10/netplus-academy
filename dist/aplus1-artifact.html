{id:"u1l2-4",t:"u1l2",q:"A customer taps a phone against a payment terminal to pay for coffee. Which technology performs the exchange?",a:["Bluetooth","Near field communication","Wi-Fi Direct","Infrared"],c:1,e:"NFC operates at 13.56 MHz over about 4 cm, which is why the phone must nearly touch the terminal. That short range is a security feature for payments and badge readers."},
{id:"u1l2-5",t:"u1l2",q:"A newly purchased active stylus does nothing when touched to a tablet screen, although fingers work normally. What should be checked FIRST?",a:["Whether the screen protector is too thick","Whether the tablet's screen resolution is set too high","Whether the stylus is charged or has a battery and is paired to the tablet","Whether the tablet is in airplane mode"],c:2,e:"An active stylus contains electronics that need a battery or a charge and often need pairing, and it must be a model supported by the device. A passive stylus would work anywhere a finger works."},

// u1l3
{id:"u1l3-1",t:"u1l3",q:"A user's phone shows no cellular signal, no Wi-Fi networks, and no Bluetooth devices. What should the technician check FIRST?",a:["Whether the SIM card is seated","Whether the phone's storage is full","Whether the carrier settings need an update","Whether airplane mode is enabled"],c:3,e:"Airplane mode switches off every radio at once, which matches all three symptoms together. A SIM problem would affect cellular only, and carrier settings would not disable Wi-Fi or Bluetooth."},
{id:"u1l3-2",t:"u1l3",q:"Which component stores the subscriber identity that lets a phone onto a carrier's network and moves the phone number when transferred to another handset?",a:["The SIM card","The baseband processor","The NFC chip","The eSIM QR code"],c:0,e:"The SIM card holds the subscriber identity and keys; moving the card moves the number and plan. An eSIM performs the same role as a soldered chip provisioned with a downloaded profile rather than a removable card."},
{id:"u1l3-3",t:"u1l3",q:"A technician is pairing a Bluetooth headset with a phone. After turning Bluetooth on in the phone, what is the NEXT step?",a:["Enter the PIN on the phone","Put the headset into pairing mode so it is discoverable","Test audio playback","Select the headset from the list of found devices"],c:1,e:"The order is: enable Bluetooth, make the accessory discoverable, select it from the list, enter or confirm the PIN, then test. A headset that is not in pairing mode never appears in the list."},
{id:"u1l3-4",t:"u1l3",q:"A delivery app locates a driver accurately on the road but cannot fix a position inside a warehouse. Which location method is the app depending on?",a:["Cellular tower triangulation","Wi-Fi positioning","GPS satellite positioning","Bluetooth beacons"],c:2,e:"GPS needs a view of the sky and is accurate outdoors but fails indoors. Cellular and Wi-Fi positioning work inside buildings with less precision, which is why phones blend the methods."},
{id:"u1l3-5",t:"u1l3",q:"A company wants to add a work phone line to an employee's existing phone without inserting a second physical card. Which feature makes this possible?",a:["Dual-band Wi-Fi","A PRL update","A hotspot","An eSIM profile"],c:3,e:"An eSIM is a chip built into the phone that can hold one or more carrier profiles downloaded by QR code or app, so a second line can be added without a physical SIM card."},

// u1l4
{id:"u1l4-1",t:"u1l4",q:"An employee who used a personal phone for corporate email under a BYOD policy is leaving the company. Which MDM action removes the company data while leaving personal photos untouched?",a:["A selective wipe of the work profile","A full factory reset","Disabling the phone's camera","Revoking the SIM card"],c:0,e:"On a BYOD device, company data lives in a managed work profile or container. A selective wipe removes that container only; a full wipe would erase the employee's personal data, which is inappropriate on a device they own."},
{id:"u1l4-2",t:"u1l4",q:"A user's phone was blocked from corporate email after they postponed an operating system update for several weeks. What is the MOST likely reason?",a:["The mail server's MX record expired","The device fell out of MDM compliance with the minimum OS version policy","The phone's storage is full","The SIM card needs reprovisioning"],c:1,e:"MDM policies commonly require a minimum OS version, encryption, and a passcode. A device that no longer meets policy is marked non-compliant and blocked from corporate resources until it is brought back into compliance."},
{id:"u1l4-3",t:"u1l4",q:"Which policy set is typical of a fully managed corporate-owned phone rather than a BYOD device?",a:["A work profile with a selective wipe option only","No passcode requirement","Restrictions on the camera and app stores plus full device wipe","Personal apps blocked from the personal side of the device"],c:2,e:"Corporate-owned devices are fully enrolled, so IT can restrict hardware features such as the camera, control app stores, and wipe the entire device. BYOD management is limited to a work container."},
{id:"u1l4-4",t:"u1l4",q:"A user exceeds the cellular data plan every month even though they rarely browse on the phone. What is the MOST likely cause?",a:["Bluetooth is left enabled","Location services are enabled","The phone is set to prefer 5G","Photo and cloud file synchronization is running over cellular"],c:3,e:"Large photo libraries and cloud storage sync silently in the background and can consume gigabytes over cellular. Setting sync to Wi-Fi only, and disabling background data for the app, solves it."},
{id:"u1l4-5",t:"u1l4",q:"A contact edited on a phone and separately on a laptop before either device synchronized now appears twice in the address book. What is this situation called?",a:["A sync conflict","A data cap overrun","A selective wipe","Containerization"],c:0,e:"A synchronization conflict happens when the same item is changed in two places before they sync. Systems resolve it by keeping the latest edit or by creating a duplicate that the user must merge."},

// u2l1
{id:"u2l1-1",t:"u2l1",q:"A PC can ping every other device on its own subnet but cannot reach any address on the internet. Which configuration item is the MOST likely fault?",a:["The MAC address","The default gateway","The DNS suffix","The link speed"],c:1,e:"Traffic for other networks is sent to the default gateway. If the gateway is missing, mistyped, or outside the subnet, local communication works while everything beyond the router fails."},
{id:"u2l1-2",t:"u2l1",q:"Which address does a switch examine to decide which port should receive a frame?",a:["The destination IP address","The destination port number","The destination MAC address","The default gateway address"],c:2,e:"Switches forward frames by MAC address, learning which MAC is on which port from the traffic they see. Routers, not switches, look at IP addresses."},
{id:"u2l1-3",t:"u2l1",q:"What information can be read from the first three pairs of hex digits in a network adapter's MAC address?",a:["The subnet it belongs to","The VLAN it is on","The IP address assigned by DHCP","The manufacturer of the adapter"],c:3,e:"A MAC address is 48 bits shown as six hex pairs; the first three pairs form the organizationally unique identifier that identifies the manufacturer, and the last three are the device's serial portion."},
{id:"u2l1-4",t:"u2l1",q:"Which protocol lets a computer discover the MAC address that belongs to a known IPv4 address on its local network?",a:["ARP","DHCP","DNS","SNMP"],c:0,e:"Address resolution protocol broadcasts a request for the owner of an IP address, and that device replies with its MAC address. The result is cached briefly for later frames."},
{id:"u2l1-5",t:"u2l1",q:"When troubleshooting a workstation that cannot reach a website, which order of checks follows the layers from the bottom up?",a:["DNS resolution, IP configuration, link light, application","Link light, IP configuration, gateway reachability, DNS resolution, application","Application, gateway, link light, DNS","Gateway, DNS, link light, IP configuration"],c:1,e:"Working from the physical layer upward (link, IP address, gateway, name resolution, application) finds the simplest fault first and avoids guessing about DNS when a cable is unplugged."},

// u2l2
{id:"u2l2-1",t:"u2l2",q:"A technician needs to open a firewall port so remote users can connect with Remote Desktop. Which port must be allowed?",a:["TCP 22","TCP 445","TCP 3389","UDP 161"],c:2,e:"Remote Desktop Protocol uses TCP port 3389. Port 445 is SMB file sharing, 22 is SSH, and UDP 161 is SNMP."},
{id:"u2l2-2",t:"u2l2",q:"A security audit finds that network switches are managed with a protocol that sends passwords in clear text on port 23. Which protocol and port should replace it?",a:["RDP on 3389","Telnet on 25","HTTPS on 443","SSH on 22"],c:3,e:"Telnet on port 23 transmits credentials in clear text. SSH on port 22 provides an encrypted remote shell and is its direct replacement on network devices."},
{id:"u2l2-3",t:"u2l2",q:"Which pair of UDP ports is used when a client obtains an IP address automatically from a server?",a:["67 and 68","137 and 139","20 and 21","161 and 162"],c:0,e:"DHCP uses UDP port 67 on the server and 68 on the client. Ports 20 and 21 are FTP, 137 to 139 are NetBIOS, and 161 and 162 are SNMP."},
{id:"u2l2-4",t:"u2l2",q:"A user's mail client keeps a synchronized copy of the mailbox on the phone, laptop, and webmail. Which protocol and default port is the client using to receive mail?",a:["POP3 on 110","IMAP on 143","SMTP on 25","LDAP on 389"],c:1,e:"IMAP (port 143, or 993 with TLS) leaves mail on the server and synchronizes state across devices. POP3 downloads mail to one device, SMTP sends mail, and LDAP is a directory protocol."},
{id:"u2l2-5",t:"u2l2",q:"Why do voice and video streaming applications typically use UDP rather than TCP?",a:["UDP encrypts the stream automatically","UDP retransmits lost packets faster than TCP","UDP avoids the handshake and retransmission delays, and a late packet is worthless for real-time media","UDP uses well-known ports below 1024"],c:2,e:"UDP is connectionless with no acknowledgments or retransmissions, so it adds minimal delay. For real-time media a late retransmitted packet has no value, so speed is preferred over reliability."},

// u2l3
{id:"u2l3-1",t:"u2l3",q:"Three access points on the 2.4 GHz band in one office are set to channels 2, 4, and 7, and users report slow wireless. Which channel plan would fix the interference?",a:["A single channel on all three access points","Channels 1, 2, and 3","Channels 36, 40, and 44","Channels 1, 6, and 11"],c:3,e:"In the 2.4 GHz band only channels 1, 6, and 11 do not overlap at 20 MHz width. Adjacent channels such as 2, 4, and 7 overlap and interfere. Channels 36 and above belong to the 5 GHz band."},
{id:"u2l3-2",t:"u2l3",q:"Which wireless standard operates ONLY in the 5 GHz band?",a:["802.11ac","802.11n","802.11ax","802.11g"],c:0,e:"802.11ac (Wi-Fi 5) is a 5 GHz only standard. 802.11n and 802.11ax use both 2.4 and 5 GHz, and 802.11g is 2.4 GHz only."},
{id:"u2l3-3",t:"u2l3",q:"A warehouse needs wireless coverage across a large open floor with thick walls between sections, and speed is not critical. Which band gives the best range and penetration?",a:["6 GHz","2.4 GHz","5 GHz","60 GHz"],c:1,e:"Lower frequencies travel farther and pass through walls better. The 2.4 GHz band has the longest range and best penetration, at the cost of fewer channels and more interference."},
{id:"u2l3-4",t:"u2l3",q:"Which Wi-Fi generation first added the 6 GHz band?",a:["Wi-Fi 4 (802.11n)","Wi-Fi 5 (802.11ac)","Wi-Fi 6E (802.11ax extended)","Wi-Fi 3 (802.11g)"],c:2,e:"Wi-Fi 6E extended 802.11ax into the 6 GHz band, and Wi-Fi 7 (802.11be) uses it as well. Wi-Fi 5 is 5 GHz only and Wi-Fi 4 uses 2.4 and 5 GHz."},
{id:"u2l3-5",t:"u2l3",q:"A retailer attaches tags to inventory that contain no battery and are read by a handheld scanner from a meter away. Which technology is this?",a:["Bluetooth Low Energy","Active RFID","NFC","Passive RFID"],c:3,e:"Passive RFID tags are powered by the reader's radio field and need no battery, which makes them cheap enough for inventory labels. Active tags carry a battery for longer range, and NFC works only within a few centimeters."},

// u2l4
{id:"u2l4-1",t:"u2l4",q:"A small clinic needs its IP phones on a separate voice network from its computers, using a single switch. Which device is required?",a:["A managed switch","An unmanaged switch","A hub","A PoE injector"],c:0,e:"Separating voice and data on one switch means VLANs, which are configured only on a managed switch. Unmanaged switches have no configuration interface."},
{id:"u2l4-2",t:"u2l4",q:"A fiber internet installation ends at a small box on the wall that converts the optical signal to an Ethernet port for the customer's router. What is this box?",a:["A cable modem","An optical network terminal","A DSL modem","A patch panel"],c:1,e:"The ONT (optical network terminal) terminates the fiber at the premises and presents an Ethernet port. Cable and DSL modems serve coax and phone lines respectively."},
{id:"u2l4-3",t:"u2l4",q:"An access point at the far end of a long cable run needs power, but the switch in the closet does not support PoE. Which is the simplest solution?",a:["Replace the access point with a wireless router","Run a second Ethernet cable to the access point","Install a PoE injector on that run","Add a hub near the access point"],c:2,e:"A PoE injector adds power to a single Ethernet run between a non-PoE switch and a powered device. Replacing the whole switch is unnecessary for one device."},
{id:"u2l4-4",t:"u2l4",q:"Which Power over Ethernet standard supplies up to 30 W per port?",a:["802.3af","802.11ac","802.3bt Type 4","802.3at"],c:3,e:"802.3at (PoE+) delivers 30 W per port. 802.3af provides 15.4 W, 802.3bt provides 60 W (Type 3) or 100 W (Type 4), and 802.11ac is a wireless standard."},
{id:"u2l4-5",t:"u2l4",q:"In a wiring closet, the cable runs from wall jacks throughout a building are terminated on which device before being connected to the switch with short cables?",a:["A patch panel","A firewall","A network tap","A load balancer"],c:0,e:"Building cable runs are punched down on the back of a patch panel; short patch cables then link each panel port to a switch port. This protects the permanent cabling and simplifies moves."},

// u2l5
{id:"u2l5-1",t:"u2l5",q:"Users report that no websites load by name, but a technician can ping a public IP address successfully from a workstation. Which server is MOST likely down?",a:["The DHCP server","The DNS server","The proxy server","The syslog server"],c:1,e:"Name resolution failing while IP connectivity works points to DNS. A DHCP failure would show APIPA addresses, and a syslog failure is invisible to users."},
{id:"u2l5-2",t:"u2l5",q:"A company's public website slows badly during promotions and goes offline whenever its single web server reboots. Which appliance addresses both problems?",a:["A spam gateway","A proxy server","A load balancer with additional web servers","A UTM appliance"],c:2,e:"A load balancer distributes requests across several identical servers, adding capacity and letting one server fail or reboot without taking the site down."},
{id:"u2l5-3",t:"u2l5",q:"Which appliance combines a firewall, intrusion prevention, antivirus, and content filtering in a single box suited to a small business?",a:["A DHCP relay","A network tap","A print server","A unified threat management appliance"],c:3,e:"A UTM (unified threat management) appliance bundles several security functions so a small business can manage them in one place."},
{id:"u2l5-4",t:"u2l5",q:"A factory's SCADA system runs an operating system that no longer receives updates and controls production equipment. What is the BEST way to connect it?",a:["Keep it on an isolated network segment with only the required connections allowed","Connect it directly to the internet for vendor support","Place it on the guest wireless network","Install antivirus on it and join it to the office LAN"],c:0,e:"Legacy and embedded control systems cannot be patched and can halt production if disturbed. They belong on an isolated segment with strictly limited access and no internet exposure."},
{id:"u2l5-5",t:"u2l5",q:"Wireless users cannot sign in with their corporate credentials, while wired users continue working. Which server role should be investigated FIRST?",a:["The NTP server only","The AAA (RADIUS) server","The file server","The print server"],c:1,e:"Enterprise Wi-Fi authenticates users through an AAA server using RADIUS or TACACS+. Wired users often continue with cached credentials, so a RADIUS failure appears first on wireless."},

// u3l1
{id:"u3l1-1",t:"u3l1",q:"A workstation reports the address 169.254.71.9 and cannot reach the internet. What does this address indicate?",a:["The workstation has a static address on the wrong subnet","The workstation is using the loopback address","The workstation did not receive a response from a DHCP server","The workstation was assigned a public address"],c:2,e:"169.254.x.x is an APIPA address that a client assigns itself when its DHCP request goes unanswered. The fix is to check the link, the switch port or VLAN, and the DHCP server."},
{id:"u3l1-2",t:"u3l1",q:"Which of the following IPv4 addresses is in a private range and will not be routed on the internet?",a:["172.32.4.10","192.169.1.5","11.0.0.1","172.20.15.200"],c:3,e:"The private ranges are 10.0.0.0/8, 172.16.0.0 to 172.31.255.255, and 192.168.0.0/16. 172.20.15.200 falls inside the 172.16 to 172.31 block; 172.32, 192.169, and 11.x are public."},
{id:"u3l1-3",t:"u3l1",q:"A host is configured with address 192.168.10.57, mask 255.255.255.0, and gateway 192.168.1.1. It can reach local devices but not the internet. What is wrong?",a:["The gateway is outside the host's subnet","The subnet mask is too large","The address is an APIPA address","The DNS server is not set"],c:0,e:"With a /24 mask the host is on 192.168.10.0, but the gateway 192.168.1.1 is on 192.168.1.0. The host cannot reach a gateway outside its own subnet, so traffic to other networks fails."},
{id:"u3l1-4",t:"u3l1",q:"A network printer's IP address changes periodically and users lose their connection to it. Which solution keeps the address fixed with the least ongoing effort?",a:["Shorten the DHCP lease time","Configure a DHCP reservation for the printer's MAC address","Enable APIPA on the printer","Move the printer to the guest VLAN"],c:1,e:"A DHCP reservation ties a fixed address to the printer's MAC address so the server always assigns the same one. A static address on the printer also works but must be maintained on the device itself."},
{id:"u3l1-5",t:"u3l1",q:"Pinging which address verifies that the TCP/IP stack on the local machine is working, without involving the network card's link or any other device?",a:["192.168.1.1","169.254.0.1","127.0.0.1","255.255.255.255"],c:2,e:"127.0.0.1 is the IPv4 loopback address, which always refers to the local host. A successful ping shows the protocol stack is installed and functioning."},

// u3l2
{id:"u3l2-1",t:"u3l2",q:"Which of the following is an IPv6 link-local address that a device assigns to itself automatically?",a:["2001:db8::1","fd12:3456::1","::1","fe80::1c3a:9f2e:44b1:7d0c"],c:3,e:"Link-local addresses begin with fe80:: and exist on every IPv6 interface without any server. 2001:db8 is global unicast, ::1 is loopback, and fd12 is a unique local address."},
{id:"u3l2-2",t:"u3l2",q:"How many bits long is an IPv6 address?",a:["128","48","64","32"],c:0,e:"IPv6 addresses are 128 bits, written as eight groups of four hexadecimal digits. IPv4 addresses are 32 bits and MAC addresses are 48 bits."},
{id:"u3l2-3",t:"u3l2",q:"What does the double colon (::) represent in the address 2001:db8::ff00:42:8329?",a:["A wildcard for any interface","One or more consecutive groups of zeros, which may be compressed once per address","The subnet prefix length","A separator between the network and host portions"],c:1,e:"The :: notation replaces a single run of consecutive all-zero groups. It may appear only once in an address so the number of missing groups is unambiguous."},
{id:"u3l2-4",t:"u3l2",q:"A workstation shows an IPv4 address and a global IPv6 address on the same adapter and uses whichever the destination supports. What is this configuration called?",a:["Tunneling","NAT64","Dual stack","Link-local only"],c:2,e:"Dual stack runs IPv4 and IPv6 side by side on the same interface, with the operating system preferring IPv6 when the destination has an IPv6 address."},
{id:"u3l2-5",t:"u3l2",q:"Which IPv6 address serves the same purpose as 127.0.0.1 in IPv4?",a:["fe80::1","2000::1","ff02::1","::1"],c:3,e:"::1 is the IPv6 loopback address and always refers to the local host, just as 127.0.0.1 does in IPv4. fe80::1 is link-local and ff02::1 is a multicast address."},

// u3l3
{id:"u3l3-1",t:"u3l3",q:"A technician must make www.example.com resolve to the IPv6 address of a web server. Which DNS record type should be created?",a:["AAAA","A","CNAME","PTR"],c:0,e:"AAAA records map a hostname to an IPv6 address. A records map to IPv4, CNAME creates an alias, and PTR performs reverse lookups."},
{id:"u3l3-2",t:"u3l3",q:"After moving email to a cloud provider, a company's messages start landing in customers' spam folders. Which DNS record MOST likely still lists only the old mail server as an authorized sender?",a:["The MX record","The SPF TXT record","The A record","The CNAME record"],c:1,e:"SPF is a TXT record listing which servers may send mail for the domain. If the new provider's servers are not included, receivers see mail from an unauthorized source and mark it as spam."},
{id:"u3l3-3",t:"u3l3",q:"Which DNS record tells other mail servers where to deliver email addressed to users at a domain?",a:["TXT","NS","MX","AAAA"],c:2,e:"MX (mail exchanger) records identify the mail servers for a domain, with a priority number where the lowest is tried first. Without an MX record, mail to the domain cannot be delivered."},
{id:"u3l3-4",t:"u3l3",q:"Which email authentication mechanism attaches a cryptographic signature so receivers can verify a message came from the domain and was not altered in transit?",a:["SPF","PTR","DMARC","DKIM"],c:3,e:"DKIM signs outgoing messages with a private key; the public key is published in a DNS TXT record so receivers can verify the signature. SPF lists allowed senders and DMARC sets the policy."},
{id:"u3l3-5",t:"u3l3",q:"A domain owner wants receiving servers to reject messages that fail both SPF and DKIM checks and to send reports about them. Which record accomplishes this?",a:["A DMARC TXT record with a reject policy","An MX record with a low priority","A CNAME record pointing to the mail provider","An AAAA record for the mail server"],c:0,e:"DMARC is published as a TXT record and specifies the policy (none, quarantine, or reject) for messages failing authentication, along with addresses for aggregate and failure reports."},

// u3l4
{id:"u3l4-1",t:"u3l4",q:"Place the DHCP address assignment exchange in the correct order.",a:["Offer, Discover, Acknowledge, Request","Discover, Offer, Request, Acknowledge","Request, Offer, Discover, Acknowledge","Discover, Request, Offer, Acknowledge"],c:1,e:"The client broadcasts a Discover, a server responds with an Offer, the client broadcasts a Request for that offer, and the server sends an Acknowledge to start the lease. Remember it as DORA."},
{id:"u3l4-2",t:"u3l4",q:"A DHCP scope covers 192.168.5.50 through 192.168.5.200, but the file server uses static address 192.168.5.100. Which setting prevents the server from handing 192.168.5.100 to a laptop?",a:["A shorter lease time","A reservation for the laptop","An exclusion for 192.168.5.100","A DHCP relay"],c:2,e:"An exclusion removes addresses inside the scope from the pool so the server never assigns them. Without it, a client could receive the file server's address and both would suffer a duplicate address conflict."},
{id:"u3l4-3",t:"u3l4",q:"A company wants phones, staff computers, and guest wireless to be separated from each other while sharing the same physical switches. Which technology provides this?",a:["A VPN","A PoE injector","DHCP reservations","VLANs on managed switches"],c:3,e:"VLANs create separate logical networks on the same managed switch hardware. Traffic between VLANs must pass through a router or layer 3 switch where it can be controlled."},
{id:"u3l4-4",t:"u3l4",q:"A remote employee working from a hotel can browse the internet but cannot open the company's internal file shares. What is the MOST likely missing piece?",a:["A client-to-site VPN connection","A DHCP reservation","A DNS AAAA record","A VLAN trunk"],c:0,e:"Internal resources are reachable only from inside the company network. A client VPN makes the laptop appear to be on the office network through an encrypted tunnel across the internet."},
{id:"u3l4-5",t:"u3l4",q:"Two branch offices need a permanent, encrypted connection between their networks over the internet so users at either site can reach servers at the other. Which solution fits?",a:["A split-tunnel client VPN on each PC","A site-to-site VPN between the office routers","A guest VLAN at each site","A DHCP relay agent"],c:1,e:"A site-to-site VPN links two routers or firewalls with a persistent encrypted tunnel, joining the two networks without every user running a client."},

// u3l5
{id:"u3l5-1",t:"u3l5",q:"A technician has just connected a new SOHO router to the modem and logged into its web interface. What should be done FIRST?",a:["Enable port forwarding for the security cameras","Hide the SSID","Change the default administrator password","Turn on remote management"],c:2,e:"Default router credentials are publicly known, so changing the administrator password is the first step. Remote management and port forwarding should stay off unless specifically needed."},
{id:"u3l5-2",t:"u3l5",q:"A remote cabin has no phone or cable lines and no clear line of sight to a wireless tower. Which internet connection type is the only option?",a:["DSL","Cable","Fiber","Satellite"],c:3,e:"Satellite works anywhere with a view of the sky but has the highest latency and often data caps. DSL and cable need lines, fiber needs a fiber build-out, and WISP needs line of sight."},
{id:"u3l5-3",t:"u3l5",q:"A homeowner far from town has an internet connection that is much slower than the neighbors closer to the telephone exchange. Which connection type has this distance limitation?",a:["DSL","Cable","Fiber","Cellular"],c:0,e:"DSL runs over copper phone lines and its speed falls sharply with distance from the provider's equipment. Cable speed depends on neighborhood sharing rather than line length."},
{id:"u3l5-4",t:"u3l5",q:"Which network type describes a Bluetooth connection between a phone and a wireless headset?",a:["LAN","PAN","WAN","MAN"],c:1,e:"A personal area network covers a few meters around one person, which is exactly what Bluetooth provides. A LAN covers a site, a MAN a city, and a WAN spans regions."},
{id:"u3l5-5",t:"u3l5",q:"A data center gives its servers block-level access to shared disk arrays over a dedicated Fibre Channel or iSCSI network. What is this network called?",a:["A WLAN","A MAN","A SAN","A PAN"],c:2,e:"A storage area network is a dedicated high-speed network that presents shared storage to servers as if it were local disk. It is separate from the user LAN."},

// u3l6
{id:"u3l6-1",t:"u3l6",q:"A wiring closet contains dozens of unlabeled cables, and a technician must find the one that runs to a specific office jack. Which tool is designed for this?",a:["A loopback plug","A crimper","A cable certifier","A toner probe"],c:3,e:"A tone generator is clipped to the cable at the jack and the probe is swept across the closet cables; it sounds loudest on the matching cable."},
{id:"u3l6-2",t:"u3l6",q:"A technician suspects a switch port is dead but has no spare computer or known-good cable available. Which tool tests the port by itself?",a:["A loopback plug","A Wi-Fi analyzer","A punchdown tool","A cable stripper"],c:0,e:"A loopback plug wires the transmit pins back to the receive pins so the port sees its own signal. A working port shows link and passes diagnostics with nothing else attached."},
{id:"u3l6-3",t:"u3l6",q:"Which tool seats individual wires into the 110 block on the back of a patch panel and trims the excess in one motion?",a:["A crimper","A punchdown tool","A cable tester","A network tap"],c:1,e:"A punchdown tool pushes each conductor into its slot on a 110 block or keystone jack and cuts the tail. A crimper attaches RJ45 plugs to cable ends instead."},
{id:"u3l6-4",t:"u3l6",q:"Users in one wing report slow and unreliable Wi-Fi. Which tool shows the technician the nearby networks, their channels, and signal strength to identify overlap?",a:["A cable certifier","A toner probe","A Wi-Fi analyzer","A loopback plug"],c:2,e:"A Wi-Fi analyzer displays every SSID in range with its channel and signal level, revealing channel overlap, weak coverage, and rogue access points."},
{id:"u3l6-5",t:"u3l6",q:"A newly made patch cable lights only seven of eight indicators on a cable tester, with one light never appearing. What does this result indicate?",a:["The cable is a crossover cable","The tester battery is low","The cable exceeds its category rating","One conductor is open, most likely not seated in the plug"],c:3,e:"A missing light on a wire-map test means that conductor has no continuity, an open, usually because the wire did not reach the contact in the RJ45 plug. Re-terminate the end."}
);

// APlus Academy Core 1 question bank, units 4 to 6. All questions are original.
// Fields: id, t (lesson id), q (stem), a (four options), c (index of correct option), e (explanation).
window.FRA = window.FRA || {};
FRA.questions = FRA.questions || [];
FRA.questions.push(
// u4l1
{id:"u4l1-1",t:"u4l1",q:"A new office needs 10 Gb/s Ethernet to workstations on cable runs of up to 90 meters. Which is the lowest category that meets the requirement?",a:["Cat 5e","Cat 6a","Cat 6","Cat 8"],c:1,e:"Cat 6a supports 10 Gb/s over the full 100 m. Cat 6 manages 10 Gb/s only to about 55 m, Cat 5e tops out at 1 Gb/s, and Cat 8 is limited to 30 m runs."},
{id:"u4l1-2",t:"u4l1",q:"Cable is being installed in the air-handling space above a suspended ceiling. Which cable rating is required by fire code?",a:["Direct burial","Shielded twisted pair","Plenum-rated","Riser-rated only"],c:2,e:"Plenum spaces carry return air, so cable there must have a low-smoke, fire-resistant jacket. Ordinary PVC jackets release toxic smoke when burned."},
{id:"u4l1-3",t:"u4l1",q:"A patch cable is wired T568A on one end and T568B on the other. What kind of cable has been made?",a:["A straight-through cable","A shielded cable","A rollover console cable","A crossover cable"],c:3,e:"Using different standards at each end swaps the orange and green pairs, crossing transmit and receive. That is a crossover cable, once used between like devices before auto-MDIX ports became standard."},
{id:"u4l1-4",t:"u4l1",q:"A campus needs a fiber link between two buildings 2 kilometers apart. Which fiber type and light source should be used?",a:["Single-mode with a laser source","Multimode with an LED source","Multimode with a laser source","Coaxial with an F-type connector"],c:0,e:"Single-mode fiber has a tiny core of about 9 microns, uses a laser, and spans kilometers. Multimode with LED or VCSEL sources is limited to hundreds of meters."},
{id:"u4l1-5",t:"u4l1",q:"Which connector is found on the RG-6 coaxial cable that feeds a cable modem?",a:["BNC","F-type","RJ11","SC"],c:1,e:"RG-6 cable television and cable modem connections use the threaded F-type connector. BNC is the bayonet connector on RG-59 CCTV runs, RJ11 is telephone, and SC is a fiber connector."},

// u4l2
{id:"u4l2-1",t:"u4l2",q:"A technician plugs an external drive into a blue USB port on a desktop. What maximum transfer rate does that port support?",a:["480 Mb/s","10 Gb/s","5 Gb/s","40 Gb/s"],c:2,e:"Blue ports indicate USB 3.0 (also called 3.2 Gen 1) at 5 Gb/s. Black ports are USB 2.0 at 480 Mb/s, teal or red ports are 10 Gb/s, and 40 Gb/s is USB4 or Thunderbolt."},
{id:"u4l2-2",t:"u4l2",q:"Which video connector carries an analog signal and typically uses a 15-pin blue plug with thumbscrews?",a:["DVI-D","HDMI","DisplayPort","VGA"],c:3,e:"VGA is the only common analog video interface, using a 15-pin DE-15 connector. DVI-D, HDMI, and DisplayPort are digital."},
{id:"u4l2-3",t:"u4l2",q:"A user wants to run two monitors from a single video output by connecting the second monitor to the first. Which interface supports this daisy chaining?",a:["DisplayPort","DVI","VGA","HDMI 1.4"],c:0,e:"DisplayPort multi-stream transport allows monitors to be daisy chained from one output. VGA, DVI, and HDMI do not support daisy chaining."},
{id:"u4l2-4",t:"u4l2",q:"A technician needs to connect a computer's DVI-D output to a monitor that has only a VGA input. What is required?",a:["A passive DVI to VGA adapter","An active DVI-D to VGA converter","A DisplayPort cable","A USB-C to HDMI adapter"],c:1,e:"DVI-D carries only a digital signal, so converting to analog VGA requires an active converter. A passive adapter works only from DVI-I or DVI-A, which include analog pins."},
{id:"u4l2-5",t:"u4l2",q:"Which cable connects an internal SATA drive's data port to the motherboard?",a:["A 15-pin cable","A 4-pin Molex cable","A 7-pin cable","A 24-pin cable"],c:2,e:"SATA data cables have 7 pins in an L-shaped connector and run up to 1 m. The 15-pin connector is SATA power, Molex is legacy power, and the 24-pin connector powers the motherboard."},

// u4l3
{id:"u4l3-1",t:"u4l3",q:"A photo editor needs a monitor with the most accurate color and the widest viewing angles. Which LCD panel type should be recommended?",a:["TN","VA","Mini-LED backlit TN","IPS"],c:3,e:"IPS (in-plane switching) panels offer the best color accuracy and viewing angles. TN is fastest but poor in color and angles, and VA emphasizes contrast."},
{id:"u4l3-2",t:"u4l3",q:"A laptop screen is extremely dim, but when a flashlight is shined on it the desktop is faintly visible. What has MOST likely failed?",a:["The backlight or inverter","The digitizer","The LCD panel","The video cable"],c:0,e:"The panel is still forming an image, so the missing element is the light behind it. On older CCFL screens the inverter fails; on LED screens the backlight or its driver fails."},
{id:"u4l3-3",t:"u4l3",q:"Which display technology lights each pixel individually, producing perfect blacks but risking burn-in from static images?",a:["IPS LCD","OLED","VA LCD","Mini-LED"],c:1,e:"OLED pixels emit their own light, so a black pixel is simply off. Because the organic material wears, static content can leave permanent ghost images."},
{id:"u4l3-4",t:"u4l3",q:"A tablet displays a clear image but no longer responds to touch anywhere on the screen. Which component is MOST likely at fault?",a:["The backlight","The display panel","The digitizer or its cable","The inverter"],c:2,e:"The digitizer is the layer that senses touch or pen input. A working image with no touch response points to the digitizer or its connection rather than the panel."},
{id:"u4l3-5",t:"u4l3",q:"A user connected a new 144 Hz monitor, but it runs at only 60 Hz. What should the technician check?",a:["The monitor's pixel density","Whether the monitor is IPS or VA","The color gamut setting","The cable and port version, and the refresh rate setting in the operating system"],c:3,e:"High refresh rates need enough cable and port bandwidth for the resolution, and the refresh rate must be selected in the display settings. Density and gamut do not affect refresh."},

// u5l1
{id:"u5l1-1",t:"u5l1",q:"Which memory module has 288 pins, runs at 1.2 V, and is the most common desktop memory in service?",a:["DDR4 DIMM","DDR3 DIMM","DDR5 SODIMM","DDR3 SODIMM"],c:0,e:"DDR4 DIMMs have 288 pins at 1.2 V. DDR3 DIMMs have 240 pins at 1.5 V, and DDR5 DIMMs also have 288 pins but a different notch and 1.1 V."},
{id:"u5l1-2",t:"u5l1",q:"A technician installs a second identical memory module in a desktop to enable dual-channel operation. Where should it be placed?",a:["In the slot immediately next to the first module","In the paired slot indicated by the motherboard manual, usually matching in color","In any empty slot","In the slot farthest from the CPU"],c:1,e:"Dual channel requires matched modules in the slots the board pairs together, typically color-coded. Placing modules side by side in unpaired slots can leave the system in single-channel mode."},
{id:"u5l1-3",t:"u5l1",q:"A database server must detect and correct single-bit memory errors to avoid silent data corruption. Which memory type is required?",a:["Non-ECC unbuffered","Low-voltage DDR3","ECC","SODIMM"],c:2,e:"ECC (error-correcting code) memory detects and corrects single-bit errors. It requires support from both the CPU and the motherboard and is used in servers and workstations."},
{id:"u5l1-4",t:"u5l1",q:"A PC with 4 GB of RAM runs very slowly with several applications open, and the drive activity light stays on constantly. What is the BEST fix?",a:["Increase the size of the paging file","Defragment the drive","Replace the CPU","Add more RAM"],c:3,e:"Constant drive activity under memory pressure means the OS is paging to disk because RAM is full. Adding RAM removes the bottleneck; a larger paging file only enlarges the slow overflow."},
{id:"u5l1-5",t:"u5l1",q:"After installing a DDR4-3200 module in a board rated for DDR4-2666, at what speed will the memory operate?",a:["2666 MT/s","3200 MT/s","It will not boot","1600 MT/s"],c:0,e:"Memory runs at the speed the board and the slowest module support. A faster module simply operates at the board's supported speed of 2666 MT/s."},

// u5l2
{id:"u5l2-1",t:"u5l2",q:"A user wants the fastest possible boot drive for a desktop that has an M-keyed M.2 slot connected to PCIe lanes. Which drive should be chosen?",a:["A 2.5-inch SATA SSD","An M.2 NVMe SSD","An M.2 SATA SSD","A 7,200 rpm hard drive"],c:1,e:"NVMe drives use PCIe lanes and reach thousands of megabytes per second, far beyond the roughly 550 MB/s limit of any SATA drive, including M.2 SATA."},
{id:"u5l2-2",t:"u5l2",q:"A laptop hard drive has started making a repeated clicking sound and files open slowly. What should the technician do FIRST?",a:["Run a defragmentation","Update the SATA driver","Back up the data immediately","Reformat the drive"],c:2,e:"Clicking indicates a mechanical failure in progress. The priority is to back up the data before the drive dies completely, then replace it."},
{id:"u5l2-3",t:"u5l2",q:"Which storage controller type can accept both SAS and SATA drives?",a:["A SATA controller","A USB controller","An IDE controller","A SAS controller"],c:3,e:"SAS controllers and backplanes are compatible with SATA drives, but a SATA controller cannot operate SAS drives. This one-way compatibility is a common exam point."},
{id:"u5l2-4",t:"u5l2",q:"What does the designation 2280 on an M.2 SSD indicate?",a:["A width of 22 mm and a length of 80 mm","A capacity of 2,280 GB","A PCIe generation and lane count","A SATA revision"],c:0,e:"M.2 sizes encode width and length in millimeters: 2280 is 22 mm wide and 80 mm long, the most common size. The key (B, M, or B+M) is separate from the size."},
{id:"u5l2-5",t:"u5l2",q:"What is the capacity of a standard single-layer DVD?",a:["700 MB","4.7 GB","8.5 GB","25 GB"],c:1,e:"A single-layer DVD holds 4.7 GB; dual-layer holds 8.5 GB. A CD holds 700 MB and a single-layer Blu-ray disc holds 25 GB."},

// u5l3
{id:"u5l3-1",t:"u5l3",q:"A server has four 4 TB drives configured as RAID 10. How much usable capacity does the array provide?",a:["16 TB","12 TB","8 TB","4 TB"],c:2,e:"RAID 10 mirrors pairs and stripes across them, so usable capacity is half the total: 4 x 4 TB = 16 TB, halved to 8 TB. RAID 5 would give 12 TB and RAID 0 would give 16 TB."},
{id:"u5l3-2",t:"u5l3",q:"Which RAID level requires a minimum of four drives and can survive the failure of any two drives?",a:["RAID 1","RAID 5","RAID 0","RAID 6"],c:3,e:"RAID 6 uses two independent parity sets across at least four drives and tolerates two simultaneous failures. RAID 5 tolerates one, RAID 1 mirrors two drives, and RAID 0 tolerates none."},
{id:"u5l3-3",t:"u5l3",q:"A video editor wants maximum read and write speed from two drives and keeps all source files backed up elsewhere. Which RAID level fits?",a:["RAID 0","RAID 1","RAID 5","RAID 10"],c:0,e:"RAID 0 stripes data across drives for the best speed and full capacity, with no fault tolerance. Because the data is backed up elsewhere, the lack of protection is acceptable."},
{id:"u5l3-4",t:"u5l3",q:"Five 2 TB drives are configured in RAID 5. What is the usable capacity and how many drives can fail without data loss?",a:["10 TB; no failures","8 TB; one failure","6 TB; two failures","5 TB; one failure"],c:1,e:"RAID 5 loses one drive's worth of space to parity: (5 minus 1) x 2 TB = 8 TB, and it survives one drive failure. RAID 6 would give 6 TB and survive two."},
{id:"u5l3-5",t:"u5l3",q:"A RAID 5 array shows an amber light on one drive bay and an audible alarm, but the server is still running. What should the technician do?",a:["Nothing; the array is still functional","Convert the array to RAID 0 to restore performance","Replace the failed drive promptly so the array can rebuild before a second failure occurs","Power off the server until a new controller arrives"],c:2,e:"A degraded RAID 5 array runs without protection and slower. Replacing the failed drive starts the rebuild; a second failure before it completes would lose the array."},

// u5l4
{id:"u5l4-1",t:"u5l4",q:"Which motherboard form factor measures 6.7 x 6.7 inches and is used for compact builds with a single expansion slot?",a:["ATX","microATX","E-ATX","Mini-ITX"],c:3,e:"Mini-ITX boards are 170 mm (6.7 inches) square with one expansion slot. ATX is 12 x 9.6 inches and microATX is 9.6 x 9.6 inches."},
{id:"u5l4-2",t:"u5l4",q:"A newly assembled PC shows no signs of POST, and the technician discovers an extra brass standoff under the motherboard that does not align with a mounting hole. What is the MOST likely problem?",a:["The standoff is shorting the board to the case","The CPU is not compatible with the chipset","The memory is not seated","The power supply selector is on the wrong voltage"],c:0,e:"A standoff touching the underside of the board where there is no mounting hole creates a short circuit that prevents the board from starting. Remove it and retest."},
{id:"u5l4-3",t:"u5l4",q:"Which connector supplies power specifically to the CPU's voltage regulators on a motherboard?",a:["The 24-pin main connector","The 4- or 8-pin EPS connector","The 6-pin PCIe connector","The 15-pin SATA connector"],c:1,e:"The EPS 4-pin or 8-pin connector near the socket powers the CPU voltage regulators. The 24-pin connector feeds the board generally, PCIe connectors feed graphics cards, and SATA power feeds drives."},
{id:"u5l4-4",t:"u5l4",q:"Which CPU socket design places the pins in the socket rather than on the processor?",a:["PGA","AM4","LGA","ZIF"],c:2,e:"LGA (land grid array) sockets contain the pins, and the CPU has flat contacts. Intel uses LGA, as does AMD's AM5; AM4 is a PGA socket with pins on the chip."},
{id:"u5l4-5",t:"u5l4",q:"A technician wants to install a PCIe x1 sound card, but the only open slot on the board is a PCIe x16 slot. What is the result?",a:["The card will not fit","The slot must be converted in firmware","The card will run at x16 speed","The card will fit and operate using one lane"],c:3,e:"A shorter PCIe card fits in any longer slot and uses only its own lanes. An x1 card in an x16 slot works normally at x1 bandwidth."},

// u5l5
{id:"u5l5-1",t:"u5l5",q:"A desktop prompts the user to set the date and time at every startup, and websites report certificate errors until it is corrected. What should be replaced?",a:["The CMOS battery","The power supply","The TPM module","The hard drive"],c:0,e:"The CR2032 CMOS battery keeps the clock and firmware settings when the PC is off. When it dies, the clock resets, which also breaks certificate validation and authentication."},
{id:"u5l5-2",t:"u5l5",q:"A developer installs a hypervisor and receives an error stating that hardware virtualization is not available, although the CPU supports it. What should be done?",a:["Install more RAM","Enable VT-x or AMD-V in the firmware settings","Disable Secure Boot","Convert the disk to GPT"],c:1,e:"Hardware virtualization support is a firmware setting that is sometimes disabled by default. Enabling Intel VT-x or AMD-V allows hypervisors and virtualization-based features to run."},
{id:"u5l5-3",t:"u5l5",q:"Which firmware feature allows only digitally signed boot loaders to run, protecting against boot-sector malware?",a:["A supervisor password","USB permissions","Secure Boot","Fast boot"],c:2,e:"Secure Boot, part of UEFI, verifies the signature of the boot loader before running it. It requires UEFI mode with a GPT disk and may need to be disabled for some older media."},
{id:"u5l5-4",t:"u5l5",q:"Which component on a motherboard stores encryption keys for BitLocker and is required by Windows 11?",a:["A hardware security module","The chipset","The CMOS chip","The Trusted Platform Module"],c:3,e:"The TPM (version 2.0 for Windows 11) stores keys and measures the boot process. An HSM is a separate enterprise appliance, not a component on a PC motherboard."},
{id:"u5l5-5",t:"u5l5",q:"A company wants to prevent lab users from booting the PCs from USB drives and from changing that setting. Which two actions accomplish this?",a:["Set the boot order to the internal drive only and set a supervisor password","Remove the USB ports and disable the network","Enable fast boot and disable Secure Boot","Clear the CMOS and enable virtualization"],c:0,e:"Removing USB from the boot order (or disabling USB boot) stops the behavior, and a supervisor password prevents users from re-enabling it in firmware setup."},

// u5l6
{id:"u5l6-1",t:"u5l6",q:"A user with an ARM-based laptop cannot install a device driver written for x64 Windows. Why?",a:["ARM laptops cannot run any drivers","Software and drivers must be compiled for the ARM architecture","The laptop needs more RAM","The driver requires a 32-bit operating system"],c:1,e:"ARM is a different instruction set from x86 and x64. Drivers and native software must be built for ARM; x64 drivers cannot be loaded even if some x64 applications run through emulation."},
{id:"u5l6-2",t:"u5l6",q:"A technician removes a CPU cooler to replace the motherboard and later reinstalls the same cooler. What must be done during reinstallation?",a:["Update the CPU microcode","Reverse the fan direction","Clean both surfaces and apply fresh thermal paste","Replace the CPU"],c:2,e:"Thermal paste must be renewed whenever the cooler is removed, because the old layer no longer fills the gap evenly. Clean with isopropyl alcohol and apply a thin new layer."},
{id:"u5l6-3",t:"u5l6",q:"A newly installed graphics card is not detected and the monitor shows no image, though the system powers on. What should be checked FIRST?",a:["The monitor's color gamut","The DNS settings","Whether the CPU supports virtualization","Whether the card is fully seated and its PCIe power connectors are attached"],c:3,e:"An undetected card is usually not fully seated in the slot or is missing its supplemental power connector. Both must be checked before suspecting a defective card."},
{id:"u5l6-4",t:"u5l6",q:"A streamer wants to record the video output of a game console on a PC. Which expansion card is needed?",a:["A capture card","A sound card","A network interface card","A RAID controller"],c:0,e:"A capture card accepts an HDMI or similar video input and records or streams it. Sound cards handle audio, NICs handle networking."},
{id:"u5l6-5",t:"u5l6",q:"A desktop that used to run quietly now has loud fans and shuts down during demanding tasks. Firmware shows high CPU temperatures at idle. What is the MOST likely cause?",a:["The power supply is too large","Dust buildup and dried thermal paste are preventing effective cooling","The RAM is running in single channel","The boot order is wrong"],c:1,e:"Dust in the heat sink and filters, together with dried thermal paste, raises temperatures until the system throttles and shuts down. Cleaning and repasting restores normal operation."},

// u5l7
{id:"u5l7-1",t:"u5l7",q:"A PC shipped from Europe fails with a loud pop and a burning smell the moment it is plugged into a North American outlet. What MOST likely happened?",a:["The outlet delivered too little voltage","The CMOS battery shorted","The power supply's voltage selector was set incorrectly for the outlet","The graphics card drew too much current"],c:2,e:"A supply set to 115 V and connected to 230 V (or a mismatch in the other direction on some units) overloads the input stage. Auto-switching supplies avoid this, but a manual selector must match the mains."},
{id:"u5l7-2",t:"u5l7",q:"Which power supply rail carries most of the load for the CPU, graphics card, and drive motors?",a:["3.3 V","5 V","Negative 12 V","12 V"],c:3,e:"The 12 V rail (yellow wires) feeds the CPU voltage regulators through the EPS connector, the graphics card through PCIe connectors, and drive motors. The 3.3 V and 5 V rails feed logic and USB."},
{id:"u5l7-3",t:"u5l7",q:"After installing a high-end graphics card that requires two 8-pin power connectors, a PC restarts whenever a game starts. The original 450 W supply is still installed. What is the MOST likely cause?",a:["The power supply cannot deliver enough wattage under load","The card is in the wrong PCIe slot","The monitor refresh rate is too high","The RAM needs to be upgraded"],c:0,e:"High-end graphics cards can draw 300 W or more. A supply without enough capacity sags under load and the system resets, so it must be replaced with one sized for the total draw plus headroom."},
{id:"u5l7-4",t:"u5l7",q:"What does an 80 Plus Gold rating on a power supply indicate?",a:["It delivers 80 W of continuous power","It converts about 90 percent of input power into usable output at typical load","It has gold-plated connectors","It supports 220 V input only"],c:1,e:"80 Plus tiers certify efficiency: Bronze about 85 percent, Gold about 90 percent, Titanium about 94 percent. Higher efficiency means less heat and lower electricity use."},
{id:"u5l7-5",t:"u5l7",q:"Which power supply feature allows a server to keep running when one of its supply modules fails?",a:["A modular cable design","An 80 Plus Titanium rating","Redundant hot-swappable power supplies","A 20+4 pin connector"],c:2,e:"Redundant supplies share the load, and if one fails the remaining unit carries the server while an alert is raised. The failed module can be swapped without shutting down."},

// u6l1
{id:"u6l1-1",t:"u6l1",q:"A graphic design firm needs printed output that is identical regardless of which printer model renders the job. Which page description language should the driver use?",a:["PCL","ESC/P","Host-based printing","PostScript"],c:3,e:"PostScript is a device-independent page description language that renders identically on any PostScript printer, which is why publishing and design workflows rely on it. PCL is faster but printer-dependent."},
{id:"u6l1-2",t:"u6l1",q:"Every Monday morning, an office printer that was working on Friday shows as offline until a technician updates its IP address on each computer. What is the BEST permanent fix?",a:["Assign the printer a static IP address or a DHCP reservation","Restart the print spooler every Monday","Switch the printer to USB","Reinstall the driver weekly"],c:0,e:"The printer is receiving a different DHCP address after its lease expires. A static address or a reservation keeps the address constant so clients always find it."},
{id:"u6l1-3",t:"u6l1",q:"Human resources reports that confidential documents are being picked up from the printer's output tray by other employees. Which feature solves this?",a:["Duplex printing","Secured print released with a PIN or badge at the device","Draft quality mode","Scan to email"],c:1,e:"Secured (held) print keeps the job on the printer until the owner authenticates at the panel, so pages never sit unattended in the tray."},
{id:"u6l1-4",t:"u6l1",q:"A multifunction printer's scan-to-folder function stopped working right after the company forced a password change on all accounts. What should be updated?",a:["The printer's firmware","The SMTP server address","The credentials for the service account stored on the printer","The paper tray settings"],c:2,e:"Scan to folder writes to an SMB share using an account whose password is saved on the printer. When that password changes, the saved credentials must be updated."},
{id:"u6l1-5",t:"u6l1",q:"A company with sixty users and eight printers wants drivers deployed automatically and printing usage logged centrally. Which approach should be used?",a:["Share each printer from the nearest user's PC","Connect each printer by USB to a workstation","Have each user add printers by IP address","Configure a print server that hosts the queues and drivers"],c:3,e:"A print server centralizes queues, pushes the correct drivers to clients, applies default settings, and keeps logs. PC sharing depends on that PC being on, and direct IP offers no central control."},

// u6l2
{id:"u6l2-1",t:"u6l2",q:"In the laser printing process, which step applies a uniform negative charge of about minus 600 V to the imaging drum?",a:["Charging","Exposing","Developing","Transferring"],c:0,e:"Charging comes second, after processing, and uses the primary charge roller or corona wire to place a uniform negative charge on the drum before the laser writes the image."},
{id:"u6l2-2",t:"u6l2",q:"Which laser printing step immediately follows exposing?",a:["Fusing","Developing","Cleaning","Charging"],c:1,e:"The order is processing, charging, exposing, developing, transferring, fusing, cleaning. After the laser exposes the image, toner is applied to the drum in the developing step."},
{id:"u6l2-3",t:"u6l2",q:"Pages from a laser printer look correct but the toner smears off when touched. Which component has MOST likely failed?",a:["The imaging drum","The transfer roller","The fuser assembly","The pickup roller"],c:2,e:"Toner that reaches the paper but does not bond has not been fused. The fuser's heated roller and pressure roller melt toner into the paper; a failed or cold fuser leaves it loose."},
{id:"u6l2-4",t:"u6l2",q:"A laser printer frequently pulls two or three sheets at a time from the tray. Which parts should be replaced?",a:["The fuser and the laser scanner","The toner cartridge","The formatter board","The pickup rollers and separation pad, typically as part of a maintenance kit"],c:3,e:"The separation pad allows only one sheet through, and worn rollers and pads cause multi-sheet feeds. Both are included in the printer's maintenance kit."},
{id:"u6l2-5",t:"u6l2",q:"Toner has spilled inside a laser printer. What is the correct way to clean it?",a:["Use a toner-rated vacuum with a HEPA filter and lint-free cloths","Use a household vacuum cleaner","Blow it out with compressed air","Wipe it with a wet paper towel"],c:0,e:"Compressed air spreads fine toner into the air and mechanism, and household vacuums let the particles pass through and can ignite them. A toner-rated vacuum is the safe method."},

// u6l3
{id:"u6l3-1",t:"u6l3",q:"A warehouse must print three-part carbonless invoices in a single pass. Which printer type is the only one suited to this?",a:["Laser","Impact (dot matrix)","Thermal","Inkjet"],c:1,e:"Impact printers strike the paper through a ribbon with enough force to print through multipart carbonless forms. No other type transfers an image to the copies underneath."},
{id:"u6l3-2",t:"u6l3",q:"An inkjet printer produces text with horizontal gaps and missing lines. What should the technician try FIRST?",a:["Replace the carriage belt","Replace the feed rollers","Run the print head cleaning routine","Switch to PostScript"],c:2,e:"Missing lines mean some nozzles are clogged. The cleaning cycle purges dried ink from the print head; alignment is for misregistration, and the belt affects head movement, not output gaps."},
{id:"u6l3-3",t:"u6l3",q:"A receipt printer at a checkout suddenly produces blank receipts after a new roll of paper was loaded. What is the MOST likely cause?",a:["The ribbon is worn out","The printer needs toner","The print head pins are broken","The thermal paper was loaded with the coated side facing away from the heating element"],c:3,e:"Thermal printers darken a heat-sensitive coating on one side of the paper. Loaded backward, the element heats the uncoated side and nothing appears. Thermal printers use no ribbon, ink, or toner."},
{id:"u6l3-4",t:"u6l3",q:"A dot matrix printer prints every character with the same horizontal row of dots missing. Which part should be replaced?",a:["The print head","The ribbon","The tractor feed","The platen"],c:0,e:"A dot missing in the same position on every character means one pin in the print head is broken. A worn ribbon causes even fading, not a consistent missing row."},
{id:"u6l3-5",t:"u6l3",q:"Which maintenance step is appropriate for a thermal label printer that produces faint, streaky output?",a:["Replace the ink cartridge","Clean the heating element with isopropyl alcohol on a lint-free swab","Run a head alignment","Replace the toner cartridge"],c:1,e:"Thermal printers have no ink or toner. Residue on the heating element causes faint or streaked print; cleaning it with isopropyl alcohol is the standard maintenance."}
);

// APlus Academy Core 1 question bank, units 7 to 9. All questions are original.
// Fields: id, t (lesson id), q (stem), a (four options), c (index of correct option), e (explanation).
window.FRA = window.FRA || {};
FRA.questions = FRA.questions || [];
FRA.questions.push(
// u7l1
{id:"u7l1-1",t:"u7l1",q:"A data center wants the best performance and isolation for dozens of server VMs on each physical host. Which hypervisor type should be deployed?",a:["A type 2 hypervisor installed on a desktop OS","A type 1 hypervisor installed directly on the hardware","A container runtime on a workstation","A VDI client"],c:1,e:"Type 1 (bare-metal) hypervisors run directly on the hardware with no host OS beneath them, giving the best performance and isolation for server virtualization."},
{id:"u7l1-2",t:"u7l1",q:"A technician needs to open an email attachment that may be malicious without risking the workstation. Which virtualization use fits?",a:["VDI on a production server","A container sharing the workstation's kernel","A sandbox VM that can be reverted or deleted afterward","Cross-platform virtualization"],c:2,e:"A sandbox is an isolated VM used to open suspicious files or test risky changes. Anything that goes wrong stays inside the VM, which is then reverted to a snapshot or deleted."},
{id:"u7l1-3",t:"u7l1",q:"Which technology packages an application with its libraries while sharing the host operating system's kernel, allowing many instances to start in seconds?",a:["A type 1 hypervisor","A snapshot","Virtual desktop infrastructure","Containers"],c:3,e:"Containers isolate applications rather than whole operating systems, sharing the host kernel. They are far lighter than VMs but require the same OS family as the host."},
{id:"u7l1-4",t:"u7l1",q:"A hospital wants clinicians to access a full desktop from thin clients and tablets, with all data staying in the data center. Which solution provides this?",a:["Virtual desktop infrastructure","Containers on the thin clients","Type 2 hypervisors on each tablet","A host-only network"],c:0,e:"VDI runs user desktops as VMs on servers; endpoints only display the screen and send input. Data never leaves the data center and any device can be used."},
{id:"u7l1-5",t:"u7l1",q:"An accounting application only runs on an operating system that is no longer supported on modern hardware. What allows the company to keep using it safely?",a:["Installing the old OS directly on new hardware","Running the old OS in a virtual machine as a legacy application environment","Converting the application to a container","Using a cloud SaaS version of the OS"],c:1,e:"Application (legacy) virtualization runs the old operating system inside a VM on modern hardware, isolating it from the host and allowing the legacy application to continue working."},

// u7l2
{id:"u7l2-1",t:"u7l2",q:"A VM will host a file share that other computers on the office LAN must connect to directly. Which virtual network mode should be used?",a:["NAT","Host-only","Bridged","Internal only"],c:2,e:"Bridged networking connects the VM to the physical network as if it were another computer, giving it its own address that other devices can reach. NAT and host-only hide the VM."},
{id:"u7l2-2",t:"u7l2",q:"A malware analysis VM must be completely isolated from the company network and the internet but still communicate with the host. Which network mode is correct?",a:["Bridged","NAT","Bridged with a static IP","Host-only"],c:3,e:"Host-only networking creates a private virtual network between the VM and the host with no route to the LAN or internet, which is the safe configuration for malware analysis."},
{id:"u7l2-3",t:"u7l2",q:"Three VMs assigned 8 GB, 4 GB, and 4 GB of memory run on a laptop with 16 GB of RAM, and everything has become extremely slow. What is the cause?",a:["The host has no memory left for itself, so it is swapping","The virtual disks are dynamically expanding","The VMs are using bridged networking","Snapshots have been disabled"],c:0,e:"Guest memory cannot be oversubscribed safely. Allocating all 16 GB to guests leaves nothing for the host OS and hypervisor, which then swap to disk and stall every VM."},
{id:"u7l2-4",t:"u7l2",q:"Before applying an untested patch to a virtual server, what should the technician do so the change can be undone quickly?",a:["Convert the VM to a container","Take a snapshot of the VM","Switch the VM to NAT networking","Increase the VM's memory allocation"],c:1,e:"A snapshot records the VM's state so it can be reverted in seconds if the patch causes problems. Snapshots are not backups and should be merged after the test."},
{id:"u7l2-5",t:"u7l2",q:"Code running inside a guest VM exploits a hypervisor flaw to access the host and other guests. What is this attack called?",a:["VM sprawl","Multitenancy","VM escape","A snapshot collision"],c:2,e:"VM escape is a guest breaking out of its isolation to reach the host or other VMs. Keeping the hypervisor patched and avoiding untrusted VM images are the defenses."},

// u7l3
{id:"u7l3-1",t:"u7l3",q:"A company keeps its patient database in its own data center but uses a provider's cloud for public web servers, with the two connected. Which deployment model is this?",a:["Public cloud","Private cloud","Community cloud","Hybrid cloud"],c:3,e:"A hybrid cloud combines private infrastructure with public cloud resources, connected so workloads can be placed according to sensitivity and demand."},
{id:"u7l3-2",t:"u7l3",q:"Six regional hospitals jointly fund cloud infrastructure built to meet the healthcare regulations they all share. Which deployment model describes this?",a:["Community","Private","Hybrid","Public"],c:0,e:"A community cloud is shared by organizations with common requirements, such as regulatory compliance, giving them more control than a public cloud at lower cost than separate private clouds."},
{id:"u7l3-3",t:"u7l3",q:"A company rents virtual machines and storage from a provider and remains responsible for installing and patching the operating systems. Which service model is this?",a:["SaaS","IaaS","PaaS","DaaS"],c:1,e:"Infrastructure as a service provides virtual machines, storage, and networks; the customer manages everything from the operating system upward."},
{id:"u7l3-4",t:"u7l3",q:"Developers deploy their web application code to a provider-managed runtime and database without administering any servers. Which service model are they using?",a:["IaaS","SaaS","PaaS","Private cloud"],c:2,e:"Platform as a service supplies the operating system, runtime, and supporting services; developers manage only their code and data."},
{id:"u7l3-5",t:"u7l3",q:"Employees access the company's email and office applications entirely through a web browser, with the provider handling all servers and software updates. Which service model is this?",a:["IaaS","PaaS","VDI","SaaS"],c:3,e:"Software as a service delivers a finished application over the network. The customer manages only user accounts and data, and the provider manages everything else."},

// u7l4
{id:"u7l4-1",t:"u7l4",q:"An online retailer's cloud environment automatically adds web servers during a sale and removes them afterward, billing only for the hours used. Which cloud characteristic is demonstrated?",a:["Rapid elasticity","Multitenancy","File synchronization","Dedicated resources"],c:0,e:"Rapid elasticity is the automatic growth and shrinkage of capacity to match demand, which is what allows a business to handle a spike without owning hardware for its busiest day."},
{id:"u7l4-2",t:"u7l4",q:"A company's monthly cloud bill rose sharply after it restored a very large backup from cloud storage to its own data center. Which billing element caused this?",a:["Ingress charges","Egress charges","Elasticity fees","Multitenancy charges"],c:1,e:"Metered utilization bills data transfer out of the cloud (egress) per gigabyte, while data coming in (ingress) is usually free. Large restores or migrations out of a cloud incur egress costs."},
{id:"u7l4-3",t:"u7l4",q:"A financial firm requires that no other customer's workloads run on the same physical servers as its own. Which cloud option meets this requirement?",a:["Shared resources","Multitenant SaaS","Dedicated resources","Community cloud"],c:2,e:"Dedicated resources reserve physical hosts for one customer, providing isolation and predictable performance at a higher cost than shared, multitenant infrastructure."},
{id:"u7l4-4",t:"u7l4",q:"A single instance of a cloud application serves thousands of companies, each seeing only its own data. Which characteristic does this describe?",a:["Elasticity","High availability","File synchronization","Multitenancy"],c:3,e:"Multitenancy is the design that lets one system serve many customers (tenants) with their data logically separated, which is how SaaS providers achieve efficiency."},
{id:"u7l4-5",t:"u7l4",q:"A user deleted a document from a synced folder on a laptop, and it also disappeared from their phone and the company's shared cloud folder. What is the BEST way to get it back?",a:["Restore it from the cloud service's trash or version history","Re-create the document from memory","Turn off synchronization on the phone","Reinstall the sync client"],c:0,e:"File synchronization propagates deletions to every device. Cloud file services keep deleted files in a trash folder or version history for a period, which is the recovery path."},

// u8l1
{id:"u8l1-1",t:"u8l1",q:"A technician has questioned the user and identified recent changes on a PC that is behaving erratically. Before making any changes, what should the technician do?",a:["Reinstall the operating system","Back up the user's data","Replace the hard drive","Document the outcome"],c:1,e:"Step one of the troubleshooting method includes backing up before changes, because a fix can make things worse and the data must be protected first."},
{id:"u8l1-2",t:"u8l1",q:"A technician's theory that a faulty cable was causing a problem has been tested and proven wrong. According to the troubleshooting method, what is the NEXT step?",a:["Document the findings and close the ticket","Implement the original plan anyway","Establish a new theory of probable cause, or escalate","Verify full system functionality"],c:2,e:"When a theory fails testing, the method returns to establishing a new theory. If no theory can be confirmed, the technician escalates to someone with more expertise."},
{id:"u8l1-3",t:"u8l1",q:"After replacing a failed power supply, the technician confirms the PC boots. What should be done before closing the ticket?",a:["Reset the firmware to defaults","Reinstall the drivers","Take a snapshot","Verify full system functionality, implement preventive measures, and document"],c:3,e:"Steps five and six require confirming the whole system works (not just that it boots), adding prevention such as a surge protector or cleaning, and documenting the cause, fix, and outcome."},
{id:"u8l1-4",t:"u8l1",q:"A motherboard powers on but shows nothing on any display and gives no beeps. Which tool displays diagnostic codes that show where the firmware stopped?",a:["A POST card","A loopback plug","A multimeter","A cable tester"],c:0,e:"A POST card plugs into a slot or USB port and displays the firmware's progress codes, identifying the stage (memory, video, keyboard) where startup halted."},
{id:"u8l1-5",t:"u8l1",q:"Which tool quickly checks each output voltage of a desktop power supply and its power-good signal without a running system?",a:["A POST card","A power supply tester","A toner probe","An ESD strap"],c:1,e:"A PSU tester connects to the 24-pin and other connectors and shows each rail (3.3, 5, 12 V) and the power-good signal, making it the fastest check of a suspect supply."},

// u8l2
{id:"u8l2-1",t:"u8l2",q:"A desktop shows no lights and no fan movement when the power button is pressed. What should the technician check FIRST?",a:["The RAM seating","The CMOS battery","The wall outlet, power cord, and PSU switch","The CPU thermal paste"],c:2,e:"No power at all means starting at the source: the outlet, the cord at both ends, the power strip, and the supply's own switch and voltage selector, before suspecting internal parts."},
{id:"u8l2-2",t:"u8l2",q:"After a technician adds a second RAM module, the PC emits repeating short beeps at power-on and displays nothing. What is the MOST likely cause?",a:["The CPU has overheated","The CMOS battery is dead","The hard drive has failed","The new module is not seated correctly or is incompatible"],c:3,e:"Repeating beeps with no display point to memory. A newly installed module that is not fully seated or not supported by the board is the obvious cause given the recent change."},
{id:"u8l2-3",t:"u8l2",q:"A PC runs normally at idle but restarts a few minutes into any demanding task. Which two causes are MOST likely?",a:["Overheating or a failing power supply that sags under load","A bad keyboard or mouse","A wrong boot order or a missing driver","A full hard drive or fragmented files"],c:0,e:"Shutdowns tied to load point to thermal protection tripping or a power supply whose rails drop under demand. Check temperatures and test the supply under load."},
{id:"u8l2-4",t:"u8l2",q:"A workstation displays blue screen errors with different stop codes at random times, and no software or drivers have changed. What should the technician do FIRST?",a:["Reinstall the operating system","Run a memory test","Replace the motherboard","Update the firmware"],c:1,e:"Random crashes with varying codes and no recent changes point to hardware, most often faulty RAM. A memory test is a cheap, non-destructive first step."},
{id:"u8l2-5",t:"u8l2",q:"During an inspection, a technician notices several capacitors on a motherboard with domed tops and brown residue. What should be done?",a:["Clean the residue and continue using the board","Replace the CMOS battery","Replace the motherboard","Reapply thermal paste"],c:2,e:"Swollen or leaking capacitors indicate a failing board (or power supply). They cannot be reliably repaired in the field, so the board is replaced."},

// u8l3
{id:"u8l3-1",t:"u8l3",q:"During startup, a PC displays a S.M.A.R.T. failure warning for the system drive. What should the technician do?",a:["Disable S.M.A.R.T. in firmware to stop the message","Run a memory test","Defragment the drive","Back up the data and replace the drive"],c:3,e:"A S.M.A.R.T. failure prediction means the drive has crossed its own reliability thresholds. Treat it as a countdown: back up immediately and replace the drive."},
{id:"u8l3-2",t:"u8l3",q:"A PC reports 'bootable device not found' after a technician used a USB stick to run diagnostics. What should be checked FIRST?",a:["Whether the USB stick is still inserted and the boot order","Whether the RAM is seated","Whether the CMOS battery is dead","Whether the drive cable supports 6 Gb/s"],c:0,e:"A non-bootable USB device left inserted while it is first in the boot order produces exactly this message. Remove it and confirm the boot order before suspecting the drive."},
{id:"u8l3-3",t:"u8l3",q:"After a power outage, a server's RAID volume is missing and the operating system shows the member disks as separate, uninitialized drives. What should the technician do?",a:["Initialize the disks and restore from backup","Check the RAID controller and restore or import its configuration without initializing the disks","Replace all the drives","Convert the disks to dynamic disks"],c:1,e:"All drives do not fail simultaneously; a vanished array points to the controller, its configuration, driver, or cache battery. Initializing the disks would destroy the data that is still on them."},
{id:"u8l3-4",t:"u8l3",q:"A RAID 5 array on a small server is running but shows a degraded status with one amber bay light. Users report slow file access. What is the correct action?",a:["Wait until the weekend to avoid disruption","Reboot the server to clear the warning","Replace the failed drive promptly so the array can rebuild, after confirming a recent backup","Remove the failed drive and run the array as RAID 0"],c:2,e:"A degraded RAID 5 has no fault tolerance and slower performance. Replacing the failed member starts the rebuild; a second failure before then would lose the array, so confirm backups and act quickly."},
{id:"u8l3-5",t:"u8l3",q:"An SSD that is 97 percent full has become noticeably slow at writing files. What should the technician recommend?",a:["Defragment the SSD weekly","Switch the drive to IDE mode","Replace the SATA cable","Free up space and ensure TRIM is enabled"],c:3,e:"SSDs slow down when few free blocks remain and when TRIM is not maintaining them. Keeping 10 to 20 percent free restores performance; defragmentation is unnecessary and adds wear."},

// u8l4
{id:"u8l4-1",t:"u8l4",q:"A monitor displays 'No signal' while the connected PC is clearly running. What should the technician check FIRST?",a:["The monitor's selected input source and the cable connections","The graphics card's driver version","The monitor's color gamut","The PC's boot order"],c:0,e:"The cheapest and most common causes of no image are a monitor on the wrong input and a loose or damaged cable. Both are checked before any hardware is suspected."},
{id:"u8l4-2",t:"u8l4",q:"A laptop's screen is very dark, but a faint image of the desktop can be seen when a flashlight is aimed at it. Which component has failed?",a:["The LCD panel","The backlight or inverter","The graphics processor","The digitizer"],c:1,e:"An image that is present but unlit means the panel and graphics path work and only the light source behind the panel has failed. On CCFL screens that is often the inverter; on LED screens, the backlight or its driver."},
{id:"u8l4-3",t:"u8l4",q:"A conference room projector shuts itself off about fifteen minutes into every meeting. What is the MOST likely cause?",a:["The input source is wrong","The keystone setting is incorrect","Overheating due to a clogged filter or poor ventilation","The HDMI cable does not carry audio"],c:2,e:"Projectors that run for a while and then shut down are tripping thermal protection. A dust-clogged filter or blocked vents are the usual reasons; a lamp near end of life can also cause it."},
{id:"u8l4-4",t:"u8l4",q:"A television connected to a PC over HDMI shows video but produces no sound, while the PC's speakers still play audio. What should be done?",a:["Replace the HDMI cable with a DVI cable","Change the monitor's refresh rate","Enable Secure Boot","Select the television as the playback device in the operating system's sound settings"],c:3,e:"HDMI carries audio, but the OS sends sound to whichever output is selected. Choosing the TV as the playback device routes audio over HDMI; DVI would carry no audio at all."},
{id:"u8l4-5",t:"u8l4",q:"An OLED display used for digital signage shows a permanent faint outline of a logo that was displayed for months. What is this condition?",a:["Burn-in","Dead pixels","A refresh rate mismatch","Incorrect chroma display"],c:0,e:"Burn-in is permanent image retention on OLED or plasma screens caused by static content. Pixel shifting and screen savers prevent it; there is no repair."},

// u8l5
{id:"u8l5-1",t:"u8l5",q:"A user reports that the back cover of their phone is lifting away from the case and the screen no longer sits flat. What should the technician advise?",a:["Press the cover back into place and apply adhesive","Stop using the phone, do not charge it, and have the swollen battery replaced","Perform a factory reset","Update the operating system"],c:1,e:"A lifting cover or screen is the classic sign of a swollen battery. The device should not be used, charged, or pressed on, and the battery must be replaced and recycled properly."},
{id:"u8l5-2",t:"u8l5",q:"A phone was dropped into a sink full of water and retrieved immediately. What should the user do FIRST?",a:["Plug it in to see whether it still charges","Place it in the freezer","Power it off and avoid charging it while it dries","Run a diagnostic app"],c:2,e:"Water conducts and corrodes, and applying power accelerates the damage. Power off, remove the SIM and case, and dry the device thoroughly with airflow for days before attempting to use it."},
{id:"u8l5-3",t:"u8l5",q:"A tablet registers touches the user did not make, but only while it is charging from a car adapter. What is the MOST likely cause?",a:["The digitizer is cracked","The battery health is poor","The operating system needs a factory reset","The charger is producing electrical noise that confuses the digitizer"],c:3,e:"Phantom touches that appear only while charging point to a noisy, low-quality charger. Testing with a known-good adapter confirms it; a cracked digitizer would misbehave all the time."},
{id:"u8l5-4",t:"u8l5",q:"A user's phone shows no cellular service, no Wi-Fi networks, and no Bluetooth devices after a flight. What should be checked FIRST?",a:["Whether airplane mode is still enabled","Whether the SIM card has expired","Whether the phone has malware","Whether location services are on"],c:0,e:"Airplane mode disables every radio at once, which matches all three symptoms and is commonly left on after a flight. It is the quickest check before any deeper diagnosis."},
{id:"u8l5-5",t:"u8l5",q:"A three-year-old phone shuts down when the battery indicator still shows around 30 percent and has become sluggish. What is the MOST likely cause?",a:["Too many saved Wi-Fi networks","Poor battery health that also triggers performance throttling","A damaged charging port","An outdated carrier settings file"],c:1,e:"An aged battery cannot supply peak current, causing shutdowns at a displayed charge level and OS-imposed throttling. Checking the battery health percentage confirms it; replacement is the fix."},

// u8l6
