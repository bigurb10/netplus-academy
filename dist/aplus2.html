FRA.questions.push(
// u1l1
{id:"u1l1-1",t:"u1l1",q:"A technician must format a 128 GB flash drive to carry 9 GB video files between a Windows PC and a Mac. Which filesystem should be used?",a:["NTFS","exFAT","FAT32","ext4"],c:1,e:"exFAT has no 4 GB file limit and is read and written by Windows, macOS, and Linux. FAT32 caps files at 4 GB, NTFS is read-only on macOS without extra software, and ext4 is Linux-only."},
{id:"u1l1-2",t:"u1l1",q:"Which filesystem is the default for the Windows system drive and supports per-file permissions and encryption?",a:["exFAT","ReFS","NTFS","APFS"],c:2,e:"NTFS provides permissions, EFS encryption, compression, and journaling. ReFS is for resilience on servers and workstations, APFS is Apple's filesystem, and exFAT has no permissions."},
{id:"u1l1-3",t:"u1l1",q:"A school wants inexpensive laptops that run web applications, store data in the cloud, and are managed from a central console. Which operating system fits?",a:["iPadOS","macOS","Windows Pro","Chrome OS"],c:3,e:"Chrome OS on Chromebooks is browser-centered, cloud-first, and managed through the Google Admin console, which suits schools. The others are heavier or tied to specific hardware."},
{id:"u1l1-4",t:"u1l1",q:"A company still runs an operating system version that no longer receives security updates from its vendor. What is this condition called?",a:["End-of-life","An update limitation","A feature update","A compatibility concern"],c:0,e:"End-of-life means the vendor has stopped supporting the version with patches. It is listed as a vulnerability in the security domain and the answer is upgrade, replace, or isolate."},
{id:"u1l1-5",t:"u1l1",q:"A user cannot install a 64-bit application on an older PC. What is the MOST likely reason?",a:["The PC uses the FAT32 filesystem","The PC runs a 32-bit operating system","The application requires Chrome OS","The PC has a TPM 2.0 chip"],c:1,e:"A 64-bit application requires a 64-bit operating system. A 64-bit OS can run 32-bit applications, but a 32-bit OS cannot run 64-bit ones."},

// u1l2
{id:"u1l2-1",t:"u1l2",q:"A new laptop shipped with Windows 11 Home cannot be joined to the company's Active Directory domain. What is the BEST solution?",a:["Reinstall Windows 11 Home","Enable the TPM in firmware","Upgrade the edition to Windows 11 Pro","Switch the PC to a workgroup"],c:2,e:"Home editions cannot join a domain. An edition upgrade to Pro (by entering a Pro key) is done in place and adds domain join, BitLocker, Remote Desktop hosting, and Group Policy Editor."},
{id:"u1l2-2",t:"u1l2",q:"Which Windows 10 edition supports the ReFS filesystem and up to four physical processors?",a:["Home","Pro","N version","Pro for Workstations"],c:3,e:"Pro for Workstations adds ReFS, persistent memory, up to four CPUs, and a 6 TB RAM limit for high-end workstations."},
{id:"u1l2-3",t:"u1l2",q:"A user wants coworkers to connect to their Windows PC with Remote Desktop, but the option to enable it is missing. What explains this?",a:["The PC runs Windows Home, which cannot host Remote Desktop","Remote Desktop requires a 64-bit processor","Remote Desktop is only available in N editions","The PC is joined to a domain"],c:0,e:"All editions include the Remote Desktop client, but only Pro and higher can act as a Remote Desktop host. Home users need an edition upgrade or a third-party remote tool."},
{id:"u1l2-4",t:"u1l2",q:"A technician needs to move a workstation from 32-bit Windows 10 to 64-bit Windows 11. Which installation type is required?",a:["In-place upgrade","Clean install","Repair installation","Edition upgrade by product key"],c:1,e:"There is no in-place path from a 32-bit to a 64-bit installation. The technician must back up data and perform a clean install of the 64-bit version."},
{id:"u1l2-5",t:"u1l2",q:"A PC fails the Windows 11 upgrade check even though it has a recent processor and 8 GB of RAM. Which two firmware-related requirements should the technician check?",a:["BitLocker and Group Policy","A 720p display and a Microsoft account","TPM 2.0 and UEFI with Secure Boot","ReFS and a second processor"],c:2,e:"Windows 11 requires TPM 2.0 and UEFI firmware capable of Secure Boot. On many machines these exist but are disabled in firmware settings."},

// u1l3
{id:"u1l3-1",t:"u1l3",q:"A technician must install Windows on 40 identical desktops in a new office as efficiently as possible. Which method is BEST?",a:["A clean install from a USB drive on each PC","Restoring each PC's recovery partition","A repair installation on each PC","Image deployment"],c:3,e:"Image deployment prepares one reference machine, captures its image, and copies it to many PCs, often over the network, producing identical systems quickly."},
{id:"u1l3-2",t:"u1l3",q:"A new laptop is shipped directly to a remote employee, who signs in on first boot and the device enrolls in management and configures itself without IT touching it. What is this called?",a:["Zero-touch deployment","Multiboot","Remote network installation","Recovery partition restore"],c:0,e:"Zero-touch deployment (for example, an Autopilot-style program) lets a device provision itself from the vendor's service on first boot with no technician involvement."},
{id:"u1l3-3",t:"u1l3",q:"During Windows setup on a new PC, no drives appear in the disk selection screen. What should the technician do?",a:["Convert the disk from GPT to MBR","Load third-party storage drivers from a USB drive","Switch the boot method to PXE","Run a repair installation"],c:1,e:"When setup cannot see the disk, the storage or RAID controller needs a driver the installer lacks. The Load driver option reads it from removable media."},
{id:"u1l3-4",t:"u1l3",q:"Which partition style is required to boot Windows on a UEFI system and supports disks larger than 2 TB?",a:["MBR","Dynamic","GPT","Extended"],c:2,e:"GPT (GUID partition table) is required for UEFI boot, allows up to 128 partitions, and has no 2 TB limit. MBR is the legacy BIOS scheme limited to four primary partitions and 2 TB."},
{id:"u1l3-5",t:"u1l3",q:"Before performing an in-place upgrade from Windows 10 to Windows 11 on an office PC, what should the technician do FIRST?",a:["Convert the disk to MBR","Format the drive","Disable Secure Boot","Back up the user's files and settings and verify application and hardware compatibility"],c:3,e:"Upgrade considerations begin with a backup of files and preferences and a check of application, driver, and hardware compatibility, so a failed or incompatible upgrade does not cost data or productivity."},

// u1l4
{id:"u1l4-1",t:"u1l4",q:"A video editing application lists a dedicated graphics card with 6 GB of VRAM as a requirement. The office PCs use integrated graphics. What is the correct conclusion?",a:["The PCs need a dedicated graphics card or replacement workstations","Updating the graphics driver will meet the requirement","Adding system RAM will satisfy the VRAM requirement","The application will run in compatibility mode"],c:0,e:"Integrated graphics borrows system RAM and does not provide dedicated VRAM. Meeting the requirement means installing a graphics card or using a workstation that has one."},
{id:"u1l4-2",t:"u1l4",q:"A vendor provides software as an ISO file. What is the first step to install it on a Windows PC?",a:["Burn the ISO to a DVD","Mount the ISO as a virtual drive and run the installer","Rename the ISO to .exe","Extract the ISO with a compression tool"],c:1,e:"Windows mounts an ISO as a virtual drive with a right-click; the installer inside then runs normally. Burning media is unnecessary."},
{id:"u1l4-3",t:"u1l4",q:"Before deploying a new application company-wide, a technician documents required training, expected downtime, and changes to daily workflows. Which impact category is this?",a:["Device","Network","Operation","Business"],c:2,e:"Operational impact covers how people work: training, downtime, workflows, and support. Device impact is machine resources, network impact is bandwidth and ports, and business impact is cost and compliance."},
{id:"u1l4-4",t:"u1l4",q:"A new employee's account exists in the cloud office suite, but the desktop applications report they are unlicensed. What should be checked FIRST?",a:["Whether the PC has a 64-bit OS","Whether the PC is on a metered connection","Whether the ISO was mounted correctly","Whether a license has been assigned to the user"],c:3,e:"Cloud suites assign licenses per user from a pool. Without an assigned or valid license, the apps and mailbox refuse to work even though the account exists."},
{id:"u1l4-5",t:"u1l4",q:"Users want to sign in to the cloud productivity suite with the same username and password they use on the office domain. Which feature provides this?",a:["Identity synchronization","Licensing assignment","Sync and folder settings","Image deployment"],c:0,e:"Identity synchronization copies directory accounts to the cloud tenant so one identity works both on-premises and in the cloud."},

// u2l1
{id:"u2l1-1",t:"u2l1",q:"A service failed to start overnight and a technician wants to know why. Which tool shows the error?",a:["Disk Management (diskmgmt.msc)","Event Viewer (eventvwr.msc)","Certificate Manager (certmgr.msc)","Task Scheduler (taskschd.msc)"],c:1,e:"Event Viewer's System log records service failures with the reason. Application errors are in the Application log and logon audits in the Security log."},
{id:"u2l1-2",t:"u2l1",q:"A technician installs a second hard drive, but it does not appear in File Explorer. Which tool should be used to make it usable?",a:["Device Manager","Performance Monitor","Disk Management","Task Manager"],c:2,e:"Disk Management initializes a new disk (MBR or GPT), creates a partition, formats it, and assigns a drive letter."},
{id:"u2l1-3",t:"u2l1",q:"After a driver update, a network adapter stopped working. Which tool lets the technician roll back to the previous driver?",a:["Group Policy Editor","Local Users and Groups","Resource Monitor","Device Manager"],c:3,e:"Device Manager (devmgmt.msc) shows the adapter, flags problems with a yellow triangle, and offers Roll Back Driver when a previous driver exists."},
{id:"u2l1-4",t:"u2l1",q:"A workstation boots slowly because many programs launch at sign-in. Which Task Manager tab is used to disable them?",a:["Startup","Performance","Processes","Services"],c:0,e:"The Startup tab lists programs that run at sign-in with their startup impact and allows each to be disabled. This function moved to Task Manager from msconfig."},
{id:"u2l1-5",t:"u2l1",q:"A technician needs to enforce a minimum password length on a standalone Windows Pro workstation that is not on a domain. Which tool is used?",a:["Certificate Manager (certmgr.msc)","Group Policy Editor (gpedit.msc)","Task Scheduler (taskschd.msc)","Disk Management (diskmgmt.msc)"],c:1,e:"The Local Group Policy Editor sets account policies such as password length and lockout on a single machine; in a domain, the same settings come from domain Group Policy Objects."},

// u2l2
{id:"u2l2-1",t:"u2l2",q:"A vendor requires proof that a PC boots in UEFI mode with Secure Boot enabled. Which utility shows this without rebooting?",a:["Disk Cleanup (cleanmgr)","System Configuration (msconfig)","System Information (msinfo32)","Registry Editor (regedit)"],c:2,e:"System Information's summary lists BIOS Mode (Legacy or UEFI) and Secure Boot State, along with hardware, drivers, and software inventory."},
{id:"u2l2-2",t:"u2l2",q:"A file cannot be deleted because Windows reports it is in use. Which tool identifies the process holding the file open?",a:["Disk Defragmenter (dfrgui)","Disk Cleanup (cleanmgr)","System Information (msinfo32)","Resource Monitor (resmon)"],c:3,e:"Resource Monitor's CPU tab can search associated handles for a file name and show which process has it open, so the process can be ended."},
{id:"u2l2-3",t:"u2l2",q:"A technician wants a PC to boot into safe mode on its next restart without pressing keys during startup. Which tool provides this option?",a:["System Configuration (msconfig)","Resource Monitor (resmon)","Registry Editor (regedit)","Disk Defragmenter (dfrgui)"],c:0,e:"System Configuration's Boot tab has a Safe boot option (Minimal, Alternate shell, or Network). Uncheck it afterward or the PC keeps booting to safe mode."},
{id:"u2l2-4",t:"u2l2",q:"After an upgrade to Windows 11, a laptop's small SSD is nearly full. Which action frees the most space?",a:["Run Disk Defragmenter on the SSD","Run Disk Cleanup and remove the previous Windows installation","Export the registry","Disable the paging file"],c:1,e:"Disk Cleanup's Clean up system files option removes the previous Windows installation (Windows.old), often 20 GB or more, along with update leftovers. Defragmenting an SSD frees nothing and adds wear."},
{id:"u2l2-5",t:"u2l2",q:"A support article instructs the technician to change a value under HKEY_LOCAL_MACHINE. What should be done before making the change?",a:["Defragment the drive","Disable all Microsoft services","Export the registry key or create a restore point","Run Disk Cleanup"],c:2,e:"A wrong registry edit can prevent Windows from booting. Exporting the key (or creating a restore point) provides a way back."},

// u2l3
{id:"u2l3-1",t:"u2l3",q:"Which command displays a Windows PC's MAC address and DNS servers?",a:["ping -a","hostname","netstat -n","ipconfig /all"],c:3,e:"ipconfig /all extends the basic output with the physical (MAC) address, DHCP server, lease times, and DNS servers for each adapter."},
{id:"u2l3-2",t:"u2l3",q:"A user reports an intermittent connection to a remote server. Which command shows packet loss at each hop over time?",a:["pathping","tracert","nslookup","net use"],c:0,e:"pathping performs a trace and then sends packets to every hop for several minutes, reporting loss per hop, which pinpoints a flaky link."},
{id:"u2l3-3",t:"u2l3",q:"A hard drive reports read errors. Which command scans for bad sectors and recovers readable information?",a:["format /q","chkdsk /r","diskpart clean","sfc /scannow"],c:1,e:"chkdsk /r locates bad sectors and recovers readable data, implying /f to fix filesystem errors. diskpart clean erases the partition table and format destroys data."},
{id:"u2l3-4",t:"u2l3",q:"A Group Policy change is not taking effect on a workstation. Which command applies policy immediately?",a:["gpresult /r","whoami /groups","gpupdate /force","net user"],c:2,e:"gpupdate /force refreshes and reapplies all Group Policy settings now. gpresult /r reports which policies have been applied."},
{id:"u2l3-5",t:"u2l3",q:"Windows reports that system files may be corrupted. Which command verifies and repairs protected system files?",a:["chkdsk /f","robocopy /mir","winver","sfc /scannow"],c:3,e:"The System File Checker (sfc /scannow) verifies protected system files and replaces corrupted copies. If it cannot repair them, DISM /online /cleanup-image /restorehealth repairs the source first."},

// u2l4
{id:"u2l4-1",t:"u2l4",q:"A legacy application cannot reach the internet because it uses the system proxy, which changed. Which Control Panel applet holds the proxy configuration?",a:["Internet Options","Network and Sharing Center","Programs and Features","Devices and Printers"],c:0,e:"Internet Options, Connections tab, LAN settings holds the system proxy used by many applications. Settings, Network and Internet, Proxy changes the same values."},
{id:"u2l4-2",t:"u2l4",q:"A scanner's software crashes after a recent Windows update. Where can the technician uninstall that specific update?",a:["System, Advanced system settings","Programs and Features, View installed updates","File Explorer Options","Indexing Options"],c:1,e:"Programs and Features lists installed updates and allows a problem update to be uninstalled; Settings, Windows Update, View update history offers the same."},
{id:"u2l4-3",t:"u2l4",q:"A user receives a file named invoice.pdf that is actually an executable, but the .exe extension was not visible. Which setting should be changed?",a:["Show hidden files, folders, and drives","Hide protected operating system files","Hide extensions for known file types (turn it off)","Launch folder windows in a separate process"],c:2,e:"With extensions hidden, invoice.pdf.exe displays as invoice.pdf. Turning off Hide extensions for known file types in File Explorer Options exposes the real extension."},
{id:"u2l4-4",t:"u2l4",q:"Which power state writes the contents of memory to disk and powers the computer off completely, so no work is lost if the battery dies?",a:["Sleep","Standby","Fast startup","Hibernate"],c:3,e:"Hibernate saves RAM to hiberfil.sys and powers off. Sleep and standby keep RAM powered and drain the battery; fast startup only hibernates the kernel session at shutdown."},
{id:"u2l4-5",t:"u2l4",q:"A USB audio interface disconnects whenever the PC has been idle for a while. Which power setting should be disabled?",a:["USB selective suspend","Fast startup","Hibernate","Choose what closing the lid does"],c:0,e:"USB selective suspend lets Windows power down idle USB devices. Disabling it in the advanced power settings keeps the device connected."},

// u2l5
{id:"u2l5-1",t:"u2l5",q:"A technician wants to stop programs from running automatically when a USB drive is inserted. Which Settings category contains this option?",a:["Apps","Devices","Privacy","Personalization"],c:1,e:"AutoPlay is under Settings, Devices. Turning it off prevents media from launching content automatically, which is also a security best practice."},
{id:"u2l5-2",t:"u2l5",q:"A user's laptop is tethered to a phone hotspot with a limited data plan. Which Settings option limits background downloads and updates on that connection?",a:["Airplane mode","Proxy","Metered connection","Data usage reset"],c:2,e:"Marking the connection as metered under Network and Internet tells Windows to limit background data, defer non-critical updates, and pause syncing."},
{id:"u2l5-3",t:"u2l5",q:"A user wants to sign in with a fingerprint instead of a password. Which Settings category is used?",a:["System, About","Ease of Access","Privacy","Accounts, Sign-in options"],c:3,e:"Sign-in options under Accounts configure PIN, Windows Hello face and fingerprint, security keys, and dynamic lock."},
{id:"u2l5-4",t:"u2l5",q:"A videoconferencing app cannot access the webcam, although the camera works in other apps. Where should the technician look?",a:["Settings, Privacy, Camera","Settings, Devices, Printers and scanners","Settings, Gaming","Settings, Time and Language"],c:0,e:"App permissions for the camera, microphone, and location are under Privacy. The specific app's toggle is likely off."},
{id:"u2l5-5",t:"u2l5",q:"Which Settings category contains Windows Update, Windows Security, Backup, and Recovery (Reset this PC)?",a:["System","Update and Security","Apps","Accounts"],c:1,e:"Update and Security groups Windows Update, Delivery Optimization, Windows Security, Backup, Troubleshoot, Recovery, and Activation. Windows 11 splits some into their own categories with the same contents."},

// u2l6
{id:"u2l6-1",t:"u2l6",q:"A workstation can reach every device on the local subnet but nothing on the internet. Which client setting is MOST likely wrong?",a:["The DNS server","The DHCP scope","The default gateway","The proxy exceptions"],c:2,e:"The default gateway is the router for all non-local traffic. If it is missing or on the wrong subnet, local devices work but everything beyond the router fails."},
{id:"u2l6-2",t:"u2l6",q:"Which command maps drive letter S to the share named data on server FS01 and reconnects it at every sign-in?",a:["net user S: \\\\FS01\\data /add","nslookup FS01 data","robocopy \\\\FS01\\data S: /mir","net use S: \\\\FS01\\data /persistent:yes"],c:3,e:"net use maps a drive letter to a UNC path; /persistent:yes makes the mapping survive reboots. The GUI equivalent is Map network drive with Reconnect at sign-in."},
{id:"u2l6-3",t:"u2l6",q:"Other computers on the office LAN cannot see or connect to a new PC, although the PC can browse the internet. What should be checked FIRST?",a:["Whether the PC's network profile is set to Public","Whether the PC has a static IP address","Whether IPv6 is disabled","Whether the proxy is set to automatic"],c:0,e:"The Public profile turns off network discovery and file sharing and applies the strictest firewall rules. Switching the network to Private allows the PC to be seen and reached on a trusted LAN."},
{id:"u2l6-4",t:"u2l6",q:"A small business PC needs to become a member of the company's Active Directory domain. Which two conditions must be met?",a:["The PC uses a static IP address and a public network profile","The PC runs Windows Pro or higher and its DNS points to a domain controller","The PC runs Windows Home and has BitLocker enabled","The PC has a metered connection and a mapped drive"],c:1,e:"Domain join requires an edition of Pro or above, and the PC must locate a domain controller through DNS. Addressing method and firewall profile do not decide eligibility."},
{id:"u2l6-5",t:"u2l6",q:"A remote employee's laptop connects to the company VPN, but internal servers can be reached only by IP address, not by name. What is the MOST likely cause?",a:["The firewall profile is set to Private","The laptop is using DHCP","The VPN connection is not using the internal DNS servers","The proxy is set to manual"],c:2,e:"Names resolving only outside the company indicate the VPN adapter is not handing out or using the internal DNS servers. Reaching servers by IP proves the tunnel itself works."},

// u3l1
{id:"u3l1-1",t:"u3l1",q:"A Mac user downloaded an application and, after opening the file, sees a window containing the application icon and a folder shortcut but nothing seems installed. Which file type is this and what should the user do?",a:["A .pkg; run the installer wizard","A .zip; extract it with Disk Utility","An .app; move it to the Trash","A .dmg; drag the application into the Applications folder and eject the image"],c:3,e:"A .dmg mounts as a virtual disk showing the app and an Applications shortcut. Dragging the app into Applications installs it; the image is then ejected."},
{id:"u3l1-2",t:"u3l1",q:"Where are a macOS user's personal preferences and application support files stored?",a:["/Users/name/Library","/Library","/System","/Applications"],c:0,e:"The user Library (~/Library, hidden by default) holds that user's preferences, caches, and application support. /Library is system-wide and /System is the protected OS."},
{id:"u3l1-3",t:"u3l1",q:"Which macOS feature provides full-disk encryption?",a:["Keychain","FileVault","Time Machine","Spotlight"],c:1,e:"FileVault encrypts the entire startup disk. Keychain stores passwords, Time Machine backs up, and Spotlight searches."},
{id:"u3l1-4",t:"u3l1",q:"An application on a Mac has stopped responding. Which key combination opens the tool to end it?",a:["Command-Space","Ctrl-Alt-Delete","Command-Option-Esc","Command-Tab"],c:2,e:"Command-Option-Esc opens Force Quit Applications. Command-Space opens Spotlight and Command-Tab switches apps."},
{id:"u3l1-5",t:"u3l1",q:"Which Apple mechanism delivers small urgent security fixes to macOS between full operating system updates?",a:["Time Machine","Continuity","Mission Control","Rapid Security Response"],c:3,e:"Rapid Security Response patches are lightweight security updates applied quickly without waiting for a full macOS release."},

// u3l2
{id:"u3l2-1",t:"u3l2",q:"A Linux script reports 'Permission denied' when run. Which command makes it executable?",a:["chmod +x script.sh","chown +x script.sh","mount script.sh","sudo grep script.sh"],c:0,e:"chmod changes permissions; +x adds execute for the owner (or all classes). chown changes ownership, not permissions."},
{id:"u3l2-2",t:"u3l2",q:"A technician needs to install a package on an Ubuntu workstation. Which command sequence is correct?",a:["sudo dnf install package","sudo apt update && sudo apt install package","su apt get package","fsck install package"],c:1,e:"Ubuntu and Debian use apt; updating the package index and then installing with sudo is the standard sequence. dnf is for Fedora and Red Hat."},
{id:"u3l2-3",t:"u3l2",q:"Which Linux file stores hashed user passwords and is readable only by root?",a:["/etc/passwd","/etc/hosts","/etc/shadow","/etc/fstab"],c:2,e:"/etc/shadow holds password hashes and aging information with root-only permissions; /etc/passwd lists accounts and is world-readable."},
{id:"u3l2-4",t:"u3l2",q:"A Linux server reports that a filesystem is full. Which command shows free space on each mounted filesystem?",a:["du -sh","top","ls -la","df -h"],c:3,e:"df -h reports free and used space per mounted filesystem. du -sh shows the space consumed by a specific directory, which is the next step to find the culprit."},
{id:"u3l2-5",t:"u3l2",q:"Which command shows the IP addresses assigned to a modern Linux system's interfaces?",a:["ip addr","ipconfig /all","dig","curl"],c:0,e:"The ip command replaced ifconfig; ip addr (or ip a) lists interfaces and addresses, and ip route shows the gateway. ipconfig is the Windows command."}
);

// u4l1
{id:"u4l1-1",t:"u4l1",q:"A company wants to stop unauthorized people from slipping into the building behind badge-carrying employees. Which physical control BEST addresses this?",a:["Bollards at the entrance","An access control vestibule","A magnetometer","Additional exterior lighting"],c:1,e:"An access control vestibule is a two-door space where the second door opens only after the first closes and the person is verified, one person at a time. It defeats tailgating. Bollards stop vehicles, magnetometers find metal, and lighting deters."},
{id:"u4l1-2",t:"u4l1",q:"Which physical security measure is designed to prevent a vehicle from being driven into a building entrance?",a:["Badge readers","Motion sensors","Bollards","Equipment locks"],c:2,e:"Bollards are short heavy posts placed in front of entrances and walkways to stop vehicles. The other options control people, not cars."},
{id:"u4l1-3",t:"u4l1",q:"Management wants a record of exactly who entered the server room and at what time. Which control provides this?",a:["A keyed door lock","A fence around the property","Cable locks on the servers","A badge reader on the server room door"],c:3,e:"Badge readers log each entry by identity and time. A keyed lock records nothing, a fence is perimeter security, and cable locks protect equipment from removal."},
{id:"u4l1-4",t:"u4l1",q:"Which of the following authentication methods is an example of something you are?",a:["A palm print scanner","A smart card with a PIN","A mobile digital key","A key fob"],c:0,e:"Biometrics such as palm print, fingerprint, retina, face, and voice are something you are. Key fobs, smart cards, and mobile digital keys are something you have; the PIN is something you know."},
{id:"u4l1-5",t:"u4l1",q:"Laptops keep disappearing from an open-plan office during the day even though the building has badge access. Which control is the MOST direct fix?",a:["A retina scanner at the front door","Cable locks and locked cabinets","Bollards in the parking lot","Disabling SSID broadcast"],c:1,e:"When the building layer is already controlled, the next ring inward is the device. Equipment locks such as cable locks and locked cabinets stop the laptops themselves from being carried off."},

// u4l2
{id:"u4l2-1",t:"u4l2",q:"A receptionist's account was found to be a member of the local Administrators group on every PC. Which security principle does this violate?",a:["Zero Trust","Single sign-on","Principle of least privilege","Just-in-time access"],c:2,e:"Least privilege gives each account only the rights its job requires. A receptionist does not need administrator rights, and granting them lets any malware running as that user take over the machine."},
{id:"u4l2-2",t:"u4l2",q:"Which authentication method generates a six-digit code that changes every 30 seconds based on a shared secret and the current time?",a:["SMS","Email OTP","SAML","TOTP"],c:3,e:"A time-based one-time password (TOTP) is computed from a shared secret and the clock, so authenticator apps and hardware tokens produce the same code without a network. SMS and email deliver codes; SAML is an SSO standard."},
{id:"u4l2-3",t:"u4l2",q:"Employees log in once with their corporate credentials and gain access to a dozen cloud applications without signing in again. Which standard most commonly makes this web single sign-on possible?",a:["SAML","LDAP","TACACS+","WPA3"],c:0,e:"SAML lets an identity provider assert to web applications that a user is authenticated, enabling single sign-on across services. LDAP queries a directory, TACACS+ authenticates device administrators, and WPA3 is wireless encryption."},
{id:"u4l2-4",t:"u4l2",q:"A company wants administrators to receive elevated rights only when they request them for a specific task, for a limited time, with the session recorded. Which solution provides this?",a:["Mobile device management","Privileged access management with just-in-time access","Data loss prevention","An access control list"],c:1,e:"PAM vaults privileged credentials and grants just-in-time access for a bounded period while recording the session, removing standing administrator rights. MDM manages devices and DLP watches data leaving."},
{id:"u4l2-5",t:"u4l2",q:"A spreadsheet containing customer credit card numbers was emailed to a personal address without being blocked. Which control was missing?",a:["Multifactor authentication","Zero Trust network access","Data loss prevention","A directory service"],c:2,e:"DLP inspects data leaving by email, upload, USB, or print, recognizes sensitive content such as card numbers, and blocks or logs it. MFA protects logins, not outbound data."},

// u4l3
{id:"u4l3-1",t:"u4l3",q:"A technician is configuring a new access point and all client devices support the latest standards. Which wireless security setting should be selected?",a:["WPA2 with TKIP","WEP with a 128-bit key","WPA with TKIP","WPA3"],c:3,e:"WPA3 is the current standard, using SAE for the handshake, forward secrecy, and protected management frames. TKIP and WEP are deprecated and insecure."},
{id:"u4l3-2",t:"u4l3",q:"Which protocol does an access point use to forward a user's credentials to a central authentication server for enterprise Wi-Fi, typically over UDP ports 1812 and 1813?",a:["RADIUS","TACACS+","LDAP","Kerberos"],c:0,e:"RADIUS is the central authentication service for 802.1X wireless, VPNs, and network access, using UDP 1812 for authentication and 1813 for accounting. TACACS+ uses TCP 49 for device administration; Kerberos issues tickets in a domain."},
{id:"u4l3-3",t:"u4l3",q:"Network engineers want every command run on the switches to be authorized and logged per administrator, with the whole authentication packet encrypted. Which protocol fits?",a:["RADIUS","TACACS+","WPA2-Enterprise","SAE"],c:1,e:"TACACS+ separates authentication, authorization, and accounting, encrypts the entire packet, and supports per-command authorization for network device administration over TCP 49. RADIUS encrypts only the password field."},
{id:"u4l3-4",t:"u4l3",q:"Domain users on one workstation cannot authenticate, and the technician notices the PC's clock is 20 minutes off. Which authentication protocol is most likely failing?",a:["TACACS+","RADIUS","Kerberos","WPA2-Personal"],c:2,e:"Kerberos tickets carry timestamps, and Active Directory rejects clients whose clocks differ from the domain controller by more than about five minutes. Synchronizing time restores logins."},
{id:"u4l3-5",t:"u4l3",q:"What is the main difference between WPA2-Personal and WPA2-Enterprise?",a:["Enterprise uses TKIP while Personal uses AES","Personal requires certificates on every client","Enterprise does not encrypt traffic","Personal uses a shared passphrase; Enterprise authenticates each user through 802.1X and a RADIUS server"],c:3,e:"Personal mode uses one pre-shared key for all devices. Enterprise mode uses 802.1X with per-user credentials checked by RADIUS, giving each session a unique key and letting one user be revoked without changing everyone's passphrase."},

// u4l4
{id:"u4l4-1",t:"u4l4",q:"A user installed what appeared to be a free video codec, and the machine later began accepting remote commands from an attacker. What type of malware was the codec?",a:["A trojan","A boot sector virus","A virus","Adware"],c:0,e:"A trojan disguises itself as useful software and, once run, installs a backdoor or drops other malware. It does not spread by itself; the user installs it."},
{id:"u4l4-2",t:"u4l4",q:"A workstation is hot, its fans run constantly, and Task Manager shows an unfamiliar process using nearly 100 percent of the CPU. Which malware type is MOST likely?",a:["A keylogger","A cryptominer","Stalkerware","Spyware"],c:1,e:"Cryptominers hijack CPU and GPU cycles to mine cryptocurrency, producing heat, fan noise, slowness, and a process consuming all resources. Keyloggers and spyware are designed to stay quiet."},
{id:"u4l4-3",t:"u4l4",q:"A machine continues to behave abnormally and hide processes even though several antivirus scans report it clean. What is the MOST reliable remediation?",a:["Run the scans again in the morning","Clear the browser cache","Reinstall the operating system from known-good media","Disable the firewall and rescan"],c:2,e:"A rootkit hides from the operating system's own tools, so scanners running on the infected OS cannot see it. Reimaging or reinstalling the OS is the reliable cure, after backing up and scanning the data."},
{id:"u4l4-4",t:"u4l4",q:"An attack runs PowerShell commands launched from a document macro and never writes an executable to disk. Which security tool is BEST suited to detect it?",a:["Signature-based antivirus","A pop-up blocker","A degausser","Endpoint detection and response"],c:3,e:"Fileless malware lives in memory and uses legitimate tools, so file signature scanning misses it. EDR watches process behavior on the endpoint and can detect and isolate such activity."},
{id:"u4l4-5",t:"u4l4",q:"What is the difference between EDR and MDR?",a:["MDR is EDR operated and monitored by an outside security provider","EDR works only on mobile devices","MDR is a hardware appliance while EDR is software","EDR filters email while MDR filters web traffic"],c:0,e:"Managed detection and response is endpoint detection and response run by a third-party team that watches the alerts around the clock. XDR extends detection across email, network, cloud, and servers."},

// u4l5
{id:"u4l5-1",t:"u4l5",q:"A user receives a text message claiming a package is on hold and asking them to tap a link and confirm payment details. What kind of attack is this?",a:["Vishing","Smishing","Whaling","Shoulder surfing"],c:1,e:"Smishing is phishing delivered by SMS text message. Vishing is by voice call, whaling targets executives, and shoulder surfing is watching a screen or keyboard."},
{id:"u4l5-2",t:"u4l5",q:"A crafted email is sent specifically to the company's chief financial officer, referencing a real acquisition and asking for an urgent wire transfer. Which term BEST describes this?",a:["Smishing","Dumpster diving","Whaling","An evil twin attack"],c:2,e:"Whaling is spear phishing aimed at executives, usually about money or legal matters. If the sender's mailbox is genuinely compromised, it is also business email compromise."},
{id:"u4l5-3",t:"u4l5",q:"At a coffee shop, a laptop sees two networks with the shop's name, one with a much stronger signal, and after connecting a certificate warning appears for the mail server. What is happening?",a:["A zero-day attack","A brute-force attack","A SQL injection attack","An evil twin providing an on-path position"],c:3,e:"An evil twin is a rogue access point using the legitimate SSID so victims connect through the attacker, who then sits on-path and intercepts traffic. The certificate warning is the interception being noticed."},
{id:"u4l5-4",t:"u4l5",q:"An exploit is used against a vulnerability the vendor has not yet released a patch for. What is this called?",a:["A zero-day attack","A dictionary attack","Spoofing","An insider threat"],c:0,e:"A zero-day exploits a flaw with no available patch, and often no signature, so behavior-based defenses and least privilege are the main protections until a fix ships."},
{id:"u4l5-5",t:"u4l5",q:"Which of the following is listed as a vulnerability rather than an attack?",a:["Cross-site scripting","An end-of-life operating system","A distributed denial of service","Business email compromise"],c:1,e:"Vulnerabilities are weaknesses: non-compliant, unpatched, and unprotected systems, end-of-life software, and BYOD. Cross-site scripting, DDoS, and BEC are attacks that exploit weaknesses."},

// u5l1
{id:"u5l1-1",t:"u5l1",q:"A folder is shared with the share permission Full Control for Everyone, and the NTFS permission for the Sales group is Read. What can a Sales user do when accessing the folder over the network?",a:["Full Control","Modify files","Read only","Nothing; access is denied"],c:2,e:"Over the network the effective permission is the most restrictive combination of share and NTFS permissions. Full Control at the share layer and Read at the NTFS layer results in Read."},
{id:"u5l1-2",t:"u5l1",q:"A user belongs to a group that is allowed Modify on a folder and to another group that is denied Write on the same folder. What is the result?",a:["The user can write because Allow was set first","The user can write because Modify includes Write","The user loses all access to the folder","The user cannot write because an explicit Deny overrides Allow"],c:3,e:"Allow permissions accumulate across groups, but an explicit Deny always overrides Allow. The user keeps read access from Modify but cannot write."},
{id:"u5l1-3",t:"u5l1",q:"A technician moves a file from the Finance folder to the Public folder on the same NTFS volume, and the file still has Finance permissions. Why?",a:["Moving within the same volume retains the file's existing permissions","NTFS permissions cannot be changed after a file is created","The Public folder has inheritance disabled","The file has the read-only attribute set"],c:0,e:"A move within one NTFS volume keeps the file's permissions. A copy, or a move to a different volume, inherits the destination folder's permissions. Copy the file instead or reset inheritance."},
{id:"u5l1-4",t:"u5l1",q:"Which account type should ordinary employees use for daily work on a Windows PC?",a:["Administrator","Standard user","Guest","Power user"],c:1,e:"Standard accounts cannot install most software or change system settings without an administrator's credentials, which limits what malware running as the user can do. Guest should stay disabled; Power Users is a legacy group."},
{id:"u5l1-5",t:"u5l1",q:"A user right-clicks a program and chooses Run as administrator, and a consent dialog appears before the program starts. Which Windows feature displays this prompt?",a:["BitLocker","Windows Defender Firewall","User Account Control","Encrypting File System"],c:2,e:"User Account Control prompts for consent or administrator credentials whenever a task needs elevated rights, so nothing changes the system silently. It should never be turned off."},

// u5l2
{id:"u5l2-1",t:"u5l2",q:"A company wants the entire drive of each laptop encrypted so a stolen laptop's data cannot be read in another computer. Which feature should be used?",a:["EFS","NTFS permissions","Folder redirection","BitLocker"],c:3,e:"BitLocker encrypts the whole volume, normally keyed to the TPM, so the disk is unreadable outside the original boot chain. EFS encrypts individual files for one user and NTFS permissions do not protect a drive moved to another machine."},
{id:"u5l2-2",t:"u5l2",q:"After a motherboard replacement, a laptop boots to a screen asking for a 48-digit key. What is being requested?",a:["The BitLocker recovery key","The Windows product key","The Active Directory password","The TPM owner password"],c:0,e:"The TPM on the new board cannot release the BitLocker key because the boot measurements changed, so BitLocker asks for the recovery key that should have been saved to Active Directory, a Microsoft account, a file, or paper."},
{id:"u5l2-3",t:"u5l2",q:"Two managers share one workstation, and each needs files that the other cannot open even with local administrator rights. Which feature meets this need?",a:["BitLocker To Go","EFS","Share permissions","A guest account"],c:1,e:"EFS encrypts files or folders with a key tied to the user's certificate, so other users, including administrators, cannot read them. BitLocker To Go protects removable drives, and permissions can be overridden by an administrator."},
{id:"u5l2-4",t:"u5l2",q:"A user transferred from Sales to Marketing still receives the Sales department's desktop restrictions after logging in. Which Active Directory action fixes this?",a:["Assign the user a home folder","Enable BitLocker on the user's PC","Move the user object to the Marketing organizational unit","Rename the user account"],c:2,e:"Group Policy is linked to organizational units, so a user object in the Sales OU keeps receiving Sales policies. Moving the object to the Marketing OU applies Marketing's policies; group memberships should be updated as well."},
{id:"u5l2-5",t:"u5l2",q:"Users lose their Documents folder contents whenever their PC is reimaged. Which Active Directory feature stores those folders on a server while they still appear local to the user?",a:["Domain join","A login script","A security group","Folder redirection"],c:3,e:"Folder redirection is a Group Policy setting that points Documents, Desktop, and other folders to a server share, so files follow the user to any PC and are backed up centrally."},

// u5l3
{id:"u5l3-1",t:"u5l3",q:"Which characteristic contributes MOST to the strength of a password?",a:["Its length","Changing it every 30 days","Including the user's initials","Using the same password on every site so it is remembered"],c:0,e:"Length is the dominant factor because each added character multiplies the search space. Complexity and uniqueness help; reuse is a weakness."},
{id:"u5l3-2",t:"u5l3",q:"A PC became infected the moment a found USB drive was inserted. Which hardening setting would have prevented the program from launching?",a:["Enabling the guest account","Disabling AutoRun","Setting a screensaver lock","Applying an account expiration date"],c:1,e:"AutoRun and AutoPlay let inserted media launch programs automatically. Disabling them is a standard hardening step against malware on removable media."},
{id:"u5l3-3",t:"u5l3",q:"A contractor's account was still active and used months after the contract ended. Which account management setting addresses this?",a:["Failed-attempts lockout","Restricting login times","Account expiration dates","Disabling unused services"],c:2,e:"Applying an expiration date to temporary and contractor accounts makes them stop working automatically on the scheduled day, without relying on someone remembering to disable them."},
{id:"u5l3-4",t:"u5l3",q:"Logs show thousands of failed password attempts against one user account over a single night. Which control BEST mitigates this attack?",a:["Disabling SSID broadcast","Enabling AutoPlay","Renaming the administrator account","A failed-attempts lockout policy"],c:3,e:"A lockout after a small number of failed attempts stops online brute-force and dictionary attacks by freezing the account for a period. The other options do not address repeated guesses."},
{id:"u5l3-5",t:"u5l3",q:"A thief booted a stolen desktop from a USB drive and copied its files. Which pair of controls would have prevented this?",a:["A BIOS/UEFI supervisor password with a locked boot order, and data-at-rest encryption","A screensaver lock and a strong Windows password","Disabling the guest account and restricting login times","A password manager and a content filter"],c:0,e:"A firmware supervisor password prevents changing the boot order to bypass Windows, and full-disk encryption makes the data unreadable even if the drive is removed. Windows passwords alone do not protect data from an alternate boot."},

// u5l4
{id:"u5l4-1",t:"u5l4",q:"Which mobile screen lock method provides no real security?",a:["Fingerprint","Swipe","A six-digit PIN","Facial recognition"],c:1,e:"A swipe unlock performs no authentication at all. A pattern is weak, a PIN is acceptable when long enough, and biometrics are strong with a PIN fallback."},
{id:"u5l4-2",t:"u5l4",q:"An employee reports that a corporate phone containing company email was left in a taxi and cannot be recovered. What should the technician do to protect the data?",a:["Change the Wi-Fi passphrase","Install antivirus on the user's replacement phone","Issue a remote wipe through the MDM console","Disable SSID broadcast in the office"],c:2,e:"After locating and locking fail to recover the device, a remote wipe erases it so the data is unreadable. MDM or the platform's locator service performs it; the replacement is restored from remote backup."},
{id:"u5l4-3",t:"u5l4",q:"A company allows personal phones to access work email but wants to be able to erase only the company data if an employee leaves. Which approach provides this?",a:["Corporate-owned devices with full wipe","Blocking application updates","Disabling device encryption","BYOD with an MDM work profile and selective wipe"],c:3,e:"Under a BYOD policy, MDM installs a managed work profile or container. A selective wipe removes the company's data and apps while leaving personal photos and messages untouched."},
{id:"u5l4-4",t:"u5l4",q:"Which mobile security feature erases or locks the device after a set number of incorrect passcode entries?",a:["Failed log-in attempts restrictions","Content filtering","A configuration profile","Remote backup"],c:0,e:"Failed-attempt restrictions lock the device for increasing periods or wipe it after repeated wrong passcodes, giving a lost device time to be located and wiped before its passcode can be guessed."},
{id:"u5l4-5",t:"u5l4",q:"Before a phone may receive the company's mail profile it must run a current OS version, have encryption and a passcode enabled, and must not be jailbroken. What are these conditions called?",a:["Locator application settings","Profile security requirements","Patch management","Antimalware definitions"],c:1,e:"Profile security requirements are the minimum standards a device must meet to be enrolled and receive the work profile. Non-compliant devices are blocked until they meet the bar."},

// u5l5
{id:"u5l5-1",t:"u5l5",q:"Which router setting should be disabled because it lets any device on the LAN open inbound ports automatically?",a:["DHCP","WPA3","UPnP","Content filtering"],c:2,e:"Universal Plug and Play allows programs and devices to open router ports without the administrator's involvement, which malware exploits. It should be turned off and any needed ports forwarded manually."},
{id:"u5l5-2",t:"u5l5",q:"A small office wants visitors to have internet access without being able to reach the office file server or printers. Which router feature provides this?",a:["Port forwarding","MAC filtering","Disabling SSID broadcast","An isolated guest network"],c:3,e:"A guest SSID with client isolation gives visitors internet access on a segment separated from the LAN, so they cannot reach internal devices."},
{id:"u5l5-3",t:"u5l5",q:"What is the FIRST configuration change a technician should make on a newly installed SOHO router?",a:["Change the default administrator password","Enable the DMZ host","Set the channel to 6","Turn on remote management"],c:0,e:"Default credentials are printed on the device and published online, so changing the administrator password comes first, followed by a firmware update and wireless encryption settings."},
{id:"u5l5-4",t:"u5l5",q:"A security camera recorder inside the office must accept connections from the internet on one specific port. Which router feature accomplishes this with the least exposure?",a:["Enabling UPnP","Port forwarding of that single port to the recorder","Placing the recorder as the DMZ host","Disabling the firewall"],c:1,e:"Port forwarding maps one public port to one internal device and port, exposing only that service. A DMZ host forwards every port to the device, and UPnP hands control to the devices themselves."},
{id:"u5l5-5",t:"u5l5",q:"Which two wireless settings are considered weak security measures because they are easily bypassed?",a:["WPA3 and a long passphrase","Guest isolation and firmware updates","Disabling SSID broadcast and MAC address filtering","HTTPS management and disabling remote management"],c:2,e:"The SSID is still visible in wireless traffic when broadcast is off, and MAC addresses are visible and easily cloned. Neither replaces strong encryption and a strong passphrase."},

// u5l6
{id:"u5l6-1",t:"u5l6",q:"A technician downloads a browser installer and wants to confirm it has not been altered since the vendor published it. What should be done?",a:["Run the installer and check for errors","Install it in private browsing mode","Scan the file with a pop-up blocker","Compare the file's computed hash with the hash published by the vendor"],c:3,e:"Hashing produces a fingerprint of the file. If the computed SHA-256 matches the vendor's published value, the bytes are identical; a mismatch means corruption or tampering."},
{id:"u5l6-2",t:"u5l6",q:"Which browser mode prevents history, cookies, and cached pages from being saved on the local computer after the window closes?",a:["Private browsing mode","Browser data synchronization","Secure DNS","Ad blocking"],c:0,e:"Private browsing keeps no local traces once the session ends. It does not hide activity from the network, the employer, or the website."},
{id:"u5l6-3",t:"u5l6",q:"A user's browser shows a warning that a shopping site's certificate is not valid. What should the user do?",a:["Click through the warning and continue shopping","Not proceed, and investigate the cause before entering any information","Disable the pop-up blocker","Clear the cache and click through"],c:1,e:"A certificate warning means the certificate is expired, mismatched, untrusted, or the connection is being intercepted. Proceeding on a site that takes payments risks an on-path attack."},
{id:"u5l6-4",t:"u5l6",q:"Which browser setting encrypts name lookups so they cannot be read or altered on the local network, but may bypass the organization's DNS-based content filtering?",a:["A proxy server","Pop-up blocking","Secure DNS","Password manager"],c:2,e:"Secure DNS (DNS over HTTPS) encrypts DNS queries to a resolver. Because it sidesteps the company's DNS filter, some organizations disable it by policy."},
{id:"u5l6-5",t:"u5l6",q:"After installing a free utility, a user's browser opens to an unfamiliar search page and searches are redirected. What is the MOST likely cause?",a:["An expired certificate","A disabled ad blocker","Browser data synchronization","An untrusted extension or potentially unwanted program"],c:3,e:"Bundled installers add untrusted extensions and PUPs that change the home page, search engine, and proxy. Remove the extension, check the proxy setting, reset the browser, and scan."},

// u5l7
{id:"u5l7-1",t:"u5l7",q:"Which data destruction method is ineffective on solid-state drives?",a:["Degaussing","Incineration","Shredding","Drilling"],c:0,e:"Degaussing destroys data on magnetic media by scrambling the magnetic field. Solid-state drives store charge in flash cells, so a degausser does nothing to them."},
{id:"u5l7-2",t:"u5l7",q:"Fifty laptops are being donated to a school. Which method makes the drives safe to reuse?",a:["A quick format","An erase or wipe using overwrite or the drive's secure erase","Drilling the platters","Removing the drive labels"],c:1,e:"Wiping by overwrite or the drive's secure erase command sanitizes the drive while leaving it usable. A quick format only rewrites the file table and leaves data recoverable."},
{id:"u5l7-3",t:"u5l7",q:"An auditor asks for proof that retired drives containing patient data were destroyed. Which document should the technician produce?",a:["The router configuration backup","A screenshot of the quick format","The certificate of destruction from the third-party vendor","The software license agreement"],c:2,e:"A certificate of destruction or recycling lists each serial number, the method, and the date, signed by the vendor. It is the accepted proof for regulatory audits."},
{id:"u5l7-4",t:"u5l7",q:"A user performed a quick format on a drive before selling the PC. What is the risk?",a:["The drive will no longer boot Windows","The partition table becomes GPT","The drive's firmware is erased","The data remains recoverable with common tools"],c:3,e:"A quick format rewrites only the filesystem structures; the data blocks are untouched and easily recovered. A verified wipe or secure erase is required before disposal or resale."},
{id:"u5l7-5",t:"u5l7",q:"A failed hard drive that held payroll records cannot be powered on or wiped. What should be done with it?",a:["Physically destroy it through shredding or drilling and record the serial number","Place it in the regular trash","Reformat it on another PC","Store it indefinitely in an unlocked drawer"],c:0,e:"A drive that cannot be sanitized must be physically destroyed. Shredding through a certified vendor, or drilling in-house per policy, followed by documentation, meets both data and e-waste requirements."},

// u5l8
{id:"u5l8-1",t:"u5l8",q:"A user reports constant pop-ups and a disabled antivirus. According to the malware removal procedure, what should the technician do FIRST?",a:["Quarantine the system","Investigate and verify the malware symptoms","Disable System Restore","Educate the user"],c:1,e:"Step one is to investigate and verify the symptoms so the problem is confirmed as malware rather than a hardware or configuration fault. Quarantine is step two."},
{id:"u5l8-2",t:"u5l8",q:"The technician has confirmed that a workstation is infected. What is the NEXT step in the malware removal procedure?",a:["Run a full antivirus scan immediately","Create a restore point","Quarantine the system by disconnecting it from the network","Reinstall the operating system"],c:2,e:"Once malware is confirmed, the system is quarantined, typically by unplugging the network cable and disabling Wi-Fi, so it cannot spread or reach its command server."},
{id:"u5l8-3",t:"u5l8",q:"Why does the malware removal procedure call for disabling System Restore on a Windows Home machine before remediation?",a:["To free disk space for the scan","To speed up the boot process","Because antivirus cannot run while System Restore is enabled","So infected restore points are deleted and cannot reinfect the machine"],c:3,e:"Restore points can contain infected files that scanners cannot clean. Disabling System Restore deletes them, preventing a later restore from bringing the malware back."},
{id:"u5l8-4",t:"u5l8",q:"Malware has been removed and Windows and application updates have been applied. What should the technician do NEXT?",a:["Enable System Restore and create a restore point","Disable System Restore","Quarantine the system","Investigate and verify symptoms"],c:0,e:"After remediation and updates, System Restore is re-enabled and a clean restore point is created, capturing the machine in its known-good state. Educating the user follows."},
{id:"u5l8-5",t:"u5l8",q:"Which step is the LAST in the seven-step malware removal procedure?",a:["Schedule scans and run updates","Educate the end user","Remediate the infected system","Disable System Restore"],c:1,e:"User education is the final step: explaining what happened and how to avoid it. Without it the same click brings the same malware back."}
