u1l1: `## Why a biomed needs anatomy at all
You will never diagnose anyone. But a nurse will say "the art line waveform is damped," a physician will ask whether the monitor can show a lead II rhythm during a proximal femoral procedure, and a purchase request will call for a device to treat "hypothermia post-cardiac arrest." Every one of those sentences is built from the vocabulary in this lesson. Learn the vocabulary and the rest of the course, and the job, gets easier.

## The body as a building
Think of the body as a building assembled from the ground up:
\`\`\`
cells      the bricks
tissues    walls made of one kind of brick: epithelial (lining), connective (support), muscle, nervous
organs     rooms with a purpose: heart, lungs, brain, skin, kidneys
systems    the building's services: circulatory (plumbing), respiratory (ventilation),
           nervous (wiring), gastrointestinal (kitchen and waste), endocrine (thermostat), musculoskeletal (frame)
\`\`\`

## Directions: a map with two axes and a depth
Anatomical position is standing, facing you, palms forward. Every direction word is relative to that.
\`\`\`
anterior / posterior   front / back                 the sternum is anterior, the spine is posterior
superior / inferior    above / below                the head is superior to the chest
medial / lateral       toward / away from midline   the nose is medial, the ears are lateral
proximal / distal      near / far from the trunk    the elbow is proximal to the wrist
supine / prone         face up / face down          patients on the OR table are usually supine
\`\`\`
Planes cut the body into halves: sagittal (left and right), coronal or frontal (front and back), transverse (top and bottom). Imaging reports and OR table positions use these words constantly.

## Word parts: a decoder ring
Medical words are assembled from parts, and the parts always mean the same thing. Decode from the end.
\`\`\`
Prefix (how)          Root (what)             Suffix (what happened)
brady-  slow          cardi   heart           -itis     inflammation
tachy-  fast          pulmon  lung            -ectomy   removal
hyper-  too much      nephr   kidney          -ostomy   an opening
hypo-   too little    hepat   liver           -oscopy   looking in
a-/an-  without       neur    nerve           -graphy   recording (the act)
dys-    difficult     gastr   stomach         -gram     the recording itself
                      derm    skin            -algia    pain
                      oste    bone            -emia     in the blood
                      hem     blood
                      my      muscle
\`\`\`
Worked examples: bradycardia = slow heart. Nephrectomy = kidney removal. Electrocardiogram = the record of the heart's electricity. Hypoxemia = too little oxygen in the blood. Gastroscopy = looking into the stomach. Apnea = without breathing. Dyspnea = difficult breathing.

## Vital signs: the numbers on every monitor
\`\`\`
Heart rate          60 to 100 bpm        under 60 bradycardia, over 100 tachycardia
Respiratory rate    12 to 20 per minute  apnea = none
Blood pressure      about 120/80 mmHg    hypertension high, hypotension low
SpO2                95 to 100 percent    hypoxemia below
Temperature         37 C / 98.6 F        fever above about 38 C
\`\`\`
When a monitor is "reading wrong," the first question is whether the number is even plausible. A heart rate of 300 or an SpO2 of 40 on a comfortable patient is a device or lead problem, not a patient problem.

## The skin, from the technician's side
Three layers: epidermis on top (dead, dry, a good insulator), dermis below (blood, nerves, sweat glands), subcutaneous fat beneath. It matters to you three ways:
- **Impedance**: dry epidermis resists electricity, which is why electrodes need skin prep and conductive gel, and why a shock through dry skin is far less dangerous than through wet.
- **Burns**: electrosurgery return pads, warming blankets, and hot lamps all injure skin when contact or temperature is wrong.
- **Pressure**: beds, cuffs, and probes left too long cause pressure injuries; SCD sleeves and cuff cycling matter.

## How the exam asks it
- "The wrist is ___ to the elbow." Distal.
- "Which term means slow heart rate?" Bradycardia.
- "A patient lying face down is in which position?" Prone.
- "Which layer of skin provides most of its electrical resistance?" The epidermis.

## What to memorize
- Cells, tissues, organs, systems. Anterior, posterior, superior, inferior, medial, lateral, proximal, distal, supine, prone.
- The prefix, root, suffix table. Decode from the suffix backward.
- Vital sign ranges.`,

u1l2: `## The machine most of your equipment serves
Monitors, blood pressure devices, defibrillators, pacemakers, and balloon pumps all exist because of this one organ. If you understand the heart as a two-stage pump with an electrical timer, every one of those devices becomes obvious.

## Two pumps in one
\`\`\`
   from the body (deoxygenated)                 to the body (oxygenated)
        |                                             ^
   vena cava                                        aorta
        v                                             |
  [RIGHT ATRIUM] -- tricuspid --> [RIGHT VENTRICLE]   [LEFT VENTRICLE] <-- mitral -- [LEFT ATRIUM]
                                        |                  ^
                                pulmonary valve        aortic valve (between LV and aorta)
                                        v                  |
                                 pulmonary artery   pulmonary veins
                                        v                  ^
                                      [ LUNGS ] ------------
\`\`\`
The right side is the low-pressure pump to the lungs. The left side is the high-pressure pump to the body, which is why the left ventricle has the thickest wall and why arterial pressure is what monitors measure. Four valves keep blood moving one way: tricuspid and mitral between atria and ventricles, pulmonary and aortic at the exits.

## The electrical timer
A heartbeat is an electrical event first and a mechanical event second.
\`\`\`
SA node (right atrium) fires ......................... the natural pacemaker, 60 to 100 per minute
   -> atria depolarize and squeeze .................... P WAVE
   -> AV node pauses about 0.1 s ....................... the PR segment; lets the ventricles fill
   -> bundle of His -> bundle branches -> Purkinje ..... fast wiring to the ventricles
   -> ventricles depolarize and squeeze ................ QRS COMPLEX
   -> ventricles repolarize (reset) .................... T WAVE
\`\`\`
An ECG electrode on the skin sees the sum of all that electrical activity. Place electrodes on the right arm, left arm, and left leg and you have **Einthoven's triangle**; the voltage between each pair is a lead: I (LA minus RA), II (LL minus RA), III (LL minus LA). Lead II looks along the heart's main electrical axis, which is why it is the default monitoring lead.

## Pressure, and the two terms the outline names
Systole is the ventricle squeezing; pressure in the arteries peaks. Diastole is relaxation; pressure falls to a floor. "120 over 80" is peak over floor.

**Korotkoff sounds.** Wrap a cuff, pump it above systolic so the artery is squeezed shut, then let it down slowly with a stethoscope below the cuff. When cuff pressure drops just under systolic, blood squirts through in pulses and you hear tapping: that first sound is systolic. As the cuff falls further, flow becomes continuous and the sounds fade; the pressure where they disappear is diastolic. Automated monitors do not listen; they measure the tiny cuff oscillations instead (oscillometry), but the term Korotkoff is on the outline because that is what the numbers mean.

**Mean arterial pressure.** The average pressure driving blood into organs. Because the heart spends about twice as long in diastole as systole, the average sits closer to the diastolic number: MAP = diastolic + (systolic minus diastolic) / 3. For 120/80: 80 + 40/3 = 93. Oscillometric monitors actually measure MAP directly and derive the other two.

**The dicrotic notch.** On an arterial line waveform, the pressure rises sharply, peaks, and falls. Partway down the fall there is a small bump: the aortic valve slamming shut and a little blood rebounding. That bump is the dicrotic notch. A crisp notch means the line and transducer are transmitting the waveform faithfully. A rounded waveform with no notch is overdamped (air bubble, clot, loose connection), and it reads systolic too low.

\`\`\`
pressure
   ^      peak (systolic)
   |     /\\
   |    /  \\   <- dicrotic notch (aortic valve closes)
   |   /    \\_/\\
   |  /         \\___
   | /              \\____ diastolic floor
   +----------------------------> time
\`\`\`

## Cardiac output
Heart rate times stroke volume, about 70 beats x 70 mL, roughly 5 liters per minute. Everything the body does depends on it, and it is what a balloon pump and a pacemaker try to protect.

## When it goes wrong, in monitor terms
\`\`\`
Bradycardia               rate under 60; pacemakers fix it
Tachycardia               rate over 100
Atrial fibrillation       irregular rhythm, no P waves; synchronized cardioversion
Ventricular fibrillation  chaotic squiggle, no output; defibrillate immediately
Asystole                  flat line; CPR and drugs, not a shock
Myocardial infarction     blocked coronary artery, muscle dies; ST changes on the ECG
Heart failure             weak pump; fluid backs up into the lungs
\`\`\`

## How the exam asks it
- "Which wave represents ventricular depolarization?" QRS.
- "The first Korotkoff sound corresponds to which pressure?" Systolic.
- "What causes the dicrotic notch?" Closure of the aortic valve.
- "Which chamber pumps blood to the body?" Left ventricle.
- "MAP for a pressure of 120/90?" 90 + 30/3 = 100.

## What to memorize
- Blood path: body, RA, RV, lungs, LA, LV, body. Valves: tricuspid, pulmonary, mitral, aortic.
- SA, AV, His, branches, Purkinje. P atria, QRS ventricles, T reset.
- First Korotkoff sound systolic, last diastolic. MAP = DBP + PP/3. Dicrotic notch = aortic valve closure.`,

u1l3: `## Bellows, not a pump
The lungs do not push air. The diaphragm and chest wall expand the chest like bellows, pressure inside drops below the room, and air falls in. That single fact explains why ventilators are dangerous in a way that breathing is not: a ventilator pushes, and pushing too hard injures lungs. It is why every ventilator has pressure alarms.

## The path of air
\`\`\`
nose and mouth -> pharynx -> larynx (voice box) -> trachea -> right and left bronchi
   -> bronchioles (smaller and smaller) -> alveoli (about 300 million tiny sacs)
                                              wrapped in capillaries: the exchange surface
\`\`\`
An endotracheal tube goes through the larynx into the trachea; a tube that slips too far usually enters the right bronchus because it branches more steeply. Capnography would still show CO2; a chest X-ray or breath sounds would show one lung ventilating.

## Three things that can fail separately
This is the concept that makes monitors make sense.
\`\`\`
Ventilation    moving air in and out                 measured by rate, tidal volume, EtCO2
Oxygenation    getting oxygen onto hemoglobin        measured by SpO2, arterial blood gas
Perfusion      circulating that blood to tissues     measured by blood pressure, cardiac output
\`\`\`
A patient on a perfectly working ventilator can still be hypoxic if the lungs are full of fluid (oxygenation failure) or if the heart is not pumping (perfusion failure). Conversely, EtCO2 dropping to zero with a working ventilator means either the circuit disconnected or circulation stopped, because CO2 only reaches the lungs if blood is flowing. That is why capnography is used to confirm CPR is effective.

## The volumes
\`\`\`
Tidal volume (VT)       one normal breath              about 500 mL; ventilator 6 to 8 mL/kg ideal weight
Minute volume (VE)      VT x rate                      500 mL x 12 = 6 L/min
Vital capacity          max exhale after max inhale    about 4.5 L
Residual volume         what stays after full exhale   about 1.2 L; lungs never fully empty
FVC                     forced vital capacity          the spirometry number
FEV1                    volume out in the first second normal FEV1/FVC about 0.7 to 0.8;
                                                       lower means obstruction (asthma, COPD)
\`\`\`
Worked example: a 70 kg patient at 7 mL/kg gets a tidal volume of 490 mL; at a rate of 14, minute volume is 6.9 L/min. If the rate is raised to 20, minute volume rises to 9.8 L/min and EtCO2 falls, because more CO2 is being blown off.

## The gas numbers
- **SpO2** is the percentage of hemoglobin carrying oxygen, 95 to 100 normal. It measures oxygenation, not ventilation; a patient on supplemental oxygen can have a fine SpO2 while barely breathing.
- **EtCO2** is the CO2 concentration at the end of exhalation, 35 to 45 mmHg normal. It measures ventilation (and perfusion). High means underventilated; low means overventilated, disconnected, or not perfusing.
- **FiO2** is the fraction of inspired oxygen: 0.21 in room air, up to 1.0. Oxygen analyzers verify it.

## Positive pressure and its price
A ventilator delivers gas under pressure through the circuit. Peak pressure rises when the airway is narrowed, secretions block, the patient coughs, or the tube is kinked: the high-pressure alarm. Pressure falls when the circuit leaks or disconnects: the low-pressure alarm. **PEEP**, a few centimeters of water held at the end of exhalation, keeps alveoli from collapsing.

## When it goes wrong
\`\`\`
Asthma, COPD      narrowed airways, air trapping; low FEV1/FVC; wheezing; high peak pressures on a ventilator
Pneumonia         alveoli fill with fluid; oxygenation fails while ventilation may be fine
Apnea             no breathing; the ventilator's apnea alarm; sleep apnea treated with CPAP
Hypoxia           too little oxygen; hypercapnia: too much CO2; both show on the monitor
\`\`\`

## How the exam asks it
- "Which measurement reflects ventilation rather than oxygenation?" EtCO2.
- "Normal tidal volume for an adult?" About 500 mL, 6 to 8 mL/kg on a ventilator.
- "What is minute volume?" Tidal volume times respiratory rate.
- "Normal breathing is which kind of pressure?" Negative; ventilators use positive.

## What to memorize
- Airway: trachea, bronchi, bronchioles, alveoli. Diaphragm drives negative-pressure breathing.
- Ventilation (EtCO2, VT, rate) versus oxygenation (SpO2) versus perfusion (BP).
- VT 500 mL, rate 12 to 20, SpO2 95 to 100, EtCO2 35 to 45, FEV1/FVC about 0.7 to 0.8.`,

u1l4: `## The body's wiring, and why it responds to yours
Every nerve signal and every muscle contraction is electrical. That is the reason a 60 Hz shock makes muscles clamp, the reason an ECG can be recorded from the skin, and the reason electrosurgery is possible at all. Learn the biology and the electrical safety rules stop being arbitrary.

## The parts
\`\`\`
CENTRAL NERVOUS SYSTEM
  Brain
    cerebrum      thinking, sensing, voluntary movement, speech
    cerebellum    balance, coordination
    brainstem     breathing, heart rate, blood pressure, consciousness   (damage here is fatal)
  Spinal cord     the trunk line; injury blocks everything below the level
PERIPHERAL NERVOUS SYSTEM
  sensory nerves  in, from skin and organs
  motor nerves    out, to muscles
  AUTONOMIC
    sympathetic       fight or flight: heart rate up, BP up, pupils wide, gut slows
    parasympathetic   rest and digest: heart rate down, gut active  (the vagus nerve)
\`\`\`
The autonomic system is why a frightened or hurting patient's heart rate climbs on the monitor, and why pressing on the carotid or vagal stimulation slows it. Anesthesia and many drugs work through these branches.

## How a nerve fires
A resting neuron holds a small voltage across its membrane, about minus 70 millivolts. A stimulus opens channels, the voltage flips positive for a millisecond (the **action potential**), and that pulse travels down the fiber to the next cell or to a muscle. Muscle fibers do the same thing and then contract.

Now the safety connection. An external current at 50 or 60 Hz changes direction slowly enough that nerve and muscle membranes respond to each cycle as if it were a stimulus. That is why:
- a few milliamps tingles (sensory nerves firing),
- 10 to 20 mA causes let-go failure (motor nerves fire, muscles clamp),
- 100 mA or so fibrillates the heart (cardiac cells fire chaotically).
Above roughly 100 kHz, membranes cannot follow the reversals, so current passes through tissue producing heat but no stimulation. Electrosurgical units run at 300 kHz to 3 MHz for exactly that reason: hundreds of milliamps cut and coagulate without contracting a single muscle.

## Recording the nervous system
\`\`\`
EEG      scalp electrodes, 10-20 placement system    brain rhythms in microvolts
         delta < 4 Hz deep sleep | theta 4-8 | alpha 8-13 relaxed, eyes closed | beta > 13 alert
EMG      needle or surface electrodes                muscle electrical activity; neuromuscular disease
Nerve conduction   stimulate, time the response      slowed conduction = nerve damage
Evoked potentials  flash, click, or shock, then EEG  the brain's response; used during spine surgery
\`\`\`
EEG signals are tens of microvolts, ten to a hundred times smaller than ECG, so EEG amplifiers need even more gain and even better noise rejection.

## The frame and the motors
The skeleton's roughly 206 bones give shape, protect organs, store minerals, and make blood cells in the marrow. Joints connect bones; ligaments tie bone to bone; tendons tie muscle to bone. Three muscle types:
\`\`\`
skeletal   voluntary, attached to bone         moves the body; what EMG usually records
smooth     involuntary, in vessels and gut     controls blood pressure and digestion
cardiac    involuntary but electrically timed  the heart; the only muscle that fibrillates
\`\`\`

## Devices that touch these systems
Physical therapy stimulators deliver controlled current: TENS for pain, neuromuscular stimulators to contract muscle. Traction and continuous passive motion machines move joints. Nerve stimulators in the OR check how deeply a paralytic drug is working. Each delivers current on purpose, so its output, timer, and leakage are checked at PM.

## How the exam asks it
- "Which branch of the autonomic system increases heart rate?" Sympathetic.
- "Why does ESU current not cause muscle contraction?" Its frequency is too high for nerves to respond.
- "Which EEG frequency band is associated with a relaxed, awake state?" Alpha, 8 to 13 Hz.
- "Which part of the brain controls breathing?" The brainstem.

## What to memorize
- Cerebrum thinks, cerebellum coordinates, brainstem keeps you alive. Sympathetic speeds, parasympathetic slows.
- Low frequency stimulates; ESU frequency does not.
- EEG delta, theta, alpha, beta from slow to fast. Skeletal, smooth, cardiac muscle.`,

u1l5: `## The systems behind the rest of the inventory
Feeding pumps, glucose meters, dialysis machines, blood warmers, and analyzers all serve the systems in this lesson. The outline wants normal function and the common abnormal function of each.

## Gastrointestinal: a conveyor with chemical stations
\`\`\`
mouth -> esophagus -> stomach (acid, churning) -> small intestine (duodenum, jejunum, ileum: ABSORPTION)
      -> large intestine (water absorbed, stool formed) -> rectum
side stations: liver (processes nutrients and drugs, makes clotting factors, detoxifies)
               pancreas (digestive enzymes into the gut; insulin into the blood)
               gallbladder (stores bile for fat digestion)
\`\`\`
Device connections:
- **Enteral feeding pumps** push formula through a nasogastric tube (nose to stomach) or a gastrostomy tube (through the abdominal wall). They are lower-precision than IV pumps because the gut tolerates variation. Their connectors are deliberately shaped so an enteral syringe cannot connect to an IV line; formula in a vein is fatal.
- **Suction** clears stomach contents or the airway.
- **Endoscopes** view the tract; they are semi-critical devices requiring high-level disinfection and a leak test before reprocessing.
Abnormal: GI bleeding, obstruction, ulcers, liver failure (bleeding and confusion because clotting factors and detoxification fail).

## Endocrine: chemical messengers
Glands release hormones into the blood, and the whole body listens.
\`\`\`
pancreas    insulin lowers blood glucose, glucagon raises it   diabetes = not enough insulin or resistance to it
thyroid     sets metabolic rate                                 too much: fast heart, heat; too little: slow, cold
adrenals    epinephrine (adrenaline), cortisol                  the fight-or-flight hormone; used in codes
pituitary   directs the other glands                            the "master gland"
\`\`\`
Device connections: glucose meters (a drop of blood on a strip, an electrochemical reading, needs control solution checks and clean optics), insulin pumps (a small infusion pump with a reservoir and cannula). A normal fasting glucose is roughly 70 to 100 mg/dL; hypoglycemia is dangerous within minutes, hyperglycemia over days.

## Renal: the filter
Each kidney contains about a million **nephrons**. Blood enters under pressure, water and small molecules are filtered out, the useful ones are reabsorbed, and the waste leaves as urine through the ureters to the bladder. The kidneys also balance sodium and potassium, control blood volume and pressure, and stimulate red cell production.

When they fail, waste and fluid build up. **Hemodialysis** does the filtering outside the body:
\`\`\`
patient blood --> blood pump --> [DIALYZER: thousands of hollow fibers, a semipermeable membrane]
                                    blood inside the fibers | dialysate flowing outside, opposite direction
                                    waste and excess water cross the membrane by diffusion and pressure
              <-- air detector and venous clamp <-- warmed, clean blood returns
dialysate: treated water (reverse osmosis) mixed with concentrate; conductivity about 13 to 14 mS/cm;
           temperature about 35 to 38 C; a blood leak detector watches for a ruptured fiber
\`\`\`
The machine's alarms exist because each failure is lethal: air in the return line, wrong conductivity (electrolyte disaster), wrong temperature, a membrane leak.

## Blood: the transport system
About 5 liters. Plasma is the liquid carrying proteins and clotting factors. Red cells carry oxygen on hemoglobin; their count and hemoglobin level define anemia. White cells fight infection; their count rises with infection. Platelets start clots. Laboratory analyzers count and size these cells and measure plasma chemistry. Blood for transfusion is stored at 2 to 8 C and must never be warmed above about 42 C; blood warmers have an over-temperature cutoff for that reason. Pulse oximetry works because oxygen-carrying hemoglobin is a different color from hemoglobin without it.

## Immunity and infection
White cells and antibodies recognize and destroy invaders. Patients in hospitals are often immunocompromised, which is why a contaminated blood pressure cuff or ventilator circuit can cause a serious infection, and why the biomed's cleaning habits are patient safety.

## How the exam asks it
- "Which organ produces insulin?" The pancreas.
- "By what process does waste cross the dialyzer membrane?" Diffusion.
- "Why are enteral connectors different from IV connectors?" To prevent feeding formula from being given intravenously.
- "Storage temperature for blood products?" 2 to 8 C.

## What to memorize
- Absorption in the small intestine; liver processes and makes clotting factors; pancreas makes insulin.
- Kidneys filter through nephrons; dialysis diffuses waste across a membrane; conductivity, temperature, air, and blood leak alarms.
- Blood: plasma, red (hemoglobin), white, platelets; store at 2 to 8 C.`,

u2l1: `## Water in pipes, and why the analogy works
Voltage is water pressure. Current is the flow of water. Resistance is how narrow the pipe is. Power is how much work the flowing water does, which for electricity mostly means heat. Push harder (more voltage) and more flows; narrow the pipe (more resistance) and less flows. That is Ohm's law, and it is the whole basis of every voltage and resistance measurement you will ever take.

## The law and its three forms
\`\`\`
        V
      -----      cover the one you want:   V = I x R      I = V / R      R = V / I
     I  x  R
\`\`\`
- 9 V battery across a 3 ohm lamp: I = 9 / 3 = 3 A.
- A heater draws 5 A from 120 V: R = 120 / 5 = 24 ohms.
- 2 A through a 50 ohm resistor: V = 2 x 50 = 100 V across it.

## Power: where the heat comes from
\`\`\`
P = V x I            120 V x 2 A = 240 W
P = I squared x R    (2 A) squared x 24 ohms = 96 W
P = V squared / R    (120 V) squared / 60 ohms = 240 W
\`\`\`
The squared forms matter for troubleshooting: double the current through a resistor and it dissipates four times the heat. That is why a slightly overloaded component browns and fails, and why a resistor rated for a quarter watt in a circuit that now carries more current than designed is the one you find scorched.

## Series: one path
\`\`\`
  +----[R1 = 6]----[R2 = 2]----+
  |                            |
 24 V                          |
  |                            |
  +----------------------------+
\`\`\`
There is only one path, so the **same current** flows through everything. Resistances add: 6 + 2 = 8 ohms. Current: 24 / 8 = 3 A. Voltage drops: 3 x 6 = 18 V across R1, 3 x 2 = 6 V across R2, and 18 + 6 = 24, the source. Voltages **add up** to the source. Open any component and everything stops, which is exactly what a fuse is for. A string of old Christmas lights was a series circuit, which is why one bulb killed the string.

## Parallel: several paths
\`\`\`
  +-----+-----+
  |     |     |
 12 V  [R1]  [R2]      R1 = 6 ohms, R2 = 3 ohms
  |     |     |
  +-----+-----+
\`\`\`
Every branch sees the **same voltage**, 12 V. Each draws its own current: 12/6 = 2 A and 12/3 = 4 A. Currents **add**: 6 A total. Total resistance is 12 / 6 = 2 ohms, smaller than the smallest branch, because adding a path always makes it easier for current to flow. The formula: 1 / R = 1/6 + 1/3 = 1/2, so R = 2. For two resistors, the shortcut (R1 x R2) / (R1 + R2) = 18 / 9 = 2. Wall outlets are parallel, so one dead device does not affect the others.

## Kirchhoff, without the algebra
- What flows into a junction flows out. If 6 A enters a node and 2 A leaves on one branch, 4 A leaves on the other.
- Go around any loop and the voltage rises equal the voltage drops. The 24 V source in the series example is matched by 18 + 6 of drops.
These are the rules you use silently when you compare a measured voltage to the one printed on a schematic and decide which stage is wrong.

## The shock connection
The body is a resistor, and Ohm's law decides how much current a voltage pushes through it.
\`\`\`
120 V through dry skin, about 100,000 ohms:   I = 120 / 100,000 = 1.2 mA     a tingle
120 V through wet skin, about 1,000 ohms:     I = 120 / 1,000 = 120 mA       fibrillation range
120 V through a catheter to the heart, ohms in the hundreds: amps enough to kill instantly
\`\`\`
Same voltage, three outcomes, because resistance changed. This is the whole reason wet locations, sweaty patients, and cardiac catheters get special rules.

## How the exam asks it
- "A 12 V supply drives 3 A through a load; what is the resistance?" 4 ohms.
- "Two 100 ohm resistors in parallel?" 50 ohms.
- "In a series circuit, which quantity is the same through every component?" Current.
- "A resistor's current doubles; its power dissipation..." Quadruples.

## What to memorize
- V = IR, P = VI = I squared R = V squared / R.
- Series: same current, voltages add, resistances add. Parallel: same voltage, currents add, resistance shrinks.
- Shock current = voltage / body resistance; wet skin is deadly at wall voltage.`,

u2l2: `## Why the wall is more complicated than it looks
Wall power is alternating current delivered by a system of transformers, wires, and protective devices, and hospitals add layers on top: emergency generators, isolated power in surgical suites, and ground fault protection at sinks. Knowing the layers tells you why a device behaves the way it does when something fails.

## AC in numbers
Direct current holds one polarity. Alternating current swings positive and negative 60 times a second in North America.
\`\`\`
       peak +170 V
        /\\        /\\
       /  \\      /  \\
  ----/----\\----/----\\----  0 V        one cycle = 1/60 s = 16.7 ms
           \\  /      \\  /
            \\/        \\/
       peak -170 V
  RMS = 0.707 x peak = 120 V     peak = 1.414 x RMS     peak-to-peak = 340 V
\`\`\`
The 120 V on the label is the RMS value: the DC voltage that would heat a resistor the same amount. Meters read RMS; oscilloscopes show peaks. Large equipment such as sterilizers and imaging uses 208 or 240 V, sometimes three-phase, where three waveforms are offset by 120 degrees for smoother power.

## Transformers: voltage for current
Two coils on an iron core. AC in the primary induces AC in the secondary, scaled by the turns ratio.
\`\`\`
V sec / V pri = N sec / N pri        power in = power out (minus losses), so current scales the other way
120 V primary, 10:1 step-down  -> 12 V secondary at ten times the current
1:1 isolation transformer      -> same voltage, but the secondary has NO connection to ground
\`\`\`
The isolation transformer is the important one for safety. Its output floats: touching one secondary wire while grounded completes no circuit, because the other end of that winding is not tied to earth.

## Three wires and their colors
\`\`\`
US cords:   black (or red) HOT ....... carries the 120 V
            white NEUTRAL ........... the return, bonded to ground back at the panel
            green or bare GROUND .... carries nothing unless there is a fault; the safety path
IEC cords:  brown live, blue neutral, green-yellow ground
\`\`\`
Reversed polarity (hot and neutral swapped) does not stop a device working, but it raises leakage and can leave the chassis hot in a fault, which is why safety analyzers test it.

## The hospital's essential electrical system
NFPA 99 and NFPA 70 require an alternate source that restores power within **10 seconds** of loss. It feeds three branches:
\`\`\`
life safety   exit lights, alarms, egress
critical      patient care areas; RED receptacles are the visible sign
equipment     HVAC, elevators, medical gas compressors
\`\`\`
Life-support devices belong on red outlets, and most also carry a battery or UPS to cover the ten seconds. A biomed's part: verify that critical devices are plugged into red outlets and that their batteries work.

## Isolated power and the LIM
In wet procedure rooms and some ORs, the outlets come from an isolation transformer, so neither conductor is grounded.
\`\`\`
normal system:  hot ---- device ---- neutral (grounded)      touch hot while grounded: current flows through you
isolated:       line 1 ---- device ---- line 2 (neither grounded)   touch either line: no complete circuit, no shock
\`\`\`
A **line isolation monitor** watches the insulation between each line and ground and computes the **total hazard current**: how much would flow if someone made the worst-case ground connection. It alarms at **5 mA**. An alarm means a first fault exists somewhere on that circuit, usually a device with degraded insulation; staff unplug devices one at a time until the alarm clears, and that device comes to the shop.

## GFCI
Compares current out on the hot wire to current back on the neutral. Any difference is leaking somewhere else, perhaps through a person to ground. At about **5 mA** of imbalance it opens the circuit in a few hundredths of a second. It is a macroshock protector for wet areas. It is useless against microshock because 5 mA is five hundred times the 10 microamp cardiac threshold; that protection comes from isolation in the device.

## Receptacles and the patient care vicinity
Hospital-grade receptacles (green dot) grip plugs firmly and are tested for retention, polarity, and ground. The **patient care vicinity**, about 6 feet from the bed and 7.5 feet up, is where equipment must meet the stricter patient-care leakage rules.

## How the exam asks it
- "What is the peak of a 120 V RMS supply?" About 170 V.
- "Which wire color is ground in a US power cord?" Green.
- "Within how many seconds must the emergency generator restore power?" 10.
- "A LIM alarms; what does it indicate?" A first fault raising total hazard current to 5 mA.
- "Does a GFCI protect against microshock?" No; its threshold is far too high.

## What to memorize
- RMS 0.707 x peak; 60 Hz, 16.7 ms. Turns ratio sets voltage.
- Black hot, white neutral, green ground. Generator in 10 seconds; red outlets are critical branch.
- Isolated power floats; LIM alarms at 5 mA. GFCI trips at 5 mA, macroshock only.`,

u2l3: `## Passive means it cannot make anything bigger
Resistors, capacitors, inductors, and transformers only dissipate, store, or move energy. They set the timing and filtering of every circuit, and on a board they are what most often fails visibly. Then the schematic tells you where to look.

## Resistors and their code
Colored bands read from the end nearest the first band.
\`\`\`
digit bands:  black 0  brown 1  red 2  orange 3  yellow 4  green 5  blue 6  violet 7  gray 8  white 9
third band:   multiplier (number of zeros)     fourth band: tolerance gold 5%, silver 10%
example:      red violet orange gold  =  2 7 000  =  27 kilohms, 5%
example:      brown black red         =  1 0 00   =  1 kilohm
\`\`\`
A resistor fails by opening (infinite resistance), often after browning from heat. Measure resistance with the circuit unpowered and, if it is in parallel with other parts, lift one end.

## Capacitors: buckets for charge
Two plates separated by an insulator. Apply a voltage and charge collects; remove the source and the charge stays. Consequences:
- **Blocks DC, passes AC.** Once charged, no more DC current flows; but AC keeps reversing, so it keeps charging and discharging, which looks like conduction.
- **Smooths ripple**: after a rectifier, the capacitor fills during peaks and supplies current during valleys.
- **Stores energy**: E = one half x C x V squared. A defibrillator charges a large capacitor to a couple of thousand volts and dumps it through the patient.
Electrolytic capacitors are polarized and contain liquid that dries out with age and heat. A bulging or leaking top is the single most common visible fault in a power supply, and its symptoms are ripple, hum, resets, and low output under load.

## Inductors: flywheels for current
A coil resists changes in current the way a flywheel resists changes in speed. It passes steady DC freely and fights fast changes, so it blocks high-frequency noise. Two coupled coils are a transformer.

## Reactance: resistance that depends on frequency
\`\`\`
Capacitor   Xc = 1 / (2 pi f C)     high at low frequency, low at high frequency
Inductor    XL = 2 pi f L           low at low frequency, high at high frequency
\`\`\`
Put these together with resistors and you choose which frequencies get through.
\`\`\`
low-pass    keeps slow, removes fast      smooths noise off a temperature signal
high-pass   removes slow, keeps fast      strips baseline wander (breathing) from an ECG
band-pass   keeps a window                ECG monitoring band 0.5 to 40 Hz
notch       removes one frequency         the 60 Hz mains hum on every physiological signal
\`\`\`

## The time constant
A capacitor charging through a resistor does not fill instantly. It reaches 63 percent of the final voltage after one **time constant**, tau = R x C, 86 percent after two, 95 percent after three, and about 99 percent after five.
\`\`\`
voltage
 100% |                   . . . . . . .
  95% |            . '
  86% |        . '
  63% |    .'
      |  .'
      |.'
      +----|----|----|----|----|-----> time
          1t   2t   3t   4t   5t         tau = R x C
\`\`\`
Worked: 10 kilohms and 100 microfarads: tau = 10,000 x 0.0001 = 1 second. Full charge in about 5 seconds. A defibrillator's charge time and a filter's cutoff are both time constants in disguise.

## Reading the schematic
The schematic is the troubleshooting map, and the outline says so explicitly.
\`\`\`
symbols:  -/\\/\\/\\-  resistor      --| |--  capacitor (curved plate = negative side if polarized)
          -^^^^-    inductor      ->|-     diode (arrow points the way current flows)
          -o/ o-    switch        --[ ]--  fuse        ===  ground
layout:   inputs on the left, outputs on the right, positive rail on top, ground on the bottom
labels:   test points (TP1, TP2) with expected voltages or waveforms printed beside them
\`\`\`
Method: power up, measure each test point, compare to the printed value. Work from the input toward the output; the first point that disagrees marks the failed stage. When the path is long, **half-split**: test the middle. Good there means the fault is downstream; bad means upstream. Each split halves the search.

## How the exam asks it
- "Which component blocks DC but passes AC?" A capacitor.
- "A power supply shows excessive ripple; which component is most likely at fault?" The filter capacitor.
- "How much of the final voltage does a capacitor reach after one time constant?" About 63 percent.
- "Which filter removes 60 Hz interference?" A notch filter.
- "Red violet orange gold?" 27 kilohms, 5 percent.

## What to memorize
- Color code 0 to 9; gold 5%, silver 10%.
- Capacitors block DC, pass AC, store half C V squared, and dry out. Inductors oppose change.
- Low-pass, high-pass, band-pass, notch. tau = RC, 63 percent, five tau to full.
- Schematic: compare test points to printed values; half-split the path.`,

u2l4: `## The parts that do something
Passive parts shape energy; active parts control it. A diode decides direction, a transistor decides how much, an op-amp multiplies a whisper into a signal you can see. Every medical device is a power supply feeding amplifiers feeding a converter, and each stage fails in its own way.

## Diodes: one-way valves
Current flows from anode to cathode (the direction of the arrow) and not backward, at a cost of about 0.7 V.
\`\`\`
rectifier diode    turns AC into pulsing DC
zener              conducts backward at a fixed voltage; a cheap voltage reference and clamp
LED                emits light when conducting; the red and infrared sources in an oximeter probe
\`\`\`
Rectifier arrangements: **half-wave** (one diode, uses half the cycle), **full-wave** (two diodes and a center-tapped transformer), **bridge** (four diodes, uses both halves, the common choice).

## A power supply, stage by stage
\`\`\`
mains --> [transformer] --> [rectifier] --> [filter capacitor] --> [regulator] --> clean DC rails
          steps down        AC to pulsing DC   smooths the pulses     holds voltage steady
          (or a high-frequency switching stage in a switching supply)
\`\`\`
Where each stage fails and what you see:
\`\`\`
transformer       open winding: no output at all; shorted turns: hot, low voltage, hum
rectifier diode   one shorted: blown fuse; one open: half the ripple frequency, low output
filter capacitor  dried out: ripple, hum in audio, random resets, low voltage under load, bulged top
regulator         drifted or failed: output too high (damages the load) or too low (resets); often runs hot
fuse              blown: usually a symptom of a short downstream, so find the short before replacing it
\`\`\`
**Linear** supplies regulate by burning off the excess as heat: simple, quiet, heavy, inefficient. **Switching** supplies chop the input at tens of kilohertz through a small transformer and regulate by adjusting the duty cycle: light, efficient, and in nearly everything modern, but electrically noisy, and many will not regulate without a minimum load. Bench-test a switching supply with a load resistor, not open-circuit.

## Transistors and thyristors
A transistor has three terminals. A small current into the **base** controls a large current between **collector** and **emitter** (NPN is the common type; PNP is its mirror). Two roles: a switch (fully on or off, as in a digital output or a motor driver) and an amplifier (partly on, proportionally). Transistors usually fail shorted; a shorted output transistor takes the fuse with it. **SCRs** and **triacs** switch heavy AC loads such as heaters and motors and are found in sterilizers, warmers, and centrifuges.

## Op-amps: the universal amplifier
An operational amplifier has enormous gain and two inputs. With feedback it obeys two rules that let you predict any circuit:
1. The inputs draw no current.
2. The output does whatever is needed to make the two inputs equal.
Resistors around it set the gain: an inverting amplifier's gain is the feedback resistor over the input resistor.

The configuration that matters most in medicine is the **differential** amplifier, and its refined form, the **instrumentation amplifier**. It amplifies the difference between two inputs and ignores what they share.
\`\`\`
electrode A:  1 mV heart signal  +  2 V of 60 Hz hum picked up from the room
electrode B:  0 mV (reference)   +  2 V of the SAME 60 Hz hum
difference:   1 mV heart signal  +  0 V hum          the hum cancels; the heart signal survives
\`\`\`
How well it cancels is the **common-mode rejection ratio**. A high CMRR is why an ECG front end can display microvolts in a room full of interference. The right-leg electrode drives the patient's common-mode voltage back toward the amplifier's reference to improve it further.

## Isolation: keeping the patient floating
Patient-connected inputs must never provide a path for leakage or fault current. The signal crosses an **isolation barrier**: an **optocoupler** turns the signal into light across a gap and back; an **isolation amplifier** does the same for analog signals; an isolation transformer does it for power. If the barrier degrades, the safety analyzer shows rising patient leakage, and that is the clue.

## Analog to digital
The waveform must become numbers.
\`\`\`
resolution   8 bits = 256 levels, 10 bits = 1024, 12 bits = 4096, 16 bits = 65,536    finer steps
sampling     at least twice the highest frequency of interest (Nyquist); ECG at 150 Hz diagnostic bandwidth
             needs well over 300 samples per second, so 500 to 1000 is typical
aliasing     sample too slowly and a fast signal masquerades as a slow one
\`\`\`
A DAC reverses the process for outputs such as pacing pulses and display drives.

## How the exam asks it
- "Which power supply stage converts AC to DC?" The rectifier.
- "A monitor resets randomly and the supply output shows ripple; which component?" The filter capacitor.
- "Which amplifier characteristic allows an ECG to reject 60 Hz interference?" High common-mode rejection ratio.
- "What component provides electrical isolation between the patient and the mains?" An optocoupler or isolation amplifier.
- "Minimum sampling rate for a 100 Hz signal?" More than 200 samples per second.

## What to memorize
- Diode 0.7 V, one way; bridge rectifier; transformer, rectifier, filter, regulator.
- Ripple means the capacitor; blown fuse means find the short; switching supplies need a load.
- Instrumentation amplifier with high CMRR rejects hum. Optocouplers isolate. Nyquist: sample above twice the highest frequency.`,

u2l5: `## Stored power is patient safety
An infusion pump in an elevator, a ventilator during a transfer, a monitor during the ten seconds before the generator starts: batteries carry them. A UPS carries the systems that cannot ride a battery. And power quality decides whether devices reset at 3 a.m. for no reason anyone can see.

## Battery basics
\`\`\`
primary      use once (alkaline, lithium coin cells)         1.5 V alkaline
secondary    rechargeable; the ones you maintain
capacity     amp-hours: 2 Ah = 2 A for 1 hour, or 0.5 A for 4 hours; shrinks with age and cold
cells        stacked in series for voltage: six 2 V lead-acid cells = 12 V; three Li-ion cells = 11.1 V
\`\`\`

## Chemistries
\`\`\`
Lead-acid (sealed, SLA)   2.0 V/cell   heavy; cheap; tolerates float charging; SULFATES if stored discharged;
                                        carts, older defibrillators, UPS units
Nickel-cadmium (NiCd)     1.2 V/cell   rugged; MEMORY EFFECT from repeated partial discharge shrinks capacity;
                                        fix with full discharge-charge conditioning cycles; cadmium is toxic waste
Nickel-metal hydride      1.2 V/cell   more capacity than NiCd, milder memory effect, self-discharges faster
Lithium-ion               3.6-3.7 V/cell  light, high capacity, NO memory effect; but over-charge, over-discharge,
                                        puncture, or heat can trigger THERMAL RUNAWAY (fire); packs carry protection
                                        circuits; swollen packs are removed from service immediately
\`\`\`

## The symptoms and what they mean
\`\`\`
runs on AC, dies within seconds on battery      battery at end of life, or not charging (charger circuit, connector)
never reaches full charge                        charger fault, or a battery that cannot accept charge
runtime shrinking month by month                 normal aging; replace at the vendor's interval
NiCd device dies early but shows full charge     memory effect; condition it
pack is warm, swollen, or smells                 lithium hazard; isolate it, do not charge, dispose per policy
\`\`\`
Runtime is the test that matters: at PM, run the device on battery to the low-battery alarm and compare against specification. A battery that passes a voltage check can still fail a runtime test, because voltage says little about capacity.

## A battery program
Date every battery on installation. Track replacement intervals in the CMMS. Condition NiCd packs on a schedule. Keep spares charged and rotated. Dispose through the recycling stream; lead, cadmium, and lithium all have rules.

## UPS: the bridge
\`\`\`
Standby              utility passes straight through; on loss, switches to battery and inverter
                     cheap; a few milliseconds of transfer gap; fine for a PC, not for a lab analyzer mid-run
Line-interactive     adds a regulating transformer that corrects sags and surges without switching
                     mid-priced; short transfer gap
Online double-       rectifies utility to DC, charges the battery, inverts back to AC continuously
conversion           the load never sees the utility; zero transfer time; full conditioning; the choice for
                     critical equipment and anything with a computer that must not glitch
\`\`\`
Size it by load in volt-amps or watts and by the minutes needed: enough to shut down cleanly or to reach generator power (which arrives within 10 seconds, but the UPS should cover far more for safety). Batteries in a UPS age like any other; runtime testing applies.

## Power quality: the invisible faults
\`\`\`
sag / brownout   voltage dips             motors starting, overloaded circuits; devices reset or run hot
surge            voltage rises            heavy loads switching off; stresses supplies
spike/transient  brief high-energy pulse  lightning, switching; kills semiconductors
noise            high-frequency garbage   motors, dimmers, switching supplies; artifacts on signals
blackout         nothing                  the generator's job, after 10 seconds
\`\`\`
Fixes: **surge protectors** clamp spikes; **power conditioners** regulate voltage and filter noise; an online UPS does all of it and bridges outages. A device that resets, corrupts data, or eats power supplies on one outlet and behaves elsewhere has a power quality problem, not a device problem, and the fix is the circuit.

## How the exam asks it
- "Nominal voltage of a lithium-ion cell?" About 3.6 to 3.7 V.
- "Which chemistry is prone to the memory effect?" Nickel-cadmium.
- "Which UPS type provides no transfer gap?" Online double-conversion.
- "A device runs on AC but not on battery; first suspects?" Battery, charger, connector.
- "A short high-voltage pulse from lightning is called a..." Transient or spike.

## What to memorize
- Lead-acid 2 V and sulfates; NiCd 1.2 V and memory; NiMH 1.2 V; Li-ion 3.6 V, no memory, thermal runaway.
- Runtime test beats voltage check. Standby, line-interactive, online.
- Sag, surge, spike, noise, blackout; conditioners, surge protectors, UPS.`,

u3l1: `## The patient is the weakest circuit in the building
Electrical safety in a hospital is different from a factory for one reason: patients have had their natural defenses removed. They are wet with conductive fluids, their skin has been prepped and punctured, they cannot let go, and some have a wire or a fluid column running straight to the heart. This lesson is the physics of what current does and how the facility keeps it away from them.

## What current does, and why
Nerves and muscles fire on electrical pulses. Fifty or sixty hertz is slow enough that each cycle acts as a stimulus, so the effects scale with current:
\`\`\`
about 1 mA       perception: tingling; sensory nerves fire
5 mA             maximum harmless: startling but no injury
10 to 20 mA      let-go threshold: forearm muscles clamp the hand around the conductor;
                 the victim cannot release, and exposure continues
about 50 mA      pain, fainting; chest muscles may freeze (respiratory arrest)
100 to 300 mA    ventricular fibrillation: the heart's cells fire chaotically and it stops pumping
6 A and above    the heart clamps in sustained contraction; severe burns; may restart when released
\`\`\`
Time matters too: a longer exposure at a lower current does the same damage. And the path matters: hand to hand or hand to foot crosses the chest and the heart; that is the dangerous path.

## Macroshock versus microshock
\`\`\`
MACROSHOCK   current enters through the SKIN            skin resistance limits it; milliamps to hurt
             ordinary electrocution; a person touching a faulty chassis while grounded
MICROSHOCK   current bypasses the skin and reaches the   no skin resistance; MICROamps can fibrillate
             HEART directly through a catheter, pacing   the threshold usually cited is 10 microamps
             wire, or fluid-filled pressure line
\`\`\`
The microshock patient is the reason leakage limits for cardiac-connected equipment are measured in microamps, a thousand times tighter than what protects an ordinary person. A nurse touching a faulty device with one hand and the patient's pacing wire with the other could deliver a lethal microshock and feel nothing herself.

## Where leakage comes from
No device is perfectly insulated. Current leaks to the chassis through:
- capacitance between the power cord conductors and the ground wire,
- capacitance in transformer windings,
- the filter capacitors that suppress radio interference,
- any degraded or wet insulation.
This is normal and small, tens to hundreds of microamps. The ground wire returns it to the panel harmlessly. The danger begins when the ground path is broken.

\`\`\`
GOOD:  chassis --leakage--> ground wire --> panel        patient touches chassis: current takes the ground path
BAD:   chassis --leakage--> [open ground pin]            chassis floats at some voltage;
       patient touches chassis and a grounded bed rail:  ALL the leakage goes through the patient
\`\`\`
A broken ground does not stop the device working, so nobody notices until the safety test, or the shock.

## Grounding and the ground test
The third prong and the green wire give fault current a path of almost no resistance back to the source, so a real fault trips the breaker in milliseconds and leakage is diverted around people. NFPA 99 requires the resistance from the chassis to the plug's ground pin to be no more than **0.5 ohm** on patient-care equipment; a worn plug, a corroded internal strap, or a damaged cord raises it.

## Cords, plugs, and outlets
Inspect every cord at every PM: cracked insulation, exposed conductors, a strain relief pulled loose, a bent or missing ground pin, scorched blades. Replace, never tape. Hospital-grade plugs and receptacles (green dot) hold tighter and are built for the abuse. Two-prong adapters and extension cords are forbidden for patient-care equipment. Relocatable power taps are allowed only if rated, secured, used within their capacity, and never plugged into one another.

## Two protective systems, two different jobs
- **GFCI**: watches for current leaving on the hot conductor that does not come back on the neutral. At about 5 mA of difference it opens the circuit. It saves a person touching a faulty device in a wet area. It does nothing for a microshock patient; 5 mA is far above the cardiac threshold.
- **Isolated power with a line isolation monitor**: neither conductor is grounded, so the first fault to ground causes no current at all. The LIM measures the insulation and alarms at 5 mA of total hazard current, which means "a first fault exists; find it before a second one turns this into a circuit."

## Habits
Report tingles; a tingle is a fault waiting for a wetter victim. Keep patient leads off metal. Never disable a ground to "stop the hum." Test after every repair, because a repair can loosen a ground strap.

## How the exam asks it
- "The current level at which a person cannot release a conductor?" About 10 to 20 mA.
- "Which condition allows microshock?" A direct conductive path to the heart such as a catheter.
- "Why is an open ground dangerous even though the device still works?" Leakage current has no safe path and may flow through the patient.
- "Maximum ground resistance for patient-care equipment?" 0.5 ohm.
- "Does a GFCI protect a patient with a central line from microshock?" No.

## What to memorize
- 1 mA feel, 10 to 20 mA let-go, 100 mA fibrillate, 6 A clamp. Microshock at 10 microamps to the heart.
- Leakage is normal; an open ground makes it a hazard. Ground resistance 0.5 ohm.
- GFCI at 5 mA protects people from macroshock; the LIM alarms at 5 mA hazard current on isolated power.`,

u3l2: `## Two rulebooks
One standard says how a device must be built to be safe: IEC 60601-1. Another says how a hospital must run its power and test its equipment: NFPA 99. The exam names both, and the numbers in your safety analyzer come from them.

## Who owns which numbers
\`\`\`
IEC 60601-1    the design and test standard for medical electrical equipment; international
               defines protection classes, applied-part types, and leakage limits
               tested under NORMAL condition and SINGLE FAULT condition (one protection has failed)
NFPA 99        the Health Care Facilities Code; the facility's rules for power systems, medical gases,
               and testing equipment in patient care areas; ground resistance and chassis leakage for acceptance
NFPA 70        the National Electrical Code; building wiring, receptacles, the essential electrical system
\`\`\`

## How a device is classified
Protection against shock comes from two layers, and the classes describe the first layer:
\`\`\`
Class I               relies on protective earth: the third prong; a fault energizes the chassis, the ground carries it
Class II              double or reinforced insulation, no ground needed; symbol: a square inside a square
Internally powered    runs on its own battery; no mains connection while in use
\`\`\`
The **applied part** is whatever touches the patient, and its type sets the leakage limits:
\`\`\`
Type B    body; not intended for direct cardiac connection          symbol: a stick figure
Type BF   body FLOATING; the patient connection is isolated         symbol: a stick figure in a box
Type CF   CARDIAC floating; isolated and held to the tightest limits symbol: a heart in a box
          for anything that may connect directly to the heart
Defibrillation-proof   the applied part survives a defibrillator discharge  symbol: paddles beside the figure
\`\`\`
Rule of thumb: F means floating (isolated); C means cardiac (tightest).

## The numbers
IEC 60601-1, normal condition first, single fault condition second:
\`\`\`
Earth (ground) leakage                        5 mA          10 mA
Touch (enclosure / chassis) current           100 uA        500 uA
Patient leakage, AC, type B and BF            100 uA        500 uA
Patient leakage, AC, type CF                  10 uA         50 uA
Patient leakage, DC, all types                10 uA         50 uA
Mains voltage on the applied part (BF / CF)   5 mA / 50 uA  (a single-fault test by definition)
\`\`\`
Every single-fault limit is five times the normal limit. CF is ten times tighter than B and BF on AC, because 10 microamps is the microshock threshold.

NFPA 99 for the facility:
\`\`\`
Ground resistance, chassis to plug ground pin    0.5 ohm maximum
Chassis (touch) current, cord-connected patient-care equipment   500 uA in current editions
                                                 (older editions used 300 or 100 uA; use the value your facility's policy cites)
\`\`\`

## The safety analyzer, test by test
The analyzer plugs into the wall, the device plugs into the analyzer, and the analyzer can switch faults in and out.
\`\`\`
1. Visual         cord, plug, ground pin, strain relief, housing, labels, accessories
2. Ground resistance     from chassis (or an exposed metal point) to the plug's ground pin; under 0.5 ohm
3. Chassis leakage       current from chassis to ground, measured in:
                           normal polarity
                           reversed polarity   (hot and neutral swapped)
                           open ground         (the single fault that matters most)
                           open neutral
                         leakage rises under faults; compare to the single-fault limit
4. Patient lead leakage  each applied-part lead to ground, normal and fault conditions
5. Lead-to-lead          between applied parts (patient auxiliary current)
6. Mains on applied part isolation test: the analyzer applies line voltage to the leads and measures
                         how much current the isolation lets through
\`\`\`
Record every number. Leakage that is within limits but climbing over successive PMs is insulation aging; catch it before the limit.

## Interpreting a failure
\`\`\`
ground resistance high              worn plug, damaged cord, loose or corroded ground strap inside
chassis leakage high, normal         insulation breakdown, failing line filter capacitor, moisture inside
chassis leakage high only on open ground   often acceptable if under the fault limit; otherwise filter caps
patient leakage high                 the isolation barrier in the front end has degraded; the device is
                                     no longer safe for its applied-part type
\`\`\`

## When to test
- **Incoming inspection**: before first clinical use, every device, no exceptions.
- **After repair**: any repair that opened the case or touched power, ground, or the front end.
- **Scheduled PM**: at the interval the program sets by risk.
Battery-only devices still get the visual inspection and patient lead tests.

## How the exam asks it
- "Normal-condition patient leakage limit for a type CF applied part?" 10 microamps.
- "Which symbol indicates an applied part safe for direct cardiac connection?" The heart in a box, type CF.
- "Maximum ground resistance under NFPA 99?" 0.5 ohm.
- "Why test with reversed polarity and open ground?" Because those faults raise leakage, and the device must stay safe under a single fault.
- "When must electrical safety testing be performed?" Incoming inspection, after repair, and at scheduled PM.

## What to memorize
- IEC 60601-1 designs the device; NFPA 99 governs the facility; NFPA 70 wires the building.
- Class I ground, Class II double insulation. B body, BF floating, CF cardiac; F floats, C is tightest.
- CF 10/50 microamps; B and BF 100/500; earth 5/10 mA; ground 0.5 ohm. Test at incoming, after repair, at PM.`,

u3l3: `## Equipment is a vector
A blood pressure cuff moves from room to room. A ventilator circuit carries breath. Your hands carry whatever the last device carried. Infection control is not a nursing subject; it is how a biomed avoids becoming the reason a patient got sicker.

## The foundation: standard precautions
Formerly called universal precautions, the rule is simple: every patient's blood and body fluids are treated as infectious, every time, regardless of diagnosis. Two habits carry most of the weight:
- **Hand hygiene** before and after every patient contact and before and after touching equipment in a patient area. Alcohol rub is fine unless hands are visibly soiled or the patient has C. difficile, whose spores survive alcohol; then soap and water.
- **Gloves** whenever contact with fluids is possible, changed between tasks, and never a substitute for hand hygiene.

## Transmission-based precautions: read the sign
\`\`\`
Contact    organism spreads by touch (resistant bacteria, C. difficile)        gown and gloves
Droplet    large droplets from coughs and sneezes, travel a few feet (flu)     surgical mask within about 6 feet
Airborne   tiny particles that stay suspended (tuberculosis, measles, chickenpox)   N95 respirator, fit tested,
                                                                                 negative-pressure room, door closed
\`\`\`
Equipment leaving any isolation room is cleaned and disinfected before it goes anywhere. Dedicated equipment (a cuff and stethoscope that stay in the room) is the better practice for contact isolation.

## PPE in the right order
\`\`\`
DONNING (putting on)              DOFFING (taking off; the gloves are the dirtiest thing)
1. gown                           1. gloves
2. mask or respirator             2. eye protection
3. eye protection                 3. gown
4. gloves                         4. mask or respirator (outside the room for airborne isolation)
                                  hand hygiene between steps and at the end
\`\`\`
The logic: put on the item that touches the most last (gloves), take it off first.

## Bloodborne pathogens
Hepatitis B, hepatitis C, and HIV travel in blood and some fluids. OSHA's bloodborne pathogens standard requires an exposure control plan, training, a free hepatitis B vaccine offer, PPE, and a response to exposures. Practical rules: sharps go into a puncture-resistant container immediately, needles are never recapped by hand, and a needlestick or splash is washed and reported at once, because post-exposure treatment works best within hours.

## Three levels of germ killing
\`\`\`
Cleaning        removes soil, blood, and most organisms with detergent and friction    ALWAYS FIRST
Disinfection    kills most organisms, not spores
                low-level: surfaces and non-critical items
                high-level: items that touch mucous membranes; longer contact time, stronger chemical
Sterilization   kills everything including spores
                steam autoclave: 121 C (250 F) at 15 psi for 15 to 30 min, or 132 to 135 C for a few minutes (flash)
                ethylene oxide gas or hydrogen peroxide plasma for heat-sensitive items
                verified by biological indicators (spore tests) and chemical indicators
\`\`\`
Disinfectants cannot penetrate dried blood, which is why cleaning comes first. The contact time on the label (the surface must stay wet that long) is the most commonly violated rule.

## Spaulding: how far to go
\`\`\`
Critical        enters sterile tissue or the bloodstream    surgical instruments, catheters, implants   STERILIZE
Semi-critical   touches mucous membranes or broken skin     endoscopes, respiratory circuits, probes    HIGH-LEVEL DISINFECT (minimum)
Non-critical    touches intact skin only                    cuffs, monitors, beds, stethoscopes         LOW-LEVEL DISINFECT
\`\`\`
An endoscope is the classic semi-critical device and the classic reprocessing failure: it must be leak-tested, cleaned within minutes of use, then high-level disinfected, with every step documented.

## The biomed's own practice
- Clean and disinfect a device before you open it, and again before it returns.
- Use the disinfectant the manufacturer lists; the wrong chemical cracks plastics and fogs displays.
- Gloves and eye protection when working on anything that came from a patient.
- Keep the repair bench away from clean storage; separate dirty and clean areas.
- Get the vaccines the program offers.

## How the exam asks it
- "Most effective single measure to prevent transmission?" Hand hygiene.
- "Which PPE is required for a patient with tuberculosis?" An N95 respirator, in a negative-pressure room.
- "First PPE item removed?" Gloves.
- "Classification of a flexible endoscope?" Semi-critical; high-level disinfection at minimum.
- "Why must an item be cleaned before disinfection?" Soil shields organisms from the disinfectant.

## What to memorize
- Standard precautions and hand hygiene; contact gown and gloves, droplet mask, airborne N95 and negative pressure.
- Donning gown, mask, eyes, gloves; doffing gloves first.
- Clean, then disinfect, then sterilize. Autoclave 121 C, 15 psi. Spaulding critical, semi-critical, non-critical.`,

u3l4: `## Reading the building
A hospital labels its hazards. A biomed who can read the labels knows what is in the cylinder, whether the room will pull a wrench out of a pocket, whether the laser needs goggles, and which extinguisher to grab. The outline lists these by name.

## Safety data sheets
Every hazardous chemical, from bench cleaners to sterilant gas, ships with a **safety data sheet**. The format is fixed at 16 sections, so the same information is always in the same place:
\`\`\`
1 identification   2 hazards   3 composition   4 first aid   5 fire fighting   6 accidental release
7 handling and storage   8 exposure controls and PPE   9 physical and chemical properties   10 stability
11 toxicology   12 ecology   13 disposal   14 transport   15 regulatory   16 other
\`\`\`
Sections 2, 4, 7, and 8 answer the questions you actually ask: what can it do to me, what do I do if it does, how do I store it, what do I wear. Sheets must be reachable by staff at all times, on paper or a terminal.

## Container labels
**GHS pictograms** are the red-bordered diamonds:
\`\`\`
flame            flammable            flame over circle    oxidizer (feeds fires)
skull            acutely toxic        corrosion            burns skin, eyes, metal
exclamation      irritant, mild hazard   health hazard silhouette   carcinogen, organ toxicity
gas cylinder     gas under pressure   environment (tree and fish)   ecological hazard
\`\`\`
The **NFPA 704 diamond** on doors and tanks rates four things 0 (none) to 4 (severe): blue health, red flammability, yellow reactivity (instability), and the white box for special notes: OX oxidizer, W with a line through it means reacts with water, SA simple asphyxiant.

## Signage you must recognize
\`\`\`
Laser          class and wavelength on the door; class 1 safe, 2 blink-reflex safe, 3 eye hazard, 4 eye, skin, and FIRE hazard
               wavelength-matched eyewear; controlled area; reflective instruments covered
Ionizing       the trefoil (three blades); X-ray rooms, nuclear medicine, some OR fluoroscopy
radiation      protect with TIME (less), DISTANCE (inverse square: double it, quarter the dose), SHIELDING (lead);
               ALARA; dosimeters for staff; lead aprons about 0.5 mm equivalent
MRI            zones I (public) to IV (magnet room); the magnet is ALWAYS on, even when not scanning
               ferromagnetic objects become projectiles; everyone and everything screened before zone IV
               labels: MR Safe (green), MR Conditional (yellow, conditions apply), MR Unsafe (red)
               a QUENCH boils off liquid helium in seconds; the room must vent and be evacuated
Biohazard      three interlocking crescents; specimens, waste, contaminated equipment
Patient        contact, droplet, airborne isolation; fall risk; latex allergy; limb alerts
precautions    (no blood pressure or venipuncture on an arm with a dialysis fistula or mastectomy)
\`\`\`

## Fire
Fire needs heat, fuel, and oxygen; take away one and it goes out.
\`\`\`
RACE   Rescue anyone in immediate danger; Alarm (pull station, call); Confine (close doors, contain);
       Extinguish if small, or Evacuate
PASS   Pull the pin; Aim at the base; Squeeze; Sweep side to side
Class  A ordinary combustibles (paper, wood, linen)   B flammable liquids (alcohol, solvents)
       C energized electrical equipment                D combustible metals (magnesium)   K cooking oils
\`\`\`
Hospitals "defend in place": patients cannot all be evacuated, so buildings are divided by fire-rated smoke barriers and doors that close automatically. Know where they are on your floors. For an equipment fire: unplug if it is safe, use a class C (or ABC) extinguisher, never water on a live device.

## Medical gases
Oxygen does not burn, but in an oxygen-enriched atmosphere everything else burns hotter and faster: the sheets, the drapes, the patient's hair. Oxygen-fed fires in the OR involve an ESU or laser as the ignition source. Rules: no oil or grease on oxygen fittings (they can ignite), cylinders secured upright and capped, stored below 125 F, full separated from empty, transported in carts, never left free-standing.
\`\`\`
US cylinder colors:  oxygen GREEN   nitrous oxide BLUE   carbon dioxide GRAY   nitrogen BLACK
                     medical air YELLOW   helium BROWN   (international colors differ; oxygen is white)
Connections:         pin index safety system on small (E) cylinders; DISS threaded fittings on hoses and outlets;
                     each gas has its own pattern so a wrong connection cannot be made
Pressures:           full E cylinder of oxygen about 2,000 to 2,200 psi, about 660 liters
                     pipeline outlets about 50 psi; zone valves shut off a wing in a fire; alarms for low pressure
\`\`\`
The E cylinder math: duration in minutes = (psi x 0.28) / flow in L/min, roughly. A full E cylinder at 10 L/min lasts about an hour.

## How the exam asks it
- "Which SDS section describes first-aid measures?" Section 4.
- "Color of a medical oxygen cylinder in the US?" Green.
- "What does class 4 laser mean?" Eye, skin, and fire hazard; controlled area and eyewear required.
- "Which MRI zone is the magnet room?" Zone IV.
- "First step on discovering a fire?" Rescue anyone in danger (RACE).
- "Doubling the distance from a radiation source reduces exposure to..." One quarter.

## What to memorize
- SDS 16 sections; GHS pictograms; NFPA 704 blue health, red flammability, yellow reactivity, white special.
- Laser class 4 dangerous; radiation time, distance, shielding, ALARA; MRI zone IV, magnet always on.
- RACE, PASS, classes A to K. Oxygen green, nitrous blue, CO2 gray, nitrogen black, air yellow; pin index and DISS.`,

u3l5: `## Who is watching, and what they read
A hospital equipment program answers to a regulator (CMS), is inspected by accreditors acting for that regulator, follows device rules from the FDA and worker rules from OSHA, designs itself around AAMI standards, and proves all of it through the CMMS. The outline names every one of these.

## The money and the rules: CMS
The Centers for Medicare and Medicaid Services pays for roughly half of American hospital care. To be paid, a hospital must meet the **Conditions of Participation**, which include requirements for the physical environment and for maintaining equipment in safe operating condition. CMS can survey a hospital itself (a state agency usually does it on CMS's behalf), but most hospitals choose accreditation instead.

## Deemed status: the accreditors
CMS grants **deeming authority** to accrediting organizations whose standards meet or exceed the Conditions. A hospital accredited by one of them is "deemed" compliant. For hospitals:
\`\`\`
The Joint Commission (TJC)    the largest; Environment of Care and Emergency Management chapters cover equipment
DNV Healthcare                 surveys annually and integrates ISO 9001 quality management
ACHC                           absorbed the former HFAP program (Healthcare Facilities Accreditation Program)
CIHQ                           Center for Improvement in Healthcare Quality
\`\`\`
Surveyors arrive with the standards and ask to see the inventory, the maintenance strategy for each device, PM completion, test results, incident investigations, staff competencies, and the policies behind them. Overdue PMs on life-support and high-risk devices, missing safety tests, and undocumented AEM decisions are the findings that hurt.

## Alternative equipment maintenance
Manufacturers' recommended maintenance is the default. Since 2013, CMS has allowed an **AEM program**: a hospital may maintain a device on a different schedule or with a different method when a qualified person performs and documents a risk assessment, the device's history and the literature support the change, and the program is reviewed. Not everything qualifies:
\`\`\`
NOT eligible for AEM:   imaging and radiologic equipment (X-ray, CT, MRI, ultrasound, nuclear medicine)
                        medical lasers
                        any device where federal or state law, or the manufacturer, requires a specific method
                        new devices without enough history to justify a change
\`\`\`
AEM is how a program stops doing a monthly PM on a device that has never failed in ten years and puts that time where risk actually is. It is also how a program gets a citation if the risk assessment is missing.

## The AAMI EQ standards
ANSI/AAMI publishes the recommended practices that a defensible program is built on:
\`\`\`
EQ56    Recommended practice for a medical equipment management program
        the framework: scope, inventory, risk-based inclusion criteria, procedures, records, quality indicators
EQ89    Guidance for the scheduled maintenance and performance verification of medical equipment
        how to decide what maintenance a device needs, how often, and how to verify performance
EQ93    Medical equipment management vocabulary
        the dictionary: so "corrective maintenance," "performance verification," and "scheduled maintenance"
        mean one thing across the industry
EQ103   Guidance for alternative equipment maintenance programs
        how to build, document, and review an AEM program that will survive a survey
\`\`\`
Memory hook: 56 sets up the program, 89 schedules the work, 93 defines the words, 103 justifies the alternative.

## The device regulator: FDA
The FDA clears and approves medical devices and requires **medical device reporting**. For a user facility (a hospital):
\`\`\`
device-related DEATH            report to the FDA AND the manufacturer within 10 work days
device-related SERIOUS INJURY   report to the manufacturer (or FDA if unknown) within 10 work days
annual summary                  to the FDA
\`\`\`
Recalls are classed by danger: **Class I** reasonable probability of serious harm or death, **Class II** temporary or reversible harm, **Class III** unlikely to cause harm. Biomeds receive recall notices and safety alerts (from the FDA, manufacturers, and services such as ECRI), locate affected devices in the CMMS, and document the action taken.

## The worker regulator: OSHA
Hazard communication (the SDS system), bloodborne pathogens, PPE, lockout-tagout, and electrical safety at work. OSHA protects the biomed; the others protect the patient.

## The CMMS: where compliance lives
The computerized maintenance management system is the program's record and its proof.
\`\`\`
inventory          every device with asset tag, serial, model, location, owner, risk score, maintenance strategy
work orders        corrective repairs and scheduled maintenance, opened, worked, closed with cause and action
PM scheduling      what is due, what is done, what is overdue
history            every event in a device's life; the data an AEM decision is built on
parts and cost     what was used and what it cost; cost of ownership
reports            PM completion rate, overdue by risk class, repeat failures, mean time between failures,
                   cost per device; the numbers surveyors and administrators ask for
\`\`\`
Rules of use: find the device by asset tag, open a work order for every task, record test results with the numbers, close with a clear cause and action, and never do work that leaves no record. To a surveyor, an undocumented PM is a PM that did not happen.

## How the exam asks it
- "Which agency sets the Conditions of Participation?" CMS.
- "Which organizations survey hospitals on behalf of CMS?" The Joint Commission, DNV, ACHC, CIHQ.
- "Which equipment is excluded from an AEM program?" Imaging and radiologic equipment, lasers, and devices where the manufacturer or law requires otherwise.
- "Which AAMI standard addresses alternative equipment maintenance?" EQ103.
- "Within how long must a user facility report a device-related death to the FDA?" 10 work days.
- "What report demonstrates scheduled maintenance compliance to a surveyor?" A CMMS PM completion report.

## What to memorize
- CMS conditions; deemed status accreditors: Joint Commission, DNV, ACHC, CIHQ.
- AEM: documented risk assessment; never imaging, lasers, or where the manufacturer requires.
- EQ56 program, EQ89 maintenance, EQ93 vocabulary, EQ103 AEM. FDA death report 10 work days; recall Class I worst.
- The CMMS is the proof: inventory, work orders, PM, history, reports.`
