FRA.questions.push(
// u1l6
{id:"u1l6-1",t:"u1l6",q:"Which layer of the integumentary system lies deepest?",a:["Epidermis","Hypodermis","Dermis","Stratum basale"],c:1,e:"The hypodermis (subcutaneous layer) lies beneath the dermis. The stratum basale is only the deepest part of the epidermis, which is the outermost layer."},
{id:"u1l6-2",t:"u1l6",q:"A pathology report describes muscle tissue with filaments arranged without visible stripes. Which muscle type is this?",a:["Skeletal","Cardiac","Smooth","Striated"],c:2,e:"Smooth muscle is non-striated and involuntary, found in the walls of hollow organs and vessels. Skeletal and cardiac muscle are both striated."},
{id:"u1l6-3",t:"u1l6",q:"How many bones make up the adult appendicular skeleton?",a:["80","33","206","126"],c:3,e:"The appendicular skeleton (girdles and limbs) has 126 bones; the axial skeleton has 80; together they total 206. There are 33 vertebrae."},
{id:"u1l6-4",t:"u1l6",q:"In which part of the brain is sensory information interpreted?",a:["The cerebrum, in the parietal lobe","The cerebellum","The medulla oblongata","The pons"],c:0,e:"The parietal lobe of the cerebrum interprets sensory input and body position. The cerebellum coordinates movement, and the medulla and pons in the brain stem run autonomic functions."},
{id:"u1l6-5",t:"u1l6",q:"Which division of the nervous system controls voluntary movement such as walking?",a:["Autonomic","Somatic","Parasympathetic","Sympathetic"],c:1,e:"The somatic nervous system controls voluntary skeletal muscle. The autonomic system, with its sympathetic and parasympathetic branches, handles involuntary functions."},

// u1l7
{id:"u1l7-1",t:"u1l7",q:"Which statement correctly matches a digestive organ to its function?",a:["The jejunum is the first section of the small intestine","The gallbladder produces insulin","The large intestine reabsorbs water to form solid waste","The duodenum is the middle section where sugars are absorbed"],c:2,e:"The large intestine's main job is reabsorbing water. The duodenum is the first section of the small intestine, the jejunum the second, and insulin comes from the pancreas."},
{id:"u1l7-2",t:"u1l7",q:"Where are the parathyroid glands located?",a:["On the anterior surface of the thyroid's lateral lobes","Below the liver in the biliary tract","Behind the stomach near the duodenum","On the posterior aspect of the thyroid's lateral lobes"],c:3,e:"The four parathyroid glands sit on the posterior aspect of the thyroid's lateral lobes and regulate blood calcium."},
{id:"u1l7-3",t:"u1l7",q:"After a meal, insulin rises and lowers blood glucose, and as glucose falls the pancreas reduces insulin release. Which mechanism is this?",a:["Negative feedback","Positive feedback","Parasympathetic regulation","Stress response"],c:0,e:"Negative feedback reverses or minimizes a change to keep a system stable. Positive feedback amplifies a change, as in labor contractions."},
{id:"u1l7-4",t:"u1l7",q:"Which force primarily drives filtration of blood in the kidney's glomerulus?",a:["Osmosis","Blood pressure","Smooth muscle contraction","Peristalsis"],c:1,e:"Blood pressure forces filtrate out of the glomerular capillaries into Bowman's capsule. Peristalsis moves food through the gut, not blood through the kidney."},
{id:"u1l7-5",t:"u1l7",q:"Which statement about hemoglobin is incorrect?",a:["It is a protein found in red blood cells","It contains iron to which oxygen binds","It is the ratio of red blood cells to total blood volume","It transports oxygen from the lungs to the body"],c:2,e:"The ratio of red cells to blood volume is the hematocrit. Hemoglobin is the iron-containing protein inside red cells that carries oxygen."},

// u2l6
{id:"u2l6-1",t:"u2l6",q:"A lamp draws 500 mA from a 120 V source for 8 hours. How much energy does it use?",a:["60 kWh","480 kWh","4.8 kWh","0.48 kWh"],c:3,e:"Power is 0.5 A x 120 V = 60 W. Energy is power times time: 60 W x 8 h = 480 Wh = 0.48 kWh."},
{id:"u2l6-2",t:"u2l6",q:"A 120 V source feeds a 60 ohm resistor in series with a 100 ohm resistor. What is the voltage across the 60 ohm resistor?",a:["45 V","60 V","75 V","38 V"],c:0,e:"Voltage divides in proportion to resistance: 120 V x 60 / (60 + 100) = 120 x 0.375 = 45 V."},
{id:"u2l6-3",t:"u2l6",q:"At a circuit node, 9 A flows in while 5 A and 2 A leave on two branches. What current flows in the third branch?",a:["16 A","2 A","7 A","4 A"],c:1,e:"Kirchhoff's current law: current in equals current out. 9 A = 5 A + 2 A + I, so I = 2 A."},
{id:"u2l6-4",t:"u2l6",q:"A battery reads 1.58 V open circuit and drops to 1.46 V when an 80 ohm resistor is connected. What is its internal resistance?",a:["0.12 ohm","8.25 ohms","6.58 ohms","1.46 ohms"],c:2,e:"Load current is 1.46 / 80 = 0.01825 A. The 0.12 V lost inside the battery divided by that current gives 0.12 / 0.01825 = 6.58 ohms."},
{id:"u2l6-5",t:"u2l6",q:"An ideal inverting op-amp circuit uses a 5 kilohm input resistor and must have a gain of 9. What feedback resistance is required?",a:["556 ohms","180 kilohms","90 kilohms","45 kilohms"],c:3,e:"Inverting gain equals the feedback resistance divided by the input resistance, so R feedback = 9 x 5 kilohms = 45 kilohms."},

// u2l7
{id:"u2l7-1",t:"u2l7",q:"A circuit supplies 180 W of true power and 240 VAR of reactive power. What is the magnitude of the apparent power?",a:["300 VA","420 VA","60 VA","360 VA"],c:0,e:"Apparent power is the hypotenuse: S = square root of (180 squared + 240 squared) = square root of 90,000 = 300 VA."},
{id:"u2l7-2",t:"u2l7",q:"What is the approximate reactance of a 40 millihenry inductor at 60 Hz?",a:["24 ohms","15 ohms","2.4 ohms","150 ohms"],c:1,e:"XL = 2 x pi x f x L = 2 x 3.1416 x 60 x 0.040 = 15.1 ohms."},
{id:"u2l7-3",t:"u2l7",q:"Which of the following is an active circuit component?",a:["A capacitor","A thermistor","A transistor","An inductor"],c:2,e:"Active components need a power source and provide gain or control; a transistor amplifies. Capacitors, inductors, and thermistors are passive."},
{id:"u2l7-4",t:"u2l7",q:"Which battery characteristic most directly determines the weight of a battery needed for a given application?",a:["Voltage per cell","Internal resistance","Voltage discharge curve","Energy density"],c:3,e:"Energy density is energy per unit mass, so for a required amount of energy it sets how heavy the battery must be."},
{id:"u2l7-5",t:"u2l7",q:"A switching power supply delivers only its full input voltage to the output. What has most likely happened?",a:["The switching element has shorted","The switching element is stuck open","The output filter capacitor has opened","The battery is undercharged"],c:0,e:"A shorted switching element passes the full input through instead of a chopped fraction. An element stuck open would give zero output."},

// u3l6
{id:"u3l6-1",t:"u3l6",q:"Which of the following does NOT comply with NFPA 99 requirements for medical gas cylinder storage?",a:["Cylinders stored between minus 7 and 52 C","Wrapped cylinders placed in secure storage","A warning on the door of a room holding positive-pressure gases other than oxygen","Cylinders kept out of tightly enclosed spaces"],c:1,e:"Cylinders must be unwrapped before storage. Temperature limits, door warnings for other positive-pressure gases, and avoiding tight enclosures are all required."},
{id:"u3l6-2",t:"u3l6",q:"Which statement matches NFPA 99 electrical requirements for a general patient room?",a:["A minimum of two receptacles in the bathroom","A maximum of four tamper-resistant outlets","A minimum of eight non-locking receptacles","At least one isolated-ground receptacle in the patient care vicinity"],c:2,e:"Patient bed locations require at least eight non-locking receptacles, tamper-resistant in patient care spaces. Isolated-ground receptacles are prohibited in the vicinity, and bathrooms have no minimum."},
{id:"u3l6-3",t:"u3l6",q:"Which scenario violates NFPA 99?",a:["A detachable power cord with a locking mechanism on a portable monitor","A device in the patient care vicinity with 0.1 ohm between chassis and ground","A relocatable power tap loaded to 60 percent of its rating","Tinned loose ends of a stranded cable under a screw terminal"],c:3,e:"Tinned stranded ends under screw terminals are prohibited because the solder cold-flows and loosens. The other items are within the code's limits."},
{id:"u3l6-4",t:"u3l6",q:"An oxygen storage area is protected by compliant automatic sprinklers. What is the minimum separation required between the oxygen cylinders and stored flammable liquids?",a:["5 feet","20 feet","50 feet","No separation is required"],c:0,e:"Oxidizing gases must be at least 20 feet from flammables, reduced to 5 feet when the space has compliant sprinklers, or no separation inside a compliant gas cabinet."},
{id:"u3l6-5",t:"u3l6",q:"Under NFPA 99, how far may a data outlet be from its telecommunications room, and how many rooms must a floor have at minimum?",a:["100 meters; one per building","90 meters; one per floor","50 meters; two per floor","300 meters; one per floor"],c:1,e:"No data outlet may be more than 90 meters of cable from its telecommunications room, and each floor needs at least one room, each serving no more than 20,000 square feet."},

// u3l7
{id:"u3l7-1",t:"u3l7",q:"Which statement about workplace exposure limits is most accurate?",a:["Short-term exposure limits are averaged over a full shift","The CDC publishes the recommended exposure limits","Permissible exposure limits are the maximum legal exposure limits","Recommended exposure levels are the doses that kill half of test subjects"],c:2,e:"PELs are OSHA's legal maximums averaged over a shift. STELs are 15-minute ceilings, NIOSH publishes RELs, and LD50 is the lethal dose for half of subjects."},
{id:"u3l7-2",t:"u3l7",q:"Which is NOT a recognized GHS physical or health hazard pictogram?",a:["Flammable","Irritant","Corrosive","Reducer"],c:3,e:"GHS pictograms include flame, flame over circle (oxidizer), corrosion, exclamation mark (irritant), and others. There is no reducer pictogram; oxidizers are the hazard because they feed combustion."},
{id:"u3l7-3",t:"u3l7",q:"Which statement about blood-borne pathogen waste is FALSE?",a:["Waste with dried blood may be placed directly in regular trash without sealing","Contaminated broken glass may not be picked up by hand","Waste with liquid blood must be sealed and disposed of separately","The standard defines blood-borne pathogens as disease-causing microorganisms in human blood"],c:0,e:"Items with dried blood may go with regular trash only after being sealed in a plastic bag. Free-flowing blood is regulated waste for a licensed hauler."},
{id:"u3l7-4",t:"u3l7",q:"Which organization is the nonprofit accrediting body for clinical laboratories, inspecting every two years under CMS authority?",a:["The Joint Commission","College of American Pathologists","DNV","OSHA"],c:1,e:"CAP accredits medical and hospital laboratories with regular and unannounced inspections. The Joint Commission and DNV accredit healthcare organizations; OSHA protects workers."},
{id:"u3l7-5",t:"u3l7",q:"Which legislative act requires reporting of adverse events involving medical equipment?",a:["HITECH Act","HIPAA","Safe Medical Devices Act","DMCA"],c:2,e:"The SMDA extends FDA medical device reporting to user facilities: deaths to the FDA and manufacturer, serious injuries to the manufacturer, with annual summaries."},

// u4l7
{id:"u4l7-1",t:"u4l7",q:"A sphygmomanometer is reported to always read too high. What is the MOST appropriate way to check the device?",a:["Visually inspect the cuff and patch any leak","Ask staff to test it on another patient","Recalibrate the manometer and return it to service","Test it on a noninvasive blood pressure simulator"],c:3,e:"A simulator gives a controlled diagnosis without a patient. A leak would lower readings, not raise them, so patching is the wrong direction, and recalibrating before diagnosing skips the cause."},
{id:"u4l7-2",t:"u4l7",q:"Which ECG appearance indicates ventricular tachycardia?",a:["Wide QRS complexes at a rapid rate","Rapid irregular P waves","Rapid, consistent narrow waves","Extreme chaotic waves with no complexes"],c:0,e:"Ventricular tachycardia produces rapid, wide QRS complexes. Rapid consistent narrow waves are atrial tachycardia, quivering irregular atrial activity is atrial fibrillation, and chaos with no complexes is ventricular fibrillation."},
{id:"u4l7-3",t:"u4l7",q:"Which standard ECG lead provides a view of the inferior wall of the heart?",a:["V1","aVF","Lead I","aVR"],c:1,e:"aVF's positive pole is the left leg, below the heart, so it views the inferior wall. V1 views horizontally, aVR from the right arm, and lead I across the shoulders."},
{id:"u4l7-4",t:"u4l7",q:"Which set of parameters is measured by a ventilator analyzer?",a:["Carbon dioxide concentration, oxygen concentration, gas pressure, inspiratory time","Gas flow, carbon dioxide concentration, gas pressure, breath detection threshold","Gas flow, oxygen concentration, gas pressure, breath detection threshold","Gas flow, carbon dioxide concentration, oxygen concentration, inspiratory time"],c:2,e:"Ventilator analyzers measure flow, pressure, volumes, oxygen concentration, and breath detection thresholds. They do not measure carbon dioxide concentration; that is capnography."},
{id:"u4l7-5",t:"u4l7",q:"What does the continuity mode of a digital multimeter measure?",a:["Peak voltage across a component","The frequency of a signal","Total current between two points","Total resistance between two points in an unpowered circuit"],c:3,e:"Continuity mode passes a small current through an unpowered circuit and measures resistance, sounding a tone when it is low enough to indicate a connection."},

// u5l5
{id:"u5l5-1",t:"u5l5",q:"Which phenomenon allows an ultrasound transducer to convert mechanical pressure into an electrical charge?",a:["Piezoelectricity","The Doppler effect","Photoluminescence","The pyroelectric effect"],c:0,e:"Piezoelectric crystals produce charge when deformed and deform when charged, so one element both sends and receives. Doppler describes frequency shifts from motion, not the conversion."},
{id:"u5l5-2",t:"u5l5",q:"Blood moving toward a Doppler ultrasound transducer will produce which change in the reflected sound?",a:["A lower pitch","A higher pitch","No change in pitch","An increase in volume only"],c:1,e:"Motion toward the transducer compresses the reflected waves, raising their frequency, which is heard as a higher pitch."},
{id:"u5l5-3",t:"u5l5",q:"Which imaging technique produces live moving images of internal tissues using continuous X-rays and an image intensifier?",a:["Radiography","Computed tomography","Fluoroscopy","Magnetic resonance imaging"],c:2,e:"Fluoroscopy uses a continuous or pulsed X-ray beam and an image intensifier or flat panel to show real-time motion, such as contrast flowing through vessels."},
{id:"u5l5-4",t:"u5l5",q:"By which method does an MRI scanner form an image?",a:["Rotating X-ray slices reconstructed by computer","Injecting a positron-emitting tracer","Occlusion of electromagnetic fields by dense tissue","Detecting the release of energy as magnetically aligned atoms realign"],c:3,e:"MRI aligns atomic spins in a strong magnet, disturbs them with radio pulses, and detects the signals emitted as they realign. Rotating X-rays describe CT and tracers describe PET."},
{id:"u5l5-5",t:"u5l5",q:"Which type of radiation is detected in positron emission tomography?",a:["Gamma","Beta","Alpha","Delta"],c:0,e:"When a positron from the tracer meets an electron, both annihilate into two gamma photons traveling in opposite directions, which the detector ring times and locates."},

// u5l6
{id:"u5l6-1",t:"u5l6",q:"What structure is examined with an ophthalmoscope?",a:["The tympanic membrane","The fundus of the eye","The palatine tonsils","The nasal sinuses"],c:1,e:"An ophthalmoscope views the interior of the eye, the fundus, including the retina and optic disc. The tympanic membrane is viewed with an otoscope."},
{id:"u5l6-2",t:"u5l6",q:"Which of the following is NOT measured by an audiometer?",a:["Sensorineural hearing","Hearing threshold","Sound frequencies","Conductive hearing"],c:2,e:"An audiometer generates tones at set frequencies and measures the threshold at which they are heard, distinguishing sensorineural from conductive loss. It does not measure frequencies."},
{id:"u5l6-3",t:"u5l6",q:"A handheld tympanic thermometer consistently gives low readings across several attempts with fresh probe covers. What is the MOST probable cause?",a:["Low battery power","A disconnected infrared sensor","A torn probe cover","A cracked lens"],c:3,e:"A cracked lens focuses less infrared onto the thermopile, lowering readings. A disconnected sensor or dead battery would give no reading, and fresh covers rule out a torn cover."},
{id:"u5l6-4",t:"u5l6",q:"Which electrode system measures the partial pressure of carbon dioxide in a blood gas analyzer?",a:["Severinghaus electrode","Glass pH electrode alone","Clark electrode","Mercury electrode"],c:0,e:"The Severinghaus electrode places a glass pH electrode behind a CO2-permeable membrane in bicarbonate; CO2 changes the pH, which is read as voltage. The Clark electrode measures oxygen."},
{id:"u5l6-5",t:"u5l6",q:"A laboratory spectrophotometer works intermittently at every wavelength. What is the MOST likely cause?",a:["A disconnected photosensor","A faulty power cable","An aging deuterium lamp","A failed wavelength motor"],c:1,e:"Intermittent failure across all wavelengths points to the power cable. A disconnected sensor would read nothing, an old deuterium lamp would fail only in the ultraviolet, and a dead motor could not change wavelengths."},

// u5l7
{id:"u5l7-1",t:"u5l7",q:"An enteral feeding pump gives a constant low-flow error. Which of the following would NOT cause this alert?",a:["Kinked tubing upstream of the pump","Feeding solution coating the drip chamber walls","Excessive ambient light at the feeding set detector","A dislodged drip chamber"],c:2,e:"Bright light on the detector causes a 'no set detected' error, not low flow. A coated or dislodged drip chamber and kinked tubing all trigger low-flow alarms."},
{id:"u5l7-2",t:"u5l7",q:"Which infusion device most commonly uses a peristaltic mechanism?",a:["Syringe pump","Pressure infuser","PCA pump","Enteral feeding pump"],c:3,e:"Enteral pumps use rotary peristaltic heads to push viscous formula through wide tubing. Syringe and PCA pumps depress plungers, and pressure infusers squeeze a bag."},
{id:"u5l7-3",t:"u5l7",q:"A PCA pump delivers its baseline infusion but does not provide doses when the patient presses the pendant. What should be checked FIRST?",a:["The pump settings","The patient pendant","The motor","The power cable"],c:0,e:"If the lockout interval or the maximum dose has been reached, requests are correctly refused. Settings are checked before the pendant or motor; a motor fault would also affect the basal rate."},
{id:"u5l7-4",t:"u5l7",q:"Which describes normal operation of a sequential compression device?",a:["All cuffs inflate and deflate simultaneously, then rest","Cuffs inflate in series from the distal to the proximal end, then deflate for a rest period","Cuffs inflate in series from the proximal to the distal end, then deflate for a rest period","Each cuff inflates and deflates alone in turn without a rest period"],c:1,e:"Inflating from the ankle toward the thigh pushes venous blood back toward the heart, imitating walking. Reversed order would push blood toward the foot."},
{id:"u5l7-5",t:"u5l7",q:"Which action would NOT increase the effectiveness of bilirubin phototherapy?",a:["Replacing a dim bulb with a brighter one","Moving the light source closer to the skin","Replacing an old bulb with one emitting 630 to 720 nm","Exposing more skin directly to the light"],c:2,e:"Bilirubin absorbs light from roughly 360 to 520 nm, most effectively in the blue-green region. A red or infrared bulb at 630 to 720 nm does nothing; brighter, closer, and more exposure all help."},

// u6l5
{id:"u6l5-1",t:"u6l5",q:"Which component of a hemodialysis circuit is located after the dialyzer, just before blood returns to the patient?",a:["Blood pump","Heparin pump","Dialyzer pressure monitor","Air trap and detector"],c:3,e:"The air trap and detector are the last components before the return, stopping the pump if bubbles are found. The blood pump comes first and the heparin pump precedes the dialyzer."},
{id:"u6l5-2",t:"u6l5",q:"Which of the following is NOT a component of external epicardial pacing?",a:["Subclavian leads","Output and rate adjustment","An AC power supply option","Electrodes with conductive gel"],c:0,e:"Epicardial pacing uses wires on the heart's surface brought out through the chest. Subclavian venous leads belong to transvenous pacing."},
{id:"u6l5-3",t:"u6l5",q:"In an anesthesia machine, which section is the first one downstream of the flow control for the anesthetic agent?",a:["Common gas outlet","Vaporizer","Ventilator","Gas supply"],c:1,e:"Gas passes the flow controls and then the vaporizer, which adds agent, before the streams rejoin at the common gas outlet and continue to the circuit and ventilator."},
{id:"u6l5-4",t:"u6l5",q:"Which laser type produces a wavelength appropriate for skin surface procedures because it is strongly absorbed by water?",a:["Excimer","Nd:YAG","Carbon dioxide","Argon"],c:2,e:"CO2 lasers emit far-infrared light absorbed by water, giving shallow penetration ideal for soft tissue and skin. Nd:YAG penetrates deeper, argon targets pigment, and excimer emits ultraviolet."},
{id:"u6l5-5",t:"u6l5",q:"A tabletop autoclave is reported to produce no steam. Which set of problems is most likely responsible?",a:["Defective water pump, low water pressure, leaky steam valve, burnt-out heater","Low water pressure, leaky steam valve, tripped breaker, burnt-out heater","Defective water pump, leaky steam valve, tripped breaker, burnt-out heater","Defective water pump, low water pressure, tripped breaker, burnt-out heater"],c:3,e:"Steam production fails when water cannot reach the heater or the heater cannot run: a bad pump, low pressure, a tripped breaker, or a burned-out element. A leaky steam valve affects pressure control, not production."},

// u7l6
{id:"u7l6-1",t:"u7l6",q:"An infusion pump switched to backup battery power while plugged in and no longer runs on AC. What should be checked FIRST?",a:["The power cable and outlet","The voltage regulator output","The internal power board","The battery charging circuit"],c:0,e:"Power cables are abused and fail often. Check the cable's continuity and the outlet before opening the pump to examine its internal power circuit."},
{id:"u7l6-2",t:"u7l6",q:"Which of the following is NOT a factor in the criticality of a medical device?",a:["The risk of harm if the device fails","The time required to perform maintenance","The frequency of preventive maintenance","The device's necessity to the organization"],c:1,e:"Criticality combines importance to the mission, likelihood of failure or maintenance demand, and potential harm. Repair or maintenance time is not part of the score."},
{id:"u7l6-3",t:"u7l6",q:"Which phrase best describes root cause analysis?",a:["A method of finding the most cost-efficient solution to a problem","A set of methods to improve quality and reduce error rates","A series of iterative questions to determine the underlying cause of failure and develop a solution from it","An interrogative process to find where in the task chain a failure occurred"],c:2,e:"Root cause analysis keeps asking why until it reaches the underlying cause, then directs the solution at that cause to prevent recurrence. It is not a cost exercise."},
{id:"u7l6-4",t:"u7l6",q:"Which situation is most likely a device or system error rather than a use error?",a:["A medication overdose from a misconfigured infusion pump","Noisy ECG readings near high-powered electrical equipment","Blurry images from a newly inspected handheld ultrasound","A nurse station not receiving data from vital signs monitors"],c:3,e:"Missing data across the network is a network or hardware failure. Misconfiguration is use error, blurry images from a good unit usually mean too little gel, and ECG noise near heavy equipment is an environmental use issue."},
{id:"u7l6-5",t:"u7l6",q:"Which tool would NOT help differentiate a local connectivity problem from a network-wide one for patient monitors?",a:["An electrical safety analyzer","A cable tester or tracer","The ping utility","A digital multimeter"],c:0,e:"Safety analyzers measure leakage and ground resistance, which are electrical safety matters, not connectivity. Ping, cable testers, and a multimeter's continuity check all test the connection."},

// u8l6
{id:"u8l6-1",t:"u8l6",q:"A capnography monitor powers on but displays no EtCO2 value; the filter and moisture trap are new. Which fault and test correspond?",a:["A clogged filter; check the nasal cannula and tubing","An internal leak; occlude the port upstream of the moisture trap","An air leak; occlude the port downstream of the filter","An absent filter; remove and reconnect the moisture trap"],c:1,e:"With new consumables, an internal leak is the remaining fault, tested by occluding the port upstream of the filter and moisture trap to see whether the device holds."},
{id:"u8l6-2",t:"u8l6",q:"A vital signs monitor shows no respiration rate, but ECG, SpO2, and other functions work normally. What is the likely cause?",a:["A faulty SpO2 probe","A disconnected monitor","A faulty input printed circuit board","Bad electrode leads"],c:2,e:"Bad leads or a disconnected monitor would also disrupt the ECG, and the SpO2 probe is unrelated to respiration. A fault on the input board's respiration channel leaves the other functions intact."},
{id:"u8l6-3",t:"u8l6",q:"A histology cryostat consistently produces squashed sections despite a new blade and correct set temperatures. Which is NOT a probable cause?",a:["There are cracks in the sectioning chamber","The thermistor is faulty","The refrigeration works intermittently","The cutting speed is too slow"],c:3,e:"Slow cutting does not compress sections. A faulty thermistor, intermittent refrigeration, or chamber cracks all let the block warm, which squashes sections."},
{id:"u8l6-4",t:"u8l6",q:"An electrosurgical generator turns on and appears to work but delivers no output. What is the MOST likely cause?",a:["A blown high-voltage power supply fuse","A loose display connector","A blown low-voltage power supply fuse","A faulty power switch"],c:0,e:"The high-voltage supply drives the RF output. A blown low-voltage fuse or bad power switch would keep the unit from turning on, and a display connector fault would only blank the display."},
{id:"u8l6-5",t:"u8l6",q:"An aspirator's suction has weakened gradually over time. Which of the following is NOT a probable cause?",a:["Loose tubing","A blown fuse","A cracked collection chamber","A clogged hydrophobic filter"],c:1,e:"A blown fuse stops the pump entirely rather than weakening suction gradually. Leaks and a progressively clogging filter reduce vacuum over time."},

// u9l7
{id:"u9l7-1",t:"u9l7",q:"Which statement about the HITECH Act is FALSE?",a:["It penalizes providers who do not implement electronic health records","It incentivizes adoption of certified electronic health records","It sets guidelines for hospital spending on electronic health records","It defines requirements for meaningful use of electronic health records"],c:2,e:"HITECH pays incentives, imposes penalties, and defines meaningful use, but it does not set spending guidelines beyond its adoption requirements."},
{id:"u9l7-2",t:"u9l7",q:"Which title of HIPAA contains the privacy and security rules and determines fines for violations?",a:["Title I","Title V","Title III","Title II"],c:3,e:"Title II's Administrative Simplification provisions hold the privacy and security rules and the fraud and abuse controls. Title I covers insurance portability."},
{id:"u9l7-3",t:"u9l7",q:"Which of the following is included in the FDA definition of a Medical Device Data System?",a:["A vital signs monitor in a patient room","A television showing news in a clinic lobby","A power cable to the nurses' station computers","A tracking board in a surgical waiting room"],c:0,e:"An MDDS stores, transfers, reformats, or displays medical device data. Only the vital signs monitor handles medical data; the others do not."},
{id:"u9l7-4",t:"u9l7",q:"Which statement about IEC 80001 is true?",a:["It was published by the FDA","It applies to any medical organization that connects medical devices across its network","It sets acceptable risk levels for IT networks with medical devices","It defines medical devices to include drugs and implants used in patient care"],c:1,e:"IEC 80001-1 was published by IEC and ISO, excludes drugs from its device definition, and leaves acceptable risk levels to each jurisdiction, but applies to any network incorporating medical devices."},
{id:"u9l7-5",t:"u9l7",q:"Which item is NOT a consideration in the Manufacturer Disclosure Statement for Medical Device Security (MDS2)?",a:["User authorization and authentication","The presence of an emergency access (break-glass) feature","Structural integrity of the device","Plans for third-party components"],c:2,e:"The MDS2 catalogs security features such as emergency access, authentication, updates, backups, and third-party component plans. Physical structural integrity is not a security item."},

// u9l8
{id:"u9l8-1",t:"u9l8",q:"Which of the following is NOT a layer of the OSI network model?",a:["Physical layer","Session layer","Application layer","Conversion layer"],c:3,e:"The seven layers are physical, data link, network, transport, session, presentation, and application. Data conversion is a function of the presentation layer."},
{id:"u9l8-2",t:"u9l8",q:"Which binary subnet mask corresponds to 255.255.255.240?",a:["11111111.11111111.11111111.11110000","11111111.11111111.11111111.00110101","11111111.11111111.11111111.11111100","11111111.11111111.11111111.11111000"],c:0,e:"240 in binary is 11110000. A mask must be contiguous ones followed by zeros, so 00110101 is invalid; 11111100 is 252 and 11111000 is 248."},
{id:"u9l8-3",t:"u9l8",q:"Which statement describes the function of the ping utility?",a:["It tests the current and resistance of a physical connection","It sends data to check the time to send and receive a message","It echoes back all information received from another device","It is the function ultrasound transducers use to send and receive signals"],c:1,e:"Ping sends ICMP echo requests and reports whether replies return, the round-trip time, and packet loss. It does not test cable electrical properties or echo everything received."},
{id:"u9l8-4",t:"u9l8",q:"Which action would NOT effectively test the connection between two computers on a wired network?",a:["Pinging one computer's local address from the other","Using an Ethernet cable tester","Power cycling one device at a time","Checking end-to-end cable resistance with a multimeter"],c:2,e:"Power cycling may clear a fault but does not identify whether a working connection exists. Ping, a cable tester, and a resistance check each verify the link."},
{id:"u9l8-5",t:"u9l8",q:"Which statement about a picture archiving and communication system (PACS) is true?",a:["PACS generates medical data from test equipment","PACS primarily transfers patient health insurance information","PACS tracks and manages laboratory sample data","PACS stores and transports imaging data on medical networks"],c:3,e:"PACS stores, transports, and displays medical images with patient data attached, interfacing with RIS and LIS. Sample tracking is the laboratory information system's job."}
);

/* FieldReady Academy course engine. Reads FRA.course (a course pack manifest) and the pack's data.
   Flow: 10-question starter test (with confidence) -> personalized tutorial -> 50-question test ->
   retraining tutorial built from the misses -> practice tests until three in a row at 85% or better.
   Every test ends with an explanation of each wrong answer and each lucky guess. */
(function () {
  'use strict';

  // ---------- course manifest ----------
  const course = FRA.course;
  if (!course || !Array.isArray(course.domains) || !course.test) throw new Error('FRA.course manifest missing or incomplete');
  const DOMAINS = {}; course.domains.forEach(d => { DOMAINS[d.id] = d; });
  const DOMAIN_IDS = course.domains.map(d => d.id);
  const T = course.test;
  const PASS_PCT = T.passPct, STREAK_NEEDED = T.streakNeeded, EXAM_N = T.questions, EXAM_MINUTES = T.minutes;
  const STARTER_N = DOMAIN_IDS.length * T.starterPerDomain, CHECKPOINT_N = T.checkpointN, CHECKPOINT_PASS = T.checkpointPass;
  const REBUILD_PTS = 3 * T.starterPerDomain; // every starter question in the domain wrong
  const ALL_WORD = T.starterPerDomain === 2 ? 'both' : 'all';
  const CONF = [[1, 'Guess'], [2, 'Unsure'], [3, 'Fairly sure'], [4, 'Sure'], [5, 'Certain']];
  const STORE_KEY = `fra.${course.id}.state.v3`;
  // Feedback delivery. Feedback is always saved in the browser and exportable from the Feedback tab.
  // Optionally set feedbackEndpoint (a URL that accepts POSTed JSON) and/or feedbackEmail in the course manifest.
  const FEEDBACK_ENDPOINT = course.feedbackEndpoint || '';
  const FEEDBACK_EMAIL = course.feedbackEmail || '';
  const FB_CATS = {
    question: ['Answer key is wrong', 'Question is unclear or ambiguous', 'Explanation is wrong or unclear', 'Too easy or off-topic', 'Typo', 'Other'],
    lesson: ['Content is inaccurate', 'Unclear or confusing', 'Missing something the exam covers', 'Too long or too short', 'Typo', 'Other'],
    overall: ['Content accuracy', 'Difficulty', 'Website bug', 'Design or usability', 'Idea or request', 'Other']
  };
  const WHERE_LABEL = { starter: 'Starter test', full: `${EXAM_N}-question test`, practice: 'Practice test', checkpoint: 'Lesson checkpoint', train: 'Drills', 'starter-results': 'Starter test results', 'full-results': `${EXAM_N}-question test results`, 'practice-results': 'Practice test results', custom: 'Custom test', 'custom-results': 'Custom test results', callout: 'Lesson callout' };
  const STARTER_POOL = course.starterPool || {};
  const CORE = course.core || {};

  // ---------- data index ----------
  const units = (FRA.units || []).slice().sort((a, b) => a.n - b.n);
  const lessons = []; const L = {};
  units.forEach(u => u.lessons.forEach(l => { l.unit = u; l.index = lessons.length; lessons.push(l); L[l.id] = l; }));
  const bank = FRA.questions || []; const Q = {}; bank.forEach(q => { Q[q.id] = q; });
  const byLesson = {}; bank.forEach(q => { (byLesson[q.t] = byLesson[q.t] || []).push(q); });
  const lessonsByDomain = {}; DOMAIN_IDS.forEach(d => { lessonsByDomain[d] = []; });
  lessons.forEach(l => { if (!lessonsByDomain[l.domain]) throw new Error(`lesson ${l.id} uses unknown domain ${l.domain}`); lessonsByDomain[l.domain].push(l); });
  const gens = FRA.generators || {};
  document.title = course.name;

  // ---------- access ----------
  // Free set: the cheat sheet, the starter test, and the lessons below. Everything else needs entitlement.
  const FREE_SET = new Set();
  (function () { const f = course.free || {}; if (Array.isArray(f.lessons)) f.lessons.forEach(id => FREE_SET.add(id)); else if (typeof f.lessons === 'number') lessons.slice(0, f.lessons).forEach(l => FREE_SET.add(l.id)); })();
  const entitled = () => !!course.freeCourse || window.FRA_ENTITLED === true;
  const lessonLocked = id => !entitled() && !FREE_SET.has(id);
  const testsLocked = kind => !entitled() && kind !== 'starter';
  function paywall(what) {
    const btn = course.upgradeUrl ? `<a class="btn primary" href="${esc(course.upgradeUrl)}">Unlock the full course</a>` : `<button class="btn primary" data-act="upgrade">Unlock the full course</button>`;
    return `<div class="card lift stack paywall"><div class="eyebrow">Full course</div><h3>${esc(what)} is part of the full ${esc(course.name)} course.</h3><p class="ink2">The cheat sheet, the starter test, and the first ${FREE_SET.size} lessons are free. The full course adds every lesson, the ${EXAM_N}-question test, retraining, practice tests, and drills.</p><div class="row">${btn}<button class="btn ghost" data-act="go" data-arg="course">See the free lessons</button></div></div>`;
  }

  // ---------- utilities ----------
  const $ = (sel, root) => (root || document).querySelector(sel);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const pct = (c, t) => t ? Math.round(100 * c / t) : 0;
  const fmtDate = ts => new Date(ts).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
  const letters = ['A', 'B', 'C', 'D'];
  const inline = s => esc(s).replace(/\{\{(.+?)\}\}/g, '<code>$1</code>').replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;

  function renderBody(md) {
    const lines = md.split('\n'); let html = ''; let list = []; let olist = []; let pre = null;
    const flush = () => {
      if (list.length) { html += '<ul>' + list.map(li => `<li>${inline(li)}</li>`).join('') + '</ul>'; list = []; }
      if (olist.length) { html += '<ol>' + olist.map(li => `<li>${inline(li)}</li>`).join('') + '</ol>'; olist = []; }
    };
    for (const raw of lines) {
      if (pre !== null) { if (raw.trim().startsWith('```')) { html += `<pre>${esc(pre.join('\n'))}</pre>`; pre = null; } else pre.push(raw); continue; }
      const line = raw.trim();
      if (line.startsWith('```')) { flush(); pre = []; continue; }
      if (!line) { flush(); continue; }
      if (line.startsWith('## ')) { flush(); html += `<h3>${inline(line.slice(3))}</h3>`; }
      else if (line.startsWith('- ')) { if (olist.length) flush(); list.push(line.slice(2)); }
      else if (/^\d+\. /.test(line)) { if (list.length) flush(); olist.push(line.replace(/^\d+\. /, '')); }
      else if (line.startsWith('> ')) { flush(); html += `<div class="tip">${inline(line.slice(2))}</div>`; }
      else { flush(); html += `<p>${inline(line)}</p>`; }
    }
    if (pre !== null) html += `<pre>${esc(pre.join('\n'))}</pre>`;
    flush(); return html;
  }

  // ---------- state ----------
  function fresh() {
    return { v: 3, course: course.id, view: { name: 'cheatsheet', arg: 'intro' }, lessons: {}, qstats: {}, topics: {}, exams: [], passStreak: 0, official: null, plan: null, active: null, settings: { timer: true }, feedback: [], seen: {}, created: Date.now() };

  let S = load();
  function load() {

      for (const key of (course.legacyStoreKeys || [])) {

  }
  function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) { /* ignore */ } }

  const lstat = id => S.lessons[id] || (S.lessons[id] = { status: 'new', best: 0, attempts: 0, passedAt: 0 });
  const tstat = id => S.topics[id] || (S.topics[id] = { hist: [], attempts: 0, correct: 0, streak: 0, last: 0 });

  function topicPriority(id) { const t = S.topics[id]; if (!t) return 0; return t.hist.reduce((a, b) => a + b, 0); }
  function topicMastered(id) { const t = S.topics[id]; if (!t) return false; return t.streak >= 3 || (t.attempts >= 3 && topicPriority(id) === 0); }

  function recordAnswer(q, choice, conf) {

  // ---------- question selection ----------
  function leastSeen(pool, used) {

  function pickForLesson(lessonId, n, used, genShare) {

    used = used || new Set();
    for (let i = 0; i < n * 3 && out.length < n; i++) {

      if (gens[lessonId] && Math.random() < (genShare == null ? 0.35 : genShare)) q = FRA.generate(lessonId);

  function buildExam(quotas) {
    const items = []; const used = new Set();

  const MAX_N = Math.max(50, bank.length);
  const clampN = n => Math.min(MAX_N, Math.max(5, parseInt(n, 10) || EXAM_N));
  const clampMin = m => { const v = parseInt(m, 10); return isNaN(v) ? EXAM_MINUTES : Math.min(600, Math.max(0, v)); };
  function pctWeights() { const w = {}; DOMAIN_IDS.forEach(d => { w[d] = DOMAINS[d].pct; }); return w; }
  function defaultSetup() { return { n: EXAM_N, minutes: EXAM_MINUTES, weights: pctWeights() }; }
  function currentSetup() {
    const s = S.settings.testSetup; if (!s) return defaultSetup();

    return { n: clampN(s.n), minutes: clampMin(s.minutes), weights };

  // Largest-remainder apportionment of n questions across domains by relative weight. Zero weight excludes a domain.
  function apportion(n, weights) {

  }

  const slim = q => q.gen ? q : q.id; // generated questions stored inline, bank questions by id
  const fat = x => typeof x === 'string' ? Q[x] : x;

  // ---------- plan (personalized tutorial) ----------
  function planFromStarter(rec, examIdx) {
    const entries = {}; const domPts = {}; const domCount = {}; DOMAIN_IDS.forEach(d => { domPts[d] = 0; domCount[d] = 0; });
    const add = (id, reason) => { if (!L[id]) return; (entries[id] = entries[id] || { id, reasons: [] }).reasons.push(reason); };

  function stage() {

  function lastExam(kind) { for (let i = S.exams.length - 1; i >= 0; i--) if (!kind || S.exams[i].kind === kind) return S.exams[i]; return null; }

        <div class="stat"><div class="eyebrow">Tutorial</div><div class="big">${S.plan ? (S.plan.lessons.length - rem.length) + '<small> / ' + S.plan.lessons.length + ' lessons</small>' : '<small>not built yet</small>'}</div></div>
        <div class="stat"><div class="eyebrow">Lessons passed</div><div class="big">${passedCount}<small> / ${lessons.length}</small></div></div>
        <div class="stat"><div class="eyebrow">Last test</div><div class="big">${last ? `${last.pct}<small>% · ${last.score} of ${last.total}</small>` : '<small>none yet</small>'}</div>${last ? `<div class="muted" style="font-size:.85rem">${testLabel(last)}${lastMeta.attempt > 1 ? ` (attempt ${lastMeta.attempt})` : ''} · ${lastMeta.wrong} wrong · ${lastMeta.guess} guessed</div>` : ''}</div>
        <div class="stat"><div class="eyebrow">Pass streak</div><div class="big">${S.passStreak}<small> / ${STREAK_NEEDED} at ${PASS_PCT}%+</small></div></div>
      </div>
      <div class="card stack">
        <div class="row spread"><h3>Accuracy by exam domain</h3><span class="muted" style="font-size:.9rem">${mastered} of ${lessons.length} topics mastered</span></div>
        ${domainBars()}
      </div>
      ${weak.length && !rem.length ? `<div class="card stack"><div class="row spread"><h3>Weak topics for extra drills</h3><button class="btn small" data-act="start-train">Start drills</button></div><div class="topic-list">${weak.slice(0, 5).map(id => topicRow(id)).join('')}</div></div>` : ''}
    </div>`;
  }
  function stageStrip(st) {
    const steps = ['starter', 'tutorial', 'fulltest', 'retrain', 'practice', 'official', 'ready'];
    const idx = steps.indexOf(st);
    return `<div class="stage-strip">${steps.map((s, i) => `<div class="stage ${i < idx ? 'done' : ''} ${i === idx ? 'cur' : ''}"><span class="led ${i < idx ? 'green' : i === idx ? 'amber' : 'off'}"></span><span>${STAGE_LABEL[s]}</span></div>`).join('')}</div>`;
  }
  function greeting() {
    if (!S.exams.length) return 'Let’s find out where you stand.';
    const r = readiness();
    if (r >= 70) return 'Almost there. Keep the streak going.';
    if (r >= 40) return 'Good progress. Time to close the gaps.';
    return 'Keep going. Every lesson counts.';
  }
  function topicRow(id) {
    const l = L[id]; const p = topicPriority(id); const t = S.topics[id] || { attempts: 0, correct: 0 };
    return `<div class="topic-item"><div><div class="t-title">${esc(l.title)}</div><div class="t-sub">Unit ${l.unit.n} · ${DOMAINS[l.domain].short} · ${t.correct}/${t.attempts} correct</div></div>
      <div class="row"><span class="pill ${p >= 6 ? 'bad' : p >= 3 ? 'warn' : ''}">${p} pts</span><button class="btn small ghost" data-act="lesson" data-arg="${id}">Lesson</button></div></div>`;
  }
  function domainBars() {
    return `<div class="bars">${DOMAIN_IDS.map(d => { const a = domainAccuracy(d); const v = a.t ? pct(a.c, a.t) : 0;
      return `<div class="bar-row"><span class="label">${DOMAINS[d].short} <span class="muted">${DOMAINS[d].pct}%</span></span><div class="track"><i class="${a.t ? '' : 'dim'}" style="width:${a.t ? v : 100}%"></i></div><span class="value">${a.t ? v + '%' : '—'}</span></div>`; }).join('')}</div>`;
  }

  // ---------- tutorial (plan) ----------
  function reasonLabel(r) {
    if (r.kind === 'domain') return r.level === 'rebuild' ? `${DOMAINS[r.d].short}: ${ALL_WORD} starter questions missed` : `${DOMAINS[r.d].short}: gap on the starter test`;
    const src = r.source === 'starter' ? 'starter test' : 'last test';
    return `${KIND_LABEL[r.kind]} on the ${src}`;
  }
  function lessonWhy(r) { const d = DOMAINS[r.d].short; return r.level === 'rebuild' ? `In your tutorial because you missed ${ALL_WORD} ${d} questions on the starter test.` : `In your tutorial because the starter test showed a gap in ${d}.`; }
  function reasonPill(e) {
    const kinds = e.reasons.map(r => r.kind);
    if (kinds.includes('wrong-confident')) return '<span class="pill bad">Wrong, confident</span>';
    if (kinds.includes('wrong')) return '<span class="pill bad">Wrong</span>';
    if (kinds.includes('guess')) return '<span class="pill warn">Guessed</span>';
    const d = e.reasons.find(r => r.kind === 'domain');
    if (d) return `<span class="pill">${d.level === 'rebuild' ? 'Whole domain' : 'Core lesson'}</span>`;
    return '<span class="pill">Review</span>';
  }
  function viewTutorial() {
    if (!S.plan) {
      return `<div class="content stack" style="gap:18px"><div><div class="eyebrow">Tutorial</div><h1>No tutorial yet</h1><p class="ink2" style="margin-top:6px">${stage() === 'starter' ? 'Take the starter test and your tutorial will be built from the results.' : 'Your last test had no misses or guesses, so there is nothing to retrain. Take a practice test to find new gaps.'}</p></div>
        <div class="row"><button class="btn primary" data-act="start-exam" data-arg="${stage() === 'starter' ? 'starter' : 'practice'}">${stage() === 'starter' ? 'Starter test' : 'Practice test'}</button><button class="btn" data-act="go" data-arg="course">Browse all lessons</button></div></div>`;
    }
    const rem = planRemaining(); const done = S.plan.lessons.length - rem.length;
    const src = S.exams[S.plan.examIdx];
    const byUnit = {}; S.plan.lessons.forEach(e => { const u = L[e.id].unit; (byUnit[u.id] = byUnit[u.id] || { u, list: [] }).list.push(e); });
    const groups = Object.values(byUnit).sort((a, b) => S.plan.source === 'starter' ? a.u.n - b.u.n : Math.min(...a.list.map(e => S.plan.lessons.indexOf(e))) - Math.min(...b.list.map(e => S.plan.lessons.indexOf(e))));
    return `<div class="content stack" style="gap:18px">
      <div><div class="eyebrow">${S.plan.source === 'starter' ? 'Your tutorial' : 'Retraining tutorial'} · built from your ${S.plan.source === 'starter' ? 'starter test' : 'test'} on ${src ? fmtDate(src.date) : ''}</div>
        <h1>${rem.length ? `${plural(rem.length, 'lesson')} to go, about ${planMinutes(rem)} minutes` : 'Tutorial complete'}</h1>
        <div class="row" style="margin-top:10px"><div class="meter ${rem.length ? '' : 'good'}"><i style="width:${pct(done, S.plan.lessons.length)}%"></i></div><span class="tnum muted">${done}/${S.plan.lessons.length}</span></div></div>
      ${S.plan.source === 'starter' ? `<div class="card soft stack" style="gap:8px"><div class="eyebrow">How your starter test shaped this</div><div class="row" style="gap:8px">${DOMAIN_IDS.map(d => `<span class="pill ${S.plan.depth[d] === 'rebuild' ? 'bad' : S.plan.depth[d] === 'core' ? 'warn' : S.plan.depth[d] === 'light' ? '' : 'good'}">${DOMAINS[d].short}: ${S.plan.depth[d] === 'rebuild' ? 'all lessons' : S.plan.depth[d] === 'core' ? 'core lessons' : S.plan.depth[d] === 'light' ? 'light review' : 'solid'}</span>`).join('')}</div><p class="ink2" style="font-size:.95rem">Lessons run in course order so each one builds on the last. Lessons tied to a question you missed or guessed open with your answer and the correct one.</p></div>` : `<div class="card soft"><p class="ink2" style="font-size:.95rem">Ordered worst first: topics where you were wrong and confident come before topics you guessed. Each lesson opens with the exact question you missed.</p></div>`}
      ${rem.length ? `<div class="row"><button class="btn primary lg" data-act="lesson" data-arg="${rem[0].id}">${done ? 'Continue' : 'Start'}: ${esc(L[rem[0].id].title)}</button></div>` : `<div class="ready-banner"><strong>All ${S.plan.lessons.length} lessons passed.</strong> ${stage() === 'fulltest' ? `Next: the ${EXAM_N}-question test.` : stage() === 'ready' ? 'You are cleared to book the exam.' : stage() === 'official' ? 'Next: the official-format test.' : 'Next: a practice test.'} <button class="btn primary small" data-act="${stage() === 'official' ? 'start-standard' : 'start-exam'}" data-arg="${stage() === 'fulltest' ? 'full' : 'practice'}" style="margin-left:8px">Start it</button></div>`}
      ${groups.map(g => `<div class="card stack" style="gap:8px"><div class="row spread"><h3><span class="muted" style="font-family:var(--font-mono);font-size:.85rem;margin-right:8px">${String(g.u.n).padStart(2, '0')}</span>${esc(g.u.title)}</h3></div>
        ${g.list.map(e => `<button class="option" data-act="lesson" data-arg="${e.id}" style="align-items:center"><span class="led lg ${planDone(e.id) ? 'green' : ledClass(e.id)}"></span><span style="flex:1"><strong>${esc(L[e.id].title)}</strong><br><span class="muted" style="font-size:.88rem">${esc(reasonLabel(e.reasons[0]))}${e.reasons.length > 1 ? ` · +${e.reasons.length - 1} more` : ''}</span></span>${planDone(e.id) ? '<span class="pill good">DONE</span>' : reasonPill(e)}</button>`).join('')}</div>`).join('')}
      <div class="row"><button class="btn ghost" data-act="go" data-arg="course">Browse all ${lessons.length} lessons</button></div>
    </div>`;
  }

  function viewCourse() {
    const uid = S.view.arg;
    const u = uid ? units.find(x => x.id === uid) : null;
    if (u) {
      return `<div class="content stack" style="gap:18px">
        <div><div class="eyebrow">Unit ${u.n}</div><h1>${esc(u.title)}</h1><p class="ink2" style="margin-top:6px">${esc(u.blurb)}</p></div>
        <div class="stack" style="gap:8px">${u.lessons.map((l, i) => `<button class="option" data-act="lesson" data-arg="${l.id}" style="align-items:center"><span class="led lg ${ledClass(l.id)}"></span><span style="flex:1"><strong>${i + 1}. ${esc(l.title)}</strong><br><span class="muted" style="font-size:.9rem">Objective ${l.obj} · ${l.minutes} min read${lstat(l.id).best ? ` · best checkpoint ${lstat(l.id).best}/${CHECKPOINT_N}` : ''}</span></span>${lessonLocked(l.id) ? '<span class="pill">Full course</span>' : planEntry(l.id) && !planDone(l.id) ? '<span class="pill accent">in tutorial</span>' : ''}</button>`).join('')}</div>
        <div class="row"><button class="btn ghost" data-act="go" data-arg="course">All units</button></div>
      </div>`;
    }
    return `<div class="content stack" style="gap:18px">
      <div><div class="eyebrow">All lessons</div><h1>${plural(units.length, 'unit')}, ${plural(lessons.length, 'lesson')}</h1><p class="ink2" style="margin-top:6px">Your tutorial picks from these. Any lesson can be opened at any time; each ends with a four-question checkpoint.</p></div>
      <div class="stack" style="gap:8px">${units.map(u => { const passed = u.lessons.filter(l => lstat(l.id).status === 'passed').length;
        return `<button class="option" data-act="course" data-arg="${u.id}" style="align-items:center"><span class="key">${u.n}</span><span style="flex:1"><strong>${esc(u.title)}</strong><br><span class="muted" style="font-size:.9rem">${esc(u.blurb)}</span></span><span class="tnum muted">${passed}/${u.lessons.length}</span></button>`; }).join('')}</div>
    </div>`;
  }

  // Lesson view with personalization callouts and checkpoint quiz.
  function viewLesson(id) {
    const l = L[id]; if (!l) return viewCourse();
    if (lessonLocked(id)) return `<div class="content stack" style="gap:20px"><div class="lesson-head"><div class="row" style="gap:8px"><span class="pill accent">Unit ${l.unit.n}</span><span class="pill">${DOMAINS[l.domain].short}</span><span class="pill">Objective ${l.obj}</span></div><h1>${esc(l.title)}</h1></div>${paywall('This lesson')}</div>`;
    const ls = lstat(id); if (ls.status === 'new') { ls.status = 'read'; save(); }
    const entry = planEntry(id); const rem = planRemaining(); const posInPlan = entry ? rem.findIndex(e => e.id === id) : -1;
    const nextInPlan = entry ? rem.find(e => e.id !== id) : null;
    const idx = lessons.indexOf(l); const nextLesson = lessons[idx + 1]; const prevLesson = lessons[idx - 1];
    const cp = S.active && S.active.kind === 'checkpoint' && S.active.lesson === id ? S.active : null;
    const callouts = entry ? entry.reasons.filter(r => r.q).map(r => { const q = fat(r.q); if (!q) return ''; const wrong = r.kind === 'wrong' || r.kind === 'wrong-confident';
      return `<div class="callout ${wrong ? 'bad' : 'warn'}"><div class="eyebrow">${wrong ? 'You missed this' : 'You guessed this right'} on the ${r.source === 'starter' ? 'starter test' : 'last test'} · confidence ${r.conf}/5</div>
        <div class="stem">${esc(q.q)}</div>
        <div class="ans">${wrong ? `<span style="color:var(--bad)">You answered ${r.choice >= 0 ? letters[r.choice] + '. ' + esc(q.a[r.choice]) : 'nothing (skipped)'}.</span> ` : ''}<span style="color:var(--good)">Correct: ${letters[q.c]}. ${esc(q.a[q.c])}</span></div>
        <div class="ans ink2">${esc(q.e)}</div></div>`; }).join('') : '';
    const domainReason = entry ? entry.reasons.find(r => r.kind === 'domain') : null;
    let quiz;
    if (!cp) {
      quiz = `<div class="card lift stack"><div class="row spread"><div><div class="eyebrow">Checkpoint</div><h3>${CHECKPOINT_N} questions on this lesson</h3><p class="ink2">Pass ${CHECKPOINT_PASS} of ${CHECKPOINT_N} to complete it. An answer counts only if you were at least fairly sure.${ls.best ? ` Your best so far: ${ls.best}/${CHECKPOINT_N}.` : ''}</p></div><button class="btn primary" data-act="start-checkpoint" data-arg="${id}">Start checkpoint</button></div></div>`;
    } else if (cp.i >= cp.items.length) {
      const score = cpScore(cp); const unsure = cp.answers.filter(a => a.correct && a.conf <= 2).length; const passed = score >= CHECKPOINT_PASS;
      const st = stage();
      let nextBtn = '';
      if (passed) {
        if (nextInPlan) nextBtn = `<button class="btn primary" data-act="finish-checkpoint" data-arg="${nextInPlan.id}">Next in tutorial: ${esc(L[nextInPlan.id].title)}</button>`;
        else if (S.plan && !planRemaining().length) nextBtn = `<button class="btn primary" data-act="finish-checkpoint" data-arg="__test">Tutorial complete. Take the ${EXAM_N}-question ${st === 'fulltest' ? 'test' : 'practice test'}</button>`;
        else if (nextLesson) nextBtn = `<button class="btn primary" data-act="finish-checkpoint" data-arg="${nextLesson.id}">Next lesson: ${esc(nextLesson.title)}</button>`;
      }
      quiz = `<div class="card lift stack"><div class="row spread"><div><div class="eyebrow">Checkpoint result</div><h3>${score} of ${CHECKPOINT_N} ${passed ? 'correct and sure. Lesson complete.' : 'correct and sure. Review and try again.'}</h3>${unsure ? `<p class="ink2">${plural(unsure, 'answer')} right but marked Guess or Unsure did not count.</p>` : ''}</div><span class="pill ${passed ? 'good' : 'warn'}">${passed ? 'PASSED' : 'RETRY'}</span></div>
        <div class="row">${nextBtn}${!passed ? `<button class="btn primary" data-act="start-checkpoint" data-arg="${id}">Try a fresh checkpoint</button>` : ''}<button class="btn ghost" data-act="finish-checkpoint" data-arg="__stay">Stay here</button></div></div>`;
    } else {
      quiz = `<div class="card lift">${questionCard(cp, { showNumber: true, immediate: true })}</div>`;
    }
    return `<div class="content stack" style="gap:20px">
      <div class="lesson-head">
        <div class="row" style="gap:8px"><span class="pill accent">Unit ${l.unit.n}</span><span class="pill">${DOMAINS[l.domain].short}</span><span class="pill">Objective ${l.obj}</span><span class="muted" style="font-size:.9rem">${l.minutes} min read</span>${entry && posInPlan >= 0 ? `<span class="muted" style="font-size:.9rem">· tutorial lesson ${S.plan.lessons.length - rem.length + posInPlan + 1} of ${S.plan.lessons.length}</span>` : ''}<span style="flex:1"></span><button class="btn small ghost fb-btn" data-act="fb-open" data-kind="lesson" data-arg="${id}" title="Send feedback on this lesson">&#9873; Feedback</button></div>
        <h1>${esc(l.title)}</h1>
        ${domainReason && !callouts ? `<p class="ink2">${esc(lessonWhy(domainReason))}</p>` : ''}
      </div>
      ${callouts}
      <article class="lesson-body">${renderBody(l.body)}</article>
      <div class="hook"><span class="eyebrow">Remember</span><div>${inline(l.hook)}</div></div>
      ${deepSection(id)}
      ${quiz}
      <div class="row" style="justify-content:flex-end"><button class="btn small ghost fb-btn" data-act="fb-open" data-kind="lesson" data-arg="${id}">&#9873; Something wrong or unclear in this lesson? Send feedback</button></div>
      <div class="row spread">
        ${prevLesson ? `<button class="btn ghost" data-act="lesson" data-arg="${prevLesson.id}">← ${esc(prevLesson.title)}</button>` : '<span></span>'}
        ${nextLesson ? `<button class="btn ghost" data-act="lesson" data-arg="${nextLesson.id}">${esc(nextLesson.title)} →</button>` : ''}
      </div>
    </div>`;
  }

  // Shared question card. sess: { items, i, answers, sel, conf, submitted }
  function questionCard(sess, opts) {
    const q = fat(sess.items[sess.i]); const n = sess.items.length;
    const submitted = !!sess.submitted; const sel = sess.sel; const conf = sess.conf;
    const l = L[q.t];
    const optionsHtml = q.a.map((opt, k) => {
      let cls = 'option'; const pressed = sel === k ? 'true' : 'false';
      if (submitted && opts.immediate) { if (k === q.c) cls += ' correct'; else if (k === sel) cls += ' wrong'; }
      return `<button class="${cls}" data-act="opt" data-arg="${k}" aria-pressed="${pressed}" ${submitted ? 'disabled' : ''}><span class="key">${letters[k]}</span><span>${esc(opt)}</span></button>`;
    }).join('');
    const confHtml = `<div class="confidence"><span class="eyebrow">How sure are you?</span>${CONF.map(([v, name]) => `<button class="chip" data-act="conf" data-arg="${v}" aria-pressed="${conf === v ? 'true' : 'false'}" ${submitted ? 'disabled' : ''}><span class="k">${v}</span>${name}</button>`).join('')}</div>`;
    let feedback = '';
    if (submitted && opts.immediate) {
      const correct = sel === q.c;
      feedback = `<div class="feedback ${correct ? 'good' : 'bad'}"><div class="verdict">${correct ? (conf <= 2 ? 'Correct, but you were not sure, so it does not count. Read why.' : 'Correct') : `Incorrect. The answer is ${letters[q.c]}.`}</div><div>${esc(q.e)}</div>${l ? `<div class="muted" style="font-size:.9rem">Topic: ${esc(l.title)} (Unit ${l.unit.n})</div>` : ''}</div>`;
    }
    const canSubmit = sel != null && conf != null;
    const controls = submitted
      ? `<div class="row spread"><span class="kbd-hint"><kbd>Enter</kbd> continue</span><button class="btn primary" data-act="next">Continue</button></div>`
      : `<div class="row spread"><span class="kbd-hint"><kbd>A</kbd>–<kbd>D</kbd> answer, <kbd>1</kbd>–<kbd>5</kbd> confidence, <kbd>Enter</kbd> submit</span><div class="row">${opts.allowSkip ? `<button class="btn ghost" data-act="skip">Skip</button>` : ''}<button class="btn primary" data-act="submit" ${canSubmit ? '' : 'disabled'}>Submit</button></div></div>`;
    return `<div class="quiz">
      <div class="q-head"><span class="eyebrow">${opts.title || 'Question'} ${opts.showNumber ? `${sess.i + 1} of ${n}` : ''}</span><span class="row" style="gap:6px">${opts.right || ''}${fbBtn(q, sess.kind)}</span></div>
      <div class="q-stem">${esc(q.q)}</div>
      <div class="options">${optionsHtml}</div>
      ${confHtml}
      ${feedback}
      ${controls}
    </div>`;
  }

  // ---------- tests ----------
  const isTest = k => k === 'starter' || k === 'full' || k === 'practice' || k === 'custom';
  const TEST_LABEL = { starter: 'Starter test', full: `${EXAM_N}-question test`, practice: 'Practice test', custom: 'Custom test' };
  const testLabel = e => e.setup && e.setup.mode === 'standard' ? `Standard test (${e.setup.count || e.setup.n} questions)` : e.setup && e.setup.mode === 'custom' ? `Custom test (${e.setup.count || e.setup.n} questions)` : TEST_LABEL[e.kind];
  const examMinutes = ex => ex.minutes == null ? (ex.kind === 'starter' ? 0 : EXAM_MINUTES) : ex.minutes;
  // An official-format test: the real exam's format with a time limit. It is always timed and is the course's final gate.
  const isOfficial = ex => !!(ex && ex.setup && ex.setup.mode === 'standard' && ex.minutes > 0);
  function viewExam() {
    const ex = S.active && isTest(S.active.kind) ? S.active : null;
    if (!ex) return viewTestsHub();
    if (ex.i >= ex.items.length) return finishExam();
    const answered = ex.answers.filter(Boolean).length; const q = fat(ex.items[ex.i]);
    return `<div class="content">
      <div class="exam-head"><span class="pill accent">${testLabel(ex)}</span><span class="tnum">Question ${ex.i + 1} of ${ex.items.length}</span><div class="meter"><i style="width:${100 * ex.i / ex.items.length}%"></i></div>${(S.settings.timer || isOfficial(ex)) && examMinutes(ex) ? `<span class="timer" id="timer">--:--</span>` : ''}<button class="btn ghost small" data-act="abandon-exam">Quit</button></div>
      <div class="card lift">${questionCard(ex, { immediate: false, allowSkip: true, title: DOMAINS[L[q.t].domain].short })}</div>
      <p class="muted" style="margin-top:12px;font-size:.9rem">No feedback until the end. Every wrong answer and every guess is explained on the results page. ${answered} answered so far.</p>
    </div>`;
  }
  function viewTestsHub() {
    const exams = S.exams.slice().reverse(); const st = stage();
    return `<div class="content stack" style="gap:18px">
      <div><div class="eyebrow">Tests</div><h1>Starter, full, and practice tests</h1><p class="ink2" style="margin-top:6px">The starter test is ${STARTER_N} questions, ${T.starterPerDomain} per domain. Full and practice tests are ${EXAM_N} questions weighted like the real exam: ${DOMAIN_IDS.map(d => `${DOMAINS[d].quota} ${DOMAINS[d].short}`).join(', ')}. Unseen questions are chosen first. The setup card below runs the real exam's format or a test of your own design.${course.generatedNote ? ' ' + esc(course.generatedNote) : ''}</p></div>
      <div class="card lift stack"><div class="row spread"><div><h3>${st === 'ready' ? 'Cleared to book the exam' : st === 'official' ? 'Final step: the official-format test' : `Pass streak: ${S.passStreak} of ${STREAK_NEEDED}`}</h3><p class="ink2">${st === 'starter' ? 'Start with the starter test; it builds your tutorial.' : st === 'tutorial' || st === 'retrain' ? `Finish your ${st === 'tutorial' ? 'tutorial' : 'retraining'} first, then the next test unlocks here. You can still take a test early.` : st === 'official' ? `Your streak is complete. Pass the official-format test (${REAL_N} questions in ${REAL_MIN} minutes, timed) at ${PASS_PCT}% or better and you are cleared to book the real thing.` : `Score ${PASS_PCT}% or better on ${STREAK_NEEDED} tests in a row, then pass the official-format test (${REAL_N} questions in ${REAL_MIN} minutes, timed) and you are cleared to book the real thing.`}</p></div>

        ${exams.map((e, k) => { const cm = e.review.filter(r => !r.correct && r.conf >= 4).length, g = e.review.filter(r => r.correct && r.conf <= 2).length;

      </tbody></table></div></div>` : ''}
    </div>`;
  }
  function setupCard() {
    if (testsLocked('full')) return '';
    const s = currentSetup(); const std = apportion(REAL_N, pctWeights());
    return `<div class="card lift stack" id="setup"><div><h3>Set up a test</h3><p class="ink2">Take the real exam's format, or choose your own question count, time limit, and domain mix.</p></div>

  }
  const nextFlowKind = () => S.exams.some(e => e.kind === 'full' || e.kind === 'practice') ? 'practice' : 'full';
  function startExam(kind, setup) {
    let items, minutes = kind === 'starter' ? 0 : EXAM_MINUTES, quotas = null;
    if (kind === 'starter') items = buildStarter();
    else { if (setup) { quotas = apportion(setup.n, setup.weights); minutes = clampMin(setup.minutes); } items = buildExam(quotas); }
    const meta = setup ? { mode: setup.mode, n: setup.n, minutes, weights: setup.weights, quotas, count: items.length } : null;
    S.active = { kind, items: items.map(slim), i: 0, answers: [], sel: null, conf: null, submitted: false, startedAt: Date.now(), minutes, setup: meta };

  }
  function finishExam() {
    const ex = S.active; const items = ex.items.map(fat);
    let score = 0; const byDomain = {}; DOMAIN_IDS.forEach(d => { byDomain[d] = { c: 0, t: 0 }; });
    const review = [];
    items.forEach((q, k) => {
      const a = ex.answers[k] || { choice: -1, conf: 1, skipped: true };

    });

    S.exams.push(rec); const examIdx = S.exams.length - 1;

        <div class="row" style="gap:8px">${DOMAIN_IDS.map(d => `<span class="pill ${S.plan.depth[d] === 'rebuild' ? 'bad' : S.plan.depth[d] === 'core' ? 'warn' : S.plan.depth[d] === 'light' ? '' : 'good'}">${DOMAINS[d].short}: ${S.plan.depth[d] === 'rebuild' ? 'all lessons' : S.plan.depth[d] === 'core' ? 'core lessons' : S.plan.depth[d] === 'light' ? 'light review' : 'solid'}</span>`).join('')}</div>
        <p class="ink2" style="font-size:.95rem">Missed ${ALL_WORD} questions in a domain: you get every lesson in that domain. Missed one, or guessed: you get that domain's core lessons plus the exact topic. Confident and correct on ${ALL_WORD}: nothing from that domain.</p>
        <button class="btn ghost small" data-act="go" data-arg="tutorial" style="align-self:flex-start">See the full plan</button></div>`
        : `<div class="ready-banner"><strong>Every answer right and confident.</strong> There is nothing to teach yet, so the ${EXAM_N}-question test is next. <button class="btn primary small" data-act="start-exam" data-arg="full" style="margin-left:8px">Start it</button></div>`;
    } else {
      headline = passed ? (S.official && S.official.examIdx === idx ? 'Official-format test passed. You are cleared to book the exam.' : 'Passing score.') : e.pct >= 70 ? 'Close. Not there yet.' : 'Below the line. Now you know what to retrain.';
      planCard = planIsFromThis ? `<div class="card lift stack"><div class="row spread"><div><div class="eyebrow">Retraining tutorial</div><h3>${plural(S.plan.lessons.length, 'lesson')}, about ${planMinutes(S.plan.lessons)} minutes</h3><p class="ink2">Worst first. Each lesson opens with the question you missed.</p></div><button class="btn primary" data-act="lesson" data-arg="${rem.length ? rem[0].id : S.plan.lessons[0].id}">Start retraining</button></div>
        <div class="topic-list">${S.plan.lessons.slice(0, 8).map(en => `<div class="topic-item"><div><div class="t-title">${esc(L[en.id].title)}</div><div class="t-sub">${en.reasons.map(r => KIND_LABEL[r.kind]).join(', ')}</div></div>${reasonPill(en)}</div>`).join('')}${S.plan.lessons.length > 8 ? `<button class="btn ghost small" data-act="go" data-arg="tutorial">and ${S.plan.lessons.length - 8} more</button>` : ''}</div></div>`
        : e.kind === 'custom' ? `<div class="ready-banner"><strong>${misses.length || guesses.length ? 'Your misses and guesses now feed your weak-topic list.' : 'No misses and no guesses.'}</strong> Custom tests do not change your pass streak. <button class="btn primary small" data-act="go" data-arg="exam" style="margin-left:8px">Set up another</button></div>`
        : `<div class="ready-banner"><strong>No misses and no guesses.</strong> ${stage() === 'ready' ? 'You are cleared to book the exam.' : stage() === 'official' ? 'Your streak is complete; the official-format test is the final step.' : 'Nothing to retrain. Take another practice test to extend your streak.'} ${stage() === 'official' ? `<button class="btn primary small" data-act="start-standard" style="margin-left:8px">Official-format test</button>` : stage() !== 'ready' ? `<button class="btn primary small" data-act="start-exam" data-arg="practice" style="margin-left:8px">Practice test</button>` : ''}</div>`;
    }
    const reviewItem = (r, wrong) => { const q = fat(r.q); if (!q) return ''; return `<div class="review-item"><div class="row" style="gap:6px;margin-bottom:4px"><span class="pill ${wrong ? (r.conf >= 4 ? 'bad' : 'warn') : 'warn'}">${KIND_LABEL[kindOf(r.correct, r.conf)]}</span><span class="pill">${DOMAINS[L[q.t].domain].short}</span></div><div class="stem">${esc(q.q)}</div><div class="ans">${wrong ? `<span style="color:var(--bad)">You: ${r.choice >= 0 ? letters[r.choice] + '. ' + esc(q.a[r.choice]) : 'skipped'}</span> · ` : ''}<span style="color:var(--good)">Correct: ${letters[q.c]}. ${esc(q.a[q.c])}</span></div><div class="ans ink2">${esc(q.e)}</div><div class="ans muted row" style="gap:6px">${esc(L[q.t].title)} · <button class="btn small ghost" data-act="lesson" data-arg="${q.t}">Open lesson</button>${fbBtn(q, e.kind + '-results')}</div></div>`; };

        <div class="muted" style="font-size:.9rem">A confident miss is wrong at confidence 4 or 5. A guess is right at confidence 1 or 2. Both go into your tutorial.</div></div></div></div>

  // ---------- timer ----------
  function startTimer() {
    stopTimer(); if (!S.settings.timer && !isOfficial(S.active)) return;
    const tick = () => {
      const ex = S.active; if (!ex || !isTest(ex.kind) || !examMinutes(ex)) { stopTimer(); return; }
      const remain = examMinutes(ex) * 60 - Math.floor((Date.now() - ex.startedAt) / 1000);
      const el = $('#timer'); if (el) { const m = Math.max(0, Math.floor(remain / 60)), s = Math.max(0, remain % 60); el.textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`; el.classList.toggle('low', remain < 300); }
      if (remain <= 0) { stopTimer(); ex.i = ex.items.length; save(); toast('Time is up. Scoring your test.'); render(); }
    };
    tick(); timerHandle = setInterval(tick, 1000);
  }
  function stopTimer() { if (timerHandle) { clearInterval(timerHandle); timerHandle = null; } }

  // ---------- actions ----------
  function sessionForView() {
    const a = S.active; if (!a) return null;
    if (a.kind === 'checkpoint' && S.view.name === 'lesson' && S.view.arg === a.lesson) return a;
    if (isTest(a.kind) && S.view.name === 'exam') return a;
    if (a.kind === 'train' && S.view.name === 'train' && a.phase === 'drill') return a;
    return null;
  }
  function submitAnswer(sess, skipped) {
    const q = fat(sess.items[sess.i]);
    const choice = skipped ? -1 : sess.sel; const conf = skipped ? 1 : sess.conf;
    if (isTest(sess.kind)) {
      sess.answers[sess.i] = { choice, conf, skipped: !!skipped };
      sess.i++; sess.sel = null; sess.conf = null; sess.submitted = false; save(); render(); return;
    }
    const res = recordAnswer(q, choice, conf);
    sess.answers[sess.i] = { choice, conf, correct: res.correct, q: slim(q) };
    sess.submitted = true;
    if (sess.kind === 'train') {
      sess.drills++; sess.log.push({ t: q.t, correct: res.correct });
      sess.streak = (res.correct && conf >= 4) ? sess.streak + 1 : 0;
      if (!res.correct) {
        const again = pickForLesson(q.t, 1, new Set(sess.used || []), gens[q.t] ? 0.6 : 0)[0];
        if (again) { sess.items.splice(Math.min(sess.items.length, sess.i + 3), 0, slim(again)); sess.used.push(again.id); }
      }
    }
    save(); render();
  }
  function advance(sess) {
    if (sess.kind === 'checkpoint') {
      sess.i++; sess.sel = null; sess.conf = null; sess.submitted = false;
      if (sess.i >= sess.items.length) { const score = cpScore(sess); const ls = lstat(sess.lesson); ls.attempts++; ls.best = Math.max(ls.best, score); if (score >= CHECKPOINT_PASS) { ls.status = 'passed'; ls.passedAt = Date.now(); } }
      save(); render(); return;
    }
    if (sess.kind === 'train') {
      sess.i++; sess.sel = null; sess.conf = null; sess.submitted = false;
      const doneTopic = sess.streak >= 3 || sess.drills >= 10;
      if (doneTopic) { const t = sess.topics[sess.ti]; if (sess.streak >= 3) { const ts = tstat(t); ts.streak = Math.max(ts.streak, 3); ts.hist = []; } sess.ti++; sess.phase = 'lesson'; sess.i = 0; sess.items = []; sess.answers = []; sess.streak = 0; sess.drills = 0; }
      else if (sess.i >= sess.items.length) extendQueue(sess);
      save(); render();
    }
  }
