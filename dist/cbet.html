## How the exam asks it
- "EtCO2 monitor turns on but shows no value; filter and trap are new; which fault and test correspond?" Internal leak; occlude the port upstream of the moisture trap.
- "Vital signs monitor gives no respiration rate but ECG and SpO2 work?" A faulty input PCB.
- "Lab spectrophotometer works intermittently at all wavelengths?" Faulty power cable.
- "Cryostat squashes samples with a new blade and correct temperatures; which is NOT a cause?" Slow cutting speed.
- "Otoscope dimmer than before; which is LEAST likely?" A loose head (that would switch it off).
- "Tympanic thermometer reads low repeatedly?" Cracked lens.
- "Blood gas analyzer 'doesn't work'; what first?" Check cable and outlet voltage.
- "Enteral pump constant low-flow error; which would NOT cause it?" Excessive ambient light.
- "PCA gives basal rate but no requested doses; first step?" Examine the settings.
- "Aspirator suction weakened gradually; which is NOT probable?" A blown fuse.
- "ESU works but no output?" High-voltage fuse.
- "Single fault that stops a tourniquet inflating?" A disconnected pneumatic pump.
- "Pressurized blood warmer is loud; which is NOT a cause?" A faulty peristaltic pump (pressurized units use a compressor).

## What to memorize
The tables. Practice by covering the right column and naming the cause and action for each symptom.`,

u9l7: `## Laws as job descriptions
Each law or standard on the exam has a single sentence that defines it and one or two "does not" traps. Read them as job descriptions: who is responsible for what.

## The summary table
\`\`\`
name          year    does                                                                         does not
HITECH        2009    pays incentives for certified EHR adoption with meaningful use; penalizes non-adoption; breach notification to individuals and HHS; business partners bound; no sale of PHI; patient access; disclosure accounting; funds training and research   set hospital spending guidelines
HIPAA         1996    Title I insurance portability; Title II administrative simplification, privacy and security rules, fraud control, fines; Title III savings accounts; Title IV enforcement (Office for Civil Rights); Title V revenue offsets   (Title I is not about PHI security)
DMCA          1998    bans circumvention technology for copyrighted works; raises infringement penalties; limits provider liability; exemptions for security testing and personal medical implant data   ban copying devices outright
FDA MDDS      2011    reclassifies medical device data systems (store, transfer, reformat, display) from Class III to Class I   cover systems that control devices, or non-medical displays
IEC 80001-1   2010    risk management for IT networks with medical devices; FDA-style device definition (no drugs); applies to any such network including supervised home care   define acceptable risk levels; come from the FDA
MDS2          form    manufacturer disclosure of device security capabilities                        cover structural integrity
\`\`\`

## HITECH in practice
A physician practice that adopts a certified electronic record and reports meaningful-use measures receives Medicare incentive payments; one that does not sees Medicare payments cut unless it qualifies for a hardship exemption. If a laptop of patient records is lost, HITECH's breach rules require notifying the affected individuals and HHS, and a vendor that handles the data is directly liable as a business associate. Marketing that uses patient information without permission is prohibited.

## HIPAA titles you must keep straight
\`\`\`
Title I     insurance: portability, renewal, preexisting conditions, no health-status discrimination
Title II    the healthcare industry's rulebook: Administrative Simplification (standard transactions and identifiers, privacy rule, security rule), fraud and abuse, liability reform; violations and fines live here
Title III   medical savings accounts, tax deductions
Title IV    enforcement by the Office for Civil Rights
Title V     revenue offsets
\`\`\`
Administrative Simplification standardizes patient and financial data exchange (EDI), reduces paperwork and cost, protects confidentiality and integrity with unique identifiers, and applies to fax, phone, and internet alike.

## DMCA nuances
It targets tools that break access controls, not copying as such (some copying is fair use). Two parts: WIPO treaty implementation and online infringement liability limitation. Exemptions include security research and a patient's access to data from their own implanted device.

## MDDS, IEC 80001, MDS2 in practice
An MDDS example: a vital signs monitor's data feed and the software that displays it at the nurses' station. Not MDDS: a lobby television, a power cable, a waiting-room tracking board. IEC 80001 makes the hospital, not just the vendor, responsible for risk on the network that carries device data, across the lifecycle, with roles assigned; it deliberately leaves acceptable risk levels to each jurisdiction. The MDS2 form asks the manufacturer, item by item: automatic logoff, audit controls, authorization, configurable security, security updates, de-identification, backup and recovery, emergency (break-glass) access, data integrity and authentication, malware detection and resistance, node and user authentication, physical locks, third-party component plans, security guidance, storage and transmission confidentiality and integrity, remote access and servicing.

## Which standard covers what
\`\`\`
topic                                   standard or law
ground continuity, leakage limits       IEC 60601-1, NFPA 99 (not HL7)
adverse device events                   SMDA, FDA MDR
breach reporting                        HIPAA, HITECH (not HL7)
image formats and transfer              DICOM
message formats                         HL7
equipment management programs           AAMI EQ series
networks carrying device data           IEC 80001
device security disclosure              MDS2
\`\`\`

## How the exam asks it
- "Which is FALSE about HITECH?" That it sets guidelines for hospital spending on EHRs.
- "Which HIPAA section determines fines for violations?" Title II.
- "Which is NOT a DMCA provision?" That it prohibits producing or selling devices that copy works.
- "Which is part of an MDDS?" A vital signs monitor in a patient room.
- "Which is true of IEC 80001?" It applies to all medical organizations that connect medical devices across their networks (it does not define risk levels, exclude only drugs from the device definition, and is not from the FDA).
- "Which is NOT an MDS2 consideration?" Structural integrity of the device.
- "Which regulates reporting breaches of patient insurance data?" HIPAA, not HL7.

## What to memorize
- HITECH: incentives, penalties, meaningful use, breach notification, business associates, no PHI sales, patient access; no spending rules.
- HIPAA titles I to V and what lives in Title II; OCR enforces.
- DMCA: anti-circumvention, penalties, liability limits, exemptions for security testing and implants.
- MDDS: store, transfer, reformat, display; Class III to Class I, 2011.
- IEC 80001-1: risk management for networks with devices; no acceptable risk levels; not FDA.
- MDS2 list; break-glass yes, structural integrity no.`,

u9l8: `## Networking vocabulary, the exam's version
The earlier IT lessons taught the working technician's networking. This one adds the textbook labels the test uses: layer names, topology names, binary masks, and the roles of the clinical systems.

## Seven layers, with the exam's one-liners
\`\`\`
layer  name          holds                                      device or protocol
7      application   the interface to programs (APIs)           HTTP, DNS, HL7 applications
6      presentation  data conversion into readable formats; encryption   (no "conversion layer" exists; this is it)
5      session       connections between systems; naming
4      transport     assembling and ordering data; port numbers TCP, UDP
3      network       logical addressing and routing; packets    IP, routers
2      data link     frames; the 48-bit hexadecimal MAC address  switches, bridges, NICs
1      physical      the medium and its signals                 copper, fiber, radio, hubs
\`\`\`

## Topologies
\`\`\`
topology              shape                              break behavior
bus                   one terminated cable               a break stops everyone
ring                  each node to the next, no terminator   a break stops everyone
star                  all nodes to a central switch or hub   one bad cable, one node down
hybrid                star-bus, star-ring
mesh (partial or full)  nodes cross-linked               survives breaks; wireless backhaul
point-to-multipoint   a central node that also processes data serves many endpoints   wireless APs, telemetry
\`\`\`
Physical topology is the wiring you can see; logical topology is the path the signal takes.

## Masks in binary
\`\`\`
decimal          binary                                   prefix   addresses per subnet
255.255.255.0    11111111.11111111.11111111.00000000      /24      256
255.255.255.240  11111111.11111111.11111111.11110000      /28      16
255.255.255.248  11111111.11111111.11111111.11111000      /29      8
255.255.255.252  11111111.11111111.11111111.11111100      /30      4
invalid          ...00110101 (ones must be contiguous)
\`\`\`
Subnetting keeps departments apart, shrinks broadcast scope, and uses addresses efficiently; different subnets need a router.

## Hub, switch, PPP
A hub is a physical-layer repeater: every frame to every port, half duplex, collisions. A switch keeps a source address table of MAC addresses per port and forwards only to the destination port at the data link layer, enabling full duplex. PPP is a data link protocol for direct router-to-router links over serial or dial-up lines, with authentication, carrying IP by way of network control protocols. LAN: one site; WLAN: a LAN with wireless; WAN: sites across distance; the internet is a WAN of WANs.

## Two exam troubleshooting narratives
\`\`\`
intermittent wireless on one handheld     unless others also fail, it is local: confirm it joins other networks, check its configuration, power cycle it, then check the access point's status lights and connect through it
failed wired link, router to desktop      identify the problem (what changed), test likely causes (connections; swap a known-good cable or use a cable tester to find the fault and distance), plan the fix and consider side effects, implement, test; if it still fails, look for a second fault
PC failing wireless file transfers        first check the PC's own wireless connectivity to nearby nodes and devices
\`\`\`
Troubleshooting has a diagnosis phase (symptoms matched to known problems) and a resolution phase (a solution path), and they interleave.

## Tools
\`\`\`
tool                         reports
cable tester                 continuity and correct wiring; multi-port
TDR (time-domain reflectometer)   whether the cable is open and how far to the break (from pulse reflection and propagation speed)
cable tracer (toner)         path of a wire behind walls; location of an open
ping (ICMP echo)             reachability, round-trip milliseconds, packet loss, min/max/average/deviation; IPv4 and IPv6 versions
fiber inspection microscope  cleanliness and integrity of connector ends; clean with isopropyl alcohol and lint-free wipes, or cut and repolish
multimeter                   end-to-end resistance (open = very high); continuity
\`\`\`
Power cycling is a fix, not a test. Ping does not measure cable resistance, does not echo everything it receives, and is unrelated to ultrasound. Electrical safety analyzers are not network tools.

## Clinical information systems
\`\`\`
system   full name                                   role
PACS     picture archiving and communication system  stores, transports, displays images with patient data; redundant servers; interfaces with RIS and LIS
RIS      radiology information system                registration, scheduling, tracking, reporting, results distribution; integrates PACS and HL7
LIS      laboratory information system               specimen tracking, analyzer interfaces, results, standards compliance
LIMS     laboratory information management system    research and high-volume sample tracking; converging with LIS
DICOM    Digital Imaging and Communications in Medicine   22-part standard for image format, transfer, and PACS interfaces; references IEC definitions
HL7      Health Level Seven                          organization and standards for patient data exchange: version 2 messaging, version 3 XML, Clinical Document Architecture
\`\`\`
HL7 formats data for cross-system messaging; it does not set ground continuity or leakage limits (IEC) or breach reporting (HIPAA).

## How the exam asks it
- "Which is NOT part of the OSI model?" A conversion layer.
- "Binary mask for 255.255.255.240?" 11111111.11111111.11111111.11110000.
- "Which statement describes ping?" It sends data to check the time to send and receive a message.
- "Which action would NOT test a wired connection?" Power cycling one device at a time.
- "First action for a PC with failed wireless file transfers?" Check the PC's wireless connectivity to nearby nodes, router, and devices.
- "Which is true of PACS?" Designed to store and transport imaging data on medical networks.
- "What does DICOM regulate?" Electronic messaging (of images and related data).
- "What is regulated by HL7?" Data formatting for cross-system messaging.

## What to memorize
- The seven layers and their contents; presentation converts; no conversion layer.
- Bus, ring, star, hybrid, mesh, point-to-multipoint.
- 240 = 11110000; contiguous ones.
- Hub layer 1 half duplex; switch layer 2 SAT full duplex; PPP router links; LAN, WLAN, WAN.
- Diagnosis then resolution; power cycle, status lights, known-good cable, tester; TDR distance; toner; ping ICMP; fiber microscope and alcohol.
- PACS, RIS, LIS, LIMS, DICOM 22 parts, HL7 v2, v3 XML, CDA.`

    if (kind === 2) { const f = pick([0.21, 0.3, 0.4, 0.5, 0.6, 0.8, 1.0]); const pct = Math.round(f * 100); const c = `${pct} percent oxygen`;
      return build("u6l4", `A ventilator's FiO2 is set to ${num(f)}. What oxygen concentration is being delivered, and how is it verified?`, `${c}, checked with an oxygen analyzer calibrated at 21 and 100 percent`,
        wrong(`${c}, checked with an oxygen analyzer calibrated at 21 and 100 percent`, [`${pct} percent oxygen, checked with a capnograph`, `${num(f)} percent oxygen, checked with an oxygen analyzer`, `${100 - pct} percent oxygen, checked with an oxygen analyzer`, `${pct * 2 > 100 ? 100 : pct * 2} percent oxygen, checked with a flow analyzer`]),
        `FiO2 is the fraction of inspired oxygen; ${num(f)} is ${pct} percent. Room air is 0.21. Delivered oxygen is verified with an oxygen analyzer calibrated at 21 percent (room air) and 100 percent.`, "vent"); }
    if (kind === 3) { const rate = pick([10, 12, 15, 20, 30]); const cyc = 60 / rate; const c = `${num(cyc, 1)} seconds`;
      return build("u6l4", `A ventilator is set to ${rate} breaths per minute. How long is each breath cycle?`, c, wrong(c, [`${num(cyc * 2, 1)} seconds`, `${num(cyc / 2, 1)} seconds`, `${num(rate / 60, 2)} seconds`, `${rate} seconds`, `${num(cyc + 1, 1)} seconds`]),
        `Cycle time = 60 / rate = 60 / ${rate} = ${num(cyc, 1)} seconds. With an I:E ratio of 1:2, one third of that is inspiration.`, "vent"); }
    const [cause, alarm] = pick(VALARMS);
    return build("u6l4", `A ventilated patient's circuit develops ${cause}. Which alarm is expected?`, alarm, shuffle(["High pressure", "Low pressure or low minute volume", "Apnea", "FiO2"].filter(a => a !== alarm)),
      `${cause.charAt(0).toUpperCase() + cause.slice(1)} produces a ${alarm.toLowerCase()} alarm. High pressure means gas cannot get in (obstruction); low pressure means gas is escaping (disconnect or leak); apnea means no breath detected.`, "vent");
  }

  // ---------- Same subnet or through the gateway (u9l1) ----------
  function subnet() {
    const a = 10 + R(3) * 10; const b = 1 + R(200); const c1 = 1 + R(200); const h1 = 2 + R(200);
    const mask24 = R(3) !== 0; const mask = mask24 ? "255.255.255.0" : "255.255.0.0";
    const ip1 = `${a}.${b}.${c1}.${h1}`;
    if (R(2) === 0) {
      const same = R(2) === 0;
      let ip2;
      if (same) ip2 = mask24 ? `${a}.${b}.${c1}.${(h1 + 50) % 250 + 1}` : `${a}.${b}.${(c1 + 7) % 250 + 1}.${h1}`;
      else ip2 = mask24 ? `${a}.${b}.${(c1 + 7) % 250 + 1}.${h1}` : `${a}.${(b + 11) % 250 + 1}.${c1}.${h1}`;
      const correct = same ? "Same subnet; they communicate directly through the switch" : "Different subnets; traffic passes through the default gateway router";
      const bits = mask24 ? "first three octets" : "first two octets";
      return build("u9l1", `A monitor at ${ip1} and a central station at ${ip2} both use subnet mask ${mask}. How do they communicate?`, correct,
        [same ? "Different subnets; traffic passes through the default gateway router" : "Same subnet; they communicate directly through the switch", "Same subnet; traffic must pass through the gateway", "Different subnets; they cannot communicate at all"],
        `With mask ${mask}, the ${bits} identify the network. ${ip1} and ${ip2} ${same ? "share" : "differ in"} the network portion, so they are on ${same ? "the same subnet and talk directly through the switch" : "different subnets and must go through the gateway router"}.`, "net");
    }
    const good = `${a}.${b}.${c1}.${(h1 + 90) % 250 + 1}`;
    const bad1 = `${a}.${b}.${(c1 + 3) % 250 + 1}.${h1}`; const bad2 = `${a}.${(b + 5) % 250 + 1}.${c1}.${h1}`; const bad3 = `${a + 1}.${b}.${c1}.${h1}`;
    return build("u9l1", `A device is configured with IP address ${ip1} and mask 255.255.255.0. Which address is on the same subnet?`, good, [bad1, bad2, bad3],
      `A /24 mask (255.255.255.0) means the first three octets, ${a}.${b}.${c1}, are the network. Only ${good} shares them; the others differ in the third, second, or first octet and need a router.`, "net");
  }

  FRA.generators = { u2l1: ohms, u2l3: rc, u3l2: safety, u4l1: ecg, u4l6: units, u5l2: infusion, u6l4: vent, u9l1: subnet };
  FRA.generate = function (lessonId) { const g = FRA.generators[lessonId]; return g ? g() : null; };
})();

// CBET Academy question bank, units 1 to 3. All questions are original.
// Fields: id, t (lesson id), q (stem), a (four options), c (index of correct option), e (explanation).
window.FRA = window.FRA || {};
FRA.questions = FRA.questions || [];
FRA.questions.push(
// u1l1
{id:"u1l1-1",t:"u1l1",q:"A nurse asks a technician to move an SpO2 probe from the patient's wrist to a site more distal on the same arm. Where should the probe go?",a:["The elbow","A finger","The shoulder","The upper arm"],c:1,e:"Distal means farther from the trunk. On an arm, the fingers are distal to the wrist; the elbow, upper arm, and shoulder are all proximal to it."},
{id:"u1l1-2",t:"u1l1",q:"A monitor alarm log shows repeated entries labeled 'bradycardia.' What does this term indicate?",a:["A fast heart rate above 100 bpm","Difficulty breathing","A slow heart rate below 60 bpm","High blood pressure"],c:2,e:"Brady- means slow and cardia refers to the heart, so bradycardia is a heart rate below 60 beats per minute. Tachycardia is a rate above 100."},
{id:"u1l1-3",t:"u1l1",q:"An OR schedule lists a patient positioned prone for a spinal procedure. In which position will the patient be?",a:["Lying face up","Lying on the left side","Sitting upright","Lying face down"],c:3,e:"Prone is lying face down; supine is lying face up. Positioning terms matter for OR tables, pressure injury prevention, and equipment placement."},
{id:"u1l1-4",t:"u1l1",q:"Which layer of the skin provides most of the electrical resistance that limits shock current and that ECG skin preparation is meant to reduce?",a:["The epidermis","The subcutaneous fat","The dermis","The capillary bed"],c:0,e:"The dry outer epidermis is a good insulator. Skin prep and conductive gel lower its impedance for electrodes, and wet or broken skin removes that protection, which is why shock currents rise."},
{id:"u1l1-5",t:"u1l1",q:"A technician reading an incident report sees the word 'hypoxemia.' Decoding the word parts, what does it mean?",a:["Too much oxygen in the blood","Too little oxygen in the blood","Inflammation of the lungs","Removal of a lung"],c:1,e:"Hypo- means too little, ox refers to oxygen, and -emia means a blood condition, so hypoxemia is too little oxygen in the blood. Hyper- would mean too much."},

// u1l2
{id:"u1l2-1",t:"u1l2",q:"On an ECG tracing, which waveform represents depolarization of the ventricles?",a:["The P wave","The T wave","The QRS complex","The PR segment"],c:2,e:"The QRS complex is ventricular depolarization, which precedes ventricular contraction. The P wave is atrial depolarization and the T wave is ventricular repolarization."},
{id:"u1l2-2",t:"u1l2",q:"During a manual blood pressure measurement, the first tapping sound heard through the stethoscope as the cuff deflates corresponds to which pressure?",a:["Mean arterial pressure","Diastolic pressure","Pulse pressure","Systolic pressure"],c:3,e:"The first Korotkoff sound occurs when cuff pressure drops just below systolic and blood begins to pulse through; the point where sounds disappear marks diastolic."},
{id:"u1l2-3",t:"u1l2",q:"A nurse reports that the arterial line waveform no longer shows a dicrotic notch and reads a low systolic value. Which event does the dicrotic notch normally represent, and what does its absence suggest?",a:["Aortic valve closure; an overdamped line","Mitral valve opening; a clot in the catheter tip","SA node firing; a loose ECG electrode","Ventricular filling; a cuff that is too small"],c:0,e:"The dicrotic notch marks aortic valve closure on the arterial waveform. A rounded waveform without a notch and a falsely low systolic reading indicate overdamping from air, clot, kinks, or loose connections."},
{id:"u1l2-4",t:"u1l2",q:"A patient's blood pressure is 120/90 mmHg. What is the approximate mean arterial pressure?",a:["105 mmHg","100 mmHg","95 mmHg","110 mmHg"],c:1,e:"MAP = diastolic + (systolic minus diastolic) / 3 = 90 + 30/3 = 100 mmHg. Diastole lasts longer than systole, so the mean sits closer to the diastolic value."},
{id:"u1l2-5",t:"u1l2",q:"Which structure is the heart's natural pacemaker, initiating each normal heartbeat?",a:["The AV node","The bundle of His","The SA node","The Purkinje fibers"],c:2,e:"The sinoatrial node in the right atrium fires first, producing the P wave. The AV node delays the impulse, and the bundle of His and Purkinje fibers conduct it to the ventricles."},

// u1l3
{id:"u1l3-1",t:"u1l3",q:"Which monitored parameter most directly reflects how well a patient is ventilating (moving air) rather than how well the blood is oxygenated?",a:["SpO2","Temperature","Blood pressure","End-tidal CO2"],c:3,e:"End-tidal CO2 reflects ventilation and circulation, because CO2 reaches the lungs only if air is moving and blood is flowing. SpO2 reflects oxygenation, which can be maintained by supplemental oxygen even with poor ventilation."},
{id:"u1l3-2",t:"u1l3",q:"A ventilator is set to a tidal volume of 500 mL and a rate of 14 breaths per minute. What is the minute volume?",a:["7.0 L/min","5.0 L/min","3.5 L/min","14 L/min"],c:0,e:"Minute volume = tidal volume x rate = 500 mL x 14 = 7,000 mL, or 7.0 liters per minute."},
{id:"u1l3-3",t:"u1l3",q:"How does mechanical ventilation differ fundamentally from normal breathing?",a:["It uses negative pressure, whereas normal breathing uses positive pressure","It delivers gas under positive pressure, whereas normal breathing draws air in with negative pressure","It bypasses the alveoli","It removes CO2 chemically instead of by exhalation"],c:1,e:"Normal breathing lowers pressure in the chest so air flows in; a ventilator pushes gas in under positive pressure, which is why airway pressure limits and alarms are essential."},
{id:"u1l3-4",t:"u1l3",q:"A spirometry report shows an FEV1/FVC ratio of 0.55. What does this suggest?",a:["Normal lung function","A defective spirometer","Airway obstruction such as asthma or COPD","Excellent athletic conditioning"],c:2,e:"A normal FEV1/FVC ratio is roughly 0.7 to 0.8. A lower ratio means the patient cannot exhale quickly, the pattern of obstructive disease."},
{id:"u1l3-5",t:"u1l3",q:"In what order does inhaled air pass through the airway?",a:["Trachea, alveoli, bronchi, bronchioles","Bronchi, trachea, bronchioles, alveoli","Alveoli, bronchioles, bronchi, trachea","Trachea, bronchi, bronchioles, alveoli"],c:3,e:"Air travels from the trachea into the right and left bronchi, then progressively smaller bronchioles, ending in the alveoli where gas exchange occurs."},

// u1l4
{id:"u1l4-1",t:"u1l4",q:"Electrosurgical units deliver hundreds of milliamps through tissue without causing muscle contraction. Why?",a:["The frequency is far too high for nerves and muscles to respond","The current is DC","The return electrode absorbs all stimulation","The patient is grounded"],c:0,e:"Nerves and muscles respond to low-frequency current such as 60 Hz. ESU output at roughly 300 kHz to 3 MHz reverses too fast for membranes to follow, so it heats tissue without stimulating it."},
{id:"u1l4-2",t:"u1l4",q:"A frightened patient's heart rate and blood pressure rise on the monitor. Which part of the nervous system is responsible?",a:["The parasympathetic branch","The sympathetic branch","The cerebellum","The peripheral sensory nerves"],c:1,e:"The sympathetic branch of the autonomic nervous system produces the fight-or-flight response, raising heart rate and blood pressure. The parasympathetic branch slows the heart."},
{id:"u1l4-3",t:"u1l4",q:"Which EEG frequency band is typically seen in a relaxed adult with eyes closed?",a:["Delta, below 4 Hz","Theta, 4 to 8 Hz","Alpha, 8 to 13 Hz","Beta, above 13 Hz"],c:2,e:"Alpha rhythm at 8 to 13 Hz characterizes a relaxed, awake state with eyes closed. Delta is deep sleep, theta is drowsiness, and beta is active alertness."},
{id:"u1l4-4",t:"u1l4",q:"Which part of the brain controls breathing and heart rate, so that injury to it is immediately life-threatening?",a:["The cerebrum","The cerebellum","The spinal cord","The brainstem"],c:3,e:"The brainstem regulates breathing, heart rate, blood pressure, and consciousness. The cerebrum handles thought and voluntary movement, and the cerebellum coordinates balance."},
{id:"u1l4-5",t:"u1l4",q:"Which type of muscle is under voluntary control and is the tissue most often recorded by surface EMG?",a:["Skeletal muscle","Cardiac muscle","Smooth muscle","Visceral muscle"],c:0,e:"Skeletal muscle is voluntary and attached to bones; EMG records its electrical activity. Smooth muscle in vessels and the gut and cardiac muscle in the heart are involuntary."},

// u1l5
{id:"u1l5-1",t:"u1l5",q:"Why are enteral feeding pump connectors designed so they cannot attach to an intravenous line?",a:["To reduce manufacturing cost","To prevent feeding formula from being infused into a vein, which is fatal","To make cleaning easier","To allow higher flow rates"],c:1,e:"Enteral-only connectors are a deliberate design incompatibility. Formula belongs in the GI tract; infusing it into the bloodstream causes death, so the connectors physically prevent the error."},
{id:"u1l5-2",t:"u1l5",q:"By what process does waste move from the patient's blood into the dialysate across the dialyzer membrane?",a:["Active pumping by the machine","Chemical neutralization","Diffusion across a semipermeable membrane","Centrifugal separation"],c:2,e:"Hemodialysis relies on diffusion: waste molecules move from higher concentration in the blood to lower concentration in the dialysate across the semipermeable fibers, with pressure removing excess water."},
{id:"u1l5-3",t:"u1l5",q:"Which organ produces insulin, the hormone that lowers blood glucose?",a:["The liver","The thyroid","The adrenal gland","The pancreas"],c:3,e:"The pancreas releases insulin, which lowers blood glucose, and glucagon, which raises it. Diabetes results from too little insulin or resistance to it."},
{id:"u1l5-4",t:"u1l5",q:"A blood bank refrigerator alarm is set to trigger outside which normal storage range for blood products?",a:["2 to 8 C","0 to 2 C","Minus 20 to minus 10 C","10 to 15 C"],c:0,e:"Blood products and many vaccines are stored at 2 to 8 C with continuous temperature logging and alarms. Blood warmers must not exceed about 42 C when warming for transfusion."},
{id:"u1l5-5",t:"u1l5",q:"Which blood component carries oxygen and is the reason pulse oximetry works?",a:["Plasma","Hemoglobin in red blood cells","Platelets","White blood cells"],c:1,e:"Hemoglobin in red cells binds oxygen, and oxygenated and deoxygenated hemoglobin absorb red and infrared light differently, which is the principle behind pulse oximetry."},

// u2l1
{id:"u2l1-1",t:"u2l1",q:"A 24 V supply drives 3 A through a load. What is the load resistance?",a:["72 ohms","0.125 ohm","8 ohms","27 ohms"],c:2,e:"Ohm's law rearranged for resistance is R = V / I, so 24 volts divided by 3 amps gives 8 ohms. Multiplying instead (72) or dividing the other way (0.125) are the common mistakes."},
{id:"u2l1-2",t:"u2l1",q:"Two 100-ohm resistors are connected in parallel. What is the total resistance?",a:["200 ohms","100 ohms","25 ohms","50 ohms"],c:3,e:"For two equal resistors in parallel, total resistance is half of one: (100 x 100) / (100 + 100) = 50 ohms. Parallel resistance is always less than the smallest branch."},
{id:"u2l1-3",t:"u2l1",q:"In a series circuit, which electrical quantity is the same through every component?",a:["Current","Voltage","Power","Resistance"],c:0,e:"A series circuit has one path, so the same current flows through each component. Voltages across the components add up to the source voltage."},
{id:"u2l1-4",t:"u2l1",q:"The current through a resistor doubles. What happens to the power it dissipates?",a:["It doubles","It quadruples","It stays the same","It halves"],c:1,e:"P = I squared x R, so doubling the current multiplies power by four. This is why slightly overloaded components overheat and fail."},
{id:"u2l1-5",t:"u2l1",q:"Why is a 120 V shock through wet skin far more dangerous than through dry skin?",a:["Wet skin raises the voltage","Water changes the frequency of the current","Wet skin lowers body resistance, so Ohm's law gives a much larger current","Dry skin conducts better than wet skin"],c:2,e:"Current equals voltage divided by resistance. Dry skin may be 100,000 ohms (about 1 mA), while wet skin may be 1,000 ohms, allowing about 120 mA, which is in the fibrillation range."},

// u2l2
{id:"u2l2-1",t:"u2l2",q:"What is the approximate peak voltage of a 120 V RMS supply?",a:["85 V","120 V","240 V","170 V"],c:3,e:"Peak = 1.414 x RMS = 1.414 x 120 = about 170 V. RMS is the effective heating value that meters display."},
{id:"u2l2-2",t:"u2l2",q:"A line isolation monitor in an operating room alarms. What does this indicate?",a:["A first fault has raised the total hazard current to about 5 mA and should be located","The GFCI has tripped","The isolation transformer has failed open","The generator has started"],c:0,e:"The LIM continuously measures the isolated system's insulation and alarms at 5 mA of total hazard current, indicating a first fault. Staff unplug devices one at a time to find the faulty one before a second fault makes the system dangerous."},
{id:"u2l2-3",t:"u2l2",q:"Within how many seconds must a hospital's essential electrical system restore power after a utility failure?",a:["1 second","10 seconds","60 seconds","5 minutes"],c:1,e:"NFPA 99 and NFPA 70 require the alternate power source to restore power within 10 seconds. Life-support devices on red critical-branch outlets usually also have batteries to cover the gap."},
{id:"u2l2-4",t:"u2l2",q:"In a US power cord, which conductor color is the ground?",a:["Black","White","Green","Red"],c:2,e:"Black (or red) is hot, white is neutral, and green or bare is ground, which carries current only during a fault and provides the safety path."},
{id:"u2l2-5",t:"u2l2",q:"A GFCI outlet is installed near a sink in a patient room. Which statement about its protection is correct?",a:["It protects against microshock to a patient with a cardiac catheter","It trips at 10 microamps","It replaces the need for an equipment ground","It trips at about 5 mA of imbalance to protect people from macroshock but does not protect against microshock"],c:3,e:"A GFCI detects about 5 mA of current leaving on the hot conductor and not returning on the neutral, protecting people from macroshock. That threshold is far above the 10 microamp microshock level, so it offers no microshock protection."},

// u2l3
{id:"u2l3-1",t:"u2l3",q:"A monitor resets intermittently, and the power supply output shows excessive ripple. Which component is the most likely cause?",a:["A dried-out electrolytic filter capacitor","The transformer primary winding","A shorted zener diode","The line fuse"],c:0,e:"The filter capacitor smooths the rectified DC. As electrolytics age they dry out and lose capacitance, producing ripple, hum, low output under load, and random resets; a bulged top is the visual clue."},
{id:"u2l3-2",t:"u2l3",q:"A 10 kilohm resistor charges a 100 microfarad capacitor. Approximately what percentage of the final voltage is reached after 1 second?",a:["37%","63%","50%","99%"],c:1,e:"The time constant is R x C = 10,000 x 0.0001 = 1 second. After one time constant the capacitor reaches about 63% of its final voltage; after five it is about 99%."},
{id:"u2l3-3",t:"u2l3",q:"Which filter type removes 60 Hz mains interference from a physiological signal while passing the frequencies above and below it?",a:["Low-pass","High-pass","Notch","Band-pass"],c:2,e:"A notch filter removes a single narrow frequency band, and 60 Hz hum is its classic use. Low-pass and high-pass remove everything above or below a cutoff."},
{id:"u2l3-4",t:"u2l3",q:"A resistor is marked red, violet, orange, gold. What is its value?",a:["2.7 kilohms, 5%","27 ohms, 5%","270 kilohms, 10%","27 kilohms, 5%"],c:3,e:"Red 2, violet 7, orange multiplier of three zeros gives 27,000 ohms; gold is 5% tolerance."},
{id:"u2l3-5",t:"u2l3",q:"A technician troubleshooting a long signal path with a schematic measures the test point in the middle of the chain and finds it correct. Where is the fault?",a:["After the midpoint","Before the midpoint","At the power supply","In the first stage"],c:0,e:"Half-splitting: if the signal is correct at the midpoint, every stage before it is working, so the fault lies downstream. Testing the middle of the remaining section halves the search again."},

// u2l4
{id:"u2l4-1",t:"u2l4",q:"Place the stages of a linear power supply in the correct order from the mains input to the DC output.",a:["Rectifier, transformer, regulator, filter","Transformer, rectifier, filter capacitor, regulator","Filter capacitor, rectifier, transformer, regulator","Regulator, filter, transformer, rectifier"],c:1,e:"The transformer steps the voltage down, the rectifier converts AC to pulsing DC, the filter capacitor smooths it, and the regulator holds the output steady."},
{id:"u2l4-2",t:"u2l4",q:"Which amplifier characteristic allows an ECG front end to display a 1 mV heart signal despite volts of 60 Hz interference present on both electrodes?",a:["High input impedance alone","Low gain","High common-mode rejection ratio of a differential (instrumentation) amplifier","A large output capacitor"],c:2,e:"An instrumentation amplifier amplifies the difference between the two electrodes and rejects what they share. Interference appears on both electrodes equally and cancels; the heart signal appears as a difference and survives."},
{id:"u2l4-3",t:"u2l4",q:"Which component provides electrical isolation between a patient-connected input and the mains-powered circuitry?",a:["A zener diode","A filter capacitor","A bridge rectifier","An optocoupler or isolation amplifier"],c:3,e:"Optocouplers pass signals as light across a gap, and isolation amplifiers and transformers perform the same function for analog signals and power, keeping patient circuits floating so leakage cannot reach the patient."},
{id:"u2l4-4",t:"u2l4",q:"A device's fuse blows repeatedly when replaced. What does this most likely indicate?",a:["A shorted component downstream, which must be found before replacing the fuse","The fuse rating is too high","Normal aging of the fuse","A weak battery"],c:0,e:"A blown fuse is usually a symptom, not the fault. Repeated failures point to a shorted component such as a rectifier diode or output transistor; replacing the fuse without finding the short just blows another."},
{id:"u2l4-5",t:"u2l4",q:"An ECG in diagnostic mode must reproduce frequencies up to 150 Hz. What is the minimum sampling rate required by the Nyquist rule?",a:["75 samples per second","More than 300 samples per second","150 samples per second","1,500 samples per second"],c:1,e:"The Nyquist rule requires sampling at more than twice the highest frequency of interest, so more than 300 samples per second; practical designs sample at 500 to 1,000."},

// u2l5
{id:"u2l5-1",t:"u2l5",q:"An infusion pump runs normally on AC power but shuts down within seconds when unplugged. What are the most likely causes?",a:["A blown line fuse or a bad power cord","A failed display","A depleted or aged battery, a failed charger circuit, or a poor battery connection","A software fault"],c:2,e:"Normal operation on AC proves the supply and main circuitry work. Immediate shutdown on battery points to the battery itself, the charging circuit, or the connector between them."},
{id:"u2l5-2",t:"u2l5",q:"Which battery chemistry is prone to the memory effect that shrinks usable capacity after repeated partial discharges?",a:["Lithium-ion","Sealed lead-acid","Alkaline","Nickel-cadmium"],c:3,e:"Nickel-cadmium cells develop the memory effect and benefit from periodic full discharge and charge conditioning. Lithium-ion has no memory effect; lead-acid suffers from sulfation instead."},
{id:"u2l5-3",t:"u2l5",q:"A laboratory analyzer must never experience a power interruption, even for milliseconds, during a run. Which UPS type is appropriate?",a:["Online double-conversion","Line-interactive","Standby","A surge protector"],c:0,e:"An online double-conversion UPS continuously rectifies and re-inverts power, so the load never sees the utility and there is no transfer gap. Standby and line-interactive units have brief switching delays."},
{id:"u2l5-4",t:"u2l5",q:"What is the nominal voltage of a single lithium-ion cell?",a:["1.2 V","3.6 to 3.7 V","2.0 V","1.5 V"],c:1,e:"Lithium-ion cells are nominally 3.6 to 3.7 V. Nickel-cadmium and nickel-metal hydride are 1.2 V, lead-acid 2.0 V, and alkaline primary cells 1.5 V."},
{id:"u2l5-5",t:"u2l5",q:"During a PM, which battery test best verifies that a device's battery can still support clinical use?",a:["Measuring the open-circuit voltage","Checking that the charge indicator lights","Running the device on battery until the low-battery alarm and comparing the runtime to specification","Weighing the battery"],c:2,e:"Voltage says little about capacity. A runtime test under real load reveals aged batteries that still show full voltage but cannot deliver the specified minutes."},

// u3l1
{id:"u3l1-1",t:"u3l1",q:"At approximately what 60 Hz current level does a person lose the ability to release an energized conductor?",a:["1 mA","1 A","100 mA","10 to 20 mA"],c:3,e:"The let-go threshold is about 10 to 20 mA, where forearm muscles contract involuntarily. Perception is about 1 mA, and 100 to 300 mA is the fibrillation range."},
{id:"u3l1-2",t:"u3l1",q:"A patient has a fluid-filled catheter in the heart. Approximately how much current delivered through that catheter could cause ventricular fibrillation?",a:["10 microamps","5 mA","50 mA","1 A"],c:0,e:"Microshock bypasses the skin's resistance and delivers current directly to the heart, where as little as 10 microamps can trigger fibrillation. This is why cardiac-connected equipment has microamp leakage limits."},
{id:"u3l1-3",t:"u3l1",q:"A device with a broken ground pin continues to operate normally. Why is it still a hazard?",a:["It draws more current","Its normal leakage current has no safe path and may flow through a patient touching the chassis","It will overheat","Its fuse will blow"],c:1,e:"Every device leaks a small current to its chassis. The ground wire normally returns it safely. Without a ground, the chassis floats and the leakage can pass through anyone who touches the chassis and something grounded."},
{id:"u3l1-4",t:"u3l1",q:"Under NFPA 99, what is the maximum acceptable resistance between the chassis of patient-care equipment and the ground pin of its plug?",a:["0.1 ohm","5 ohms","0.5 ohm","50 ohms"],c:2,e:"Ground resistance must not exceed 0.5 ohm, ensuring fault and leakage current has a low-resistance path. Worn plugs, damaged cords, and loose internal ground straps raise it."},
{id:"u3l1-5",t:"u3l1",q:"During a PM, a technician finds a patient monitor's power cord with the ground pin missing and the strain relief pulled out. What is the correct action?",a:["Tape the strain relief and return the device to service","Use a two-prong adapter until a new cord arrives","Continue using it because the device still powers on","Replace the cord, retest electrical safety, and document the repair"],c:3,e:"Damaged cords are replaced, never taped, and adapters that defeat the ground are prohibited. After replacement the device is safety tested and the work is documented."},

// u3l2
{id:"u3l2-1",t:"u3l2",q:"Under IEC 60601-1, what is the normal-condition AC patient leakage limit for a type CF applied part?",a:["10 microamps","50 microamps","100 microamps","500 microamps"],c:0,e:"Type CF (cardiac floating) applied parts are limited to 10 microamps in normal condition and 50 microamps under single fault, because they may connect directly to the heart. Types B and BF allow 100 and 500 microamps."},
{id:"u3l2-2",t:"u3l2",q:"Which symbol identifies an applied part that is safe for direct cardiac connection?",a:["A stick figure","A heart inside a box","A stick figure inside a box","A square inside a square"],c:1,e:"The heart in a box marks a type CF applied part. A plain figure is type B, a figure in a box is type BF, and the square within a square denotes Class II double insulation."},
{id:"u3l2-3",t:"u3l2",q:"Why does a safety analyzer measure chassis leakage with the ground open and the polarity reversed as well as in normal condition?",a:["To warm up the device","To test the outlet rather than the device","Because those single-fault conditions raise leakage, and the device must remain safe under any single fault","Because normal-condition readings are unreliable"],c:2,e:"IEC 60601-1 requires safety under a single fault. Open ground and reversed polarity are the faults that most increase chassis leakage, so the analyzer simulates them and compares readings to the single-fault limits."},
{id:"u3l2-4",t:"u3l2",q:"Which document is the design and test standard for medical electrical equipment, as opposed to the code governing the health care facility?",a:["NFPA 99","NFPA 70","OSHA 29 CFR 1910","IEC 60601-1"],c:3,e:"IEC 60601-1 defines how medical electrical equipment is designed and tested, including classes, applied-part types, and leakage limits. NFPA 99 governs the facility's systems and testing practices, and NFPA 70 is the electrical code for building wiring."},
{id:"u3l2-5",t:"u3l2",q:"When must electrical safety testing be performed on a patient monitor?",a:["At incoming inspection, after any repair that could affect safety, and at scheduled preventive maintenance","Only when it is purchased","Only when a user reports a tingle","Once every five years"],c:0,e:"Testing at incoming inspection catches shipping damage and defects, testing after repair catches disturbed grounds and insulation, and scheduled PM catches aging. All three are documented."},

// u3l3
{id:"u3l3-1",t:"u3l3",q:"A technician must service a ventilator in the room of a patient with active tuberculosis. Which PPE is required?",a:["Gloves only","A fit-tested N95 respirator, in a negative-pressure room","A surgical mask","A face shield without a mask"],c:1,e:"Tuberculosis requires airborne precautions: a fit-tested N95 respirator and a negative-pressure isolation room. A surgical mask does not filter airborne particles adequately."},
{id:"u3l3-2",t:"u3l3",q:"When removing PPE after working in an isolation room, which item should be removed first?",a:["The gown","The mask","The gloves","Eye protection"],c:2,e:"Gloves are the most contaminated item and come off first, followed by eye protection, gown, and finally the mask, with hand hygiene between steps."},
{id:"u3l3-3",t:"u3l3",q:"A flexible endoscope contacts mucous membranes but does not enter sterile tissue. Under the Spaulding classification, what is the minimum reprocessing required?",a:["Low-level disinfection","No reprocessing between patients","Cleaning only","High-level disinfection"],c:3,e:"Semi-critical items that touch mucous membranes require at least high-level disinfection after thorough cleaning. Critical items entering sterile tissue must be sterilized; non-critical items touching intact skin need low-level disinfection."},
{id:"u3l3-4",t:"u3l3",q:"Why must a device be cleaned before it is disinfected?",a:["Dried soil and blood shield organisms from the disinfectant","Disinfectants are only effective on wet surfaces","Cleaning sterilizes the device","Disinfection damages dirty surfaces"],c:0,e:"Disinfectants cannot penetrate dried organic material. Cleaning with detergent and friction removes soil so the disinfectant can contact the organisms for the required time."},
{id:"u3l3-5",t:"u3l3",q:"What are the standard parameters for a gravity steam sterilization cycle?",a:["100 C at atmospheric pressure for 5 minutes","121 C at 15 psi for 15 to 30 minutes","150 C at 5 psi for 60 minutes","80 C at 30 psi for 10 minutes"],c:1,e:"Standard steam sterilization runs at 121 C (250 F) and about 15 psi for 15 to 30 minutes; flash cycles use 132 to 135 C for a few minutes. Biological indicators confirm the cycle killed spores."},

// u3l4
{id:"u3l4-1",t:"u3l4",q:"In the United States, a medical gas cylinder painted green contains which gas?",a:["Nitrous oxide","Carbon dioxide","Oxygen","Nitrogen"],c:2,e:"US cylinder colors: oxygen green, nitrous oxide blue, carbon dioxide gray, nitrogen black, medical air yellow, helium brown. Pin index and DISS fittings prevent wrong connections regardless of color."},
{id:"u3l4-2",t:"u3l4",q:"A technician is asked to bring a steel tool cart into an MRI suite to work on a monitor in the magnet room. What is the correct response?",a:["Proceed, because the scanner is not running","Proceed if the cart is unplugged","Proceed after turning off the room lights","Refuse, because the magnet is always on and ferromagnetic objects become projectiles in zone IV"],c:3,e:"The MRI magnet is always energized. Ferromagnetic objects are pulled into it with dangerous force. Only MR Safe or MR Conditional equipment enters zone IV, after screening."},
{id:"u3l4-3",t:"u3l4",q:"A small fire starts in an equipment closet. Using the RACE procedure, what is the first action?",a:["Rescue anyone in immediate danger","Pull the alarm","Extinguish the fire","Confine the fire by closing doors"],c:0,e:"RACE stands for Rescue, Alarm, Confine, Extinguish (or Evacuate), in that order. People in immediate danger are moved first, then the alarm is activated."},
{id:"u3l4-4",t:"u3l4",q:"A technician working near a fluoroscopy unit doubles their distance from the X-ray source. By roughly how much does their radiation exposure change?",a:["It halves","It drops to one quarter","It stays the same","It doubles"],c:1,e:"Radiation intensity follows the inverse square law: doubling the distance reduces exposure to one quarter. Time, distance, and shielding are the three protective principles under ALARA."},
{id:"u3l4-5",t:"u3l4",q:"Which section of a safety data sheet describes the first-aid measures to take after exposure?",a:["Section 2","Section 8","Section 4","Section 13"],c:2,e:"The 16-section SDS format places first-aid measures in Section 4. Section 2 is hazard identification, Section 8 covers exposure controls and PPE, and Section 13 covers disposal."},

// u3l5
{id:"u3l5-1",t:"u3l5",q:"Which federal agency establishes the Conditions of Participation that hospitals must meet, including requirements for maintaining equipment in safe operating condition?",a:["The FDA","OSHA","AAMI","CMS"],c:3,e:"The Centers for Medicare and Medicaid Services sets the Conditions of Participation. Accrediting organizations with deemed status survey hospitals on CMS's behalf."},
{id:"u3l5-2",t:"u3l5",q:"A hospital wants to move a category of infusion pumps to a maintenance interval longer than the manufacturer recommends. What must be in place for this to be acceptable under CMS rules?",a:["A documented risk assessment by a qualified individual supporting an alternative equipment maintenance program, with device history to justify the change","Approval from the pump manufacturer only","A memo from the nursing director","Nothing, because infusion pumps are exempt from maintenance requirements"],c:0,e:"CMS permits AEM programs when a qualified person documents a risk-based justification supported by the device's history. Imaging equipment, lasers, and devices with manufacturer or legal requirements are excluded from AEM."},
{id:"u3l5-3",t:"u3l5",q:"Which ANSI/AAMI standard provides guidance specifically for alternative equipment maintenance programs?",a:["EQ56","EQ103","EQ93","EQ89"],c:1,e:"EQ103 covers AEM programs. EQ56 is the recommended practice for a medical equipment management program, EQ89 addresses scheduled maintenance and performance verification, and EQ93 defines vocabulary."},
{id:"u3l5-4",t:"u3l5",q:"A patient dies and the event may be related to a malfunctioning infusion pump. Within what time must the hospital, as a user facility, report the death to the FDA and the manufacturer?",a:["24 hours","30 calendar days","10 work days","One year, in the annual report"],c:2,e:"Under FDA medical device reporting rules, user facilities report device-related deaths to both the FDA and the manufacturer within 10 work days. Serious injuries are reported to the manufacturer within 10 work days."},
{id:"u3l5-5",t:"u3l5",q:"During a survey, an accreditor asks for evidence that scheduled maintenance on life-support equipment was completed on time. Which source provides this?",a:["The manufacturer's brochure","The purchase order","The technician's memory","A PM completion report generated from the CMMS"],c:3,e:"The CMMS holds the PM schedule, completion records, and test results, and its reports demonstrate compliance. Work that is not documented in the CMMS cannot be shown to a surveyor."}
);

// CBET Academy question bank, units 4 to 6. All questions are original.
window.FRA = window.FRA || {};
FRA.questions = FRA.questions || [];
FRA.questions.push(
// u4l1
{id:"u4l1-1",t:"u4l1",q:"On an ECG strip recorded at 25 mm/s, consecutive R waves are four large boxes apart. What is the heart rate?",a:["60 bpm","75 bpm","100 bpm","150 bpm"],c:1,e:"At 25 mm/s each large box is 0.20 s, so heart rate = 300 divided by the number of large boxes between R waves: 300 / 4 = 75 bpm. Using small boxes, 1500 / 20 also gives 75."},
{id:"u4l1-2",t:"u4l1",q:"Which ECG lead is defined as the voltage of the left leg electrode minus the right arm electrode?",a:["Lead I","Lead III","Lead II","aVR"],c:2,e:"Lead II = LL minus RA and is the standard monitoring lead. Lead I is LA minus RA and Lead III is LL minus LA; Einthoven's law states II = I + III."},
{id:"u4l1-3",t:"u4l1",q:"A cardiologist needs to evaluate ST-segment changes accurately. Which ECG bandwidth should be used?",a:["Monitoring mode, 0.5 to 40 Hz","Telemetry mode, 1 to 20 Hz","A 60 Hz notch filter only","Diagnostic mode, 0.05 to 150 Hz"],c:3,e:"Diagnostic bandwidth extends down to 0.05 Hz, low enough to reproduce the slow ST segment faithfully, and up to 150 Hz for sharp features. Monitoring mode's 0.5 Hz high-pass distorts ST segments."},
{id:"u4l1-4",t:"u4l1",q:"In the AHA electrode color code, which color is the right arm electrode?",a:["White","Red","Green","Black"],c:0,e:"RA is white, LA is black, RL is green (the reference), LL is red, and the chest lead is brown. The memory aid is white on the right, smoke over fire on the left."},
{id:"u4l1-5",t:"u4l1",q:"An ECG shows a slowly rolling baseline that rises and falls with the patient's breathing. What is the most likely cause?",a:["60 Hz interference from a nearby device","Wandering baseline from respiration and electrode movement","A pacemaker","Ventricular fibrillation"],c:1,e:"Slow baseline drift synchronized with breathing is wandering baseline caused by chest movement and drying electrodes. 60 Hz interference appears as a thick fuzzy trace, not a slow drift."},

// u4l2
{id:"u4l2-1",t:"u4l2",q:"Which blood pressure value does an oscillometric NIBP monitor measure directly, with the other values derived from it?",a:["Systolic pressure","Diastolic pressure","Mean arterial pressure","Pulse pressure"],c:2,e:"The cuff oscillations are largest at mean arterial pressure, which the monitor measures directly. Systolic and diastolic are derived from where the oscillation amplitude rises and falls past set fractions of the maximum."},
{id:"u4l2-2",t:"u4l2",q:"An adult patient with a large arm is measured with a standard adult cuff that is clearly too small. How will the readings be affected?",a:["The monitor will refuse to measure","They will read falsely low","They will be accurate but slow","They will read falsely high"],c:3,e:"A cuff that is too small or too loose must be inflated harder to occlude the artery and reads falsely high. Bladder width should be about 40 percent of the arm circumference."},
{id:"u4l2-3",t:"u4l2",q:"An arterial line transducer is mounted 13.6 cm below the patient's phlebostatic axis. How will the displayed pressure be affected?",a:["About 10 mmHg too high","About 10 mmHg too low","About 1 mmHg too high","Unaffected"],c:0,e:"Fluid columns add pressure: 13.6 cm of water equals 10 mmHg. A transducer below the reference level reads high by that amount; above the level it reads low. Re-level and re-zero."},
{id:"u4l2-4",t:"u4l2",q:"After a fast-flush test, an arterial waveform appears rounded with no dicrotic notch and no oscillations. Which condition is present, and how are the readings affected?",a:["Underdamping; systolic reads high","Overdamping; systolic reads low and diastolic high","Optimal damping; readings are accurate","Transducer failure; no reading"],c:1,e:"Overdamping from air bubbles, clots, kinks, or loose connections rounds the waveform, eliminates the notch, and causes systolic to read low and diastolic high. Underdamping causes ringing and a high systolic."},
{id:"u4l2-5",t:"u4l2",q:"What is the standard sensitivity of a disposable invasive pressure transducer that allows it to be used with any compliant monitor?",a:["50 microvolts per volt per mmHg","5 millivolts per mmHg","5 microvolts per volt per mmHg","1 volt per mmHg"],c:2,e:"The industry standard is 5 microvolts of output per volt of excitation per mmHg, so transducers and monitors from different vendors interchange."},

// u4l3
{id:"u4l3-1",t:"u4l3",q:"A patient rescued from a house fire has an SpO2 reading of 99 percent but is confused and cyanotic. What is the most likely explanation?",a:["The oximeter probe is on the wrong finger","Ambient light is lowering the reading","The patient has excellent oxygenation","Carboxyhemoglobin from carbon monoxide is causing a falsely high reading"],c:3,e:"Carboxyhemoglobin absorbs light like oxyhemoglobin, so a pulse oximeter reads falsely high in carbon monoxide poisoning. A blood gas with co-oximetry is needed."},
{id:"u4l3-2",t:"u4l3",q:"Which two wavelengths does a pulse oximeter use?",a:["About 660 nm red and 940 nm infrared","About 400 nm and 500 nm","About 1,000 nm and 2,000 nm","About 4.26 micrometers and 10 micrometers"],c:0,e:"Red light near 660 nm and infrared near 940 nm are absorbed differently by oxygenated and deoxygenated hemoglobin; the ratio of the pulsatile absorbances gives SpO2. Capnography uses 4.26 micrometer infrared."},
{id:"u4l3-3",t:"u4l3",q:"During transport, a ventilated patient's EtCO2 waveform suddenly disappears while the ventilator continues to show delivered volumes. What should be checked first?",a:["The capnograph's calibration","The patient and the airway connection, because loss of the waveform indicates disconnection, apnea, or loss of circulation","The monitor's battery","The ventilator's oxygen supply"],c:1,e:"CO2 appears in exhaled gas only when air moves and blood flows. A sudden flat capnogram means a disconnected or dislodged airway or lost circulation and is a clinical emergency, checked before any equipment troubleshooting."},
{id:"u4l3-4",t:"u4l3",q:"A capnography system draws a sample of exhaled gas through thin tubing to a sensor inside the monitor. Which type is this, and what is its known drawback?",a:["Mainstream; adds dead space at the airway","Transcutaneous; requires skin heating","Sidestream; introduces a delay and requires a water trap and clean tubing","Impedance; is fooled by motion"],c:2,e:"Sidestream capnography samples gas through tubing, allowing use on non-intubated patients but adding delay and clogging risk. Mainstream places the sensor at the airway."},
{id:"u4l3-5",t:"u4l3",q:"A new temperature probe reads 3 degrees lower than a reference on the same patient. What is the most likely cause?",a:["The patient's temperature changed","The probe needs a longer warm-up","The monitor's ECG cable is loose","The probe is from a different YSI series than the monitor expects"],c:3,e:"Thermistor probes follow either the YSI 400 or YSI 700 resistance curve, and the two are not interchangeable. A mismatched probe reads several degrees off without an error message."},

// u4l4
{id:"u4l4-1",t:"u4l4",q:"Under IEC 60601-1-8, how is a high-priority alarm such as asystole indicated visually?",a:["A flashing red light","A flashing yellow light","A steady cyan light","A steady green light"],c:0,e:"High-priority alarms are red and flashing with an urgent tone; medium-priority alarms are yellow and flashing; low-priority alarms are cyan or yellow and steady."},
{id:"u4l4-2",t:"u4l4",q:"Every monitor on a nursing unit simultaneously stops displaying at the central station, although each bedside monitor still works locally. Where should troubleshooting begin?",a:["Each bedside monitor's ECG cable","The network switch or central station server, because the problem is system-wide","The patient electrodes","The telemetry transmitter batteries"],c:1,e:"When all beds fail at once the common element is the network or the central station. A single bed offline points to that bed's cable, port, or configuration."},
{id:"u4l4-3",t:"u4l4",q:"Which frequency bands are reserved in the United States for wireless medical telemetry?",a:["2.4 GHz and 5 GHz","88 to 108 MHz","608 to 614 MHz, 1395 to 1400 MHz, and 1427 to 1432 MHz","900 MHz only"],c:2,e:"The Wireless Medical Telemetry Service bands are protected from interference: 608 to 614 MHz, 1395 to 1400 MHz, and 1427 to 1432 MHz. Some systems use Wi-Fi at 2.4 and 5 GHz, which is shared."},
{id:"u4l4-4",t:"u4l4",q:"A unit reports many false lead-off alarms from telemetry patients every shift. What is the most likely cause and the best corrective action?",a:["Failed transmitters; replace them all","Antenna failure; add antennas","Central station software; reinstall it","Poor electrode contact and skin preparation; change electrodes daily and prep skin properly"],c:3,e:"False lead-off alarms come from high electrode impedance: dried gel, poor skin prep, and old electrodes. Daily electrode changes and proper preparation are standard alarm management measures."},
{id:"u4l4-5",t:"u4l4",q:"Staff on a busy unit have begun silencing monitor alarms without checking the patient because so many are false. What is this phenomenon called?",a:["Alarm fatigue","Alarm escalation","Signal saturation","Telemetry drift"],c:0,e:"Alarm fatigue occurs when excessive low-value alarms desensitize staff, so real alarms are missed. Alarm management programs adjust limits, delays, and electrode practices to reduce it."},

// u4l5
{id:"u4l5-1",t:"u4l5",q:"How does a fetal monitor measure fetal heart rate non-invasively?",a:["Impedance pneumography","Ultrasound Doppler detecting the moving fetal heart","ECG electrodes on the mother's abdomen","Infrared absorption"],c:1,e:"The ultrasound transducer detects the frequency shift from the moving fetal heart and derives a rate. A fetal scalp electrode is the direct, invasive alternative."},
{id:"u4l5-2",t:"u4l5",q:"A fetal heart rate trace shows 78 bpm that exactly matches the maternal pulse displayed on the monitor. What has most likely happened?",a:["The fetus is in distress","The tocodynamometer belt is too tight","The Doppler transducer has locked onto the maternal pulse and must be repositioned","The paper speed is wrong"],c:2,e:"When the FHR trace matches the maternal pulse, the ultrasound is detecting the mother's vessels rather than the fetal heart. Reposition the transducer and confirm; monitors display maternal pulse for this comparison."},
{id:"u4l5-3",t:"u4l5",q:"What does a tocodynamometer measure?",a:["Intrauterine pressure in mmHg","Fetal heart rate","Fetal oxygen saturation","The timing and duration of uterine contractions by sensing abdominal firmness"],c:3,e:"The TOCO is a pressure-sensing button strapped over the fundus. It shows when contractions occur and how long they last but not true intrauterine pressure; an intrauterine pressure catheter provides that."},
{id:"u4l5-4",t:"u4l5",q:"What is the 10-20 system used in EEG?",a:["A standardized method of placing scalp electrodes at proportional intervals of head measurements","A gain and filter setting","A sampling rate specification","A classification of seizure types"],c:0,e:"The 10-20 system places electrodes at 10 and 20 percent intervals of measured head dimensions so placements are consistent and reproducible between laboratories."},
{id:"u4l5-5",t:"u4l5",q:"Which EEG frequency band is below 4 Hz and associated with deep sleep?",a:["Alpha","Delta","Theta","Beta"],c:1,e:"Delta rhythms are below 4 Hz and dominate deep sleep. Theta is 4 to 8 Hz, alpha 8 to 13 Hz in relaxed wakefulness, and beta above 13 Hz in alert states."},

// u4l6
{id:"u4l6-1",t:"u4l6",q:"Which test instrument measures the energy a defibrillator actually delivers?",a:["An electrical safety analyzer","A patient simulator","A defibrillator analyzer with a 50-ohm load","An oscilloscope"],c:2,e:"A defibrillator analyzer presents a 50-ohm load that mimics the patient and measures delivered energy, charge time, synchronization, and pacing output."},
{id:"u4l6-2",t:"u4l6",q:"A ventilator displays a PEEP of 10 cm H2O. Approximately how much is this in mmHg?",a:["13.6 mmHg","1.36 mmHg","10 mmHg","7.4 mmHg"],c:3,e:"1 mmHg equals 1.36 cm H2O, so 10 cm H2O divided by 1.36 is about 7.4 mmHg."},
{id:"u4l6-3",t:"u4l6",q:"A patient's temperature is recorded as 102.2 F. What is this in Celsius?",a:["39.0 C","38.0 C","37.0 C","40.0 C"],c:0,e:"C = (F minus 32) / 1.8 = (102.2 minus 32) / 1.8 = 70.2 / 1.8 = 39.0 C."},
{id:"u4l6-4",t:"u4l6",q:"What is the difference between lumens and lux when evaluating a surgical light?",a:["Lumens measure color temperature; lux measures brightness","Lumens are the lamp's total light output; lux is the illumination arriving at a surface, rated at one meter","Lux is the total output; lumens are at the surface","They are the same unit"],c:1,e:"Lumens describe how much light a source emits in total. Lux is lumens per square meter at the illuminated surface, which is why surgical lights are specified in lux at one meter."},
{id:"u4l6-5",t:"u4l6",q:"Before using a safety analyzer to test a patient monitor, what should the technician confirm about the analyzer itself?",a:["That it is the same brand as the monitor","That it has been reset to factory defaults","That its calibration is current and traceable, shown by the calibration label","That it is plugged into a red outlet"],c:2,e:"Test equipment has its own calibration schedule traceable to national standards. An out-of-calibration analyzer produces readings that cannot be trusted or defended in an audit."},

// u5l1
{id:"u5l1-1",t:"u5l1",q:"How is a spirometer's volume accuracy verified?",a:["With a sound level meter","With a patient simulator","With certified test weights","With a 3-liter calibration syringe delivered at several speeds"],c:3,e:"A 3-liter syringe pushed at different speeds checks that the spirometer reads the known volume within a few percent across flow rates. Filters and mouthpieces are replaced for infection control."},
{id:"u5l1-2",t:"u5l1",q:"An ultrasound examination of a superficial vessel in the neck requires the best possible resolution. Which transducer frequency is most appropriate?",a:["10 MHz or higher","3.5 MHz","5 MHz","2 MHz"],c:0,e:"Higher ultrasound frequencies give better resolution but less penetration, so superficial structures use high-frequency transducers. Deep abdominal imaging uses 2 to 5 MHz."},
{id:"u5l1-3",t:"u5l1",q:"What instrument is used to calibrate an audiometer?",a:["A tachometer","A sound level meter with an artificial ear coupler","A light meter","A 3-liter syringe"],c:1,e:"Audiometer output is verified with a sound level meter attached to a coupler that simulates the ear, typically annually, plus daily listening checks. Testing must occur in a quiet booth."},
{id:"u5l1-4",t:"u5l1",q:"Which two safety items must be present in a room where cardiac stress testing is performed?",a:["A GFCI outlet and a light meter","A fire extinguisher and a UPS","A crash cart with a defibrillator and an emergency stop on the treadmill","An isolation transformer and a tachometer"],c:2,e:"Stress testing provokes cardiac events, so a defibrillator and emergency equipment must be immediately available, and the treadmill must have an emergency stop the patient can reach."},
{id:"u5l1-5",t:"u5l1",q:"How should a patient scale be verified during preventive maintenance?",a:["By weighing a technician and comparing to a bathroom scale","By measuring the load cell resistance only","By checking the display brightness","By applying certified test weights at several points of the range and confirming return to zero"],c:3,e:"Certified test weights verify accuracy across the range, and the scale should return to zero when unloaded. Level placement and nothing touching the platform are also confirmed."},

// u5l2
{id:"u5l2-1",t:"u5l2",q:"A nurse opens the door of a large-volume pump to change the administration set and the bag begins running rapidly into the patient by gravity. Which safety feature has failed or been bypassed?",a:["Free-flow protection","Downstream occlusion alarm","Air-in-line detection","The drug library"],c:0,e:"Free-flow protection uses a clamp in the set or the pump's door mechanism to stop gravity flow whenever the set is removed. Its failure can deliver an entire bag in minutes."},
{id:"u5l2-2",t:"u5l2",q:"An order calls for 1,000 mL of fluid to be infused over 8 hours. What rate should be programmed on the pump?",a:["80 mL/hr","125 mL/hr","100 mL/hr","250 mL/hr"],c:1,e:"Rate in mL/hr equals total volume divided by hours: 1,000 / 8 = 125 mL/hr."},
{id:"u5l2-3",t:"u5l2",q:"A 70 kg patient is ordered a drug at 0.1 mg/kg/hr from a bag containing 1 mg/mL. What pump rate delivers this dose?",a:["0.7 mL/hr","70 mL/hr","7 mL/hr","10 mL/hr"],c:2,e:"Dose per hour = 0.1 mg/kg/hr x 70 kg = 7 mg/hr. At 1 mg/mL, that is 7 mL/hr. Always convert dose to mass per hour, then divide by concentration."},
{id:"u5l2-4",t:"u5l2",q:"Which infusion device feature limits how often a patient can self-administer a dose of pain medication?",a:["Keep-vein-open rate","The air-in-line sensor","Upstream occlusion detection","The lockout interval on a PCA pump"],c:3,e:"Patient-controlled analgesia pumps enforce a lockout interval between boluses and an hourly or four-hour maximum, and log every request and delivery in a locked case."},
{id:"u5l2-5",t:"u5l2",q:"A syringe pump is programmed at 0.5 mL/hr, yet no drug reaches the patient for several minutes after starting. What is the most likely explanation?",a:["Start-up delay from mechanical slack at very low rates, or an unseated syringe","The pump's battery is low","The drug library blocked the infusion","The air-in-line sensor is dirty"],c:0,e:"At very low rates, the lead screw must take up mechanical slack before the plunger moves, causing a start-up delay. A syringe not fully seated and clamped produces the same result."},

// u5l3
{id:"u5l3-1",t:"u5l3",q:"In an infant incubator's servo mode, what does the controller use as its target?",a:["The set air temperature","The temperature measured by a probe on the infant's skin","The room temperature","The humidity level"],c:1,e:"Skin (servo) mode adjusts the heater to hold the infant's skin probe at the set temperature. Air mode holds the air temperature instead. Probe-off alarms are essential in servo mode."},
{id:"u5l3-2",t:"u5l3",q:"A radiant warmer's skin probe falls off the infant and the heater continues at full output. Which safety function has failed?",a:["The humidity alarm","The phototherapy timer","The probe-off or probe-failure alarm that should stop uncontrolled heating","The fan interlock"],c:2,e:"Radiant warmers depend on the skin probe for servo control; a probe-off alarm must sound and limit heating, or the warmer runs open-loop and can burn the infant."},
{id:"u5l3-3",t:"u5l3",q:"What wavelength range is used for neonatal phototherapy, and how is its output verified?",a:["Infrared, 940 nm; verified with a thermometer","Red light, 660 nm; verified with an SpO2 simulator","Ultraviolet, 254 nm; verified with a light meter","Blue light around 425 to 475 nm; verified with a radiometer"],c:3,e:"Blue light in the 425 to 475 nm range breaks down bilirubin. Output is measured with a radiometer in microwatts per square centimeter per nanometer, and lamps are replaced by hours of use."},
{id:"u5l3-4",t:"u5l3",q:"A patient is burned under a forced-air warming blanket. Investigation finds the hose was used without the blanket attached. What is this practice called, and why does it cause injury?",a:["Hosing; the concentrated outlet air is hot enough to burn skin","Servo failure; the water temperature exceeded 42 C","Alternate pathing; ESU current returned through the hose","Siphoning; fluid drained into the blanket"],c:0,e:"Using the warmer hose without its diffusing blanket, called hosing, directs hot air onto a small area of skin and causes burns. The blanket must always be attached."},
{id:"u5l3-5",t:"u5l3",q:"Which vacuum setting is typical for adult airway suctioning?",a:["10 to 20 mmHg","80 to 120 mmHg","300 to 400 mmHg","760 mmHg"],c:1,e:"Adult airway suction is typically regulated to about 80 to 120 mmHg; children and infants use lower settings. Regulators are verified against a vacuum gauge."},

// u5l4
{id:"u5l4-1",t:"u5l4",q:"A laboratory centrifuge vibrates violently and moves across the bench when started. What should be checked first?",a:["The lid interlock switch","The timer accuracy","Whether the tubes are balanced by weight in opposing positions","The room temperature"],c:2,e:"An unbalanced rotor is the most common cause of centrifuge vibration and a safety hazard. Loads must be balanced by weight opposite each other; persistent vibration then points to the rotor or a bearing."},
{id:"u5l4-2",t:"u5l4",q:"What is the required storage temperature range for blood products and most vaccines, and what must the storage unit provide?",a:["Minus 20 to minus 10 C; a lockable door","0 to 4 C; a glass door","10 to 15 C; humidity control","2 to 8 C; continuous temperature logging with high and low alarms"],c:3,e:"Blood and vaccines are stored at 2 to 8 C. Refrigerators must log temperature continuously, alarm on excursions with remote notification, and be on emergency power; an excursion can destroy the inventory."},
{id:"u5l4-3",t:"u5l4",q:"How is centrifuge speed verified during preventive maintenance?",a:["With a tachometer, often optical or strobe, compared against the set RPM","By listening to the motor","By timing a full cycle","By measuring the rotor diameter"],c:0,e:"A tachometer measures actual rotor speed against the setting. Because relative centrifugal force depends on speed squared and rotor radius, speed errors change separation results."},
{id:"u5l4-4",t:"u5l4",q:"A pathology department asks the biomed shop to add a cryostat to the inventory. What kind of device is a cryostat?",a:["A refrigerated centrifuge","A microtome inside a refrigerated chamber for cutting frozen tissue sections","A freezer alarm system","A cooled incubator for cell culture"],c:1,e:"A cryostat houses a microtome in a chamber at about minus 20 C so frozen tissue sections can be cut for rapid diagnosis during surgery. Blade sharpness and biohazard handling are the key safety concerns."},
{id:"u5l4-5",t:"u5l4",q:"How do laboratory analyzers prove that their measurements remain accurate between calibrations?",a:["By replacing reagents weekly","By restarting daily","By running quality control samples with known values","By running distilled water"],c:2,e:"Calibrators set the analyzer's scale and quality control samples with known values are run regularly to prove the calibration holds. Out-of-range QC halts patient testing until corrected."},

// u6l1
{id:"u6l1-1",t:"u6l1",q:"Why can an electrosurgical unit pass hundreds of milliamps through a patient without causing muscle contraction?",a:["Because the current is direct current","Because the patient is anesthetized","Because the return electrode absorbs the stimulation","Because its frequency of about 300 kHz to 3 MHz is above the range that stimulates nerves and muscle"],c:3,e:"Nerve and muscle membranes cannot respond to reversals faster than roughly 100 kHz, so ESU current at hundreds of kilohertz heats tissue without stimulation."},
{id:"u6l1-2",t:"u6l1",q:"A patient suffers a burn under the return electrode pad during a long procedure. Which ESU feature is designed to prevent this, and how does it work?",a:["Return electrode monitoring; a split pad's contact impedance is measured and the generator disables output if contact degrades","Bipolar mode; it eliminates the pad","The coagulation waveform; it lowers voltage","A footswitch interlock; it limits activation time"],c:0,e:"Return electrode (contact quality) monitoring measures impedance between the halves of a split pad and inhibits the ESU when the contact area shrinks or the pad disconnects, preventing current concentration burns."},
{id:"u6l1-3",t:"u6l1",q:"Which electrosurgical waveform is a continuous sine wave used to vaporize tissue for a clean incision?",a:["Coagulation","Cut","Blend","Fulguration"],c:1,e:"Cut mode uses a continuous, lower-voltage sine wave that boils cells and creates a clean cut with little hemostasis. Coagulation uses interrupted, higher-voltage bursts that dry and seal tissue."},
{id:"u6l1-4",t:"u6l1",q:"Which instrument verifies an electrosurgical unit's output power and the function of its return electrode monitoring?",a:["A defibrillator analyzer","A gas flow analyzer","An electrosurgical analyzer with selectable loads and a split-pad simulator","A patient simulator"],c:2,e:"An ESU analyzer measures output power into tissue-like loads, high-frequency leakage, and tests return electrode monitoring by simulating a balanced, unbalanced, and disconnected split pad."},
{id:"u6l1-5",t:"u6l1",q:"The laparoscopic video image in an OR has become dim and yellowish over several months. What is the most likely cause?",a:["The camera control unit software","The insufflator","The video routing switcher","Broken fibers in the light cable or an aged lamp in the light source"],c:3,e:"Light cables lose fibers with repeated flexing and lamps darken with age, dimming and discoloring the image. Holding the cable to a light shows dark spots where fibers are broken."},

// u6l2
{id:"u6l2-1",t:"u6l2",q:"During a PM, a pneumatic tourniquet displays 250 mmHg while a reference gauge on the same cuff reads 205 mmHg. What is the significance?",a:["The controller's gauge is out of calibration and could cause under- or over-pressurization; recalibrate before use","Normal variation; no action needed","The cuff is the wrong size","The reference gauge must be wrong"],c:0,e:"Tourniquet pressure accuracy directly affects patient safety: too low lets blood into the field, too high injures nerves and tissue. A 45 mmHg discrepancy requires calibration before return to service."},
{id:"u6l2-2",t:"u6l2",q:"What are the standard parameters of a gravity steam sterilization cycle, and what confirms the cycle was effective?",a:["100 C for 5 minutes; a chemical indicator","121 C at about 15 psi for 15 to 30 minutes; a biological indicator","132 C for 60 minutes; the printout alone","80 C for 30 minutes; a temperature log"],c:1,e:"Gravity steam cycles run at 121 C and about 15 psi for 15 to 30 minutes. Biological indicators containing spores prove lethality; chemical indicators only show exposure to the cycle."},
{id:"u6l2-3",t:"u6l2",q:"A blood warmer's outlet temperature measures 44 C during testing. What action is required?",a:["Note it and return to service","Increase flow to cool the outlet","Remove it from service because the over-temperature cutoff should prevent exceeding about 42 C, above which red cells are damaged","Replace the disposable cassette only"],c:2,e:"Blood must not be warmed above about 42 C. An outlet reading of 44 C means the over-temperature cutoff and alarm have failed; the device is unsafe until repaired and retested."},
{id:"u6l2-4",t:"u6l2",q:"In what unit is a surgical light's illumination specified?",a:["Lumens at the lamp","Candela per bulb","Watts of lamp power","Lux at one meter"],c:3,e:"Surgical lights are rated in lux, the illumination arriving at the surgical field, measured at one meter, along with color temperature and shadow control."},
{id:"u6l2-5",t:"u6l2",q:"A surgical microscope's head slowly drops toward the patient when released. What should be inspected?",a:["The stand's counterbalance and brakes","The eyepiece diopters","The fiber-optic light cable","The video camera port"],c:0,e:"A microscope head that drifts indicates the stand is out of balance or its brakes are failing, a serious injury risk. Balance and brake function are tested with the head fully loaded."},

// u6l3
{id:"u6l3-1",t:"u6l3",q:"A defibrillator set to 200 J delivers 150 J into the analyzer's 50-ohm load. What should the technician conclude?",a:["The reading is within tolerance","The delivered energy is out of tolerance, suggesting capacitor or relay problems, and the unit must be removed from service","The analyzer needs a higher load","The battery is fully charged"],c:1,e:"Delivered energy must fall within the manufacturer's tolerance, often about 15 percent. A 25 percent shortfall indicates aging capacitors or relay problems and the defibrillator cannot remain in service."},
