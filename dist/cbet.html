u1l6: `## Why the exam goes this deep
The anatomy section is only seven percent of the test, but its questions are cheap points if you know a layer of detail beyond the device connection. They are written like a biology quiz: which layer is deepest, which muscle is not striated, where a gland sits, which lobe does what. Treat the body as a building with named floors and rooms.

## Skin, in layers
\`\`\`
layer            what is in it                                     technician's angle
epidermis        dead outer cells; stratum basale at its base makes new ones   the high-impedance barrier electrodes must cross
dermis           blood vessels, nerves, sweat and sebaceous glands, follicles   where burns and pressure injuries happen
hypodermis       subcutaneous fat; deepest; anchors skin to muscle     insulation and padding; the deepest layer on the exam
\`\`\`
Sebaceous glands make oil; sweat glands cool and excrete; receptors report pain, touch, pressure, temperature; ultraviolet light makes vitamin D; some drugs cross the skin (patches).

## Muscle, three kinds
\`\`\`
type       voluntary?   striated?   where                                   note
skeletal   yes          yes         attached to bone, works in pairs        about 600; levers around joints
cardiac    no           yes         heart only                              electrically self-driven
smooth     no           no          hollow organ walls, vessels, sphincters "disorderly" filaments; the uterus is smooth muscle
\`\`\`
Common traps: the uterus and bladder are smooth (not striated); the quadriceps, triceps, and gastrocnemius are striated skeletal muscle.

## Skeleton, by count
\`\`\`
division       bones   contents
axial          80      skull, 33 vertebrae (cervical, thoracic, lumbar, sacral, coccygeal), 12 rib pairs, sternum (manubrium, body, xiphoid), ossicles, hyoid
appendicular   126     pectoral girdle (scapula, clavicle), pelvic girdle, arms (humerus, radius, ulna, carpals, metacarpals, phalanges), legs (femur, patella, tibia, fibula, tarsals, metatarsals, phalanges)
total          206
\`\`\`
The hyoid anchors the tongue; the ossicles are the three tiny bones of the middle ear; the xiphoid is the tip of the sternum that CPR hand placement avoids.

## The brain as a building
\`\`\`
division    parts                          jobs
forebrain   cerebrum (frontal, parietal, occipital, temporal lobes), thalamus, hypothalamus   thinking, sensing, seeing, hearing; relaying; hormones and temperature
midbrain    tectum, tegmentum               vision and hearing relay; above the pons
hindbrain   cerebellum, pons, medulla       coordination and balance; relay; breathing, heart rate, blood pressure
brain stem  midbrain + pons + medulla       the trunk line to the spinal cord; keeps you alive
\`\`\`
Lobe jobs: frontal plans and moves, parietal senses and locates the body in space, occipital sees, temporal hears. The parietal lobe is the answer to "where is sensory information interpreted." The cerebellum's failure shows as clumsy, uncoordinated movement and tremor.

## Nerves, two splits
Central (brain and spinal cord) versus peripheral (everything else). Within the peripheral: somatic (voluntary skeletal muscle, such as walking) versus autonomic (involuntary), and within autonomic: sympathetic (fight or flight) versus parasympathetic (rest and digest). Neurons signal by action potentials and hand off at synapses.

## Worked examples
- "Which layer of the integumentary system is deepest?" Hypodermis (the stratum basale is the deepest part of the epidermis only).
- "Which muscle has filaments arranged in a disorderly manner?" Smooth.
- "Which of these is not striated: quadriceps, uterus, triceps, gastrocnemius?" Uterus.
- "Which nervous system controls walking?" Somatic.
- "Within which part of the brain is sensory information interpreted?" The cerebrum (parietal lobe).

## What to memorize
- Epidermis, dermis, hypodermis; stratum basale; sebaceous oil, sweat cooling, vitamin D.
- Skeletal striated voluntary, cardiac striated involuntary, smooth non-striated involuntary.
- 206 bones, 80 axial, 126 appendicular; the named bones.
- Forebrain, midbrain, hindbrain; lobe jobs; thalamus relay; hypothalamus to pituitary; cerebellum coordination; medulla vital functions; brain stem.
- Somatic voluntary; autonomic sympathetic and parasympathetic.`,

u1l7: `## The rest of the body, room by room
These systems are tested with one or two facts each, usually a function-to-organ match. Use the digestive tract as a conveyor belt with stations, the kidney as a filter plant, the endocrine system as a thermostat network, and the lymphatic system as the building's drainage.

## The conveyor belt
\`\`\`
station            action                                          enzyme or chemical
mouth              mastication; starch and fat digestion begin      salivary amylase, lingual lipase
esophagus          swallowing; epiglottis guards the airway         lower esophageal sphincter blocks reflux
stomach            grinding; protein digestion; storage             gastric acid pH 1.5 to 3.5, proteases; pyloric sphincter meters chyme out
duodenum           first small-intestine section; chemical digestion; absorption begins   receives bile and pancreatic enzymes
jejunum            absorbs sugars, amino acids, fatty acids
ileum              finishes absorption; reclaims bile salts
large intestine    reabsorbs water; forms solid waste               resident bacteria make vitamin K
\`\`\`
Accessory organs: liver (bile production, plasma proteins, cholesterol, glycogen storage, urea from ammonia, detoxification, clotting regulation, immune support), gallbladder (stores and concentrates bile; releases it to the duodenum), pancreas (exocrine enzymes; endocrine insulin and glucagon). Secretin and cholecystokinin are duodenal hormones, not gallbladder products.

## Drainage and defense
Interstitial fluid enters lymph capillaries, becomes lymph, is filtered in nodes (neck, armpits, groin), and returns to the veins through ducts; valves and muscle contraction move it. Lymphoid tissue: tonsils (throat), thymus (T-cell school), spleen (blood cleaner), Peyer's patches (intestine). The immune system's job is to avoid, detect, and eliminate infection. Two things it does not do: filter toxins (kidneys) and make blood cells on hormonal command (the kidney's erythropoietin does that).

## The thermostat network
\`\`\`
gland               secretes                    effect
hypothalamus        releasing hormones          commands the pituitary
pituitary           growth and control hormones master gland
thyroid             thyroxine                   metabolic rate, growth
parathyroid         parathyroid hormone         raises blood calcium; four glands on the posterior lateral lobes of the thyroid
adrenal cortex      cortisol, aldosterone       sugar, salt, stress
adrenal medulla     epinephrine                 heart rate, blood sugar, vessel size
pancreatic islets   insulin, glucagon           lower and raise blood glucose
thymus              thymosin                    immune maturation
pineal              melatonin                   daily rhythms
gonads              estrogen, progesterone, testosterone
\`\`\`
Negative feedback: the response cancels the stimulus (insulin after a meal). Positive feedback: the response amplifies the stimulus (oxytocin in labor). The pons is part of the brain stem and secretes nothing.

## The filter plant
\`\`\`
structure                   role
renal cortex                outer layer; holds the glomeruli
renal medulla               inner layer; collecting ducts
renal pelvis                funnel to the ureter
nephron (about a million)   the working unit
glomerulus in Bowman's capsule   capillary tuft where blood pressure forces filtrate out
proximal tubule             reabsorbs water, glucose, ions
distal tubule               secretes wastes and hydrogen ions (pH control)
collecting duct             final concentration; urine to the pelvis
ureter, bladder, urethra    transport, storage, exit
\`\`\`
Filtration is driven by blood pressure, not osmosis or muscle. Dialysis reproduces the membrane step.

## Reproduction, in one table
\`\`\`
male                                          female
testes: sperm and testosterone                ovaries: eggs, estrogen, progesterone
epididymis stores; vas deferens carries       fallopian tube: fertilization happens here
seminal vesicles, prostate, bulbourethral fluids   uterus: implantation and gestation
FSH drives sperm production; LH drives testosterone   vagina: receives sperm, birth canal
\`\`\`

## Blood terms
Hemoglobin is the iron protein that binds oxygen inside red cells; hematocrit is the red-cell fraction of blood volume (about 45 percent), read after spinning a capillary tube; total volume is about 5 liters. White cells: lymphocytes, neutrophils, monocytes, eosinophils, basophils; platelets clot; plasma is the water and proteins.

## How the exam asks it
- "The large intestine ___." Reabsorbs water into the body to form solid waste.
- "What does the gallbladder secrete into the GI tract?" Bile.
- "Where is the parathyroid gland?" On the lateral lobes of the thyroid, posterior aspect.
- "Insulin release falling as glucose falls is an example of?" Negative feedback.
- "Which does not produce hormones: pituitary, pons, pancreas, ovaries?" Pons.
- "The primary driver of filtration in the kidneys?" Blood pressure.
- "Which statement about hemoglobin is wrong?" That it is the ratio of red cells to blood volume (that is hematocrit).
- "Fertilization occurs in the?" Fallopian tubes.

## What to memorize
- The conveyor belt in order with its enzymes and the pH of the stomach; duodenum first, jejunum second, ileum third; large intestine reabsorbs water.
- Liver makes bile, gallbladder stores it, pancreas makes insulin and enzymes.
- Lymph nodes filter; thymus, spleen, tonsils, Peyer's patches.
- Parathyroid raises calcium on the back of the thyroid; negative feedback stabilizes.
- Cortex, medulla, pelvis; glomerulus, Bowman's capsule; blood pressure filters.
- Fallopian tube fertilization; FSH and LH.
- Hemoglobin carries, hematocrit is the fraction, five liters.`,

u2l6: `## Calculation questions are pattern questions
Every electronics calculation on the exam is one of a handful of patterns. Recognize the pattern, write the formula, substitute, and check the answer against a sanity rule (parallel resistance is smaller than any branch; divider shares add to the source; currents into a node equal currents out). The wrong options are always the result of using the wrong pattern.

## Pattern 1: energy from power and time
\`\`\`
given                        formula                    example
V and I                      P = V x I                  120 V x 0.5 A = 60 W
I and R                      P = I squared x R          10 A, 30 ohms: 100 x 30 = 3,000 W = 3 kW
V and R                      P = V squared / R          120 V, 60 ohms: 14,400 / 60 = 240 W
P and time                   E = P x t                  60 W x 8 h = 480 Wh = 0.48 kWh
\`\`\`
Sanity check: kilowatt-hours are energy; kilowatts are power. Bills are in kWh.

## Pattern 2: equivalent resistance
Series: add. Parallel: add reciprocals and invert, or product over sum for two.
\`\`\`
4, 8, 5 ohms in parallel:  1/4 + 1/8 + 1/5 = 0.25 + 0.125 + 0.2 = 0.575;  R = 1 / 0.575 = 1.74 ohms
120-ohm resistor in series with two 60-ohm resistors in parallel:  60 || 60 = 30;  30 + 120 = 150 ohms
\`\`\`
Drawing check: two components in parallel share both end nodes; in series they share exactly one node with nothing else attached.

## Pattern 3: dividers
\`\`\`
voltage divider (series)     V across Rx = V source x Rx / R total
   10 V across 1.5 k and 1 k:  V across 1 k = 10 x 1000 / 2500 = 4 V
   120 V across 60 and 100:    V across 60 = 120 x 60 / 160 = 45 V
   12 V across 10, 20, and (15 || 30 = 10): total 40; V across the parallel pair = 12 x 10 / 40 = 3 V, the same across the 30 as across the 15
current divider (parallel)   I through Rx = I total x (1/Rx) / (sum of 1/R)
   600 mA into 80, 50, 200:   1/80 + 1/50 + 1/200 = 0.0125 + 0.02 + 0.005 = 0.0375; I(50) = 600 x 0.02 / 0.0375 = 320 mA
   240 V across a 60-ohm branch: I = 240 / 60 = 4 A regardless of the other branches
\`\`\`
Sanity: the biggest resistor takes the biggest voltage in series and the smallest current in parallel.

## Pattern 4: Kirchhoff
\`\`\`
KCL at a node:   9 A in = 5 A + 2 A + I1 out  ->  I1 = 2 A
KCL with a sign: 3 + I2 + 6 = 2 + 3 + 1  ->  I2 = -3 A (3 A the other way)
KVL in a loop:   -10 + 3 + 2 + 4 + V = 0  ->  V = 1 V
\`\`\`
Nodal analysis uses KCL at nodes; mesh analysis uses KVL around loops. A negative result only means your assumed direction was backward.

## Pattern 5: internal resistance
\`\`\`
open-circuit voltage 1.58 V; loaded voltage 1.46 V with 80 ohms
I = 1.46 / 80 = 0.01825 A
r internal = (1.58 - 1.46) / 0.01825 = 6.58 ohms
\`\`\`
The lost voltage is dropped inside the battery. A tired battery has high internal resistance: full voltage on the meter, nothing under load.

## Pattern 6: the bridge
\`\`\`
balanced when R1 / R2 = R3 / R4  (no current through the center meter)
R1 = 9.8, R2 = 5.8, R3 = 1.9:  R4 = R3 x R2 / R1 = 1.9 x 5.8 / 9.8 = 1.12?  careful with which resistor is which:
   the guide's arrangement gives Rx = (R1 / R2) x R3 = (9.8 / 5.8) x 1.9 = 3.2 ohms
\`\`\`
The lesson: write the ratio from the diagram, solve for the unknown, and check that the two side ratios match. Strain gauges and thermistors sit in bridges so a tiny resistance change becomes a measurable voltage.

## Pattern 7: op-amp gain
Inverting: gain = R feedback / R input (output inverted). Gain 9 with R in = 5 kilohms means R f = 45 kilohms. Non-inverting: 1 + R f / R in. A drifted feedback resistor changes the gain, which shows up as a wrong calibration.

## How the exam asks it
- "A bulb draws 500 mA at 120 V for 8 hours; energy used?" 0.48 kWh.
- "Power with 10 A through 30 ohms?" 3 kW.
- "Voltage across the 60-ohm resistor in series with 100 ohms on 120 V?" 45 V.
- "Current through the 50-ohm branch of 80, 50, 200 with 600 mA?" 320 mA.
- "I1 when 9 A enters and 5 A and 2 A leave?" 2 A.
- "Internal resistance from 1.58 V dropping to 1.46 V into 80 ohms?" 6.58 ohms.
- "R2 for gain 9 with R1 = 5 k?" 45 k.

## What to memorize
- P = VI = I squared R = V squared / R; E = P x t; kWh.
- Series adds; parallel reciprocals; two in parallel: product over sum.
- Voltage divider proportional to R; current divider inversely proportional to R.
- KCL: in equals out; KVL: loop sums to zero.
- Internal resistance = voltage drop / load current.
- Bridge balance: equal ratios. Inverting gain = Rf / Rin.`,

u2l7: `## The power grid to the circuit board
Follow the electricity from the plant to the op-amp. On the way it is transformed, split, described by three kinds of power, opposed by reactance, stored in batteries, and regulated by switching circuits. The exam takes one snapshot at each stage.

## Distribution
\`\`\`
stage                 voltage            why
generator             a few kV           practical to generate
step-up transformer   hundreds of kV     high voltage means low current means low line loss
step-down at stations tens of kV, then hundreds of V   safe to distribute
building service      240 V split-phase  two 120 V legs opposite in phase, neutral grounded in the middle
branch circuits       120 V (or 240 V line to line) at 60 Hz
\`\`\`
Codes: NFPA 70 is the National Electrical Code (building wiring); IEEE's NESC covers utility lines; NFPA 99 covers health care facilities. Transformer ratio: V primary / V secondary = N primary / N secondary. To step 240 V up to 6,000 V, the ratio is 240 / 6,000 = 0.04 (primary to secondary), meaning 25 secondary turns for every primary turn.

## Three powers, one triangle
\`\`\`
        S (apparent, VA)
       /|
      / | Q (reactive, VAR)
     /  |
    /___|
   P (true, W)
S squared = P squared + Q squared;  power factor = P / S
180 W and 240 VAR:  S = sqrt(32,400 + 57,600) = sqrt(90,000) = 300 VA;  power factor 0.6
\`\`\`
Watts do work and make heat; VARs circulate in inductors and capacitors; VA is what the wires and the UPS must carry. A 1,000 VA UPS feeding a 0.6 power factor load delivers only 600 W.

## Reactance to impedance
\`\`\`
component   reactance formula        60 Hz example                          behavior
inductor    XL = 2 pi f L            40 mH: 2 x 3.1416 x 60 x 0.04 = 15 ohms   opposes change in current; blocks high frequency
capacitor   XC = 1 / (2 pi f C)      10 uF: 1 / (377 x 0.00001) = 265 ohms    opposes change in voltage; blocks DC
impedance   Z = R + jX               ideal 30 mH: 0 + 11.3j ohms              j marks the 90-degree phase shift
\`\`\`
Angular frequency omega = 2 pi f = 377 rad/s at 60 Hz. Inductance is in henries (mH in practice); capacitance in farads (uF in practice). Filters by what they pass: low-pass, high-pass, band-pass, band-stop (a notch is a narrow band-stop).

## Passive, active, transducer
\`\`\`
passive     resistor, capacitor, inductor, memristor, thermistor   no gain; may store energy
active      transistor, op-amp, IC, SCR                             needs supply; provides gain or control
sensor      pressure, temperature, light, sound  ->  electrical      the input side of every monitor
actuator    electrical  ->  motion, heat, light, sound               pumps, heaters, displays, speakers
\`\`\`
The piezoelectric crystal is the exam's favorite two-way transducer: squeeze it and it makes charge (sensor), charge it and it moves (actuator). Photoluminescence (light from radiation) and the pyroelectric effect (voltage from heating) are the distractors.

## Battery datasheet
\`\`\`
specification         meaning                                       why it matters
voltage per cell      set by chemistry                              cells in series reach the working voltage
capacity              Ah or Wh                                      runtime
energy density        energy per kilogram                           decides the weight of the pack
internal resistance   ohms inside the cell; rises with age          sag under load; heat
shelf life            charge retained while unused                  spares on the shelf
discharge curve       voltage versus state of charge                flat curve keeps electronics happy
cycle life            charges before capacity drops                 replacement schedule
C-rate                current relative to capacity (1 C empties in 1 h)   60 kWh at 0.5 C charges at 30 kW
\`\`\`

## Regulators
\`\`\`
type        how                                          traits                      failure signature
linear      transistor drops the excess as heat          simple, quiet, inefficient  runs hot; drifts
switching   chops input on and off, filters the average  efficient, light, noisy     switch shorted: full input passes through; switch open: zero output
\`\`\`
Test: measure the regulator's input and output pins against ground and compare with the rating. A GFCI, by contrast, is a safety device that opens the circuit when return current falls short of outgoing current.

## How the exam asks it
- "Which system sends 120 V across two lines in opposite phase with a central earth line?" Split-phase.
- "Winding ratio to step 240 V to 6,000 V?" 0.04.
- "Apparent power from 180 W and 240 VAR?" 300 VA.
- "Reactance of 40 mH at 60 Hz?" About 15 ohms. "Impedance of an ideal 30 mH inductor at 60 Hz?" 11.31j ohms.
- "Which is an active component: capacitor, inductor, thermistor, transistor?" Transistor.
- "Which battery characteristic most affects weight?" Energy density.
- "Rapid on-off signals to provide consistent power?" A switching power supply.

## What to memorize
- Step-up to transmit, step-down to use; split-phase 120/240 at 60 Hz; NEC is NFPA 70; NESC is IEEE.
- S squared = P squared + Q squared; W, VAR, VA; power factor.
- XL = 2 pi f L; XC = 1 / (2 pi f C); Z = R + jX; henries, farads.
- Passive versus active; sensor versus actuator; piezoelectric both.
- Battery specs by name; C-rate times capacity.
- Switching regulator duty cycle; shorted gives full input, open gives nothing.`,

u3l6: `## The code as a set of distances and counts
NFPA 99 reads like a rulebook because it is one. The exam pulls out the countable rules: feet of separation, numbers of receptacles, percent of rating, meters of cable. Learn them as a table and the questions become lookups.

## Gas cylinder storage
\`\`\`
rule                                            value
oxidizers separated from flammables             20 ft; 5 ft if sprinklered; none inside a compliant cabinet
smoking and ignition sources                    none inside; 20 ft from outdoor storage
storage temperature                             about minus 7 to 52 C (20 to 125 F)
condition                                       unwrapped, secured upright in racks or stands, not in tight enclosures
large quantities (over 85 cubic meters)         separate noncombustible, lockable, secured space
8.5 to 85 cubic meters of nonflammable gas      secured, noncombustible or limited-combustible space
in use in a smoke compartment                   no separate enclosure required
door signage                                    warning when positive-pressure gases other than oxygen or air are inside
\`\`\`
Behind every line is the same idea: oxidizers feed fires, cylinders are missiles when they fall or overheat, and nobody should be surprised by what is behind a door.

## Medical gas and vacuum systems
Cylinders certified by DOT, Transport Canada, or ASME; gas-specific outlet connections with no adapters (the pin index and DISS systems); accurate labels and verified contents; secured storage; redundant supply and piping so no single fault stops the flow; alarms; labeled zone shutoff valves; pressure and vacuum gauges; an inventory and periodic inspection by qualified people. The rules apply wherever a failure could kill, which includes anesthesia, deep sedation, and the patient care vicinity.

## The patient room, wired
\`\`\`
item                                     rule
receptacles per general patient bed      at least 8 (critical care more)
type                                     non-locking (a cord must pull free), tamper-resistant in patient care spaces
isolated-ground receptacles              prohibited in the patient care vicinity
bathrooms                                no minimum
operating rooms                          single, duplex, or quadruplex; insulated ground contacts; 3- or 4-pole; locking or not
household electronics                    outside the vicinity, or double insulated; inspected before use
wet procedure locations                  isolated power or GFCI
\`\`\`
Why isolated-ground receptacles are banned: they connect the outlet's ground to a separate path back to the panel, which breaks the equipotential grounding that keeps every metal surface near the patient at the same voltage.

## Cords and taps
\`\`\`
rule                                                    reason
no three-to-two prong adapters                           they open the safety ground
strain relief at both ends, always                       a cord that flexes at the plug breaks conductors
no tinned stranded ends under screw terminals            solder cold-flows and the joint loosens and heats
power taps: rated, secured, load at most 75 percent of rating   overload and heat; AWG 10 at 35 A means 26 A maximum
no daisy-chained taps, no extension cords for patient care equipment
detachable cords allowed where disconnection is not a hazard or a retainer is used
portable patient-care equipment: touch current at most 500 microamps; chassis to ground pin at most 0.5 ohm
\`\`\`
A monitor with 0.5 mA (500 microamps) of chassis leakage is at the portable limit; the guide's example calls that a fail for portable equipment while within the fixed-equipment allowance, so read the question for "portable."

## Nurse call, telecom rooms, and two definitions
Nurse call systems carry medical device alarms, staff emergency calls, code calls, and patient requests; every call is announced audibly and visually where required, may be forwarded to pagers and phones, and is cancelled at its source. Telecommunications rooms: no data outlet more than 90 meters of cable away, at least one per floor, each serving up to 20,000 square feet, containing only equipment that supports the room, and, where disasters are common, interior rooms without exterior walls. Touch current is chassis leakage reachable by a person that flows by a path other than the protective ground. Clean agents are extinguishants that are nonconductive, gaseous or volatile, and residue-free (nitrogen, carbon dioxide, noble gases, halocarbons), used where water would ruin electronics.

## How the exam asks it
- "Which is NOT per standard for medical gas storage?" Wrapped cylinders in secure storage (they must be unwrapped).
- "Which describes electrical requirements for healthcare facilities?" A minimum of eight non-locking outlets in a patient room.
- "Which is true of OR outlets?" They may be single, duplex, or quadruplex.
- "Which complies with NFPA 99?" A power cable with normal strain relief on a frequently unplugged device.
- "Which violates NFPA 99?" Tinned stranded ends under a screw terminal (and a 27 A load on a 35 A tap exceeds 75 percent).
- "Which statement is false?" That household electronics need grounding conductors (double insulated ones are allowed outside the vicinity).

## What to memorize
- 20 ft / 5 ft / cabinet; 20 ft smoking; minus 7 to 52 C; unwrapped; secured; not enclosed tightly.
- DOT/TC/ASME; gas-specific outlets; redundancy; alarms; zone valves.
- Eight non-locking tamper-resistant receptacles; no isolated-ground in the vicinity; OR duplex or quadruplex with insulated grounds; double-insulated household devices.
- No cheaters, no tinned ends, strain relief; 75 percent on taps; 500 microamps and 0.5 ohm portable.
- Nurse call carries alarms and codes; telecom rooms 90 m, one per floor, 20,000 sq ft; touch current; clean agents.`,

u3l7: `## Paperwork the exam treats as safety
Chemical labels, data sheets, exposure limits, waste rules, and the alphabet of accrediting bodies are the "public safety" questions that are not about electricity. They test reading comprehension of standards, so learn what each document contains and who issues it.

## HazCom and GHS, side by side
\`\`\`
                   Hazard Communication Standard          Globally Harmonized System
issued by          OSHA (29 CFR 1910.1200)                United Nations
purpose            tell US workers about chemical hazards  one worldwide format for labels, pictograms, SDSs
requires           labels, SDS access, training, records  classification criteria, 9 pictograms, 2 signal words, 16-section SDS
relationship       HazCom adopted GHS; US workplaces have used GHS-format SDSs since 2015
\`\`\`

## The SDS in order
1 identification, 2 hazards, 3 composition, 4 first aid, 5 fire fighting, 6 accidental release, 7 handling and storage, 8 exposure controls and PPE, 9 physical and chemical properties, 10 stability and reactivity, 11 toxicology, 12 ecology, 13 disposal, 14 transport, 15 regulatory, 16 other. It is written by the manufacturer, includes their contact information and handling procedures, and must list known human carcinogenicity; it does not describe how to synthesize the chemical.

## Numbers of harm
\`\`\`
term    stands for                    who            meaning
LD50    lethal dose, 50 percent        toxicology     dose (per kg body mass, by route) that kills half of test subjects
LC50    lethal concentration, 50 percent   toxicology  airborne concentration that kills half
PEL     permissible exposure limit     OSHA           the legal maximum, time-weighted over a shift
TLV     threshold limit value          ACGIH          recommended limit
REL     recommended exposure limit     NIOSH          recommended, usually lower than the PEL
STEL    short-term exposure limit      OSHA/ACGIH     ceiling for a 15-minute exposure, not an average
\`\`\`
Carcinogen lists come from the NTP, IARC, and OSHA. PPE from section 8: chemical protective clothing, vented splash goggles, a face shield over goggles for big volumes, permeability-rated gloves, respirators when hoods are not enough, aprons or suits, closed-toed shoes.

## Reading a GHS label
\`\`\`
element                  example
product identifier       isopropyl alcohol 70%
supplier                 name and US contact
pictograms               flame; exclamation mark
signal word              Danger (severe) or Warning (lesser); only these two exist
hazard statements        highly flammable liquid and vapor; causes eye irritation
precautionary statements keep away from heat; wear eye protection
\`\`\`
Pictograms: health hazard, flame (flammable, pyrophoric, self-heating), exclamation mark (irritant), gas cylinder, flame over circle (oxidizer), corrosion, exploding bomb, environment, skull and crossbones. Pyrophoric means ignites in air within five minutes. There is no reducer pictogram, and secondary containers filled at work carry the same label elements.

## Blood, waste, and precaution systems
\`\`\`
system                          scope                                            key rule
universal precautions (1980s)   blood and blood-contaminated fluids               gloves, eye protection, bleach cleanup, bagged waste; not sweat, tears, nasal secretions, urine
standard precautions (CDC 1996) all body fluids; adds body substance isolation     hand hygiene, gloves for fluids, face protection for splashes
transmission-based              contact, droplet, airborne                       airborne = N95 and negative pressure; droplet = surgical mask; contact = gown and gloves
\`\`\`
Regulated waste under OSHA's Bloodborne Pathogens Standard is liquid or free-flowing blood and items saturated with it: sealed and hauled by a licensed medical waste service. Dried blood on gauze or dressings: sealed in a plastic bag, regular trash. Contaminated broken glass: tools, not hands. Sharps: labeled puncture-proof containers. Laboratory practices: annual biological risk assessment for biosafety level, no mouth pipetting, no food or contact lenses in the lab, retractable needles, aerosol control, decontaminate before disposal, packaged infectious waste, pest control, training and immunizations, PPE, eyewash station, hands-free sinks. Clean utility and dirty utility rooms are separate; lab coats are not gowns. Splash hazard PPE: gloves, gown, mask, face shield.

## The bodies and what they do
\`\`\`
body                      does                                                            does not
The Joint Commission      accredits and certifies by survey; National Patient Safety Goals; links quality and risk   set financial benefits
DNV                       accredits hospitals (NIAHO), integrating CMS conditions with ISO 9001; annual surveys
ISO 9000 / 9001           quality management standards; plan-do-check-act; risk-based thinking
CMS                       Medicare, Medicaid, CHIP; regulates human lab testing; yearly core measure sets; fights fraud   accredit facilities or labs
CAP                       accredits clinical laboratories under CMS authority; inspects every two years plus surprise visits   sell learning materials; teach pathology as a college
SMDA (1990, amended 1992) extends FDA medical device reporting to user facilities: deaths to FDA and manufacturer, serious injuries to the manufacturer; annual summaries
\`\`\`

## How the exam asks it
- "CMS is primarily responsible for?" Overseeing healthcare insurance for small business and individuals (and running Medicare and Medicaid), not accreditation or ISO standards.
- "Which is NOT the Joint Commission's domain?" Determining financial benefits.
- "Which is true of CAP?" A nonprofit accrediting organization for medical laboratories.
- "Which act requires reporting adverse events involving medical equipment?" SMDA.
- "Which is mandatory under GHS?" Human carcinogenicity labeling, pyrophoric classification, consistent SDS terminology, handling and storage procedures; animal-test carcinogenicity labeling is not mandatory.
- "Which is most correct about exposure limits?" PELs are the maximum legal limits.
- "Which is false about bloodborne pathogens?" That dried-blood waste goes directly in the trash (it must be sealed first).

## What to memorize
- HazCom adopts GHS; sixteen SDS sections in order.
- LD50, LC50, PEL (legal), TLV, REL, STEL (short-term); NTP and IARC.
- Label elements; Danger and Warning; nine pictograms; pyrophoric; no reducer.
- Universal versus standard versus transmission-based; regulated waste; dried blood sealed; glass with tools; no mouth pipetting; eyewash; clean versus dirty utility.
- Joint Commission NPSGs; DNV NIAHO ISO 9001 PDCA; CMS CHIP and core measures; CAP labs; SMDA reporting.`,

u4l7: `## The manual cuff and the named rhythms
Automated monitors do most measuring, but the exam still asks how the manual device works, what each arrhythmia looks like, and exactly what each test instrument measures. These are precision-vocabulary questions.

## Sphygmomanometer anatomy
\`\`\`
part               job                                       fault
cuff and bladder   occludes the brachial artery              leak (reads low), wrong size
inflation bulb     pumps the cuff                            cracked (leak)
valve              controlled deflation                      sticks, leaks
manometer          reads cuff pressure (mercury, aneroid, electronic)   does not return to zero: zeroing screw or recalibration
stethoscope        hears Korotkoff sounds (manual)          replaced by a microphone in automated auscultatory units
\`\`\`
Procedure: inflate until the radial pulse disappears, deflate slowly, first sound is systolic, disappearance is diastolic. Error table: unstable readings mean movement or a misplaced cuff (level with the heart); high readings mean the cuff is below the heart or the patient is not resting; low readings mean the cuff is above the heart or, most often, an air leak. Invasive pressure is the method that can follow a hypotensive patient continuously and read at very low pressures.

## Rhythms, drawn in words
\`\`\`
rhythm                     P waves          QRS          rate and rhythm                       action
sinus tachycardia          normal           narrow       fast, regular
supraventricular (atrial) tachycardia   hidden or abnormal   narrow   rapid, consistent, often over 150   vagal maneuvers, drugs, synchronized cardioversion if unstable
atrial fibrillation        none; quivering  narrow       irregularly irregular                 rate control; synchronized cardioversion
ventricular tachycardia    none visible     WIDE         rapid, regular                        cardioversion or defibrillation if pulseless
ventricular fibrillation   none             none         chaotic, irregular spikes             defibrillate now
asystole                   none             none         flat                                  CPR; check the leads
\`\`\`
The P-to-R gap is the AV delay; the S-to-T gap is full ventricular depolarization.

## Twelve leads from ten electrodes
Four limb electrodes (RA, LA, LL, RL as ground) and six chest electrodes. The three bipolar limb leads use pairs; the three augmented leads use one limb as positive against the other two; the six chest leads are unipolar. aVF's positive pole is the left leg, so it views the inferior wall. Colors: AHA white, black, green, red, brown; IEC red, yellow, black (RL), green (LL). An electrocardiograph's thermal head is checked by printing letters or diagonals; paper speeds of 10, 12.5, 25, and 50 mm/s test the drive.

## EEG landmarks
\`\`\`
10-20 system: nasion (front, between the eyes) to inion (back of the skull); electrodes at 10 and 20 percent steps of that distance and of the ear-to-ear distance
bands: beta above 13 Hz awake and active; alpha 8 to 13 relaxed; theta 4 to 8 drowsy; delta under 4 deep sleep
front end: differential amplifier removes what both electrodes share
\`\`\`

## Respiration, four ways
\`\`\`
method              principle                                   note
chest impedance     ECG electrodes; more air, higher impedance   most common; fooled by motion and cardiac artifact
respiratory belts   inductance or pressure changes with expansion   sleep studies
airflow sampling    thermistor or pressure at the nose; capnograph  the only method that proves gas is moving
magnetometry        magnetic field change with chest motion      research
\`\`\`

## Pulse oximetry numbers
Red about 650 to 660 nm, infrared about 805 to 940 nm; oxyhemoglobin absorbs more infrared, deoxygenated hemoglobin more red; the ratio at the pulse gives saturation. Degrades with dark nail polish, carbon monoxide (reads falsely high), ambient light, motion, and low perfusion; high perfusion helps. A unit that switches off mid-reading has a low battery.

## Test equipment, precisely
\`\`\`
instrument                  measures                                                  does not
ventilator analyzer         flow, pressure, volume, oxygen concentration, breath detection threshold; lung simulation   CO2 concentration
electrical safety analyzer  ground resistance, chassis and lead leakage, touch current with a body-impedance model   network faults
defibrillator analyzer      delivered energy, voltage, current, charge time, sync delay, pacer output into a load   the defibrillator's internal impedance
ESU analyzer                RMS power and current into loads, crest factor, peak-to-peak voltage, RF leakage, REM thresholds   handpiece continuity, chassis leakage
physiological simulator     ECG, arrhythmias, IBP and NIBP, respiration, SpO2, temperature, fetal   current
DVM                         voltage; draws a little current; auto or manual range      current or resistance
DMM                         voltage, current, resistance, continuity (tone at low resistance, unpowered), frequency, capacitance
\`\`\`

## How the exam asks it
- "Which is unique to invasive blood pressure?" Continuous monitoring of hypotensive pressures.
- "Sphygmomanometer always reads high; most appropriate check?" Run it on an NIBP simulator (a leak would read low).
- "Which device is used in manual auscultation?" The manometer (Korotkoff sounds are what you hear, not a device).
- "Atrial tachycardia on the ECG?" Rapid, consistent waves. "Wide QRS?" Ventricular tachycardia.
- "Which lead views the inferior wall?" aVF. "Electrodes for a 12-lead?" Ten. "AHA limb colors?" RA white, LA black, RL green, LL red.
- "Which parameters does a ventilator analyzer measure?" Flow, oxygen concentration, pressure, breath detection threshold.
- "Which is NOT simulated by a physiological simulator?" Current.
- "Continuity mode of a DMM measures?" Total resistance between two points.
- "Which test does an ESU analyzer perform?" RMS power test.

## What to memorize
- Sphygmomanometer parts; leak reads low; simulator over another patient.
- The rhythm table; aVF inferior; ten electrodes; AHA and IEC colors; print head test.
- Nasion to inion; beta awake.
- Chest impedance most common.
- 650 to 660 and 805 to 940 nm.
- Each analyzer's list and its "does not."`,

u5l5: `## Six ways to see inside
Every imaging modality is a physics trick: bounce sound, shoot X-rays, spin X-rays, flip magnets, or catch gamma rays. The exam asks which trick each machine uses and what makes it dangerous. Ultrasound is the one a CBET repairs; the others belong to imaging specialists, but their principles are fair game.

## The modalities compared
\`\`\`
modality      energy               how the image forms                                    radiation?   main hazard
ultrasound    sound 2 to 15 MHz    piezoelectric crystal sends pulses, echoes return; Doppler shift shows flow   none       none (gel and hygiene)
radiography   X-rays               electrons from a tungsten filament hit a tungsten anode; tissues absorb by density; film or digital detector   ionizing   dose; shielded rooms; lead aprons
fluoroscopy   continuous X-rays    live image through an image intensifier or flat panel; contrast agents move in real time   ionizing   continuous dose to patient and staff
CT            rotating X-rays      tube and detector arc spin around the table; computer reconstructs slices, stacks to 3D   ionizing   higher dose than plain films
MRI           magnet + radio       aligns hydrogen spins; RF pulses; realignment signals detected; tissues differ by relaxation   none       projectiles, implants and pacemakers, RF heat, quench
PET           gamma from tracer    FDG emits positrons; annihilation makes two opposite gamma photons; ring detectors time them   ionizing (tracer)   radioactive patient and waste
\`\`\`

## Ultrasound, the working parts
The transducer's piezoelectric elements deform when driven and generate charge when struck by echoes, so one element transmits and receives. Frequency trades resolution against depth. Gel excludes air; without it the beam scatters at the skin. Doppler: blood moving toward the transducer compresses the returning wave, raising its frequency and pitch; away lowers it. Faults: dropout bands mean dead elements; blurry noisy images mean a cracked crystal (check continuity), excess drive voltage from a bad regulator, or too little gel. A phantom checks resolution and depth accuracy.

## X-ray basics a technician should know
Kilovoltage sets penetration; milliamp-seconds set quantity; the anode is angled to aim the beam. Radiopaque bone and metal appear white; radiolucent air and fat appear dark. Exposure control: time, distance (inverse square), shielding; ALARA; dosimeters; NFPA 99 requires labeled radiation rooms and lead-lined walls. Fluoroscopy adds an intensifier because the continuous beam must be kept faint; foot-switch time is the dose driver. CT rotates the same hardware and computes slices; contrast is injected or swallowed.

## MRI, the magnet room
Atoms with a nonzero spin (hydrogen, carbon-13, oxygen-17, sodium-23, phosphorus-31) align in the field; RF pulses tip them; as they relax they emit signals with tissue-specific timing. No ionizing radiation, but the field is always on. Zones I to IV; ferromagnetic screening of every person and object; MR Safe, MR Conditional, MR Unsafe labels; pacemakers and many implants are contraindicated or conditional; a quench boils off helium and needs venting.

## PET, the tracer
Fluorine-18 fluorodeoxyglucose is a sugar analog that tumors consume greedily. Each positron travels a millimeter, meets an electron, and both vanish into two gamma photons flying opposite ways; detectors that catch both within nanoseconds draw the line between them. PET plus CT gives function on anatomy. The patient is radioactive for hours; waste is handled as radioactive.

## How the exam asks it
- "Ultrasound transducers convert pressure into charge by?" Piezoelectricity.
- "Blood moving toward the transducer produces?" A higher pitch.
- "Which term describes live footage of interior tissues?" Fluoroscopy.
- "By which method does MRI form images?" Observing the realignment of atoms.
- "Which radiation is used in PET scanning?" Gamma.
- "Which electromagnetic wave has the highest frequency: UV, X-ray, radio, infrared?" X-ray.
- "A handheld ultrasound gives blurry images; how do you find the cause?" Check the crystal's integrity and continuity, then the gel technique.

## What to memorize
- Ultrasound piezoelectric, 2 to 15 MHz, higher frequency better resolution, Doppler toward equals higher pitch, gel.
- X-ray: tungsten filament and anode, kV, radiopaque white; fluoroscopy live with an intensifier; CT rotating slices.
- MRI magnet, RF, realignment, no ionizing radiation, projectiles and pacemakers, quench.
- PET: FDG, positron annihilation, two gamma photons.`,

u5l6: `## Small devices, specific questions
The diagnostic and laboratory items are the ones most likely to be asked as "what part is missing from this list" or "what does this device measure." Build a parts list and a principle for each.

## Parts lists
\`\`\`
device               parts                                                      principle
otoscope             handle, head, lamp with collar, magnifying lens, specula, insufflation port   illuminated magnifier for the ear canal; no microphone
ophthalmoscope       handle, lens disc, filters and apertures, mirror, condensing lens, lamp   view the fundus (retina); lens wipes, not alcohol
audiometer           tone generator, attenuator, headphones, bone vibrator, response button   thresholds in dB HL by frequency; audiogram
uroflow meter        funnel, beaker, pressure or weight transducer, wireless link   flow rate and volume of voiding; about 3 m wireless range
tympanic thermometer probe with cover, shutter, thermopile, lens, trigger   infrared from the eardrum; 30 min to settle; 10 to 40 C ambient
endoscope            insertion tube, camera or fiber-optic bundle, light source, insufflation, irrigation, suction, steering   direct viewing of tracts; leak test before immersion
\`\`\`

## Hearing tests decoded
Air conduction (headphones) tests outer ear, middle ear, inner ear, and nerve together. Bone conduction (vibrator on the mastoid) skips the outer and middle ear. If both are poor, the loss is sensorineural (inner ear or nerve); if air is poor but bone is normal, the loss is conductive (wax, fluid, ossicles). The audiometer makes frequencies at set levels; it does not measure frequencies. Calibrate against a sound level meter with a coupler; test in a quiet booth.

## Blood gas electrodes
\`\`\`
measurement   electrode       construction                                                   signal
pO2           Clark           platinum cathode, silver anode, oxygen-permeable membrane      current proportional to oxygen
pH            glass           glass membrane between reference solution and sample            voltage proportional to pH difference
pCO2          Severinghaus    glass pH electrode behind a CO2-permeable membrane in bicarbonate   CO2 changes the bicarbonate pH; voltage read
\`\`\`
Operating conditions: the sample block must be at temperature (a "too cold" refusal that persists after warming means the thermistor); portable units need charged batteries and a working charger; the barcode window must be clean and unscratched to read cartridges.

## Spectrophotometer path
\`\`\`
lamp (tungsten for visible, deuterium for UV) -> monochromator (prism or grating and slit) -> cuvette (glass or plastic for visible, quartz for UV) -> detector
read the blank first (solvent only) so the cuvette and solvent cancel; the remainder is the sample's absorbance
sweep wavelengths to get a spectrum; compare with known spectra to identify, or use one wavelength to quantify
\`\`\`
Faults: no lamp (cable and circuit, then lamp); weak beam (lamp position, mirror, motor); low energy after blanking (obstruction in the chamber, or a non-quartz cuvette in UV); intermittent at every wavelength (the power cable, since a bad photosensor gives nothing, an old deuterium lamp fails at UV only, and a dead motor cannot change wavelengths).

## Centrifuges and the hematocrit
Relative centrifugal force grows with the square of speed and with radius. A hematocrit centrifuge packs red cells in capillary tubes at roughly 10,000 to 15,000 g in a few minutes; the packed column length over the total gives the hematocrit. Balance opposing tubes; the lid interlock and thermostat protect samples and users.

## Cutting and warming
Microtome: paraffin-embedded tissue on a rotary head against a fixed blade; section thickness depends on a securely clamped, sharp blade at the right clearance angle, a cool block, a steady slow stroke, and a wax-free blade. A cryostat is the same machine in a freezer for frozen sections during surgery; frost comes from drafts, an open chamber, or breath; splintering means too cold. A water bath warms below 100 C, often with a stirrer or agitating rack, and doubles as an incubator for microbial samples; not heating means a setpoint or high-limit below ambient or a low-water cutout.

## How the exam asks it
- "What is examined with an ophthalmoscope?" The fundus.
- "Which is NOT a component of an otoscope?" A microphone.
- "Which is NOT measured by an audiometer?" Sound frequencies (it makes them).
- "What do uroflow meters analyze?" Bladder emptying rate.
- "A tympanic thermometer reads consistently low across attempts; most probable cause?" A cracked lens.
- "Which is NOT a feature of flexible endoscopes?" Wireless transmission.
- "Which electrode measures pCO2?" Severinghaus.
- "What does a spectrophotometer measure?" Absorption.
- "Which device amplifies a microbial sample?" A water bath (incubation).
- "Purpose of a microtome?" Sectioning samples.
- "RCF of hematocrit centrifuges?" About 10,000.

## What to memorize
- Otoscope parts (no microphone); ophthalmoscope views the fundus; audiogram, air versus bone, sensorineural versus conductive; uroflow measures voiding rate, 3 m; tympanic thermopile, covers, 30 minutes, 10 to 40 C, cracked lens low; endoscope fiber-optics, light, insufflation, suction.
- Clark O2, glass pH, Severinghaus CO2; thermistor, battery, barcode window.
- Spectrophotometer: absorbance, blank, deuterium, quartz for UV; intermittent means the cable.
- Hematocrit about 10,000 g; microtome paraffin, clamp, edge, clearance angle, wax; cryostat frost and splinter; water bath incubates.`,

u5l7: `## Pumps and therapy, at the settings level
The first pass at infusion and therapeutic devices taught what each does. The exam also asks which mechanism, which setting prevents harm, and which fault produces which message. Those are the facts here.

## Infusion mechanisms and modes
\`\`\`
device                mechanism                          key setting or limit                          fault signatures
parenteral (TPN) pump peristaltic or cassette; standard IV pump   rate, volume, occlusion pressure         standard IV pump alarms
enteral feeding pump  rotary peristaltic on wide tubing  dose limit; enteral-only connector             low flow: empty bag, occlusion, drip chamber seated wrong or coated; no set: seating, wrong set, bright light on the detector
syringe pump          lead screw on a standard syringe   syringe diameter and brand                     runs past empty: sensor, size setting, multi-phase program; low voltage stalls, not overruns
PCA pump              syringe or cassette with pendant   bolus, lockout interval, maximum dose, background rate; locked; logged   ignores requests: settings; high pressure: occlusion; check settings: door locked before setup complete
pressure infuser      external bag squeeze, no pump      pressure gauge                                 not an infusion pump
\`\`\`
Modes: continuous (steady), intermittent (programmed high-rate periods with low-rate keep-open between, for vein-irritating drugs), bolus (a volume over minutes), secondary or piggyback (a second bag then back to the primary). Syringe pumps trade small volume for fine control; they are not for long-term high-volume therapy.

## Infant warmers, two designs
\`\`\`
                 radiant warmer                                   incubator
structure        open bed, overhead heater, low walls, drawers    enclosed hood with hatches
control          skin sensor on the infant (servo)                air, humidity, oxygen; skin mode optional
advantage        free access for procedures and resuscitation     stable microclimate for infants needing less handling
drawback         drafts cool the infant; radiant heat dehydrates  access requires opening ports
faults           fluctuating or wrong temperature: sensor attachment, plug, failed sensor; blocked heater path; power: cord, fuse, board
\`\`\`
Radiant heating warms the space around the bed for access; it is not targeted warming, and it always requires a skin temperature probe.

## Ultrasound therapy
A 1 to 3 MHz transducer converts drive voltage into vibration; tissue absorbs it as deep heat, improving blood flow; focused units create tumor-killing heat. Requires gel and motion. No head detected: the head is too cold for its sensor or poorly connected (warm it in the hand). Overheating shutdown: too little gel or a stationary head. Slow warming: insufficient drive voltage; a cracked crystal or disconnected head gives no output at all.

## Hypo/hyperthermia units
Water heated or chilled, pumped through a blanket, regulated to a patient probe. Requirements for effective heating: flow of about 1 liter per minute or more, correct maximum-temperature limits, heating that rises within about ten minutes, and power reaching an element of the right resistance. Neither heating nor cooling well, with no leaks or puddles: insufficient flow. Dark display: connections and control panel. Dead pump: board voltages, then the pump.

## Aspirators
\`\`\`
part                      failure                                   result
vacuum pump               fuse blown, overheated from an obstruction, worn   will not run
pressure gauge/regulator  wrong setting                             weak or excessive suction
tubing and connections    loose, cracked                            weak suction
collection container      cap loose, cracked, or full (float closes)   weak or no suction
hydrophobic bacterial filter   clogged                              weakening suction, eventually none
\`\`\`
Pulmonary aspirators clear airway mucus; gastric aspirators pump the stomach; surgical units remove blood, fluid, and smoke. Gradually weakening suction is a leak or a clogging filter; a blown fuse stops everything at once.

## SCDs and bilirubin lights
Sequential compression: chambers inflate from distal (ankle) to proximal (thigh), hold seconds, deflate about a minute, repeat; the pressure gradient pushes venous blood toward the heart. Low pressure: leaks in sleeve, tubing, or internal tubing; high pressure: sleeve too tight; valve feedback error: wiring and solenoids. Bilirubin phototherapy: light of roughly 360 to 520 nm, most effective in the blue-green region around 450 to 510 nm; more effective with a brighter bulb, a closer lamp, and more exposed skin; a 630 to 720 nm bulb is useless. Faults: will not relight (bulb too hot), never lights (bulb then ballast), dim (lens then bulb or ballast), quits hot (fan filter, fans, thermistor).

## How the exam asks it
- "Which symptom would NOT cause an enteral pump low-flow error?" Excessive ambient light at the detector (that causes "no set").
- "Which infusion device most commonly uses peristalsis?" Feeding pumps.
- "Which is NOT an advantage of syringe pumps?" High infusion volumes.
- "A PCA pump gives the basal rate but no requested doses; first step?" Examine the pump settings.
- "What is intermittent infusion?" High-rate periods separated by low-rate intervals.
- "A syringe pump keeps running after the syringe empties; which is NOT a cause?" Insufficient voltage.
- "Purpose of radiant heating in infant warmers?" Evenly heats the open-air space for access.
- "An ultrasound therapy unit warms tissue slowly; cause?" Insufficient voltage.
- "Hypo/hyperthermia unit heats and cools poorly, no leaks; cause?" Insufficient flow rate.
- "Aspirator suction weakened gradually; which is NOT probable?" A blown fuse.
- "Normal SCD function?" Cuffs inflate in series distal to proximal, then deflate for a rest period.
- "Which would NOT improve bilirubin phototherapy?" A 630 to 720 nm bulb.

## What to memorize
- Enteral peristaltic; low flow versus no set; syringe diameter; PCA bolus, lockout, maximum, settings first; intermittent mode; pressure infusers are not pumps.
- Radiant open with skin sensor, dehydrates; incubator enclosed.
- Ultrasound therapy: deep heat; cold head; voltage.
- Hypo/hyperthermia: 1 L/min.
- Aspirator parts and the fade-versus-stop distinction.
- SCD distal to proximal; bilirubin 360 to 520 nm blue-green.`,

u6l5: `## Circuits you can draw
The heart-lung machine and the dialysis machine are plumbing diagrams; pacing routes, the anesthesia gas path, ESU waveforms, lasers, and sterilizers are lists with an order. Draw each once and the exam's "which comes after" and "which is not" questions answer themselves.

## Cardiopulmonary bypass
\`\`\`
patient vein -> venous reservoir -> pump (roller/peristaltic or centrifugal) -> oxygenator (membrane; older bubble) -> heat exchanger (cool for hypothermia, rewarm at the end) -> arterial filter -> patient artery
plus: heparin to prevent clotting (reversed afterward); cardioplegia solution to stop the heart; suction and vent lines; backup pump and hand crank
\`\`\`
Concerns: pumps must not crush blood cells (gentle roller or centrifugal designs); heat exchange deliberately cools; pump failure stops circulation, so redundancy exists. Heparin thins blood; it does not thicken it.

## Hemodialysis, in order
\`\`\`
access -> arterial pressure monitor -> blood pump -> heparin pump -> dialyzer (blood one way, dialysate the other: countercurrent, across a semipermeable membrane) -> venous pressure monitor -> air trap and detector -> access
machine side: dialysate proportioning, heating, deaeration, conductivity and temperature monitoring, ultrafiltration control, blood leak detector; RO water upstream
\`\`\`
The air trap is the last component before the patient; the heparin pump is before the dialyzer; the blood pump is first outside the body.

## Pacing routes
\`\`\`
route            electrodes                     output       comfort   notes
transcutaneous   large chest pads with gel      tens of mA   painful   fastest; built into defibrillators
transvenous      lead through a vein (subclavian) into the RV   small   comfortable   needs placement under imaging
epicardial       wires on the heart surface at surgery, exiting the chest   small   comfortable   temporary after cardiac surgery; no subclavian leads
\`\`\`
External generators adjust rate and output, use AC or battery, and are temporary; implanted pacemakers run on batteries only.

## The anesthesia machine path
\`\`\`
gas supply (pipeline 50 psi, cylinders) -> pressure regulators -> flow controls and flowmeters (hypoxic guard) -> vaporizer (agent added to part of the flow) -> common gas outlet -> breathing circuit with CO2 absorber and one-way valves -> ventilator or bag -> patient; scavenging removes waste gas
\`\`\`
The vaporizer is the first section downstream of the anesthetic's flow control; the common gas outlet joins the streams after it; the ventilator is last.

## ESU waveforms
\`\`\`
mode      waveform                       duty cycle   spark           effect
cut       continuous sine                100 percent  sharp, hot      vaporizes cells; clean incision
coag      pulsed or damped bursts        low          broad           dries and seals
blend     mixed                          intermediate both
monopolar active electrode to return pad; needed for cutting large areas
bipolar   between forceps tips; delicate; near implants
\`\`\`
Powers on but no output: the high-voltage supply fuse (low-voltage fuse or power switch faults keep it from turning on; a bad display connector blanks the display only).

## Lasers by wavelength
\`\`\`
laser     wavelength region   absorbed by          use
CO2       far infrared        water                cutting and vaporizing soft tissue and skin surfaces; shallow
Nd:YAG    near infrared       deeper tissue        coagulation, hair and tattoo removal; penetrates
argon     visible blue-green  hemoglobin, pigment  eye and vascular
excimer   ultraviolet         corneal tissue       refractive surgery
\`\`\`
The invisible CO2 beam rides an aiming beam through an articulated mirror arm. Aiming beam only: footswitch, then laser; neither: arm alignment or laser; misaligned: arm or internal optics.

## Sterilization and warmers
\`\`\`
method                  agent                       for                                  note
steam (autoclave)       pressurized saturated steam most instruments                     fastest; dry heat for items that cannot be wet
gas                     ethylene oxide              heat- and moisture-sensitive devices  about 10 hours plus aeration; time, temperature, humidity, concentration
liquid chemical         toxic solutions             small, hard-to-reach lumens           rinse thoroughly
ionizing radiation      gamma or beta               disposables in sealed packages        done by manufacturers
\`\`\`
Autoclave with no steam: water pump, low fluid pressure, breaker or overloaded circuit, burned-out heater (a leaky steam valve affects pressure, not production). Over-pressure: the pressure switch. Blood warmers: countercurrent water around the blood line; pressurized-flow types add a compressor (loud means unseated tubing or a failing compressor; hot means blocked vents).

## How the exam asks it
- "Which is NOT a concern with heart-lung machines?" Heparin thickening the blood.
- "Which component is after filtration in a hemodialysis circuit?" The air trap.
- "Which is NOT a component of external epicardial pacing?" Subclavian leads.
- "First section downstream of the anesthetic control?" The vaporizer.
- "Mode and duty cycle most effective at cutting?" Monopolar, 100 percent.
- "ESU works but gives no output; most likely?" Blown high-voltage fuse.
- "Laser for skin surface operations?" Carbon dioxide.
- "Sterilization ideal for small hard-to-reach openings?" Liquid.
- "Autoclave not producing steam; likely problems?" Defective water pump, low water pressure, tripped breaker, burnt-out heater.

## What to memorize
- Bypass order and parts; heparin, cardioplegia, hypothermia.
- Dialysis order; countercurrent; air trap last.
- Transcutaneous, transvenous, epicardial.
- Supply, flow controls, vaporizer, common gas outlet, circuit, ventilator.
- Cut continuous, coag pulsed; HV fuse for no output.

u7l6: `## Four exam skills in one lesson
These are the "what would you check" and "which is not a factor" questions of the problem-solving domain. Each has a short procedure or a short list; learn both.

## Power supply procedure
\`\`\`
step   action                                                  interpretation
1      check the outlet and the power cable (continuity with a meter or cable tester)   most failures live here; a device that went to battery while plugged in has a bad outlet or cable
2      measure the regulator input pin to ground                no input: upstream (fuse, rectifier, transformer)
3      measure the regulator output pin to ground               input good, output low: regulator or a shorted load
4      compare with the rating; if under warranty send it in; else replace by part number or repair the discrete circuit
\`\`\`
Switching supplies: the switching element chops the input; the on-to-off ratio sets the output. Shorted element: full input voltage passes through (a high-voltage fault that damages downstream boards). Open element: zero output. Desktop computer supplies most often die from fan failure and overheating.
UPS: short backup time means the battery (charge, test voltage, replace battery or charger); no backup at all means the inverter; switched to backup while plugged into a live outlet means the outlet or cable.

## Criticality
\`\`\`
component of criticality           example
importance to the mission          imaging unit stops radiology; a spare cuff does not
likelihood of failure / PM demand  aging fleet, frequent maintenance
harm if it fails                   life support scores highest
NOT a component                    time required to perform maintenance
\`\`\`
Redundancy (backup units, easy replacement) lowers priority because a failure is quickly covered; it costs money and does not prevent all downtime, because simultaneous failures happen. Checklists guide daily and weekly user inspections and record biomed PMs; manufacturer failure data sets their content and schedule.

## Root cause analysis
Ask what happened, why, and how to prevent it; keep asking why until the answer is a cause you can fix rather than a symptom you can patch. Not a cost exercise, not a blame exercise. Worked cases:
\`\`\`
complaint                                    check first                                  usual root cause
handheld ultrasound blurry and noisy         crystal integrity and continuity (regulator overvoltage cracks crystals)   too little gel: use error; instruct users
fingertip oximeters erratic                  sensor placement and room lighting           ambient light leakage
one sphygmomanometer wrong, others fine      watch staff use it                           cracked tubing or bulb (a slow leak lowers readings)
\`\`\`
Use error versus device error: a misconfigured pump overdose, blurry images from a good scanner, and ECG noise near heavy machinery are use or environment; a nurse station losing data over the network, a leaking cuff, a blackened spectrophotometer bulb, and a pump that stops detecting syringes are device or system faults; dust overheating a centrifuge is a lapse in user maintenance.

## Local or network?
\`\`\`
symptom                                         test                                                 conclusion
nurse station missing one room's data           do other rooms arrive?                               one room: that room's equipment; many: shared configuration or network
several monitors false-alarming                 compare the time frame; check alarm limits           normal values crossing set limits: localized configuration error
messages not leaving the nurses' station        continuity of wired links, strength of wireless      physical local failure first
recurring monitor fault: local or systemic?     search repair records for the same device type      a fleet pattern is systemic
\`\`\`
Tools that separate local from network faults: ping, cable testers and tracers, a multimeter for continuity. An electrical safety analyzer tests leakage and ground, which is never a network question.

## How the exam asks it
- "Infusion pump switched to battery when plugged in; how do you resolve it?" Check the power cable continuity first, then the internal power circuit.
- "Which is NOT a consideration in criticality?" Time required to perform maintenance.
- "Which is NOT true of redundancy?" That it prevents all downtime.
- "Which phrase best describes root cause analysis?" A series of iterative questions to find the underlying cause and build a solution from it.
- "Which is a device error rather than use error?" A nurse station not receiving data from monitors.
- "Which exemplifies use error over device error?" A centrifuge overheating from dust buildup (a failure of user maintenance).
- "Which action determines whether a recurring monitor issue is localized or systemic?" Checking repair records for the same device type.
- "Which tool would NOT help differentiate local from network-wide issues?" An electrical safety analyzer.
- "Which describes a system using rapid on-off signals for consistent power?" A switching power supply.
- "Most likely failure source for a desktop power supply?" Fan failure and insufficient cooling.

## What to memorize
- Cable and outlet first; regulator input and output pins; shorted switch equals full input; open equals zero; UPS battery, inverter, outlet.
- Criticality: importance, failure likelihood, harm; not repair time; redundancy lowers priority but is not absolute.
- RCA: what, why, prevent, and keep asking why; the three worked cases.
- Local versus network tests; records show patterns; safety analyzers are not network tools.`,
