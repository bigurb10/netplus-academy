<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Your progress - FieldReady Academy</title>
<meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
:root { --bg: #F3F5F8; --surface: #fff; --ink: #14212E; --ink-2: #4A5A6B; --muted: #7C8A99; --line: #D5DCE4; --accent: #C25E1F; --accent-soft: #F8E7DC; --good: #1E8E5A; --good-soft: #E1F3EA; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --bg: #0F161E; --surface: #17212B; --ink: #E6ECF2; --ink-2: #A7B4C2; --muted: #7E8C9B; --line: #2C3947; --accent: #E08744; --accent-soft: #3A2418; --good: #3DBB7F; --good-soft: #16332A; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Source Sans 3", "Segoe UI", system-ui, sans-serif; font-size: 17px; line-height: 1.55; }
h1, h2, h3 { font-family: "Archivo", "Segoe UI", system-ui, sans-serif; font-weight: 600; line-height: 1.2; margin: 0; }
.wrap { max-width: 960px; margin: 0 auto; padding: 0 20px; }
.hero { background: var(--surface); border-bottom: 1px solid var(--line); padding: 36px 0 40px; }
.hero h1 { font-size: 2.1rem; margin: 18px 0 12px; max-width: 720px; }
.hero p { color: var(--ink-2); font-size: 1.1rem; max-width: 720px; margin: 0; }
.brand { display: flex; align-items: center; gap: 10px; font-family: "Archivo", system-ui, sans-serif; font-weight: 700; font-size: 1.05rem; }
.mark { width: 28px; height: 28px; border-radius: 7px; background: var(--ink); color: var(--bg); display: grid; place-items: center; font-size: 0.8rem; }
main h2 { font-size: 1.3rem; margin: 32px 0 14px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.card { display: flex; flex-direction: column; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; color: inherit; text-decoration: none; }
.card:hover { border-color: var(--accent); }
.card h3 a { color: inherit; text-decoration: none; }
.card h3 a:hover { color: var(--accent); }
.card .links { font-size: 0.9rem; color: var(--muted); }
.card.soon { opacity: 0.75; }
.card p { color: var(--ink-2); margin: 0; font-size: 0.98rem; flex: 1; }
.pill { align-self: flex-start; padding: 3px 10px; border-radius: 999px; font-family: "Archivo", system-ui, sans-serif; font-size: 0.75rem; font-weight: 600; background: var(--good-soft); color: var(--good); }
.soon .pill { background: var(--accent-soft); color: var(--accent); }
.go { font-family: "Archivo", system-ui, sans-serif; font-weight: 600; color: var(--accent); text-decoration: none; }
.go:hover { text-decoration: underline; }
.steps { padding-left: 22px; line-height: 1.7; color: var(--ink-2); }
footer { padding: 40px 20px 60px; font-size: 0.9rem; }
.muted { color: var(--muted); }
/* Account control (catalog header and account page) */
.brand-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
a.brand { color: inherit; text-decoration: none; }
.acct-slot { display: flex; align-items: center; gap: 10px; min-height: 32px; }
.acct-slot .who { font-family: "Archivo", system-ui, sans-serif; font-weight: 600; font-size: 0.9rem; color: var(--ink); text-decoration: none; max-width: 14rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.acct-slot .who:hover { color: var(--accent); }
.btn { display: inline-flex; align-items: center; justify-content: center; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent); color: #fff; font-family: "Archivo", system-ui, sans-serif; font-weight: 600; font-size: 0.92rem; line-height: 1.2; text-decoration: none; cursor: pointer; }
.btn:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; color: var(--ink-2); border-color: var(--line); }
.btn.ghost:hover { color: var(--ink); border-color: var(--ink-2); filter: none; }
.btn.small { padding: 6px 10px; font-size: 0.85rem; }
/* Account page */
.hero.slim { padding: 22px 0 26px; }
.hero.slim h1 { font-size: 1.7rem; margin: 16px 0 6px; }
.card .exam { color: var(--muted); font-size: 0.9rem; margin: 0; flex: 0 0 auto; }
.bar { height: 6px; border-radius: 999px; background: var(--line); overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--good); border-radius: 999px; }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; margin: 4px 0 6px; }
.fact dt { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
.fact dd { margin: 0; font-family: "Archivo", system-ui, sans-serif; font-weight: 600; font-size: 0.95rem; }

</style>

  </div>

<main class="wrap">
  <div class="cards" id="courses"></div>
</main>
<script>
'use strict';
// OAuth 2.1 authorization-code + PKCE against WorkOS AuthKit, for a public browser
// client. Loaded as a plain script beside merge.js; sets window.FRAAuth.
//
// This file is the ONLY place that knows what a token is. engine/sync.js asks it for
// a bearer token and knows nothing else about auth.
(function (root) {
  const DEFAULTS = {
    // PRODUCTION AuthKit (soft-rose-14). The course site and ServiceForge share this
    // WorkOS environment; sign-in cut over from the staging tenant on 2026-09-14.
    issuer: 'https://soft-rose-14.authkit.app',
    // A WorkOS CONNECT application, not the environment's AuthKit client id.
    // `/oauth2/authorize` is WorkOS Connect's authorization server and only knows
    // Connect applications: first-party apps made in the dashboard or API, or clients
    // registered through DCR (POST /oauth2/register) or a Client ID Metadata Document.
    // Handing it the environment client id returns `application_not_found` -- which is
    // what broke the first live sign-in attempt. The environment client id belongs to
    // the OTHER flow, api.workos.com/user_management/authorize, whose tokens carry no
    // `aud` at all and so cannot be audience-bound to this API.
    // This is the production FIRST-PARTY app (no consent screen), adopted 2026-09-15
    // after a live sign-in through it minted aud = this API and the API answered 200.
    // The DCR client it replaced, client_01M2GJVYVBKESSVDNA0RM9C4AM, still exists in
    // the tenant; refresh tokens issued to it die at the switch, so those learners
    // simply sign in again (their progress is keyed by sub, which is the same).
    clientId: 'client_01M2H28RQJQ5EE9E0Q00GP23B6',
    apiBase: 'https://api.fieldreadyacademy.com',
    // RFC 8707 resource indicator. The tenant's DEFAULT indicator is the MCP server,
    // so a token minted without this opens the connector, not this API, and every
    // sync call 401s. Do not remove it from any request below.
    resource: 'https://api.fieldreadyacademy.com',
    redirectPath: '/callback',
    scope: 'openid profile email offline_access'
  };
  const CONFIG = Object.assign({}, DEFAULTS, root.FRA_AUTH_CONFIG || {});

  const TOKEN_KEY = 'fra.auth.v1';
  const PKCE_KEY = 'fra.auth.pkce';
  // Set by signOut(), consumed by the next beginSignIn(). The WorkOS session cookie
  // outlives our local tokens and this tenant publishes no logout endpoint, so without
  // this a sign-in right after a sign-out silently reissues a code with no login page.
  const REAUTH_KEY = 'fra.auth.reauth';
  const SKEW_MS = 60000;               // refresh a minute early rather than racing expiry

  const redirectUri = () => new URL(CONFIG.redirectPath, root.location.origin).href;

  function readJson(store, key) {
    try { const raw = store.getItem(key); return raw ? JSON.parse(raw) : null; }
    catch (e) { return null; }
  }
  function writeJson(store, key, val) {
    try { store.setItem(key, JSON.stringify(val)); } catch (e) { /* private mode */ }
  }
  function drop(store, key) { try { store.removeItem(key); } catch (e) { /* ignore */ } }

  const tokens = () => readJson(root.localStorage, TOKEN_KEY);

  function randomString(n) {
    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~';
    const bytes = new Uint8Array(n);
    root.crypto.getRandomValues(bytes);
    let s = '';
    for (let i = 0; i < bytes.length; i++) s += chars[bytes[i] % chars.length];
    return s;
  }

  function b64url(buf) {
    const b = new Uint8Array(buf);
    let s = '';
    for (let i = 0; i < b.length; i++) s += String.fromCharCode(b[i]);
    return root.btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }

  function challengeFor(verifier) {
    const data = new root.TextEncoder().encode(verifier);
    return root.crypto.subtle.digest('SHA-256', data).then(b64url);
  }

  function authorizeUrl(verifier, state, opts) {
    return challengeFor(verifier).then(function (challenge) {
      const q = new URLSearchParams({
        response_type: 'code',
        client_id: CONFIG.clientId,
        redirect_uri: redirectUri(),
        scope: CONFIG.scope,
        state: state,
        code_challenge: challenge,
        code_challenge_method: 'S256',
        resource: CONFIG.resource
      });
      // prompt=login forces the AuthKit login page even when a session cookie already
      // exists -- the only way to make "sign out then sign in" actually prompt here.
      if (opts && opts.prompt) q.set('prompt', opts.prompt);
      return CONFIG.issuer.replace(/\/$/, '') + '/oauth2/authorize?' + q.toString();
    });
  }

  function beginSignIn(returnTo) {
    const verifier = randomString(64);
    const state = randomString(32);
    // A sign-in that directly follows an explicit sign-out must show the login page.
    const forcePrompt = readJson(root.localStorage, REAUTH_KEY) ? 'login' : null;
    drop(root.localStorage, REAUTH_KEY);
    writeJson(root.sessionStorage, PKCE_KEY, {
      verifier: verifier, state: state,
      returnTo: returnTo || root.location.pathname + root.location.hash
    });
    return authorizeUrl(verifier, state, { prompt: forcePrompt }).then(function (url) {
      // Navigation seam, mirroring the callback page's FRA_REDIRECT: production falls back
      // to a plain location assignment; a test sets root.FRA_NAVIGATE to capture the URL,
      // since jsdom refuses to redefine location.
      (root.FRA_NAVIGATE || function (u) { root.location.href = u; })(url);
    });
  }

  function tokenRequest(params) {
    params.set('client_id', CONFIG.clientId);
    params.set('resource', CONFIG.resource);
    return root.fetch(CONFIG.issuer.replace(/\/$/, '') + '/oauth2/token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: params.toString()
    });
  }

  // Display only. The payload is NOT verified here -- the server verifies every token.
  // Never make an access decision on anything this returns.
  function claims(accessToken) {
    try {
      const part = String(accessToken).split('.')[1];
      const pad = part.replace(/-/g, '+').replace(/_/g, '/');
      return JSON.parse(root.atob(pad + '==='.slice((pad.length + 3) % 4)));
    } catch (e) { return {}; }
  }

  function store(data) {
    const c = claims(data.access_token);
    const rec = {
      access_token: data.access_token,
      refresh_token: data.refresh_token || (tokens() || {}).refresh_token || null,
      expires_at: Date.now() + (Number(data.expires_in) || 3600) * 1000,
      sub: c.sub || null,
      email: c.email || null,
      // The token's JWT template renders `name` as "first_name last_name", so a learner
      // with neither (a magic-code sign-up) arrives as a lone space: blank means absent.
      name: (typeof c.name === 'string' && c.name.trim()) ? c.name.trim() : null
    };
    writeJson(root.localStorage, TOKEN_KEY, rec);
    return rec;
  }

  function completeSignIn(search) {
    const pending = readJson(root.sessionStorage, PKCE_KEY);
    const q = new URLSearchParams(search || '');
    if (q.get('error')) {
      drop(root.sessionStorage, PKCE_KEY);
      return Promise.reject(new Error('sign-in failed: ' + q.get('error')));
    }
    if (!pending) return Promise.reject(new Error('no sign-in is in progress'));
    if (!q.get('state') || q.get('state') !== pending.state) {
      drop(root.sessionStorage, PKCE_KEY);
      return Promise.reject(new Error('state mismatch; sign-in was not started here'));
    }
    const params = new URLSearchParams({
      grant_type: 'authorization_code',
      code: q.get('code') || '',
      redirect_uri: redirectUri(),
      code_verifier: pending.verifier
    });
    return tokenRequest(params).then(function (r) {
      if (!r.ok) throw new Error('token exchange failed: ' + r.status);
      return r.json();
    }).then(function (data) {
      store(data);
      drop(root.sessionStorage, PKCE_KEY);
      return { returnTo: pending.returnTo || '/' };
    }, function (err) {
      drop(root.sessionStorage, PKCE_KEY);
      throw err;
    });
  }

  // The single refresh in flight, if any. Two triggers routinely want a token in the same
  // tick -- sync's boot pull racing the first save()'s debounced push, or two focus events
  // -- and with rotating refresh tokens the second request presents a token the first has
  // already consumed, which comes back 400 and would end a perfectly good session. One
  // in-flight refresh therefore serves every caller.
  let refreshing = null;

  function refresh() {
    const t = tokens();
    if (!t || !t.refresh_token) { signOut(); return Promise.resolve(null); }
    if (refreshing) return refreshing;
    refreshing = tokenRequest(new URLSearchParams({
      grant_type: 'refresh_token', refresh_token: t.refresh_token
    })).then(function (r) {
      // ONLY a dead grant ends the session. 400/401 from the token endpoint means the
      // refresh token itself is gone, and clearing it is what stops an infinite retry
      // loop. Everything else -- a 5xx (an issuer outage answers 503, never 401), a
      // rejected fetch (offline), a body that will not parse -- leaves the stored tokens
      // exactly where they are so the next trigger can retry.
      if (r.status === 400 || r.status === 401) { signOut(); return null; }
      if (!r.ok) return null;
      return r.json().then(function (data) { return store(data).access_token; },
        function () { return null; });
    }, function () { return null; })
      .then(function (tok) { refreshing = null; return tok; },
        function () { refreshing = null; return null; });
    return refreshing;
  }

  function accessToken() {
    const t = tokens();
    if (!t || !t.access_token) return Promise.resolve(null);
    if (Date.now() < (t.expires_at || 0) - SKEW_MS) return Promise.resolve(t.access_token);
    return refresh();
  }

  function signOut() {
    // Deliberately does not touch fra.<courseId>.state.v3 -- signing out must never
    // destroy the learner's local progress.
    drop(root.localStorage, TOKEN_KEY);
    drop(root.sessionStorage, PKCE_KEY);
    // Make the next sign-in prompt: the WorkOS session cookie is still live and there is
    // no logout endpoint to clear it, so beginSignIn() must pass prompt=login next time.
    // Armed on every sign-out, whether the learner clicked it or a dead/expired session
    // forced it (sync's sessionEnded, refresh's dead-grant path) -- the only effect is that
    // their next manual sign-in shows a login screen instead of silent SSO, which is right
    // after any session actually ended.
    writeJson(root.localStorage, REAUTH_KEY, true);
  }

  function user() {
    const t = tokens();
    return t && t.sub ? { sub: t.sub, email: t.email || null, name: t.name || null } : null;
  }

  root.FRAAuth = {
    CONFIG: CONFIG,
    // A stored access token exists -- nothing more. It does NOT mean the token is still
    // valid or that its refresh will succeed: refresh() deliberately keeps the tokens
    // through an outage, so treating a network blip as "signed out" would hide the
    // learner's own account from them until the next reload.
    isSignedIn: function () { return !!(tokens() || {}).access_token; },
    user: user,
    beginSignIn: beginSignIn,
    authorizeUrl: authorizeUrl,
    completeSignIn: completeSignIn,
    accessToken: accessToken,
    signOut: signOut
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
'use strict';
// A read-only summary of one course's progress blob, for the account page. Mirrors the
// stage rules in engine/app.js -- stage() and planDone() -- without the app's DOM or its
// course globals, so one page can describe every course on an account. Pure: no window,
// no storage, and it never throws on a malformed state (missing fields read as empty).
// Loaded as a plain script (sets window.FRASummary) and as a CommonJS module for tests,
// the same way engine/merge.js is.
(function (root, factory) {
  const api = factory();
  root.FRASummary = api;
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
}(typeof globalThis !== 'undefined' ? globalThis : this, function () {
  // The app's STAGE_LABEL, with the test size filled from meta.examQuestions.
  function stageLabel(stage, meta) {
    const n = Number(meta && meta.examQuestions) || 50;
    return {
      starter: 'Starter test', tutorial: 'Initial tutorial', fulltest: n + '-question test',
      retrain: 'Retraining', practice: 'Practice tests', official: 'Official-format test', ready: 'Ready'
    }[stage] || stage;
  }

  const obj = v => (v && typeof v === 'object') ? v : null;

  // meta: { lessons, passPct, passesNeeded, passWindow, examQuestions } from the course manifest and
  // curriculum (build.py's course table). Returns { started, stage, stageLabel,
  // lessonsPassed, lessonsTotal, bestPct, passes, passesNeeded, passWindow, official, lastStudied }.
  function summarize(state, meta) {
    const s = obj(state) || {};
    const m = obj(meta) || {};
    const lessons = obj(s.lessons) || {};
    const exams = Array.isArray(s.exams) ? s.exams.filter(obj) : [];
    const plan = obj(s.plan) && Array.isArray(s.plan.lessons) ? s.plan : null;
    const passesNeeded = Number(m.passesNeeded) > 0 ? Number(m.passesNeeded) : 3;
    const passWindow = Number(m.passWindow) > 0 ? Number(m.passWindow) : 5;
    const passes = Number(s.passes) > 0 ? Number(s.passes) : 0;
    const official = obj(s.official);
    // Same rule as planDone() in app.js: a plan lesson counts only when it was passed after
    // the plan was made, so an old pass cannot satisfy a new retraining plan.
    const planDone = id => { const ls = obj(lessons[id]); return !!(ls && ls.status === 'passed' && plan && Number(ls.passedAt) >= Number(plan.createdAt)); };
    const planLeft = plan ? plan.lessons.filter(e => obj(e) && !planDone(e.id)).length : 0;
    const has = kind => exams.some(e => e.kind === kind);
    let stage;
    if (!has('starter')) stage = 'starter';
    else if (plan && planLeft) stage = plan.source === 'starter' ? 'tutorial' : 'retrain';
    else if (official) stage = 'ready';                       // permanent once earned
    else if (passes >= passesNeeded) stage = 'official';
    else if (!has('full') && !has('practice')) stage = 'fulltest';
    else stage = 'practice';
    const ids = Object.keys(lessons);
    const lessonsPassed = ids.filter(id => obj(lessons[id]) && lessons[id].status === 'passed').length;
    let bestPct = null;
    exams.forEach(e => {
      if ((e.kind === 'full' || e.kind === 'practice') && typeof e.pct === 'number' && (bestPct === null || e.pct > bestPct)) bestPct = e.pct;
    });
    const started = exams.length > 0 || ids.some(id => obj(lessons[id]) && lessons[id].status && lessons[id].status !== 'new');
    return {
      started, stage, stageLabel: stageLabel(stage, m),
      lessonsPassed, lessonsTotal: Number(m.lessons) > 0 ? Number(m.lessons) : 0,
      bestPct, passes, passesNeeded, passWindow,
      official: official ? { date: Number(official.date) || null, pct: typeof official.pct === 'number' ? official.pct : null } : null,
      lastStudied: Number(s.touchedAt) > 0 ? Number(s.touchedAt) : null
    };
  }

  return { summarize, stageLabel };
}));

</script>
<script>window.FRA_COURSES = [{"id": "netplus", "name": "NetPlus Academy", "exam": "CompTIA Network+ N10-009", "lessons": 49, "examQuestions": 50, "passPct": 80, "passesNeeded": 3, "passWindow": 5}, {"id": "secplus", "name": "SecPlus Academy", "exam": "CompTIA Security+ SY0-701", "lessons": 54, "examQuestions": 50, "passPct": 80, "passesNeeded": 3, "passWindow": 5}, {"id": "cbet", "name": "CBET Academy", "exam": "Certified Biomedical Equipment Technician CBET", "lessons": 60, "examQuestions": 50, "passPct": 80, "passesNeeded": 3, "passWindow": 5}, {"id": "aplus1", "name": "APlus Academy Core 1", "exam": "CompTIA A+ Core 1 220-1201", "lessons": 41, "examQuestions": 50, "passPct": 80, "passesNeeded": 3, "passWindow": 5}, {"id": "aplus2", "name": "APlus Academy Core 2", "exam": "CompTIA A+ Core 2 220-1202", "lessons": 41, "examQuestions": 50, "passPct": 80, "passesNeeded": 3, "passWindow": 5}];</script>
<script>
(function () {
  // FRA account page: read-only over the account's synced copy. It never writes, never
  // merges, and never reads this device's local progress -- the course pages push within
  // seconds of a change, so a stale number here is a sync problem to fix at the source.
  var A = window.FRAAuth, SUM = window.FRASummary;
  // Injected by build.py (window.FRA_COURSES): id, name, exam, lessons, passPct,
  // passesNeeded, passWindow, examQuestions, in catalog order.
  var COURSES = Array.isArray(window.FRA_COURSES) ? window.FRA_COURSES : [];
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]; }); };
  var api = function (p) { return A.CONFIG.apiBase + p; };
  function dateOf(ms) { try { return new Date(ms).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' }); } catch (e) { return ''; } }
  function ago(ms) {
    var d = Date.now() - ms;
    if (!(d >= 0)) return 'just now';
    var m = Math.floor(d / 60000), h = Math.floor(m / 60), days = Math.floor(h / 24);
    if (m < 1) return 'just now';
    if (m < 60) return m + (m === 1 ? ' minute ago' : ' minutes ago');
    if (h < 24) return h + (h === 1 ? ' hour ago' : ' hours ago');
    if (days < 30) return days + (days === 1 ? ' day ago' : ' days ago');
    return dateOf(ms);
  }
  function Unauthorized() { this.status = 401; }

  function signedOut(note) {
    $('heading').textContent = 'Your progress';
    $('detail').textContent = note || 'Sign in to see your progress on every course.';
    $('acct').innerHTML = '<button class="btn small" data-act="sign-in">Sign in</button>';
    $('courses').innerHTML = '';
  }
  function header(u) {
    $('heading').textContent = u.name || 'Your progress';
    // The one place the email is shown: this page exists to answer "which account is this".
    $('detail').textContent = u.email ? 'Signed in as ' + u.email : '';
    $('acct').innerHTML = '<button class="btn ghost small" data-act="sign-out">Sign out</button>';
  }
  function fact(k, v) { return '<div class="fact"><dt>' + esc(k) + '</dt><dd>' + esc(v) + '</dd></div>'; }
  function card(it) {
    var c = it.course, href = '/' + encodeURIComponent(c.id) + '/';
    var head = '<h3><a href="' + href + '">' + esc(c.name) + '</a></h3><p class="exam">' + esc(c.exam) + '</p>';
    if (!it.row) return '<div class="card"><div class="pill soon">Not started</div>' + head + '<a class="go" href="' + href + '">Start the course</a></div>';
    if (it.err || !it.state) return '<div class="card"><div class="pill soon">Progress unavailable</div>' + head + '<p class="muted">Couldn\'t read this course\'s progress.</p><a class="go" href="' + href + '">Open the course</a></div>';
    var s = SUM.summarize(it.state, c);
    var pct = s.lessonsTotal ? Math.round(100 * Math.min(s.lessonsPassed, s.lessonsTotal) / s.lessonsTotal) : 0;
    var synced = it.row.updated_at ? Date.parse(it.row.updated_at) : NaN;
    return '<div class="card">'
      + '<div class="pill' + (s.stage === 'ready' ? '' : ' soon') + '">' + esc(s.stageLabel) + '</div>'
      + head
      + '<div class="bar" title="' + pct + '% of lessons passed"><span style="width:' + pct + '%"></span></div>'
      + '<dl class="facts">'
      + fact('Lessons passed', s.lessonsPassed + ' of ' + s.lessonsTotal)
      + fact('Best practice score', s.bestPct == null ? 'No test yet' : s.bestPct + '%')
      + fact('Passes', s.passes + ' of ' + s.passesNeeded + ' in last ' + s.passWindow)
      + fact('Official-format test', s.official && s.official.date ? 'Passed ' + dateOf(s.official.date) : 'Not yet')
      + fact('Last studied', s.lastStudied ? ago(s.lastStudied) : 'Not yet')
      + fact('Last synced', synced === synced ? ago(synced) : 'Unknown')
      + '</dl><a class="go" href="' + href + '">Continue</a></div>';
  }
  function get(tok, p) {
    return fetch(api(p), { headers: { Authorization: 'Bearer ' + tok } }).then(function (r) {
      if (r.status === 401) throw new Unauthorized();
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    });
  }
  function load() {
    var u = A.isSignedIn() ? A.user() : null;
    if (!u) { signedOut(); return Promise.resolve(); }
    header(u);
    $('courses').innerHTML = '<p class="muted">Loading your progress...</p>';
    return A.accessToken().then(function (tok) {
      if (!tok) throw new Unauthorized();
      return get(tok, '/v1/progress').then(function (rows) {
        var byId = {};
        (Array.isArray(rows) ? rows : []).forEach(function (r) { if (r && r.course_id) byId[r.course_id] = r; });
        return Promise.all(COURSES.map(function (c) {
          var row = byId[c.id];
          if (!row) return { course: c, row: null };
          return get(tok, '/v1/progress/' + encodeURIComponent(c.id)).then(
            function (b) { return { course: c, row: row, state: b && b.state }; },
            function (e) { if (e instanceof Unauthorized) throw e; return { course: c, row: row, err: true }; });
        }));
      });
    }).then(function (items) {
      $('courses').innerHTML = items.map(card).join('');
    }, function (e) {
      if (e instanceof Unauthorized) { A.signOut(); signedOut('Your session ended. Sign in again to see your progress.'); return; }
      $('courses').innerHTML = '<div class="card"><p>Couldn\'t load your progress.</p><div><button class="btn small" data-act="retry">Retry</button></div></div>';
    });
  }
  document.addEventListener('click', function (ev) {
    var b = ev.target && ev.target.closest ? ev.target.closest('[data-act]') : null;
    if (!b) return;
    var act = b.getAttribute('data-act');
    if (act === 'sign-in') A.beginSignIn('/account/');
    else if (act === 'sign-out') { A.signOut(); signedOut(); }
    else if (act === 'retry') load();
  });
  window.FRA_ACCOUNT = { load: load };
  window.FRA_ACCOUNT.ready = load();
})();
</script>
</body>
</html>
