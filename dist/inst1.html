u4l1: `## A pull schedule for six cables
Here is a real-looking schedule for six drops from TR 2A. The measured path is what you get from the drawing or a tape-style pull line. The slack column is 10 ft at each end, as the plan gives it, so each cable needs its path plus 20 ft.

\`\`\`
Cable ID   To        Path   Slack, both ends   Cut length   Pathway
2A-014     Outlet 14  168    20                 188 ft       corridor J-hook, drop
2A-015     Outlet 15  182    20                 202 ft       corridor J-hook, drop
2A-016     Outlet 16  144    20                 164 ft       conduit to wall box
2A-017     Outlet 17  120    20                 140 ft       corridor J-hook, drop
2A-018     Outlet 18   96    20                 116 ft       conduit to wall box
2A-019     Outlet 19  150    20                 170 ft       corridor J-hook, drop
Total                                          980 ft
\`\`\`

Six cut lengths add up to 980 ft, so the six cables fit in one 1000 ft box with 20 ft left over. The leftover is scrap unless a seventh drop is short enough to use it. Pull the longest cable first so a short box end is never the cable that comes up short.

## Why whole runs per box
A box is one continuous length. If a run is 200 ft and the box has 1000 ft, you get 5 runs and the last 0 ft is empty. If the run were 230 ft, you would get 4 runs with 80 ft of leftover, because a fifth run does not fit. That leftover is never joined to anything. A splice in horizontal copper is not allowed, so a partial run is scrap.

## Worked example: the box count
You must pull 32 runs for the floor. Each run is 180 ft of path with 10 ft of slack at each end.

1. Cut length = 180 + 10 + 10 = 200 ft.
2. Runs per box = 1000 / 200 = 5, rounded down. Already whole.
3. Boxes = 32 / 5 = 6.4, rounded UP to 7.

Change the run to 230 ft: 1000 / 230 = 4.35, rounded down to 4 runs per box. Then 32 / 4 = 8 boxes. A longer run does not just add cost in proportion; it changes how many runs a box gives.

## Setup checklist the schedule drives
- Reel stands or boxes at the TR, one per cable in the pull, so nothing twists.
- Sheaves at the corridor corner and at the first J-hook past the TR door.
- Radios: the feed end and the outlet end, and a runner at the turn.
- Labels cut and ready, one per cable, so every cable is marked before it is cut from the box.

> Remember: slack at both ends, runs per box rounded down, boxes rounded up.`,

u4l2: `## Choosing a way to get a line through
A pull string is the first and cheapest part of a pull, and the one most often skipped. The choice depends on the conduit: its length, how many bends it holds, and whether there is a line in it already.

\`\`\`
Situation                                  Best method
Short, straight stub with one bend         steel or fiberglass fish tape
Long straight run                          fiberglass fish tape, the preferred tape near electrical work
Ceiling drop to a wall box                 glow or push rod
Long run with several bends                blown line with a piston, or a vacuum
Run with an old string already inside      tie new string to old, pull the old string out
Box or raceway with live conductors      no tape of any kind until the electrician de-energizes and locks out the circuit
\`\`\`

## Blown line in more detail
The piston or mouse is sized to the conduit's trade size. It is tied to a light line that pays off a reel. A vacuum or a blower moves the piston down the conduit, and the line goes with it. You then tie a heavier pull rope to the light line and draw it back. A mouse stuck behind a joint can be cleared by reversing the airflow.

## Worked example: replacing a string
You pull eight cables through a conduit that had one pull string in it. The string was a thin nylon line.

1. Tie the new, stronger pull rope to the old string at the TR end.
2. Pull the old string out at the far end until the rope arrives, then untie the string.
3. Tie the cable bundle to the rope through a swivel and pull the cables through.
4. Before you finish, run a new pull string through with the cable, or draw one in on the same rope. A conduit must never be left empty of string.
5. Tie the string off at both ends and tag it with the date and the conduit number.

## Measuring while you pull
A footage line prints a number every foot or meter. At the far end, read the mark where the line comes out. That figure is the run length. Record it against the cable ID so the next crew knows which conduits are long.

## Safety
Metal fish tapes carry electricity and can pull a fault into your hands. Never fish any tape, steel or fiberglass, into a box or raceway with energized conductors. The electrician de-energizes and locks out the circuit first. Fiberglass is preferred near electrical work because it does not conduct, but that is not permission to work live.

> Remember: tie off both ends, use a rope rather than string for the real pull, and always leave a fresh string in.`,

u4l3: `## The limits worked in numbers
Every limit on the pull has a number, and the exam gives you the cable and asks for the number. Practice each calculation until it is routine. The rules: tension 110 N (25 lbf) per 4-pair cable; bend radius 4 x OD for 4-pair UTP and 10 x OD for multipair; fiber 10 x OD with no load and 20 x OD under pulling tension.

\`\`\`
Cable                      OD       Rule               Minimum bend radius
4-pair UTP                 0.25 in  4 x OD             1.0 in
Multipair copper           1.0 in   10 x OD            10 in
Fiber, installed, no load  0.5 in   10 x OD            5 in
Fiber, during the pull     0.5 in   20 x OD            10 in
\`\`\`

## Tension for a bundle
The 25 lbf limit belongs to each 4-pair cable. Pulled together, the limit is that figure times the number of cables, as long as each cable shares the load evenly and the grip is rated for it.

Worked example: you pull 12 cables at once.
- In pounds: 12 x 25 = 300 lbf.
- In newtons: 12 x 110 = 1320 N.

Pick one unit and stay in it. The two numbers are close but not equal, so never convert one cable in one unit and the rest in another. A swivel and a tension meter at the grip tell you what the cables are really feeling.

## Worked example: a decision
A tension meter on the pull of 12 cables reads 320 lbf as the cable passes the second bend. The limit is 300 lbf. The correct action is to stop the pull, find out why it is stiff (a crushed section, a missing sheave, or too many cables), and fix that before going on. Do not push the last 20 lbf by speeding up.

## What each limit protects
- Tension stretches the pairs and loosens the twist, which fails return loss and crosstalk later.
- A bend tighter than the radius flattens the pair spacing.
- Crush from a cinched tie deforms the jacket and the pairs.
- Twist from a spinning reel puts a spiral in the cable that shows up as a kink.

## After the pull
The bend radius applies to a cable at rest too. A service loop in the ceiling must be larger than the radius, and a cable that turns into a wall box needs a box deep enough for the bend. Tie bundles with hook-and-loop ties, never cinched.

> Remember: 110 N or 25 lbf per cable; a bundle is that times the count; bend radius is a multiple of the diameter, and the manufacturer's number wins.`,

u4l4: `## One conduit pull from start to finish
Take one pull as a story: eight cables from a TR through 60 ft of conduit with two bends and a pull box, to a wall box in a conference room.

\`\`\`
Stage        What you do                                            Why
Plan         read the schedule; check the fill and the pull points  conduit is a closed pathway
Line         blow or fish a line in; replace with a rope            the rope carries the force
Make up      label cables, square the ends, fit the basket grip     a smooth head slides past joints
Feed         stand at the TR, cables run off stands into a bushing  no kinks, no dragging
Pull         steady and slow; radios on                             jerks stretch the cable
Pull box     feed the loop out at the box and pull on               never a bend point
Finish       trim to slack, cap, label, new string in               ready for termination and the next crew
\`\`\`

## Making a tape-and-loop head
When no basket grip is at hand, strip a short length of each jacket back, fold the ends over a pulling loop, and tape them down in a tapered shape. Stagger the cable ends so the head tapers in steps and does not end in one square lump. A tight, smooth wrap lets the bundle slide past a coupling.

## Worked example: where a pull box goes
Run length is 85 ft with three 90-degree bends. The rules: no more than two 90-degree bends and no more than 30 m (100 ft) between pull points. This run breaks the bend limit, so it needs a pull box. Place the box after the second bend. Now the first section has two bends and the second has one, and each section is under 100 ft.

At the pull box you pull enough cable out to make a loose loop, check the whole length for kinks, lay the loop at its bend radius, and then pull on. The loop must not be bent tighter than the cable's bend radius.

## Feeding without kinks
- A person on every few feet of the feed end to keep the cables from twisting around each other.
- A bushing or a guide so the cable never touches the cut edge of a conduit.
- A stand or box that pays out smoothly. Never pull cable up from the floor of a reel.

## Why the rope carries the force
The jacket, the pairs, and the bundle are not built to bear a pull. The rope takes the load, and the grip spreads it around the whole bundle.

> Remember: pull boxes are for feeding and pulling, never for bending, and a conduit gets a fresh pull string every time.`,

u4l5: `## A ceiling pull checked against the rules
You are about to hang cable above a corridor. The plan shows a 60 ft run with J-hooks every 5 ft, then a turn into a room. Look at the ceiling before you lay a single cable.

\`\`\`
What you see             What you do
J-hooks on grid wire     reject them; hang new hooks from structure
Hooks 8 ft apart         add hooks so none are more than 1.5 m (5 ft) apart
Ballast above the route  keep the cable 130 mm (5.12 in) away, or reroute
Sprinkler head below     keep the cable clear of the spray pattern and the head
Access panel in the way  route around it so the panel still opens
Duct dripping or cold    do not tie to it; the duct belongs to another trade
\`\`\`

## Counting hooks, a worked example
A straight run of 60 ft with a hook every 5 ft needs 60 / 5 = 12 spans. The first hook near the start and the last near the end are included, so you need 13 hooks. Add hooks on both sides of any turn.

## Bundle size and loading
Each J-hook has a rated count of cables. Do not exceed it. Lay a bundle of four or five cables in one hook, loose, so a person can lift it. Bigger bundles need bigger hooks or a tray. A cable that sits under the bundle on the bottom of the hook carries the weight of all the rest, so keep bundles shallow and untied.

## Plenum and riser ratings
An air-handling ceiling is a plenum. Check the print on the jacket before you lay a single cable.

\`\`\`
Print     Allowed in a plenum?
CMP       yes
CMR       no, riser only
CMG, CM   no, general purpose only
CMX       no, limited use
\`\`\`
The same applies to fiber: OFNP is plenum and OFNR is riser. A higher rating may go where a lower one is required, not the other way around.

## The drop
At the outlet the cable comes down in the wall or a pole. Strap it to the structure or a support and leave the slack the plan gives. Do not tie to the grid. Label it at the outlet end before you go on.

> Remember: lay in, do not drag; 1.5 m (5 ft) between supports; independent support; plenum cable in a plenum.`,

u4l6: `## A top-down riser plan
The backbone cable runs from the sixth-floor TR down to the basement TR. It is a heavy multipair cable on a large reel. Here is the plan for the crew.

\`\`\`
Position        Person   Task
Top floor       2        set the reel on a stand, set the brake, feed
Floors 5 to 1   1 each   guide the cable, call stop, hold the grip at the floor
Basement        2        receive the cable, secure it, confirm the arrival
\`\`\`

Everyone has a radio on the same channel and a signal for stop.

## Steps in order
1. Walk the shaft. Check that each floor opening has a bushing or a sleeve so the cable will not scrape.
2. Set the reel on its stand at the top. Set the brake and check that it holds.
3. Feed the end of the cable down the shaft to the floor below, and secure it there with a split-mesh grip or a clamp.
4. Release the brake a little, feed more cable, and secure it at each floor in turn. The support takes the weight at each floor.
5. Once the cable reaches the basement, leave the planned slack, support it at the bottom, and leave the cable coiled neatly.
6. Firestop each floor opening around the cable, label it at every floor, and never splice it.

## Worked example: how many supports
The riser serves floors 6 through 1 and the basement, seven levels, and the plan calls for a support at every level. That is 7 supports. The reel at the top has its own brake and is not counted. The weight is shared among the 7 supports and not carried by the lowest one.

## What goes wrong
- A reel without a brake can spin faster than the crew can feed, and the cable falls.
- A cable with no support at the floors hangs from its own jacket and stretches the pairs.
- A cable pulled over a sharp sleeve edge scrapes its jacket.

## Controlling the descent
You do not pull the cable down; you let it down. A brake at the reel holds the speed. Each floor calls the stop if the cable binds or the speed rises. The person at the top releases only as much cable as the lower floors can handle.

> Remember: brake at the reel, a grip or clamp at every floor, a call-stop signal, then firestop and label.`,

u4l7: `## Pulling up: tension is the story
In a top-down pull gravity helps. In a bottom-up pull it works against you, and the longer the shaft, the more cable hangs below the winch. The tension climbs with every floor. A crew that treats it like a horizontal pull will exceed the limit before it reaches the top.

\`\`\`
Part             Job                                        Mistake to avoid
Pull line        reaches from the top to the reel           weak line that breaks
Winch/capstan    pulls at an even speed                     fast, jerky starts
Pulling eye      attaches to the cable's strength member   gripping only the jacket
Swivel           takes out the twist                        leaving it out
Tension monitor  shows the pull in real time                trusting feel instead
Floor supports   hold the cable before the tension is off  releasing at the top first
\`\`\`

## Sequence
1. Run the pull line up the shaft from the top, and tie it to the pulling eye on the cable at the bottom, through a swivel.
2. Brief everyone: radios on, a stop signal, and the manufacturer's tension limit written where the winch operator can see it.
3. Start the winch slowly. Watch the tension meter and the cable at each floor.
4. If the reading nears the limit, stop and find out why.
5. When the end reaches the top, secure it with a grip.
6. Work down: support the cable at each floor with a grip or clamp.
7. Release the tension only after all the supports hold the cable.

## Worked example: reading the meter
In this example the manufacturer's limit for the cable is 600 lbf. The meter reads 250 lbf at the start, climbs steadily to 540 lbf at the fifth floor, and jumps to 620 lbf. The jump over the limit means the pull must stop at once. Possible causes: a snag at a sleeve, a twist, or the cable touching the wall. Fix it before restarting. The lesson is that you do not finish the last floor at the cost of the cable.

## Top down or bottom up
Top down when the reel can go on the top floor. Bottom up when it cannot. Bottom up requires the winch, the swivel, and the meter. In both, support at each floor and firestop at the end.

> Remember: watch the meter against the manufacturer's limit, and support at every floor before you release.`,

u4l8: `## Horizontal backbone: a campus example
A small campus has a main building and an annex 150 ft apart. A fiber backbone runs underground in a duct bank from the annex entrance facility to the main building's equipment room.

\`\`\`
Stage                   What you do
Plan                    read the plan for pull points, the manhole, and the innerduct
Prepare the manhole     test the air, ventilate, get the permit, post a standby person
Innerduct               pull innerduct through the duct and leave a string in each
Pull the cable          feed at one pull point, pull at the next, with a swivel and tension meter
Entrance facility       change outdoor cable to indoor-rated cable, or splice to it
Finish                  cap the ends, label both ends, record the footage
\`\`\`

## The transition rule
Outdoor cable is built for weather: it may be loose tube with gel inside and a jacket not rated for fire. The NEC lets it enter a building only a short distance before it must be replaced, or spliced to, cable with an indoor fire rating. The entrance facility is where that change is made. In practice you stop the outdoor cable at the entrance facility and carry on inside with plenum or riser cable.

## Worked example: staging the pull
Two pull points divide the 150 ft run. The cable reel stays at the first pull point in the manhole, and the cable is fed into the duct while the crew at the second point pulls on the rope. The plan reads like this:

1. Set the reel at the feed point on a stand, clear of the opening.
2. Feed the cable off the reel steadily, with a person guiding it at the mouth of the manhole so it never bends tighter than its radius.
3. Use a swivel and a tension meter at the pulling end.
4. After the cable arrives, leave slack coiled at a large radius in the manhole.

## Between TRs on one floor
This is the same cable family as the riser. Use the tray or conduit shown, and leave the slack for multipair, the backboard length plus floor to ceiling. Label both ends with the same name.

## Confined space rule
A manhole is a confined space. Never enter until it has been tested, ventilated, and permitted, and a standby person is outside.

> Remember: innerduct, a swivel and tension limit, the transition at the entrance facility, and no entry to a manhole without a permit.`,

u4l9: `## Fiber pulling, worked through
The risk in a fiber pull is not the weight but the stretch and the bend. The cable's strength member does the work, and you must give it the job.

\`\`\`
Cable part           What it does
Core and cladding    carry the light, and are glass; never pull on these
Buffer               coats each fiber (900 micron tight buffer or 250 micron loose tube)
Strength member      aramid yarn or a central member that carries the pull
Jacket               protects, but is not the load path
\`\`\`

## Attaching the pull
A pulling grip or eye connects to the strength member. The cable maker supplies a pulling eye on pre-terminated cable. On bare cable the aramid yarn is wrapped and clamped under the grip's collar. A swivel goes between the line and the eye so twist stays out.

## Bend radius worked for a fiber cable
Suppose a cable is 0.5 in across.
- During the pull, the radius must be at least 20 x 0.5 = 10 in.
- Once installed with no load, the radius must be at least 10 x 0.5 = 5 in.

A bend radius is a radius, but sheaves are sold by diameter. The sheave's radius must be at least the 10 in minimum under tension, so you need a sheave at least 20 in in diameter. A sheave 4 in across has a 2 in radius and fails badly, and even a 10 in sheave has only a 5 in radius, which is too small for the pull. At a tray corner, use a sweep, not a sharp angle.

## The figure-eight, step by step
1. Pay the cable off the reel and lay it on the floor in a large figure eight, two loops side by side.
2. Keep the loops flat and clean, with no cable crossing itself in a tight kink.
3. Feed from the pile into the conduit end. As the pile shrinks, flip the loops over to keep the cable from twisting.
4. A coil laid in a single circle twists the cable once per loop. The eight twists in one lobe and untwists in the other.

## Innerduct and protection
Pull fiber inside innerduct in conduit and trays. The duct gives a smooth, clean path and marks the fiber's route. Leave a labeled string in the innerduct. Cap the cable ends and keep them off dirty floors. A pre-terminated cable keeps its connectors under a pulling sleeve until the cable is in place.

> Remember: strength member, never fibers; stay under the manufacturer's limit; 10 x at rest, 20 x pulling; figure eight for long runs.`,

u4l10: `## Slack planned, not guessed
Slack is the last decision of the pull. Use the plan's numbers, and keep the cable dressed so it can be found and trusted.

\`\`\`
Place                        Slack
Work area, 4-pair            305 mm (12 in) minimum after termination; not stored in loops
TR or ER, 4-pair             to the farthest corner of the room by the pathway, plus floor to ceiling
TR or ER, multipair          the length of the backboard plus floor to ceiling
TE                           2 m (6.6 ft) stored outside the enclosure
\`\`\`

## Worked example: a TR slack estimate
A TR is 3 m (10 ft) square with a 2.6 m (8.5 ft) ceiling. A four-pair cable comes in on the ladder rack above the door, and the farthest corner of the room is 3 m along that rack.

The rule is enough to reach the farthest corner by way of the pathway, plus floor to ceiling.

1. The ladder rack runs along the wall from the door to the far corner: 3 m by way of the pathway.
2. Floor to ceiling: 2.6 m.
3. Slack = 3 + 2.6 = 5.6 m, plus any margin the plan adds for a retermination.
The point is to measure the route, not to guess a round number.

## A service loop done right
Lay a loop in the ceiling or on the ladder rack in a coil larger than the cable's minimum bend radius, supported on the rack or in hooks, not hanging on one cable. Tie it loosely. Never stuff a loop into the ceiling with a tight twist.

## Dress into the rack
\`\`\`
Step   Action
1      Bring the cables down the ladder rack to the vertical manager
2      Group them by patch panel, in port order
3      Tie with hook-and-loop ties, snug but loose
4      Land each cable at its port with the label out
5      Leave a short drip loop of slack, not a big coil, behind the panel
\`\`\`

## Leave it clean
Cap the ends, sweep up, restore the tiles, and take your scrap with you. Record each cable's footage against its label on the schedule. The next trade, and the next installer, depends on your record.

> Remember: slack at the work area is at least 305 mm (12 in) after termination and not coiled; the TR slack is measured by the route.`,

u5l1: `## Prepare the cable like a surgeon
Termination quality is set in the first 50 mm (2 in) of the cable. A clean strip, an undamaged pair, and a tight twist make a link that tests well the first time. A hurried strip makes a link that tests marginal or fails.

\`\`\`
Step   Do                                                    Avoid
1      read the label; match it to the schedule              terminating a cable that has the wrong ID
2      inspect the last 300 mm for kinks, nicks, crush       terminating over damage
3      route to the panel or jack in port order              crossing cables and losing the order
4      leave the planned slack                               stripping before you have the slack set
5      score the jacket lightly with the tool                cutting deep and nicking the pairs
6      pull the rip cord to open the jacket                  tearing it by hand
7      cut away the loose jacket, trim the rip cord          leaving the cord loose in the jack
8      fan the pairs; do not untwist more than 13 mm         untwisting the pairs for easy handling
\`\`\`

## A nick, and what it costs
Suppose you cut the jacket too deep and nick one conductor. It may pass the wiremap today. After a year of heat and flexing the copper breaks, and the link goes open. The tester finds it, but the cost of finding and fixing a bad termination in a finished building is many times the cost of cutting off a few inches and starting again.

## Worked example: the untwist limit
You strip 76 mm (3 in) of jacket, fan out the pairs, and untwist them to dress them in a neat row. The limit is 13 mm (0.5 in). The pairs untwisted for 76 mm, which is about six times the limit, so crosstalk will be bad. The fix is to cut off the damaged end, strip only what the jack needs, and keep each pair twisted right up to the point where it enters the termination.

## IDC rule
An insulation displacement connector has blades that cut through the insulation and grip the copper. Never strip the insulation for it. Stripping loosens the grip and invites corrosion.

## Shielded cable
Shielded cable adds a drain wire and a foil or braid to deal with before the pairs. Fold the shield back and keep it intact. Lesson u5l8 explains how to terminate it.

> Remember: label, inspect, route, strip clean, twist to within 13 mm, no insulation stripping for an IDC.`,

u5l2: `## Hardware in the right place
A telecom room is a collection of hardware, and each piece has a job. Putting the wrong piece in the wrong place creates faults that no tester can fix.

\`\`\`
Piece            Where                    What it does
Keystone jack    work area outlet         ends the horizontal cable in a standard 8-position jack
Patch panel      TR rack                  ends the horizontal cable on a row of jacks
110 block        TR wall or rack          ends and cross-connects horizontal and backbone cable
66 block         TR backboard             voice-grade cross-connect only
Fiber panel      TR or ER rack            holds adapters and cassettes for fiber
Cassette         inside a fiber panel     breaks a multifiber trunk out to single ports
\`\`\`

## The category rule, with a worked example
Category 6A cable goes into a Category 6A jack, to a Category 6A patch panel, with Category 6A cords. If one jack in the link is Category 5e, the channel is rated at Category 5e. A new Category 6A tester would find it at once, because the whole link fails at the higher limits. The fix is to replace the jack, not to retest and hope.

## Seating a 110 block, with the blade
The tool carries a replaceable blade with a cutting edge on one side. You place the tool over the wire with the cutting edge facing outward, toward the end of the wire you will not use.

1. Lay the pair on the block's slots in order, keeping the twist to within 13 mm. Across the row the pairs go blue, orange, green, brown, and in every pair the white-striped conductor goes in before the solid one.
2. Position the tool so the cutting side is out.
3. Push firmly until it clicks. The wire is seated in the contact and the end is trimmed.
4. Look for a clean cut with the wire flush with the block.
5. Place the connecting block or the clips over the row.

If the cutting side points inward, the tool seats the wire but cuts the length that should remain, or leaves the end uncut. Neither is acceptable.

## 66 versus 110
A 66 block is an older style for voice. Its clips are not rated for high-speed data. A 110 block is built for data and voice at higher categories. When the job says Category 6, a 66 block is the wrong choice.

> Remember: match every category; 66 blocks are for voice only; the 110 blade cuts on the outside.`,

u5l3: `## Both pin tables side by side
The two schemes put the same eight colors on the eight pins. Only the positions of the orange and green pairs differ.

\`\`\`
Pin   Pair position   T568A          T568B
1     pair 2          white-green    white-orange
2     pair 2          green          orange
3     pair 3          white-orange   white-green
4     pair 1          blue           blue
5     pair 1          white-blue     white-blue
6     pair 3          orange         green
7     pair 4          white-brown    white-brown
8     pair 4          brown          brown
\`\`\`

The pair positions follow the pins: pair 1 at pins 4 and 5, pair 2 at pins 1 and 2, pair 3 at pins 3 and 6, pair 4 at pins 7 and 8. The colors on the pins at 1, 2, 3, and 6 depend on the scheme.

## Worked example: a mixed job
A crew terminates 24 jacks in T568B. A helper punches the last jack in T568A by mistake. The wiremap shows a crossed pair on that link, because the orange and green pairs are swapped at one end only.

1. Check the pin table. At that jack, pins 1 and 2 are white-green and green, but the other end has white-orange and orange.
2. The jack is the odd one out. Reterminate it in T568B.
3. Retest. The wiremap now passes.
The pairs are twisted correctly in both cases, so this fault is not a split pair; it is a pair crossed with its partner at the far end.

## Why one scheme per job
Mixing schemes has no electrical benefit and leads to crossed pairs. The designer sets one scheme; every jack, panel, and cord follows it, and the drawings state it.

## Straight-through and crossover
- Straight-through: the same scheme at both ends. The standard patch cord.
- Crossover: T568A at one end and T568B at the other. Transmit pairs land on receive pairs. Most modern equipment adjusts on its own, so a crossover is rarely needed.

## Tool use on a jack
\`\`\`
Step   Action
1      seat the jacket just inside the jack's back
2      lay each pair to its colored slot, matching the label
3      cap the jack, or punch each conductor in order
4      trim, check for stray copper
5      snap the jack in the panel or faceplate
\`\`\`

> Remember: A and B differ only in the orange and green pairs, and the job uses one scheme.`,

u5l4: `## The full 25-pair table
Pair n is found from the tip color (group 1 to 5) and the ring color (position 1 to 5): n = 5 x (tip group - 1) + ring position. The table below holds every pair.

\`\`\`
Tip group      Ring: blue   orange   green   brown   slate
1  white           1        2        3       4       5
2  red             6        7        8       9       10
3  black           11       12       13      14      15
4  yellow          16       17       18      19      20
5  violet          21       22       23      24      25
\`\`\`

Read it across: white-blue is 1, white-orange 2, white-green 3, white-brown 4, white-slate 5. Then red starts the next row at pair 6.

## Worked examples, forward and back
- Yellow-green: yellow is tip group 4 and green is ring 3. n = 5 x 3 + 3 = 18.
- Red-slate: n = 5 x 1 + 5 = 10.
- Violet-orange: n = 5 x 4 + 2 = 22.

Going back from a pair number, subtract 1, divide by 5. The whole part gives the tip group minus 1, and the remainder gives the ring position minus 1.
- Pair 17: 16 / 5 = 3 remainder 1, so the tip is the fourth color (yellow) and the ring is the second (orange). Yellow-orange.
- Pair 25: 24 / 5 = 4 remainder 4, so violet-slate.

## Binder groups
A cable above 25 pairs groups each 25 pairs under a colored binder. The binder color uses the same code, so the first binder is white-blue (pairs 1 to 25), the second white-orange (pairs 26 to 50), and the sixth is red-blue (pairs 126 to 150). The code runs to 600 pairs, and the violet-slate binder is not used.

\`\`\`
Binder   Color         Pairs
1        white-blue    1 to 25
2        white-orange  26 to 50
3        white-green   51 to 75
4        white-brown   76 to 100
5        white-slate   101 to 125
6        red-blue      126 to 150
\`\`\`

## Terminating a 25-pair group in order
1. Strip the jacket and open the binder group you are working on.
2. Take pair 1, white-blue, and seat it on the first position of the block.
3. Continue in table order, row by row, to pair 25.
4. Seat each wire with the tool, cutting side out, and keep the twist to within 13 mm.
5. Mark the block with the pair range.

> Remember: tips white, red, black, yellow, violet; rings blue, orange, green, brown, slate.`,

u5l5: `## A good connector and a bad one
Look at two finished F connectors on RG-6 and decide which one you would sign off.

\`\`\`
Check                    Good connector                       Bad connector
Center conductor         straight, protrudes the right amount bent, or cut too long, or too short
Braid                    folded back over the jacket          strands bent forward, touching the center
Dielectric               clean cut, undamaged                 crushed or nicked
Compression              body fully seated and even           uneven, not fully compressed
Fit on the jacket        tight, will not twist or pull off    loose, turns by hand
Type                     compression                          twist-on
\`\`\`

## Why the bad one fails
The braid strands that touch the center conductor make a short, so the picture drops out or the signal is lost. A bent or too-long center conductor can damage the jack it plugs into. A loose connector lets moisture in and corrodes the braid. A twist-on connector is the likeliest to show all three faults.

## Worked example: from strip to test
You terminate an RG-6 camera cable with an F compression connector.

1. Cut the cable end square with a sharp cutter.
2. Place the cable in the strip tool, rotate the tool the set number of turns, and remove the waste.
3. Check the center conductor: it must be clean and straight. Trim stray braid strands away from it.
4. Fold the braid back over the jacket.
5. Slide the connector on until the dielectric seats in the body.
6. Compress with the compression tool until it stops.
7. Inspect: center conductor correct, no braid showing in front, connector tight.
8. Test for continuity and for a short between center and shield.

## Cable and connector pairing
RG-6 is the standard for new video and cable television. RG-59 is thinner and has more loss, so it is for short video runs. RG-11 is thick and low loss for long outdoor feeds. All are 75 ohm. Use the F connector for television and a BNC for security video, and match the connector to the cable's size.

## Center conductor note
The F connector has no center pin. It uses the cable's own solid center conductor, so it cannot be used on a cable with a stranded center conductor.

> Remember: compression, not twist-on; braid folded and away from the center; test for a short.`,

u5l6: `## Connectors compared
\`\`\`
Connector   Latch or lock       Size     Typical use
LC          push-pull latch     small    new patch panels, small form factor
SC          push-pull           square   patch panels, older and newer links
ST          bayonet twist       round    older multimode work
MPO         push-pull, keyed    large    many fibers in one ferrule
\`\`\`

## The color convention for end faces
\`\`\`
End face   Body color   Face
UPC        blue         flat or slightly curved, polished
APC        green        angled, polished
\`\`\`
The two types do not mate. An APC face pressed against a UPC face scratches both and loses signal. Always look at the connector color before you plug in.

## Three termination methods, compared at recognition level
\`\`\`
Method                  How it works                                   Loss and speed
Field polish            glue the fiber in, then polish by hand         skilled work, slow
Mechanical splice       prepolished stub joins the fiber in a gel      quick, a little more loss
Fusion-spliced pigtail  a machine fuses a factory pigtail to the fiber lowest loss, common on big jobs
\`\`\`

## Worked example: a panel of 12 ports
You terminate 12 duplex runs, 24 fibers, into a fiber panel with LC adapters. The plan asks for fusion-spliced pigtails.

1. Strip the cable, cut the buffer, and clean the glass.
2. Splice each fiber to a pigtail on the splice tray, one fiber at a time.
3. Seat the splices in the tray in fiber-color order.
4. Plug each pigtail into the back of an adapter.
5. Cap every adapter on the front until patch cords go in.
6. Label the panel with the run number and the fiber pair on each port.

## Polarity in plain words
In a duplex link, light transmitted at one end must arrive at the receive port at the other end. A "polarity" mistake puts transmit onto transmit. Follow the labels and the plan, and test with a light source.

## Safety
Cut ends of glass are sharp and impossible to see. Work over a mat, cut into a sealed container, and clean up before you eat. Never look into a fiber end.

> Remember: blue UPC, green APC, never mated; fusion splice gives the lowest loss.`,

u5l7: `## A cleaning routine, worked
A fiber link tests 3 dB over its loss budget. The cable and splices are good. The first suspect is the connectors, not the cable.

\`\`\`
Step   Do
1      confirm the fiber is dark; never look in with a source on
2      inspect each connector end face with the scope
3      if dirty, dry-clean it; inspect again
4      if still dirty, wet-to-dry clean it; inspect again
5      inspect the adapter's inside and clean it with a stick swab
6      mate, test, and cap what is not in use
\`\`\`

## Three cleaning tools
\`\`\`
Tool                    Used for
Cassette cleaner        dry-cleaning the end face with one pass across a cloth
Stick swab              cleaning inside an adapter or a recessed connector
One-click cleaner       cleaning a connector or adapter with one push
\`\`\`

## Dry versus wet-to-dry
Dry cleaning removes loose dust. A smear of oil or a film does not wipe off dry. For those, a wet-to-dry clean puts a small amount of approved solvent on a wipe, wipes once, and follows at once with a dry pass over the same spot. Using too much solvent leaves residue, which is as bad as dirt.

## Worked example: a re-clean, step by step
You inspect an LC connector. The scope shows a dust particle on the core.
1. Dry-clean once with the one-click cleaner.
2. Inspect again. The particle is gone, but a smear remains.
3. Wet-to-dry clean.
4. Inspect again. The face is clean. Mate it.
If a scratch shows after cleaning, the connector is damaged and must be replaced.

## Safety rules
- Never look into a fiber end or connector with a light source connected.
- Use only an approved scope with a filter for live links.
- Dispose of used wipes in the proper bin.

## Dust caps
Dust caps go on every unused connector and adapter. Cap them when you unplug them, and keep a few spares in your pouch.

> Remember: inspect, clean, inspect, mate; dry first, wet-to-dry only if needed.`,

u5l8: `## A shielded link, end to end
Shielded cable only works if the shield is a continuous, bonded path. One gap and it stops working, often without a visible clue.

\`\`\`
Link part              Shield requirement
Cable                  foil or braid continuous, drain wire intact
Jack at the outlet     shielded body, shield contact on the cable
Patch cord             shielded cord with a shielded plug
Patch panel            shielded panel, bonded to the rack
Rack                   bonded to the secondary bonding busbar
\`\`\`

## Handling the drain wire and foil
\`\`\`
Step   Do
1      strip the jacket back only as far as needed
2      fold the braid back over the jacket, or trim the foil to the jack's contact
3      keep the drain wire; do not cut it off
4      terminate the drain wire to the jack's or panel's shield lug
5      keep the foil in contact with the shield contact
6      terminate the pairs to the color code, keeping the twist
\`\`\`

## Worked example: a broken shield
A 48-port shielded panel shows a continuity fault on six ports. The wiremap passes, but the shield test shows an open shield. You inspect: those six cables had their drain wires cut off by the helper to make the termination neat.

1. Reterminate those six cables with a fresh strip.
2. Fold the foil and the drain wire onto the jack's shield contact.
3. Retest. The shield now reads as continuous.
A shield that is open at one end acts like an antenna: it picks up noise and can radiate it. This is worse than an unshielded cable.

## Bonding at the panel
The rack and the panel bond to the secondary bonding busbar with a rack bonding conductor, 6 AWG minimum, green jacket, two-hole compression lugs, bare metal under the lug with antioxidant. Each rack gets its own conductor. The two-point bonding test recommends 0.1 ohm (100 milliohms) at most.

> Remember: shielded parts everywhere, drain wire terminated, shield continuous, panel and rack bonded; no daisy chains.`

u6l1: `## What the two tests really contain
The permanent link and the channel are two answers to two questions. The permanent link asks whether the cabling the installer put in the wall is good. The channel asks whether the whole path the user's equipment sees is good. The same cable can pass one and fail the other, because cords are part of only one of them.

\`\`\`
Part of the path              Permanent link   Channel
Connector at the panel        yes              yes
Fixed horizontal cable        yes              yes
Jack at the outlet            yes              yes
Equipment cord at the panel   no               yes
Cord at the work area         no               yes
Cross-connect, if present     no               yes
Maximum length                90 m (295 ft)    100 m (328 ft)
Cords, total                  not counted      10 m (33 ft) at most
\`\`\`

## Worked example: why the numbers add up
A run measures 88 m on the permanent link test. At the panel there is a 3 m patch cord, and at the desk a 5 m cord. The channel is 88 + 3 + 5 = 96 m, inside the 100 m limit. Now suppose the run is 92 m. The permanent link fails the 90 m limit even though 92 + 8 = 100 m would just fit the channel. The permanent link limit is the one the installer is held to, so the answer is to reroute or shorten the run, not to argue about cords.

## Which adapter, which test
\`\`\`
Situation                                  Test           Adapters
New cabling, no cords yet                  permanent link permanent link adapters
Contract asks for end-to-end proof         channel        channel adapters with the cords
Existing link, user reports a slow port    channel        the user's actual cords
\`\`\`
Use the permanent link adapters only for the permanent link. A channel adapter or a patch cord used in a permanent link test adds the cord's own connector to the measurement, and the result no longer describes only your work.

## Three kinds of tester in practice
A **certification** tester measures every parameter across the frequency range and holds the limits for each category. A **verification** tester finds wiring faults, such as an open or a crossed pair, and often reports length. A **qualification** tester says whether a link can carry a given speed on a live network. Only the first proves a category. If a foreman gives you a basic cable tester and asks for "Cat 6A test results", the answer is that the tool cannot produce them.

> Remember: permanent link is 90 m without cords; channel is 100 m with cords; only certification proves a category.`,

u6l2: `## A test report, line by line
A saved report lists each parameter, its measured value, the limit, and a margin. Read it from the top: a wiremap fault stops everything else, and the rest tell you how much room the link has.

\`\`\`
Link  B2-014   Cat 6A permanent link   Result: PASS

Parameter         Measured     Limit        Margin   Worst case
Wiremap           pass         -            -        -
Length            71 m         90 m         19 m     pair 3-6
Insertion loss    30.2 dB      36.3 dB      6.1 dB   pair 7-8 at 500 MHz
NEXT              42.1 dB      38.7 dB      3.4 dB   pair 4-5 / 7-8
PSNEXT            40.6 dB      36.7 dB      3.9 dB   pair 3-6
ACR-F             31.0 dB      25.8 dB      5.2 dB   pair 1-2 / 3-6
Return loss       17.6 dB      14.8 dB      2.8 dB   pair 1-2 at 90 MHz
Prop. delay       380 ns       498 ns       118 ns   pair 7-8
Delay skew        12 ns        44 ns        32 ns    pair 1-2
\`\`\`
The values here are illustrative; the point is how to read each line.

## Line by line
- **Wiremap pass.** Every pin goes to the right pin, and the twisting is right. Nothing else counts until this is true.
- **Length 71 m.** Under the 90 m limit with room to spare. If the label on the drawing said 40 m, the difference tells you the cable took a longer route than planned, or the NVP setting was wrong.
- **Insertion loss.** Signal lost along the run. The margin is where it is closest to the limit, usually at the highest frequency.
- **NEXT and PSNEXT.** Crosstalk. A very small margin here is a pass but a warning of a terminated untwist near the limit.
- **ACR-F.** The far-end signal against the far-end noise.
- **Return loss.** A margin of 2.8 dB is the smallest on this page, so this is the parameter to watch if cords are later added.
- **Delay and skew.** The cable's travel time, and the spread between the pairs.

## What to do with a thin margin
The tester passes at any positive margin, but a link with 0.2 dB of margin on return loss is one slightly worse connector away from a fail. If the next link nearby has the same story, look at how the connectors were terminated. A consistent thin margin on NEXT suggests untwist; on return loss, tight bends or ties.

## The marginal asterisk
A result marked pass with an asterisk lies within the tester's accuracy of the limit. The tester cannot say it truly passes. Treat it by the contract, and fix the link if the contract treats it as a failure.

> Remember: wiremap first; every other line shows margin to the limit; the worst case tells you which pair to inspect.`,

u6l3: `## A tester session from start to export
A tester session is a routine. Follow it in order every time and the saved results will match the cabling.

\`\`\`
Order  Step                 Why
1      charge unit and remote  a dead remote ends the session
2      check calibration date  an expired tester is not accepted
3      fit the right adapters  permanent link adapters for a permanent link
4      set the reference       removes the adapters' own loss from the result
5      choose the limit        category and permanent link or channel
6      choose the cable type   sets NVP and the family of limits
7      autotest                runs every parameter
8      save under the label    one record per cable label
9      export                  reporting software, kept with the records
\`\`\`

## Worked example: a wrong limit
You test 12 links against the Category 6 limit, but the job specifies Category 6A. All 12 pass. The foreman then asks why the report says Category 6. The links were never held to the stricter 6A limit, so the passes mean nothing. All 12 must be retested with the right limit. Choosing the limit before the first test avoids a full morning of rework.

## Reference, in plain words
The reference measures the tester's own adapters and cords and subtracts them from every result. If you swap an adapter, drop a cord, or leave the tester off for a long break, set the reference again.

## Fiber loss testing
\`\`\`
Step                          Do
1  clean and inspect          every connector, both sides
2  set the reference          with a launch cord on the light source
3  measure                    at both wavelengths
4  compare to the loss budget the allowed total for the link
\`\`\`
Test multimode at 850 and 1300 nm, and singlemode at 1310 and 1550 nm. Total loss comes from a light source and a power meter. An OTDR shows where along the fiber the loss and reflections sit; know what it is, as the exam does not ask you to run one.

> Remember: reference, limit, cable type, autotest, save under the label, export.`,

u7l1: `## Four fault screens
A wiremap screen draws the eight pins at each end with lines between them. Reading it is a matter of seeing where the lines go. Here are four common screens, with the cause and the fix.

\`\`\`
Screen 1  OPEN
  pin 5 shows no line to the far end
  cause: the conductor on pin 5 was not seated in the slot
  fix:   reterminate that pair at the end the tester names, retest

Screen 2  SHORT
  pins 3 and 6 are joined by a line
  cause: a stray strand, or a nicked jacket against a bracket
  fix:   find the touch point, retrim, reterminate, retest

Screen 3  CROSSED PAIRS
  pins 4,5 and 7,8 go straight; pins 1,2 and 3,6 show crossed at the far end
  cause: T568A on one end and T568B on the other
  fix:   rewire one end to match the other, retest

Screen 4  SPLIT PAIR
  all pins connect to the right pins, but a split-pair flag shows
  cause: one wire from each of two pairs swapped on the same pins
  fix:   reterminate to the color code, retest
\`\`\`

## Worked example
A 24-port panel is punched in T568B and the jacks in the offices were punched by a helper in T568A. Every one of the 24 links shows pairs 2 and 3 crossed. The fix is not 24 separate reterminations of random conductors. Pick one standard for the job (the drawings say which), and rewire all the ends that are wrong. If the job is T568B, the helper's 24 jacks are redone.

If only three of the 24 show the fault, the A/B mismatch is unlikely. Suspect a pair punched wrong on those three.

## Why a split pair is hard to see
The pins connect correctly, so a simple continuity tester passes it. The two wires of a pair are no longer twisted with each other, so the crosstalk is high. A tester that checks twisting flags it. If not, it appears as a NEXT failure.

## Safety
If you find a short or damage inside a box, never work in a box or raceway with energized conductors. Stop, and ask the electrician who controls it.

> Remember: open, short, reversed, crossed, split; reterminate the named end and retest.`,

u7l2: `## From symptom to cause
A transmission failure has a short list of causes. The tester's worst-case pair and the distance reading narrow the list.

\`\`\`
Failure          Where it starts             What to inspect
NEXT, near end   the last inches of cable    untwist, jack category, split pair
NEXT, mid-run    the cable itself            a damaged section, a tight tie
Return loss      near a bend or part         kinks, ties, cords of mixed type
Insertion loss   the whole run               length, hot spaces, bad connectors
Length           the run                     route over 90 m
\`\`\`

## Worked example: using the distance reading
A Category 6A link fails NEXT. The tester shows the worst case 1.5 m from the main unit, and the run is 60 m. The fault is near the end where the tester is, so you reterminate that end first and check the untwist: it should be no more than 13 mm (0.5 in). The 1.5 m reading rules out the middle of the cable, so you do not pull anything. After the reterminate, the link passes with 2 dB of margin.

Now the same link, but the worst case is at 31 m. The problem is in the cable, perhaps under a tight tie or a hanger. You walk the pathway near that distance. If the run is long, the number is an estimate, so check a few meters either side.

## Return loss
A kink or a bend tighter than the minimum radius (4 x OD for 4-pair UTP) changes the impedance there and reflects signal. A cable tie pulled until it dents the jacket does the same. Mixed impedance is a part of one kind on a cable of another, such as a Category 5e jack on a Category 6A cable, which also hurts NEXT.

## Insertion loss and heat
Loss grows with length and with temperature. A long run in a hot ceiling space loses more than the same run in a cool riser. A result near the limit on a hot day may pass cool.

## Length over the limit
The permanent link limit is 90 m. Longer means a new route, a closer telecommunications room, or a design change. It is never fixed by reterminating.

> Remember: distance reading first; near an end means reterminate; mid-run means look at the cable.`,

u7l3: `## The method on one page
Troubleshooting is a loop. Each turn tests one idea.

\`\`\`
Step  Do                                   Example
1     gather symptoms                      "no link on B2-014 since Monday"
2     check cord, port, label              swap the cord; port shows active
3     isolate link from cords              permanent link test with adapters
4     change one variable                  reterminate one end only
5     fix and retest                       same test, same limit
6     document                             cause, fix, date, name
\`\`\`

## Worked example
Monday a user reports that a phone does not link. Gather the symptom: the outlet is B2-014, it worked last week, and a desk was moved over the weekend. Check the simple things: a different cord does not help, but the port is active. The label at the panel reads B2-014, and the label at the outlet reads B2-041, so the move may have put the wrong cord on the wrong jack. You find the outlet's cable runs to B2-041's port, which is disabled. The fix is to re-patch the cord to the right port and fix the label. No tester was needed. If the label had matched, the next step is the permanent link test.

If the test then fails with a split pair at the outlet, you change one variable: reterminate that jack to the color code. You retest with the same limit. If it passes, save the result under the same label, and note the fix in the records.

## What not to do
- Do not change the cord, the jack, and the port at once.
- Do not reterminate before the tester says which end.
- Do not leave the old FAIL file in the record. Replace it with the new one.

## Documentation is part of the fix
A repair that is not recorded is repeated. Record what failed, the cause, the fix, and the new test result. If the repair changed a label or a route, update the drawings and the administration record so all agree.

> Remember: simple things first, isolate, one variable, retest, document.`,

u8l1: `## Before you cut anything
An occupied building adds people, hours, and permits to every task. The survey is what keeps the job from stopping on day two.

\`\`\`
Survey item            Ask or look for
Existing pathways      what is there, how full, who owns it
Asbestos report        which areas are cleared; stop if unsure
Live circuits          which cables and boxes are in service
Permits                hot work, core drilling, ceiling access, after hours
Work hours             set by the owner and the AHJ
Occupant sensitivities hospital infection control, offices with meetings
\`\`\`

## Worked example: a cutover plan
An office moves 40 users from old Category 5e to new Category 6A over a weekend. The plan:

1. New cabling is installed, tested, and labeled by Thursday.
2. The change window is Saturday 6 pm to Sunday 6 pm, agreed with the manager.
3. The back-out plan: the old cables and switch stay connected until Sunday noon. If more than a few users fail after the move, the old patch cords go back in.
4. Old and new ends are labeled differently, so nobody pairs a new jack with an old panel port.
5. After Sunday noon, with the new system accepted, the old cables are tagged or removed under the abandoned cable rules.

## Protecting the occupants
Plastic sheeting and drop cloths under an opened ceiling. A vacuum with a filter at the cutting point. Ceiling tiles lifted straight up, set flat, and put back. In a hospital, the facility may require a barrier, negative air, or a permit before any ceiling is lifted. You follow their rules because the dust can reach patients.

## Identify before you touch
An old cable in a ceiling may carry a live circuit. Identify it by records, by tracing, or by asking, before cutting. Never work in a box or raceway with energized conductors; if you find power in a box, stop and call the electrician.

## Labels in a retrofit
Mark every old and new cable at both ends before the cutover. A label on a disconnected cable saves an evening of tracing later.

> Remember: survey, permits, protect the space, identify live circuits, plan the cutover with a back-out.`,

u8l2: `## Is it abandoned? A decision table
The NEC defines abandoned cable as installed cable that is not terminated at both ends and not identified for future use with a tag. Everything else is either in service or intentionally kept.

\`\`\`
Condition found                                 Abandoned?   Action
Terminated at both ends, in use                 no           leave in place
Terminated at both ends, unused                 no           leave; ask owner before removing
Terminated at one end only, no tag              yes          remove accessible portion
Terminated at neither end, no tag               yes          remove accessible portion
Cut at both ends, tagged for future use         no           leave; keep the tag current
Unknown, source or destination not found        not sure     do not cut; trace and ask
Part of a life-safety or building circuit       no           leave; tell the owner
\`\`\`

## Worked example
Above a corridor you find 14 old cables hanging loose. Twelve have both ends cut. Nine of those have no tag, and three carry a faded paper tag reading "future, 2019, B. Lee". The other two are cut at one end and disappear at the other into a wall box you cannot open.

- The nine untagged cables, not terminated at either end: abandoned. Remove the accessible portions.
- The three tagged cables: identified for future use. They are not abandoned, though a faded tag needs checking. Ask the owner whether they are still wanted, and if so, replace the tag with a clear one.
- The two that vanish into the box: unknown, because you cannot see what is at the box end. Trace them, check the records, and ask. Do not cut.

## Confirm before cutting
Check the drawings and administration records, then use a tone and probe, or a tester, to trace each end. Cut a cable only when it is certain to be out of service.

## Safe removal
Cut near one end and pull from the other, coiling as it comes. If it resists, stop. A snag, a tie, or a firestopped sleeve may be holding it. Never yank on a cable because it may bring down a ceiling or other cables. Firestop any penetration you open, and update the records to show what you removed.

> Remember: not terminated at both ends and not tagged equals abandoned; remove the accessible portions after you confirm it is dead.`,

u9l1: `## Who owns what in a shared pathway
In a modern building, one ceiling carries many systems. What you do depends on whose cable it is.

\`\`\`
System        Cable and rules                       Who usually terminates
Data (SCS)    UTP or fiber to the standard          you, the installer
Paging        low-voltage speaker cable             the audio contractor
Sound masking low-voltage speaker or control cable  the sound contractor
Clocks        as the maker specifies                the clock contractor
Nurse call    listed cable per the design           the nurse-call contractor
BAS           controller cable, often shielded      the controls contractor
Fire alarm    listed fire alarm cable, own pathway  the fire alarm contractor
Elevator      as the elevator contractor specifies  the elevator contractor
\`\`\`
Always confirm with the foreman. The row above is a pattern, not a promise.

## Worked example
Your crew pulls 60 data cables through a corridor ceiling. An existing yellow-jacketed cable in the pathway turns out to be the fire alarm circuit. You do not move it, cut it, or tie your cables to its supports, because life-safety circuits have their own supports and identification. You route your cables on separate supports, with space from the fire alarm cable. When you need to cross it, you cross it, and you do not bundle.

Another cable at the end of the corridor is unlabeled. You do not cut it. You ask the foreman, who traces it to the sound contractor.

## Coordination
Agree the pathway, the order of work, and who firestops each penetration. The data crew pulls and labels; the system contractor terminates and tests its own system.

## Records
Add the other systems' cables to the drawings and administration records, with identifiers at both ends. The next installer will not guess what a cable is.

> Remember: right cable and listing for the system, life safety separate, the contractor terminates, everything labeled.`,

u9l2: `## PoE types
\`\`\`
Type   Power at the source   Typical devices
1      15.4 W                basic phones, simple sensors
2      30 W                  access points, many cameras
3      60 W                  larger cameras, thin clients
4      90 W                  high-power displays and lighting
\`\`\`
The source is the PSE, in a switch or an injector. The powered device (PD) always receives less than the source sends, because the cable itself dissipates some of the power as heat.

## Why bundles heat
Power flowing in the conductors makes heat. In a large bundle, the inside cables lose heat to the cables around them, so the temperature climbs. A warmer cable has more resistance, and loses more power and signal, which can push insertion loss toward the limit and strain the PoE budget.

## Worked example: bundle size
A closet feeds 48 type 4 (90 W) devices. The designer's first plan bundles all 48 cables together in one ceiling tray. The bundle is at the maximum power each cable can carry, all in contact, so the middle cables are the hottest. The installer's options are:

\`\`\`
Option                       Effect
smaller bundles              each cable has more cooling surface
higher-category cable        larger conductors, less resistance, less heat
separation between bundles   air moves between bundles
fewer cables on one support  less contact, less temperature rise
\`\`\`
Choose the combination the design allows. Splitting the 48 cables into several smaller bundles, tied loosely and spaced on the tray, is a practical answer, using a higher-category cable if the designer calls for it. The exact limit is set by the manufacturer and the design, so ask.

## Wireless and DAS
An AP in a ceiling needs an outlet with slack, labeled with its AP number. A DAS carries cellular signals on coaxial or fiber cable, and is usually designed and terminated by its own contractor. Recognize it and coordinate.

## Cameras and access control
Both are common PoE devices. Plan the pathway and the power budget with the designer, and label every outlet so the security contractor and the next tech find each device.

> Remember: 15.4, 30, 60, 90 W at the source; heat builds in big bundles, so smaller bundles, higher category, and separation.`

      s1: "Pin 7 has no line to the far end. A conductor with no connection is an open, usually one that did not seat in its slot.",
      s2: "Pins 1 and 2 arrive on each other's pins, so the tip and ring of one pair are swapped. That is a reversed pair, and the fix is to reterminate that pair.",
      s3: "Pins 1 and 2 arrive on pins 3 and 6, and 3 and 6 arrive on 1 and 2, while the blue and brown pairs run straight. That is the signature of T568A at one end and T568B at the other: crossed pairs.",
      s4: "Every pin lands on the same pin, but NEXT fails. A wire from one pair has traded places with a wire from another, so each pair is no longer twisted with its own mate. That is a split pair.",
      fix: "Crossed pairs come from the two ends using different schemes. Reterminate one end so both ends match, then retest. The cable and the jacks are fine.",
      blind: "A split pair connects every pin to the right pin, so a basic continuity check passes it. It shows up only on a tester that checks twisting, or as a NEXT failure."
    }
  };
})();

// INST1 Academy question bank, units 1 to 3. All questions are original jobsite scenarios.
window.FRA = window.FRA || {};
FRA.questions = FRA.questions || [];
FRA.questions.push(
// u1l1
{id:"u1l1-1",t:"u1l1",q:"A new HVAC duct hangs exactly where the drawing routes your cable. What is the FIRST thing to do?",a:["Hang the cable from the duct hangers since they are close and already in place","Stop work on that route and tell the foreman so the designer can settle it","Route the cable under the duct and note the change on your own copy later","Move the duct a short way so that your pathway matches the drawing exactly"],c:1,e:"Conflicts between trades go up the chain to the foreman and the designer. Hanging from the duct, moving it, or working around it all touch another trade's work or break the plan."},
{id:"u1l1-2",t:"u1l1",q:"You need to move a device that sits on the fire alarm circuit above the ceiling you are working in. Who owns that work?",a:["The electrician on the floor, because the circuit is low-voltage wiring in a conduit","The HVAC contractor, because the devices hang in the same ceiling space as its ducts","The fire alarm contractor, so you ask the foreman to have that trade move it","The general contractor's cleanup crew, who handle loose items in the ceiling"],c:2,e:"Each trade owns its own work. You never move or cover another trade's devices; the foreman arranges it with the trade that owns the fire alarm system."},
{id:"u1l1-3",t:"u1l1",q:"At the end of the shift, cable scraps, packaging, and dust lie in the corridor. What is the expected practice?",a:["Leave it for the general contractor's cleanup crew at the end of the whole project","Stack it neatly in a corner of the corridor so it is easy to find the next shift","Sweep only the areas the owner is most likely to walk through the next day","Clean up daily before leaving"],c:3,e:"Daily cleanup is part of professional conduct. Debris left overnight is a trip hazard, a fire load, and a sign of careless work."},
{id:"u1l1-4",t:"u1l1",q:"A helper who has just passed Installer 1 wants to specialize in splicing and terminating fiber. Which certificate comes next?",a:["Installer 2 Optical Fiber, which builds on the Installer 1 skills with fiber work","RCDD, the design credential that comes directly after Installer 1 on the installation pathway","Installer 2 Copper, which covers fiber splicing and termination in more depth than Installer 1","A second Installer 1 certificate, which must be renewed"],c:0,e:"Installer 1 is nonrenewable and leads to Installer 2 Copper or Installer 2 Optical Fiber, then the Technician level. The RCDD belongs to the later design path."},
{id:"u1l1-5",t:"u1l1",q:"During a pull you notice a section of cable was kinked, and the foreman is busy on another floor. What is the BEST action?",a:["Pull the rest of the cable through, then test the whole run once and keep it if it passes the tester","Report the damaged cable to the foreman now and replace it rather than leaving it in the wall","Mark the spot and cut the kinked section out later, splicing the cable so the run stays in service","Leave the kink inside the wall and hide it behind the faceplate for now"],c:1,e:"A kinked cable is damaged and must be replaced. Reporting problems early is part of honest, workmanlike conduct, and it costs far less than finding the defect at inspection."},

// u1l2
{id:"u1l2-1",t:"u1l2",q:"You are about to start a task in an area you have never worked. What should you do FIRST?",a:["Start the task and correct hazards as they appear while you work","Begin with the easiest part of the task to learn what the space is like","Review the site safety plan and the hazards","Ask the nearest worker which hazards were worst during the last month"],c:2,e:"The safety plan and a job hazard review come before the task. Each hazard gets a control before work starts, not after the near miss."},
{id:"u1l2-2",t:"u1l2",q:"The foreman checks how you set an extension ladder against a wall. Which pitch rule is he looking for?",a:["Base out 1 unit for every 2 units of height so the ladder is steep","Base out 1 unit for every 8 units of height so that it stands nearly upright","Base directly against the wall, with the top tied off to a ceiling grid wire","Base out 1 unit for every 4 units of working height of the ladder"],c:3,e:"The 4-to-1 rule puts the base 1 unit out for every 4 units of working height. Too steep tips backward and too shallow lets the base slide out."},
{id:"u1l2-3",t:"u1l2",q:"You will step off an extension ladder onto a landing. What is the BEST way to set the top of the ladder?",a:["Extend it 1 m (3.28 ft) above the landing so you can step on and off safely","Stop it level with the landing so the rails do not catch your tool belt as you step across","Extend it 3 m (10 ft) above the landing so that the ladder cannot tip toward the building","Place it so that the top rung is even with the landing edge for balance"],c:0,e:"The ladder top extends about 1 m (3.28 ft) above a landing, which gives something to hold when stepping on and off. Never join two ladders unless they were built to be joined."},
{id:"u1l2-4",t:"u1l2",q:"A panel near your work has no label and the foreman cannot be reached. May you assume it is de-energized?",a:["Yes, because an unlabeled panel is normally not connected to any service, so it cannot hurt you","No, treat it as live; only the person who controls the circuit locks and tags it","Yes, when every breaker handle is in the off position, since an off handle proves the circuit is dead","No, unless a coworker tells you that he checked it with his meter earlier"],c:1,e:"Installers never work on energized power. Lockout and tagout is done by the person who controls the circuit, and unknown wiring is treated as live."},
{id:"u1l2-5",t:"u1l2",q:"Coring a concrete slab throws up fine gray dust. What is the BEST control?",a:["Open a window and let the dust settle on the floor before you sweep","Wear a paper mask, since the dust cannot reach your lungs through it","Use water or a vacuum at the cutting point and wear a respirator, because the dust contains silica","Move the crew to another floor while the dust settles after each core"],c:2,e:"Drilling and coring concrete makes silica dust. Water or a vacuum controls it at the source, and a respirator protects the person near the cut."},

// u1l3
{id:"u1l3-1",t:"u1l3",q:"The ceiling above a corridor is an air return. Which jacket print shows a cable is acceptable there?",a:["General purpose rating printed on the jacket, matching the category the job needs","Limited use rating printed on the jacket, which suits short runs in raceways","Riser rating printed on the jacket, since it covers both floors and ceilings","Plenum rating (CMP) printed on the jacket, matching the category the job needs"],c:3,e:"An air-handling ceiling is a plenum, and cable there must carry a plenum rating (CMP). A lower rating, even a good cable, is a violation in that space."},
{id:"u1l3-2",t:"u1l3",q:"A designer needs a cable rated to 250 MHz for the new drops. Which cable fits that rating?",a:["Category 6, which often has a spline or a tighter twist to control crosstalk","Category 5e, which is the minimum for new work and is rated at 350 MHz at the high end","Category 6A, the augmented type, whose rating of 250 MHz comes with a thinner outside diameter","Category 3, which is the older voice grade cable with a short run length"],c:0,e:"Category 6 is rated to 250 MHz. Category 5e is 100 MHz and Category 6A is 500 MHz, and Category 6A also has a larger outside diameter."},
{id:"u1l3-3",t:"u1l3",q:"Why do patch cords use stranded conductors when permanent horizontal runs use solid ones?",a:["Stranded carries more signal than solid, so cords can be any length at all","Stranded flexes without breaking but loses more signal, so cords stay short","Solid conductors cannot be punched down, so cords use stranded wire only","Solid conductors are banned in cords by code, though they carry the signal better"],c:1,e:"Stranded wire flexes without breaking but loses more signal, so cords stay short. Solid wire suits permanent runs and punches down onto an IDC."},
{id:"u1l3-4",t:"u1l3",q:"A voice backbone uses large multipair cable. Which describes how its pairs are grouped?",a:["Twelve pairs per group so that each group matches one strand of the 12-color fiber code","Pairs stranded together around a metal center spine with a single color code for the whole cable","Bundled pairs in 25-pair binder groups, each group marked by a colored binder","Four pairs in a foil wrap with a drain wire on each pair"],c:2,e:"Multipair backbone cable is built in 25-pair binder groups, and a colored binder identifies each group in a large cable."},
{id:"u1l3-5",t:"u1l3",q:"Which coax cable is the standard 75 ohm choice for new video and cable television runs?",a:["RG-59, which is the thickest and has the lowest loss of the three common types","RG-11, which is made only for short runs of camera cable inside a rack","RG-58, which is a 75 ohm cable and the usual choice for radio systems","RG-6, standard for new video"],c:3,e:"RG-6 is the standard 75 ohm cable for video and cable television. RG-59 is older and thinner with more loss, and RG-11 is thick, low-loss feeder cable."},

// u1l4
{id:"u1l4-1",t:"u1l4",q:"A reel arrives with an orange jacket, but the drawing calls for aqua fiber. What is the BEST way to find out what the fiber really is?",a:["Read the type printed on the jacket, because jacket color is a convention and not a rule","Return the whole reel because aqua is the only color OM3 and OM4 may use","Call the manufacturer and wait for an answer before anyone touches the reel","Assume orange means OM1 and keep it until a tester shows a different loss"],c:0,e:"Jacket color is voluntary and varies by maker. The print on the jacket gives the true type, so read it before judging the reel."},
{id:"u1l4-2",t:"u1l4",q:"A designer specifies a fiber with a core of about 9 micron for a long link between buildings. Which fiber type is that?",a:["OM3 multimode, laser optimized, used for short links in the building","Singlemode (OS1 or OS2)","OM5 wideband multimode in lime green, used for short wideband links","OM1 multimode, with a 62.5 micron core and an orange jacket"],c:1,e:"Singlemode fiber has a core of about 9 micron and usually a yellow jacket. All multimode fibers have a larger core, 50 or 62.5 micron."},
{id:"u1l4-3",t:"u1l4",q:"A cable must run outdoors and then enter the building. Which construction is made for the outdoor stretch and must be transitioned inside?",a:["Tight buffer, with a 900 micron coating on each fiber, used inside buildings","Plenum jacket, with a flame-retardant coating on tight buffered fibers","Loose tube, with 250 micron fibers floating in a gel or dry tube, transitioned at the entrance","Interlocking armor, which makes the cable safe to run anywhere in the building"],c:2,e:"Loose-tube cable protects fibers from water and suits outdoor runs, but it must be transitioned to inside cable at the building entry. Tight buffer is the inside style."},
{id:"u1l4-4",t:"u1l4",q:"In a 24-fiber cable you are asked to terminate strand 14. What color is it?",a:["Orange with no tracer, because the colors only repeat after strand 24","Blue with a black tracer, since it is the first color of the second group","Brown with a yellow tracer, since every strand in the second group is yellow","Orange with a black tracer, the second color in the second group of twelve"],c:3,e:"Strands 13 to 24 repeat the 12-color code with a black tracer. Strand 14 is the second color, orange, so it is orange with a black tracer."},
{id:"u1l4-5",t:"u1l4",q:"An armored fiber cable with interlocking armor enters the TR. What must be done with the armor?",a:["Bond it to the telecom bonding system, because it is a metal path","Tie it to the rack frame with cable ties so it cannot move","Cut it back to the jacket and leave it unterminated to avoid shorts","Ground it at the far end only, where the cable leaves the outdoor trench"],c:0,e:"Interlocking armor is metal, so it is bonded to the telecom bonding system. Plain jackets need no bonding."},

// u1l5
{id:"u1l5-1",t:"u1l5",q:"The foreman unrolls a floor plan. Which part of the sheet tells you whether you hold the current drawing?",a:["The general notes in the bottom corner of the sheet","The revision entry and date in the title block","The legend with all of its telecom symbols","The scale printed under the floor plan drawing"],c:1,e:"The title block carries the sheet number and the revision. Always confirm the latest revision before you build from a drawing."},
{id:"u1l5-2",t:"u1l5",q:"A symbol of a triangle with a filled corner appears on the sheet. What decodes it?",a:["The foreman's memory of the last job on the same floor","The standard symbol chart, because a triangle always means a voice outlet","The legend on that sheet, since symbols differ from job to job","The reflected ceiling plan, which repeats every symbol in the building"],c:2,e:"Each sheet's legend decodes its own symbols. The same shape can mean different things on another job, so read the legend first."},
{id:"u1l5-3",t:"u1l5",q:"The plan shows an outlet on a wall that is not there in the field because a duct occupies the space. What is the FIRST step?",a:["Move the outlet to the nearest clear wall and update the label to match","Install the outlet on the duct so that it is at the right spot","Wait for the inspector, who will tell you where the outlet should be","Stop, ask the foreman to get the designer's answer in writing, and mark the change on the as-built set"],c:3,e:"When the drawing and the field disagree, stop and ask the designer, then document the change so the record matches what was built."},
{id:"u1l5-4",t:"u1l5",q:"Which sheet shows how the floors connect and the backbone between telecom rooms?",a:["The riser diagram, which shows the connection between floors","A schedule, which lists the outlets and the cable in a table","A floor plan, which shows outlets and rooms on a single level","A reflected ceiling plan, which shows devices and lights in the ceiling"],c:0,e:"A riser diagram shows how floors connect and the backbone between TRs. A floor plan shows one level, and a schedule is a table."},
{id:"u1l5-5",t:"u1l5",q:"You need a table listing every outlet ID and the cable to it. Where do you look?",a:["A detail sheet showing the rack mounting at a larger scale of the drawing","A schedule","The title block, which carries the outlet counts for the whole floor","The reflected ceiling plan, which lists every device that hangs in a ceiling"],c:1,e:"Schedules are tables that list outlets, cable, or equipment. Check that the schedule and floor plan agree."},

// u1l6
{id:"u1l6-1",t:"u1l6",q:"A delivery arrives with one crushed carton and the driver wants a signature. What do you do before signing?",a:["Sign and open the carton later when the foreman has time to look","Refuse the entire pallet and send the driver away with it","Note the damage on the slip","Sign without a note, since the crushed box is only a packaging issue"],c:2,e:"Check the delivery and write the damage on the delivery slip before signing. Once signed clean, the shortage or damage is hard to claim."},
{id:"u1l6-2",t:"u1l6",q:"The box label says CMP, but the jacket on the first reel reads CMR, and the ceiling is an air return. What do you do?",a:["Install it, since riser cable is close enough to plenum cable for a ceiling","Install it above the grid only, where the inspector will not see the print","Cut it into short sections so the jacket print cannot be read at all","Reject the reel, because riser cable cannot replace plenum cable in an air-handling ceiling"],c:3,e:"The jacket print decides, not the carton. A lower rating can never replace a higher one, so a CMR reel cannot go in a plenum."},
