{id:"u1l6-3",t:"u1l6",q:"Which tool seats and trims a wire on an insulation displacement connector?",a:["A punch-down tool, with the blade matched to the type of block","A crimper, with dies matched to the modular plug, which seats each wire into its contact","A fish tape, which presses each wire into the jaws of the contact as it is pulled through","A label maker, which prints the identifier for the contact"],c:0,e:"A punch-down tool seats the wire into the IDC and trims it. A crimper attaches plugs and a fish tape pulls string or cable."},
{id:"u1l6-4",t:"u1l6",q:"A pull starts with the reel's footage mark reading 3100 and ends with the mark reading 2650. How much cable did the pull use?",a:["550 ft","450 ft","5750 ft","2650 ft"],c:1,e:"The marks count down, so the pull used 3100 - 2650 = 450 ft. Adding the marks gives 5750, and the last mark is only what remains on the reel."},
{id:"u1l6-5",t:"u1l6",q:"Where should reels be staged overnight?",a:["Outside the building by the dock where the next delivery crew will find them","In the corridor so that every trade can see how much cable is left","Covered and off a wet floor","In the ceiling above the work area where they are out of the way"],c:2,e:"Keep reels covered, off a floor that can get wet, and where the crew can find them and strangers cannot."},

// u1l7
{id:"u1l7-1",t:"u1l7",q:"A tech finds a cable labeled only at the TR end, with the outlet end bare. What is wrong with that labeling?",a:["Only the outlet end needs a label since the TR already has a panel","Nothing is wrong, because the panel record already tells a tech which outlet the cable serves","The TR end label should be handwritten, so that it can be corrected when the outlet changes","Both ends need the same identifier, and it names both ends of the cable"],c:3,e:"Every cable is labeled at both ends with the same identifier, and that identifier names both ends so either end leads to the other."},
{id:"u1l7-2",t:"u1l7",q:"Which label placement and material is the BEST practice?",a:["A machine-printed, durable label placed within sight of the end where it can be read without moving the cable","Printed on a sheet taped to the wall behind each panel in the room","Handwritten in marker directly on the jacket near the last bundle tie","Handwritten on tape, hung from the cable in a loose flag at the end"],c:0,e:"Machine-printed, durable labels placed within sight of the end can be read without moving the cable. Handwriting smudges and flags fall off."},
{id:"u1l7-3",t:"u1l7",q:"A cable identifier on this job reads 3A-PP2-14 / 3-306-B. What does it tell a tech?",a:["Fourteen cables from TR 3A, panel 2, running to two outlets labeled B in room 306","Panel port 14 on panel 2 in TR 3A, and outlet B in room 306 on floor 3","Room 14 on floor 3 at panel 2, and room 306 holding 3 outlets labeled A and B","Room 14 on floor 3 and room 306 on panel B"],c:1,e:"A cable identifier names both ends. Here the panel end is port 14 on panel 2 in TR 3A, and the outlet end is port B in room 306 on floor 3."},
{id:"u1l7-4",t:"u1l7",q:"Which items must agree with the label before handoff?",a:["The tester file alone, because the label may be replaced later","The label and the invoice only, since the other records are optional","The label, the drawing, the panel record, and the tester file, each repeating the same identifier for the cable","The label and the customer's phone list, which is used for moves"],c:2,e:"The label, drawing, panel record, and tester file must all agree. A mismatch makes a defect that wastes a tech's time later."},
{id:"u1l7-5",t:"u1l7",q:"Which items on the job need a unique identifier in the labeling scheme?",a:["Only the outlets and the cables, since the rest are visible by their location","Every cable and the faceplates, with the TR identified by a sign","Only the items the inspector asks about at the final walk-through","Every space, panel, port, cable, pathway, and bonding conductor"],c:3,e:"A scheme gives a unique identifier to every space, panel, port, cable, pathway, and bonding conductor, all in one consistent pattern."},

// u2l1
{id:"u2l1-1",t:"u2l1",q:"The inspector says a cable must come out, though you point out that the standard allows it. Who wins?",a:["The code, enforced by the AHJ","The standard, because it was written by technical experts in the field","The foreman, who has the last word on any dispute with an inspector","The manufacturer, whose installation sheet overrides any local rule"],c:0,e:"A code is law once adopted, and the AHJ enforces it. A standard binds only when a code or contract calls for it."},
{id:"u2l1-2",t:"u2l1",q:"A subcontract says to install cabling per a TIA standard. What does that do to the standard?",a:["Nothing, since a standard is only advice and never has any force on a job","It makes the standard binding on the job, because the contract calls for it","It turns the standard into a law that applies to every building in the state","It makes the standard apply only to the cable, not to pathways or spaces"],c:1,e:"A standard is a consensus document that becomes enforceable when a code, contract, or specification calls for it."},
{id:"u2l1-3",t:"u2l1",q:"A product carries an NRTL label such as UL. What does that tell the inspector?",a:["It is guaranteed to meet the manufacturer's warranty in every building","It is approved for any use as long as the installer follows the print","It is listed for a stated use and may be installed only for that use","It has been banned from use in plenums until the lab retests it"],c:2,e:"An NRTL tests a product and lists it for a stated use. A listing for one use does not make the product acceptable for another."},
{id:"u2l1-4",t:"u2l1",q:"The foreman asks which standard to check for the room sizes and pathways on the job. Which one covers pathways and spaces?",a:["TIA-607","TIA-568","TIA-606","TIA-569"],c:3,e:"TIA-569 covers pathways and spaces. TIA-568 covers the cabling, TIA-606 administration, and TIA-607 bonding."},
{id:"u2l1-5",t:"u2l1",q:"The drawing, a standard, and the local code each give a different separation distance. Which controls?",a:["The stricter requirement, and the AHJ settles anything unclear after you ask in writing","The drawing, since the designer wrote it and the inspector reads it","The shortest distance, because it saves the owner money on the cable","The standard, because it is newer than the drawing and the local code"],c:0,e:"The stricter requirement wins, and local codes can be stricter than national ones. Ask the designer in writing and let the AHJ settle anything unclear."},

// u2l2
{id:"u2l2-1",t:"u2l2",q:"The ceiling above a corridor is an air return. Which cable rating is the BEST choice to install there?",a:["CMR, riser rated","CMP, plenum rated","CM, general purpose","CMX, limited use"],c:1,e:"Plenum spaces require plenum (CMP) cable, the highest rating. Riser, general, and limited-use cable have lower ratings and may not go there."},
{id:"u2l2-2",t:"u2l2",q:"Leftover CMG is on the cart, and the next run goes through a plenum. What do you do?",a:["Install it, since it is only a short run above one room","Install it inside a short piece of conduit to hide the print","Do not install it","Tape a CMP label on the jacket and tell the foreman it is plenum"],c:2,e:"General cable can never replace plenum cable, even for a short run. A missing or false rating is a violation the inspector will find."},
{id:"u2l2-3",t:"u2l2",q:"A reel of CMR remains and the next run is on one floor with no air handling above. May you use it?",a:["No, since only general rated cable may be used on a single floor","No, because riser cable is made only for vertical shafts and risers","Yes, but only after you cover the print with a general-cable label","Yes, since a higher rating may replace a lower one"],c:3,e:"A higher rating may replace a lower one, so riser cable may go where general cable is required. The reverse is never allowed."},
{id:"u2l2-4",t:"u2l2",q:"The jacket print on a cable is missing and the reel has no box. What is the BEST action?",a:["Treat it as unrated and do not install it","Use it in the ceiling, since the manufacturer's color suggests plenum","Test it with a cable tester, and install it if it passes the test","Use it only in a short run where the inspector will not look"],c:0,e:"Without a print there is no proof of the rating. Treat the cable as unrated, because the rating comes from the listing printed on the jacket."},
{id:"u2l2-5",t:"u2l2",q:"Which describes CMX cable?",a:["Plenum rated cable for the air-handling spaces of every commercial building","Limited use cable, for short runs in dwellings and raceways, and not for plenums, risers, or general commercial runs","General purpose cable for horizontal runs in every commercial building","Riser rated cable for vertical runs between floors in a firestopped shaft"],c:1,e:"CMX is the lowest rating. It is limited to dwellings and raceways in short runs, and cannot replace CMG, CMR, or CMP."},

// u3l1
{id:"u3l1-1",t:"u3l1",q:"A designer asks whether a 92 m cable route to the far corner can be built as a horizontal permanent link. What is the longest permanent link allowed?",a:["110 m (361 ft)","100 m (328 ft)","90 m (295 ft)","80 m (262 ft)"],c:2,e:"The permanent link is 90 m (295 ft), so a 92 m route fails. The 100 m (328 ft) figure is the channel, which adds the cords, and cords never make up for a long link."},
{id:"u3l1-2",t:"u3l1",q:"Two TRs on the same floor are connected by a cable. How is that cabling classified?",a:["Horizontal cabling, because both rooms are on the same floor of the building","Work area cabling, because it ends at equipment in each room of the floor","An interconnect, because it joins two panels without a patch cord between","Backbone"],c:3,e:"Cabling between two TRs is backbone, even when they are on one floor. Horizontal cabling runs from the outlet to the TR."},
{id:"u3l1-3",t:"u3l1",q:"How many levels of cross-connect are allowed in horizontal cabling?",a:["One","Two, one at the TR and one at the work area in a consolidation panel","Three, one at each floor and one in the equipment room","Any number, as long as every panel is labeled at the front"],c:0,e:"Horizontal cabling allows one cross-connect level only, with no tandem patch panels between the outlet and the TR."},
{id:"u3l1-4",t:"u3l1",q:"What is not allowed in horizontal copper cabling?",a:["A patch panel in the TR with a label at the front of each port","A bridged tap or a splice","A cord of a few meters at the work area outlet to the equipment","A cable with a jacket print that shows the category and rating"],c:1,e:"Bridged taps and splices are not allowed in horizontal copper cabling. The permanent link runs unbroken from the outlet to the panel."},
{id:"u3l1-5",t:"u3l1",q:"The route to an outlet scales to 78 m, and the user's cords total 8 m. What is the channel length?",a:["98 m","70 m","86 m","100 m"],c:2,e:"Channel length = permanent link + cords = 78 + 8 = 86 m, under the 100 m channel limit. Subtracting the cords gives 70 m, and 100 m is the limit, not the length."},

// u3l2
{id:"u3l2-1",t:"u3l2",q:"The farthest outlet on a floor will be 96 m of cable from the planned TR. What is the BEST response?",a:["Pull it anyway, since the cords add only 10 m, which is a small amount","Pull a thinner cable so that the signal loss stays within the limit","Ask the user to plug in a long cord that is 10 m longer than normal","Move the TR or add one so that no horizontal run passes 90 m"],c:3,e:"No horizontal run may pass 90 m, so the room has to move or another TR or TE is needed. Cords cannot make up the difference."},
{id:"u3l2-2",t:"u3l2",q:"A TE is planned for a zone on one floor. Which statement about it is correct?",a:["It serves at most 335 square meters (3600 square feet) on a floor and never replaces a TR","It serves a zone of any size, so long as it is locked","It serves any floor if the TR is full of equipment","It replaces the TR for any floor smaller than the first floor"],c:0,e:"A TE serves at most 335 square meters (3600 square feet) on a floor. It is a cabinet for a small zone and never a substitute for a TR."},
{id:"u3l2-3",t:"u3l2",q:"Which of these does not belong in a TR?",a:["A lockable door wide enough to move equipment in or out","A water pipe over the racks","Conditioned air and clean, dry floors in the room","Dedicated, nonswitched power outlets for the equipment"],c:1,e:"Water pipes or drains over equipment, unrelated equipment, and storage do not belong in a TR. The room needs a lock, clean air, power, and bonding."},
{id:"u3l2-4",t:"u3l2",q:"You are mounting the plywood backboard in a TR. Which choice matches the rule?",a:["Void-free 12 mm plywood on the ceiling, left unpainted so the stamp shows","Any thin plywood on one wall, painted black to hide the grain of the wood","Void-free 19 mm (3/4 in) plywood on at least two walls, with two coats of fire-retardant paint unless the code requires treated plywood","Sheets of particleboard on every wall, painted white to reflect the light"],c:2,e:"The backboard is void-free plywood, usually 19 mm (3/4 in), on at least two walls, with two coats of fire-retardant paint. Treated plywood is not painted."},
{id:"u3l2-5",t:"u3l2",q:"The architect asks where the TRs belong in a three-story building. What is the rule?",a:["One for every ten outlets, wherever the floor space is available","One in the basement that serves all three floors through long cables","One on the middle floor only, with the other floors served by cords","At least one per floor, placed so that no horizontal run passes 90 m"],c:3,e:"There is at least one TR per floor, on the same floor as the work areas it serves, and it is placed so that no horizontal run passes 90 m."},

// u3l3
{id:"u3l3-1",t:"u3l3",q:"A new floor-standing rack arrives. Which is the correct way to secure it?",a:["Bolt it to the floor with expansion anchors, flat washers, and lock washers, and brace the top","Set it on the floor and rely on the weight of the equipment to hold it","Screw it to the wall with drywall screws and leave the floor free","Tie it to the nearest cable tray with cable ties after the cables are in"],c:0,e:"Anchor a floor rack with expansion anchors, flat washers, and lock washers, and brace the top to the wall, a tray, or a ladder rack."},
{id:"u3l3-2",t:"u3l3",q:"A crew wants to push a rack tight against the back wall to save floor space. What is the problem?",a:["Racks may not touch a wall because the bonding conductor would then be too short to reach it","The front and rear must remain accessible so the equipment can be serviced","Racks must stand 305 mm (12 in) from the wall so that air can circulate through every unit","Nothing, since all racks are serviced from the front side"],c:1,e:"Use double-sided racks and keep both the front and the rear accessible. A rack tight against a wall cannot be serviced."},
{id:"u3l3-3",t:"u3l3",q:"A crew hangs a bundle of two hundred cables from D-rings. What is wrong with that choice?",a:["D-rings may carry any number of cables, provided every cable in the bundle is labeled","D-rings are banned in telecom rooms by code, so every bundle must hang from a ladder rack","D-rings suit small bundles and jumpers, and a large bundle needs a ladder rack","D-rings are used only in the entrance facility and never in a TR"],c:2,e:"D-rings are fine for small bundles and cross-connect jumpers, but they never replace a ladder rack for a large bundle of cable."},
{id:"u3l3-4",t:"u3l3",q:"You are drawing a rack elevation and need to know how much height each rack unit takes. How tall is 1 U?",a:["150 mm (6 in)","25 mm (1 in)","90 mm (3.5 in)","45 mm (1.75 in)"],c:3,e:"One rack unit is about 45 mm (1.75 in). A piece of equipment is described by the number of rack units it occupies."},
{id:"u3l3-5",t:"u3l3",q:"A small zone gets a wall-mounted rack. What is the BEST way to mount it?",a:["Lag bolts and washers into the plywood, after checking that the wall will carry the full load","Adhesive strips rated for light equipment, with the top braced to a pipe","Screws into the drywall alone, spaced about every foot along the sides","Plastic anchors into the plaster, with the heaviest equipment at the top"],c:0,e:"A wall rack goes on lag bolts and washers into the plywood, and the wall has to carry the full load of equipment and cable."},

// u3l4
{id:"u3l4-1",t:"u3l4",q:"You are routing the conductor that runs from the primary bonding busbar to the electrical service's grounding electrode system. Which conductor is it?",a:["The TBB, which links the PBB to the SBB in each telecom room","The BCT, which is kept as short as possible","The grounding equalizer, which evens out potentials between TRs","The rack bonding conductor, which runs from the busbar to each rack"],c:1,e:"The bonding conductor for telecommunications (BCT) connects the PBB to the electrical service's grounding electrode system and is kept as short as possible."},
{id:"u3l4-2",t:"u3l4",q:"An old drawing shows a TMGB in the entrance facility. What is the current name for it?",a:["The secondary bonding busbar, which is the busbar found in each floor's TR","The rack bonding conductor, which replaced the old name for it on each rack","The primary bonding busbar (PBB), the one busbar for the building in the entrance facility","The telecommunications bonding backbone, which runs up the riser"],c:2,e:"The TMGB is now the primary bonding busbar (PBB). The TGB is now the secondary bonding busbar (SBB)."},
{id:"u3l4-3",t:"u3l4",q:"The riser drawing shows a conductor running up the building from the PBB to the SBB on each floor. What is it called?",a:["TMGB","BCT","TEBC","TBB"],c:3,e:"The telecommunications bonding backbone (TBB) links the PBB to each SBB. The BCT goes to the electrical service's grounding electrode system, the TEBC is the old name for the rack bonding conductor, and the TMGB is the old name for the PBB."},
{id:"u3l4-4",t:"u3l4",q:"An old copper water pipe runs near the TR. May it be the telecom ground path?",a:["Do not use it as the telecom ground path on its own, because the path can be broken","Yes, because metal pipes are the best path to the earth in every building and are bonded already","Yes, if the plumber signs off on the pipe after testing every joint, with no other conductor needed","Only for the racks that sit closest to the pipe in the TR"],c:0,e:"A water pipe is not a dependable bonding path on its own, since the pipe can be broken or replaced with plastic. Use the telecom bonding system."},
{id:"u3l4-5",t:"u3l4",q:"Which items are bonded to the telecom bonding system?",a:["Only the racks, since all the other metal parts are bonded by the electrician","Racks, cable tray, shields, armored cable, and the entrance protector","The ceiling grid and light fixtures along each pathway in the corridor","Plastic conduit and cable ties used to support the cables in the ceiling"],c:1,e:"Racks, cable tray and ladder rack, shields, armored cable, and the entrance protector are all bonded, each with a conductor back to the busbar."},

// u3l5
{id:"u3l5-1",t:"u3l5",q:"A rack's mounting surface is painted. How do you make the bonding connection?",a:["Bolt the lug over the paint and tighten it firmly with a wrench","Wrap the conductor around the rack leg and tape it in place","Scrape the paint to bare metal, apply antioxidant compound, then make the connection with a two-hole compression lug","Use a lug that is made for a larger conductor so it grips the paint"],c:2,e:"Paint insulates. Scrape to bare metal, apply antioxidant compound, and bolt a two-hole compression lug to make a joint that lasts."},
{id:"u3l5-2",t:"u3l5",q:"Three racks stand in a row. The crew wants to run one conductor to the first rack and jump to the next two. Is that allowed?",a:["Yes, because a single conductor is shorter and is easier to label","Yes, if the jumpers are made of a larger conductor than the main","No, but only the last rack in a row needs its own conductor","No; each rack gets its own conductor back to the busbar"],c:3,e:"Daisy-chaining is never done, since one loose joint takes every later rack off the bond. Each rack gets its own conductor back to the busbar."},
{id:"u3l5-3",t:"u3l5",q:"How should a bonding conductor be routed from the busbar to a rack?",a:["The shortest path, with no bend tighter than 90 degrees and a radius of at least 203 mm (8 in)","Along the longest path, to keep it clear of the cable pathways","Coiled into loops behind the rack so extra length is always on hand","Through a tight bend at each corner, held down with cable staples"],c:0,e:"Route it by the shortest path with no sharp bends. The minimum bend radius is 203 mm (8 in) and it is never bent to less than 90 degrees."},
{id:"u3l5-4",t:"u3l5",q:"Who verifies bonding resistance and records it after the bonding is complete?",a:["The inspector, who measures it after the ceiling tiles are replaced and records it in the permit file","The electrician or the testing technician, against the recommended maximum of 0.1 ohm","The cable installer, who measures it with a continuity beeper and records 1 ohm as the limit","Nobody, since a visual check is all a job needs"],c:1,e:"You make the joint and check it visually. The electrician or testing technician measures the resistance, with 0.1 ohm (100 milliohms) as the recommended maximum."},
{id:"u3l5-5",t:"u3l5",q:"The electrician hands you a spool for the rack bond. Which jacket color shows it is a bonding conductor?",a:["Blue with a white stripe","Red with a white stripe","Green, or green with a yellow stripe","Yellow with a black stripe"],c:2,e:"Every bonding conductor is green, or green with a yellow stripe, so nobody mistakes it for a signal or power conductor."},

// u3l6
{id:"u3l6-1",t:"u3l6",q:"Two hundred cables must reach a TR through a ceiling space. Which pathway fits BEST?",a:["A row of J-hooks, since they cost less than any other support type","Surface raceway, since it can be mounted on the corridor wall","A single conduit, since conduit gives the best protection to every cable","A cable tray, since it carries many cables with open access from above"],c:3,e:"A cable tray carries many cables with open access from above. J-hooks suit small bundles, and conduit is meant for protection and small counts."},
{id:"u3l6-2",t:"u3l6",q:"A crew hung J-hooks from the ceiling grid wires because they were close. What should be done?",a:["Remove them and hang independent supports from the structure above, because grid wires belong to another trade","Leave them, since the grid wires carry the weight of the bundle without problems","Add a second hook next to each one so that the weight is spread out","Tie the cable bundle to the grid with ties so that the hooks carry less load"],c:0,e:"Never attach to ceiling grid wires, the grid, sprinkler pipes, or another trade's supports. Hang from the structure above with your own rod, strap, or beam clamp."},
{id:"u3l6-3",t:"u3l6",q:"A new open pathway runs 600 mm from unshielded power on a circuit above 5 kVA. Is that acceptable?",a:["Yes, because 600 mm is more than the 305 mm required for every pathway beside power cables","It is too close; the minimum is 610 mm, so move the pathway or change the pathway type","No, because the rule is 1220 mm for every open pathway near any power conductor on the floor","Yes, because shielded cable ignores the distance"],c:1,e:"For unshielded power in an open or nonmetal pathway the minimum is 610 mm (24 in), so 600 mm falls short. A grounded metal pathway reduces the distance."},
{id:"u3l6-4",t:"u3l6",q:"A new cable pathway must pass an electric motor in a mechanical room. What minimum separation do you leave from the motor?",a:["305 mm (12 in)","610 mm (24 in)","1220 mm (48 in)","130 mm (5.12 in)"],c:2,e:"Electric motors and transformers need 1220 mm (48 in). The 610 mm figure is for unshielded power in an open pathway, 305 mm for power beside grounded metal, and 130 mm is for fluorescent and discharge lighting."},
{id:"u3l6-5",t:"u3l6",q:"You are routing a pathway through a mechanical room. Which nearby source is the MOST likely to cause EMI on the cable?",a:["A sprinkler pipe","A plastic duct","A ceiling tile","An electric motor or transformer"],c:3,e:"Motors, transformers, fluorescent fixtures, and power cables create electromagnetic interference. Keep cable away from them."},

// u3l7
{id:"u3l7-1",t:"u3l7",q:"Two Category 6A cables go to a double-gang faceplate, and the crew has shallow boxes on the cart. What is the BEST choice?",a:["A deep double-gang box, so the cable keeps its bend radius","A single-gang box with one cable and a blank for the other jack","A shallow box with the cables folded in tightly to fit the space","A low-voltage bracket in the open wall with no box at all"],c:0,e:"Category 6A is stiff and large. A deep box leaves room for the bend radius, and a shallow box forces a tight bend that fails the test later."},
{id:"u3l7-2",t:"u3l7",q:"Who decides the mounting height of the outlets on a project?",a:["The installer, who sets all the heights to the same standard height","The drawings and the AHJ, including accessibility rules","The electrician, who picks the height of every outlet at the same time","The cable manufacturer, whose sheet gives one height for all rooms"],c:1,e:"Heights come from the drawings and the AHJ, including accessibility rules. Never guess the height, and measure it from the finished floor."},
{id:"u3l7-3",t:"u3l7",q:"A low-voltage mounting bracket is planned for a wall that is a fire barrier. What do you do?",a:["Install it, since a small opening in a wall does not change the rating of the barrier","Install it, then seal the gap behind the bracket with ordinary caulk before the wall is closed","Use it only if it is listed for that fire or smoke barrier","Cut a larger hole so that a metal box can sit behind it"],c:2,e:"A low-voltage bracket is never used in a fire or smoke barrier unless it is listed for it, and its firestop is installed as the listing says."},
{id:"u3l7-4",t:"u3l7",q:"Drywall crews come tomorrow and the boxes are set. What should you do at rough-in?",a:["Fill each box with insulation so the drywall will not touch the cable","Leave the boxes open and clean them with a vacuum after the walls are done","Remove the boxes and set them again after the walls have been finished","Cover or tape each box opening so drywall mud stays out, and leave a pull string in any conduit stub-up"],c:3,e:"Cover the boxes so mud and dust stay out, and leave a pull string in each stub-up so the cable can be pulled later."},
{id:"u3l7-5",t:"u3l7",q:"A faceplate has an unused position when the outlet is finished. What do you do?",a:["Fill it with a blank and label the outlet","Cover it with tape, which you can remove when a jack is installed","Cut the faceplate to a smaller size to remove the open position","Leave it open so a jack can be added later without a tool"],c:0,e:"Fill every unused position with a blank so dust stays out, and label the outlet."},

// u3l8
{id:"u3l8-1",t:"u3l8",q:"A customer wants a new outlet in a finished wall. What is the FIRST step?",a:["Cut the opening","Locate studs and check the cavity","Level the ring","Drop a string"],c:1,e:"Before any cut, locate the studs and check the cavity for power and obstructions. A saw that meets a wire or a stud ruins the wall and may injure you."},
{id:"u3l8-2",t:"u3l8",q:"The wall for a cut-in ring is marked on the drawings as fire rated. What do you do?",a:["Use a metal ring from the truck, since a metal ring is acceptable in every rated wall","Use a standard plastic ring and caulk the edges after the cable is in, then label the wall","Use only a box that is listed for the rated wall and firestop it to the listing","Skip the ring and run the cable through the wall without a box"],c:2,e:"A fire-rated wall needs a box listed for it and a firestop installed to its listing. A common plastic ring does not keep the wall's rating."},
{id:"u3l8-3",t:"u3l8",q:"The opening is cut and you need the cable at the wall. What is the BEST way to get it there?",a:["Push the cable down the wall from the ceiling and hope it lands","Tape the cable to a broom handle and push it into the wall cavity","Cut a second opening near the floor and fish the cable up the cavity","Drop a string or fish tape from the ceiling space and pull the cable to the opening"],c:3,e:"Drop a string or run a fish tape between the ceiling space and the opening, tie on the cable, and pull it through."},
{id:"u3l8-4",t:"u3l8",q:"The ring is set in the customer's office and the crew packs up. What cleanup do you owe?",a:["Vacuum the dust as you go, bag the scraps, and leave the customer's wall and furniture clean","Wipe the faceplate only, since the ceiling debris is not seen by the user","Leave the scraps in a box for the janitor to take away in the morning","Ask the customer to clean up and send a bill for any extra time"],c:0,e:"Cut-in work makes drywall dust. Vacuum as you work, bag the scraps, and leave the space clean, since you are working in an occupied room."},
{id:"u3l8-5",t:"u3l8",q:"After the ring is placed in the opening it wobbles. What is the correct way to secure it?",a:["Pack the gap with paper and tape the ring flush with the wall","Tighten the wings until the ring grips the drywall","Glue the ring to the wall and remove the wings afterward","Screw the ring into the drywall at each corner of the faceplate"],c:1,e:"A cut-in ring clamps to the drywall with its wings. Tighten them until the ring grips firmly, and keep the opening no larger than needed."},

// u3l9
{id:"u3l9-1",t:"u3l9",q:"A conference table in the middle of a rated floor needs data under it. Which statement about a poke-through is correct?",a:["It is an ordinary box that never affects the rating of the floor","It keeps the rating whenever the core hole is filled with foam afterward","It keeps the floor's rating only when installed exactly to its listing","It needs no listing as long as the hole is smaller than the cable bundle"],c:2,e:"A poke-through is a listed, fire-rated device. It restores the floor's rating only when installed exactly as its listing says."},
{id:"u3l9-2",t:"u3l9",q:"A poke-through feeds the plenum ceiling of the floor below. What cable must go through it?",a:["Any general purpose cable, since it only crosses the floor for a short run","Riser cable, since the cable passes from one floor to the next","Limited use cable, since the run is short and in a protected device","Plenum rated cable, because the cable enters the plenum below"],c:3,e:"The cable must match the space it enters. A plenum below means plenum cable through the poke-through."},
{id:"u3l9-3",t:"u3l9",q:"The designer shows a floor core for a new poke-through. Where may you core?",a:["Only where the drawings show it, after the slab has been scanned","Wherever the floor looks clear of obstacles under the carpet","Anywhere near the table, since the exact spot is the installer's call","Next to a column, since the slab is thicker there and stronger"],c:0,e:"Core only where the drawings show, and scan the slab first. Never cut into structure without approval."},
{id:"u3l9-4",t:"u3l9",q:"Cables run under an access floor to the new outlets. What is the BEST method?",a:["Lay them loose on the slab between the pedestals so that the tiles can still be lifted","Support them in trays or baskets, separated from power, keeping the airflow clear","Run them in the same tray as the power so one pathway does the job and the airflow is shared","Bundle them tightly against the pedestals with ties for support"],c:1,e:"Under an access floor use trays or baskets, keep the separation from power, and keep airflow clear, since piles of cable block cooling."},
{id:"u3l9-5",t:"u3l9",q:"A floor box sits in a rated slab. What is required after the cabling is in?",a:["A bead of ordinary caulk around the box, which the inspector checks before the floor finish goes down","Nothing more, because the box cover alone keeps dust and water out and restores the floor's rating","It is firestopped and sealed to the listing, with a cover that keeps out water and dust","The box is removed and the core is filled with a sand mix"],c:2,e:"A floor box in a rated slab is firestopped and sealed to its listing, and its cover keeps out water and dust."},

// u3l10
{id:"u3l10-1",t:"u3l10",q:"Cubicles are fed from a power pole at the ceiling. How do you arrange power and communications?",a:["Put the communications on the same side as power to save the trouble","Run both in the same channel so the cables can be dressed together","Run power on the outside and put the data cable under the power","Keep power and communications on separate sides of the pole or raceway to reduce interference"],c:3,e:"Power and communications stay on separate sides of a pole or furniture raceway, which limits interference and keeps the two systems apart."},
{id:"u3l10-2",t:"u3l10",q:"Category 6A cables fail NEXT after being routed through tight furniture raceways. What is the MOST likely cause?",a:["A bend tighter than the radius, which can be avoided by using the wide channel","The cables are too short to reach the outlet, so each one was stretched tight along the raceway","The jacks were punched with the wrong tool, so the pairs lost their twist at the termination","The jacks were made for stranded cable, which loses signal"],c:0,e:"Furniture raceways are tight. A bend sharper than the cable's bend radius, especially for Category 6A, causes test failures, so use the wide channel and leave no kinks."},
{id:"u3l10-3",t:"u3l10",q:"A wireless access point is planned above a plenum ceiling tile. What is the BEST method for the cable?",a:["General purpose cable laid on the ceiling tile with a small service loop","Plenum rated cable to a plenum rated enclosure, hung from the structure","Riser cable hung from the grid wire and tied with a plastic cable tie","Any cable, since the access point itself carries a plenum rating"],c:1,e:"The ceiling is a plenum, so use plenum cable and a plenum rated enclosure, supported from the structure and not from the grid."},
{id:"u3l10-4",t:"u3l10",q:"An outlet is planned on an exterior wall. Which box is required?",a:["A single-gang metal box with a standard plastic faceplate","A deep box with a blank, held on with a plain adhesive","A weatherproof box","A low-voltage bracket in the open stud space of the wall"],c:2,e:"Wet and exterior locations need a weatherproof box with a gasketed cover and sealed entries, and a drip loop in the cable."},
{id:"u3l10-5",t:"u3l10",q:"A cable enters a weatherproof box from above in the rain. How do you keep water out of the box?",a:["Seal the cover with tape and leave the cable straight to the box","Run the cable in a straight line and caulk the entry only on the inside","Point the cable upward so that the water runs back toward the roof","Form a drip loop so water drips off the cable before it reaches the box"],c:3,e:"Water follows the cable, so form a drip loop. The cable hangs low before it rises into the box, and the water drips off at the bottom."},

// u3l11
{id:"u3l11-1",t:"u3l11",q:"The drawing calls for a new core through a slab. What is the FIRST step?",a:["Scan the slab for rebar and conduit and clear the location","Mark the hole with paint and begin cutting from the top floor","Start the drill with water running to keep the dust down","Ask the customer which side of the room they prefer for the core"],c:0,e:"Scan the slab for rebar, conduit, and post-tension cables before coring. Never cut into structure without the designer's approval."},
{id:"u3l11-2",t:"u3l11",q:"A sleeve is planned for a pull of cables that will grow later. How should it be filled today?",a:["Packed full, since the firestop holds the cables best when the sleeve has no empty space","With spare capacity left for growth, not filled to its limit on the first day","Filled to the limit, with a second sleeve added on the next floor for the next phase","Left empty, since cable cannot be placed until the firestop is installed"],c:1,e:"Size sleeves for growth. A sleeve filled to its limit leaves the next pull with no room, and the firestop makes changes harder."},
{id:"u3l11-3",t:"u3l11",q:"A sleeve end is raw metal where a cable will pass. What do you add?",a:["Tape around the edge","A rag in the hole","A bushing","A coat of paint"],c:2,e:"A bushing at the sleeve ends protects the jacket from the cut edge."},
{id:"u3l11-4",t:"u3l11",q:"An unused sleeve passes through a fire-rated wall. What should be done with it?",a:["Leave it open so air can move between the rooms in the building","Seal it only on one side, since the other side is not visible","Fill it with foam and leave the wall without a label for the inspector","Cap and label it, and firestop it too if the wall is rated"],c:3,e:"Cap and label unused openings, and firestop them too when the wall or floor is rated. An open opening breaks the rating."},
{id:"u3l11-5",t:"u3l11",q:"A riser slot has just been framed and the backbone cables are installed. What is the next requirement?",a:["Firestop it with a listed system after the cabling is in place","Leave it open until the inspector asks to see the finished framing","Fill it with insulation so the cables stay in place in the slot","Cover it with a metal plate and leave the cables as they are in the slot"],c:0,e:"Every slot with cable through it gets a listed firestop system after cabling, framed as the listing requires."},

// u3l12
{id:"u3l12-1",t:"u3l12",q:"A new ladder rack carries only low-voltage cable. What do you do about bonding?",a:["Skip it","Bond every section","Bond only the first section","Bond it at one end only"],c:1,e:"Every tray and ladder rack section is bonded, whether it carries power or low-voltage cable."},
{id:"u3l12-2",t:"u3l12",q:"A listed tray is a few inches too long for the corridor. What should the crew do?",a:["Cut it with a hacksaw and file the edge, since it is only one section","Cut it and leave a note on the drawing for the next trade","Ask the AHJ first, because a field cut can void the listing","Splice a shorter piece from scrap tray on the other end"],c:2,e:"A field cut can void the tray's listing, so ask the AHJ before cutting a listed tray."},
{id:"u3l12-3",t:"u3l12",q:"The foreman asks how full to load a new ladder tray on day one. What is the BEST answer?",a:["Match it to the hook rating used elsewhere on the floor","Load it to the top of the side rails so that no space is wasted","Use the conduit limit of 40 percent, since a tray is only a larger pipe","Follow the fill limit the designer and code set, and leave room for growth"],c:3,e:"Tray fill and depth are set by the designer and the code, and a new tray should leave room to add cable. Conduit fill limits and hook ratings belong to other supports."},
{id:"u3l12-4",t:"u3l12",q:"A vertical ladder rack carries heavy backbone cable up through a riser. How do you hold the cable?",a:["Secure each cable to the rung","Tie every cable at the top only, where the pull ends","Rely on the friction of the cables against one another in the bundle","Hang each cable by its own jacket from the rack's top rung"],c:0,e:"Secure each cable to the rung so the weight spreads over several supports instead of hanging on one point."},
{id:"u3l12-5",t:"u3l12",q:"A tray 12 in wide by 3.94 in deep will hold 120 cables of 0.30 in OD. What is the fill percent?",a:["9.0 percent","17.9 percent","26.9 percent","35.8 percent"],c:1,e:"Cable area is 120 x 0.0707 = 8.48 square in over a tray area of 47.28 square in, which is 17.9 percent. Half that is 9.0 for 60 cables, 26.9 is for 180, and 35.8 is for 240."},

// u3l13
{id:"u3l13-1",t:"u3l13",q:"A 24 m corridor run uses J-hooks. How should they be placed?",a:["Fourteen hooks spaced evenly at about 1.8 m with no variation in the spacing","Eleven hooks spaced about every 2.2 m so the sag stays shallow","At least 17 hooks, spaced 1.5 m or less and varied slightly so the sag has no repeating pattern","Four hooks, one at each end and two in the middle, with a loose bundle"],c:2,e:"A 24 m run has at least 16 spaces of 1.5 m or less, so 17 hooks, with the spacing varied slightly to avoid a repeating sag pattern. Spacing of 1.8 m or more breaks the 1.5 m maximum."},
{id:"u3l13-2",t:"u3l13",q:"A crew lead asks how far apart you may space the J-hooks along a new corridor run. What is the maximum spacing?",a:["3.0 m (10 ft)","1.8 m (6 ft)","2.4 m (8 ft)","1.5 m (5 ft)"],c:3,e:"Noncontinuous supports are no more than 1.5 m (5 ft) apart. Closer is allowed, and anything wider breaks the limit."},
{id:"u3l13-3",t:"u3l13",q:"The cable bundle between J-hooks sags down onto the ceiling tile. What is the correct fix?",a:["Add hooks or use bigger hooks so the sag stays shallow and the bundle clears the grid","Rest the bundle on the grid for support, since the tile and grid take the weight over a short sag","Pull the cable tighter between hooks until the bundle rises above the tile, then tie it to the grid wire","Tape the bundle to the tile so it stays in position"],c:0,e:"Sag must be even and shallow, and the bundle must not rest on the ceiling or touch the grid. Add or enlarge the hooks."},
{id:"u3l13-4",t:"u3l13",q:"A hook is rated for 50 cables and the next phase brings 62. What do you do?",a:["Add the twelve cables and watch the hook for signs of bending, since the rating includes a margin","Use larger hooks or a tray, because the rated load must never be exceeded","Tie the extra cables to the ceiling grid wire next to the hook so the hook carries only 50","Squeeze all 62 cables into the hook with a tie"],c:1,e:"Never exceed a hook's rated cable count. Use bigger hooks or a tray when the count grows, and never crush the bundle."},
{id:"u3l13-5",t:"u3l13",q:"Fiber patch cords will run along a J-hook route. Which support type is a poor choice for them?",a:["A noncontinuous support with wide hooks and a shallow sag in the bundle","A wire mesh basket, which has an open bottom under the cable","Solid-bottom supports, which put pressure points on fiber cords","A ladder rack, which spreads the load over many rungs of the rack"],c:2,e:"Keep fiber cords off solid-bottom supports; use mesh, ladder, or noncontinuous supports so there are no pressure points."},

// u3l14
{id:"u3l14-1",t:"u3l14",q:"A conduit will carry six cables. What is the maximum fill allowed?",a:["25 percent","53 percent","31 percent","40 percent"],c:3,e:"Conduit fill is 53 percent for one cable, 31 percent for two, and 40 percent for three or more, so six cables take 40 percent."},
{id:"u3l14-2",t:"u3l14",q:"A conduit run has three 90-degree bends and 35 m between the end points. What is required?",a:["Add a pull box so no section has more than two 90-degree bends or more than 30 m","Nothing, because a bigger conduit than the cable needs allows any number of bends in the run","Add a fourth bend before the wall so that the run changes direction and the pull gets shorter","Use a stronger pull rope and a lubricant that works with the jacket"],c:0,e:"No more than two 90-degree bends and 30 m (100 ft) between pull points. Add an accessible pull box where a run would exceed either limit."},
{id:"u3l14-3",t:"u3l14",q:"A crew wants to pull 12 cables of 0.25 in OD through 1-1/4 in EMT (ID 1.380 in). What is the fill percent?",a:["45.4 percent","39.4 percent","28.4 percent","9.8 percent"],c:1,e:"Fill = 12 x 0.0625 / 1.9044 x 100 = 39.4 percent, under the 40 percent limit for three or more cables, so it is allowed. Thirteen cables would be 42.7 percent."},
{id:"u3l14-4",t:"u3l14",q:"A 3 in conduit carries copper cable around a bend. What is the minimum conduit bend radius?",a:["6 x the inside diameter, since the rule covers all conduit sizes","4 x the outside diameter of the cable, as for 4-pair cable","10 x the inside diameter, since the conduit is larger than 2 in","20 x the inside diameter, which applies to cable under tension"],c:2,e:"Conduit bend radius is 6 x the inside diameter for conduit 2 in (53 mm) and smaller, and 10 x above that."},
{id:"u3l14-5",t:"u3l14",q:"The end of a cut piece of conduit is rough where it enters the box. What do you do?",a:["Wrap it with tape and pull the cable through slowly and carefully","File it lightly and trust the cable jacket to resist the rough edge","Move the conduit to another box and leave the rough end as it is","Ream the cut end and install a bushing so the jacket is not cut"],c:3,e:"Ream every cut end and install a bushing, so the jacket is not cut and the cable pulls smoothly."},

// u3l15
{id:"u3l15-1",t:"u3l15",q:"An inspector finds a new cable added to a sealed penetration in a rated wall. What is required?",a:["Reseal the opening with the listed system, because adding a cable breaks the seal, and relabel it","Nothing, since the sealant is still in place around the old cable","Cover the opening with tape and write the date next to it on the wall","Fill the rest of the opening with foam so no gap remains around it"],c:0,e:"Adding or removing a cable breaks the seal. Reseal with the listed system exactly as before and relabel it so the record is current."},
{id:"u3l15-2",t:"u3l15",q:"No listed firestop system on the approval sheet matches your wall, penetrant, and opening. What do you do?",a:["Use the system that is closest and note the difference on the label","Stop and ask the designer or the AHJ","Fill the opening with foam, which seals gaps in the wall","Leave the opening open until the inspector arrives to see it"],c:1,e:"If you cannot find a listed system that fits, stop and ask the designer or the AHJ. A system that is almost right is not a listed system."},
{id:"u3l15-3",t:"u3l15",q:"The crew has run out of the listed product for a rated-wall opening. Which of these may be used instead?",a:["Fiberglass insulation batts held in place with foil tape","Fire-resistant foam sold for sealing around windows and doors","None of them, because only a listed system restores the rating","Rags soaked in fire retardant and packed into the opening"],c:2,e:"Foam, tape, rags, and insulation are never a substitute. Only a listed system, matched to the wall, penetrant, and opening, restores the rating."},
{id:"u3l15-4",t:"u3l15",q:"The approval sheet shows an F rating of two hours. What does the F rating mean?",a:["How well the system seals against smoke leakage through the opening","The temperature rise allowed on the cold side of the wall after two hours","The number of cables the system may carry before the seal is broken","The hours the system keeps flames from passing through the opening, and it withstands a hose stream"],c:3,e:"The F rating is the hours the system keeps flames from passing through, including a hose stream test. The T rating covers temperature rise and the L rating covers smoke leakage."},
{id:"u3l15-5",t:"u3l15",q:"The shift ends with an open penetration in a rated wall. What is required?",a:["Seal it before leaving","Leave it for the morning","Tape it for now","Post a warning sign"],c:0,e:"A penetration in a fire or smoke barrier is sealed at the end of every workday, not just at the end of the job."}
);

// INST1 Academy question bank, units 4 and 5. All questions are original jobsite scenarios.
window.FRA = window.FRA || {};
FRA.questions = FRA.questions || [];
FRA.questions.push(
// u4l1
{id:"u4l1-1",t:"u4l1",q:"Forty cables are due off the pallet in the TR this morning, and a cutter is already in your hand. What is the FIRST step before any cable leaves its box?",a:["Cut every cable to the length of the longest run so each one will reach any outlet on the floor","Label each cable with its schedule ID at the box end before it is cut from the box","Strip the jacket ends at the box so the termination crew can start punching down at once","Pull every cable into the ceiling uncut and trim each one at its outlet once it has arrived"],c:1,e:"The label ties each cable to the pull schedule, the outlet, and the test record, and it goes on before the cut. Cutting every cable to one length wastes cable, and trimming at the outlet loses the match to the schedule."},
{id:"u4l1-2",t:"u4l1",q:"A floor needs 30 runs. Each run is 210 ft of path, and the plan gives 10 ft of slack at each end. The cable comes in 1000 ft boxes. How many boxes should you order?",a:["7 boxes","6 boxes","8 boxes","10 boxes"],c:2,e:"Cut length = 210 + 10 + 10 = 230 ft. Runs per box = 1000 / 230 = 4.3, rounded down to 4 whole runs. Boxes = 30 / 4 = 7.5, rounded up to 8. Dividing total footage (6900 ft) by 1000 gives 7 and leaves you short."},
{id:"u4l1-3",t:"u4l1",q:"The pull turns a hard corner at the end of the corridor, and the cable keeps scraping the wall as it goes round. What is the BEST fix?",a:["Hold the cable against the wall at the corner with a helper's gloved hand","Bend a short steel conduit stub tightly and let the cable slide over its curve","Pull faster through the corner so that the cable has less time to scrape the wall","Set a sheave or roller at the corner sized so the cable follows its bend radius"],c:3,e:"A sheave or roller guides the cable around the corner at its minimum bend radius without rubbing. A hand against a wall, extra speed, or a tight steel stub all scrape or over-bend the cable."},
{id:"u4l1-4",t:"u4l1",q:"The pull end is two corners away from the feed end, and nobody at the feed end can see the cable. What is the BEST way to keep the pull safe?",a:["Put people at the feed end, the pull end, and the corners, all on radios, so any one can call a stop","Pull at a steady speed and have the feed end wait for the rope to go slack","Send a runner between the ends every few minutes to report how the pull is going","Pull in short sudden jerks so the feed end can feel each tug through the cable"],c:0,e:"Radios let anyone stop the pull the moment the cable binds, which keeps tension inside the limit. Waiting for slack rope, a runner, or jerky pulls reacts too late and stretches the cable."},
{id:"u4l1-5",t:"u4l1",q:"A boxed cable is lying flat on the floor of the TR, and it twists into kinks as the crew draws it out through the top. What is the BEST correction?",a:["Roll the box onto its side and draw the cable off the end of the box, since a box on its side never twists it","Put the box or reel on a stand or spool tree so it pays off freely","Have a helper stand on the box so it cannot spin while the cable is drawn out through the hole","Cut the cable into short lengths and join them with butt splices after the pull is finished"],c:1,e:"A reel stand or spool tree lets the cable unwind without twisting or kinking. Holding the box still or rolling it does not remove the twist, and splices are not allowed in horizontal copper."},

// u4l2
{id:"u4l2-1",t:"u4l2",q:"A conduit run is long with four bends and has no string in it. What is the BEST way to get a line through?",a:["Push a steel fish tape the whole length from one end until it comes out the far end","Feed a coil of heavy pull rope in from one end and wait for it to reach the other","Blow or vacuum a light line through with a piston or mouse sized to the conduit","Drop a weighted string into the first box and let it fall down through the bends"],c:2,e:"Blown or vacuum line carries a piston and string through long runs with bends. A steel tape jams at the bends, and rope or a weighted string cannot travel through a horizontal conduit by itself."},
{id:"u4l2-2",t:"u4l2",q:"The foreman asks you to fish a steel tape into a wall box that holds power conductors. What is the FIRST thing to do?",a:["Wear rubber gloves and push the tape in slowly with one hand on the box","Wrap the end of the tape in electrical tape and feed it in carefully past the conductors","Switch to a fiberglass tape and keep your hands well clear of the conductors","Have the electrician de-energize and lock out the circuit before any tape goes in, or choose another route"],c:3,e:"Never fish any tape into a box or raceway with energized conductors. The electrician de-energizes and locks out the circuit first. Fiberglass does not conduct, which makes it the better tape near electrical work, but it is not permission to work live, and gloves or tape on the end do not make a steel tape safe."},
{id:"u4l2-3",t:"u4l2",q:"The cable is pulled and the conduit is now empty of line. What should you do before leaving the pathway?",a:["Leave a new pull string in the conduit, tied off at both ends","Leave the old rope tied to the cable at both ends as a spare for the next pull","Leave it as it is and let the next crew fish their own line","Pull the rope out so that the conduit is empty for the inspector"],c:0,e:"A conduit always keeps a new pull string for the next crew, tied off so it cannot slip back inside. An empty conduit forces the next crew to fish a line again."},
{id:"u4l2-4",t:"u4l2",q:"You want the length of a conduit run while you draw a line through it. What is the BEST method?",a:["Count the ceiling tiles along the route and multiply by the width of a tile","Read the footage marks on the line where it comes out of the far end","Scale the run off the floor plan and add 10 percent for the bends","Weigh the line on the reel before and after the run and compare the two"],c:1,e:"A tape-style pull line is printed with footage marks, so reading the mark at the exit gives the real length. The other methods only estimate."},
{id:"u4l2-5",t:"u4l2",q:"You must run a line down inside a hollow wall from the ceiling to an old outlet box. The electrician has de-energized and locked out the power wiring in the cavity. What is the BEST tool?",a:["A steel fish tape pushed down the cavity beside the power wiring","A coil of pull rope dropped from the ceiling opening and left to find the box","A fiberglass push rod or glow rod, which does not conduct","A blown line with a piston, because every wall cavity acts as a conduit"],c:2,e:"A fiberglass or glow rod works in open cavities and does not conduct, which is the safer choice around wiring even after lockout. A steel tape is a hazard if a circuit is missed, dropped rope snags, and a cavity is not a conduit, so a piston has nothing to travel in."},

// u4l3
{id:"u4l3-1",t:"u4l3",q:"Eight 4-pair cables are pulled together as one bundle through a long conduit. What is the most tension the pull may put on the bundle?",a:["25 lbf","110 lbf","350 lbf","200 lbf"],c:3,e:"The limit is 25 lbf per 4-pair cable, multiplied by the number of cables: 8 x 25 = 200 lbf. The single-cable figure of 25 would be far too low, and 110 is a newton value, not pounds."},
{id:"u4l3-2",t:"u4l3",q:"A fiber cable 0.5 in across is being pulled under tension around a corner. What is the smallest radius the cable may be bent to?",a:["10 in","5 in","2 in","20 in"],c:0,e:"Fiber under pulling tension needs 20 x OD: 20 x 0.5 = 10 in. Five inches is the 10 x OD value for no load, and 2 in is the 4 x OD rule for UTP."},
{id:"u4l3-3",t:"u4l3",q:"A multipair backbone cable is 0.75 in across and is being laid round a sweep in a tray. What is its minimum bend radius?",a:["3 in","7.5 in","15 in","1.5 in"],c:1,e:"Multipair copper needs 10 x OD: 10 x 0.75 = 7.5 in. Three inches is 4 x OD, the rule for 4-pair UTP, and 15 in is the 20 x OD figure that applies to fiber under tension."},
{id:"u4l3-4",t:"u4l3",q:"After a pull you secure a bundle of cables to a J-hook with plastic ties cinched as tight as they will go. What is the BEST correction?",a:["Add a second row of tight ties so the load is spread along the bundle","Leave the ties as they are and test the cables to confirm every one still passes","Cut the ties and use hook-and-loop ties left loose enough for the bundle to slide","Replace the ties with a few turns of electrical tape for a smoother surface"],c:2,e:"Cinched ties crush the jacket and distort the pairs, which fails crosstalk and return loss later. Use hook-and-loop ties and leave the bundle loose."},
{id:"u4l3-5",t:"u4l3",q:"Halfway through a pull the rope goes stiff and the tension meter climbs. What should you do FIRST?",a:["Add more people to the rope and keep a steady pull until the cable breaks free","Pour more lubricant from the truck at the conduit mouth and pull harder","Switch to a faster winch speed so the cable does not stay in the stiff section","Stop the pull and find the cause of the extra tension before going on"],c:3,e:"Stiffness means something is wrong: a snag, a missing sheave, too many cables, or a kink. Pulling harder only raises the tension past the limit, so stop and find the cause."},

// u4l4
{id:"u4l4-1",t:"u4l4",q:"Eight cables must be pulled together through a conduit with two bends. What is the BEST way to start the bundle?",a:["Make a smooth tapered head with a basket grip or a tape-and-loop head, on a swivel","Twist the eight cable ends together tightly and tie the pull rope round them","Tape the eight ends flat into one square block so that they pass the bends together","Tie each cable to the rope separately with a knot, at spaced intervals"],c:0,e:"A smooth, tapered head on a swivel slides past joints and bushings without catching. A twisted or square head snags, and separate knots load the cables unevenly."},
{id:"u4l4-2",t:"u4l4",q:"A 70 ft conduit run between two boxes has three 90-degree bends. What should you do?",a:["Pull the cable through as drawn since the run is under 30 m (100 ft)","Add a pull box so that no section has more than two 90-degree bends","Remove one bend by cutting the conduit and connecting it with a union","Add a lubricant and use a larger crew to pull through the third bend"],c:1,e:"The limit is two 90-degree bends between pull points, so a third bend needs a pull box, placed so each section stays within the limit. The 30 m length limit is a separate rule and does not excuse the extra bend."},
{id:"u4l4-3",t:"u4l4",q:"At the feed end the cables kink and twist where they enter the conduit mouth. What is the BEST correction?",a:["Feed in short bursts so that the cables have time to straighten between pulls","Feed the cables from a bundle held in a loop on the floor beside the conduit mouth","Feed straight off the stands through a bushing, with a helper holding the cables apart","Hold the cables together in one hand and feed them in with a sharp push"],c:2,e:"Straight feeding off stands with a bushing and a helper to keep the cables from crossing prevents kinks. Loops on the floor and pushed bursts add twist."},
{id:"u4l4-4",t:"u4l4",q:"The pulled cable reaches a pull box midway along the run. What is the BEST way to handle it?",a:["Bend the cable sharply inside the box to turn it toward the conduit for the next section","Leave the cable coiled on the bottom of the box until the next crew arrives to continue","Cut the cable in the box and splice it before the next section","Pull out a loose loop, check it for damage, lay it at its bend radius, and pull on"],c:3,e:"A pull box is a feed and pull point, never a place to bend or splice. A loose loop at the cable's bend radius lets you check the cable and continue the pull."},
{id:"u4l4-5",t:"u4l4",q:"A helper at the feed end grabs the cable jackets and hauls on them hand over hand to speed the pull. What is the BEST response?",a:["Stop him; the rope and grip carry the pull and he only guides the cables","Have him haul only on the top cables of the bundle, where the jackets are easiest to grip by hand","Let him continue, because extra hauling at the feed end lowers the tension at the far end of the pull","Give him pulling gloves with a better grip so he can haul without slipping on the jackets"],c:0,e:"Hauling on the jackets adds uncontrolled tension and can stretch or scrape the cables. The rope through a swivel and grip carries the pull, and feed-end helpers only guide the cables."},

// u4l5
{id:"u4l5-1",t:"u4l5",q:"The foreman asks you to space the J-hooks 2 m (6.6 ft) apart to save hardware in an open ceiling. What is the most spacing you may use?",a:["3 m (10 ft)","1.5 m (5 ft)","2.4 m (8 ft)","0.6 m (2 ft)"],c:1,e:"Noncontinuous supports such as J-hooks may be no more than 1.5 m (5 ft) apart, so 2 m is too wide. Wider spacing lets the bundle sag onto the ceiling and the tile grid."},
{id:"u4l5-2",t:"u4l5",q:"The last crew hung J-hooks from the ceiling grid wires, and you are about to add your cables. What is the BEST action?",a:["Add your cables, since the hooks are already in place and carry the same load","Move the hooks to the tile grid itself where the rails are stiffer than the wires","Remove them and hang hooks on their own supports from the building structure","Keep the hooks and add a second grid wire next to each one to share the load"],c:2,e:"Supports for cable must hang independently from the structure, never from grid wires or the grid. Adding load to wires meant for the ceiling is a violation and a falling hazard."},
{id:"u4l5-3",t:"u4l5",q:"The ceiling above the corridor is a return-air plenum, and the only cable left on the truck is riser-rated. What should you do?",a:["Use the riser cable and keep the run short so the fire risk is limited","Use the riser cable but place it in a plastic raceway through the plenum","Use the riser cable above the first ten feet and plenum cable beyond that","Hold the pull and get plenum-rated cable (CMP) for the air-handling space"],c:3,e:"Plenum space needs plenum-rated cable. A lower rating such as riser may never replace a higher one, whatever the length of the run."},
{id:"u4l5-4",t:"u4l5",q:"Your planned route passes over a row of fluorescent fixtures and next to a sprinkler head. What is the BEST way to handle it?",a:["Route it so it stays at least 130 mm (5.12 in) from the lamps and clear of the sprinkler","Lay the cable on top of the fixtures, which hold it up and keep it off the grid","Move the sprinkler head a short way to open a path for the cable","Wrap the cable in foil where it crosses the fixtures to reduce interference"],c:0,e:"Keep the bundle away from lights, ballasts, sprinklers, and access panels: 130 mm (5.12 in) from fluorescent lamps. Another trade's devices are never moved, and foil is no substitute for distance."},
{id:"u4l5-5",t:"u4l5",q:"A helper drags the cable across the ceiling tile grid to save time. What is the BEST method?",a:["Allow the dragging, but keep the cable well away from the sharp edges of the grid and tile","Lay it hand to hand into the hooks, with a helper at each change of direction","Lay the cable on top of the tiles first and hook it up afterwards once the pull is done","Drag it slowly with one helper at the far end"],c:1,e:"Dragging scrapes the jacket and saws the pairs. Laying the cable into the hooks keeps it off the grid and the tile, and helpers at the turns control the bend."},

// u4l6
{id:"u4l6-1",t:"u4l6",q:"You are about to start a top-down riser pull with a heavy backbone cable. What is the FIRST step?",a:["Feed the end down the shaft and see how fast the cable falls before setting a brake","Lower the end to the basement on a rope and tie it off before setting up the reel","Set the reel on a stand at the top, set the brake, and confirm radio contact at every floor","Cut the cable to length at the top so that the reel can be set aside"],c:2,e:"Gravity does the pulling, so the risk is a runaway. A brake at the reel and radios to every floor come first, before any cable goes down the shaft."},
{id:"u4l6-2",t:"u4l6",q:"The cable end has reached the basement and the whole weight hangs from the top reel. What should be done?",a:["Leave it hanging until the firestop is installed since the jacket will carry it","Tie the cable to the lowest floor opening so the weight rests on the basement","Cut the cable at the top to take the weight off the reel","Support it at each floor with grips or clamps so the weight is shared"],c:3,e:"Each floor takes part of the weight through a split-mesh grip or clamp. Hanging from the jacket or the top reel stretches the pairs, and cutting the cable ruins a continuous riser."},
{id:"u4l6-3",t:"u4l6",q:"During a top-down pull the cable binds in the sleeve at floor 3. What is the BEST response?",a:["Call stop on the radio, hold the brake, and free the cable","Add a second helper at the top to push the cable harder past the snag in the sleeve","Cut the cable above the sleeve and run a new length through from the floor above","Release the brake so the weight of the cable drags it through the sleeve under its own weight"],c:0,e:"Anyone on the radio can call a stop, and the brake holds the cable while it is freed. Releasing the brake, pushing, or cutting the cable risks a runaway or ruins a continuous riser."},
{id:"u4l6-4",t:"u4l6",q:"Both the roof room and the basement are open for a heavy riser cable. The foreman asks where to set the reel. What is the BEST choice?",a:["At the basement, because pulling against gravity keeps the cable from running away","At the roof, so gravity helps and the job is to control the descent with a brake","At the roof, because a top-down pull needs no brake or floor supports","At the basement, because the floor openings can then be firestopped from below only"],c:1,e:"Top down lets gravity do the work, so the task becomes control with a brake and support at each floor. Bottom up fights the weight and needs a winch and tension monitoring."},
{id:"u4l6-5",t:"u4l6",q:"The riser cable is in place and every floor opening has cable through it. What should happen next?",a:["Leave the openings open until the final inspection so the inspector can see the cable","Fill the openings with foam from a can, and label the cable at the top only","Firestop each opening with a listed system and label the cable at every floor","Splice the cable at the middle floor so it can be reterminated later"],c:2,e:"Every floor opening is firestopped with a listed system, and the cable is labeled at every floor. Foam is not a firestop, and a riser is never spliced."},

// u4l7
{id:"u4l7-1",t:"u4l7",q:"The roof room is locked and too small for a reel, and the backbone cable must go up six floors. What is the BEST method?",a:["Pull it up in short lengths and splice them together at each floor","Hand-carry the reel up the stairs and feed the cable down from each landing","Lift the cable up the shaft by hand with a helper at each floor","Pull from the bottom up with a winch at the top, a swivel, and a tension monitor"],c:3,e:"When the top is not available, bottom-up pulling uses a winch with a swivel and tension monitoring against the manufacturer's limit. A riser is never spliced."},
{id:"u4l7-2",t:"u4l7",q:"The tension meter on a bottom-up pull reads right at the manufacturer's limit at the fourth floor, with two floors to go. What should you do?",a:["Stop, find the cause of the high tension, and fix it before continuing","Speed up the winch so that the pull is finished before the cable warms up","Keep a steady pull and finish quickly; two floors will not add much","Add lubricant of any type and continue at the same speed"],c:0,e:"Tension climbs with every floor, and a reading near the limit means the pull must stop until the cause is found. Never exceed the rating to finish the pull."},
{id:"u4l7-3",t:"u4l7",q:"A bottom-up pull has just brought the end to the top floor. What must happen before the winch releases the tension?",a:["The end is tied to the winch cable and left to hold the whole weight of the riser","The cable is secured at each floor so every support holds it","The cable is cut at the top so the tension drops to zero before the winch lets off","The cable is clamped at the top floor only, since one clamp can hold the full weight"],c:1,e:"The cable must be supported at each floor before the tension is released. Releasing first, or relying on the pulling eye or a single clamp, puts the whole weight on one point."},
{id:"u4l7-4",t:"u4l7",q:"On a bottom-up pull the pull line is joined straight to the pulling eye, and the cable spins as it rises. What is the BEST fix?",a:["Clamp a steel plate across the joint so that the eye cannot turn on the line","Slow the winch to a crawl until the spinning stops by itself on the way up","Fit a swivel between the line and the eye to keep twist out of the cable","Add a second pull line beside the first to share the load"],c:2,e:"A swivel lets the pull line rotate without twisting the cable. A plate, a slower winch, or a second line does not stop twist from building up."},
{id:"u4l7-5",t:"u4l7",q:"The winch operator asks which tension limit to watch during the pull of a large riser cable. What is the correct answer?",a:["The rated pull of the winch itself, since the winch sets how hard the cable can be drawn","The weight of the reel in pounds","25 lbf for the whole bundle, the same figure used for a single 4-pair cable on a horizontal run","The tension rating the manufacturer gives for that cable"],c:3,e:"The limit comes from the manufacturer of the cable being pulled. The 25 lbf figure belongs to a single 4-pair cable, and a winch is rated far above what a cable can take."},

// u4l8
{id:"u4l8-1",t:"u4l8",q:"An outdoor cable is to enter the building through the entrance facility. What is the rule for the cable inside?",a:["It must change to indoor-rated cable within the distance the NEC allows, usually at the entrance facility","It may run anywhere in the building if it is pulled through metal conduit","It may keep its outdoor jacket for the whole run when the AHJ is not on site","It must be limited to the first floor and labeled with the date of installation"],c:0,e:"Outdoor cable may enter only a short distance before it must be replaced or spliced to cable with an indoor fire rating. The entrance facility is where that change is made."},
{id:"u4l8-2",t:"u4l8",q:"The pull plan sends you into a manhole to set up the pulling eye. What must be true before you go in?",a:["The cover is off, the foreman has looked down it, and you carry a flashlight and a radio","It has been tested, ventilated, and permitted, with a standby person outside","The run is under 30 m (100 ft) and another trade has already been inside it once today","You wear a hard hat and gloves and tell the crew above that you will be down only a short time"],c:1,e:"A manhole is a confined space: it must be tested, ventilated, and permitted, with a standby person outside. An open cover, a flashlight, a short run, or PPE alone does not make it safe."},
{id:"u4l8-3",t:"u4l8",q:"You are to pull fiber through an underground duct bank with no innerduct. What is the BEST method?",a:["Pull the fiber through the open duct and tape it to the walls at each manhole","Pull the fiber with the largest rope available and hope that it clears the joints","Pull innerduct first, then run the cable inside it, leaving a labeled string","Pull the fiber together with the power conductors in the same duct"],c:2,e:"Innerduct gives the fiber a smooth, protected path and keeps a string in place. A bare duct, a heavy rope, or sharing with power puts the fiber at risk."},
{id:"u4l8-4",t:"u4l8",q:"You must plan the pull of a cable that runs between two TRs on the same floor. What is the BEST plan?",a:["Treat it as horizontal cabling and hold it to the 25 lbf limit for a 4-pair cable","Treat it as entrance facility cabling and change it to indoor cable at the first wall","Treat it as work area cabling and leave 305 mm (12 in) of slack at each end","Treat it as backbone: use a pulling eye, a swivel, and the maker's tension limit"],c:3,e:"Cabling between two TRs is backbone, even on one floor, so it is pulled with a pulling eye, a swivel, and the manufacturer's tension limit. The 25 lbf figure and the 305 mm slack belong to horizontal 4-pair cable."},
{id:"u4l8-5",t:"u4l8",q:"A 150 ft backbone pull between two buildings has a feed point and a pull point. What is the BEST plan?",a:["Feed from the reel at one point and pull at the other with a swivel and a tension meter","Start at the middle of the run and pull outward in both directions to finish in half the time","Splice the cable at the pull point and finish the run in two lengths","Pull from the far end with a short rope and no tension monitoring, since 150 ft is a short run"],c:0,e:"Feed at one point and pull at the other with a swivel and a tension meter, then coil the slack at a large radius. A splice is not an option and unmonitored pulling risks damage."},

// u4l9
{id:"u4l9-1",t:"u4l9",q:"A helper is about to clamp the pulling grip onto the glass and buffer of a fiber cable. What is the BEST correction?",a:["Attach it to the outer jacket alone, using a wrapped cable tie","Attach it to the strength member, the aramid yarn or central member","Clip it to the buffer coating of each fiber with small clips","Keep it on the fibers but spread the clamp over the whole buffer"],c:1,e:"The strength member carries the pull. Pulling on the fibers, the buffer, or the jacket alone stretches the glass and breaks it."},
{id:"u4l9-2",t:"u4l9",q:"A fiber cable 0.5 in across is installed in a tray with no load on it. What is the smallest bend radius allowed?",a:["2.5 in","10 in","5 in","20 in"],c:2,e:"With no load, fiber needs 10 x OD: 10 x 0.5 = 5 in. The 10 in figure is the 20 x OD value for pulling tension."},
{id:"u4l9-3",t:"u4l9",q:"A long fiber pull must be staged on the floor before it goes in. What is the BEST way to lay out the cable?",a:["Coil it in one big circle so that it can come out from the middle","Spread it flat in a long line along the corridor wall","Stack it in a tight pile near the conduit mouth","Lay it in a figure eight, and flip it as you feed"],c:3,e:"A figure eight puts opposite twists in the two lobes, so they cancel. A single circle twists the cable once per loop."},
{id:"u4l9-4",t:"u4l9",q:"A fiber cable has been pulled and its ends will sit in the ceiling for two days before termination. What is the BEST protection?",a:["Cap the ends and keep them up off the floor","Wrap the ends tightly with electrical tape and lay them flat on the nearest ceiling tile","Leave the ends bare so that moisture on the glass can dry off in the ceiling air","Tie the ends to the nearest J-hook with a knot so that they cannot be pulled back"],c:0,e:"Caps or a pulling sleeve keep dirt and moisture off the ends. Bare ends, tape, or a knot invite contamination or damage."},
{id:"u4l9-5",t:"u4l9",q:"A fiber cable's data sheet lists a maximum pulling tension, and a helper says to use 25 lbf because that is the limit for every cable. What do you do?",a:["Use 25 lbf, since that is the standard limit for every cable","Stay below the maximum on the cable's specification sheet","Use the rating of the pulling grip as the limit","Pull until it feels tight and then back off slightly"],c:1,e:"The manufacturer's rating for that cable is the limit. The 25 lbf figure belongs to 4-pair copper."},

// u4l10
{id:"u4l10-1",t:"u4l10",q:"The foreman checks your outlet after termination and asks how much slack you left on the 4-pair cable. What is the least slack that is acceptable?",a:["152 mm (6 in)","610 mm (24 in)","305 mm (12 in)","1 m (3.3 ft)"],c:2,e:"At least 305 mm (12 in) remains after termination, and it is not stored in loops. Six inches is too little for a retermination."},
{id:"u4l10-2",t:"u4l10",q:"You are cabling a TE for a small space on a floor, with the cable pulled from the TR. The foreman asks how much slack to store outside the enclosure. What is the figure?",a:["1 m (3.3 ft)","305 mm (12 in)","5 m (16 ft)","2 m (6.6 ft)"],c:3,e:"The slack outside a TE is 2 m (6.6 ft), enough for reterminations and moves."},
{id:"u4l10-3",t:"u4l10",q:"A multipair backbone cable lands in a TR. How much slack should be left there?",a:["The length of the backboard plus floor to ceiling","Enough to reach the nearest wall only","Exactly 305 mm (12 in)","None, since multipair cable is never reterminated"],c:0,e:"Multipair slack in a TR is the length of the backboard plus the run from floor to ceiling. This allows reterminating later."},
{id:"u4l10-4",t:"u4l10",q:"The pulled cables have to be dressed into the rack. What is the BEST method?",a:["Bundle every cable into one large group with plastic ties pulled tight","Group them by patch panel, in port order, with hook-and-loop ties, snug but loose","Leave the cables loose and hanging so that nobody has to untie them","Tie them with wire to the rack's frame for strength"],c:1,e:"Cables dressed in port order with hook-and-loop ties land neatly and are easy to service. Tight ties crush, and loose cables tangle."},
{id:"u4l10-5",t:"u4l10",q:"A service loop is to be stored in the ceiling. What is the BEST way to lay it?",a:["In a tight twist tied at its middle with a cable tie so that it takes little room above the tile","Pushed up behind a ceiling tile and left unsupported","In a coil larger than the cable's bend radius, supported on a hook or rack","Hung from the nearest grid wire in a figure eight, with the weight resting on one wire"],c:2,e:"A loop must be larger than the cable's minimum bend radius and supported so that its weight does not hang on one point."},

// u5l1
{id:"u5l1-1",t:"u5l1",q:"A helper fans out the pairs on a Category 6 jack and untwists each one about an inch to dress them neatly. What is the most untwist you allow?",a:["50 mm (2 in)","25 mm (1 in)","6 mm (0.25 in)","13 mm (0.5 in)"],c:3,e:"The limit for Category 5e and above is 13 mm (0.5 in). Every extra millimeter of untwist picks up and leaks crosstalk, so an inch of it will fail the link. The 6 mm and 25 mm values are not the rule."},
{id:"u5l1-2",t:"u5l1",q:"While opening a cable at the rack, the jacket tool nicks the insulation of one conductor. What is the BEST action?",a:["Cut the cable back past the damage, restrip it, and start the termination over","Turn the nicked conductor toward the back of the jack so that the damage is out of sight","Wrap the nick in vinyl tape and punch it down, since the wiremap will still pass","Punch the nicked conductor down last so any weakness affects less of the link"],c:0,e:"A nick is a future failure: heat and flexing break the copper, and the link goes open months later. Cut back past the damage and restrip. Tape or hiding the nick leaves the weak conductor in the link."},
{id:"u5l1-3",t:"u5l1",q:"A helper strips a quarter inch of insulation from every conductor before punching down on a 110 block. What do you tell him?",a:["That is correct, because the blades need bare copper to make contact with the conductor","Stop; the insulation stays on because the IDC cuts through it as the wire seats","Strip a half inch instead, so the blades have more bare copper","Strip only the striped conductors, which have thicker insulation"],c:1,e:"An insulation displacement connector cuts through the insulation as the wire seats and grips the copper itself. Stripping loosens that grip and invites corrosion."},
{id:"u5l1-4",t:"u5l1",q:"The cable you are about to open has a rip cord under the jacket. What is the BEST way to use it?",a:["Cut the cord off flush with the jacket so it cannot catch in the jack when you terminate","Pull the cord out of the cable with pliers before you score the jacket, then strip normally","Score the jacket lightly, pull the cord down, and cut the jacket away","Wrap the cord around the conductors behind the jack as an extra strain relief for the cable"],c:2,e:"The rip cord opens the jacket cleanly without a blade touching the pairs. It is not a strain relief, and cutting it off or pulling it out first wastes it."},
