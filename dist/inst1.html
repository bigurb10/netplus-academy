{id:"u5l1-5",t:"u5l1",q:"The label on the cable at the TR reads 2A-021, but the pull schedule and the port label call for 2A-012. What is the FIRST step?",a:["Terminate it on port 12, since the numbers are only two digits swapped","Relabel it 2A-012 with a printed label and carry on","Terminate it on port 21 and let the tester settle which is right","Check the schedule and the label at the outlet end to learn which one is wrong"],c:3,e:"The label, schedule, and port label must agree before you terminate. Checking the other end finds the real cable. Relabeling or guessing can put a cable on the wrong port and ruin the records."},

// u5l2
{id:"u5l2-1",t:"u5l2",q:"A Category 6A link certifies only at Category 5e limits. The cable and the patch panel are both Category 6A. What is the MOST likely cause?",a:["A Category 5e jack somewhere in the permanent link","A pull tension of 20 lbf, which is under the 25 lbf limit","A service loop coiled above the TR ladder rack","Slack at the outlet cut back to 305 mm (12 in)"],c:0,e:"The weakest part sets the category of the whole link, so one Category 5e jack makes the link a Category 5e link. The 20 lbf pull, the loop, and the 305 mm slack are all acceptable."},
{id:"u5l2-2",t:"u5l2",q:"The drawing calls for a Category 6 cross-connect in the TR, and the only blocks on the shelf are 66 blocks. What should you do?",a:["Use the 66 blocks, since the clips carry voice and data alike on Category 6 cable","Get 110 blocks, because a 66 block is for voice only and not for high-speed data","Use the 66 blocks and note the lower speed on the drawings for the next crew","Use the 66 blocks and rely on short jumpers to keep the data signal clean"],c:1,e:"A 66 block is a voice-grade termination and is not for high-speed data. A Category 6 cross-connect needs a 110 block, and a note on the drawings does not make the 66 block acceptable."},
{id:"u5l2-3",t:"u5l2",q:"You are seating wire on a 110 block with a punch tool. How should the blade face?",a:["Either way, because the tool seats and trims in both directions","Cutting side in, toward the cable you are keeping","Cutting side out, toward the end of the wire to be trimmed","Sideways, along the row of slots, so the cut is clean"],c:2,e:"The cutting side goes out so the tool trims the excess as it seats the wire. Facing in cuts the length you need or leaves the extra uncut."},
{id:"u5l2-4",t:"u5l2",q:"A fiber panel is fitted with LC adapters, and the pigtails delivered have SC connectors. What is the BEST action?",a:["Seat the SC connectors in the LC adapters and accept the small loss","Cut the SC connectors off and tape the bare fibers into the adapters","Mate them with a short APC patch cord to cover the difference","Fit SC adapters, or order LC pigtails, so the connectors match the panel"],c:3,e:"Adapters and connectors must be the same type. Forcing, taping, or mixing end faces damages the fiber and loses signal. Fit matching adapters or get matching pigtails."},
{id:"u5l2-5",t:"u5l2",q:"A new horizontal cable has been pulled into the TR. Where does it end?",a:["On a patch panel or a 110 block, in the rack or on the wall","On a keystone jack bolted to the backboard of the telecommunications room","On a 66 block in the entrance facility, before the outside protectors","On a fiber cassette"],c:0,e:"Horizontal cable ends in the TR on a patch panel or a 110 block. The keystone jack is the work area end."},

// u5l3
{id:"u5l3-1",t:"u5l3",q:"The job specification says T568B. At the last jack of the day the helper reaches for the T568A color code printed on the housing. What do you tell him?",a:["Either label works as long as the jack is a good one","Use T568B, the same scheme as every other jack, panel, and cord on the job","T568A is better for data, so use it from here on","Use T568A on the left of the faceplate and T568B on the right"],c:1,e:"One scheme per job. Mixing schemes crosses the orange and green pairs and the tester shows a wiremap fault."},
{id:"u5l3-2",t:"u5l3",q:"The job uses T568B. Which conductor lands on pin 6?",a:["Orange","White-green","Green","White-orange"],c:2,e:"In T568B pin 6 is green and pin 3 is white-green. In T568A pin 6 is orange. Pins 1 and 2 are white-orange and orange in T568B."},
{id:"u5l3-3",t:"u5l3",q:"The tester shows pairs 2 and 3 crossed on one link, with no opens or shorts. What is the MOST likely cause?",a:["A patch cord with a damaged plug at the tester end","A staple driven through the cable that shorts two pairs","A link longer than the 90 m permanent link limit","One end of the link was terminated T568A and the other end T568B"],c:3,e:"T568A and T568B swap the orange and green pairs. If the two ends use different schemes, those two pairs cross."},
{id:"u5l3-4",t:"u5l3",q:"A helper is converting a jack from T568A to T568B and asks which pair on pins 4 and 5 has to move. Which pair is on those pins?",a:["Blue","Green","Orange","Brown"],c:0,e:"The blue pair is on pins 4 and 5 in both schemes, so it does not move. Only the orange and green pairs swap."},
{id:"u5l3-5",t:"u5l3",q:"The job uses T568B. A helper crimps a field cord with T568B at one end and T568A at the other, and the foreman asked for a standard cord. What is the BEST action?",a:["Keep it as a crossover and label it for use between two switches in the rack","Recrimp the T568A end in T568B so the cord is straight-through","Keep it, since modern equipment senses the swap and the tester will pass it","Recrimp both ends in T568A, the older scheme, so the cord matches itself"],c:1,e:"A standard patch cord is straight-through with the job's one scheme at both ends. A mixed cord is a crossover, which is not what was asked for, and the job's scheme is T568B."},

// u5l4
{id:"u5l4-1",t:"u5l4",q:"On a 25-pair backbone cable you must punch down the pair colored red-orange. What pair number is it?",a:["6","12","7","17"],c:2,e:"Red is tip group 2 and orange is ring position 2, so n = 5 x (2 - 1) + 2 = 7."},
{id:"u5l4-2",t:"u5l4",q:"A tester shows that pair 19 of a 25-pair cable is open. Which colors do you look for?",a:["Violet-brown","Yellow-green","Black-brown","Yellow-brown"],c:3,e:"For pair 19, 19 - 1 = 18. Dividing by 5 gives 3 remainder 3, so the tip is the fourth color (yellow) and the ring is the fourth color (brown)."},
{id:"u5l4-3",t:"u5l4",q:"In a 150-pair cable you need pair 60. What color is the binder group that holds it?",a:["White-green","White-blue","White-orange","White-brown"],c:0,e:"Binder 1 holds pairs 1 to 25, binder 2 holds 26 to 50, and binder 3 holds 51 to 75. Binder colors follow the pair code, so binder 3 is white-green."},
{id:"u5l4-4",t:"u5l4",q:"A 100-pair cable has been pulled to the TR and the block is ready. What is the BEST order for the termination?",a:["Start with the last binder and work back toward the first","Work binder by binder and pair by pair in color order from pair 1","Terminate the easy pairs first and fill the others in as time allows","Terminate in whatever order the pairs come out of the stripped jacket"],c:1,e:"Terminating in color order makes a wrong pair show up as a break in the pattern. Out-of-order work crosses pairs and mislabels the block."},
{id:"u5l4-5",t:"u5l4",q:"A helper wants to fit bridging clips to a Category 6 data cross-connect on a 66 block. What is the BEST response?",a:["Fit them, since the clips are rated for any application on the block","Fit them only on the white-blue pairs, which carry the least traffic","Do not; the clips are for voice cross-connects and are not rated for category performance","Fit them but only on the last row of the block, away from the cable entry"],c:2,e:"Bridging clips make and open voice circuits for testing and are not rated for category performance. Data cross-connects use hardware rated for the category."},

// u5l5
{id:"u5l5-1",t:"u5l5",q:"A crew is wiring new cable television drops in a house. Which coax is the standard choice for new work?",a:["RG-58","RG-59","RG-11","RG-6"],c:3,e:"RG-6 is the 75 ohm standard for television and video in new work. RG-59 is thinner with more loss, and RG-11 is for long feeders."},
{id:"u5l5-2",t:"u5l5",q:"A crew has been installing twist-on F connectors and the drops are failing within weeks. What is the BEST fix?",a:["Replace them with compression connectors installed with the right tool","Tighten each twist-on connector with pliers so that it cannot work loose","Wrap each connector in electrical tape to stop movement at the fitting","Shorten each drop so the connector sits closer to the wall plate"],c:0,e:"Twist-on connectors loosen and can let braid touch the center conductor. A compression connector grips the cable evenly and holds."},
{id:"u5l5-3",t:"u5l5",q:"A new camera's picture drops out. At the connector you find stray braid strands touching the center conductor. What is the MOST likely fault?",a:["A bad ground at the monitor that lets the signal leak away","A short between the center conductor and the braid shield at the connector","An open center conductor where the pin was cut off inside the fitting","Excess loss, because RG-6 is the wrong cable for a camera run"],c:1,e:"Braid touching the center conductor shorts the signal. Remove the connector, trim the strands, and reterminate."},
{id:"u5l5-4",t:"u5l5",q:"A helper is about to fit an F connector on coax that has a stranded center conductor. What is the correct response?",a:["Solder the strands into a ball so that they fill the connector's pin socket","Go ahead, since the strands will form a pin when the connector is compressed","Stop; an F connector uses the cable's own solid center conductor as its pin","Strip a longer center conductor so the strands bend back over the dielectric"],c:2,e:"An F connector has no center pin and relies on a solid center conductor that is strong enough to be the pin. Stranded wire will not hold."},
{id:"u5l5-5",t:"u5l5",q:"A security camera's coax needs a connector at the recorder. Which is the usual choice?",a:["F, the threaded connector used for cable television","A twist-on F connector, favored because it fits without a tool","A crimp-style F connector, chosen for high-bandwidth video","BNC, a bayonet connector used for security video"],c:3,e:"BNC is the usual connector for security video and test equipment. The F connector is for cable television, and twist-on connectors are strongly discouraged."},

// u5l6
{id:"u5l6-1",t:"u5l6",q:"A patch cord with a green connector body is about to go into a blue adapter on a panel. What should you do?",a:["Stop; an APC end face must not mate with a UPC, so get matching types","Plug it in, because the small loss is acceptable on a short patch","Plug it in and clean the end face afterwards to restore the polish","Turn the connector to a different angle until the ferrules seat"],c:0,e:"Green is APC and blue is UPC. The angled and flat faces damage each other and lose signal, so match the types."},
{id:"u5l6-2",t:"u5l6",q:"A 24-fiber backbone must be terminated with the lowest loss possible. Which method is the BEST?",a:["Field-polished connectors, polished by hand at the panel","Fusion-spliced pigtails, spliced on a splice tray in the panel","Mechanical splice connectors, joined with index-matching gel","Crimped connectors, squeezed onto the buffer with a tool"],c:1,e:"A fusion splice joins a factory pigtail to the fiber with the lowest loss. Field polish and mechanical splices lose more, and a crimp is not a fiber termination method."},
{id:"u5l6-3",t:"u5l6",q:"The adapters in a fiber panel are green, and a helper holds one cord with a blue connector body and one with a green body. Which cord is the BEST choice?",a:["Either one, because the adapter sleeve lines the two faces up whatever the polish","The blue cord, because blue marks the lower-loss angled face","The green cord, because green marks an angled APC face that mates only with another APC","Neither, because green adapters take only multifiber MPO connectors"],c:2,e:"Green is APC and blue is UPC. The angled and flat faces damage each other and lose signal, so match the types."},
{id:"u5l6-4",t:"u5l6",q:"You cut a fiber and a tiny shard drops on the bench. What is the BEST way to handle it?",a:["Brush it onto the floor and sweep the area at the end of the shift","Drop it in the nearest open trash can along with the wipes and wrappers","Blow it off the bench","Put it in a sealed disposal container kept at the bench"],c:3,e:"Fiber shards are sharp and nearly invisible. Use a sealed disposal container and keep food and drink away from the work area."},
{id:"u5l6-5",t:"u5l6",q:"A new 120 m duplex multimode link shows no light at the receiver. Both end faces are clean and the labels look right. What is the MOST likely fault?",a:["Polarity is reversed, so transmit lands on transmit","The fiber is bent at 10 x its OD with no load, too wide for the light to stay in the core","The cable has a 900 micron tight buffer, which blocks light unless it is loose tube","The cladding is 125 micron, which is too large for a link of this length"],c:0,e:"Transmit at one end must land on receive at the other, and a polarity error stops the link until the pair is crossed. Tight buffer is normal indoors, 10 x OD is the correct no-load radius, and 125 micron is the standard cladding."},

// u5l7
{id:"u5l7-1",t:"u5l7",q:"A fiber link tests high in loss, and the connectors look clean to the eye. What is the FIRST step?",a:["Replace the cable, since high loss means the glass has broken","Inspect each end face with a scope and clean any contamination you find","Fusion-splice the fiber again at the panel to remove the loss","Retest with a shorter launch cord and accept the new reading"],c:1,e:"Contamination is the most common fiber fault and cannot be seen without a scope. Inspect, clean, and inspect again before you touch the cable."},
{id:"u5l7-2",t:"u5l7",q:"A dust cap falls on the floor, and you pick it up. What should you do?",a:["Put it back on the connector, because a cap only needs to keep out the larger dust","Blow the dust off the cap and snap it on, since the connector face is covered","Clean the connector before mating it and replace the dirty cap","Rub it on your sleeve"],c:2,e:"A cap that touched the floor is dirty and can carry that dirt onto the end face. Clean the connector before you mate it."},
{id:"u5l7-3",t:"u5l7",q:"A connector end face is dirty. What is the BEST first cleaning method?",a:["Soak a wipe in solvent and scrub the end face hard until the dust is gone","Rub the face on a clean cotton shirt sleeve with a firm circular motion","Blow across the end face with a short breath of air to lift the dust away","Dry-clean it with a one-click cleaner or a cassette cleaner"],c:3,e:"Dry cleaning comes first. Wet-to-dry is used only if dry cleaning fails, and breath, cloth, and heavy scrubbing leave oil or scratch the face."},
{id:"u5l7-4",t:"u5l7",q:"You want to look at a connector on a link that may be live. What is the safest practice?",a:["Never look into a fiber end with a source on; use a scope with a filter","Look through a hand lens, since glass blocks the invisible light","Look at it for only a second or two, because a brief glance cannot harm the eye","Hold it up to a work lamp and look at the face by eye"],c:0,e:"Never look into a fiber end with a source on. Treat every fiber as live until it is proven dark, and inspect with a scope that has a filter."},
{id:"u5l7-5",t:"u5l7",q:"After cleaning an end face, the scope still shows a scratch across the core. What is the BEST action?",a:["Clean it once more with a wet-to-dry wipe until the scratch is gone from the core","Replace the connector; a scratch is damage","Mate it anyway and test the link, since a scratch is only cosmetic","Polish the face with a dry swab until the scratch fades"],c:1,e:"A scratch is damage that cleaning cannot remove, and a scratched core loses light. The connector must be replaced."},

// u5l8
{id:"u5l8-1",t:"u5l8",q:"A shielded panel shows six ports with open shields, and the helper cut the drain wires to make the termination neat. What is the BEST fix?",a:["Leave them as they are, because the wiremap passes on every port","Ground the open shield at the far end only, with a short jumper","Reterminate those cables with the drain wire and foil on the shield contact","Tape the cut drain wire back along the jacket and carry on"],c:2,e:"The shield must be continuous and terminated. A cut drain wire leaves an open shield that acts as an antenna, and a passing wiremap says nothing about the shield."},
{id:"u5l8-2",t:"u5l8",q:"A shielded cable is to be terminated on a jack. What type of jack is correct?",a:["Any jack will do, because the shield is part of the cable and carries on by itself","A plastic jack, to keep the shield isolated","A jack with a longer faceplate","A shielded jack whose metal body contacts the cable's shield"],c:3,e:"A shielded cable in an unshielded jack is an unshielded cable. The jack's metal body must contact the shield."},
{id:"u5l8-3",t:"u5l8",q:"Three shielded racks sit in a row. How should they be bonded?",a:["Give each rack its own conductor back to the busbar","Bond only the first rack, because the racks are bolted to the same floor slab","Bond rack 1 to the busbar, then rack 2 to rack 1 and rack 3 to rack 2 in a chain","Rely on each rack's power cord ground as the bond, since it is already a green wire"],c:0,e:"Never daisy-chain. Each rack gets its own conductor back to the busbar, and a power cord ground is never the only ground for a rack."},
{id:"u5l8-4",t:"u5l8",q:"The tester shows a shield open at one outlet in a shielded system, while every pair passes the wiremap. The foreman wants to leave it. What is the MOST likely result?",a:["Nothing, because the pairs inside still twist and perform like a good shielded link","The open shield can act as an antenna, picking up noise and radiating it","The link gains a better ground, so crosstalk improves","The cable reads shorter by the length of the break"],c:1,e:"A broken or poorly bonded shield can pick up and radiate noise, so it can be worse than no shield at all. A passing wiremap says nothing about the shield."},
{id:"u5l8-5",t:"u5l8",q:"After the rack is bonded, the electrician runs a two-point bonding test and the foreman asks what reading you need to see. What is the recommended maximum resistance?",a:["0.5 ohm (500 milliohms)","1 ohm (1000 milliohms)","0.1 ohm (100 milliohms)","10 ohms (10000 milliohms)"],c:2,e:"The recommended maximum is 0.1 ohm (100 milliohms). Higher readings mean a poor connection to the busbar and need to be fixed."}
);

// INST1 Academy question bank, units 6 to 9. All questions are original jobsite scenarios.
window.FRA = window.FRA || {};
FRA.questions = FRA.questions || [];
FRA.questions.push(
// u6l1
{id:"u6l1-1",t:"u6l1",q:"You have just finished punching down 48 outlets on a floor, and no patch cords have been ordered yet. Which test is the BEST way to prove your work?",a:["A channel test using the tester's channel adapters and a borrowed pair of cords","A permanent link test using the tester's permanent link adapters","A wiremap check on each jack using a basic continuity tester and a spare cord","A qualification test run from a laptop plugged into a live switch port"],c:1,e:"The installer certifies the permanent link: the fixed cable and its two connectors, measured with the tester's own adapters. A channel test needs cords that do not exist yet, and a continuity check or a qualification test cannot prove a category."},
{id:"u6l1-2",t:"u6l1",q:"A run is finished and the tester is set to a permanent link limit. The foreman asks what maximum length the fixed cabling may have. What is it?",a:["100 m","80 m","90 m","110 m"],c:2,e:"The permanent link limit is 90 m (295 ft). The channel allows 100 m (328 ft) only because the cords are included, with cords totaling at most 10 m. The permanent link is what the installer is held to."},
{id:"u6l1-3",t:"u6l1",q:"The contract calls for test results to Category 6A, but the only tool on the cart shows wiremap and length. What is the BEST way to meet the contract?",a:["Run the wiremap tool on every link and write PASS on the report for the foreman to sign, since a link whose pins all connect is certified to every category","Use a verification tool, since wiremap and length are the only things a category depends on, and mark each link with the highest category its length reading allows","Use a qualification tool from the owner's network group and attach its speed report to the file","Get a certification tester that measures every parameter against the Category 6A limits and saves the reports"],c:3,e:"Only a certification tester measures each parameter across the frequency range against the limits of a category and saves a report that proves it. A verification tool finds wiring faults and a qualification tool shows speed, but neither proves a category."},
{id:"u6l1-4",t:"u6l1",q:"A user says an outlet that tested fine at turnover now runs slowly. You want to see what the user's equipment actually sees. Which test do you run?",a:["A channel test with the user's actual patch cords and equipment cord in place on that same outlet","A wiremap test of the jack with the equipment cord removed from the panel","A permanent link test with the tester's own adapters that excludes the cords","A length test of the horizontal cable with the far end left open at the outlet"],c:0,e:"The channel includes both cords, the connectors, and any cross-connect, which is exactly the path the user's equipment uses. A permanent link test leaves out the cords, which may be the actual problem."},
{id:"u6l1-5",t:"u6l1",q:"A crew has terminated twelve runs while the ceiling is still open and the ladders are up. When is the BEST time to test those runs?",a:["At closeout, once every run is tied off and the cords are ordered, so one visit covers the whole floor","Right after each run is terminated, while the ceiling is open and the ladders are still up","After the patch cords are installed and the users are on, so the test shows what their equipment sees","When the foreman first hears of a failing outlet, since earlier testing only finds faults a user would notice"],c:1,e:"Test as soon as a run is terminated, because a failure found while the ceiling is open costs minutes to fix. The same failure found at closeout may cost a lift, a ceiling tile, and a return trip."},

// u6l2
{id:"u6l2-1",t:"u6l2",q:"A saved report shows PASS on every line, but return loss has a margin of 0.3 dB. What does that result MOST likely tell you?",a:["The link failed return loss, and the tester printed PASS because the wiremap was correct","The link passes with a large margin, because any positive number is far from the limit","The link passes, but with almost no room, so a slightly worse connector would fail it","The link is too long, since a small return loss margin is how the tester reports length"],c:2,e:"Margin is the room left before the limit. At 0.3 dB the link passes but is one slightly worse termination, tight bend, or tie away from a fail, so look at the termination quality."},
{id:"u6l2-2",t:"u6l2",q:"Every link on a floor reads about 8 percent longer than the tape measurements of the routes. The wiremaps pass and the pair twist is within limits. What is the MOST likely cause?",a:["Every run was terminated with too much untwist in the pairs, which stretches the length reading by about the same amount on each link","The patch cords are being counted twice in each result, because the tester adds each cord's length to the permanent link result","The remote unit was charged but not set to its reference","The wrong cable type or NVP is selected on the tester"],c:3,e:"The tester converts the signal travel time to length using the cable's nominal velocity of propagation (NVP). Choosing the wrong cable type gives a consistent error across every link. Pair twist is already within limits, and untwist affects crosstalk, not length."},
{id:"u6l2-3",t:"u6l2",q:"A foreman asks whether crosstalk from all three other pairs combined is within limits on each pair. Which report line do you read to answer that?",a:["PSNEXT, which combines the crosstalk from the other three pairs on one pair","Propagation delay, because it adds the travel time of the other three pairs","Return loss, because it adds up the reflections from the other pairs in the cable","Insertion loss, because it counts the combined effect of every pair on the signal"],c:0,e:"PSNEXT is the power sum NEXT: the combined near-end crosstalk from the other three pairs onto one pair. Insertion loss, delay, and return loss measure different things."},
{id:"u6l2-4",t:"u6l2",q:"A link shows a wiremap fault and also fails NEXT. Which do you deal with FIRST?",a:["Chase the NEXT failure first, because crosstalk is the harder fault and the wiremap will clear on its own","Fix the wiremap fault first, because nothing else counts until every pin reaches the right pin","Check the length reading first, because a long cable is the usual reason a wiremap fault appears","Reset the limit to a lower category first, because the wiremap and NEXT limits depend on that one choice"],c:1,e:"A wiremap fault must be fixed first, because nothing else on the report counts until each pin reaches the right pin. The NEXT failure may even be caused by the wiring fault, such as a split pair."},
{id:"u6l2-5",t:"u6l2",q:"The summary of a failing link lists a worst case on pair 7-8 at a high frequency. What is the BEST use of that line?",a:["Ignore it and reterminate the whole link, because the worst case is a printing detail","Replace the cable, because a worst case at high frequency always means a bad cable","Inspect the termination on that pair first, because it is the pair closest to the limit","Move the test limit up one category, since the worst case is measured against the next level"],c:2,e:"The worst case is the pair or combination closest to the limit, and the frequency where it happens. It tells you where to look first. High-frequency problems usually come from the last inches of the termination, not the cable."},

// u6l3
{id:"u6l3-1",t:"u6l3",q:"You swap the tester's permanent link adapters for a new set partway through the morning. What is the FIRST thing to do before the next link?",a:["Run the autotest on the next link and compare it to the last one, since the tester adjusts for new adapters itself","Choose a new limit to match the new adapters, because each adapter set carries its own category limit","Save the old results into a new folder","Set the reference again with the new adapters before testing the next link"],c:3,e:"The reference removes the tester's own adapters and cords from every result. When the adapters change, the old reference no longer matches, so set it again with the new ones before testing the next link."},
{id:"u6l3-2",t:"u6l3",q:"You tested 12 links to the Category 6 limit before reading the job specification, which calls for Category 6A. All 12 passed. What is the BEST next step?",a:["Retest all 12 links with the Category 6A limit selected, and keep the new results","Keep the results, because a link that passes Category 6 will also pass Category 6A","Change the label on the report to Category 6A so the file matches the specification","Test only the three longest runs, since the others have more margin than the limit"],c:0,e:"The links were never held to the stricter limit, so the passes prove nothing for Category 6A. Choose the limit before the first test, and retest anything measured against the wrong one."},
{id:"u6l3-3",t:"u6l3",q:"You finish an autotest on a link whose label reads B2-014. How should you save the result?",a:["Under the next number in the tester's file list, then match the numbers later","Under the cable label, B2-014, so the record matches the cable","Under the date and your initials, so the file shows who ran it","Under the room name, because the drawings are keyed to rooms"],c:1,e:"Saving under the cable label keeps the test record, the drawing, the panel record, and the cable all in agreement. Numbers or room names have to be matched by hand later, and that is where records go wrong."},
{id:"u6l3-4",t:"u6l3",q:"A link finishes with a pass marked by an asterisk. The specification does not say how to treat such results. What is the BEST action?",a:["Rewrite the result as a failure and reterminate the link without checking anything else","Accept it as a pass, since an asterisk means the tester found nothing outside the limit","Inspect the adapters and cords, retest, and ask the foreman how the contract treats marginal results","Raise the limit by one category for that link so the asterisk is no longer printed"],c:2,e:"An asterisk means the result is within the tester's accuracy of the limit, and many specifications treat it as a fail. Check the adapters, retest, and find out what the contract requires instead of assuming."},
{id:"u6l3-5",t:"u6l3",q:"You are testing a singlemode backbone with a light source and power meter. At which pair of wavelengths do you test it?",a:["850 and 1300 nm","1300 and 1550 nm","850 and 1310 nm","1310 and 1550 nm"],c:3,e:"Singlemode is tested at 1310 and 1550 nm. Multimode is tested at 850 and 1300 nm, which is why the first option is the wrong family."},

// u7l1
{id:"u7l1-1",t:"u7l1",q:"All 24 links from one closet show pairs 2 and 3 crossed, and nothing else is wrong. What is the MOST likely cause?",a:["The jacks at the outlets were punched with T568A while the panel was wired T568B","One conductor in each cable was cut when the jacket was removed at the panel end","A staple was driven through every cable where it passes the same ceiling bracket","One wire from each of two pairs was swapped on every jack during punch down"],c:0,e:"A consistent crossing of pairs 2 and 3 across many links signals T568A on one end and T568B on the other. Opens and shorts hit single links, and a split pair shows as a NEXT problem, not as crossed pairs."},
{id:"u7l1-2",t:"u7l1",q:"One link shows pin 5 with no connection to the far end, and the tester names the outlet end. What do you do FIRST?",a:["Pull a new cable, because a missing connection means the cable has broken inside the wall","Reterminate that pair at the outlet end the tester named, then retest","Swap the patch panel port, since an open at one end is nearly always a bad panel position","Replace the tester's remote adapter, because it reads an open when its contacts are worn"],c:1,e:"An open is almost always a conductor that was missed or poorly seated, so reterminate the pair at the end the tester names and retest. Replacing cable or equipment is a last step, not a first one."},
{id:"u7l1-3",t:"u7l1",q:"A link passes a simple continuity check on every pin but fails NEXT badly. What is the MOST likely cause?",a:["A pair is reversed, tip to ring, at the outlet, which passes pin to pin and then fails the crosstalk test on that pair","A wire is open on one pin at the panel end, which the continuity check would have caught on that pin","One wire from each of two pairs was swapped, a split pair","The link is longer than the 90 m limit"],c:2,e:"A split pair connects every pin to the right pin, so continuity passes, but the two wires of a pair are no longer twisted together. The crosstalk is high, and the NEXT result is what reveals it."},
{id:"u7l1-4",t:"u7l1",q:"One link, where the cable runs against a sharp bracket, shows two pins shorted together. What is the MOST likely cause?",a:["T568A on one end and T568B on the other, which ties pairs 2 and 3 together at the pins","A split pair from one wire of two pairs being swapped, which joins the two pairs at one pin","A run over 90 m, because a long cable shorts together the pins at the far end of the link","A nicked jacket where the cable rubbed the sharp bracket, letting two conductors touch"],c:3,e:"A short needs two conductors, or one conductor and a metal part, touching. A cable rubbed against a bracket can have its jacket and insulation nicked. The wrong wiring standard or a split pair does not cause a short."},
{id:"u7l1-5",t:"u7l1",q:"While tracing an open, you find a cable entering a junction box that you think holds energized conductors. What is the BEST thing to do?",a:["Stay out of the box, tell the foreman, and let the electrician who controls it make it safe","Open the box and work carefully around the conductors with insulated pliers, since insulated tools make it safe to work near energized conductors","Tape over the conductors in the box and continue, since taped conductors cannot cause a shock","Switch off the nearest breaker you can find and work in the box without a lockout"],c:0,e:"Never work in a box or raceway with energized conductors. Stop and report it, so the electrician who controls the circuit can lock it out. Guessing at a breaker is exactly how people are hurt."},

// u7l2
{id:"u7l2-1",t:"u7l2",q:"A NEXT failure leads you to reterminate the near end. For Category 5e and above, what is the most untwist you may leave on a pair?",a:["25 mm","13 mm","38 mm","50 mm"],c:1,e:"Untwist at most 13 mm (0.5 in) for Category 5e and above. More untwist is the most common cause of a NEXT failure, because the crosstalk is created where the pairs are no longer twisted."},
{id:"u7l2-2",t:"u7l2",q:"A Category 6A link fails NEXT. You find a Category 5e jack in the outlet, and the cable and panel are Category 6A. What is the MOST likely cause?",a:["A run that is longer than the 90 m permanent link limit, which would show as a length failure on the report and not as NEXT","A cable pulled with too much tension in the pathway, which loosens the twist in the pairs along the whole run of the cable","A component rated for a lower category than the rest of the link","A patch cord with a worn plug used in the permanent link test"],c:2,e:"A link performs only as well as its lowest-category part. A Category 5e jack in a Category 6A link makes the NEXT result fail even if the terminations are neat. A permanent link test does not use patch cords at all."},
{id:"u7l2-3",t:"u7l2",q:"A link measures 94 m on the tester, and the length reading is the only thing failing. What is the BEST fix?",a:["Reterminate both ends carefully, because a long reading comes from a poor connection","Replace the cable with a higher category, because that lowers the length reading","Keep the link and add a second set of patch cords to bring the channel under 100 m","Shorten the route or move the outlet closer, because 90 m is the permanent link limit"],c:3,e:"A permanent link over 90 m fails on length, and no termination or cable category changes the length. The only fixes are a shorter route, a closer telecommunications room, or a design change."},
{id:"u7l2-4",t:"u7l2",q:"A return loss failure shows a fault at 38 m on a 60 m run, far from both ends. What do you check FIRST?",a:["Inspect the pathway near the 38 m mark for a kink, a tight cable tie, or a crushed section","Replace the patch panel, since return loss is a property of the panel and not the cable","Reterminate the outlet end, because every return loss problem begins at a jack","Test a second tester's cords against the first, because the fault is a bad adapter"],c:0,e:"A fault far from both ends points to the cable itself. A kink, a bend tighter than the minimum radius, or a tie pulled until it dents the jacket reflects signal, so walk the pathway at that distance."},
{id:"u7l2-5",t:"u7l2",q:"A long run through a hot ceiling space fails insertion loss only on warm afternoons and passes in the morning. What is the MOST likely cause?",a:["Split pairs that appear only when the cable expands in the afternoon heat","Heat in the ceiling space raises the cable's loss, and the run is near the limit","A crossed pair that moves in the ceiling when the building warms up","A calibration drift that appears each afternoon whenever the reference is set"],c:1,e:"Insertion loss grows with length and with temperature, so a long run through a hot space can fail when warm and pass when cool. The fix is a shorter route or cooler pathway, not rewiring."},

// u7l3
{id:"u7l3-1",t:"u7l3",q:"A user reports that a phone does not link. What do you do FIRST?",a:["Reterminate the outlet jack to the color code, since most no-link reports start at a bad punch down","Pull a replacement cable to the outlet, because a link that will not come up has a broken run","Swap in a known-good patch cord and check the switch port and the label","Run a full permanent link test with the tester's adapters before anything is touched at the desk"],c:2,e:"Check the simple things first: the patch cord, the switch port, and the labels. Most failures are a bad cord or the wrong port, and swapping a known-good cord takes seconds."},
{id:"u7l3-2",t:"u7l3",q:"The permanent link test on an outlet passes with good margins, but the user's connection still fails. Where do you look NEXT?",a:["At the horizontal cable in the ceiling, because a passing link can still hide a break","At the tester's calibration date, because a good result may be an out-of-date reading","At the jack category, since a passing result may still mean a lower-category jack","At the patch cords and the equipment, because the fixed cabling has just tested good"],c:3,e:"The permanent link test isolates the fixed cabling. If it passes, the fault lies outside it, in the cords, the port, or the user's equipment. Isolating the link from the cords is the point of the method."},
{id:"u7l3-3",t:"u7l3",q:"An outlet fails. A tech swaps the cord, the switch port, and the jack in one visit, and the link comes up. What would have been the BEST method?",a:["Change one variable at a time and test between changes, so the true cause is known and the fix can be repeated","Replace the whole run at once, since a fix that works does not need to be understood","Change the three parts in the same order each time, so the visit is repeatable","Replace only the jack, because it is the cheapest of the three parts to change"],c:0,e:"Changing several things at once leaves you not knowing which one fixed the fault, so it may come back or repeat elsewhere. Change one variable, test, and then move on."},
{id:"u7l3-4",t:"u7l3",q:"You reterminated a failing jack, and the link now passes. What is the BEST next step?",a:["Move on to the next outlet and fix the paperwork once the whole floor is done","Save the new result under the same label, replacing the FAIL, and log the cause and fix","Delete the old report file and keep no record of the repair","Tell the foreman by phone only and leave the record as it is"],c:1,e:"The repair is not finished until the record is. Replace the FAIL result with the new pass under the same cable label, and note the cause, the fix, the date, and who did it."},
{id:"u7l3-5",t:"u7l3",q:"A repair changed the route of one run and moved its outlet label. Which records must you update?",a:["The tester file, the foreman's notes, and the contractor's invoice, which together hold the route history of the run","Only the cable label and the panel port, since the drawings are never changed once a job is accepted","The label, the drawings, and the administration record, so all of them agree with the tester file","Only the tester file, because the other records follow whatever the saved result says"],c:2,e:"The label, the drawing, the panel record, and the tester file must all agree. A change that is recorded in one place and not the others leaves the next technician with conflicting information."},

// u8l1
{id:"u8l1-1",t:"u8l1",q:"The foreman sends you to run new cable in a floor where forty people are working. What do you do FIRST?",a:["Order the cable and begin termination, since a survey is only needed in empty buildings","Start pulling from the closet and move any furniture that is in the way of the new route","Open every ceiling tile along the route at once so the crew can see what is above","Survey the pathways and the live circuits, and ask for the asbestos report before any work starts"],c:3,e:"A survey before work shows the pathways, the live circuits, and any asbestos concerns, and it keeps the job from stopping on day two. Opening ceilings or moving furniture first risks disturbing something unknown."},
{id:"u8l1-2",t:"u8l1",q:"Lifting a tile, you find crumbling insulation on a pipe that was not on the survey. What is the BEST response?",a:["Keep others away, report it, and wait for an all-clear","Vacuum it up carefully, then continue with the pull and say nothing","Wet it with a rag and push it aside so you can reach the tray","Wear a dust mask and carry on, because it is only a small area"],c:0,e:"If you suspect asbestos, stop work, keep others away, and report it. Never disturb, sweep, or vacuum it. Work resumes only when the owner confirms the area is clear."},
{id:"u8l1-3",t:"u8l1",q:"You must open a ceiling in a hospital corridor. What do you do before lifting any tile?",a:["Lift one tile first to see how much dust there is, and seal the area only if it looks heavy","Follow the facility's infection control rules, which may require barriers, a sealed area, or a permit","Start work after hours, since an empty ward corridor has no infection control rules","Wipe down each tile with a damp cloth as you lift it, and the area is then treated as clean"],c:1,e:"Hospitals have infection control rules, which may require sealed work areas, barriers, or a permit before a ceiling is opened, because dust can reach patients. You follow the rules you are given."},
{id:"u8l1-4",t:"u8l1",q:"A weekend cutover moves 40 users to new cabling. Which item is the BEST protection against a failed move?",a:["Cut the old cables as each group of users moves, so the old system cannot be used again","Label only the new cables, since the old ones will be removed after the move","A back-out plan that keeps the old system connected and working until the new one is accepted","Skip testing on the new cables, since the short window leaves no time and users will report any faults"],c:2,e:"A back-out plan lets you return users to the old system if the new one fails inside the change window. New cabling should be installed, tested, and labeled before the move, and the old kept working until acceptance."},
{id:"u8l1-5",t:"u8l1",q:"An old cable in the ceiling is in your way, and you are about to cut it to pull your new run. What is the FIRST step, before it is cut or moved?",a:["Cut it where it blocks the new pull, since a cable that is not in your drawings is not in service","Pull it out of the tray from the closet end, since a cable pulled out cannot affect the new run","Pull the new run first and deal with the old cable afterward, since the foreman only asked for the new run","Check the records and trace it with a tone and probe to learn what it is before touching it"],c:3,e:"An old cable may carry a live circuit, including life-safety or building controls. Identify it by the records, a tone and probe, or by asking the owner before you cut or move anything."},

// u8l2
{id:"u8l2-1",t:"u8l2",q:"Above a corridor you find a cable with a connector at one end and a cut end at the other, with no tag. How does the code treat it?",a:["It is abandoned, because it is not terminated at both ends and carries no tag for future use","It is in service, because it still has a connector on one end","It is abandoned only if it is more than a few years old, and then only with a permit","It is protected, because any cable with a connector must stay until the owner asks"],c:0,e:"Installed cable that is not terminated at both ends and is not identified for future use is abandoned, and the accessible portion must be removed. One connector does not keep a cable in service."},
{id:"u8l2-2",t:"u8l2",q:"You find three cables cut at both ends, each carrying a clear tag marked for future use with a date. What do you do with them?",a:["Remove them with the rest of the abandoned cable, because they are cut at both ends","Leave them in place, since they are identified for future use, and keep the tags legible","Cut them back to the tray edge so they do not block the new tray, and discard the tags with the cut ends","Pull them out and keep the tags in a drawer, since a tag no longer matters once the cable is gone"],c:1,e:"Cable identified for future use with a tag is not abandoned, so it stays. If a tag is faded, replace it with a clear one and ask the owner whether the cable is still wanted."},
{id:"u8l2-3",t:"u8l2",q:"Fourteen old cables hang above a ceiling you are clearing. What is the FIRST step before removing any of them?",a:["Cut them all at the ceiling line first, since cutting is the fastest way to find which are live","Pull them all out from one end at once, so any that are live show themselves when they snag","Confirm each one is out of service using the records, a tone and probe, or the owner","Tag them all as future use, so the owner can decide later which of them were abandoned"],c:2,e:"Confirm each cable is out of service with the records, a tone and probe, or the owner before removing anything. A cable that looks dead may carry a life-safety or building circuit."},
{id:"u8l2-4",t:"u8l2",q:"While pulling an abandoned cable out from the far end, it stops and will not move. What is the BEST response?",a:["Pull harder with a second person on the end, since abandoned cable is not worth saving","Cut it at the snag and leave the rest in the pathway so the removal can be called done","Tie the cable to a ladder and use it as a lever to free the cable from the pathway","Stop and look for a snag, a tie, or a firestopped sleeve before pulling again"],c:3,e:"A cable that will not move is caught on a tie, a hanger, or a firestop. Forcing it can pull down a ceiling or damage other cables. Stop, find the hold, release it, and continue."},
{id:"u8l2-5",t:"u8l2",q:"You have removed several abandoned cables through a fire-rated wall. What do you do BEFORE you leave the area?",a:["Firestop every opening you made or disturbed and update the records to show what was removed","Leave the openings for the next crew, since firestopping belongs to the trade that owns the wall","Update the label on the remaining cable only, because the drawings never show removed cable","Tell the foreman by text which cables came out and leave the paperwork until the closeout"],c:0,e:"Any penetration you open must be firestopped, and the records and drawings must show what you removed so they match the building. Leaving an open penetration breaks the fire barrier."},

// u9l1
{id:"u9l1-1",t:"u9l1",q:"You are routing 60 data cables through a corridor and find a fire alarm circuit in the same ceiling. What is the BEST way to handle it?",a:["Tie the data cables to the fire alarm cable's supports, since the pathway is already built and strong enough","Route your cables on their own supports, away from the fire alarm cable, and do not move it","Move the fire alarm cable to the edge of the tray to free space for your bundle","Bundle the data and alarm cables together with one set of ties and label the whole bundle as data"],c:1,e:"Life-safety circuits have their own pathways, supports, and identification. Do not move, cut, or bundle them with other cables unless the code and the design allow it."},
{id:"u9l1-2",t:"u9l1",q:"You find an unlabeled cable running through your tray. What do you do?",a:["Cut it back to the tray edge and see whether anyone complains about the missing circuit","Move it aside onto the nearest bracket so it is out of your way, then label it unknown","Leave it uncut and ask the foreman to trace it to the contractor who owns that circuit","Tag it as abandoned and remove it, since an unlabeled cable is not part of any system"],c:2,e:"If you do not know what a cable is, do not cut or move it. The foreman can trace it to the contractor who owns it, since it may be a life-safety or building circuit."},
{id:"u9l1-3",t:"u9l1",q:"A fire alarm circuit needs a short extension, and the only cable on the truck is a reel of data cable. What is the BEST action?",a:["Use the data cable, since the circuit is short and the gauge is about right","Use the data cable and mark it as fire alarm so the inspector knows what it is","Splice the data cable to the existing run, where the jacket colors can be matched","Wait for the listed fire alarm cable the system calls for, then install it"],c:3,e:"A system requires the cable and listing it calls for. Fire alarm circuits use listed fire alarm cable, and substituting data cable because it is on the truck can fail inspection or the system itself."},
{id:"u9l1-4",t:"u9l1",q:"You pulled and labeled the cable for a sound masking system. Who normally makes the final connections to its speakers?",a:["The sound contractor, who terminates and tests its own system","You, because every cable you pull is yours to terminate","The electrician, because speaker circuits are power circuits","The inspector, because the connections are checked as they are made"],c:0,e:"Often the system's own contractor terminates and tests its equipment. You pull and label cable and do not terminate to equipment you were not assigned. Confirm who does what with the foreman."},
{id:"u9l1-5",t:"u9l1",q:"A building automation contractor will share your ceiling pathway. What is the BEST way to coordinate?",a:["Work separately and sort out any problems when the contractors meet at closeout","Agree who firestops, label both systems' cables, and record them on the drawings","Take over the pathway, since the data system is the largest one in the ceiling","Leave the controls cable unlabeled, because only its contractor will ever see it"],c:1,e:"Agree the pathway, the order of work, and who firestops each opening. Label every cable at both ends and record it on the drawings so the next technician can tell the systems apart."},

// u9l2
{id:"u9l2-1",t:"u9l2",q:"The designer specifies a type 4 PoE device for a camera. How much power does the switch supply at the source for that type?",a:["60 W","30 W","90 W","15.4 W"],c:2,e:"PoE type 4 is 90 W at the source. Type 1 is 15.4 W, type 2 is 30 W, and type 3 is 60 W. The device receives less than the source sends, because the cable uses some of it as heat."},
{id:"u9l2-2",t:"u9l2",q:"A tray holds 48 high-power PoE cables bundled tightly together, and the inner cables run warm. What is the BEST way to reduce the heat?",a:["Wrap the bundle in tape so the warmth spreads evenly through all the cables in it","Cut the cable lengths shorter at the switch end so the cable has fewer feet to heat","Pull the cables tighter with extra ties so less air sits between the individual cables","Split the cables into smaller loose bundles, and use higher-category cable where the design allows"],c:3,e:"Power in the conductors makes heat, and a big bundle holds it in. Smaller bundles, higher-category cable with less resistance, and separation between bundles all let the heat out."},

        if (!Array.isArray(figs) || !figs.length) { p('figures scenario needs a non-empty figures array'); break; }
        figs.forEach((f, i) => {
          if (!f || FIG_KINDS.indexOf(f.kind) < 0) p(`figure ${i + 1}: kind must be meter, cylinder, or strip`);
          else if (f.kind === 'strip' && (f.value == null || num(f.value) !== num(f.rate))) p(`figure ${i + 1}: a strip needs value equal to its rate so a task can measure it`);
        });
        break;
      }
      case 'choices':
        if (typeof sc.text !== 'string' || !sc.text.trim()) p('choices scenario needs text');
        if (sc.svg != null && (typeof sc.svg !== 'string' || !/<svg\b/i.test(sc.svg))) p('choices svg must be an <svg> drawing');
        break;
    }
    return out;
  }

  // ---------- validate: every way a lab record can be wrong, as plain sentences ----------
  function validate(lab) {
    const out = []; const p = s => out.push(s);
    if (!lab || typeof lab !== 'object') return ['lab is not an object'];
    if (!lab.id || !/^[a-z0-9-]+$/.test(lab.id)) p('lab id must match /^[a-z0-9-]+$/');
    if (!lab.lesson) p('lab has no lesson');
    if (!lab.title) p('lab has no title');
    if (NAMES.indexOf(lab.instrument) < 0) p(`unknown instrument "${lab.instrument}"`);
    if (!lab.scenario || typeof lab.scenario !== 'object') p('scenario is missing'); else shape(lab).forEach(p);
    if (!Array.isArray(lab.tasks) || !lab.tasks.length) { p('no tasks'); return out; }
    const why = obj(lab.why); const seen = Object.create(null);
    lab.tasks.forEach((t, i) => {
      const id = t && t.id; const tag = `task ${id || '#' + (i + 1)}`;
      if (!id || !/^[a-z0-9-]+$/.test(id)) p(`${tag}: id must match /^[a-z0-9-]+$/`);
      if (seen[id]) p(`${tag}: duplicate id`); seen[id] = true;
      if (!t.prompt) p(`${tag}: no prompt`);
      if (!Object.prototype.hasOwnProperty.call(why, id) || !why[id]) p(`${tag}: no why`);
      if (t.kind === 'reading') {
        if (!Array.isArray(t.expect) || t.expect.length !== 2 || !isFinite(t.expect[0]) || !isFinite(t.expect[1]) || t.expect[0] > t.expect[1]) p(`${tag}: expect must be [min, max]`);
        else if (t.measure && NAMES.indexOf(lab.instrument) >= 0) {
          const m = measure(lab, t);
          if (!m || m.value == null) p(`${tag}: measure gives no reading (${m && m.text ? m.text : 'unknown point or parameter'})`);
          else if (!(t.expect[0] <= m.value - m.lsd && t.expect[1] >= m.value + m.lsd)) p(`${tag}: expect [${t.expect[0]}, ${t.expect[1]}] does not contain the reading ${m.value} with jitter ${m.lsd}`);
        }
      } else if (t.kind === 'verdict') {
        if (t.expect !== 'pass' && t.expect !== 'fail') p(`${tag}: verdict expect must be "pass" or "fail"`);
        else { const v = truth.verdict(lab); if (v && v !== t.expect) p(`${tag}: verdict expect "${t.expect}" but the scenario's limits say "${v}"`); }
      } else if (t.kind === 'choice') {
        if (!Array.isArray(t.options) || t.options.length < 2) p(`${tag}: choice needs at least two options`);
        else if (!Number.isInteger(t.expect) || t.expect < 0 || t.expect >= t.options.length) p(`${tag}: expect must index an option`);
      } else p(`${tag}: kind must be reading, verdict, or choice`);
    });
    return out;
  }

  // ---------- current: the panel's displayed value for a task (the Record button) ----------
  function current(lab, ui, task) {
    const r = ui && ui.readout; const m = obj(task && task.measure); if (!r) return null;
    switch (lab && lab.instrument) {
      case 'dmm': case 'safety': return r.invalid || r.value == null ? null : r.value;
      case 'monitor': return m.param && r[m.param] != null ? r[m.param] : null;
      case 'infusion': return m.what === 'volume' && r.volume != null ? r.volume : null;
      case 'defib': return r.delivered == null ? null : r.delivered;
      default: return null;
    }
  }

  // ---------- figures: SVG a reading can be taken from ----------
  function figure(f) {
    f = obj(f);
    if (f.kind === 'meter') {
      const min = num(f.min), max = num(f.max) || 1, v = num(f.value); const frac = Math.max(0, Math.min(1, (v - min) / (max - min)));
      const ang = 180 - 180 * frac; const cx = 110, cy = 110, r = 90; const rad = ang * Math.PI / 180;
      const nx = cx + r * Math.cos(rad), ny = cy - r * Math.sin(rad); let ticks = '';
      for (let i = 0; i <= 10; i++) {
        const a = (180 - 18 * i) * Math.PI / 180; const inner = i % 5 ? r - 6 : r - 10;
        ticks += `<line x1="${(cx + inner * Math.cos(a)).toFixed(1)}" y1="${(cy - inner * Math.sin(a)).toFixed(1)}" x2="${(cx + r * Math.cos(a)).toFixed(1)}" y2="${(cy - r * Math.sin(a)).toFixed(1)}" stroke="currentColor" stroke-width="${i % 5 ? 1 : 2}"/>`;
        if (i % 5 === 0) ticks += `<text x="${(cx + (r - 22) * Math.cos(a)).toFixed(1)}" y="${(cy - (r - 22) * Math.sin(a) + 4).toFixed(1)}" font-size="10" text-anchor="middle" fill="currentColor">${Number((min + (max - min) * i / 10).toPrecision(6))}</text>`;
      }
      return `<svg class="fig meter" viewBox="0 0 220 125" width="220" height="125" role="img" aria-label="${esc(f.label || 'analog meter')}" data-kind="meter" data-value="${v}" data-angle="${ang.toFixed(1)}"><path d="M ${cx - r} ${cy} A ${r} ${r} 0 0 1 ${cx + r} ${cy}" fill="none" stroke="currentColor" stroke-width="2"/>${ticks}<line x1="${cx}" y1="${cy}" x2="${nx.toFixed(1)}" y2="${ny.toFixed(1)}" stroke="#C8322B" stroke-width="2"/><circle cx="${cx}" cy="${cy}" r="4" fill="currentColor"/><text x="${cx}" y="${cy + 13}" font-size="11" text-anchor="middle" fill="currentColor">${esc(f.unit || '')}</text></svg>`;
    }
    if (f.kind === 'cylinder') {
      const ml = num(f.ml) || 100; const v = Math.max(0, Math.min(ml, num(f.value))); const level = 100 * v / ml;
      const top = 20, bottom = 200, w = 70, x = 30; const h = bottom - top; const liquidTop = bottom - h * v / ml; let ticks = '';
      for (let i = 0; i <= 10; i++) { const y = bottom - h * i / 10; ticks += `<line x1="${x}" y1="${y}" x2="${x + 14}" y2="${y}" stroke="currentColor" stroke-width="1.5"/><text x="${x + 18}" y="${y + 4}" font-size="9" fill="currentColor">${ml * i / 10}</text>`; }
      return `<svg class="fig cylinder" viewBox="0 0 130 220" width="130" height="220" role="img" aria-label="${esc(f.label || 'graduated cylinder')}" data-kind="cylinder" data-value="${v}" data-level="${level.toFixed(1)}"><rect x="${x}" y="${top}" width="${w}" height="${h}" fill="none" stroke="currentColor" stroke-width="2" rx="3"/><rect x="${x + 2}" y="${liquidTop.toFixed(1)}" width="${w - 4}" height="${(bottom - liquidTop).toFixed(1)}" fill="#7fb3ff" opacity="0.7"/>${ticks}</svg>`;
    }
    if (f.kind === 'strip') {
      const rate = num(f.rate), seconds = num(f.seconds) || 6; const px = 100; const W = seconds * px, H = 120, base = 80; let grid = '';
      for (let xg = 0; xg <= W; xg += 4) grid += `<line x1="${xg}" y1="0" x2="${xg}" y2="${H}" stroke="#f0a0a0" stroke-width="${xg % 20 ? 0.3 : 0.8}"/>`;
      for (let yg = 0; yg <= H; yg += 4) grid += `<line x1="0" y1="${yg}" x2="${W}" y2="${yg}" stroke="#f0a0a0" stroke-width="${yg % 20 ? 0.3 : 0.8}"/>`;
      let d = `M0 ${base}`; let beats = 0;
      if (f.flat || rate <= 0 && !f.chaotic) d += ` L${W} ${base}`;
      else if (f.chaotic) { for (let xg = 0; xg <= W; xg += 3) d += ` L${xg} ${(base + 25 * Math.sin(xg / 7) * Math.cos(xg / 11) + 10 * Math.sin(xg / 3)).toFixed(1)}`; }
      else {
        const period = 60 / rate * px;
        for (let x0 = 20; x0 < W; x0 += period) { beats++; d += ` L${(x0 - 14).toFixed(1)} ${base} Q${(x0 - 10).toFixed(1)} ${base - 6} ${(x0 - 6).toFixed(1)} ${base} L${(x0 - 2).toFixed(1)} ${base + 4} L${x0.toFixed(1)} ${base - 50} L${(x0 + 2).toFixed(1)} ${base + 8} L${(x0 + 4).toFixed(1)} ${base} L${(x0 + 10).toFixed(1)} ${base} Q${(x0 + 16).toFixed(1)} ${base - 12} ${(x0 + 22).toFixed(1)} ${base}`; }
        d += ` L${W} ${base}`;
      }
      return `<svg class="fig strip" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(f.label || 'ECG strip')}" data-kind="strip" data-rate="${rate}" data-beats="${beats}" data-seconds="${seconds}">${grid}<path d="${d}" fill="none" stroke="#14212E" stroke-width="1.5"/></svg>`;
    }
    return '';
  }

  // ---------- panels ----------
  // render(el, lab, ui, api): draws the instrument into el and wires its controls. ui is a plain
  // object the app keeps per lab for the page's lifetime, so control positions survive the app's
  // re-renders; ui.readout is the last measurement shown, which the task sheet copies through
  // current(). Buttons use data-ins (never data-act, which belongs to the app). api.toast is optional.
  const PANEL = {}; const HANDLE = {};
  PANEL.figures = lab => `<div class="ins figures">${(obj(lab.scenario).figures || []).map((f, i) => `<figure class="ins-fig"><div class="ins-fig-n">Figure ${i + 1}</div>${figure(f)}${f.caption ? `<figcaption>${esc(f.caption)}</figcaption>` : ''}</figure>`).join('')}</div>`;
  HANDLE.figures = () => false;
  // A choices lab may show a pack-drawn picture (a jack face, a punch block, a tester screen) above its text. The svg is
  // pack content, trusted like the dmm circuit drawings; the text is escaped. With a drawing, the text describes it and
  // wraps as prose; without one, the text is a screen (console output) and keeps its lines in the terminal block.
  PANEL.choices = lab => { const sc = obj(lab.scenario); return typeof sc.svg === 'string' ? `<div class="ins-drawing wide">${sc.svg}</div><p class="ins-note">${esc(sc.text || '')}</p>` : `<pre class="ins-text">${esc(sc.text || '')}</pre>`; };
  HANDLE.choices = () => false;

  const sel = (ui, field, opts) => `<select data-field="${field}">${opts.map(([v, l]) => `<option value="${v}" ${ui[field] === v ? 'selected' : ''}>${l}</option>`).join('')}</select>`;
  const numField = (ui, field, label, min, max, dis) => `<label class="field">${label}<input type="number" data-field="${field}" min="${min}" max="${max}" value="${ui[field]}" ${dis ? 'disabled' : ''}></label>`;

  // The drawing's natural size in the units the scenario's points use: the root <svg> tag's viewBox
  // first (points are user units), else its width/height attributes. Scoped to the root tag so an
  // inner rect's width or a stroke-width never supplies the size. Hotspots are placed in percent of
  // this size so they follow the SVG when CSS scales it to a narrow screen.
  function drawingSize(svg) {
    const tag = (/<svg\b[^>]*>/i.exec(String(svg || '')) || [''])[0];
    const vb = /\bviewBox\s*=\s*["']\s*[-\d.]+[\s,]+[-\d.]+[\s,]+([\d.]+)[\s,]+([\d.]+)/i.exec(tag);
    if (vb) return { w: Number(vb[1]), h: Number(vb[2]) };
    const w = /(?:^|\s)width\s*=\s*["']([\d.]+)/i.exec(tag), h = /(?:^|\s)height\s*=\s*["']([\d.]+)/i.exec(tag);
    return w && h ? { w: Number(w[1]), h: Number(h[1]) } : { w: 0, h: 0 };
  }
  // ---- dmm: a function dial, a circuit power switch, two probes placed on drawn test points ----
  const DMM_FNS = [['vdc', 'V DC'], ['vac', 'V AC'], ['ohm', 'Ohms'], ['adc', 'A DC'], ['cont', 'Continuity'], ['diode', 'Diode']];
  function dmmInit(lab, ui) { if (!ui.fn) { ui.fn = 'vdc'; ui.power = obj(lab.scenario).power !== false; ui.a = null; ui.b = null; ui.next = 'a'; ui.kit = false; ui.readout = null; } }
  PANEL.dmm = (lab, ui) => {
    dmmInit(lab, ui); const sc = obj(lab.scenario); const pts = obj(sc.points); const r = ui.readout;
    const size = drawingSize(sc.svg);
    const pct = (v, total) => total > 0 ? Number((100 * num(v) / total).toFixed(2)) : 0;
    const hot = Object.keys(pts).map(p => { const xy = pts[p] || []; return `<button type="button" class="tp ${ui.a === p ? 'red' : ui.b === p ? 'black' : ''}" data-ins="tp" data-arg="${esc(p)}" style="left:${pct(xy[0], size.w)}%;top:${pct(xy[1], size.h)}%" title="Test point ${esc(p)}">${esc(p)}</button>`; }).join('');
    return `<div class="ins dmm">
      <div class="ins-drawing">${sc.svg || ''}${hot}</div>
      <div class="ins-panel">
        <div class="ins-readout ${r && r.invalid ? 'bad' : ''}" data-readout>${ui.kit ? 'Your own meter: type what it reads' : r ? esc(r.text) : '--'}</div>
        <div class="ins-dial">${DMM_FNS.map(([k, l]) => `<button type="button" class="chip" data-ins="fn" data-arg="${k}" aria-pressed="${ui.fn === k}">${l}</button>`).join('')}</div>
        <div class="row" style="gap:10px;flex-wrap:wrap"><button type="button" class="btn small ${ui.power ? 'primary' : ''}" data-ins="power">Circuit power: ${ui.power ? 'ON' : 'OFF'}</button><span class="muted">Red probe: <b>${esc(ui.a || '-')}</b> · Black probe: <b>${esc(ui.b || '-')}</b> · click a test point: first red, then black</span></div>
        <label class="row" style="gap:8px"><input type="checkbox" data-field="kit" ${ui.kit ? 'checked' : ''}> I'm using my own kit and typing my readings</label>
      </div></div>`;
  };
  HANDLE.dmm = (lab, ui, act, arg) => {
    dmmInit(lab, ui);
    if (act === 'fn') ui.fn = arg;
    else if (act === 'power') ui.power = !ui.power;
    else if (act === 'tp') { if (ui.next === 'a') { ui.a = arg; ui.next = 'b'; } else { ui.b = arg; ui.next = 'a'; } }
    ui.readout = ui.kit || !ui.a || !ui.b ? null : compute.dmm(lab.scenario, { fn: ui.fn, a: ui.a, b: ui.b, power: ui.power }, lab.id);
    return true;
  };

  // ---- safety analyzer: test, polarity, ground condition, Test, and the limits card ----
  function safetyInit(ui) { if (!ui.test) { ui.test = 'ground'; ui.polarity = 'normal'; ui.ground = 'closed'; ui.readout = null; } }
  PANEL.safety = (lab, ui) => {
    safetyInit(ui); const sc = obj(lab.scenario); const lim = obj(sc.limits); const r = ui.readout;
    const names = { ground: 'Ground wire resistance', chassis: 'Chassis (enclosure) leakage', lead: 'Patient lead leakage' };
    return `<div class="ins safety"><div class="ins-panel">
      <div class="ins-readout" data-readout>${r ? esc(r.text) : '--'}</div>
      <div class="setup-grid"><label class="field">Test ${sel(ui, 'test', [['ground', names.ground], ['chassis', names.chassis], ['lead', names.lead]])}</label><label class="field">Mains polarity ${sel(ui, 'polarity', [['normal', 'Normal'], ['reverse', 'Reverse']])}</label><label class="field">Ground conductor ${sel(ui, 'ground', [['closed', 'Intact'], ['open', 'Open (lifted)']])}</label></div>
      <div class="row"><button type="button" class="btn primary small" data-ins="test">Test</button></div>
      <table class="plain ins-limits"><thead><tr><th>Limit${sc.standard ? ` (${esc(sc.standard)})` : ''}</th><th>Value</th></tr></thead><tbody>${['ground', 'chassis', 'lead'].filter(k => lim[k] != null).map(k => `<tr><td>${names[k]}</td><td>${esc(lim[k])} ${k === 'ground' ? 'ohm' : 'uA'}</td></tr>`).join('')}</tbody></table>
    </div></div>`;
  };
  HANDLE.safety = (lab, ui, act) => { safetyInit(ui); if (act === 'test') ui.readout = compute.safety(lab.scenario, { test: ui.test, polarity: ui.polarity, ground: ui.ground }, lab.id); else if (act === 'field') ui.readout = null; return true; };

  // ---- patient simulator and monitor ----
  function monInit(ui) { if (ui.hr == null) { ui.hr = 80; ui.rhythm = 'nsr'; ui.spo2 = 98; ui.sys = 120; ui.dia = 80; ui.readout = null; } }
  PANEL.monitor = (lab, ui) => {
    monInit(ui); const r = ui.readout;
    const screen = r ? `${r.alarm ? `<div class="ins-alarm">${esc(r.alarm)}</div>` : ''}<div class="ins-numerics"><div><span class="eyebrow">HR</span><b>${r.hr == null ? '---' : r.hr}</b></div><div><span class="eyebrow">SpO2</span><b>${r.spo2}</b></div><div><span class="eyebrow">NIBP</span><b>${r.sys}/${r.dia}</b></div></div>${figure({ kind: 'strip', rate: r.hr || 0, seconds: 6, flat: r.alarm === 'ASYSTOLE', chaotic: r.alarm === 'VFIB' })}` : '<p class="muted">Apply the simulator settings to see the monitor.</p>';
    return `<div class="ins monitor"><div class="ins-two">
      <div class="ins-panel"><div class="eyebrow">Patient simulator</div><div class="setup-grid">${numField(ui, 'hr', 'ECG rate (bpm)', 30, 300)}<label class="field">Rhythm ${sel(ui, 'rhythm', [['nsr', 'Normal sinus'], ['asystole', 'Asystole'], ['vfib', 'Ventricular fibrillation']])}</label>${numField(ui, 'spo2', 'SpO2 (%)', 70, 100)}${numField(ui, 'sys', 'NIBP systolic (mmHg)', 60, 250)}${numField(ui, 'dia', 'NIBP diastolic (mmHg)', 30, 150)}</div><div class="row"><button type="button" class="btn primary small" data-ins="apply">Apply to simulator</button></div></div>
      <div class="ins-panel ins-screen"><div class="eyebrow">Monitor</div>${screen}</div>
    </div></div>`;
  };
  HANDLE.monitor = (lab, ui, act) => { monInit(ui); if (act === 'apply') { ui.readout = compute.monitor(lab.scenario, { hr: ui.hr, rhythm: ui.rhythm, spo2: ui.spo2, sys: ui.sys, dia: ui.dia }); return true; } return false; };

  // ---- infusion pump flow check: set a rate, run, fast-forward, read the cylinder ----
  function infInit(ui) { if (ui.rate == null) { ui.rate = 100; ui.vtbi = 100; ui.elapsed = 0; ui.running = false; ui.readout = null; } }
  PANEL.infusion = (lab, ui) => {
    infInit(ui); const sc = obj(lab.scenario); const r = compute.infusion(sc, { rate: ui.rate, minutes: ui.elapsed }); ui.readout = ui.elapsed > 0 ? r : null;
    return `<div class="ins infusion"><div class="ins-two">
      <div class="ins-panel"><div class="eyebrow">Pump</div><div class="setup-grid">${numField(ui, 'rate', 'Rate (mL/h)', 1, 999, ui.running)}${numField(ui, 'vtbi', 'VTBI (mL)', 1, 9999, ui.running)}</div>
        <div class="ins-readout" data-readout>${ui.running ? 'RUNNING' : 'STOPPED'} · ${ui.elapsed} min elapsed</div>
        <div class="row" style="gap:8px;flex-wrap:wrap">${ui.running ? `<button type="button" class="btn small" data-ins="ff" data-arg="1">+1 min</button><button type="button" class="btn small" data-ins="ff" data-arg="10">+10 min</button><button type="button" class="btn small ghost" data-ins="stop">Stop</button>` : `<button type="button" class="btn primary small" data-ins="start">Start (empties the cylinder)</button>`}</div></div>
      <div class="ins-panel"><div class="eyebrow">Collection</div>${figure({ kind: 'cylinder', ml: num(sc.cylinderMl) || 100, value: r.volume })}<p class="muted">Read the meniscus to the nearest ${num(sc.graduation) || 1} mL.</p></div>
    </div></div>`;
  };
  HANDLE.infusion = (lab, ui, act, arg) => {
    infInit(ui);
    if (act === 'start') { ui.running = true; ui.elapsed = 0; return true; }
    if (act === 'stop') { ui.running = false; return true; }
    if (act === 'ff') { if (!ui.running) return false; ui.elapsed += num(arg); const maxMin = ui.rate > 0 ? ui.vtbi / ui.rate * 60 : 0; if (ui.elapsed >= maxMin) { ui.elapsed = Math.round(maxMin); ui.running = false; } return true; }
    return false;
  };

  // ---- defibrillator into the analyzer ----
  function defInit(lab, ui) { if (ui.energy == null) { ui.energy = num((obj(lab.scenario).energies || [200])[0]); ui.charged = false; ui.readout = null; } }
  PANEL.defib = (lab, ui) => {
    defInit(lab, ui); const sc = obj(lab.scenario); const r = ui.readout;
    return `<div class="ins defib"><div class="ins-two">
      <div class="ins-panel"><div class="eyebrow">Defibrillator</div><div class="row" style="gap:6px;flex-wrap:wrap">${(sc.energies || []).map(e => `<button type="button" class="chip" data-ins="energy" data-arg="${num(e)}" aria-pressed="${ui.energy === num(e)}">${num(e)} J</button>`).join('')}</div>
        <div class="ins-readout" data-readout>${ui.charged ? `CHARGED ${ui.energy} J` : `Selected ${ui.energy} J`}</div>
        <div class="row" style="gap:8px"><button type="button" class="btn small" data-ins="charge" ${ui.charged ? 'disabled' : ''}>Charge</button><button type="button" class="btn primary small" data-ins="discharge" ${ui.charged ? '' : 'disabled'}>Discharge into the analyzer</button></div></div>
      <div class="ins-panel ins-screen"><div class="eyebrow">Defibrillator analyzer</div><div class="ins-readout" data-readout>${r ? `${r.delivered} J delivered` : '--'}</div><p class="muted">${r ? `Set ${r.energy} J, charge time ${r.chargeSeconds} s.` : 'Charge, then discharge into the analyzer.'}</p></div>
    </div></div>`;
  };
  HANDLE.defib = (lab, ui, act, arg) => {
    defInit(lab, ui);
    if (act === 'energy') { ui.energy = num(arg); ui.charged = false; ui.readout = null; return true; }
    if (act === 'charge') { ui.charged = true; return true; }
    if (act === 'discharge') { if (!ui.charged) return false; ui.readout = compute.defib(lab.scenario, { energy: ui.energy }); ui.charged = false; return true; }
    return false;
  };

  function render(el, lab, ui, api) {
    // Only a name this module knows draws a panel: PANEL is a plain object, so an instrument
    // named "constructor" or "toString" would otherwise resolve to an inherited function.
    const draw = lab && NAMES.indexOf(lab.instrument) >= 0 ? PANEL[lab.instrument] : null;
    if (!draw) { el.innerHTML = '<p class="muted">Unknown instrument.</p>'; return; }
    // One listener pair per element; the handlers read the latest lab/ui/api from the holder, so a
    // re-render on the same element replaces the panel instead of stacking a second handler.
    el.__fraIns = { lab, ui: ui || {}, api: api || {} };
    const paint = () => { const h = el.__fraIns; el.innerHTML = PANEL[h.lab.instrument](h.lab, h.ui); };
    if (!el.__fraInsWired) {
      el.__fraInsWired = true;
      el.addEventListener('click', e => {
        const h = el.__fraIns; if (!h) return;
        const b = e.target.closest && e.target.closest('[data-ins]'); if (!b || !el.contains(b)) return;
        const fn = HANDLE[h.lab.instrument]; if (fn && fn(h.lab, h.ui, b.dataset.ins, b.dataset.arg, h.api)) paint();
      });
      el.addEventListener('change', e => {
        const h = el.__fraIns; if (!h) return;

        <div class="row" style="margin-top:10px"><div class="meter ${rem.length ? '' : 'good'}"><i style="width:${pct(done, S.plan.lessons.length)}%"></i></div><span class="tnum muted">${done}/${S.plan.lessons.length}</span></div></div>
      ${S.plan.source === 'starter' && full ? `<div class="card soft stack" style="gap:8px"><div class="eyebrow">Your path</div><p class="ink2" style="font-size:.95rem">You chose the whole course: all ${lessons.length} lessons in order. Lessons tied to a question you missed or guessed on the starter test still open with your answer and the correct one.</p><div class="row"><button class="btn small" data-act="path" data-arg="tailored:${S.plan.examIdx}">Switch to the tailored tutorial${tailoredN ? ` (${plural(tailoredN, 'lesson')})` : ''}</button></div></div>`
      : S.plan.source === 'starter' ? `<div class="card soft stack" style="gap:8px"><div class="eyebrow">How your starter test shaped this</div><div class="row" style="gap:8px">${TESTED_IDS.map(d => `<span class="pill ${S.plan.depth[d] === 'rebuild' ? 'bad' : S.plan.depth[d] === 'core' ? 'warn' : S.plan.depth[d] === 'light' ? '' : 'good'}">${DOMAINS[d].short}: ${S.plan.depth[d] === 'rebuild' ? 'all lessons' : S.plan.depth[d] === 'core' ? 'core lessons' : S.plan.depth[d] === 'light' ? 'light review' : 'solid'}</span>`).join('')}</div><p class="ink2" style="font-size:.95rem">Lessons run in course order so each one builds on the last. Lessons tied to a question you missed or guessed open with your answer and the correct one.</p><div class="row"><button class="btn small" data-act="path" data-arg="full:${S.plan.examIdx}">Switch to the whole course (${plural(lessons.length, 'lesson')})</button></div></div>` : `<div class="card soft stack" style="gap:8px"><div class="eyebrow">Your path: ${preset === 'suggested' ? 'suggested' : preset === 'custom' ? 'your own mix' : PRESET_LABEL[preset].toLowerCase()}</div><p class="ink2" style="font-size:.95rem">Worst first. Each topic is a drill, the lesson, or the extended lesson (the lesson with its deeper explanation). A lesson opens with the exact question you missed. You can take the next test at any time.</p><div class="row"><button class="btn small" data-act="go" data-arg="results:${S.plan.examIdx}">Change your path</button></div></div>`}
      ${rem.length ? `<div class="row"><button class="btn primary lg" data-act="${openAct}" data-arg="${rem[0].id}">${done ? 'Continue' : 'Start'}: ${esc(L[rem[0].id].title)}${isTestPlan && modeOf(rem[0]) !== 'lesson' ? ` (${MODE_SHORT[modeOf(rem[0])].toLowerCase()})` : ''}</button></div>` : `<div class="ready-banner"><strong>${isTestPlan ? `All ${plural(S.plan.lessons.length, 'topic')} done.` : `All ${S.plan.lessons.length} lessons passed.`}</strong> ${stage() === 'fulltest' ? `Next: the ${EXAM_N}-question test.` : stage() === 'ready' ? 'You are cleared to book the exam.' : stage() === 'official' ? 'Next: the official-format test.' : 'Next: a practice test.'} <button class="btn primary small" data-act="${stage() === 'official' ? 'start-standard' : 'start-exam'}" data-arg="${stage() === 'fulltest' ? 'full' : 'practice'}" style="margin-left:8px">Start it</button></div>`}
      ${groups.map(g => `<div class="card stack" style="gap:8px"><div class="row spread"><h3><span class="muted" style="font-family:var(--font-mono);font-size:.85rem;margin-right:8px">${String(g.u.n).padStart(2, '0')}</span>${esc(g.u.title)}</h3></div>
        ${g.list.map(e => `<button class="option" data-act="${openAct}" data-arg="${e.id}" style="align-items:center"><span class="led lg ${planDone(e.id) ? 'green' : ledClass(e.id)}"></span><span style="flex:1"><strong>${esc(L[e.id].title)}</strong><br><span class="muted" style="font-size:.88rem">${esc(reasonLabel(e.reasons[0]))}${e.reasons.length > 1 ? ` · +${e.reasons.length - 1} more` : ''}</span></span><span class="row" style="gap:6px">${planDone(e.id) ? '<span class="pill good">DONE</span>' : `${isTestPlan ? `<span class="pill accent">${MODE_SHORT[modeOf(e)]}</span>` : ''}${reasonPill(e)}`}</span></button>`).join('')}</div>`).join('')}
      <div class="row"><button class="btn ghost" data-act="go" data-arg="course">Browse all ${lessons.length} lessons</button></div>
    </div>`;
  }

  function viewCourse() {
    const uid = S.view.arg;
    const u = uid ? units.find(x => x.id === uid) : null;
    if (u) {
      return `<div class="content stack" style="gap:18px">
        <div><div class="eyebrow">Unit ${u.n}</div><h1>${esc(u.title)}</h1><p class="ink2" style="margin-top:6px">${esc(u.blurb)}</p></div>
        <div class="stack" style="gap:8px">${u.lessons.map((l, i) => `<button class="option" data-act="lesson" data-arg="${l.id}" style="align-items:center"><span class="led lg ${ledClass(l.id)}"></span><span style="flex:1"><strong>${i + 1}. ${esc(l.title)}</strong><br><span class="muted" style="font-size:.9rem">Objective ${l.obj} · ${l.minutes} min read${l.lab ? ' · lab' : ''}${lstat(l.id).best ? ` · best checkpoint ${lstat(l.id).best}/${CHECKPOINT_N}` : ''}</span></span>${lessonLocked(l.id) ? '<span class="pill">Full course</span>' : planEntry(l.id) && !planDone(l.id) ? '<span class="pill accent">in tutorial</span>' : ''}</button>`).join('')}</div>
