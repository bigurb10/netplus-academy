{id:"u2l2-4",t:"u2l2",q:"Endoscopy video and photos are captured outside radiology workflows. What problem is MOST common?",a:["The image matrix is too small","The order or patient link is missing","The video cannot be stored in any format","The radiologists dislike the viewer"],c:1,e:"Visible light capture often has no order, so the patient link must come from a worklist, a barcode, or an encounter list."},
{id:"u2l2-5",t:"u2l2",q:"Why does digital pathology need separate storage planning?",a:["They are compressed to a fixed size by the scanner","Pathology images use a color depth that PACS cannot store","Whole-slide images are very large objects","They are stored by the laboratory system, so they need no planning"],c:2,e:"Whole-slide images are among the largest objects in the enterprise, so storage and viewing must be planned for them separately."},

// u2l3
{id:"u2l3-1",t:"u2l3",q:"A new scanner's C-ECHO to PACS is rejected. The scanner title was typed in capitals but PACS lists it in lowercase. What is the BEST fix?",a:["Restart the scanner and repeat the echo","Open more firewall ports between the two devices on the network","Change the scanner's IP address","Correct the AE title on PACS to match the scanner exactly"],c:3,e:"AE titles are case-sensitive. A rejected association means the connection reached PACS, so the title on its allowed list must match exactly."},
{id:"u2l3-2",t:"u2l3",q:"A modality shows 'connection refused' when it sends to PACS. What is the MOST likely cause?",a:["The port is wrong or the receiving service is stopped","The AE title is in the wrong case","A firewall is silently dropping the packets","The patient ID is missing from the study"],c:0,e:"Refused means something answered and said no: a wrong port or a service that is not listening. A timeout with no answer points to a firewall."},
{id:"u2l3-3",t:"u2l3",q:"A technologist asks why the scanner should not delete images as soon as they are sent. What is the correct answer?",a:["Images are deleted automatically after 24 hours, so the scanner never needs a commitment","Wait for storage commitment, which confirms PACS took responsibility for the objects","Deleting is a decision for the radiologist","Deleting is allowed once the C-ECHO succeeds"],c:1,e:"Only after storage commitment may the modality purge its copy. A successful echo or a sent image does not prove PACS has stored them."},
{id:"u2l3-4",t:"u2l3",q:"What does a performed procedure step message with status completed tell RIS and PACS?",a:["The patient has been billed for the completed exam by the RIS","The radiologist has signed the report of record","The exam has ended and which images were made","The images have been compressed"],c:2,e:"MPPS reports in progress when the exam starts and completed with the images made, so status can update and a missing image can be noticed."},
{id:"u2l3-5",t:"u2l3",q:"A C-ECHO succeeds from the scanner to PACS, but test images are not stored. What does the echo NOT prove?",a:["That the port is open","That the AE titles match","That the address is correct","That the SOP class and transfer syntax will be accepted for storing images"],c:3,e:"An echo proves titles, address, and port match and an association opens. It does not prove that the storage SOP class or a transfer syntax will be accepted."},

// u2l4
{id:"u2l4-1",t:"u2l4",q:"A scanner offers CT image storage in JPEG 2000 only, while PACS accepts only little endian syntaxes. What happens?",a:["The context is rejected and the images are not sent","PACS converts the images silently","The scanner chooses the PACS syntax","The association is released with a success status for every image"],c:0,e:"If no proposed syntax is acceptable the presentation context is rejected and the objects are not sent. One side must enable a common syntax."},
{id:"u2l4-2",t:"u2l4",q:"Which transfer syntax must every DICOM device support?",a:["JPEG baseline lossy syntax","Implicit VR little endian","JPEG 2000 with lossy settings","RLE lossless syntax for ultrasound"],c:1,e:"Implicit VR little endian is the default every device must support, which is why it is the fallback when nothing else is agreed."},
{id:"u2l4-3",t:"u2l4",q:"An imported study behaves oddly in the viewer. Which tool BEST checks whether the object breaks the standard?",a:["A disk usage report","A network ping","A DICOM validator","A display photometer"],c:2,e:"A validator checks required elements, value types, and UIDs against the standard and points to the malformed attribute."},
{id:"u2l4-4",t:"u2l4",q:"What does a secondary capture object store?",a:["A recording of the association","The original raw detector data","A copy of the report text","A screenshot or derived picture wrapped as a DICOM image"],c:3,e:"A secondary capture wraps a picture, such as a screenshot, as a DICOM image. It has no original pixel data to remeasure."},
{id:"u2l4-5",t:"u2l4",q:"Association rejected points to which problem, compared with association accepted but images refused?",a:["An unknown AE title, versus a SOP class or transfer syntax mismatch","A firewall, versus a disk failure","A bad cable, versus an expired license","A wrong accession number, versus a wrong patient name on the order form"],c:0,e:"Rejection at association time means the called or calling title is not allowed. If the association opens but data is refused, the negotiation of the SOP class or syntax failed."},

// u2l5
{id:"u2l5-1",t:"u2l5",q:"A reader says the second diagnostic display looks washed out, but the images are fine. What is the BEST first action?",a:["Adjust the brightness by eye until it looks right to the reader and leave it there","Measure the display with a test pattern and a meter against the calibration limits","Replace the display immediately","Move the display to another room"],c:1,e:"A display can drift with no visible fault. Test pattern plus meter is the evidence, and the result is recorded."},
{id:"u2l5-2",t:"u2l5",q:"A diagnostic display reads a maximum of 380 and a minimum of 1.2 cd/m2. What is its contrast ratio and does it meet the diagnostic limit of above 250?",a:["About 456, which does not meet it","About 3.2, which does not meet it","About 317, which meets it","About 78, which meets it"],c:2,e:"Contrast ratio is maximum divided by minimum: 380 divided by 1.2 is about 317, above the 250 required of a diagnostic display."},
{id:"u2l5-3",t:"u2l5",q:"Two displays at one workstation have centers that differ by 12 percent. What is the result?",a:["They fail only if one is a clinical display","They pass because the limit is 30 percent","They pass because both are diagnostic","They exceed the 10 percent allowance, so one should be recalibrated"],c:3,e:"The centers of matched displays should not differ by more than 10 percent. The 30 percent figure is the limit for uniformity within a single display."},
{id:"u2l5-4",t:"u2l5",q:"Who must evaluate a mammography display before clinical use?",a:["A qualified medical physicist","The PACS vendor's sales engineer","The radiologist's assistant on duty","Any trained IT technician on site"],c:0,e:"Mammography displays require a qualified medical physicist to evaluate them before clinical use, with records kept by the PACS team."},
{id:"u2l5-5",t:"u2l5",q:"What is the difference between an acceptance test and a routine test?",a:["Acceptance is done monthly, while routine is done once at installation","Acceptance is the full test once, routine is simpler checks on a schedule","Acceptance is only for mammography displays, and routine is for every other display","Routine tests replace the acceptance test once a display has passed it"],c:1,e:"The acceptance test is a complete one-time set of patterns and measurements. Routine checks follow on a schedule with simpler tests and a visual pattern."},

// u2l6
{id:"u2l6-1",t:"u2l6",q:"A keyboard must be replaced inside the MRI control area during a busy day. What is the correct approach?",a:["Send the keyboard in with the patient","Enter quickly with the tool bag because the request is urgent and the scanner is idle","Call MRI staff, complete screening, leave steel tools outside, and be escorted in","Wait until the end of the day and ignore the screening step"],c:2,e:"The magnet is always on. Screening and an escort come first, and only equipment labeled for the area may enter."},
{id:"u2l6-2",t:"u2l6",q:"Which action reduces exposure when you must work near an x-ray room?",a:["Stay in the room for only the first exposure and then work normally","Stay close to the source and finish the task as quickly as possible","Wear a lead apron and work at whatever distance is most convenient","Limit time, maximize distance, and use shielding"],c:3,e:"Time, distance, and shielding control exposure. Ask the technologist before entering a room where an exam may be under way."},
{id:"u2l6-3",t:"u2l6",q:"What is the correct behavior near the sterile field in an operating room?",a:["Stay out of it unless gowned and invited","Reach in briefly if you keep your hands away from the sterile items","Place a clean laptop on its edge, away from the instruments","Touch only the items that look clean to you"],c:0,e:"The sterile field belongs to the surgical team. Do not enter, lean over, or touch what is on it."},
{id:"u2l6-4",t:"u2l6",q:"A powered cart has a damaged power cord. What should you do?",a:["Wrap the cord with tape and use the cart until a repair is scheduled","Report it and keep the device out of use","Open the housing to look for the fault before reporting it","Plug the cart into a different outlet and use it"],c:1,e:"Do not open powered equipment or use damaged cords. Report the fault so qualified staff can repair it."},
{id:"u2l6-5",t:"u2l6",q:"You are unsure whether a room is safe to enter. What is the BEST action?",a:["Enter only if you are wearing your identification badge","Enter if the door is open and watch what the other staff do","Ask the department safety officer or lead technologist before entering","Wait outside until the patient leaves and then go in"],c:2,e:"When unsure, ask first. The habit of asking before entering an unfamiliar room matters more than knowing every hazard."},

// u3l1
{id:"u3l1-1",t:"u3l1",q:"A reader on the end workstation says dark images look flat in the afternoon, but the display's calibration report is in tolerance. What is the MOST likely cause?",a:["An outdated hanging protocol that applies the wrong window and level","A failed backlight in the display that the photometer has not yet detected","A wrong transfer syntax on the images that makes them look flat","Afternoon sunlight raising the ambient light and reflecting in the screen"],c:3,e:"Ambient light above the 20 to 40 lux range lowers perceived contrast, and reflections add glare. Fix the room with blinds and dimmable lighting rather than recalibrating the display."},
{id:"u3l1-2",t:"u3l1",q:"What ambient light range is recommended for image interpretation?",a:["20 to 40 lux","100 to 150 lux","0 lux in total darkness","300 to 500 lux"],c:0,e:"Dim, even, controllable light at 20 to 40 lux avoids reflections yet lets the eye adapt to the surroundings and the displays."},
{id:"u3l1-3",t:"u3l1",q:"Three readers report neck strain after a new room opens. Which design control addresses repetitive strain BEST?",a:["One fixed desk height chosen as the best compromise for every reader in the room","Adjustable chairs and desks with matched monitors at a comfortable height","Larger fonts on the worklist so readers lean in less often","Fewer breaks so the worklist keeps moving through the long afternoon"],c:1,e:"Adjustability is the control for strain from fixed postures: furniture that changes height and screens and devices placed where the body rests naturally."},
{id:"u3l1-4",t:"u3l1",q:"Where should speech recognition users be placed in a shared reading room?",a:["Next to the consult space so that colleagues can ask questions","Seated side by side at a single shared desk for convenience","Separated from each other with sound absorption","Facing a bright window so the room stays well lit"],c:2,e:"Dictation noise disturbs neighbors. Absorb sound with panels and carpet, and separate speech users from each other."},
{id:"u3l1-5",t:"u3l1",q:"A room plan puts twelve workstations in a space with no extra cooling. What problem is MOST likely?",a:["Loss of display calibration data in the workstation memory","Increased network latency between the workstations and the archive","Reduced image matrix on every display in the room","Heat from the computers making the room uncomfortable"],c:3,e:"Many computers warm a room, so cooling and airflow must be planned for every workstation. Involve facilities early."},

// u3l2
{id:"u3l2-1",t:"u3l2",q:"Radiologists log into the reporting tool, the EMR, and PACS separately for each study. Which change BEST reduces the effort?",a:["Context synchronization with single sign-on","A larger monitor on every workstation to show all three applications","A second reporting tool installed beside the first one","More frequent password changes so each login feels more deliberate"],c:0,e:"Context synchronization moves every application to the same patient when a study opens, and single sign-on removes repeated logins. The saving repeats for every study."},
{id:"u3l2-2",t:"u3l2",q:"A radiologist says the system is slow. What should informatics do FIRST?",a:["Order faster workstations for the whole reading room","Measure which step is slow, how long it takes, and how often","Replace the network switch nearest to the reading room this quarter","Reduce the study volume sent to that reader"],c:1,e:"A complaint needs a measurement. A log shows whether the delay is study opening, the reporting tool, or the login, so the fix matches the cause."},
{id:"u3l2-3",t:"u3l2",q:"What is the difference in contrast ratio requirements between diagnostic and clinical review displays?",a:["Both must be above 500 so that every display matches","Above 100 for diagnostic and above 250 for clinical","Above 250 for diagnostic and above 100 for clinical","There is no requirement for either type of display"],c:2,e:"Diagnostic displays need a contrast ratio above 250, and clinical review displays above 100, reflecting their different uses."},
{id:"u3l2-4",t:"u3l2",q:"What does a programmable keypad improve in the reading workflow?",a:["It removes the need for a worklist at the workstation","It raises the display's maximum luminance through the driver","It converts grayscale images to color during review","It maps frequent actions such as window and level to single buttons"],c:3,e:"A keypad saves a click on actions repeated hundreds of times a day, which adds up to measurable time."},
{id:"u3l2-5",t:"u3l2",q:"Which BEST describes the human-computer interface in imaging?",a:["The integration of EMR, RIS, PACS, and reporting with input devices and displays","The video cable between each display and its workstation","The password policy and session timeout rules that govern the reading workstations","The brand and model of the diagnostic monitor in use"],c:0,e:"The interface covers how the systems work together on one desktop, along with the input devices and displays."},

// u3l3
{id:"u3l3-1",t:"u3l3",q:"Readers rearrange knee studies by hand every Monday. A header check shows three scanners label the same series with different names. What is the BEST fix?",a:["Ask the readers to relabel each series themselves before they read","Standardize the series names or add them all to the rule","Replace the hanging protocol engine with one from another vendor","Reduce the number of scanners that send knee studies to PACS"],c:1,e:"Protocols match on values in the study. Inconsistent series descriptions make the rule misfire, so standardize them or include all variants, and test with one study from each scanner."},
{id:"u3l3-2",t:"u3l3",q:"Which condition defines a read-ready study?",a:["The study is older than one hour and the images are all stored","The technologist has left the department and closed the exam","All images arrived, patient and order are matched, and priors are prefetched","The report has already been dictated by the first reader"],c:2,e:"Read-ready means complete, correct, and with its priors ready, so the reader can open it and begin."},
{id:"u3l3-3",t:"u3l3",q:"A reader marks a lesion with an arrow. How should the mark be stored?",a:["Inside the file name of the study so it can be searched","By changing the original pixels so the arrow becomes a permanent part of the image","As a paper printout placed in the patient's folder","As a presentation state or key image note that points at the original image"],c:3,e:"Annotations are stored as their own objects, so the original pixel data never changes."},
{id:"u3l3-4",t:"u3l3",q:"A relevant-prior rule fetches every study for the patient, any modality, any date, with no limit. What problem is MOST likely?",a:["Readers wait for many irrelevant studies","No priors are ever found for any patient","The studies are lossy compressed on retrieval","The wrong patient is chosen for the comparison"],c:0,e:"Too wide a rule brings irrelevant studies and delays opening. Too narrow a rule finds none. Review the rule against complaints."},
{id:"u3l3-5",t:"u3l3",q:"What does window and level change?",a:["The number of slices stored in the study","The contrast and brightness of the displayed image","The patient's demographics in the header","The transfer syntax used to store the file on the archive"],c:1,e:"Window and level adjust how pixel values map to displayed contrast and brightness. They do not change stored pixel data."},

// u3l4
{id:"u3l4-1",t:"u3l4",q:"A 262 MB CT study is stored with lossless compression at 2.5 to 1. What is the compressed size?",a:["26.2 MB","655 MB","104.8 MB","131 MB"],c:2,e:"Compressed size equals original divided by the ratio: 262 divided by 2.5 is 104.8 MB, a saving of 157.2 MB."},
{id:"u3l4-2",t:"u3l4",q:"IT proposes lossy compression for the primary archive to save space. Who must decide?",a:["The PACS vendor, because it knows the product best","The finance department, because the savings appear in its budget","IT alone, since IT owns the storage and its budget","Radiology leadership under policy, with the ratio recorded"],c:3,e:"The radiology department and its policies decide what may be lossy compressed for interpretation, and the ratio must be stated on each image of the study."},
{id:"u3l4-3",t:"u3l4",q:"Which use is a good fit for lossy compression?",a:["A mobile or web review copy","The legal record of a mammogram","A primary archive copy of every study","A source for measurement in research"],c:0,e:"Lossy compression suits review copies and previews, where small files load fast. Mammography legal records must never be lossy."},
{id:"u3l4-4",t:"u3l4",q:"Which transfer syntax is lossy?",a:["JPEG lossless","JPEG baseline","RLE lossless syntax","JPEG 2000 lossless only"],c:1,e:"JPEG baseline discards data. JPEG lossless, RLE lossless, and the lossless-only JPEG 2000 syntax recover every pixel, and JPEG 2000 may be either."},
{id:"u3l4-5",t:"u3l4",q:"A department stores 40 CT studies a day at about 262 MB each. Which daily total results after lossless 2.5 to 1 compression?",a:["1,048 MB","10,480 MB","4,192 MB","26,200 MB"],c:2,e:"40 times 262 is 10,480 MB uncompressed. Divided by 2.5 gives 4,192 MB a day."},

// u3l5
{id:"u3l5-1",t:"u3l5",q:"A wrong-patient chest study is found in the unverified queue. What is the FIRST step?",a:["Merge it into the other patient's record to remove the duplicate","Delete the study at once so that nobody can open it","Wait for the radiologist to notice and report the problem","Flag it and stop it from being distributed or read"],c:3,e:"First prevent harm: flag the study and stop its distribution. Then check whether it was viewed or reported, confirm the true patient, move it, and write the audit entry."},
{id:"u3l5-2",t:"u3l5",q:"One study sits under the wrong patient while the correct patient has no images. Which correction applies?",a:["Move the study to the correct patient","Split the wrong patient's record in two","Merge the two patients into one record","Delete the study and re-acquire the exam"],c:0,e:"A move relocates a study to the correct patient. A merge combines two records for one patient, and a split separates one record that holds two patients."},
{id:"u3l5-3",t:"u3l5",q:"The technologist acquired 3 images but PACS shows 2, and no storage commitment arrived. What is the correct step?",a:["Delete the study and re-acquire the whole exam","Resend the missing image from the modality","Accept the study as complete and close the exam","Delete the modality's copy to free the local disk"],c:1,e:"The modality still holds the third image because commitment has not arrived. Resend it, since re-acquiring exposes the patient to more radiation."},
{id:"u3l5-4",t:"u3l5",q:"Who may perform merges, splits, and moves, and how are they recorded?",a:["Radiologists only, with the change agreed verbally at the time and noted later in an e-mail","Any technologist on shift, with no record kept of the change","Trained and authorized staff, with each change in the audit trail showing who and why","Vendors, through remote sessions that are not logged"],c:2,e:"These actions change the record, so only trained authorized staff may do them, and each is logged with who and why."},
{id:"u3l5-5",t:"u3l5",q:"What is the purpose of order reconciliation?",a:["Selecting the hanging protocol for each exam","Compressing studies to save archive space","Calibrating displays against the grayscale function","Matching each study to its order using the accession number"],c:3,e:"Reconciliation links each study to its order by accession number, which catches studies with mistyped or missing demographics."},

// u3l6
{id:"u3l6-1",t:"u3l6",q:"A report is changed after it is signed final. How should it appear to readers?",a:["As an addended or corrected report, flagged, with the original text kept","As a silent edit of the final text with no new version","As a new preliminary report that quietly replaces the signed one in the chart","It should be deleted and created again from nothing"],c:0,e:"A change after final is an addendum or a correction, never a silent edit, and readers must see its status."},
{id:"u3l6-2",t:"u3l6",q:"An emergency physician read a preliminary report, but the EMR still shows it after the final was signed. What is the MOST likely cause?",a:["The final report was never dictated by the radiologist","The EMR interface stores only the first result for an order","The images were lossy compressed before the report was signed","The study was not committed to the archive in time"],c:1,e:"The reporting system sent the final message, but the EMR did not replace the earlier version. The interface must add or replace a version with its status shown."},
{id:"u3l6-3",t:"u3l6",q:"Which report style is BEST for counting findings and feeding decision support?",a:["Narrative reporting by free text","Handwritten notes","Structured reporting","Verbal reporting by recorded dictation"],c:2,e:"Structured reports use standard fields and terms, so they are easier to search and count."},
{id:"u3l6-4",t:"u3l6",q:"Which is a typical speech recognition error that can change a report's meaning?",a:["A longer file name for the saved report","A slower opening of the study after signing","A change in the font of the report","A missing negative or a wrong side"],c:3,e:"Speech recognition can drop a negative, swap left and right, or use a sound-alike word, so the author must read the draft before signing."},
{id:"u3l6-5",t:"u3l6",q:"Which record shows who knew what and when about a report?",a:["The audit trail of status changes and views","The hanging protocol rules for the exam type","The modality worklist entry for the exam","The storage commitment record from the modality"],c:0,e:"Every view and status change should be logged with user and time, so the sequence can be reconstructed."},

// u3l7
{id:"u3l7-1",t:"u3l7",q:"After header cleaning, a CT localizer image shows the patient's name in the corner. Why was it missed?",a:["The UIDs were not replaced during the cleaning job","The text is burned into the pixel data, which header cleaning does not touch","The study was too large for the cleaning tool to read","The viewer cached the old header from the first view"],c:1,e:"Burned-in annotations live in the pixels and need pixel-level masking or removal."},
{id:"u3l7-2",t:"u3l7",q:"How should UIDs be handled during de-identification?",a:["Keep the original UIDs so the images can always be traced back to the source","Delete them from every image in the study","Replace them consistently so the study keeps its own structure","Set them all to the same value for simplicity"],c:2,e:"Replace each UID consistently so every image in a series shares the same new series UID. Identical UIDs for different objects would break uniqueness."},
{id:"u3l7-3",t:"u3l7",q:"What is pseudonymization?",a:["Compressing the headers so the identifiers cannot be read","Deleting all identifiers permanently so that nobody, even the research team, can restore them","Encrypting the whole archive with a single shared password","Replacing identifiers with a code and keeping a separate key to restore the link"],c:3,e:"A code stands in for identity and a separately held key lets authorized people restore the link, for example for a follow-up scan."},
{id:"u3l7-4",t:"u3l7",q:"Which risk is specific to head CT and MRI volumes in de-identified research data?",a:["The volume can be rendered into a recognizable face","The files become lossy when they are exported","The studies lose their UIDs during the export","The matrix doubles in size after cleaning"],c:0,e:"Three-dimensional reconstruction can show a recognizable face, so facial features may need to be removed or limited."},
{id:"u3l7-5",t:"u3l7",q:"What should happen before de-identified studies leave the organization?",a:["The studies are sent first and checked afterward by the recipient","A header dump, a private tag check, and a sample image review","Only the file names are checked for patient names and dates","Nothing more, because the header cleaning job ran without errors"],c:1,e:"Treat the output as untrusted until checked. A header dump, private tag check, and a look at sample images catch what the job missed."},

// u3l8
{id:"u3l8-1",t:"u3l8",q:"Stage times show read-ready to preliminary as the longest wait. What does the analysis suggest to do FIRST?",a:["Reduce the archive size to speed up retrieval","Replace the modalities with faster scanners","Focus on that stage, for example by balancing the worklist","Shorten the registration process at the front desk before the exam starts"],c:2,e:"The longest stage is the bottleneck, so effort there pays most. Worklist balancing is a common fix."},
{id:"u3l8-2",t:"u3l8",q:"Chest readers sit idle while musculoskeletal studies pile up. Which solution fits BEST?",a:["Lengthening the shifts of the musculoskeletal readers","Adding more monitors to each reading workstation","Stopping subspecialty reads and assigning all studies to readers at random","Worklist balancing with priority rules that keep stat studies first"],c:3,e:"Balancing routes work by subspecialty, priority, and workload, with stat studies still first."},
{id:"u3l8-3",t:"u3l8",q:"A home reader says studies open slowly. What should be checked FIRST?",a:["Retrieval time and bandwidth for a large study","The reader's screen brightness and calibration date","The worklist sort order and its filters for stat studies","The report template and its macros"],c:0,e:"Slow opening is a network or prefetch problem. Measure retrieval time and bandwidth before changing the worklist."},
{id:"u3l8-4",t:"u3l8",q:"Which is required for a remote reader's display?",a:["No special requirements because the reader is off site","It must meet the same quality rules as the reading room","Only a color display of any size and brand","A photograph of the last calibration report"],c:1,e:"Remote reading should meet the same display quality requirements as the reading room, with calibration and acceptance testing."},
{id:"u3l8-5",t:"u3l8",q:"Which is the BEST security practice for remote reading?",a:["A shared remote account for all readers, with the password stored in the reading tool","Storing studies on home computers so that they open faster","Encrypted access with strong sign-in and logging, with no images saved locally","Turning off the audit log to protect reader privacy"],c:2,e:"Remote access should use an encrypted connection, strong authentication, logging, and no local copies."},

// u3l9
{id:"u3l9-1",t:"u3l9",q:"A disc arrives carrying 'Robert Lee' with a different birth date than your record for 'Bob Lee.' What should you do?",a:["Refuse every outside disc on principle","Import it under the closest matching name and fix it later","Import it under both names to be safe","Verify identity, correct the demographics, and then import"],c:3,e:"Never import on a guess. An unreconciled study can be filed in the wrong chart and read as a prior."},
{id:"u3l9-2",t:"u3l9",q:"What is the standard layout for studies on portable media?",a:["PDI with a DICOMDIR index and often a viewer","A zip archive of image files named by study date","A single very large image of the study","A spreadsheet listing each study and its owner"],c:0,e:"Portable Data for Imaging defines the layout with a DICOMDIR index and commonly a viewer."},
{id:"u3l9-3",t:"u3l9",q:"Which standard lets enterprises publish and fetch imaging documents with a registry, repository, and manifest?",a:["PDI","XDS-I.b","HL7 ADT","SIU"],c:1,e:"XDS-I.b applies cross-enterprise document sharing to imaging, with a manifest that points at the images."},
{id:"u3l9-4",t:"u3l9",q:"Which is a typical risk of an imported study?",a:["Too much calibration on the sending side","Excess storage commitment from the sender","Wrong demographics, duplicate UIDs, unknown syntaxes, and corrupt files","Duplicate studies that the sending site forgot to delete from its own archive"],c:2,e:"Imported studies come from outside systems, so identity, UID, syntax, and file integrity all need checking."},
{id:"u3l9-5",t:"u3l9",q:"Who sets the rules for who may export images and how it is logged?",a:["The vendor, in the support contract for the archive system","Each technologist, according to the situation","The PACS administrator alone, as part of the daily work","An exchange policy owned by compliance and radiology"],c:3,e:"Policy decides who may export, what, and how it is tracked. It is owned by compliance and radiology, not by IT alone."},

// u3l10
{id:"u3l10-1",t:"u3l10",q:"The archive is growing. Who decides what may be deleted?",a:["A named policy owner working with compliance and legal","The PACS administrator, who runs the archive every single day","The storage vendor, based on the size of the contract","Any radiologist who finds a study that is no longer needed"],c:0,e:"IT carries out deletion but does not decide it. A policy owner sets the schedule within state and legal rules."},
{id:"u3l10-2",t:"u3l10",q:"What is the minimum retention for a mammogram when the patient has no later mammogram at the facility?",a:["1 year, after which the facility may delete it","10 years, and longer if a state requires it","5 years in every case, whatever happens later","Until the next annual screening is performed"],c:1,e:"Mammography is kept at least 5 years, or 10 years when there is no later mammogram at the facility, and longer where a state requires it."},
{id:"u3l10-3",t:"u3l10",q:"What does a legal hold do?",a:["Moves the study to portable media for safekeeping","Compresses the study to save archive space","Suspends deletion of any record involved in a case","Changes the study's UID so it cannot be altered"],c:2,e:"A legal hold overrides the retention schedule for records involved in a case until it is lifted."},
{id:"u3l10-4",t:"u3l10",q:"Which record must be kept for legal retention?",a:["A lossy compressed review copy made for referring clinicians","A screenshot","A digitized film copy made from the original film","The original from which the diagnosis was made"],c:3,e:"The original is the record. A digitized film copy is not the original for legal retention."},
{id:"u3l10-5",t:"u3l10",q:"After a purge run, the signed list has 90,000 studies but 92,000 were deleted. What should you do?",a:["Stop and investigate before any further run","Accept the result because more space was freed","Run the purge again to confirm the same count","Delete the log so the difference is not found"],c:0,e:"The deleted count must match the signed list. A difference means something outside the approval was deleted, so stop and investigate."},

// u3l11
{id:"u3l11-1",t:"u3l11",q:"A wound care nurse types patient names in a photo app and three photos land under a misspelled name. What is the BEST fix?",a:["Ask the nurses to type each name more carefully and re-check it later","Select the patient from the day's encounters or scan the wristband","Stop taking photos until a new policy is written for all of the clinics","Print the photos and file them in the paper chart"],c:1,e:"Encounter-based capture needs a fast way to select the patient and encounter with no typing."},
{id:"u3l11-2",t:"u3l11",q:"Which BEST describes orders-based imaging?",a:["Imaging that is never stored in any archive","Imaging captured at a bedside visit with no order","Imaging that follows a scheduled order and the modality worklist","Imaging performed only for research studies"],c:2,e:"Orders-based imaging follows an order and a worklist, as in radiology. Encounter-based imaging is tied to a visit."},
{id:"u3l11-3",t:"u3l11",q:"What does a vendor neutral archive provide in enterprise imaging?",a:["A change to the DICOM standard that every vendor must follow at the next release","A faster scanner for each department that uses it","A smaller monitor for each clinic workstation","Images from many systems in standard form with one patient identity"],c:3,e:"The VNA stores images from all departments in standard form so replacing one department's system does not strand its images."},
{id:"u3l11-4",t:"u3l11",q:"Which is the MOST common problem in visible light imaging?",a:["Patient identity and metadata","Storage speed of the archive servers","Screen resolution of the capture device","Color accuracy of the review display"],c:0,e:"Photos with no order and typed names produce identity problems. Without metadata an image cannot be found."},
{id:"u3l11-5",t:"u3l11",q:"Who decides required metadata, who may capture, and who may view in enterprise imaging?",a:["The vendor of the capture application","A governance group with department leads, compliance, and informatics","Each clinician for the images they take","IT alone, because it runs the archive"],c:1,e:"Governance assigns owners for image types, access, metadata, retention, and standards."}
);

// CIIP Academy question bank, units 4 and 5. All questions are original informatics scenarios.
window.FRA = window.FRA || {};
FRA.questions = FRA.questions || [];
FRA.questions.push(
// u4l1
{id:"u4l1-1",t:"u4l1",q:"A PACS database makes thousands of small reads and writes a minute and the vendor requires very low latency. Which storage meets that requirement?",a:["A file share on a NAS reached with SMB","Block storage on SSD reached over Fibre Channel or iSCSI","Object storage reached through S3","An NFS share on spinning disks"],c:1,e:"A database needs raw block volumes on fast media with high IOPS. File shares and object stores add overhead and cannot present a raw volume, so they do not meet a database vendor's requirement."},
{id:"u4l1-2",t:"u4l1",q:"Windows reading stations need one shared folder tree for a cached image store. Which pairing fits?",a:["A SAN presenting a block volume over iSCSI to every station","Object storage with an S3 interface on each station","NAS with SMB","DAS attached to one workstation at a time"],c:2,e:"NAS shares folders over the network and Windows clients reach it with SMB. A SAN gives each server a raw disk, and DAS belongs to one server, so neither gives many stations one folder tree."},
{id:"u4l1-3",t:"u4l1",q:"A colleague asks how iSCSI differs from Fibre Channel. Which statement is correct?",a:["iSCSI shares folders to Windows clients while Fibre Channel presents volumes to Linux only","Fibre Channel carries file shares over Ethernet while iSCSI uses a dedicated fabric","iSCSI is a drive interface inside a server while Fibre Channel is a cloud interface","iSCSI carries block storage over ordinary TCP and Ethernet while Fibre Channel uses its own fabric"],c:3,e:"Both are SAN transports that present block volumes. iSCSI rides on the ordinary Ethernet network, which is cheaper, and Fibre Channel needs its own faster fabric of switches and adapters."},
{id:"u4l1-4",t:"u4l1",q:"A ten-year archive must scale widely at low cost and be reached by keyed objects with metadata. What is the usual choice?",a:["An object store reached through S3","A SAN volume formatted by the archive server","A direct-attached RAID 5 set in one server","A NAS share reached by NFS"],c:0,e:"Object storage keeps whole objects with IDs and metadata in a flat space and scales very wide, which suits write-once images. Cloud archives use the S3 interface for this reason."},
{id:"u4l1-5",t:"u4l1",q:"Which description fits SATA in a storage quote?",a:["How a server reaches shared block storage over a fabric","How a lower-cost drive connects to its controller","How a client mounts a Windows file share across the network","How an application stores objects with keys and metadata"],c:1,e:"SATA is a drive interface, used for lower-cost disks, and SCSI is the enterprise counterpart. They describe how a drive connects inside a system, not how servers reach shared storage."},

// u4l2
{id:"u4l2-1",t:"u4l2",q:"A hospital must replace its PACS product and wants the images to stay put rather than be migrated. Which design makes that possible?",a:["Longer nearline retention on the existing PACS vendor's storage","A second PACS mirrored in real time to the first PACS","A vendor neutral archive that stores images in standard formats behind open interfaces","A nightly snapshot of the PACS database kept for a year"],c:2,e:"A VNA holds images in standard formats and several PACS can read and write it, so replacing a PACS means pointing the new one at the same archive. Mirrors and snapshots keep the old vendor's format."},
{id:"u4l2-2",t:"u4l2",q:"An array of eight 4 TB drives is set up as RAID 6. What usable capacity does it give?",a:["16 TB","32 TB","28 TB","24 TB"],c:3,e:"RAID 6 uses double parity, so usable capacity is (8 minus 2) x 4 = 24 TB. 32 TB is RAID 0 (all drives usable), 28 TB is RAID 5 (single parity), and 16 TB is RAID 1 or RAID 10 (half the drives mirror)."},
{id:"u4l2-3",t:"u4l2",q:"An online archive has 60 TB usable, 42 TB used, and grows 1.5 TB a month. Procurement takes 6 months. What is the LATEST point, counted from today, at which the order can be placed to avoid running out?",a:["6 months from now","12 months from now","4 months from now","9 months from now"],c:0,e:"Months remaining is 18 TB free divided by 1.5 TB a month, 12 months. Subtract the 6 month purchase time and the latest order point is 6 months from now. 12 months is when the archive is full, and 4 months is when the 80 percent alert (48 TB) fires."},
{id:"u4l2-4",t:"u4l2",q:"The security team asks whether the nightly RAID 10 array protects the archive from ransomware. What is the correct answer?",a:["Yes, because mirrored drives hold a clean copy","No, because the array holds copies of encrypted data","Yes, if the array is also replicated to a second site","No, because RAID 10 only protects striped volumes"],c:1,e:"RAID and replication faithfully copy whatever is written, including encrypted or deleted data. Only a separate, ideally immutable backup protects against ransomware."},
{id:"u4l2-5",t:"u4l2",q:"A cloud vendor offers low storage prices for the archive. Which cost is the one most often missed when comparing?",a:["The tag morphing licence","Power for the vendor's drives","Egress charges to pull studies back out","The price of mirroring inside the vendor's site"],c:2,e:"Cloud capacity is rented, and getting data out costs money and time. Compare egress, retrieval time, and who holds the encryption keys, not just the price per terabyte stored."},

// u4l3
{id:"u4l3-1",t:"u4l3",q:"A new scanner has a link light and answers a ping from the PACS server, but its DICOM echo times out rather than being rejected. Which OSI layer is the FIRST suspect?",a:["Layer 7, because the AE title is unknown to the server","Layer 1, because the cable is partly faulty and lost some frames","Layer 2, because the VLAN assignment separates the scanner","Layer 4, because a firewall or a wrong port is silently dropping the connection"],c:3,e:"A working ping clears layers 1 to 3. A timeout rather than a rejection means nothing answered on that port, which is a layer 4 problem. A rejection with a reason would point to layer 7."},
{id:"u4l3-2",t:"u4l3",q:"Which device forwards frames by MAC address?",a:["Switch","Gateway","Hub","Router"],c:0,e:"A switch learns which MAC address sits on which port and forwards frames only there. A hub repeats everything, and a router moves traffic between networks using IP addresses."},
{id:"u4l3-3",t:"u4l3",q:"Why does DICOM use TCP rather than UDP for a study transfer?",a:["TCP has less overhead than UDP, so every study moves faster on it","TCP acknowledges and resends lost data","TCP encrypts each segment, so no separate privacy protocol is needed","TCP selects the route, so transfers avoid the busiest switches"],c:1,e:"A study must arrive intact. TCP is connection-oriented, acknowledges data, and resends loss. UDP is faster but gives no delivery guarantee, which suits lookups and logging."},
{id:"u4l3-4",t:"u4l3",q:"A fixed diagnostic workstation sits 140 meters from the nearest switch in another building. What is the BEST link?",a:["Cat 6 copper run directly","Wireless with a high-gain antenna","Fiber","A Bluetooth bridge"],c:2,e:"Copper Ethernet is limited to 100 meters, and wireless is a shared and variable medium that a diagnostic station should avoid. Fiber covers the distance and ignores electrical noise."},
{id:"u4l3-5",t:"u4l3",q:"A browser viewer shows a certificate warning when it opens a study. Which layer does this point to?",a:["Layer 1, physical, where the cable ends","Layer 3, network, where addresses are assigned and routes are chosen","Layer 2, data link, where VLANs are set","Layer 6, presentation, where encryption is handled"],c:3,e:"TLS encryption and certificates sit at the presentation layer in the OSI model. A certificate warning means the encrypted connection could not prove the server's identity."},

// u4l4
{id:"u4l4-1",t:"u4l4",q:"A 500 MB study is sent over a 100 Mbps link with no other traffic. What is the best-case transfer time?",a:["40 seconds","4 seconds","80 seconds","400 seconds"],c:0,e:"Convert bytes to bits: 500 MB x 8 = 4,000 megabits. Divide by 100 megabits per second to get 40 seconds. 4 seconds is the gigabit time, 80 seconds is the 50 Mbps time, and real transfers take longer because of overhead and shared links."},
{id:"u4l4-2",t:"u4l4",q:"A scanner reaches PACS for a few seconds after each reboot and then loses the connection. Another device was recently given the same IP address. What is the MOST likely mechanism?",a:["The VPN tunnel drops its keys after each reboot","The ARP table flips between two hardware addresses for one IP address","The firewall blocks the DICOM port after a few connections","The DNS server removes the scanner's record on each lease"],c:1,e:"A duplicate IP address makes switches and hosts learn two MAC addresses for one IP, so traffic goes to one device and then the other. Use fixed or reserved addresses for modalities."},
{id:"u4l4-3",t:"u4l4",q:"Which port does LDAPS use?",a:["389","443","636","3389"],c:2,e:"LDAP uses port 389 and the encrypted LDAPS uses 636. HTTPS is 443 and RDP is 3389."},
{id:"u4l4-4",t:"u4l4",q:"A modality behind NAT sends studies fine, but a {{C-MOVE}} from PACS to it fails. What is the MOST likely cause?",a:["The modality sits on a different VLAN than the trunk port","The modality's AE title is longer than the sixteen characters DICOM allows","The study uses a transfer syntax the archive cannot store","The private address is not reachable from outside"],c:3,e:"NAT hides the private address. A {{C-MOVE}} makes the PACS open a connection to the destination, which it cannot do through a translation without a mapped address and port."},
{id:"u4l4-5",t:"u4l4",q:"Two web viewer servers sit behind a load balancer sharing one virtual IP. One fails and users notice nothing. Which property is this?",a:["Fault tolerance","Bandwidth headroom on the link","Latency of the viewer response","Encryption"],c:0,e:"Fault tolerance is the ability to keep working through a failure, and redundancy, the second server and path, makes it possible. A virtual IP lets clients keep one address."},

// u4l5
{id:"u4l5-1",t:"u4l5",q:"A tomosynthesis study takes a full minute to open on one workstation and seconds on another with the same network link. Which component should be checked FIRST?",a:["The GPU driver on the second workstation","Memory use and whether the viewer is paging to disk","The firmware on the core switch","The archive server's backup schedule during the nightly maintenance window"],c:1,e:"A large study is held in memory by the viewer. A workstation short of RAM pages to disk and opens slowly even on a fast link, and it is a cheap local check before touching servers or the network."},
{id:"u4l5-2",t:"u4l5",q:"Image loading is slow on one workstation even though the switch port reports a healthy link to a healthy network. Which setting is the MOST likely cause?",a:["A loose USB hub on the dictation microphone","A drive interface left at an old SCSI setting","A speed or duplex mismatch","An AGP slot set to a lower graphics mode"],c:2,e:"A network card set to the wrong speed or duplex negotiates a poor link that still shows as up, and image loading suffers. Fix it by matching the card and the switch port, or setting both to auto-negotiate."},
{id:"u4l5-3",t:"u4l5",q:"Which component matters MOST for smooth 3D rendering and driving diagnostic displays at a reading station?",a:["The CPU cooler","The NIC","The USB controller","The GPU"],c:3,e:"The graphics processor renders 3D and drives the displays. CPU, RAM, and drives matter too, but the GPU is the part that sets the display and 3D experience."},
{id:"u4l5-4",t:"u4l5",q:"A new archive server must survive the loss of one power supply, one boot drive, and one network switch. Which specification covers all three?",a:["Two power supplies, mirrored boot drives, and two network cards on different switches","A single large power supply, a RAID 0 boot volume, and a faster network card","Two servers each with one of every part and no shared storage","A battery backup, a spare boot drive on the shelf, and a longer cable"],c:0,e:"Redundant components remove single points of failure inside the server: duplicate power supplies, mirrored boot drives, and two network cards cabled to separate switches."},
{id:"u4l5-5",t:"u4l5",q:"A clinician brings a USB drive of outside images to a nurses' station. What is the BEST way to get them into the archive?",a:["Copy them to the shared reading folder so the PACS picks them up automatically overnight","Import on a controlled workstation that scans it and reconciles demographics","Open them in the viewer and export the key images to the archive","Ask the clinician to mail the drive to the vendor for loading"],c:1,e:"Removable media can carry malware and mismatched patient data. A controlled import workstation scans it, reads the index, and reconciles demographics before anything joins the archive."},

// u4l6
{id:"u4l6-1",t:"u4l6",q:"A vendor pins its viewer to a Java release the security team has retired. What is the BEST response?",a:["Upgrade the runtime on the server and test it only if users complain","Disable the security team's policy on the viewer server until the vendor updates","Request a documented, time-limited exception with isolation and a dated plan to upgrade","Run the viewer unsupported on the production network with no record"],c:2,e:"A pinned runtime is a managed risk: isolate the server, limit access, record the exception, and set an upgrade date with the vendor. Ignoring the policy or upgrading untested are both unmanaged risks."},
{id:"u4l6-2",t:"u4l6",q:"What is the main security rule for RDP and VNC to a PACS server?",a:["Allow them from any workstation on the clinical network that has the client installed","Keep them open on the server's public address","Share one administrator login with the vendor","Allow them only over a VPN, with named accounts and logging"],c:3,e:"Remote control tools are open doors. Restrict them to the VPN, use individual accounts, require two-factor authentication for administrators, and log each session."},
{id:"u4l6-3",t:"u4l6",q:"What does VDI change for a clinician reading at a remote location?",a:["The desktop runs in the data center","The studies are downloaded to the local disk before they open","The workstation needs no network connection to display images","The viewer is installed on each thin client in turn"],c:0,e:"VDI hosts desktops in the data center and shows them remotely, so the user sees pixels. It helps patching and remote access, but needs enough GPU and bandwidth behind each diagnostic session."},
{id:"u4l6-4",t:"u4l6",q:"A radiologist wants to read primary diagnostic studies on a personal tablet. What is the BEST response?",a:["Approve it, since a modern tablet screen is as bright and sharp as a diagnostic display","Allow review and triage, but diagnosis only on cleared and calibrated devices","Refuse every use of the tablet for any clinical purpose, including viewing reports","Approve it if the tablet has a screen lock turned on"],c:1,e:"Mobile devices are fine for review, reports, and triage. Primary diagnosis needs displays and software cleared and calibrated for it, and mobile devices also need management, encryption, and a lockable app."},
{id:"u4l6-5",t:"u4l6",q:"A browser update breaks the web viewer. Which part of the test plan should have caught it?",a:["Security testing of the firewall rules between viewers and the archive","Unit testing of the database that stores viewer sessions and configuration","Regression testing of the viewer against new browser versions","Capacity testing of the archive"],c:2,e:"Regression testing confirms that existing features still work after a change in the environment, including a new browser version. A supported-browser list and a test pass belong in the plan."},

// u4l7
{id:"u4l7-1",t:"u4l7",q:"An audit finds a radiologist's PACS account active three weeks after she left. What is the BEST long-term fix?",a:["Reset every password in the department once a quarter","Send a reminder to the help desk each Monday","Ask each supervisor to email the imaging team about leavers","Authenticate PACS against the directory and tie deprovisioning to the human resources record"],c:3,e:"A leaver with a live account is an account lifecycle failure. Directory authentication means one disabled account closes all access, and a review of accounts against the human resources list is the backstop."},
{id:"u4l7-2",t:"u4l7",q:"Which protocol queries a directory over an encrypted connection?",a:["LDAPS","SNMP, version 3 polling","RDP with network level authentication","LDAP"],c:0,e:"LDAP queries a directory and LDAPS is its encrypted version, on port 636 in place of 389."},
{id:"u4l7-3",t:"u4l7",q:"A mobile worklist app needs to read the worklist for a user without ever holding the user's password. Which standard fits?",a:["Kerberos, which issues a ticket to the workstation","OAuth 2.0, delegated authorization","LDAP, which lets the application read the password hash","SNMP, which lets the application poll the account"],c:1,e:"OAuth 2.0 is delegated authorization: the app gets a token with limited rights and never sees the password. Kerberos handles sign-on inside a Windows domain and SAML carries identity assertions."},
{id:"u4l7-4",t:"u4l7",q:"In a role matrix for a radiology department, which assignment follows least privilege?",a:["The clerk can edit images and sign reports","The radiologist can change system settings and sign every report in the archive","The PACS administrator manages the system but cannot read reports","The technologist can run the audit reports"],c:2,e:"Least privilege gives each role only what its work needs. An administrator manages the system without reading reports, and a radiologist reads and signs without changing system settings."},
{id:"u4l7-5",t:"u4l7",q:"A clinician uses break-the-glass access to open a record outside her normal rights in an emergency. What must happen?",a:["The audit log entry is removed to protect the patient","The access is blocked until a manager approves it","The role is permanently expanded to include the record","The access is logged and reviewed afterward"],c:3,e:"Break-the-glass access is allowed for emergencies, with a reason, but it is flagged and every use is reviewed afterward. Blocking it defeats its purpose and expanding the role breaks least privilege."},

// u4l8
{id:"u4l8-1",t:"u4l8",q:"Which clause of a query keeps only the unread exams?",a:["{{WHERE}} status = 'unread'","{{GROUP BY}} status, then count each group","{{JOIN}} unread on the status column","{{SELECT}} unread"],c:0,e:"{{WHERE}} filters rows by a condition. {{SELECT}} chooses columns, {{JOIN}} combines tables on a matching key, and {{GROUP BY}} gathers rows so a count is computed per group."},
{id:"u4l8-2",t:"u4l8",q:"A report that ran in seconds now takes several minutes on a table of 10 million exams. What is the BEST FIRST step?",a:["Buy a larger database server before changing anything","Examine the query and add or fix the index on the filtered and joined columns","Run the report on the production system at midday to measure it","Delete the oldest year of exams to shrink the table"],c:1,e:"A missing index on a filtered or joined column is the classic cause of a report slowing as a table grows. Look at the query and its indexes before spending money or removing data."},
{id:"u4l8-3",t:"u4l8",q:"In the exam table, which column should hold the foreign key to the modality table?",a:["The patient name","The accession number","The modality code","The exam date"],c:2,e:"A foreign key points to another table's primary key. The modality code in the exam table matches the primary key of the modality table, and the database refuses a code that does not exist."},
{id:"u4l8-4",t:"u4l8",q:"The modality name was stored in every exam row, and renaming it required updating thousands of rows. Which design practice avoids this?",a:["Adding an index on the name column of every table","Compression of the exam table to reduce row size","Replicating the table to a second site for speed","Normalization, one table per fact"],c:3,e:"Normalization splits data into related tables so each fact is stored once. The name lives in the modality table, so a rename is one change."},
{id:"u4l8-5",t:"u4l8",q:"A vendor's support ends in 14 months and the replacement needs budget, testing, and migration. When should planning start?",a:["Now, because those tasks take more than a year","After the support ends, when the contract is renewed","In 12 months, when the budget cycle opens","Only if the system has a serious failure first"],c:0,e:"Planning for replacement starts well ahead of the end-of-support date because budget, testing, and migration take a year or more. Running past end of support is a growing security and compliance risk."},

// u5l1
{id:"u5l1-1",t:"u5l1",q:"A CT slice is 512 x 512 pixels at 2 bytes per pixel and a study has 60 slices. About how large is the study?",a:["15.7 million bytes","31.5 million bytes","524,288 bytes","252 million bytes"],c:1,e:"Study size is images x rows x columns x bytes per pixel. One slice is 512 x 512 x 2 = 524,288 bytes, and 60 slices give 31,457,280 bytes, about 31.5 million. 524,288 is one slice only, and 252 million counts bits instead of bytes."},
{id:"u5l1-2",t:"u5l1",q:"A service does 20,000 CT exams a year averaging 52 MB each. How much storage do they need for one year, uncompressed?",a:["10.4 TB","104 TB","1.04 TB","0.104 TB"],c:2,e:"20,000 x 52 MB = 1,040,000 MB. With 1 TB as 1,000,000 MB, that is 1.04 TB. A slip of a power of ten in the prefix is the common mistake."},
{id:"u5l1-3",t:"u5l1",q:"A plan shows 4.1 TB of studies a year and needs a second copy at the disaster recovery site. Lossless compression of 2.5 to 1 is assumed. What storage does the first year need across both copies?",a:["10.3 TB","1.6 TB","8.2 TB","3.3 TB"],c:3,e:"Compressed size is 4.1 divided by 2.5, about 1.6 TB, and the second copy doubles it to about 3.3 TB. 1.6 TB is a single copy, and 8.2 TB is the uncompressed total for two copies."},
{id:"u5l1-4",t:"u5l1",q:"The imaging committee adds a scanner with thinner slices, and studies for that modality become 20 percent larger. What must the capacity plan change?",a:["The average study size, which then multiplies the exam count","The exam count only, because patient volume is unchanged","The compression ratio, because larger studies compress better","The network speed only, because the storage is unaffected"],c:0,e:"Annual storage is exams x average study size, so a larger study raises storage even when the exam count is flat. Growth comes from size as well as from volume."},
{id:"u5l1-5",t:"u5l1",q:"A purchase quote says 40 TB of usable storage, but the server operating system reports 36.4 TB. What is the MOST likely explanation?",a:["A single failed drive that the controller removed from the array and replaced","The seller counts in units of 1,000 and the system in units of 1,024","Compression applied to the volume by the operating system, hiding space","The disk was formatted twice"],c:1,e:"Storage vendors count 1 TB as 1,000,000 MB while operating systems often divide by 1,024 and show a smaller number. Plan with one convention and know which one a quote uses."},

// u5l2
{id:"u5l2-1",t:"u5l2",q:"Study volume will rise 30 percent and the link to the archive already peaks at 85 percent use. What is the bottleneck to address FIRST?",a:["The number of viewer licences","The size of the archive","The network link","The age of the servers"],c:2,e:"Scalability is limited by the weakest part at the busiest hour. A link at 85 percent peak cannot absorb 30 percent more traffic, so adding storage would not help."},
{id:"u5l2-2",t:"u5l2",q:"A vendor offers SaaS PACS on a per-study price. Which contract question BEST addresses the risk of vendor lock-in?",a:["Whether upgrades are scheduled by the vendor or by the hospital","How many studies the per-study price covers before the rate tier changes","Whether the vendor's viewer supports the same hanging protocols as today","How the hospital gets its data out and what the egress cost would be"],c:3,e:"Lock-in is about leaving. Exit terms, the format of an export, egress charges, data location, and key ownership decide whether the hospital can move. Price tiers, hanging protocols, and upgrade control matter, but they do not answer how you get out."},
{id:"u5l2-3",t:"u5l2",q:"A tomosynthesis unit will perform 5,000 exams a year at a vendor-quoted 500 MB each. How much storage does it add per year?",a:["2.5 TB","0.25 TB","25 TB","250 TB"],c:0,e:"5,000 x 500 MB = 2,500,000 MB, which is 2.5 TB a year from one room. The other values are slips of a power of ten in the prefix. New modalities make each study much larger, so storage and network demand rise faster than the exam count."},
{id:"u5l2-4",t:"u5l2",q:"A teaching hospital has 200 residents who each use the viewer for an hour a day at different times, never more than 30 at once. Which licence model is the BEST fit?",a:["Named user licences for all 200 residents","Concurrent licences","A perpetual licence per workstation","A per study licence for every resident"],c:1,e:"Concurrent licences count simultaneous use, so 200 occasional users sharing 30 or so seats is the efficient choice. Named user licences would pay for 200 people regardless of when they log in."},
{id:"u5l2-5",t:"u5l2",q:"A clinic has a small, unpredictable exam volume and little capital. Which licence model fits?",a:["Enterprise","Perpetual","Per study","Named user"],c:2,e:"Per study pricing rises with volume, so a small and uncertain workload pays only for what it uses. Perpetual and enterprise licences need larger upfront commitments."},

// u5l3
{id:"u5l3-1",t:"u5l3",q:"After a PACS upgrade a report template that worked yesterday no longer opens. Which type of testing would have found this?",a:["Unit testing of the new feature","Stress testing","Security testing","Regression testing"],c:3,e:"Regression tests confirm that existing features still work after a change. A stress test checks load, a security test checks access, and a unit test checks one new component alone."},
{id:"u5l3-2",t:"u5l3",q:"The test system was built from a copy of production and still has the production interface settings. What must be done before it is switched on?",a:["Point every interface at the test engine and have a second person confirm","Leave the settings, because the test messages are labelled as tests","Disable only the report interface and leave the rest","Switch it on and watch the queues for stray messages"],c:0,e:"A test system on live interface settings sends test results to real charts. Re-point every interface and outbound connection to test endpoints, and verify before the first message."},
{id:"u5l3-3",t:"u5l3",q:"Which data is acceptable in the test environment without special approval?",a:["Last month's real outpatient studies, copied as they are","Fabricated or de-identified studies","Real studies copied after removing only the patient name","A set of real studies from staff members who agreed informally"],c:1,e:"Test data should be fake or de-identified. Real patient data is allowed in a test system only with the same protections as production and an approved purpose."},
{id:"u5l3-4",t:"u5l3",q:"Which group is the BEST choice of testers for a worklist change?",a:["The PACS administrators alone","The vendor's developers alone, because they wrote the upgrade and know it best","Technologists, radiologists, and an administrator doing the real work","Any staff who are free on the day"],c:2,e:"Testers should be the people who do the real work, because a technologist notices a missing procedure and a radiologist notices a broken hanging protocol. Name them and book their hours first."},
{id:"u5l3-5",t:"u5l3",q:"Fifty radiologists will log in at 8 a.m. after the upgrade. Which test answers whether the system keeps up?",a:["Unit testing","Functional testing of every feature against the specification","User acceptance testing by the radiologists at go-live","Scalability and stress testing"],c:3,e:"Scalability and stress tests show behavior under heavy load or growth. Functional tests check features against the specification and acceptance tests confirm the system does the users' job."},

// u5l4
{id:"u5l4-1",t:"u5l4",q:"Which element makes a test case usable by two different testers?",a:["An expected result that can be judged pass or fail","A long list of general goals","A detailed description of the vendor's approach to development and release","The name of the person who wrote it"],c:0,e:"A case needs a purpose, a starting state, steps, and an expected result that is specific enough to pass or fail. 'Check that CT works' cannot be judged."},
{id:"u5l4-2",t:"u5l4",q:"A defect is fixed and the tester confirms the failed case now passes. What is the correct next step?",a:["Close the defect, since the failed case passed","Rerun the regression and interface suites, then close the defect","Ask the vendor to confirm the fix in writing","Rewrite the failed case so it passes the next time"],c:1,e:"A fix can break something else, so after retesting the failed case the regression suite is rerun. Only then is the defect closed."},
{id:"u5l4-3",t:"u5l4",q:"A quick check of 10 cases decides whether a new build is worth testing at all. What is this suite called?",a:["An acceptance suite","A regression suite","A smoke suite","A stress suite"],c:2,e:"A smoke suite is a short check that the system is up and the main path works. If it fails, deeper testing waits for a better build."},
{id:"u5l4-4",t:"u5l4",q:"Testing ends with 3 cases failed that the vendor will not fix before go-live. What does a valid sign-off require?",a:["Marking the cases as blocked and moving on to go-live","The vendor's verbal promise to fix them after go-live","Deleting the failed cases from the results record","A named risk acceptance with the reason"],c:3,e:"A sign-off records what was run, passed, failed, and waived. Open defects need a named risk acceptance by the business and clinical owners, with the reason written down."},
{id:"u5l4-5",t:"u5l4",q:"The accession number format changes in an upgrade. What happens to the test suites?",a:["Update the expected results in every case that uses the accession number","Nothing, since the old results stay valid until the vendor publishes new release notes","Delete the interface suite as obsolete and rebuild it from the vendor's test scripts","Run only the smoke suite from now on"],c:0,e:"Every upgrade or change means maintaining the cases: change expected results that moved, add cases for new features, and retire cases for features that are gone."},

// u5l5
{id:"u5l5-1",t:"u5l5",q:"A system is promised at 99.9 percent availability. How many minutes of downtime per year does that allow?",a:["52.56 minutes","525.6 minutes","5,256 minutes","5.256 minutes"],c:1,e:"Downtime per year is (1 minus availability) x 525,600, so 0.001 x 525,600 is 525.6 minutes, about 8.8 hours. 52.56 minutes is the 99.99 percent allowance, 5,256 is 99 percent, and 5.256 is 99.999 percent."},
{id:"u5l5-2",t:"u5l5",q:"A system was down for 263 minutes last year and the contract requires 99.99 percent. Is the requirement met?",a:["Yes, because 263 minutes is under half a day","Yes, because the downtime is under 99 percent","No, because 99.99 percent allows only 52.56 minutes","No, because 99.99 percent allows no downtime at all"],c:2,e:"At 99.99 percent the allowance is 0.0001 x 525,600, which is 52.56 minutes. 263 minutes is five times that and works out to about 99.95 percent availability."},
{id:"u5l5-3",t:"u5l5",q:"A second site is in another state and the link is slow. The hospital accepts losing a few minutes of recent studies after a disaster. Which replication fits?",a:["A nightly snapshot only","Synchronous replication across the wide area link","Mirroring inside one array at the primary site","Asynchronous replication"],c:3,e:"Asynchronous replication does not wait for the remote copy, so it works over distance, and its lag is the recovery point. Synchronous replication needs a fast, short link."},
{id:"u5l5-4",t:"u5l5",q:"A cluster has never been failed over because nobody wanted the risk. What is the BEST action?",a:["Test failover and failback on a schedule and record how long each takes","Leave it untested, because untested clusters are stable","Turn off automatic failover so it cannot trigger by mistake","Wait for a real failure to show that it works"],c:0,e:"A failover that was never tried often fails when needed. Test both directions on a schedule in a planned window and compare the time taken with the recovery objective."},
{id:"u5l5-5",t:"u5l5",q:"After repair, services are returned from the standby server to the original server. What is this called?",a:["Failover","Failback","Load balancing","Mirroring"],c:1,e:"Failover moves service to the backup; failback returns it to the primary after repair. Do failback in a planned window and resynchronize the primary first."},

// u5l6
{id:"u5l6-1",t:"u5l6",q:"Ransomware encrypts the production PACS storage and its replica. Which protection is MOST likely to give a clean restore?",a:["Synchronous replication to the second site","RAID 6 on the production array","An immutable offsite backup","A snapshot kept on the same array"],c:2,e:"Replication and snapshots copy the damage or sit on the same system, and RAID only survives drive failure. An immutable offsite copy cannot be changed from the infected network, so it stays clean."},
{id:"u5l6-2",t:"u5l6",q:"The emergency department can tolerate at most 15 minutes of lost studies after an outage. Which objective is that, and what does it drive?",a:["A 15 minute RTO, driving the size and location of the offsite backup copy","A 15 minute RTO, driving the choice of standby hardware","A 15 minute RPO, driving the number of downtime viewers","A 15 minute RPO, driving the frequency of backup or replication"],c:3,e:"The recovery point objective is how much data can be lost, measured as time, and it sets how often data must be copied. The recovery time objective is how long the service can be down."},
{id:"u5l6-3",t:"u5l6",q:"A 3 hour outage has ended and the modalities held 140 studies locally. What completes the reconciliation?",a:["Resend the held studies, then match counts and clear the unmatched queue against the paper orders","Delete the held studies because paper orders were used","Resend the studies and let the radiologists find any duplicates","Wait for the modalities to purge their local storage"],c:0,e:"Reconciliation matches every acquired study to an order and every order to a study or a reason. Compare the modality's count sent with PACS received, and re-enter paper orders."},
{id:"u5l6-4",t:"u5l6",q:"Which item belongs to business continuity rather than disaster recovery?",a:["The restore of the database from last night's backup","Paper order forms and a downtime viewer","The failover of the archive cluster to the second site","The rebuild of a failed server"],c:1,e:"Business continuity keeps clinical work going while systems are down, with forms, roles, and local viewers. Disaster recovery restores the systems themselves."},
{id:"u5l6-5",t:"u5l6",q:"How should a disaster recovery plan be proven to work?",a:["Trust the backup software's success messages each night","Review the written plan once a year in a committee meeting","Restore real backups and run a drill, timing each step","Test only the failover, since restores are routine work"],c:2,e:"A plan that is never exercised fails. Restore real backups, fail over to the standby, and run a drill on paper, and record the time of each step against the recovery time objective."},

// u5l7
{id:"u5l7-1",t:"u5l7",q:"A scanner shows a study as sent, but PACS has nothing. A DICOM echo succeeds. What is the next step?",a:["Rebuild the reading worklist filters","Restart the PACS application servers","Replace the cable and the switch port between the scanner and the network","Read the PACS log for a rejected association and its reason"],c:3,e:"A working echo clears the path and the AE title basics. The receiver's log shows whether an association was rejected and why, which comes before any restart or hardware change."},
{id:"u5l7-2",t:"u5l7",q:"Which port does a monitoring server use to poll devices with SNMP?",a:["161","162","443","3389"],c:0,e:"SNMP polling uses port 161, and the unsolicited alerts called traps arrive on port 162."},
{id:"u5l7-3",t:"u5l7",q:"Alerts fire every hour and nobody reads them. What is the BEST improvement?",a:["Add more alerts so none can be missed","Set thresholds from the system's normal range, send each alert to a named owner, and review them","Mute the alerts that fire most often","Send every alert to the whole department"],c:1,e:"Alerts that nobody reads are as bad as none. Thresholds come from what is normal for the system, each alert has a named owner and escalation, and false alarms and misses are reviewed."},
{id:"u5l7-4",t:"u5l7",q:"You need to search the modality, the interface engine, and PACS at once to find where one accession number stopped. Which tool fits?",a:["SNMP traps","A DICOM simulator","Log aggregation","Network protocol analysis"],c:2,e:"Log aggregation collects logs from many systems in one place so one identifier can be searched across all of them. A simulator tests a sender or receiver and traps report device events."},
{id:"u5l7-5",t:"u5l7",q:"The logs show nothing useful about why a vendor's messages are being rejected. What should you do next?",a:["Reinstall the operating system on the receiving server","Reset the vendor's account password and ask them to retry","Increase the archive's disk space on the receiving server","Capture the traffic and read the exchange"],c:3,e:"Protocol analysis shows exactly what was sent and what answered. Read the logs first, then capture traffic if the logs are silent, and change configurations only after you have evidence."},

// u5l8
{id:"u5l8-1",t:"u5l8",q:"The reading worklist has stopped three times in two months and the help desk restarts the service each time. Which discipline applies?",a:["Problem management with a root cause analysis","Incident management with a faster restart","Capacity management of the database server and its storage","Change management of the worklist service"],c:0,e:"Incident management restores service quickly, and problem management finds and removes the cause. Several similar incidents become one problem record for a root cause analysis."},
{id:"u5l8-2",t:"u5l8",q:"Which statement is the BEST problem definition for a root cause analysis?",a:["The database server is poorly configured and needs replacing","The worklist stopped updating for 20 to 40 minutes, three times in 8 weeks","The help desk failed to find the cause on three occasions","The worklist software has a defect that the vendor must fix"],c:1,e:"A problem definition states what happened, when, where, and the effect, with no cause in it. The other statements assume a cause before the data has been collected."},
{id:"u5l8-3",t:"u5l8",q:"Which finding is the BEST root cause in a root cause analysis?",a:["A radiologist opened too many studies at the start of the morning shift","The night technician restarted the wrong service during the incident","No log rotation rule or disk alert existed on the server","The disk filled up"],c:2,e:"A root cause is a process or design gap that, if removed, would stop the event, and it is something you can act on. Stop at a process, not at a person."},
{id:"u5l8-4",t:"u5l8",q:"Which set of headings does a status report to management follow?",a:["Scope, schedule, deliverables, and sign-off","Summary, timeline, technician notes, and ticket numbers","Findings, risks, budget, and vendor options","What, impact, cause, fix, and prevention"],c:3,e:"Management needs a short report in a fixed order: what happened, who and what was affected, the cause in plain words, the fix, and the actions that prevent a repeat."},
{id:"u5l8-5",t:"u5l8",q:"Six weeks after a fix, how should the team show that the root cause was addressed?",a:["Confirm no repeat events and that the alert works","Close the problem record on the day the fix was installed","Rely on the vendor's statement that the issue is solved","Stop reviewing the problem once management has read the report"],c:0,e:"A solution is not finished at implementation. Set a check date and a measure, such as no repeat events and a tested alert, and report whether the fix held."},

// u5l9
{id:"u5l9-1",t:"u5l9",q:"A migration moves 120,000 studies. The new system holds 119,940, with 320 fewer series and 8,500 fewer images. What is the BEST next step?",a:["Accept the migration, since the missing count is within 0.1 percent of the total studies","List the 60 missing studies and trace the missing series and images to them","Delete the new copy and restart the whole migration","Recount only the patients and sign off"],c:1,e:"Reconcile at each level of the model. The missing series and images usually belong to the missing studies, so find the 60 and resend or explain them before sign-off."},
{id:"u5l9-2",t:"u5l9",q:"A migration phase holds 8 TB and the usable throughput is 400 Mbps. About how long does the copy take?",a:["About 160 hours","About 4.4 hours","About 44 hours","About 16 hours"],c:2,e:"8 TB is 8,000,000 MB, or 64,000,000 megabits. Divided by 400 megabits per second that is 160,000 seconds, about 44 hours of continuous transfer."},
{id:"u5l9-3",t:"u5l9",q:"Which migration strategy loads priors for scheduled patients onto the new system before they arrive?",a:["Parallel running with no copy","Big bang migration","Archive to archive migration","Prefetch-driven migration"],c:3,e:"Prefetch-driven migration moves the studies likely to be needed first and the rest in the background or on request, which hides a long copy from the readers."},
{id:"u5l9-4",t:"u5l9",q:"Annotations and key images are stored in the old vendor's private format. What is the BEST plan?",a:["Convert them to a standard representation where possible and tell the radiologists what will not move","Leave them behind without telling anyone","Copy the files and hope that the new viewer shows them","Delete them to simplify the migration"],c:0,e:"System-proprietary data needs a custom migration method. Convert to a standard representation where possible, keep the old viewer for what cannot move, and tell the users before cutover."},
{id:"u5l9-5",t:"u5l9",q:"Tag morphing during a migration is used to do what?",a:["Compress images to save space on the new archive","Correct IDs and names on the way in","Encrypt the images while they cross the network","Split large studies into smaller series for loading"],c:1,e:"Tag morphing changes data elements during the copy, using a written mapping, so the new archive holds consistent patient IDs and procedure names. Keep a list of what was changed."},

// u5l10
{id:"u5l10-1",t:"u5l10",q:"A hospital in Toronto asks which law governs private-sector privacy for its patient data. Which fits?",a:["GDPR, the European data-subject regulation","HIPAA, the United States privacy rule","PIPEDA, the Canadian law","HITECH, the United States breach notification law"],c:2,e:"PIPEDA is the Canadian federal privacy law for private-sector organizations. HIPAA and HITECH are United States law and GDPR is the European Union regulation."},
{id:"u5l10-2",t:"u5l10",q:"A vendor wants permanent remote access to the PACS server. Which response BEST balances support and risk?",a:["Open RDP to the internet with a long password","Refuse any remote access under all circumstances","Give the vendor the administrator password in a sealed email","Grant access over a VPN with named accounts and two-factor authentication, enabled per case and logged"],c:3,e:"Least privilege and logging give the vendor a way to help without an always-open door. Enable access per support case, tie it to a named person, and close it afterward."},
{id:"u5l10-3",t:"u5l10",q:"A laptop holding exported studies is stolen from a car. Which control would have protected the data?",a:["Encryption of the laptop's disk","A firewall on the hospital network","Locked server rooms in the data center","Role-based access on the PACS"],c:0,e:"Encryption at rest protects data when media is lost or stolen. Firewalls, locked rooms, and application roles guard other layers, not a disk that has left the building."},
