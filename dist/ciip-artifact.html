<title>CIIP Academy</title>
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* NetPlus Academy design tokens and components */
:root {
  --bg: #F3F5F8;
  --surface: #FFFFFF;
  --surface-2: #E9EDF2;
  --ink: #14212E;
  --ink-2: #4A5A6B;
  --muted: #7C8A99;
  --line: #D5DCE4;
  --accent: #C25E1F;
  --accent-ink: #FFFFFF;
  --accent-soft: #F8E7DC;
  --good: #1E8E5A;
  --good-soft: #E1F3EA;
  --warn: #B58A1B;
  --warn-soft: #F7EED3;
  --bad: #C8322B;
  --bad-soft: #F9E2E0;
  --led-off: #C9D1DA;
  --focus: #2F6FBF;
  --shadow: 0 1px 2px rgba(20,33,46,.06), 0 8px 24px rgba(20,33,46,.06);
  --font-display: "Archivo", "Segoe UI", system-ui, sans-serif;
  --font-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --radius: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F161E; --surface: #17212B; --surface-2: #1F2B37; --ink: #E6ECF2; --ink-2: #A7B4C2; --muted: #7E8C9B;
    --line: #2C3947; --accent: #E08744; --accent-ink: #14212E; --accent-soft: #3A2418; --good: #3DBB7F; --good-soft: #16332A;
    --warn: #D9AC3A; --warn-soft: #3A3016; --bad: #E5605A; --bad-soft: #3D1C1B; --led-off: #33414F; --focus: #7FB0F5;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F161E; --surface: #17212B; --surface-2: #1F2B37; --ink: #E6ECF2; --ink-2: #A7B4C2; --muted: #7E8C9B;
  --line: #2C3947; --accent: #E08744; --accent-ink: #14212E; --accent-soft: #3A2418; --good: #3DBB7F; --good-soft: #16332A;
  --warn: #D9AC3A; --warn-soft: #3A3016; --bad: #E5605A; --bad-soft: #3D1C1B; --led-off: #33414F; --focus: #7FB0F5;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.3); color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 17px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4 { font-family: var(--font-display); font-weight: 600; line-height: 1.2; margin: 0; text-wrap: balance; color: var(--ink); }
h1 { font-size: 1.9rem; letter-spacing: -0.01em; }
h2 { font-size: 1.45rem; }
h3 { font-size: 1.12rem; }
p { margin: 0; }
a { color: var(--accent); }
code, .mono { font-family: var(--font-mono); font-size: 0.92em; }
code { background: var(--surface-2); padding: 0.08em 0.4em; border-radius: 5px; color: var(--ink); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.muted { color: var(--muted); }
.ink2 { color: var(--ink-2); }
.eyebrow { font-family: var(--font-display); font-size: 0.72rem; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); }
.tnum { font-variant-numeric: tabular-nums; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.spread { justify-content: space-between; }
.hidden { display: none !important; }

/* Shell */
.shell { display: grid; grid-template-columns: 290px minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); min-height: 100vh; }
.topbar { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; letter-spacing: -0.01em; text-decoration: none; color: var(--ink); background: none; border: 0; padding: 0; white-space: nowrap; }
.brand .mark { width: 28px; height: 28px; border-radius: 7px; background: var(--ink); color: var(--bg); display: grid; place-items: center; font-family: var(--font-mono); font-size: 0.8rem; font-weight: 500; }
/* The FieldReady mark: the way back to the catalog from every course, on phones too (where .nav is hidden). */
.brand.site { gap: 0; flex: none; }
.brand.site:hover .mark, .brand.site:focus-visible .mark { background: var(--accent); }
.acct { display:flex; align-items:center; gap:8px; }
.acct .who { font-size:.85rem; color:var(--ink-2); text-decoration:none; max-width:14rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.acct .who:hover { color:var(--ink); text-decoration:underline; }
.syncdot { width:8px; height:8px; border-radius:50%; background:var(--good); display:inline-block; }
.syncdot.syncing { background:var(--accent); }
.syncdot.error, .syncdot.offline { background:var(--warn); }
.nav { display: flex; gap: 2px; margin-left: 4px; }
.nav button { background: none; border: 0; padding: 8px 10px; border-radius: 8px; font-family: var(--font-display); font-weight: 500; font-size: 0.92rem; color: var(--ink-2); white-space: nowrap; }
.nav button:hover { background: var(--surface-2); color: var(--ink); }
.nav button[aria-current="page"] { background: var(--accent-soft); color: var(--ink); }
.nav a { display: inline-flex; align-items: center; padding: 8px 10px; border-radius: 8px; font-family: var(--font-display); font-weight: 500; font-size: 0.92rem; color: var(--muted); text-decoration: none; white-space: nowrap; }
.nav a:hover { background: var(--surface-2); color: var(--ink); }
/* The Flashcards link sits among the in-app views, so it takes their colour, not the site links' muted one. */
.nav a.flash { color: var(--ink-2); }
.readiness { margin-left: auto; display: flex; align-items: center; gap: 10px; min-width: 200px; }
.readiness .eyebrow { white-space: nowrap; }
.topbar .btn { white-space: nowrap; }
/* The topbar holds two brands, the account control, ten nav items (the Flashcards link since
   2026-10-25), the meter and the Discord link. It fits on one line at 1500px and up; below
   that the readiness label goes, then the course name (both marks stay, so the page is still
   identifiable), then the nav tightens, then at 900px the nav moves to the bottom of the screen. */
@media (max-width: 1500px) { .readiness .eyebrow { display: none; } .readiness { flex: 0 1 200px; min-width: 44px; } .nav button, .nav a { padding: 8px 8px; } }
@media (max-width: 1320px) { .topbar button.brand .name { display: none; } .nav button, .nav a { padding: 8px 5px; font-size: 0.85rem; } .topbar .btn.small { padding: 6px 8px; } .topbar { gap: 10px; } }
@media (max-width: 1100px) { .nav button, .nav a { padding: 8px 4px; font-size: 0.8rem; } .topbar .btn.small { padding: 6px 7px; font-size: 0.8rem; } }
/* Below 1000px the Discord link (2026-10-21) needs the last few pixels: the All courses text link
   goes (the FR mark at the left opens the catalog) and the nav tightens once more. */
@media (max-width: 1000px) { .nav a[href$="/"]:not(.flash):not([href*="serviceforge"]) { display: none; } .nav button, .nav a { padding: 8px 3px; } }
.rail-toggle { display: none; background: none; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }

.rail { background: var(--surface); border-right: 1px solid var(--line); padding: 18px 14px 40px; overflow-y: auto; position: sticky; top: 57px; height: calc(100vh - 57px); }
.unit { margin-bottom: 8px; }
.unit-head { width: 100%; display: flex; align-items: center; gap: 10px; text-align: left; background: none; border: 0; padding: 8px 8px; border-radius: 8px; }
.unit-head:hover { background: var(--surface-2); }
.unit-num { font-family: var(--font-mono); font-size: 0.78rem; color: var(--muted); width: 22px; }
.unit-title { font-family: var(--font-display); font-weight: 600; font-size: 0.95rem; flex: 1; }
.unit-meta { font-size: 0.78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.unit.skipped .unit-title { color: var(--ink-2); }
.lesson-list { list-style: none; margin: 2px 0 0; padding: 0 0 0 10px; border-left: 2px solid var(--line); margin-left: 18px; }
.lesson-link { width: 100%; display: flex; align-items: center; gap: 10px; text-align: left; background: none; border: 0; padding: 7px 8px; border-radius: 8px; font-size: 0.92rem; color: var(--ink-2); }
.lesson-link:hover { background: var(--surface-2); color: var(--ink); }
.lesson-link[aria-current="page"] { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
.led { width: 10px; height: 10px; border-radius: 50%; background: var(--led-off); flex: none; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); }
.led.green { background: var(--good); box-shadow: 0 0 0 3px var(--good-soft); }
.led.amber { background: var(--warn); box-shadow: 0 0 0 3px var(--warn-soft); }
.led.lg { width: 14px; height: 14px; }

.main { padding: 28px 32px 80px; min-width: 0; }
.content { max-width: 760px; margin: 0 auto; }
.wide { max-width: 1080px; margin: 0 auto; }

/* Cards and buttons */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px 24px; }
.card.lift { box-shadow: var(--shadow); }
.card.soft { background: var(--surface-2); border-color: transparent; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 10px 16px; border-radius: 9px; font-family: var(--font-display); font-weight: 600; font-size: 0.95rem; text-decoration: none; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(0.95); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--surface-2); color: var(--ink); }
.btn.danger { color: var(--bad); border-color: var(--bad); background: transparent; }
.btn.small { padding: 6px 11px; font-size: 0.85rem; }
.btn.lg { padding: 13px 22px; font-size: 1.05rem; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-family: var(--font-display); font-size: 0.75rem; font-weight: 600; letter-spacing: 0.02em; background: var(--surface-2); color: var(--ink-2); }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.accent { background: var(--accent-soft); color: var(--accent); }
.pill.dN { background: var(--surface-2); }

/* Meters and bars */
.meter { height: 8px; background: var(--surface-2); border-radius: 999px; overflow: hidden; flex: 1; }
.meter > i { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .4s ease; }
.meter.good > i { background: var(--good); }
.bars { display: grid; gap: 10px; }
.bar-row { display: grid; grid-template-columns: 150px 1fr 64px; align-items: center; gap: 12px; font-size: 0.95rem; }
.bar-row .label { color: var(--ink-2); }
.bar-row .value { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink); font-family: var(--font-display); font-weight: 600; }
.bar-row .track { height: 10px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.bar-row .track > i { display: block; height: 100%; background: var(--accent); border-radius: 4px 0 0 4px; }
.bar-row .track > i.dim { background: var(--led-off); }

/* Stats */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.stat .big { font-family: var(--font-display); font-weight: 700; font-size: 1.7rem; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.stat .big small { font-size: 0.95rem; font-weight: 500; color: var(--muted); }

/* Onboarding levels */
.levels { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
.level-card { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 6px; min-height: 150px; transition: transform .12s ease, border-color .12s ease; }
.level-card:hover { border-color: var(--accent); transform: translateY(-2px); }
.level-card .level-num { font-family: var(--font-display); font-weight: 700; font-size: 1.6rem; color: var(--accent); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.level-card .level-title { font-family: var(--font-display); font-weight: 600; font-size: 1rem; }
.level-card .level-desc { font-size: 0.9rem; color: var(--ink-2); }
.level-card.final { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.level-card.final .level-title, .level-card.final .level-desc { color: var(--bg); }
.level-card.final .level-num { color: var(--accent); }

/* Lesson body */
.lesson-head { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }
.lesson-body { font-size: 1.05rem; }
.lesson-body h3 { margin: 26px 0 8px; font-size: 1.05rem; color: var(--ink); }
.lesson-body p { margin: 0 0 12px; }
.lesson-body ul { margin: 0 0 12px; padding-left: 22px; }
.lesson-body li { margin: 4px 0; }
.lesson-body .tip { margin: 18px 0 12px; padding: 12px 16px; border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 0 8px 8px 0; color: var(--ink); }
.hook { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; background: var(--surface-2); border-radius: var(--radius); }
.hook .eyebrow { color: var(--accent); padding-top: 3px; white-space: nowrap; }
details.lesson-fold summary { cursor: pointer; font-family: var(--font-display); font-weight: 600; color: var(--ink-2); padding: 6px 0; }

/* Quiz */
.quiz { display: flex; flex-direction: column; gap: 16px; }
.q-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.q-stem { font-size: 1.12rem; line-height: 1.5; }
.options { display: grid; gap: 8px; }
.option { display: flex; align-items: flex-start; gap: 12px; text-align: left; width: 100%; background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; padding: 12px 14px; font-size: 1rem; line-height: 1.4; transition: border-color .1s ease, background .1s ease; }
.option:hover:not(:disabled) { border-color: var(--ink-2); }
.option .key { flex: none; width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 0.8rem; background: var(--surface-2); color: var(--ink-2); }
.option[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.option[aria-pressed="true"] .key { background: var(--accent); color: var(--accent-ink); }
.option.correct { border-color: var(--good); background: var(--good-soft); }
.option.correct .key { background: var(--good); color: #fff; }
.option.wrong { border-color: var(--bad); background: var(--bad-soft); }
.option.wrong .key { background: var(--bad); color: #fff; }
.option:disabled { cursor: default; }
.confidence { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.confidence .eyebrow { margin-right: 4px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 0.88rem; font-family: var(--font-display); font-weight: 500; color: var(--ink-2); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip .k { font-family: var(--font-mono); font-size: 0.75rem; opacity: 0.7; margin-right: 4px; }
.feedback { border-radius: var(--radius); padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; border: 1px solid transparent; }
.feedback.good { background: var(--good-soft); border-color: var(--good); }
.feedback.bad { background: var(--bad-soft); border-color: var(--bad); }
.feedback .verdict { font-family: var(--font-display); font-weight: 700; }
.feedback.good .verdict { color: var(--good); }
.feedback.bad .verdict { color: var(--bad); }
.dots { display: flex; gap: 5px; flex-wrap: wrap; }
.dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--led-off); }
.dots i.good { background: var(--good); }
.dots i.bad { background: var(--bad); }
.dots i.cur { background: var(--accent); }

/* Exam */
.exam-head { display: flex; align-items: center; gap: 16px; padding: 12px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 16px; position: sticky; top: 66px; z-index: 5; }
.timer { font-family: var(--font-mono); font-size: 1.05rem; font-variant-numeric: tabular-nums; }
.timer.low { color: var(--bad); }
.score-hero { display: grid; grid-template-columns: auto 1fr; gap: 22px; align-items: center; }
.score-ring { width: 128px; height: 128px; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(var(--ring-color) calc(var(--pct) * 1%), var(--surface-2) 0); }
.score-ring > div { width: 98px; height: 98px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 1.7rem; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.review-item { border-top: 1px solid var(--line); padding: 14px 0; }
.review-item .stem { font-weight: 600; }
.review-item .ans { font-size: 0.95rem; margin-top: 4px; }
table.plain { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
table.plain th { text-align: left; font-family: var(--font-display); font-size: 0.78rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line); }
table.plain td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.table-wrap { overflow-x: auto; }
textarea.io { width: 100%; min-height: 120px; font-family: var(--font-mono); font-size: 0.8rem; background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 10px; resize: vertical; }
.toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-family: var(--font-display); font-weight: 600; font-size: 0.9rem; z-index: 50; box-shadow: var(--shadow); }
.ready-banner { background: var(--good-soft); border: 1px solid var(--good); border-radius: var(--radius); padding: 18px 20px; }
.kbd-hint { font-size: 0.82rem; color: var(--muted); }
.kbd-hint kbd { font-family: var(--font-mono); background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; font-size: 0.78rem; }
/* Phones have no keyboard to hint at, and the hint would push Previous and Next (or Skip and Submit) onto two rows. */
@media (max-width: 700px) { .kbd-hint { display: none; } }
.topic-list { display: grid; gap: 8px; }
.topic-item { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 10px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.topic-item .t-title { font-weight: 600; }
.topic-item .t-sub { font-size: 0.85rem; color: var(--muted); }

@media (max-width: 900px) {
  .shell { grid-template-columns: 1fr; }
  .rail { position: fixed; left: 0; top: 57px; bottom: 0; width: min(320px, 86vw); transform: translateX(-102%); transition: transform .2s ease; z-index: 30; box-shadow: var(--shadow); height: auto; }
  .rail.open { transform: translateX(0); }
  .rail-toggle { display: inline-flex; }
  .main { padding: 18px 16px 90px; }
  .nav { display: none; }
  .readiness { min-width: 0; }
  .readiness .eyebrow { display: none; }
  .topbar { gap: 10px; padding: 10px 12px; }
  .bar-row { grid-template-columns: 110px 1fr 54px; }
  .score-hero { grid-template-columns: 1fr; justify-items: center; text-align: center; }
  .exam-head { position: static; }
  .mobile-nav { display: flex; position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-top: 1px solid var(--line); z-index: 25; }
  .mobile-nav button, .mobile-nav a { flex: 1; background: none; border: 0; padding: 10px 4px 12px; font-family: var(--font-display); font-size: 0.75rem; font-weight: 600; color: var(--ink-2); text-align: center; text-decoration: none; }
  .mobile-nav button[aria-current="page"] { color: var(--accent); }
}
@media (min-width: 901px) { .mobile-nav { display: none; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }

/* Personalization callouts, plan markers, stage strip */
.callout { border-radius: var(--radius); padding: 14px 16px; border: 1px solid var(--line); border-left-width: 4px; background: var(--surface); display: flex; flex-direction: column; gap: 6px; }
.callout.bad { border-left-color: var(--bad); background: var(--bad-soft); }
.callout.warn { border-left-color: var(--warn); background: var(--warn-soft); }
.callout .stem { font-weight: 600; }
.callout .ans { font-size: 0.95rem; }
.lesson-link .inplan { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none; }

  "AAPM": { full: "American Association of Physicists in Medicine", tip: "The professional body whose task groups write the display and imaging quality control reports.", more: "AAPM reports such as TG18 and TG270 define the test patterns and measurements used to accept and maintain diagnostic displays." },
  "ABII": { full: "American Board of Imaging Informatics", tip: "The board that sets and awards the imaging informatics professional credential.", more: "ABII writes the test content outline, sets eligibility with its seven-point system, and reports results as a scaled score where 75 passes." },
  "ACK": { full: "Acknowledgment", tip: "The HL7 reply message that tells the sender whether a message was received and accepted.", more: "Every HL7 message expects an ACK. A missing or negative ACK is how an interface engine knows to resend, hold, or raise an alert." },
  "ACR": { full: "American College of Radiology", tip: "The radiology professional society that publishes practice parameters and runs imaging accreditation programs.", more: "The ACR works with AAPM and SIIM on the practice parameter for the electronic practice of medical imaging, which guides how imaging systems should be built and run." },
  "ADT": { full: "Admit, Discharge, Transfer", tip: "The HL7 message family that carries patient registration, updates, and merges.", more: "ADT messages flow from the registration system to the RIS and PACS so every system holds the same patient demographics. Merge messages tell downstream systems that two records are one patient." },
  "AE": { full: "Application Entity", tip: "A named DICOM endpoint; its AE title identifies the device or application on the network.", more: "An AE title is up to 16 characters and case-sensitive. A DICOM route works only when each side lists the other's exact AE title, address, and port." },
  "AGP": { full: "Accelerated Graphics Port", tip: "An old graphics card slot you recognize on legacy workstations.", more: "AGP was replaced by PCI Express. A diagnostic workstation with an AGP slot is old hardware and a candidate for replacement." },
  "AP": { full: "Anteroposterior", tip: "A projection in which the x-ray beam enters the front of the body and exits the back.", more: "AP and PA describe the direction of the beam through the patient. They matter to informatics because the projection is part of the procedure name and the image description." },
  "ARP": { full: "Address Resolution Protocol", tip: "The protocol that finds the hardware address that goes with an IP address on the local network.", more: "Switches and hosts use ARP to learn which MAC address answers for an IP address. A duplicate IP address shows up as flipping ARP entries and intermittent connections." },
  "ATNA": { full: "Audit Trail and Node Authentication", tip: "The IHE profile for central audit logging and encrypted connections between trusted systems.", more: "ATNA makes systems send audit events to one repository and authenticate each other with certificates, so access to patient images can be reviewed after the fact." },
  "BC": { full: "Business Continuity", tip: "The plan for keeping clinical work going while systems are down.", more: "Business continuity covers the people and procedures: downtime forms, local viewers, and re-entry of data afterward. Disaster recovery covers restoring the systems themselves." },
  "CD": { full: "Compact Disc", tip: "Portable media still used to hand a patient their images.", more: "Studies on a disc follow the IHE portable data for imaging layout with an index file. Importing a disc safely means reconciling its demographics before the images join the archive." },
  "CIFS": { full: "Common Internet File System", tip: "An older name for the Windows file-sharing protocol.", more: "CIFS is the original dialect of what is now called SMB. A file share on a network-attached storage device is usually reached with one of these." },
  "CIIP": { full: "Certified Imaging Informatics Professional", tip: "The ABII credential for people who run imaging systems: 170 questions in 2 hours 50 minutes.", more: "Earned by points for experience, education, and continuing education, then the exam. Kept with 24 continuing education credits every two years." },
  "CIO": { full: "Chief Information Officer", tip: "The executive who leads information technology for the organization.", more: "The CIO owns infrastructure, security, and budgets that imaging systems depend on. Imaging informatics works with the CIO on capacity, networks, and risk." },
  "CMIO": { full: "Chief Medical Informatics Officer", tip: "A physician leader who guides how clinical information systems are used.", more: "The CMIO bridges clinicians and IT. Workflow changes that touch many physicians often need the CMIO's backing." },
  "CPI": { full: "Consistent Presentation of Images", tip: "The IHE profile that makes grayscale images look the same on every display.", more: "CPI relies on the DICOM grayscale presentation state and a calibrated display, so an image shows the same contrast wherever it is viewed." },
  "CPT": { full: "Current Procedural Terminology", tip: "The code set that names medical procedures for billing and reporting.", more: "Each imaging procedure billed to a payer carries a CPT code. A procedure code mismatch between the order and the billing system is a common cause of denied claims." },
  "CPU": { full: "Central Processing Unit", tip: "The processor that runs a computer's instructions.", more: "Servers that compress images or run database queries are limited by CPU. A busy CPU shows as slow loading and queued work." },
  "CSV": { full: "Comma-Separated Values", tip: "A plain text file where each row is a record and commas separate the fields.", more: "CSV is the easy way to export a report or import a list. It has no standard way to hold commas inside a value, so quotes are used, and leading zeros in IDs can be lost when a spreadsheet opens it." },
  "CT": { full: "Computed Tomography", tip: "Imaging that builds cross-sectional slices from x-ray measurements.", more: "A CT study can hold hundreds of thin slices, so it drives storage growth and network load. Each slice is commonly 512 by 512 pixels at 2 bytes." },
  "DAS": { full: "Direct-Attached Storage", tip: "Drives attached directly to one server and not shared over a storage network.", more: "DAS is simple and fast but cannot be shared with other servers, and a server failure takes the data with it unless it is copied elsewhere." },
  "DHCP": { full: "Dynamic Host Configuration Protocol", tip: "The service that hands out IP addresses and network settings automatically.", more: "Workstations use DHCP freely, but modalities and servers should have fixed or reserved addresses so AE title routes and firewall rules keep working." },
  "DICOM": { full: "Digital Imaging and Communications in Medicine", tip: "The standard for image objects, the services that move them, and how devices connect.", more: "DICOM defines the information model, the file format, the network services such as store and query, and the conformance statement each vendor publishes." },
  "DICOMDIR": { full: "DICOM Directory", tip: "The index file on portable media that lists the studies on the disc or drive.", more: "A DICOMDIR lets a viewer or import tool see what is on a disc without opening every file. It is part of the IHE portable data for imaging profile." },
  "DMAIC": { full: "Define, Measure, Analyze, Improve, Control", tip: "The five phases of the Six Sigma improvement method.", more: "DMAIC takes a problem from a clear definition, through measurement and root cause analysis, to a verified fix with controls so the gain lasts." },
  "DNS": { full: "Domain Name System", tip: "The service that turns host names into IP addresses.", more: "Viewers and interfaces often use names rather than addresses, so a DNS fault looks like a dead server. Check name resolution early when a connection fails." },
  "DR": { full: "Disaster Recovery", tip: "The plan and technology for restoring systems and data after a major failure.", more: "Disaster recovery is measured by the recovery point objective and recovery time objective. It usually involves a second site and replicated data." },
  "DVD": { full: "Digital Versatile Disc", tip: "Higher-capacity optical media sometimes used for large studies.", more: "A study too large for a CD may go on a DVD. Portable media still needs the standard layout and an index file to be readable on another system." },
  "ECG": { full: "Electrocardiogram", tip: "A recording of the heart's electrical activity, stored in cardiology systems as a waveform.", more: "ECG waveforms can be stored as DICOM waveform objects or as separate files, and cardiology departments often keep them in their own system that must be linked to the enterprise." },
  "EHR": { full: "Electronic Health Record", tip: "The shared digital record of a patient's care across providers and settings.", more: "The EHR holds orders, results, and reports; the imaging systems exchange orders and reports with it using HL7 or FHIR." },
  "EMR": { full: "Electronic Medical Record", tip: "The digital record of a patient's care within one organization.", more: "In an imaging workflow the EMR is where the order starts and the final report is read by the clinician." },
  "EOSL": { full: "End of Service Life", tip: "The date after which the vendor no longer supports a product.", more: "After EOSL there are no patches or fixes, which creates security and compliance risk. It is a trigger to plan an upgrade or replacement before it arrives." },
  "FTP": { full: "File Transfer Protocol", tip: "An older protocol for copying files between computers, with no encryption of its own.", more: "Some modalities and vendors still export files over FTP. Prefer an encrypted alternative, and never leave an anonymous or shared login open." },
  "FHIR": { full: "Fast Healthcare Interoperability Resources", tip: "A web-based standard for exchanging health data as small resources over HTTPS.", more: "FHIR resources such as Patient, ServiceRequest, ImagingStudy, and DiagnosticReport are fetched and updated with REST calls, in JSON or XML." },
  "GB": { full: "Gigabyte", tip: "About one billion bytes; a large CT study can reach a few of them.", more: "Storage vendors count a gigabyte as 1,000 megabytes, while some operating systems report 1,024, so figures can differ slightly between tools." },
  "GDPR": { full: "General Data Protection Regulation", tip: "The European privacy law with strict consent and data-subject rights.", more: "GDPR applies to the data of people in Europe wherever it is processed. It affects image sharing, research, and cloud storage location." },
  "GPU": { full: "Graphics Processing Unit", tip: "The processor that draws images and does 3D rendering.", more: "A reading workstation or a 3D server uses a GPU to render large volumes. Display cards must also support the calibration the diagnostic monitors need." },
  "GSDF": { full: "Grayscale Standard Display Function", tip: "The DICOM curve that maps pixel values to luminance so equal steps look equal.", more: "Calibrating a display to the GSDF makes the same image look the same on every calibrated screen. It is defined in Part 14 of the standard." },
  "HA": { full: "High Availability", tip: "A design that keeps a service running through the failure of a component.", more: "High availability uses redundant parts, clustering, and failover. It reduces downtime but does not protect against corruption or deletion, which need backups." },
  "HIPAA": { full: "Health Insurance Portability and Accountability Act", tip: "The United States law that protects health information and sets safeguards for its use.", more: "Its privacy rule governs use and disclosure; its security rule requires administrative, physical, and technical safeguards for electronic information." },
  "HITECH": { full: "Health Information Technology for Economic and Clinical Health Act", tip: "The law that strengthened HIPAA and added breach notification duties.", more: "HITECH requires notice after a breach of unsecured health information and raised penalties for violations." },
  "HL7": { full: "Health Level Seven", tip: "The standard for messages that move orders, patient data, and reports between systems.", more: "Version 2 messages are pipe-delimited text carried over a network connection, usually through an interface engine. FHIR is the newer web-based family from the same organization." },
  "HTTP": { full: "Hypertext Transfer Protocol", tip: "The protocol of the web, using port 80 by default.", more: "Web viewers and DICOMweb services ride on HTTP. Without encryption, anything sent is readable on the network." },
  "HTTPS": { full: "Hypertext Transfer Protocol Secure", tip: "HTTP carried inside TLS encryption, using port 443 by default.", more: "HTTPS protects data in transit and proves the server's identity with a certificate. An expired certificate is a common reason a viewer suddenly stops loading." },
  "ICD": { full: "International Classification of Diseases", tip: "The code set for diagnoses and reasons for care.", more: "ICD codes explain why an exam was ordered and support billing. They describe the condition, while CPT describes the procedure." },
  "ID": { full: "Identifier", tip: "A value that names one patient, order, or object.", more: "Patient ID, accession number, and the UIDs each identify a different thing. Mixing them up is a classic source of mismatched studies." },
  "IHE": { full: "Integrating the Healthcare Enterprise", tip: "The initiative that defines profiles describing how standards are used together to solve a workflow problem.", more: "An IHE profile names the roles (actors), the transactions, and the standards to use. Vendors list the profiles they support in an integration statement." },
  "IID": { full: "Invoke Image Display", tip: "The IHE profile that opens the viewer on the right study from another application.", more: "IID lets an EMR link directly to a study so a clinician sees the right images without searching in a second system." },
  "IOPS": { full: "Input/Output Operations Per Second", tip: "How many reads and writes a storage system can sustain each second.", more: "A database or a busy PACS needs high IOPS more than raw capacity. Solid-state drives deliver far more IOPS than spinning disks." },
  "IP": { full: "Internet Protocol", tip: "The addressing protocol that moves packets between networks.", more: "An IP address, with a subnet and gateway, tells a device where it is and how to reach other networks. Routers forward by IP address." },
  "IR": { full: "Interventional Radiology", tip: "Image-guided procedures done through small openings instead of surgery.", more: "IR rooms use fluoroscopy and angiography. Their images and dose records must reach the patient's record like any other exam." },
  "IT": { full: "Information Technology", tip: "The department and discipline that runs computers, networks, and servers.", more: "In imaging informatics, IT and the imaging department share ownership; informatics staff translate between clinical needs and IT systems." },
  "JPEG": { full: "Joint Photographic Experts Group", tip: "The image compression family behind several DICOM transfer syntaxes.", more: "DICOM uses JPEG lossless, baseline lossy, and JPEG 2000 syntaxes. The syntax determines whether every pixel can be recovered." },
  "JSON": { full: "JavaScript Object Notation", tip: "A lightweight text format for structured data, used by web services.", more: "DICOMweb and FHIR commonly use JSON. Its curly braces and key-value pairs make it easy for programs and people to read." },
  "KIN": { full: "Key Image Note", tip: "The IHE profile for flagging significant images with a comment.", more: "A key image note lets a radiologist mark images for the clinician or for teaching, stored as its own object linked to the study." },
  "KPI": { full: "Key Performance Indicator", tip: "A measured number that shows how well a service is performing.", more: "Imaging KPIs include uptime, capacity used, broken studies, unread exams, lost studies, and report turnaround." },
  "LAN": { full: "Local Area Network", tip: "A network inside one building or campus.", more: "Modalities, PACS, and workstations in a site normally sit on a LAN with fast links, so slowness over a WAN or VPN is often a bandwidth or latency question." },
  "LDAP": { full: "Lightweight Directory Access Protocol", tip: "The protocol for looking up users and groups in a directory, on port 389.", more: "Applications use LDAP to check who a user is and what groups they belong to. Plain LDAP is not encrypted, so LDAPS is preferred." },
  "LDAPS": { full: "LDAP over TLS", tip: "The encrypted form of LDAP, on port 636.", more: "LDAPS protects the directory lookups and the credentials sent in them. It needs a valid certificate on the directory server." },
  "LOINC": { full: "Logical Observation Identifiers Names and Codes", tip: "The code set for observations and orders, including many laboratory and imaging names.", more: "LOINC gives one standard code to an observation or order so different systems can compare them. The RadLex Playbook is aligned with it for imaging procedures." },
  "MAC": { full: "Media Access Control", tip: "The hardware address of a network card, used by switches to forward frames.", more: "A switch learns which MAC address sits on which port. A MAC address is fixed to the card; an IP address can change." },
  "MB": { full: "Megabyte", tip: "About one million bytes; a single CT slice is about half of one.", more: "Study sizes are usually given in megabytes. Network speeds are given in megabits per second, which is one eighth as large for the same number." },
  "MDM": { full: "Medical Document Management", tip: "The HL7 message family for transcribed or scanned documents and their status.", more: "Document messages carry text documents and note when they were created, changed, or signed." },
  "MLLP": { full: "Minimal Lower Layer Protocol", tip: "The simple framing that carries an HL7 message over a TCP connection.", more: "MLLP wraps each message with a start byte and an end sequence so the receiver knows where it ends. There is no single required port." },
  "MPPS": { full: "Modality Performed Procedure Step", tip: "The DICOM message in which a modality reports that an exam started, finished, or was stopped.", more: "MPPS tells the RIS and PACS which images the exam produced, so a missing image or a discontinued exam can be caught." },
  "MQSA": { full: "Mammography Quality Standards Act", tip: "The United States law that regulates mammography facilities and records.", more: "It sets accreditation, personnel, equipment, and record keeping rules, including how long mammograms are kept and what must be tested before use." },
  "MRI": { full: "Magnetic Resonance Imaging", tip: "Imaging that uses a strong magnetic field and radio waves to make slices of the body.", more: "MRI produces many series per study, and the magnet is always on, so the room is controlled by safety zones." },
  "MWL": { full: "Modality Worklist", tip: "The DICOM service that gives a modality its scheduled exams and demographics.", more: "With a worklist the technologist picks the patient from a list instead of typing, which removes a large source of identity errors." },
  "NAS": { full: "Network-Attached Storage", tip: "Shared file storage reached over the network with SMB or NFS.", more: "NAS is easy to share and manage, but it is file-level storage; a database or a virtual machine usually needs block storage." },
  "NAT": { full: "Network Address Translation", tip: "A router function that maps private addresses to a public one.", more: "NAT hides internal addresses but can break connections that start from the outside, such as a destination for a DICOM move request." },
  "NFS": { full: "Network File System", tip: "The Unix and Linux protocol for sharing files over a network.", more: "NFS lets servers mount storage from another system. It is common in Linux-based archives." },
  "NIC": { full: "Network Interface Card", tip: "The hardware that connects a computer to the network.", more: "A failing NIC or a speed and duplex mismatch with the switch port causes slow image loads and dropped connections." },
  "NIST": { full: "National Institute of Standards and Technology", tip: "The United States standards body whose frameworks guide security controls.", more: "Many healthcare security programs map their controls to NIST publications." },
  "OBX": { full: "Observation Result Segment", tip: "The HL7 segment that carries one result value, such as a line of report text.", more: "A report in an ORU message is sent as a series of OBX lines. The value sits in OBX-5." },
  "OMI": { full: "Imaging Order Message", tip: "The newer HL7 message type for imaging orders.", more: "OMI carries imaging-specific order detail that the older ORM message handles only loosely." },
  "ORM": { full: "Order Message", tip: "The HL7 message that carries a new, changed, or cancelled order.", more: "An ORM flows from order entry to the RIS. The accession number created by the RIS links the order to the study." },
  "ORU": { full: "Observation Result Unsolicited", tip: "The HL7 message that carries a report or result to the record.", more: "The reporting system sends an ORU to the EMR when a report is preliminary, final, or corrected." },
  "OS": { full: "Operating System", tip: "The base software that runs a computer, such as Windows or Linux.", more: "Imaging applications are certified for particular operating system versions, so an update that the vendor has not approved can break a workstation." },
  "OSI": { full: "Open Systems Interconnection", tip: "The seven-layer model used to describe how network communication works.", more: "From top to bottom: application, presentation, session, transport, network, data link, physical. It helps place a fault, such as a cable at layer 1 or a router at layer 3." },
  "PA": { full: "Posteroanterior", tip: "A projection in which the x-ray beam enters the back of the body and exits the front.", more: "A chest radiograph is often taken PA. The projection is part of the procedure name and the image description." },
  "PACS": { full: "Picture Archiving and Communication System", tip: "The system that receives, stores, and displays medical images.", more: "Modalities send studies to PACS over DICOM; radiologists read from its workstations; its archive keeps the images for the retention period." },
  "PCI": { full: "Peripheral Component Interconnect", tip: "The expansion bus that connects cards such as graphics and network adapters.", more: "Modern servers and workstations use PCI Express for fast cards, including graphics and storage controllers." },
  "PDF": { full: "Portable Document Format", tip: "A fixed-layout document format used for reports and printouts.", more: "PDF reports are easy to view and share but are not structured data, so they cannot be searched like a database field." },
  "PDI": { full: "Portable Data for Imaging", tip: "The IHE profile for putting studies on CD, DVD, or USB in a standard layout.", more: "A PDI disc holds the DICOM files and an index, and often a viewer, so another site can open it." },
  "PDSA": { full: "Plan, Do, Study, Act", tip: "A cycle for testing a small change and learning from the result.", more: "PDSA runs a small trial, studies what happened, and decides whether to adopt, adjust, or drop the change." },
  "PET": { full: "Positron Emission Tomography", tip: "Nuclear imaging that shows how a tracer is used in the body.", more: "PET is usually combined with CT in one exam and the two image sets must stay matched in the archive." },
  "PID": { full: "Patient Identification Segment", tip: "The HL7 segment that carries the patient's identifiers and demographics.", more: "PID-3 holds the identifier list and PID-5 holds the name. A wrong value in PID causes a study to land on the wrong patient." },
  "PIPEDA": { full: "Personal Information Protection and Electronic Documents Act", tip: "The Canadian federal privacy law for private-sector organizations.", more: "PIPEDA sets consent and safeguard rules for personal information, including health data in some settings." },
  "PIR": { full: "Patient Information Reconciliation", tip: "The IHE profile that fixes demographics for patients imaged before registration is complete.", more: "PIR supports emergency cases where a study is made under a temporary identity and is later matched to the real patient." },
  "QC": { full: "Quality Control", tip: "Checks that confirm images, data, and equipment meet their standard.", more: "Technologist QC checks image count, demographics, and laterality; display QC checks calibration and uniformity." },
  "QIDO": { full: "Query based on ID for DICOM Objects", tip: "The DICOMweb service that queries studies, series, and instances over HTTP.", more: "QIDO-RS is the web equivalent of a DICOM find. It returns matching identifiers for a viewer to use." },
  "RAID": { full: "Redundant Array of Independent Disks", tip: "A way to combine drives for speed, redundancy, or both.", more: "RAID levels trade usable capacity for fault tolerance. RAID survives a failed drive, not deleted files or corruption." },
  "RAM": { full: "Random Access Memory", tip: "The working memory a computer uses for running programs and data.", more: "A workstation that opens large studies and several windows needs enough RAM, or it slows down." },
  "RBAC": { full: "Role-Based Access Control", tip: "Permissions are attached to roles, and people are given roles.", more: "RBAC makes access easier to manage and audit: changing someone's job means changing their role." },
  "RDP": { full: "Remote Desktop Protocol", tip: "The Windows protocol for controlling a computer remotely, on port 3389.", more: "RDP should be reached over a VPN and protected by strong authentication, because exposed RDP is a common attack path." },
  "REM": { full: "Radiation Exposure Monitoring", tip: "The IHE profile that sends dose records to a registry for tracking.", more: "REM collects dose data from many modalities so a facility can compare exams to reference levels." },
  "REST": { full: "Representational State Transfer", tip: "A style of web service that uses plain HTTP requests to read and change resources.", more: "FHIR and DICOMweb are REST services: a URL names the thing and the HTTP method says what to do." },
  "RFI": { full: "Request for Information", tip: "A document asking vendors to describe what they offer.", more: "An RFI is used early to learn the market and narrow the field before a formal proposal request." },
  "RFP": { full: "Request for Proposal", tip: "A formal document that states requirements and asks vendors for a full answer and price.", more: "An RFP is sent to the chosen vendors, with scoring criteria set in advance so responses can be compared fairly." },
  "RFQ": { full: "Request for Quotation", tip: "A request for a price on a clearly defined item.", more: "An RFQ fits a purchase where the requirements are already settled, such as a specific model of monitor." },
  "RIS": { full: "Radiology Information System", tip: "The system that schedules exams, tracks orders, and holds reports for radiology.", more: "The RIS creates the accession number, feeds the modality worklist, and exchanges orders and reports with the EMR." },
  "RLE": { full: "Run-Length Encoding", tip: "A lossless compression that replaces repeats with a count and a value.", more: "RLE is one of the DICOM transfer syntaxes. It reduces image size modestly and recovers every pixel exactly." },
  "ROI": { full: "Return on Investment", tip: "Net gain divided by cost, shown as a percent.", more: "ROI compares what a project returns to what it costs. A positive ROI means the benefit exceeded the cost over the period measured." },
  "RPO": { full: "Recovery Point Objective", tip: "How much recent data you can afford to lose, measured as time.", more: "An RPO of 15 minutes means a restore may lose up to 15 minutes of data. Replication frequency sets what RPO is possible." },
  "RTF": { full: "Rich Text Format", tip: "An editable document format that keeps basic formatting.", more: "RTF is common in older reporting and transcription systems for passing formatted text between programs." },
  "RTO": { full: "Recovery Time Objective", tip: "How long a service can be down before it must be back.", more: "An RTO of 4 hours means the system must be restored within 4 hours of failure. It drives how much redundancy is bought." },
  "SAML": { full: "Security Assertion Markup Language", tip: "XML tokens that let an identity provider vouch for a user to another application.", more: "SAML enables single sign-on across organizations and web applications, such as a cloud viewer trusting the hospital's directory." },
  "SAN": { full: "Storage Area Network", tip: "A dedicated network that provides shared block storage to servers.", more: "A SAN uses Fibre Channel or iSCSI. Servers see its volumes as local drives, which suits databases and virtual machines." },
  "SATA": { full: "Serial Advanced Technology Attachment", tip: "A common drive connection for lower-cost disks and solid-state drives.", more: "SATA drives are used for bulk capacity; faster storage uses other interfaces." },
  "SBAR": { full: "Situation, Background, Assessment, Recommendation", tip: "A short structure for communicating a problem clearly.", more: "SBAR keeps a report of an incident or request focused: what is happening, the history, your view, and what you want done." },
  "SCP": { full: "Service Class Provider", tip: "The DICOM role that offers a service, such as the archive that accepts a store.", more: "The provider answers a request. A PACS is the provider for storage and for query and retrieve." },
  "SCSI": { full: "Small Computer System Interface", tip: "A drive and device interface used in enterprise storage.", more: "SCSI commands also underlie iSCSI, which sends them over ordinary Ethernet." },
  "SCU": { full: "Service Class User", tip: "The DICOM role that requests a service, such as a modality sending images.", more: "The user starts the association and asks. A modality is the user when it stores to PACS." },
  "SIIM": { full: "Society for Imaging Informatics in Medicine", tip: "The professional society for imaging informatics.", more: "SIIM works with the ACR and AAPM on practice parameters and runs education and meetings for imaging informatics professionals." },
  "SIU": { full: "Scheduling Information Unsolicited", tip: "The HL7 message family that carries appointment bookings and changes.", more: "SIU messages tell the RIS and other systems when an exam is booked, moved, or cancelled." },
  "SLA": { full: "Service Level Agreement", tip: "The contract terms for response time, resolution time, and uptime.", more: "An SLA states what the vendor promises and what happens if it misses. Response is when work starts; resolution is when the problem is fixed." },
  "SMA": { full: "Support and Maintenance Agreement", tip: "The contract that covers support, fixes, and upgrades after go-live.", more: "An SMA says what is covered, for how long, at what price, and how renewal works." },
  "SMB": { full: "Server Message Block", tip: "The Windows file-sharing protocol.", more: "SMB is how a Windows machine reaches a shared folder on a server or storage device." },
  "SNMP": { full: "Simple Network Management Protocol", tip: "The protocol for polling devices and receiving alerts from them.", more: "Monitoring tools use SNMP to read the health of switches, servers, and storage. Devices send traps when a condition occurs." },
  "SNOMED": { full: "Systematized Nomenclature of Medicine", tip: "The large clinical terminology of findings, body structures, and procedures.", more: "SNOMED CT organizes clinical terms in a hierarchy so systems can group and search by meaning." },
  "SOP": { full: "Service-Object Pair", tip: "A DICOM pairing of a service with an object type, such as CT Image Storage.", more: "A SOP class names the pairing; a SOP instance is one object of that class. Each presentation context proposes a SOP class." },
  "SOW": { full: "Statement of Work", tip: "The document that states exactly what a vendor will deliver and when.", more: "A statement of work lists deliverables, milestones, responsibilities, and acceptance criteria, and is attached to the contract." },
  "SQL": { full: "Structured Query Language", tip: "The language used to query and change a relational database.", more: "SQL selects columns, filters rows, joins tables, and groups results. Reports from the RIS or PACS database are often SQL queries." },
  "SSD": { full: "Solid-State Drive", tip: "A flash storage drive with no moving parts.", more: "SSDs give far higher IOPS and lower latency than spinning disks and are used for active studies and databases." },
  "SSH": { full: "Secure Shell", tip: "The encrypted protocol for remote command-line access, on port 22.", more: "SSH administers Linux servers and network gear safely. It replaces older unencrypted tools." },
  "SSO": { full: "Single Sign-On", tip: "One login that gives access to many applications.", more: "SSO reduces password fatigue and centralizes control. Kerberos does it inside a Windows domain; SAML does it across organizations." },
  "STOW": { full: "Store Over the Web", tip: "The DICOMweb service that stores objects on a server over HTTP.", more: "STOW-RS is the web equivalent of a DICOM store." },
  "SWF": { full: "Scheduled Workflow", tip: "The IHE profile for the order-to-report flow with consistent data across systems.", more: "SWF ties together registration, ordering, scheduling, worklist, acquisition, storage, commitment, and reporting." },
  "TB": { full: "Terabyte", tip: "About one trillion bytes, or 1,000 gigabytes.", more: "Annual storage for a radiology practice is measured in terabytes. Remember that RAID, copies, and growth multiply the raw figure." },
  "TCO": { full: "Total Cost of Ownership", tip: "Everything a system costs over its life, not just the purchase price.", more: "TCO includes purchase, installation, licenses, hardware, storage, support, staff, training, and migration." },
  "TCP": { full: "Transmission Control Protocol", tip: "The reliable, connection-oriented transport used by DICOM, HL7, and HTTP.", more: "TCP numbers and acknowledges data, resending what is lost. A port and an address together identify the service." },
  "TG18": { full: "Task Group 18", tip: "The AAPM report that defined display test patterns and tolerances for diagnostic monitors.", more: "TG18 was replaced by TG270, and either set of patterns can be used for the same checks." },
  "TG270": { full: "Task Group 270", tip: "The AAPM report that replaced TG18 for display quality assurance.", more: "TG270 refreshed the tests and added a simple quality control pattern for routine checks." },
  "TLS": { full: "Transport Layer Security", tip: "The protocol that encrypts a connection and proves the server's identity.", more: "TLS protects data in transit for HTTPS, DICOM over TLS, and secure directory lookups. It depends on valid certificates." },
  "UDP": { full: "User Datagram Protocol", tip: "A fast transport with no delivery guarantee.", more: "UDP suits short, repeated messages such as name lookups, time sync, and log forwarding." },
  "UID": { full: "Unique Identifier", tip: "A globally unique dotted number that names a study, series, or object in DICOM.", more: "A UID is up to 64 characters built on a root the organization owns. UIDs must never be reused for different objects." },
  "USB": { full: "Universal Serial Bus", tip: "The connection for peripherals and portable drives.", more: "USB drives carry studies on portable media; they must be scanned and the data reconciled before import." },
  "VDI": { full: "Virtual Desktop Infrastructure", tip: "Desktops that run in the data center and are shown on a user's screen.", more: "VDI centralizes management and keeps images off the endpoint, but a reading workstation needs strong display and network performance." },
  "VLAN": { full: "Virtual Local Area Network", tip: "A logical network created on shared switches.", more: "VLANs separate traffic, such as keeping modalities apart from office computers, and a trunk carries several of them between switches." },
  "VM": { full: "Virtual Machine", tip: "A software-based server that shares physical hardware with others.", more: "Virtual machines let one host run many servers and make recovery and testing easier." },
  "VNA": { full: "Vendor Neutral Archive", tip: "An archive that stores images in standard formats behind open interfaces.", more: "A VNA serves many systems and a change of PACS does not mean a new data migration." },
  "VNC": { full: "Virtual Network Computing", tip: "A remote desktop tool that shows another computer's screen.", more: "VNC should be restricted to a VPN and protected with strong authentication." },
  "VPN": { full: "Virtual Private Network", tip: "An encrypted tunnel across an untrusted network.", more: "A VPN lets staff or a remote reader reach internal systems safely from outside." },
  "VR": { full: "Value Representation", tip: "The DICOM code that says what type of data an element holds.", more: "Explicit transfer syntaxes state the VR for each element; implicit ones leave it to the data dictionary." },
  "VUE": { full: "Virtual University Enterprises", tip: "The name of the testing company that delivers the exam.", more: "Pearson VUE runs test centers and the online proctored option. It handles scheduling, rescheduling, and the reschedule fee." },
  "WADO": { full: "Web Access to DICOM Objects", tip: "The DICOMweb service that retrieves objects or rendered images over HTTP.", more: "WADO-RS is the web equivalent of a DICOM retrieve." },
  "WAN": { full: "Wide Area Network", tip: "A network that links sites over long distances.", more: "WAN links are slower and have more delay than a LAN, which affects image retrieval between sites." },
  "WBS": { full: "Work Breakdown Structure", tip: "The project split into smaller pieces of work.", more: "A WBS breaks a project into tasks that can be estimated, assigned, and tracked." },
  "XDS": { full: "Cross-Enterprise Document Sharing", tip: "The IHE approach to publishing and finding documents across organizations.", more: "XDS uses a registry to list documents and a repository to store them. XDS-I.b applies it to imaging with a manifest pointing to the images." },
  "XML": { full: "Extensible Markup Language", tip: "A structured text format that marks data with tags.", more: "XML is used in SAML tokens, some FHIR messages, and many configuration files." },
  "iSCSI": { full: "Internet Small Computer System Interface", tip: "Block storage carried over ordinary TCP and Ethernet.", more: "iSCSI lets a server use a remote storage volume as if it were a local drive, without a dedicated Fibre Channel network." },
  "AI": { full: "Artificial Intelligence", tip: "Software that learns patterns from data, used in imaging to flag or measure findings.", more: "An AI tool is another consumer of images and producer of results. It needs a route in from PACS, a route out as a stored result, and a place in the reading worklist." },
  "CAD": { full: "Computer-Aided Detection", tip: "Software that marks areas on an image for the reader to consider, as a second look.", more: "CAD is used for breast, lung, and prostate imaging. Its marks return to PACS as a structured report or a secondary capture image." },
  "DXA": { full: "Dual-Energy X-ray Absorptiometry", tip: "The bone density scan; its measurements can flow into the report as a structured report.", more: "DXA scanners are modalities with their own measurements. A structured report lets the reporting software take the values instead of retyping them." },
  "IRB": { full: "Institutional Review Board", tip: "The committee that reviews research and says what patient data may leave the organization.", more: "Research and trial image exports need IRB approval on file before de-identified studies are released." },
  "MRN": { full: "Medical Record Number", tip: "The identifier a facility assigns to one patient across its systems.", more: "An outside study must be reconciled to the right patient and MRN before it joins the archive." },
  "BAA": { full: "Business Associate Agreement", tip: "The contract that binds a vendor to protect the patient data it handles for a hospital.", more: "Any vendor with access to protected health information, such as a cloud archive or a support company with remote access, signs a BAA before work starts. No signed BAA is a purchasing and compliance problem to fix first." },
  "BI-RADS": { full: "Breast Imaging Reporting and Data System", tip: "A fixed set of assessment categories used to end breast imaging reports.", more: "Because the categories are standard, results can be counted, tracked, and followed up. It is a reporting scheme, so the informatics job is to store the category as a structured value the tracking system can read." },
  "FDA": { full: "Food and Drug Administration", tip: "The United States agency that regulates medical devices, including imaging systems and software, and enforces MQSA.", more: "An imaging vendor's clearance status matters when you buy or change a system. A change you make to a cleared product, such as running it on unsupported hardware, can move responsibility from the vendor to your site." },
  "ePHI": { full: "electronic Protected Health Information", tip: "Protected health information kept or sent in electronic form, such as images, reports, and orders.", more: "The HIPAA security rule applies to ePHI. Storage, transmission, retention, and destruction of images all fall under it." },
  "PHI": { full: "Protected Health Information", tip: "Any information that identifies a patient and relates to their care or payment.", more: "A study with a name, a medical record number, or a date of birth in its header is PHI. De-identification removes or replaces those elements before data leaves the care setting." },
  "POCUS": { full: "Point-of-Care Ultrasound", tip: "Ultrasound done at the bedside by the treating clinician, often with a handheld probe.", more: "POCUS images are easy to lose because they may not pass through the order workflow. Capture them with an order or an encounter, and send them to the archive with the right patient identity." },
  "QMP": { full: "Qualified Medical Physicist", tip: "The physicist who tests imaging equipment and displays and signs off on their quality.", more: "A QMP usually runs the acceptance and annual tests on displays and modalities. The informatics analyst supplies access, test patterns, and records, and files the results." },
  "RHIO": { full: "Regional Health Information Organization", tip: "A regional group that lets member hospitals and clinics share patient records and images.", more: "A RHIO sets the shared rules and the exchange platform. Your site publishes documents to it, and other members query for them under the agreed consent and identity rules." },
  "RPV": { full: "Resting Point of Vergence", tip: "The distance at which the eyes naturally relax and converge when not focusing on anything.", more: "A screen placed closer than the resting point of vergence makes the eyes work harder. Setting the viewing distance to suit it is part of workstation ergonomics." },
  "SBC": { full: "Server-Based Computing", tip: "A design in which users run their sessions on a shared server and see only the screen on their device.", more: "It is the older cousin of virtual desktops. Application updates happen once on the server, and the session needs a good network link to stay responsive." },
  "SPECT": { full: "Single-Photon Emission Computed Tomography", tip: "A nuclear medicine method that builds slice images from a tracer the patient receives.", more: "SPECT studies are often paired with CT. The two parts belong to one logical exam, so keep their identities and series matched." },
  "QA": { full: "Quality Assurance", tip: "The program of planned checks, records, and sign-offs that keeps a service within its limits.", more: "A display QA program names who tests, how often, and where the records are kept." },
  "URL": { full: "Uniform Resource Locator", tip: "A web address; a launch URL carries the patient and accession to open the right study.", more: "Context launch from the EMR to the viewer is a web address with parameters. A wrong or missing identifier in it opens a blank viewer." }
};
