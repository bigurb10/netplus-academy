    const d = e.reasons.find(r => r.kind === 'domain');
    if (d) return `<span class="pill">${d.level === 'rebuild' ? 'Whole domain' : 'Core lesson'}</span>`;
    return '<span class="pill">Review</span>';
  }
  function viewTutorial() {
    if (!S.plan) {
      const sIdx = lastStarterIdx();
      return `<div class="content stack" style="gap:18px"><div><div class="eyebrow">Tutorial</div><h1>No tutorial yet</h1><p class="ink2" style="margin-top:6px">${stage() === 'starter' ? 'Take the starter test and your tutorial will be built from the results.' : 'Your last test had no misses or guesses, so there is nothing to retrain. Take a practice test to find new gaps.'}</p></div>
        <div class="row"><button class="btn primary" data-act="start-exam" data-arg="${stage() === 'starter' ? 'starter' : 'practice'}">${stage() === 'starter' ? 'Starter test' : 'Practice test'}</button>${sIdx >= 0 && stage() !== 'starter' ? `<button class="btn" data-act="path" data-arg="full:${sIdx}">Do the whole course instead</button>` : ''}<button class="btn" data-act="go" data-arg="course">Browse all lessons</button></div></div>`;
    }
    const rem = planRemaining(); const done = S.plan.lessons.length - rem.length;

    return `<div class="content stack" style="gap:18px">
      <div><div class="eyebrow">${S.plan.source === 'starter' ? (full ? 'The whole course' : 'Your tutorial') : 'Retraining tutorial'} · ${full ? 'chosen after' : 'built from'} your ${S.plan.source === 'starter' ? 'starter test' : 'test'} on ${src ? fmtDate(src.date) : ''}</div>
        <h1>${rem.length ? `${plural(rem.length, unit)} to go, about ${planMinutes(rem)} minutes` : isTestPlan ? 'Retraining complete' : full ? 'Course complete' : 'Tutorial complete'}</h1>
        <div class="row" style="margin-top:10px"><div class="meter ${rem.length ? '' : 'good'}"><i style="width:${pct(done, S.plan.lessons.length)}%"></i></div><span class="tnum muted">${done}/${S.plan.lessons.length}</span></div></div>
      ${S.plan.source === 'starter' && full ? `<div class="card soft stack" style="gap:8px"><div class="eyebrow">Your path</div><p class="ink2" style="font-size:.95rem">You chose the whole course: all ${lessons.length} lessons in order. Lessons tied to a question you missed or guessed on the starter test still open with your answer and the correct one.</p><div class="row"><button class="btn small" data-act="path" data-arg="tailored:${S.plan.examIdx}">Switch to the tailored tutorial${tailoredN ? ` (${plural(tailoredN, 'lesson')})` : ''}</button></div></div>`
      : S.plan.source === 'starter' ? `<div class="card soft stack" style="gap:8px"><div class="eyebrow">How your starter test shaped this</div><div class="row" style="gap:8px">${TESTED_IDS.map(d => `<span class="pill ${S.plan.depth[d] === 'rebuild' ? 'bad' : S.plan.depth[d] === 'core' ? 'warn' : S.plan.depth[d] === 'light' ? '' : 'good'}">${DOMAINS[d].short}: ${S.plan.depth[d] === 'rebuild' ? 'all lessons' : S.plan.depth[d] === 'core' ? 'core lessons' : S.plan.depth[d] === 'light' ? 'light review' : 'solid'}</span>`).join('')}</div><p class="ink2" style="font-size:.95rem">Lessons run in course order so each one builds on the last. Lessons tied to a question you missed or guessed open with your answer and the correct one.</p><div class="row"><button class="btn small" data-act="path" data-arg="full:${S.plan.examIdx}">Switch to the whole course (${plural(lessons.length, 'lesson')})</button></div></div>` : `<div class="card soft stack" style="gap:8px"><div class="eyebrow">Your path: ${preset === 'suggested' ? 'suggested' : preset === 'custom' ? 'your own mix' : PRESET_LABEL[preset].toLowerCase()}</div><p class="ink2" style="font-size:.95rem">Worst first. Each topic is a drill, the lesson, or the extended lesson (the lesson with its deeper explanation). A lesson opens with the exact question you missed. You can take the next test at any time.</p><div class="row"><button class="btn small" data-act="go" data-arg="results:${S.plan.examIdx}">Change your path</button></div></div>`}
      ${rem.length ? `<div class="row"><button class="btn primary lg" data-act="${openAct}" data-arg="${rem[0].id}">${done ? 'Continue' : 'Start'}: ${esc(L[rem[0].id].title)}${isTestPlan && modeOf(rem[0]) !== 'lesson' ? ` (${MODE_SHORT[modeOf(rem[0])].toLowerCase()})` : ''}</button></div>` : `<div class="ready-banner"><strong>${isTestPlan ? `All ${plural(S.plan.lessons.length, 'topic')} done.` : `All ${S.plan.lessons.length} lessons passed.`}</strong> ${stage() === 'fulltest' ? `Next: the ${EXAM_N}-question test.` : stage() === 'ready' ? 'You are cleared to book the exam.' : stage() === 'official' ? 'Next: the official-format test.' : 'Next: a practice test.'} <button class="btn primary small" data-act="${stage() === 'official' ? 'start-standard' : 'start-exam'}" data-arg="${stage() === 'fulltest' ? 'full' : 'practice'}" style="margin-left:8px">Start it</button></div>`}
      ${groups.map(g => `<div class="card stack" style="gap:8px"><div class="row spread"><h3><span class="muted" style="font-family:var(--font-mono);font-size:.85rem;margin-right:8px">${String(g.u.n).padStart(2, '0')}</span>${esc(g.u.title)}</h3></div>
        ${g.list.map(e => `<button class="option" data-act="${openAct}" data-arg="${e.id}" style="align-items:center"><span class="led lg ${planDone(e.id) ? 'green' : ledClass(e.id)}"></span><span style="flex:1"><strong>${esc(L[e.id].title)}</strong><br><span class="muted" style="font-size:.88rem">${esc(reasonLabel(e.reasons[0]))}${e.reasons.length > 1 ? ` · +${e.reasons.length - 1} more` : ''}</span></span><span class="row" style="gap:6px">${planDone(e.id) ? '<span class="pill good">DONE</span>' : `${isTestPlan ? `<span class="pill accent">${MODE_SHORT[modeOf(e)]}</span>` : ''}${reasonPill(e)}`}</span></button>`).join('')}</div>`).join('')}
      <div class="row"><button class="btn ghost" data-act="go" data-arg="course">Browse all ${lessons.length} lessons</button></div>
    </div>`;
  }

  function viewCourse() {
    const uid = S.view.arg;
    const u = uid ? units.find(x => x.id === uid) : null;
    if (u) {
      return `<div class="content stack" style="gap:18px">
        <div><div class="eyebrow">Unit ${u.n}</div><h1>${esc(u.title)}</h1><p class="ink2" style="margin-top:6px">${esc(u.blurb)}</p></div>
        <div class="stack" style="gap:8px">${u.lessons.map((l, i) => `<button class="option" data-act="lesson" data-arg="${l.id}" style="align-items:center"><span class="led lg ${ledClass(l.id)}"></span><span style="flex:1"><strong>${i + 1}. ${esc(l.title)}</strong><br><span class="muted" style="font-size:.9rem">Objective ${l.obj} · ${l.minutes} min read${l.lab ? ' · lab' : ''}${lstat(l.id).best ? ` · best checkpoint ${lstat(l.id).best}/${CHECKPOINT_N}` : ''}</span></span>${lessonLocked(l.id) ? '<span class="pill">Full course</span>' : planEntry(l.id) && !planDone(l.id) ? '<span class="pill accent">in tutorial</span>' : ''}</button>`).join('')}</div>
        <div class="row"><button class="btn ghost" data-act="go" data-arg="course">All units</button></div>
      </div>`;
    }
    return `<div class="content stack" style="gap:18px">
      <div><div class="eyebrow">All lessons</div><h1>${plural(units.length, 'unit')}, ${plural(lessons.length, 'lesson')}</h1><p class="ink2" style="margin-top:6px">Your tutorial picks from these. Any lesson can be opened at any time; each ends with a four-question checkpoint.</p></div>
      <div class="stack" style="gap:8px">${units.map(u => { const passed = u.lessons.filter(l => lstat(l.id).status === 'passed').length;
        return `<button class="option" data-act="course" data-arg="${u.id}" style="align-items:center"><span class="key">${u.n}</span><span style="flex:1"><strong>${esc(u.title)}</strong><br><span class="muted" style="font-size:.9rem">${esc(u.blurb)}</span></span><span class="tnum muted">${passed}/${u.lessons.length}</span></button>`; }).join('')}</div>
    </div>`;
  }

  // Lesson view with personalization callouts and checkpoint quiz.
  function viewLesson(id) {
    const l = L[id]; if (!l) return viewCourse();
    if (lessonLocked(id)) return `<div class="content stack" style="gap:20px"><div class="lesson-head"><div class="row" style="gap:8px"><span class="pill accent">Unit ${l.unit.n}</span><span class="pill">${DOMAINS[l.domain].short}</span>${UNTESTED.has(l.domain) ? '<span class="pill">Not on the exam</span>' : ''}<span class="pill">Objective ${l.obj}</span></div><h1>${esc(l.title)}</h1></div>${paywall('This lesson')}</div>`;
    const ls = lstat(id); if (ls.status === 'new') { ls.status = 'read'; save(); }
    const entry = planEntry(id); const rem = planRemaining(); const posInPlan = entry ? rem.findIndex(e => e.id === id) : -1;
    const nextInPlan = entry ? rem.find(e => e.id !== id) : null;
    // An extended retraining entry opens with the deeper explanation expanded, once; Hide then sticks.
    const extended = !!(entry && S.plan.source === 'test' && modeOf(entry) === 'deep');
    if (extended && !planDone(id) && deepAuto !== id) { deepAuto = id; deepOpen = id; }
    const idx = lessons.indexOf(l); const nextLesson = lessons[idx + 1]; const prevLesson = lessons[idx - 1];
    const cp = S.active && S.active.kind === 'checkpoint' && S.active.lesson === id ? S.active : null;
    const callouts = entry ? entry.reasons.filter(r => r.q).map(r => { const q = fat(r.q); if (!q) return ''; const wrong = r.kind === 'wrong' || r.kind === 'wrong-confident';
      return `<div class="callout ${wrong ? 'bad' : 'warn'}"><div class="eyebrow">${wrong ? 'You missed this' : 'You guessed this right'} on the ${r.source === 'starter' ? 'starter test' : 'last test'}${r.conf != null ? ` · confidence ${r.conf}/5` : ''}</div>
        <div class="stem">${q.pbq ? 'PBQ task: ' : ''}${esc(q.q)}</div>
        <div class="ans">${wrong ? `<span style="color:var(--bad)">You answered ${pickText(q, r, wrong) || 'nothing (skipped)'}.</span> ` : ''}<span style="color:var(--good)">Correct: ${q.pbq ? esc(q.a[0]) : `${letters[q.c]}. ${esc(q.a[q.c])}`}</span></div>
        <div class="ans ink2">${esc(q.e)}</div></div>`; }).join('') : '';
    const domainReason = entry ? entry.reasons.find(r => r.kind === 'domain') : null;
    let quiz;
    if (!cp) {
      quiz = `<div class="card lift stack"><div class="row spread"><div><div class="eyebrow">Checkpoint</div><h3>${CHECKPOINT_N} questions on this lesson</h3><p class="ink2">Pass ${CHECKPOINT_PASS} of ${CHECKPOINT_N} to complete it.${ls.best ? ` Your best so far: ${ls.best}/${CHECKPOINT_N}.` : ''}</p></div><button class="btn primary" data-act="start-checkpoint" data-arg="${id}">Start checkpoint</button></div></div>`;
    } else if (cp.i >= cp.items.length) {
      const score = cpScore(cp); const passed = score >= CHECKPOINT_PASS;
      const st = stage();
      let nextBtn = '';
      if (passed) {
        if (nextInPlan) { const nm = S.plan.source === 'test' ? modeOf(nextInPlan) : 'lesson'; nextBtn = `<button class="btn primary" data-act="finish-checkpoint" data-arg="${nextInPlan.id}">Next in ${S.plan.source === 'test' ? 'retraining' : 'tutorial'}: ${esc(L[nextInPlan.id].title)}${nm !== 'lesson' ? ` (${MODE_SHORT[nm].toLowerCase()})` : ''}</button>`; }
        else if (S.plan && !planRemaining().length) nextBtn = `<button class="btn primary" data-act="finish-checkpoint" data-arg="__test">${S.plan.source === 'test' ? 'Retraining' : 'Tutorial'} complete. Take the ${EXAM_N}-question ${st === 'fulltest' ? 'test' : 'practice test'}</button>`;
        else if (nextLesson) nextBtn = `<button class="btn primary" data-act="finish-checkpoint" data-arg="${nextLesson.id}">Next lesson: ${esc(nextLesson.title)}</button>`;
      }
      quiz = `<div class="card lift stack"><div class="row spread"><div><div class="eyebrow">Checkpoint result</div><h3>${score} of ${CHECKPOINT_N} correct. ${passed ? 'Lesson complete.' : 'Review and try again.'}</h3></div><span class="pill ${passed ? 'good' : 'warn'}">${passed ? 'PASSED' : 'RETRY'}</span></div>
        <div class="row">${nextBtn}${!passed ? `<button class="btn primary" data-act="start-checkpoint" data-arg="${id}">Try a fresh checkpoint</button>` : ''}<button class="btn ghost" data-act="finish-checkpoint" data-arg="__stay">Stay here</button></div></div>`;
    } else {
      quiz = `<div class="card lift">${questionCard(cp, { showNumber: true, immediate: true })}</div>`;
    }
    return `<div class="content stack" style="gap:20px">
      <div class="lesson-head">
        <div class="row" style="gap:8px"><span class="pill accent">Unit ${l.unit.n}</span><span class="pill">${DOMAINS[l.domain].short}</span>${UNTESTED.has(l.domain) ? '<span class="pill">Not on the exam</span>' : ''}<span class="pill">Objective ${l.obj}</span>${extended ? '<span class="pill accent">Extended</span>' : ''}<span class="muted" style="font-size:.9rem">${l.minutes} min read</span>${entry && posInPlan >= 0 ? `<span class="muted" style="font-size:.9rem">· ${S.plan.source === 'test' ? 'retraining topic' : 'tutorial lesson'} ${S.plan.lessons.length - rem.length + posInPlan + 1} of ${S.plan.lessons.length}</span>` : ''}<span style="flex:1"></span><button class="btn small ghost fb-btn" data-act="fb-open" data-kind="lesson" data-arg="${id}" title="Send feedback on this lesson">&#9873; Feedback</button></div>
        <h1>${esc(l.title)}</h1>
        ${domainReason && !callouts ? `<p class="ink2">${esc(lessonWhy(domainReason))}</p>` : ''}
        ${extended && !planDone(id) ? `<p class="ink2">Extended lesson: read the lesson and the deeper explanation below, then take the checkpoint.</p>` : ''}
      </div>
      ${callouts}
      <article class="lesson-body">${renderBody(l.body)}</article>
      <div class="hook"><span class="eyebrow">Remember</span><div>${inline(l.hook)}</div></div>
      ${l.lab ? labCard(l) : ''}
      ${deepSection(id)}
      ${quiz}
      ${ratingRow(id)}
      <div class="row" style="justify-content:flex-end"><button class="btn small ghost fb-btn" data-act="fb-open" data-kind="lesson" data-arg="${id}">&#9873; Something wrong or unclear in this lesson? Send feedback</button></div>
      <div class="row spread">
        ${prevLesson ? `<button class="btn ghost" data-act="lesson" data-arg="${prevLesson.id}">← ${esc(prevLesson.title)}</button>` : '<span></span>'}
        ${nextLesson ? `<button class="btn ghost" data-act="lesson" data-arg="${nextLesson.id}">${esc(nextLesson.title)} →</button>` : ''}
      </div>
    </div>`;
  }

  // Lesson rating: ten chips, 1 confusing to 10 great. The same chips appear on the lesson page and in the lesson feedback form.
  function ratingChips(id, cur) { return `<div class="rate-row" role="group" aria-label="Rate this lesson from 1 to 10">${Array.from({ length: 10 }, (_, i) => i + 1).map(n => `<button class="chip rate" data-act="rate" data-arg="${n}" data-lesson="${id}" aria-pressed="${cur === n ? 'true' : 'false'}">${n}</button>`).join('')}</div>`; }
  function ratingRow(id) {
    const r = S.ratings && S.ratings[id];
    return `<div class="card soft stack rate-card" style="gap:8px"><div><div class="eyebrow">Rate this lesson</div><span class="ink2" style="font-size:.95rem">1 is confusing, 10 is great.${r ? ` You rated it ${r.r}/10.` : ' Your rating helps refine the course.'}</span></div>${ratingChips(id, r ? r.r : null)}</div>`;
  }

  // The lab card: intro, kit, manual excerpt, the instrument panel (mounted after paint), and
  // the task sheet. Done when every task is right; a Redo clears it.
  let instUiMap = {}; const instUi = id => instUiMap[id] || (instUiMap[id] = {});
  function labCard(l) {
    const lab = LABS[l.lab]; const ls = labStat(lab.id); const n = lab.tasks.length;
    const okN = lab.tasks.filter(t => ls.ok[t.id] === true).length; const done = !!ls.done;
    const kit = Array.isArray(lab.kit) && lab.kit.length ? `<div class="lab-kit"><div class="eyebrow">Kit</div><ul>${lab.kit.map(k => `<li>${inline(k)}</li>`).join('')}</ul></div>` : '';
    const manual = lab.manual ? `<div class="callout accent lab-manual"><div class="eyebrow">From the service manual</div><div class="lesson-body">${renderBody(lab.manual)}</div></div>` : '';
    // The body of the lab: everything but the header row and the Redo button. Once the lab is
    // done the card collapses to a green summary (spec section 3) and this folds away behind it.
    const body = `<div class="lesson-body">${renderBody(lab.intro || '')}</div>
      ${kit}${manual}
      <div class="instrument" id="instrument" data-lab="${esc(lab.id)}"></div>
      <div class="lab-tasks stack">${lab.tasks.map((t, i) => labTask(lab, t, i, ls)).join('')}</div>`;
    return `<section class="card lift stack lab ${done ? 'done' : ''}" id="lab">
      <div class="row spread"><div><div class="eyebrow">Lab · ${kit ? 'your kit or the virtual instrument' : 'virtual instrument'}</div><h3>${esc(lab.title)}</h3></div>${done ? '<span class="pill good">LAB DONE</span>' : `<span class="pill">${okN} of ${n} tasks</span>`}</div>
      ${done ? `<details class="lab-fold"><summary>Show the lab again</summary>${body}</details>` : body}
      ${done ? `<div class="row"><button class="btn ghost small" data-act="lab-redo" data-arg="${esc(lab.id)}">Redo this lab</button></div>` : ''}
    </section>`;
  }
  function labTask(lab, t, i, ls) {
    const ok = ls.ok[t.id]; const v = ls.values[t.id]; const why = lab.why && lab.why[t.id];
    const dis = ok === true ? 'disabled' : '';
    const result = ok === true ? `<div class="feedback good"><div class="verdict">Correct</div></div>` : ok === false ? `<div class="feedback bad"><div class="verdict">Not right yet.</div><div>${esc(why || '')}</div></div>` : '';
    let input;
    if (t.kind === 'reading') input = `<div class="row" style="gap:8px;flex-wrap:wrap"><input type="number" step="any" class="lab-in" id="lab-${esc(t.id)}" data-task="${esc(t.id)}" value="${v != null ? esc(v) : ''}" ${dis}><span class="muted">${esc(t.unit || '')}</span>${t.measure ? `<button class="btn small ghost" data-act="lab-use" data-arg="${esc(t.id)}" ${dis}>Record the reading</button>` : ''}<button class="btn small primary" data-act="lab-check" data-arg="${esc(t.id)}" ${dis}>Check</button></div>`;
    else if (t.kind === 'verdict') input = `<div class="row" style="gap:8px">${['pass', 'fail'].map(o => `<button class="chip" data-act="lab-answer" data-arg="${esc(t.id)}:${o}" aria-pressed="${v === o}" ${dis}>${o === 'pass' ? 'Pass' : 'Fail'}</button>`).join('')}</div>`;
    else input = `<div class="options">${(t.options || []).map((o, k) => `<button class="option" data-act="lab-answer" data-arg="${esc(t.id)}:${k}" aria-pressed="${v === k}" ${dis}><span class="key">${letters[k] || k + 1}</span><span>${esc(o)}</span></button>`).join('')}</div>`;
    return `<div class="lab-task ${ok === true ? 'ok' : ''}" data-task="${esc(t.id)}"><div class="q-stem"><span class="muted tnum">${i + 1}.</span> ${inline(t.prompt)}</div>${input}${result}</div>`;
  }
  // Mount the instrument panel into the lab card after each paint. The module is optional.
  function mountInstrument() {
    const el = $('#instrument'); if (!el) return;
    const lab = LABS[el.dataset.lab]; const ins = window.FRAInstruments;
    if (!lab || !ins || typeof ins.render !== 'function') { el.innerHTML = '<p class="muted">This lab is unavailable: the instrument module did not load. The tasks below still work with your own kit.</p>'; return; }
    try { ins.render(el, lab, instUi(lab.id), { toast }); } catch (err) { console.warn('instrument failed to render', err); el.innerHTML = '<p class="muted">This lab is unavailable.</p>'; }
  }

  // ---------- PBQs (FRA.pbqs; spec 2026-10-14-comptia-pbqs-design) ----------
  // Display order and in-progress answers live here per PBQ so re-renders keep them; the saved
  // state (S.pbqs) holds only scores and the done flag.
  let pbqUiMap = {}; const pbqUi = id => pbqUiMap[id] || (pbqUiMap[id] = { order: {}, answers: {}, sel: {}, checked: false });
  const PBQ_HELPERS = { esc, inline };
  function pbqScore(pbq, answers) { const scores = {}; pbq.tasks.forEach(t => { scores[t.id] = FRAPbq.grade(t, answers[t.id]).score; }); const right = pbq.tasks.filter(t => scores[t.id] === 1).length; return { scores, frac: pbq.tasks.length ? right / pbq.tasks.length : 0 }; }
  function viewPbq(arg) {
    if (!pbqIds.length) return viewHome();
    if (arg && PBQS[arg]) return viewPbqOne(PBQS[arg]);
    const rows = pbqIds.map(id => { const p = PBQS[id]; const st = S.pbqs[id]; return `<button class="option pbq-row" data-act="pbq-open" data-arg="${esc(id)}"><span class="key">${st && st.done ? 'ok' : (p.tasks || []).length}</span><span><strong>${esc(p.title)}</strong><br><span class="ink2">${esc(DOMAINS[p.domain] ? DOMAINS[p.domain].short : '')} &middot; ${plural((p.tasks || []).length, 'task')}${st && st.at ? ` &middot; best ${Math.round((st.best || 0) * 100)}%` : ''}</span></span></button>`; }).join('');
    return `<div class="content stack" style="gap:18px">
      <div><div class="eyebrow">PBQs</div><h1>Performance-based questions</h1><p class="ink2" style="margin-top:6px">The real exam opens with a handful of these: drag items into order, match terms, pick lines in a log, fill a configuration, type a command. Each one here grades every task and explains it. ${(T.pbqInTest || 0) ? `Your official-format test opens with ${T.pbqInTest} of them.` : ''}</p></div>
      <div class="card stack"><div class="row spread"><h3>${plural(pbqIds.length, 'PBQ')}</h3><span class="muted" style="font-size:.9rem">${pbqsDoneCount()} done</span></div><div class="options">${rows}</div></div>
    </div>`;
  }
  // The scenario card: the same markup on the PBQs tab and inside a test.
  function pbqScenarioHtml(p) {
    const sc = p.scenario || {};
    return `<div class="card lift stack pbq-scenario"><div class="eyebrow">${esc(DOMAINS[p.domain] ? DOMAINS[p.domain].short : 'Scenario')}</div><h2>${esc(p.title)}</h2><div class="lesson-body">${renderBody(sc.text || '')}</div>${sc.svg ? `<div class="pbq-fig">${sc.svg}</div>` : ''}${sc.log ? `<pre class="pbq-log">${esc(sc.log)}</pre>` : ''}</div>`;
  }
  function viewPbqOne(p) {
    const ui = pbqUi(p.id); const st = S.pbqs[p.id];
    const scenario = pbqScenarioHtml(p);
    const summary = ui.checked ? (() => { const { frac } = pbqScore(p, ui.answers); return `<div class="feedback ${frac === 1 ? 'good' : 'bad'}"><div class="verdict">${frac === 1 ? 'Every task right.' : `${Math.round(frac * 100)}% of tasks fully right.`}</div><div class="muted">Best so far: ${Math.round(((st && st.best) || 0) * 100)}%. Read each why, then retry or open the lesson.</div></div>`; })() : '';
    const btns = ui.checked
      ? `<button class="btn primary" data-act="pbq-retry" data-arg="${esc(p.id)}">Retry</button><button class="btn ghost" data-act="lesson" data-arg="${esc(p.lesson)}">Review the lesson</button>${p.also && L[p.also] ? `<button class="btn ghost" data-act="lesson" data-arg="${esc(p.also)}">See also: ${esc(L[p.also].title)}</button>` : ''}<button class="btn ghost" data-act="go" data-arg="pbq">All PBQs</button>`
      : `<button class="btn primary" data-act="pbq-check" data-arg="${esc(p.id)}">Check my answers</button><button class="btn ghost" data-act="go" data-arg="pbq">All PBQs</button>`;
    return `<div class="content stack" style="gap:18px">${scenario}<div class="card stack pbq-tasks" id="pbq" data-pbq-id="${esc(p.id)}"></div>${summary}<div class="row" style="gap:8px;flex-wrap:wrap">${btns}</div></div>`;
  }
  // Mount the task renderers into #pbq after each paint, like mountInstrument. data-pbq-ui names the
  // ui the mount uses, so the same PBQ answered inside a test keeps its own working answers.
  function mountPbq() {
    const el = $('#pbq'); if (!el) return; const p = PBQS[el.dataset.pbqId]; if (!p || !window.FRAPbq) return;
    try { FRAPbq.render(el, p, pbqUi(el.dataset.pbqUi || p.id), PBQ_HELPERS); } catch (err) { console.warn('PBQ failed to render', err); el.innerHTML = '<p class="muted">This PBQ is unavailable.</p>'; }
  }
  function checkPbq(p) {
    const ui = pbqUi(p.id); const el = $('#pbq'); if (!el) return;
    ui.answers = FRAPbq.collect(el, p, ui); ui.checked = true;
    const { scores, frac } = pbqScore(p, ui.answers); const ps = pbqStat(p.id);
    ps.tasks = scores; ps.best = Math.max(ps.best || 0, frac); ps.at = Date.now();
    const wasDone = ps.done; ps.done = ps.done || frac === 1;
    // Check writes S.pbqs only; it records no lesson attempt. A per-task recordAnswer loop here
    // would let one Check master the PBQ's lesson in one shot (a streak of 3 at confidence 4), the
    // same way labs record nothing. The official-format test (Task 5) is where a PBQ task counts
    // as a question; pbqPseudoQ stays defined below for that.
    save(); if (!wasDone && ps.done) { if (window.FRASync) FRASync.pushNow(); toast('PBQ done'); }
  }
  // A PBQ task as an inline question record: results pages, retraining, and the strength chart read
  // review items through fat(), so a task travels as a generated-style question tied to the PBQ's lesson.
  function pbqPseudoQ(p, t) { return { gen: true, pbq: p.id, task: t.id, id: `pbq:${p.id}:${t.id}`, t: p.lesson, q: t.prompt, a: [FRAPbq.expectedText(t)], c: 0, e: (p.why || {})[t.id] || '' }; }

  // Shared question card. sess: { items, i, answers, sel, conf, submitted, noConf }
  function questionCard(sess, opts) {
    const q = fat(sess.items[sess.i]); const n = sess.items.length;
    const submitted = !!sess.submitted; const sel = sess.sel; const conf = sess.conf; const hasConf = !sess.noConf;
    const l = L[q.t];
    const optionsHtml = q.a.map((opt, k) => {
      let cls = 'option'; const pressed = sel === k ? 'true' : 'false';
      if (submitted && opts.immediate) { if (k === q.c) cls += ' correct'; else if (k === sel) cls += ' wrong'; }
      return `<button class="${cls}" data-act="opt" data-arg="${k}" aria-pressed="${pressed}" ${submitted ? 'disabled' : ''}><span class="key">${letters[k]}</span><span>${esc(opt)}</span></button>`;
    }).join('');
    const confHtml = hasConf ? `<div class="confidence"><span class="eyebrow">How sure are you?</span>${CONF.map(([v, name]) => `<button class="chip" data-act="conf" data-arg="${v}" aria-pressed="${conf === v ? 'true' : 'false'}" ${submitted ? 'disabled' : ''}><span class="k">${v}</span>${name}</button>`).join('')}</div>` : '';
    let feedback = '';
    if (submitted && opts.immediate) {
      const correct = sel === q.c;
      feedback = `<div class="feedback ${correct ? 'good' : 'bad'}"><div class="verdict">${correct ? (hasConf && conf <= 2 ? 'Correct, but you were not sure, so it does not count. Read why.' : 'Correct') : `Incorrect. The answer is ${letters[q.c]}.`}</div><div>${esc(q.e)}</div>${l ? `<div class="muted" style="font-size:.9rem">Topic: ${esc(l.title)} (Unit ${l.unit.n})</div>` : ''}</div>`;

  // plan a later test replaced. The learner can retrain from it instead.
  function olderTestCard(idx) {
    const later = !!(S.plan && S.plan.source === 'test' && S.plan.examIdx > idx);
    const replacing = !!(S.plan && !later && planRemaining().length);
    const note = later ? 'Your retraining now comes from a later test.' : replacing ? 'Retraining from this test would replace the tutorial you are on.' : 'Nothing is being retrained from this test yet.';
    return `<div class="card soft stack" style="gap:8px"><div class="eyebrow">Retraining</div><p class="ink2">${note} The misses below are still explained.</p><div class="row"><button class="btn small" data-act="retrain-adopt" data-arg="${idx}">Retrain from this test instead</button></div></div>`;
  }
  function viewResults(arg) {
    const idx = parseInt(String(arg).replace('results:', ''), 10); const e = S.exams[idx];
    if (!e) return viewTestsHub();
    const isStarter = e.kind === 'starter';
    const passed = e.pct >= barFor(e); const ringColor = isStarter ? 'var(--accent)' : passed ? 'var(--good)' : e.pct >= 70 ? 'var(--warn)' : 'var(--bad)';
    const misses = e.review.filter(r => !r.correct); const guesses = e.review.filter(r => r.correct && r.conf <= 2);
    const confident = misses.filter(r => r.conf >= 4).length;
    const mins = Math.max(1, Math.round(e.seconds / 60));
    const planIsFromThis = S.plan && S.plan.examIdx === idx; const rem = planIsFromThis ? planRemaining() : [];
    let headline, planCard;
    if (isStarter) {
      headline = e.pct >= 90 && !guesses.length ? 'Strong start.' : e.pct >= 60 ? 'A solid base with clear gaps.' : 'Starting from the ground up, which is fine.';
      const latest = idx === lastStarterIdx(); const chosen = S.path && S.path.examIdx === idx ? S.path.scope : null;
      if (latest && !chosen) {
        // The path choice: the tailored tutorial or the whole course, whatever the score.
        const tailored = planFromStarter(e, idx).lessons;
        planCard = `<div class="card lift stack path-choice"><div><div class="eyebrow">Choose your path</div><h3>A tailored tutorial, or the whole course?</h3><p class="ink2">Pick either one, whatever your score. Every lesson ends with a checkpoint, and the ${EXAM_N}-question test comes after the lessons. You can switch later from the Tutorial tab.</p></div>
          <div class="paths">
            <button class="option path" data-act="path" data-arg="tailored:${idx}"><span class="key">1</span><span><strong>Tailored tutorial</strong><br><span class="ink2">${tailored.length ? `${plural(tailored.length, 'lesson')}, about ${planMinutes(tailored)} minutes, chosen from these results. Missed ${ALL_WORD} questions in a domain: every lesson in it. Missed one, or guessed: its core lessons plus the exact topic.` : 'Nothing to teach from these results, so you go straight to the test.'}</span></span></button>
            <button class="option path" data-act="path" data-arg="full:${idx}"><span class="key">2</span><span><strong>The whole course</strong><br><span class="ink2">All ${plural(lessons.length, 'lesson')} in order, about ${fullCourseMinutes()} minutes. Lessons tied to a question you missed or guessed still open with your answer and the correct one.</span></span></button>
          </div></div>
          ${window.FRAAuth && !FRAAuth.isSignedIn() ? `<p class="muted">Studying on more than one device? <button class="btn ghost small" data-act="sign-in">Save my progress</button></p>` : ''}`;
      } else if (planIsFromThis && S.plan.scope === 'full') {
        planCard = `<div class="card lift stack"><div class="row spread"><div><div class="eyebrow">Your path: the whole course</div><h3>${plural(S.plan.lessons.length, 'lesson')} in order, about ${planMinutes(S.plan.lessons)} minutes</h3></div><button class="btn primary" data-act="lesson" data-arg="${rem.length ? rem[0].id : S.plan.lessons[0].id}">Start the course</button></div>
        <p class="ink2" style="font-size:.95rem">Lessons tied to a question you missed or guessed open with your answer and the correct one.</p>
        <div class="row"><button class="btn ghost small" data-act="go" data-arg="tutorial">See the full plan</button>${latest ? `<button class="btn ghost small" data-act="path" data-arg="tailored:${idx}">Switch to the tailored tutorial</button>` : ''}</div></div>`;
      } else {
        planCard = planIsFromThis ? `<div class="card lift stack"><div class="row spread"><div><div class="eyebrow">Your tutorial</div><h3>${plural(S.plan.lessons.length, 'lesson')}, about ${planMinutes(S.plan.lessons)} minutes</h3></div><button class="btn primary" data-act="lesson" data-arg="${rem.length ? rem[0].id : S.plan.lessons[0].id}">Start the tutorial</button></div>
        <div class="row" style="gap:8px">${TESTED_IDS.map(d => `<span class="pill ${S.plan.depth[d] === 'rebuild' ? 'bad' : S.plan.depth[d] === 'core' ? 'warn' : S.plan.depth[d] === 'light' ? '' : 'good'}">${DOMAINS[d].short}: ${S.plan.depth[d] === 'rebuild' ? 'all lessons' : S.plan.depth[d] === 'core' ? 'core lessons' : S.plan.depth[d] === 'light' ? 'light review' : 'solid'}</span>`).join('')}</div>
        <p class="ink2" style="font-size:.95rem">Missed ${ALL_WORD} questions in a domain: you get every lesson in that domain. Missed one, or guessed: you get that domain's core lessons plus the exact topic. Confident and correct on ${ALL_WORD}: nothing from that domain.</p>
        <div class="row"><button class="btn ghost small" data-act="go" data-arg="tutorial">See the full plan</button>${latest ? `<button class="btn ghost small" data-act="path" data-arg="full:${idx}">Switch to the whole course</button>` : ''}</div></div>`
        : `<div class="ready-banner"><strong>Every answer right and confident.</strong> There is nothing to teach yet, so the ${EXAM_N}-question test is next. <button class="btn primary small" data-act="start-exam" data-arg="full" style="margin-left:8px">Start it</button>${latest ? `<button class="btn small" data-act="path" data-arg="full:${idx}" style="margin-left:8px">Do the whole course instead</button>` : ''}</div>`;
      }
    } else {
      headline = passed ? (S.official && S.official.examIdx === idx ? 'Official-format test passed. You are cleared to book the exam.' : 'Passing score.') : e.pct >= 70 ? 'Close. Not there yet.' : 'Below the line. Now you know what to retrain.';
      planCard = planIsFromThis ? retrainCard(idx)
        : e.kind === 'custom' && misses.length && S.plan && S.plan.source === 'test' && planRemaining().length ? planInProgressCard(idx)
        : e.kind !== 'custom' && misses.length ? olderTestCard(idx)
        : e.kind === 'custom' ? `<div class="ready-banner"><strong>${misses.length || guesses.length ? 'Your misses and guesses now feed your weak-topic list.' : 'No misses and no guesses.'}</strong> Custom tests do not count toward qualifying. <button class="btn primary small" data-act="go" data-arg="exam" style="margin-left:8px">Set up another</button></div>`
        : `<div class="ready-banner"><strong>${e.noConf ? 'No misses.' : 'No misses and no guesses.'}</strong> ${stage() === 'ready' ? 'You are cleared to book the exam.' : stage() === 'official' ? 'You have qualified; the official-format test is the final step.' : 'Nothing to retrain. Keep your last five strong with another practice test.'} ${stage() === 'official' ? `<button class="btn primary small" data-act="start-standard" style="margin-left:8px">Official-format test</button>` : stage() !== 'ready' ? `<button class="btn primary small" data-act="start-exam" data-arg="practice" style="margin-left:8px">Practice test</button>` : ''}</div>`;
    }
    // Each miss: what you picked, what was right, and why -- the bank's explanation says why the
    // correct answer is correct and, for most questions, why the others are not. The lesson link
    // is optional; the learner can read the review and go straight to the next test.
    // A missed PBQ task reads the same way: the prompt, what the learner built, the expected answer,
    // the why, and the PBQ's lesson. Its answer has no option letter, so pickText is skipped.
    const reviewItem = (r, wrong) => { const q = fat(r.q); if (!q) return '';
      const head = `<div class="row" style="gap:6px;margin-bottom:4px"><span class="pill ${wrong ? (e.noConf || r.conf >= 4 ? 'bad' : 'warn') : 'warn'}">${e.noConf ? (wrong ? 'Wrong' : 'Right') : KIND_LABEL[kindOf(r.correct, r.conf)]}</span><span class="pill">${DOMAINS[L[q.t].domain].short}</span></div>`;
      const lesson = `<div class="ans muted row" style="gap:6px;flex-wrap:wrap">Lesson: ${esc(L[q.t].title)} · <button class="btn small ghost" data-act="lesson" data-arg="${q.t}">Review the lesson</button>${fbBtn(q, e.kind + '-results')}</div>`;
      if (q.pbq) return `<div class="review-item">${head}<div class="stem">PBQ task: ${inline(q.q)}</div>${wrong ? `<div class="ans"><span class="ink2">Your answer:</span> <span style="color:var(--bad)">${esc(r.pick == null ? 'nothing' : r.pick)}</span></div>` : ''}<div class="ans"><span class="ink2">Correct answer:</span> <span style="color:var(--good)">${esc(q.a[0])}</span></div><div class="ans"><span class="ink2">Why:</span> ${inline(q.e)}</div>${lesson}</div>`;
      return `<div class="review-item">${head}<div class="stem">${esc(q.q)}</div>${wrong ? `<div class="ans"><span class="ink2">Your answer:</span> <span style="color:var(--bad)">${pickText(q, r, wrong) || 'skipped'}</span></div>` : ''}<div class="ans"><span class="ink2">Correct answer:</span> <span style="color:var(--good)">${letters[q.c]}. ${esc(q.a[q.c])}</span></div><div class="ans"><span class="ink2">Why:</span> ${esc(q.e)}</div>${lesson}</div>`; };
    // The next step, offered at the top and the bottom so the review never traps the learner.
    const nk = nextFlowKind();
    const nextBtn = isStarter ? '' : testsLocked('full') ? `<button class="btn primary" data-act="upgrade">Unlock the full course</button>`
      : e.kind === 'custom' ? `<button class="btn primary" data-act="go" data-arg="exam">Set up another test</button>`
      : stage() === 'official' ? `<button class="btn primary" data-act="start-standard">Take the official-format test</button>`
      : stage() === 'ready' ? `<button class="btn primary" data-act="start-exam" data-arg="practice">One more practice test</button>`
      : `<button class="btn primary" data-act="start-exam" data-arg="${nk}">Next ${nk === 'full' ? `${EXAM_N}-question test` : 'practice test'}</button>`;
    return `<div class="content stack" style="gap:18px">
      <div class="row spread" style="align-items:flex-end;gap:12px;flex-wrap:wrap"><div><div class="eyebrow">${testLabel(e)} · ${fmtDate(e.date)} · ${mins} min${e.minutes ? ` of ${e.minutes}` : ''}</div><h1>${headline}</h1></div>${nextBtn}</div>
      <div class="card lift"><div class="score-hero"><div class="score-ring" style="--pct:${e.pct};--ring-color:${ringColor}"><div>${e.pct}%</div></div>
        <div class="stack" style="gap:8px"><div><strong>${e.score} of ${e.total} correct</strong>${e.noConf ? '' : ` (${e.score - guesses.length} sure, ${guesses.length} guessed)`}, ${misses.length} wrong. ${isStarter ? 'The starter test measures where to begin, not whether you would pass.' : `${esc(course.realExamNote)} Practice tests here pass at ${PASS_PCT}%; the official-format test uses the real exam's passing score, ${OFFICIAL_PCT}%.`}</div>
        <div class="row" style="gap:8px">${e.noConf ? '' : `<span class="pill ${confident ? 'bad' : 'good'}">${confident} confident miss${confident === 1 ? '' : 'es'}</span><span class="pill ${guesses.length ? 'warn' : 'good'}">${guesses.length} guess${guesses.length === 1 ? '' : 'es'}</span>`}${!isStarter ? (e.kind === 'custom' ? '<span class="pill">not counted toward qualifying</span>' : `<span class="pill ${S.passes >= PASSES_NEEDED ? 'good' : ''}">${S.passes} of your last ${PASS_WINDOW} passed</span>`) : ''}</div>
        <div class="muted" style="font-size:.9rem">${e.noConf ? 'No confidence ratings on this test, like the real exam. Every wrong answer is explained below and goes into your retraining.' : 'A confident miss is wrong at confidence 4 or 5. A guess is right at confidence 1 or 2. Both go into your tutorial.'}</div></div></div></div>
      ${isStarter ? `<div class="card stack"><h3>By domain</h3><div class="bars">${TESTED_IDS.map(d => `<div class="bar-row"><span class="label">${DOMAINS[d].short}</span><div class="track"><i style="width:${pct(e.byDomain[d].c, e.byDomain[d].t)}%"></i></div><span class="value">${e.byDomain[d].c}/${e.byDomain[d].t}</span></div>`).join('')}</div></div>` : strengthCard(idx)}
      ${planCard}
      ${misses.length ? `<div class="card"><h3 style="margin-bottom:6px">Wrong answers explained (${misses.length})</h3>${misses.map(r => reviewItem(r, true)).join('')}</div>` : ''}
      ${guesses.length ? `<div class="card"><h3 style="margin-bottom:6px">Right, but you were not sure (${guesses.length})</h3><p class="muted" style="font-size:.9rem;margin-bottom:6px">These count as gaps. Read why the answer is right so it stops being a guess.</p>${guesses.map(r => reviewItem(r, false)).join('')}</div>` : ''}
      <div class="row">${nextBtn}<button class="btn ghost" data-act="go" data-arg="home">Home</button><button class="btn ghost" data-act="go" data-arg="exam">All tests</button></div>
    </div>`;
  }

  // ---------- drills (optional extra practice on weak topics) ----------
  function viewTrain() {
    const tr = S.active && S.active.kind === 'train' ? S.active : null;
    if (!entitled()) return `<div class="content stack" style="gap:18px"><div><div class="eyebrow">Drills</div><h1>Extra practice on weak topics</h1></div>${paywall('Drilling')}</div>`;
    if (!tr) {
      const weak = weakTopics();
      return `<div class="content stack" style="gap:18px">
        <div><div class="eyebrow">Drills</div><h1>Extra practice on weak topics</h1><p class="ink2" style="margin-top:6px">Drills are optional and run alongside your tutorial. A session covers up to three of your weakest topics: a quick refresher, then questions with instant feedback. Miss one and it comes back reworded a few questions later. A topic is done after three confident correct answers in a row.</p></div>
        ${weak.length ? `<div class="card lift stack"><div class="row spread"><div><h3>${plural(weak.length, 'topic')} need work</h3><p class="ink2">About 15 minutes per session.</p></div><button class="btn primary" data-act="start-train">Start session</button></div><div class="topic-list">${weak.map(t => topicRow(t)).join('')}</div></div>`
          : `<div class="card lift stack"><h3>No weak topics on record</h3><p class="ink2">${S.exams.length ? 'Everything you have been tested on is mastered.' : 'Take the starter test first and the weak-topic list will build itself.'}</p><div class="row"><button class="btn" data-act="pick-train">Drill a topic anyway</button></div></div>`}
      </div>`;
    }
    if (tr.phase === 'pick') {
      return `<div class="content stack" style="gap:18px"><div><div class="eyebrow">Drills</div><h1>Pick a topic to drill</h1></div>
        <div class="stack" style="gap:6px">${lessons.map(l => `<button class="option" data-act="train-topic" data-arg="${l.id}" style="align-items:center"><span class="led ${ledClass(l.id)}"></span><span style="flex:1">${esc(l.title)} <span class="muted">· Unit ${l.unit.n}</span></span><span class="pill">${topicPriority(l.id)} pts</span></button>`).join('')}</div>
        <button class="btn ghost" data-act="abandon-train">Cancel</button></div>`;
    }
    if (tr.ti >= tr.topics.length) {
      const done = tr.log; const c = done.filter(x => x.correct).length; const still = weakTopics();
      const fromPlan = !!tr.fromPlan; const topic0 = tr.topics[0];
      S.active = null; save();
      if (fromPlan && L[topic0]) {
        // A retraining drill: done means three in a row (the entry is complete); otherwise ten
        // questions went by without one, and the learner can drill again or take the lesson instead.
        const finished = planDone(topic0); const next = planRemaining()[0]; const st = stage();
        const nextBtn = next ? `<button class="btn primary" data-act="retrain-open" data-arg="${next.id}">Next: ${esc(L[next.id].title)}${modeOf(next) !== 'lesson' ? ` (${MODE_SHORT[modeOf(next)].toLowerCase()})` : ''}</button>`
          : st === 'official' ? `<button class="btn primary" data-act="start-standard">Retraining complete. Take the official-format test</button>`
          : st === 'ready' ? `<button class="btn primary" data-act="go" data-arg="ready">Retraining complete. See your readiness report</button>`
          : `<button class="btn primary" data-act="start-exam" data-arg="${nextFlowKind()}">Retraining complete. Take the next test</button>`;
        const none = !finished && !done.length;   // a topic with no drill questions at all
        return `<div class="content stack" style="gap:18px"><div><div class="eyebrow">Drill</div><h1>${finished ? 'Topic done.' : none ? 'No questions to drill.' : 'Still shaky.'}${none ? '' : ` ${c} of ${done.length} correct`}</h1><p class="ink2" style="margin-top:6px">${finished ? `Three in a row on ${esc(L[topic0].title)}. That counts as retrained.` : none ? `${esc(L[topic0].title)} has no drill questions yet. Take the lesson instead.` : `Ten questions on ${esc(L[topic0].title)} without three in a row. Drill it again, or switch this topic to the lesson.`}</p></div>
          <div class="row" style="flex-wrap:wrap">${finished ? nextBtn : `${none ? '' : `<button class="btn primary" data-act="retrain-open" data-arg="${topic0}">Drill it again</button>`}<button class="btn ${none ? 'primary' : ''}" data-act="retrain-switch" data-arg="${topic0}">Switch this topic to the lesson</button>`}<button class="btn ghost" data-act="go" data-arg="tutorial">Back to your tutorial</button></div></div>`;
      }
      return `<div class="content stack" style="gap:18px"><div><div class="eyebrow">Drill session complete</div><h1>${c} of ${done.length} correct</h1></div>
        <div class="card lift stack"><h3>Topics covered</h3><div class="topic-list">${tr.topics.map(t => `<div class="topic-item"><div><div class="t-title">${esc(L[t].title)}</div><div class="t-sub">${topicMastered(t) ? 'Mastered' : `${topicPriority(t)} priority points remaining`}</div></div><span class="pill ${topicMastered(t) ? 'good' : 'warn'}">${topicMastered(t) ? 'DONE' : 'KEEP GOING'}</span></div>`).join('')}</div></div>
        <div class="row">${still.length ? `<button class="btn primary" data-act="start-train">Next session (${still.length} left)</button>` : ''}<button class="btn ghost" data-act="go" data-arg="home">Home</button></div></div>`;
    }
    const topic = tr.topics[tr.ti]; const l = L[topic];
    const header = `<div class="row spread"><div class="row" style="gap:8px"><span class="pill accent">Topic ${tr.ti + 1} of ${tr.topics.length}</span><span class="pill">${DOMAINS[l.domain].short}</span><span class="pill ${tr.streak >= 2 ? 'good' : ''}">streak ${tr.streak}/3</span></div><button class="btn ghost small" data-act="abandon-train">End session</button></div>`;
    if (tr.phase === 'lesson') {
      return `<div class="content stack" style="gap:18px">${header}
        <div class="row spread"><div><div class="eyebrow">Refresher</div><h1>${esc(l.title)}</h1></div><button class="btn small ghost fb-btn" data-act="fb-open" data-kind="lesson" data-arg="${topic}">&#9873; Feedback</button></div>
        <div class="hook"><span class="eyebrow">Remember</span><div>${inline(l.hook)}</div></div>
        <details class="lesson-fold" ${topicPriority(topic) >= 6 ? 'open' : ''}><summary>Read the full lesson</summary><article class="lesson-body">${renderBody(l.body)}</article></details>
        ${deepSection(topic)}
        <div class="row"><button class="btn primary lg" data-act="train-drills">Start drills</button></div></div>`;
    }
    if (tr.i >= tr.items.length) { extendQueue(tr); if (tr.i >= tr.items.length) { tr.ti++; tr.phase = 'lesson'; tr.i = 0; tr.items = []; tr.answers = []; tr.streak = 0; tr.drills = 0; save(); return viewTrain(); } }
    return `<div class="content stack" style="gap:18px">${header}
      <div class="card lift">${questionCard(tr, { immediate: true, title: esc(l.title) })}</div>
      <p class="muted" style="font-size:.9rem">Drill ${tr.drills + 1}. Three correct in a row completes this topic.</p></div>`;
  }
  // opts.plan marks a session opened from a retraining entry: its end screen leads to the next entry
  // (or the next test) instead of another weak-topic session, and End session returns to the tutorial.
  function startTrain(topics, opts) {
    const list = topics && topics.length ? topics : weakTopics().slice(0, 3);
    if (!list.length) { S.active = { kind: 'train', phase: 'pick' }; go('train'); return; }
    S.active = { kind: 'train', topics: list, ti: 0, phase: 'lesson', items: [], i: 0, answers: [], sel: null, conf: null, submitted: false, noConf: true, streak: 0, drills: 0, log: [], used: [], fromPlan: !!(opts && opts.plan) };
    go('train');
  }
  function extendQueue(tr) {
    const topic = tr.topics[tr.ti]; const used = new Set(tr.used || []);
    const fresh = pickForLesson(topic, 4, used, 0.4);
    if (!fresh.length) { const misses = tr.answers.filter(a => !a.correct).map(a => a.q); misses.forEach(q => tr.items.push(slim(fat(q)))); return; }
    fresh.forEach(q => { tr.items.push(slim(q)); tr.used.push(q.id); });
  }

  // ---------- progress ----------
  function viewProgress() {
    const mastered = lessons.filter(l => topicMastered(l.id)).length;
    return `<div class="wide stack" style="gap:18px">
      <div><div class="eyebrow">Progress</div><h1>${mastered} of ${lessons.length} topics mastered</h1></div>
      ${CERT ? (g => `<div class="card stack"><div class="row spread"><div><h3>Certificate of completion</h3><p class="ink2">${g.ok ? 'Earned. Open it to add your name and print it.' : 'Unlocks when every lesson is passed, every lab is done, and the official-format test is passed.'}</p></div><button class="btn ${g.ok ? 'primary' : ''}" data-act="go" data-arg="certificate">${g.ok ? 'Open' : 'What is left'}</button></div></div>`)(certGate()) : ''}
      <div class="card stack"><h3>Accuracy by domain</h3>${domainBars()}</div>
      <div class="card"><h3 style="margin-bottom:10px">Every topic</h3><div class="table-wrap"><table class="plain"><thead><tr><th>Unit</th><th>Lesson</th><th>Checkpoint</th><th>Answered</th><th>Priority</th><th>Status</th></tr></thead><tbody>
        ${lessons.map(l => { const ls = lstat(l.id); const t = S.topics[l.id] || { attempts: 0, correct: 0 }; const p = topicPriority(l.id); const m = topicMastered(l.id);
          return `<tr><td class="tnum muted">${l.unit.n}</td><td><button class="btn small ghost" data-act="lesson" data-arg="${l.id}" style="padding-left:0">${esc(l.title)}</button></td><td>${ls.status === 'passed' ? `<span class="pill good">passed ${ls.best}/${CHECKPOINT_N}</span>` : ls.status === 'read' ? '<span class="pill">read</span>' : '<span class="muted">—</span>'}</td><td class="tnum">${t.correct}/${t.attempts}</td><td class="tnum">${p}</td><td><span class="led ${m ? 'green' : t.attempts ? 'amber' : 'off'}" style="display:inline-block;vertical-align:middle"></span> ${m ? 'mastered' : t.attempts ? 'in progress' : 'not started'}</td></tr>`; }).join('')}
      </tbody></table></div></div>
      <div class="card stack"><h3>Move your progress to another device</h3><p class="ink2">Copy this code, paste it into the same box on your other device, and press Load. Progress and saved feedback live only in this browser otherwise.</p>
        <textarea class="io" id="io" spellcheck="false">${esc(JSON.stringify(exportable()))}</textarea>
        <div class="row"><button class="btn" data-act="copy">Copy</button><button class="btn" data-act="import">Load from box</button><span style="flex:1"></span><button class="btn danger small" data-act="reset">Reset everything</button></div></div>
    </div>`;
  }
  function exportable() { const c = JSON.parse(JSON.stringify(S)); c.active = null; return c; }

  function viewReady() {
    const recent = S.exams.filter(e => e.kind === 'practice' || e.kind === 'full').slice(-PASS_WINDOW); const st = stage(); const ready = st === 'ready';
    return `<div class="content stack" style="gap:18px">
      <div><div class="eyebrow">Readiness report</div><h1>${ready ? 'Book the exam.' : 'Not yet.'}</h1></div>

  // ---------- certificate of completion ----------
  function certGate() {
    const lessonsLeft = lessons.filter(l => lstat(l.id).status !== 'passed').length;
    const labsLeft = labIds.filter(id => !labDone(id)).length;
    const officialLeft = S.official ? 0 : 1;
    // Earned once, earned for good: a lab Redo (which clears that lab's `done`) or any later
    // state change must not revoke a certificate already issued. S.certAt is stamped the first
    // time the page renders it, and S.official is kept in the condition so viewCertificate may
    // always dereference S.official.pct.
    const earned = !lessonsLeft && !labsLeft && !officialLeft;
    return { ok: earned || !!(S.certAt > 0 && S.official), lessonsLeft, labsLeft, officialLeft };
  }
  // The signed-in account's name when it has one, else the name typed on the certificate page.
  function certName() {
    const u = window.FRAAuth && FRAAuth.isSignedIn() ? FRAAuth.user() : null;
    return (u && u.name) || (S.settings.certName || '');
  }
  function viewCertificate() {
    if (!CERT) return viewProgress();

            <li>${g.officialLeft ? 'The official-format test, not yet passed' : 'Official-format test passed'}</li>
          </ul>
          <div class="row"><button class="btn" data-act="go" data-arg="course">All lessons</button><button class="btn ghost" data-act="go" data-arg="progress">Progress</button></div></div>
      </div>`;
    }
    if (!S.certAt) { S.certAt = Date.now(); save(); }
    const name = certName(); const u = window.FRAAuth && FRAAuth.isSignedIn() ? FRAAuth.user() : null;
    const exam = course.exam || {};
    return `<div class="content stack" style="gap:18px">
      <div class="no-print row spread" style="align-items:flex-start"><div><div class="eyebrow">Certificate of completion</div><h1>Earned.</h1></div><div class="row"><button class="btn primary" data-act="print-cert" ${name ? '' : 'disabled'}>Print or save as PDF</button></div></div>
      ${u && u.name ? '' : `<div class="card no-print row" style="gap:10px;flex-wrap:wrap;align-items:flex-end"><label class="field" style="flex:1;min-width:220px">Your name, as it should appear<input type="text" id="cert-name" value="${esc(S.settings.certName || '')}" maxlength="80"></label><button class="btn" data-act="cert-name">Save name</button></div>`}
      <div class="certificate card">
        <div class="cert-brand"><span class="mark">FR</span> ${esc(course.brand)}</div>
        <div class="cert-title">Certificate of completion</div>
        <div class="cert-name">${name ? esc(name) : '<span class="muted">Your name</span>'}</div>
        <div class="cert-body">has completed <strong>${esc(course.name)}</strong>${exam.title ? `, preparation for the ${esc([exam.vendor, exam.title].filter(Boolean).join(' '))}${exam.code ? ` (${esc(exam.code)})` : ''}` : ''}: all ${lessons.length} lessons with their checkpoints${labIds.length ? `, all ${plural(labIds.length, 'lab')}` : ''}, and the official-format test at ${S.official.pct}%.</div>

  // ---------- deeper explanations ----------

  // ---------- cheat sheet ----------

  // The Acronyms section: every glossary entry, alphabetical, with the acronym clickable for the deeper explanation.

  // Hover tooltip: one shared element, positioned under the acronym and kept inside the viewport.

    const r = el.getBoundingClientRect(); const tw = acrTipEl.offsetWidth, th = acrTipEl.offsetHeight;

  // ---------- feedback ----------
  function fbBtn(q, where) { const i = fbReg.push({ q, where }) - 1; return `<button class="btn small ghost fb-btn" data-act="fb-open" data-kind="question" data-arg="${i}" title="Report a problem with this question">&#9873; Flag</button>`; }
  function fbModal() {
    if (!fb) return '';
    const cats = FB_CATS[fb.kind === 'question' ? 'question' : fb.kind === 'lesson' ? 'lesson' : 'overall'];
    return `<div class="modal-back" data-act="fb-cancel"><div class="modal stack" role="dialog" aria-modal="true" aria-labelledby="fb-title">
      <div><div class="eyebrow">Feedback</div><h3 id="fb-title">${esc(fb.title)}</h3>${fb.sub ? `<p class="muted" style="font-size:.9rem;margin-top:4px">${esc(fb.sub)}</p>` : ''}${fb.note ? `<p class="ink2" style="font-size:.9rem;margin-top:4px">${esc(fb.note)}</p>` : ''}</div>

      <label class="field">Details${fb.kind === 'lesson' ? ' (optional with a rating)' : ''}<textarea id="fb-text" rows="4" placeholder="${fb.kind === 'lesson' ? 'What was unclear, wrong, or missing?' : 'What is wrong, and what should it say instead?'}"></textarea></label>
      <div class="row spread"><span class="muted" style="font-size:.85rem">Saved in this browser. Export it from the Feedback tab.</span><div class="row"><button class="btn ghost" data-act="fb-cancel">Cancel</button><button class="btn primary" data-act="fb-save">Save feedback</button></div></div>
    </div></div>`;

  function saveFeedback(item) {
    const f = Object.assign({ id: 'fb-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), ts: Date.now(), sent: false }, item);
    S.feedback = S.feedback || []; S.feedback.push(f); save();
    if (FEEDBACK_ENDPOINT && typeof fetch === 'function') {
      try { fetch(FEEDBACK_ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.assign({ course: course.id }, f)) }).then(r => { if (r.ok) { f.sent = true; save(); } }).catch(() => { /* offline; stays local */ }); } catch (e) { /* ignore */ }
    }
    return f;
  }
  const FB_KIND = { question: 'Question', lesson: 'Lesson', unit: 'Unit', site: 'Website', page: 'Page', overall: 'Overall' };
  function fbContext(f) {
    const r = f.ref || {}; const l = r.lesson ? L[r.lesson] : null; const u = r.unit ? units.find(x => x.id === r.unit) : null;
    if (f.kind === 'question') return `${l ? l.title : 'Question'}${r.where ? ' · ' + (WHERE_LABEL[r.where] || r.where) : ''}`;

  }
  function feedbackReport() {
    const items = S.feedback || []; const rated = ratedLessons();
    const lines = [`# ${course.name} feedback (${plural(items.length, 'item')}, ${plural(rated.length, 'lesson rating')}, exported ${new Date().toISOString().slice(0, 10)})`, ''];
    if (rated.length) { lines.push('## Lesson ratings (1 confusing to 10 great)', ''); rated.forEach(id => lines.push(`- ${L[id].title} (${id}): ${S.ratings[id].r}/10`)); lines.push(''); }
    items.forEach((f, i) => {
      const r = f.ref || {}; const l = r.lesson ? L[r.lesson] : null;
      lines.push(`## ${i + 1}. ${FB_KIND[f.kind] || f.kind} · ${f.cat || 'Uncategorized'} · ${new Date(f.ts).toISOString().slice(0, 10)}`);
      lines.push(`- About: ${fbContext(f)}`);
      if (l) lines.push(`- Lesson id: ${l.id}`);
      if (f.rating != null) lines.push(`- Rating: ${f.rating}/10`);
      if (r.stem) { lines.push(`- Question${r.qid ? ' ' + r.qid : ' (generated at run time)'}: ${r.stem}`); (r.options || []).forEach((o, k) => lines.push(`  - ${letters[k]}. ${o}${k === r.correct ? ' (marked correct)' : ''}`)); }
      lines.push(`- Feedback: ${f.text || '(rating only)'}`, '');
    });
    return lines.join('\n');
  }
  const ratedLessons = () => Object.keys(S.ratings || {}).filter(id => L[id] && S.ratings[id] && S.ratings[id].r >= 1).sort((a, b) => L[a].index - L[b].index);
  function copyText(txt, msg) {
    const done = () => toast(msg || 'Copied');

    function fallback() { const ta = document.createElement('textarea'); ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch (e) { toast('Could not copy'); } ta.remove(); }
  }
  function viewFeedback() {
    const items = (S.feedback || []).slice().reverse(); const rated = ratedLessons(); const any = items.length || rated.length;
    const mailto = FEEDBACK_EMAIL ? `mailto:${FEEDBACK_EMAIL}?subject=${encodeURIComponent(course.name + ' feedback')}&body=${encodeURIComponent(feedbackReport().slice(0, 1800))}` : '';
    return `<div class="content stack" style="gap:18px">

        <label class="field">Type<select id="fb-cat">${FB_CATS.overall.map(c => `<option>${esc(c)}</option>`).join('')}</select></label>

      ${rated.length ? `<div class="card stack"><h3>Lesson ratings (${rated.length})</h3><div class="topic-list">${rated.map(id => `<div class="topic-item"><div><div class="t-title">${esc(L[id].title)}</div><div class="t-sub">Unit ${L[id].unit.n} · ${fmtDate(S.ratings[id].ts)}</div></div><div class="row"><span class="pill ${S.ratings[id].r >= 7 ? 'good' : S.ratings[id].r >= 4 ? 'warn' : 'bad'}">${S.ratings[id].r}/10</span><button class="btn small ghost" data-act="lesson" data-arg="${id}">Lesson</button></div></div>`).join('')}</div></div>` : ''}
      <div class="card stack">
        <div class="row spread"><h3>Saved feedback (${items.length})</h3><div class="row"><button class="btn small" data-act="fb-copy" ${any ? '' : 'disabled'}>Copy report</button><button class="btn small" data-act="fb-download" ${any ? '' : 'disabled'}>Download JSON</button>${mailto ? `<a class="btn small" href="${mailto}">Email</a>` : ''}${items.length ? `<button class="btn small danger" data-act="fb-clear">Clear all</button>` : ''}</div></div>
        ${items.length ? items.map(f => `<div class="review-item"><div class="row" style="gap:6px;margin-bottom:4px"><span class="pill accent">${FB_KIND[f.kind] || f.kind}</span><span class="pill">${esc(f.cat || '')}</span>${f.rating != null ? `<span class="pill ${f.rating >= 7 ? 'good' : f.rating >= 4 ? 'warn' : 'bad'}">${f.rating}/10</span>` : ''}<span class="muted" style="font-size:.85rem">${fmtDate(f.ts)}${f.sent ? ' · sent' : ''}</span><span style="flex:1"></span><button class="btn small ghost" data-act="fb-delete" data-arg="${f.id}">Delete</button></div><div class="stem">${esc(fbContext(f))}</div>${f.ref && f.ref.stem ? `<div class="ans muted">${esc(f.ref.stem)}</div>` : ''}<div class="ans">${f.text ? esc(f.text) : '<span class="muted">(rating only)</span>'}</div></div>`).join('') : '<p class="muted">Nothing saved yet.</p>'}

  // ---------- timer ----------
  function startTimer() {
    stopTimer(); if (!S.settings.timer && !isOfficial(S.active)) return;
    const tick = () => {
      const ex = S.active; if (!ex || !isTest(ex.kind) || !examMinutes(ex)) { stopTimer(); return; }
      const remain = examMinutes(ex) * 60 - Math.floor((Date.now() - ex.startedAt) / 1000);
      const el = $('#timer'); if (el) { const m = Math.max(0, Math.floor(remain / 60)), s = Math.max(0, remain % 60); el.textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`; el.classList.toggle('low', remain < 300); }
      if (remain <= 0) { stopTimer(); ex.i = ex.items.length; save(); toast('Time is up. Scoring your test.'); render(); }
    };
