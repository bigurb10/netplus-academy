{id:"u8l4-1",t:"u8l4",q:"A company performs a full backup every Sunday and wants weekday backups that can be restored using only the full backup plus the most recent weekday backup. Which backup type should be used on weekdays?",a:["Incremental","Snapshot","Differential","Replication"],c:2,e:"A differential backup captures everything changed since the last full backup, so a restore needs only the full plus the latest differential. Incremental restores need every incremental since the full."},
{id:"u8l4-2",t:"u8l4",q:"After a ransomware attack, the organization discovers that its backups were also encrypted because the backup server was reachable from the infected network. Which backup practice was missing?",a:["Encrypting the backups","Taking more frequent snapshots","Using RAID 6 on the backup server","Keeping an offline or immutable copy"],c:3,e:"Ransomware encrypts any backup it can write to. An offline (disconnected) or immutable copy cannot be altered by the compromised systems, which is what makes recovery possible without paying."},
{id:"u8l4-3",t:"u8l4",q:"Why is RAID not considered a substitute for backups?",a:["RAID protects against disk failure but mirrors deletions, corruption, and ransomware across all disks","RAID is too slow to restore","RAID cannot be used on servers","RAID only works with tape"],c:0,e:"RAID keeps a system running when a disk fails, but a deleted or encrypted file is deleted or encrypted on every disk in the array. Backups protect against everything RAID does not."},
{id:"u8l4-4",t:"u8l4",q:"An organization wants to verify that its disaster recovery plan is complete by having the team walk through a scenario step by step in a meeting, without touching any systems. Which test is this?",a:["Failover test","Tabletop exercise","Parallel processing","Simulation"],c:1,e:"A tabletop exercise is a discussion-based walkthrough that finds gaps in the plan without affecting production. A failover test actually switches systems, and parallel processing runs the recovery environment alongside production."},
{id:"u8l4-5",t:"u8l4",q:"During a power outage, which component keeps servers running for the seconds to minutes before the generator reaches full output?",a:["Generator","Power distribution unit","Uninterruptible power supply","Surge protector"],c:2,e:"A UPS uses batteries to carry the load through short outages and the generator's start-up delay, and it conditions power. The generator provides long-term power once running."},

// u9l1
{id:"u9l1-1",t:"u9l1",q:"Servers were configured according to the approved baseline when built, but an audit months later finds that many now differ from the baseline and from each other. Which step of secure baseline management failed?",a:["Establish","Deploy","Classify","Maintain"],c:3,e:"Maintaining a baseline means monitoring for drift and re-applying the approved configuration. The systems were established and deployed correctly but not maintained."},
{id:"u9l1-2",t:"u9l1",q:"A technician is installing a new network switch. Which hardening actions should be performed FIRST?",a:["Change the default credentials and disable unused ports and services","Enable jumbo frames and LACP","Install an endpoint protection agent","Configure the switch as a jump server"],c:0,e:"Default credentials are publicly known and unused services are pure attack surface, so changing defaults and disabling unneeded ports and services are the first hardening steps for any device. Agents cannot run on switches."},
{id:"u9l1-3",t:"u9l1",q:"Which hardening approach is MOST appropriate for embedded systems and IoT devices that cannot run security software and rarely receive firmware updates?",a:["Install host-based intrusion prevention on each device","Place them on a separate network segment and monitor their traffic","Require multifactor authentication on the devices","Encrypt their internal storage with a TPM"],c:1,e:"Constrained devices cannot host agents or be patched reliably, so protection comes from the environment: isolation on their own segment, firewall rules allowing only needed traffic, and monitoring."},
{id:"u9l1-4",t:"u9l1",q:"An organization's cloud storage buckets keep being created with public read access. Which measure addresses this at the baseline level?",a:["Manual review of each bucket monthly","Full-disk encryption on administrator laptops","A cloud baseline with automated configuration scanning and enforcement","Disabling the cloud provider's logging"],c:2,e:"A cloud baseline defines that storage must not be public, and configuration scanning with enforcement detects and corrects violations automatically. Manual monthly review is too slow and inconsistent."},
{id:"u9l1-5",t:"u9l1",q:"Which hardening measure applies specifically to workstations rather than to network devices?",a:["Changing the SNMP community string","Updating router firmware","Disabling Telnet in favor of SSH","Ensuring users do not run as local administrators"],c:3,e:"Least privilege for interactive users, so they are not local administrators, is a workstation control that limits what malware can do. The other options are network device hardening steps."},

// u9l2
{id:"u9l2-1",t:"u9l2",q:"Every time an employee leaves, the company must change the Wi-Fi passphrase on all devices. Which change eliminates this problem?",a:["Implement WPA Enterprise with 802.1X and RADIUS","Hide the SSID","Switch to WPA3-Personal","Enable MAC address filtering"],c:0,e:"Enterprise mode authenticates each user or device individually against a RADIUS server, so one account can be revoked without affecting anyone else. Personal mode shares one passphrase regardless of WPA version."},
{id:"u9l2-2",t:"u9l2",q:"Which WPA3 feature prevents attackers from capturing the wireless handshake and cracking the passphrase offline?",a:["TKIP","Simultaneous authentication of equals (SAE)","Hidden SSID","WEP key rotation"],c:1,e:"SAE replaces the pre-shared key handshake with an exchange that requires live interaction for every guess, defeating offline dictionary attacks. TKIP and WEP are deprecated; hidden SSIDs provide no security."},
{id:"u9l2-3",t:"u9l2",q:"A wireless engineer measures signal strength throughout a building before and after installing access points and produces a color-coded floor plan. What is this activity and its output?",a:["Penetration test; a risk register","Vulnerability scan; a CVSS report","Site survey; a heat map","Enumeration; an inventory"],c:2,e:"A site survey measures coverage, signal, and interference, and its output is a heat map showing signal strength across the floor plan, used to place access points and limit signal leaking outside."},
{id:"u9l2-4",t:"u9l2",q:"A company purchases phones and lets employees select one from a list of three approved models; the company owns and manages the devices. Which deployment model is this?",a:["BYOD","COPE","Shadow IT","CYOD"],c:3,e:"Choose your own device means the company owns and manages the device but the employee selects it from an approved list. COPE is company-owned with personal use allowed but company-chosen; BYOD is employee-owned."},
{id:"u9l2-5",t:"u9l2",q:"An executive's phone containing customer data was lost. Which control would allow the organization to remotely erase the corporate data?",a:["Mobile device management enrollment","A site survey","A captive portal","Bluetooth pairing restrictions"],c:0,e:"Mobile device management enforces policy on enrolled devices, including remote lock and wipe. A device that was never enrolled cannot be wiped, which would itself be the finding."},

// u9l3
{id:"u9l3-1",t:"u9l3",q:"A single development practice defeats SQL injection, cross-site scripting, buffer overflows, and directory traversal. Which practice is it?",a:["Code signing","Server-side input validation","Sandboxing","Secure cookies"],c:1,e:"Validating every input on the server for type, length, format, and range stops malicious input before it reaches a query, a page, a buffer, or a file path. Client-side validation alone is bypassed by attackers."},
{id:"u9l3-2",t:"u9l3",q:"Which cookie attribute prevents a cross-site scripting payload from reading a user's session cookie?",a:["Secure","SameSite","HttpOnly","Expires"],c:2,e:"The HttpOnly flag makes the cookie unavailable to JavaScript, so a script injected through XSS cannot steal it. Secure restricts the cookie to HTTPS, and SameSite limits cross-site requests."},
{id:"u9l3-3",t:"u9l3",q:"A security team wants developers to discover hard-coded credentials and unvalidated database queries before the application is ever built or run. Which technique fits?",a:["Dynamic analysis","Penetration testing","Fuzzing the running application","Static code analysis"],c:3,e:"Static code analysis examines source code without executing it and flags dangerous patterns early in the pipeline. Dynamic analysis and penetration testing require a running application."},
{id:"u9l3-4",t:"u9l3",q:"Systems must verify that a software update genuinely came from the vendor and was not modified in transit before installing it. Which control provides this?",a:["Code signing","Input validation","Data masking","Load balancing"],c:0,e:"Code signing uses the vendor's private key to sign releases; the installing system verifies the signature with the public key, proving origin and integrity. It is the defense against tampered downloads and malicious updates."},
{id:"u9l3-5",t:"u9l3",q:"An analyst receives a suspicious email attachment and wants to observe its behavior without any risk to the network. Which approach should be used?",a:["Open it on a production workstation with antivirus enabled","Execute it in a sandbox","Upload it to the file server for review","Forward it to all analysts"],c:1,e:"A sandbox runs code in an isolated environment with no access to real systems or networks, so suspected malware can be detonated and observed safely."},

// u9l4
{id:"u9l4-1",t:"u9l4",q:"A network scan identifies six active devices that do not appear in the organization's asset records. Which asset management activity produced this finding?",a:["Classification","Sanitization","Enumeration","Procurement"],c:2,e:"Enumeration actively discovers what is really on the network and compares it to the inventory; the difference is the set of unknown assets. Inventory alone is only what the organization believes it has."},
{id:"u9l4-2",t:"u9l4",q:"An organization plans to donate laptops that previously held internal documents. Which disposal method allows the laptops to be reused while ensuring the data cannot be recovered?",a:["Physical destruction of the drives","Formatting with the default quick format","Simply deleting the user profiles","Sanitization of the drives"],c:3,e:"Sanitization removes data irrecoverably while leaving the media usable, through cryptographic erase or secure overwriting. Deleting or quick formatting leaves data recoverable, and destruction prevents reuse."},
{id:"u9l4-3",t:"u9l4",q:"Before destroying old financial records, what must an organization verify FIRST?",a:["That data retention requirements and legal holds do not require the records to be kept","That the shredder is certified","That the records have been classified as public","That a hot site has a copy"],c:0,e:"Retention laws, regulations, and legal holds may require records to be kept for a period; destroying them prematurely can be a serious violation. Retention is checked before any disposal."},
{id:"u9l4-4",t:"u9l4",q:"Auditors require proof that the drives from a retired cardholder database were destroyed. Which item satisfies this requirement?",a:["The original purchase order","A certificate of destruction from the disposal vendor","The asset's classification label","A heat map"],c:1,e:"Certification is documented proof, typically from a third party, that sanitization or destruction was completed. It is required for regulated data and is what auditors accept."},
{id:"u9l4-5",t:"u9l4",q:"A critical file server has gone unpatched for two years because no one is responsible for it. Which asset management element was missing?",a:["Sanitization","Enumeration","Assignment and ownership","Certification"],c:2,e:"Every asset needs a named owner accountable for patching, access decisions, and disposal. Ownerless assets are the ones that decay into long-term vulnerabilities."},

// u10l1
{id:"u10l1-1",t:"u10l1",q:"A security team wants the most accurate report of missing patches and installed software on its servers. Which scanning approach should be used?",a:["Non-credentialed scan from outside the network","Dynamic application analysis","Passive threat feed subscription","Credentialed scan using an account on each server"],c:3,e:"A credentialed scan logs into the system and sees installed software, patch levels, and configuration directly, producing fewer false positives than a non-credentialed scan that sees only exposed services."},
{id:"u10l1-2",t:"u10l1",q:"An application is built from dozens of open-source libraries. Which practice alerts the team when one of those libraries receives a new vulnerability identifier?",a:["Package monitoring","Static code analysis of the team's own code","Penetration testing","Responsible disclosure"],c:0,e:"Package monitoring tracks third-party dependencies and their known vulnerabilities, alerting when a new CVE is published for a library in use. Static analysis covers the team's own code."},
{id:"u10l1-3",t:"u10l1",q:"Management asks whether a vulnerability reported by the scanner on the customer portal can actually be exploited to reach customer data. Which activity answers this?",a:["A vulnerability rescan","A penetration test","Package monitoring","Log archiving"],c:1,e:"A penetration test attempts exploitation under authorization and demonstrates the actual path and consequences, proving whether a scanner finding is exploitable in practice."},
{id:"u10l1-4",t:"u10l1",q:"A hospital wants to learn about threats currently targeting other healthcare organizations from its peers. Which threat intelligence source fits?",a:["Dark web monitoring","A proprietary vendor feed","An industry information sharing and analysis center (ISAC)","Static code analysis"],c:2,e:"ISACs are sector-specific organizations whose members share threat information affecting their industry. Vendor feeds are commercial, and dark web monitoring watches criminal markets."},
{id:"u10l1-5",t:"u10l1",q:"A researcher finds a serious flaw in a company's product but sees no way to report it safely. Which program gives researchers a defined, safe process for reporting flaws and may reward them?",a:["Change management","A system audit","Package monitoring","A bug bounty program with responsible disclosure"],c:3,e:"Responsible disclosure policies define how to report and what the researcher can expect, and bug bounty programs pay for valid reports. Both turn outside researchers into allies rather than adversaries."},

// u10l2
{id:"u10l2-1",t:"u10l2",q:"A vulnerability scanner reports a critical flaw in a web server version, but the administrator confirms the server runs a different, patched version. What is this finding called?",a:["False positive","False negative","Zero-day","Exception"],c:0,e:"A false positive is a reported vulnerability that does not actually exist. A false negative is a real vulnerability the scanner missed, which is the more dangerous error."},
{id:"u10l2-2",t:"u10l2",q:"Two findings have the same CVSS score of 9.1: one on an isolated lab server with no sensitive data, and one on the internet-facing payment gateway. Which factors justify remediating the gateway first?",a:["CVSS score alone","Environmental variables and organizational impact","The age of the servers","Alphabetical order of hostnames"],c:1,e:"Prioritization combines CVSS with environmental factors such as exposure to the internet and the sensitivity of data, plus the impact to the organization. Equal CVSS scores do not mean equal risk."},
{id:"u10l2-3",t:"u10l2",q:"Which CVSS score range is classified as Critical?",a:["4.0 to 6.9","7.0 to 8.9","9.0 to 10.0","0.1 to 3.9"],c:2,e:"CVSS severity ratings are None 0, Low 0.1 to 3.9, Medium 4.0 to 6.9, High 7.0 to 8.9, and Critical 9.0 to 10.0."},
{id:"u10l2-4",t:"u10l2",q:"A patch was deployed to fifty servers last week to fix a reported vulnerability. What should the team do NEXT to confirm the remediation?",a:["Close the tickets","Document an exception","Purchase cyber insurance","Rescan the servers"],c:3,e:"Validation requires evidence that the flaw is gone; rescanning the systems confirms the patch took effect on every server. A closed ticket is a claim, not proof."},
{id:"u10l2-5",t:"u10l2",q:"An essential legacy application has a vulnerability with no available patch. Management decides to leave it in place with added monitoring and a review in six months. Which response is being documented?",a:["A risk exception with compensating controls","Patching","Insurance","A false negative"],c:0,e:"An exception is a documented, approved decision to leave a vulnerability unremediated for a stated reason and period, usually with compensating controls and an owner, and it is reviewed when it expires."},

// u10l3
{id:"u10l3-1",t:"u10l3",q:"A security team wants to detect that the same credentials were used on the VPN, then on an internal server from a different country, then to transfer large files externally, all within an hour. Which tool correlates these events across sources?",a:["Vulnerability scanner","SIEM","SNMP trap receiver","Antivirus console"],c:1,e:"A security information and event management system aggregates logs from many sources and correlates events to reveal patterns no single log shows. The other tools each see only their own domain."},
{id:"u10l3-2",t:"u10l3",q:"Analysts receive thousands of alerts each day and have started ignoring them, missing a real intrusion. Which activity addresses this problem?",a:["Log archiving","Increasing scan frequency","Alert tuning","Adding more SNMP traps"],c:2,e:"Alert tuning suppresses benign patterns, adjusts thresholds, and enriches alerts so false positives drop and real alerts are seen. Alert fatigue is a tuning failure, not a staffing one."},
{id:"u10l3-3",t:"u10l3",q:"An organization wants to automatically verify that every server matches a published hardening benchmark. Which standard enables tools to perform these checks?",a:["NetFlow","IPsec","DLP","SCAP"],c:3,e:"The Security Content Automation Protocol expresses configuration checks in a standard format so tools can compare systems against benchmarks automatically and report compliance."},
{id:"u10l3-4",t:"u10l3",q:"A network operations team wants to be notified the instant a core switch interface goes down, without waiting for the next polling cycle. Which mechanism provides this?",a:["SNMP traps","NetFlow export","A credentialed scan","Log archiving"],c:0,e:"SNMP traps are pushed by the device the moment an event occurs, unlike polling, which checks on a schedule. NetFlow summarizes traffic and scans check for vulnerabilities."},
{id:"u10l3-5",t:"u10l3",q:"Which tool detects and blocks an employee from emailing a spreadsheet containing customer card numbers to a personal address?",a:["Vulnerability scanner","Data loss prevention","SNMP","NetFlow"],c:1,e:"Data loss prevention inspects content leaving by email, upload, or removable media, recognizes sensitive patterns such as card numbers, and blocks or alerts. NetFlow sees only conversation summaries."}
);

// SecPlus Academy question bank, units 11 to 15. All questions are original.
window.FRA = window.FRA || {};
FRA.questions = FRA.questions || [];
FRA.questions.push(
// u11l1
{id:"u11l1-1",t:"u11l1",q:"A firewall administrator adds a rule denying SSH to a server, but SSH connections from the internet are still succeeding. Which explanation is MOST likely?",a:["The implicit deny is disabled","A broader allow rule higher in the list matches the traffic first","SSH cannot be blocked by firewalls","The rule needs a reboot to apply"],c:1,e:"Firewall rules are evaluated top-down and the first match wins, so an allow rule above the new deny still permits the traffic. Rule order must be corrected."},
{id:"u11l1-2",t:"u11l1",q:"An organization must block gambling and social media sites for employees using laptops at home as well as in the office. Which web filtering approach meets the requirement?",a:["A centralized proxy on the corporate network","DNS filtering on the office resolver only","Agent-based web filtering with content categorization","A screened subnet"],c:2,e:"Agent-based filtering runs on the device and enforces policy wherever it goes. A centralized proxy only covers traffic that passes through the corporate network, and an office-only resolver does not affect home use."},
{id:"u11l1-3",t:"u11l1",q:"A security team wants to prevent infected hosts from reaching their command-and-control servers, regardless of which application initiates the connection, with minimal deployment effort. Which control fits BEST?",a:["Group Policy","A web application firewall","Signature-based IPS on the web proxy","DNS filtering"],c:3,e:"DNS filtering refuses to resolve known-malicious domains, so any application on any device fails to reach them. It is inexpensive and covers everything that uses DNS."},
{id:"u11l1-4",t:"u11l1",q:"Which intrusion detection approach can identify an attack for which no signature has been published?",a:["Trend or behavior-based detection","Signature-based detection","URL scanning","Block rules"],c:0,e:"Behavior or trend-based detection alerts on deviations from normal activity, so it can catch new attacks at the cost of more false positives. Signatures only match known patterns."},
{id:"u11l1-5",t:"u11l1",q:"A packet that matches none of the configured firewall rules arrives at the firewall. What happens to it?",a:["It is allowed by default","It is dropped by the implicit deny","It is forwarded to the IDS for a decision","It is held until an administrator approves it"],c:1,e:"Every firewall rule set ends with an implicit deny that drops traffic not explicitly permitted. This is why unlisted services are blocked without a specific deny rule."},

// u11l2
{id:"u11l2-1",t:"u11l2",q:"Which email security mechanism publishes a policy telling receiving servers whether to quarantine or reject messages that fail sender authentication checks?",a:["SPF","DKIM","DMARC","An email gateway"],c:2,e:"DMARC is the DNS policy record that instructs receivers what to do when SPF or DKIM checks fail and where to send reports. SPF lists allowed senders and DKIM signs messages."},
{id:"u11l2-2",t:"u11l2",q:"A security team wants to be alerted if any system binary or configuration file on a critical server is modified. Which control provides this?",a:["Data loss prevention","User behavior analytics","Network access control","File integrity monitoring"],c:3,e:"File integrity monitoring stores hashes of critical files and alerts when they change, detecting replaced binaries, edited configurations, and dropped web shells."},
{id:"u11l2-3",t:"u11l2",q:"Only laptops with current antivirus, applied patches, and disk encryption should be allowed onto the corporate network; others should be placed in a remediation network. Which control implements this?",a:["Network access control with posture assessment","EDR","DLP","SELinux"],c:0,e:"Network access control authenticates devices and checks their posture before granting access, sending noncompliant devices to a quarantine or remediation network with limited access."},
{id:"u11l2-4",t:"u11l2",q:"A finance clerk's valid account began downloading the entire engineering repository at 3 a.m. Which tool is designed to detect this kind of deviation from an account's normal pattern?",a:["File integrity monitoring","User behavior analytics","Group Policy","SPF"],c:1,e:"User behavior analytics baselines each account's normal activity and alerts on deviations in hours, systems, and volumes, catching compromised credentials and malicious insiders whose credentials are valid."},
{id:"u11l2-5",t:"u11l2",q:"Which endpoint capability detects ransomware by its behavior rather than by a known file signature and allows analysts to isolate the host remotely?",a:["Traditional antivirus","Data loss prevention","Endpoint detection and response","Group Policy"],c:2,e:"EDR agents record process, file, and network activity, detect malicious behavior, and provide response actions such as remote isolation. Signature antivirus misses fileless and novel malware."},

// u12l1
{id:"u12l1-1",t:"u12l1",q:"An audit finds that several employees who left the company months ago still have active VPN accounts. Which identity management process failed?",a:["Identity proofing","Attestation","Federation","Deprovisioning"],c:3,e:"Deprovisioning removes access when someone leaves. Automating it from the HR system's termination record closes the gap that leaves accounts active after departure."},
{id:"u12l1-2",t:"u12l1",q:"Employees of a partner company access an organization's web portal using their own company credentials, and the organization never stores their passwords. Which concept is this?",a:["Federation","Password vaulting","Kerberos","Rule-based access control"],c:0,e:"Federation lets one organization trust identities managed by another: the partner's identity provider authenticates, and the organization's application trusts the signed assertion."},
{id:"u12l1-3",t:"u12l1",q:"A scheduling application asks for permission to add events to a user's calendar on another service without ever receiving the user's password. Which protocol enables this delegated access?",a:["SAML","OAuth","LDAP","Kerberos"],c:1,e:"OAuth provides delegated authorization: an application receives limited, scoped access to a user's resources on another service. It is not itself an authentication protocol."},
{id:"u12l1-4",t:"u12l1",q:"Managers are required each quarter to review and confirm that each of their direct reports still needs the access they hold. What is this process called?",a:["Provisioning","Identity proofing","Attestation","Interoperability"],c:2,e:"Attestation is the periodic confirmation by an accountable person that access remains appropriate, catching permissions that accumulate as people change roles."},
{id:"u12l1-5",t:"u12l1",q:"Which protocol is XML-based and commonly used for enterprise single sign-on to software-as-a-service applications?",a:["OAuth","OpenID Connect","RADIUS","SAML"],c:3,e:"SAML uses XML assertions issued by an identity provider and trusted by the service provider, and it is the common standard for enterprise web single sign-on."},

// u12l2
{id:"u12l2-1",t:"u12l2",q:"In a government system, documents carry classification labels and users hold clearances; a user cannot share a secret document with a colleague who lacks clearance, even if the user created it. Which access control model is this?",a:["Mandatory access control","Discretionary access control","Role-based access control","Rule-based access control"],c:0,e:"Mandatory access control enforces system-assigned labels and clearances that users cannot override. Discretionary control would let the document's owner decide who may access it."},
{id:"u12l2-2",t:"u12l2",q:"Access to a financial application is granted only if the user is in the finance department, is using a managed device, is located in an approved country, and is connecting during business hours. Which access control model evaluates these conditions together?",a:["Discretionary access control","Attribute-based access control","Role-based access control","Mandatory access control"],c:1,e:"Attribute-based access control makes decisions from combinations of user, device, resource, and context attributes. Role-based control considers only the role."},
{id:"u12l2-3",t:"u12l2",q:"A user authenticates with a password and then answers a security question about their first pet. How many authentication factors are in use?",a:["Three","Two","One","Four"],c:2,e:"Both a password and a security question are something you know, so this is one factor used twice. Multifactor authentication requires two different categories such as know and have."},
{id:"u12l2-4",t:"u12l2",q:"New employees in the accounting department automatically receive the same set of permissions as every other accountant when their accounts are created. Which access control model is being used?",a:["Discretionary access control","Time-of-day restrictions","Mandatory access control","Role-based access control"],c:3,e:"Role-based access control attaches permissions to roles and assigns users to roles, so everyone in a job function receives consistent access. It scales and audits well."},
{id:"u12l2-5",t:"u12l2",q:"An organization wants an MFA method that cannot be phished because it responds only to the genuine website. Which implementation should it choose?",a:["Hardware security keys using public key cryptography","Software token app","SMS one-time codes","Security questions"],c:0,e:"Security keys use public key cryptography bound to the legitimate site's origin, so a fake site receives no valid response. Codes sent by SMS or generated by apps can be entered into a phishing page."},

// u12l3
{id:"u12l3-1",t:"u12l3",q:"Which password attribute MOST increases resistance to brute force attacks?",a:["Requiring at least one special character","Length","Changing it every 30 days","Using a security question as backup"],c:1,e:"Guessing cost grows exponentially with length, so long passphrases beat short complex passwords. Forced expiration and complexity rules add little and can push users toward predictable patterns."},
{id:"u12l3-2",t:"u12l3",q:"Employees have started writing passwords on sticky notes since the company began forcing password changes every month. Which policy change addresses the root of the problem?",a:["Shorten expiration to two weeks","Require two special characters","Remove routine expiration, require longer passwords, and check against breached password lists","Disable password managers"],c:2,e:"Modern guidance discourages routine expiration because it produces predictable, written-down passwords. Length requirements and breached-password checks provide real strength."},
{id:"u12l3-3",t:"u12l3",q:"A dozen administrators share knowledge of the root password for a critical database. Which privileged access management practice fixes this?",a:["Just-in-time permissions","Time-of-day restrictions","Passwordless authentication for end users","Password vaulting with automatic rotation"],c:3,e:"Password vaulting stores privileged credentials in a vault that administrators check out per session, after which the vault rotates the password. Nobody needs to know the shared credential."},
{id:"u12l3-4",t:"u12l3",q:"Administrators currently hold permanent domain administrator rights on their daily accounts. Which practice reduces the impact of one of those accounts being compromised?",a:["Just-in-time permissions","Longer passwords","Security questions","Federation"],c:0,e:"Just-in-time permissions grant administrative rights only when requested, for a limited window, then remove them automatically, so no standing privilege exists to be stolen."},
{id:"u12l3-5",t:"u12l3",q:"An organization wants to eliminate the possibility of its executives' passwords being phished. Which authentication approach BEST achieves this?",a:["Complex 12-character passwords","Passwordless authentication with security keys","Monthly password expiration","Shared password vault"],c:1,e:"Passwordless authentication removes the password entirely, leaving nothing to phish, spray, or reuse, and security keys respond only to the genuine site."},

// u12l4
{id:"u12l4-1",t:"u12l4",q:"Security analysts spend hours each day copying alert details into the ticketing system by hand. Which automation use case directly addresses this?",a:["Guard rails","User provisioning","Ticket creation through orchestration","Continuous integration"],c:2,e:"Orchestration can create tickets automatically from alerts with the evidence attached, eliminating manual copying and speeding response. This is a classic use case for automation."},
{id:"u12l4-2",t:"u12l4",q:"A developer's deployment accidentally created a publicly readable storage bucket, but the automation platform blocked the change before it took effect. Which automation concept prevented the exposure?",a:["Workforce multiplier","Escalation","Technical debt","Guard rails"],c:3,e:"Guard rails are automated checks that stop deployments or configurations that violate policy, such as public storage or open ports, before they are applied."},
{id:"u12l4-3",t:"u12l4",q:"When an organization's orchestration platform crashed, no security alerts were processed and no accounts could be disabled automatically for several hours. Which consideration of automation does this illustrate?",a:["Single point of failure","Employee retention","Reaction time","Enforcing baselines"],c:0,e:"Centralizing response in one platform makes that platform a single point of failure; when it fails, every dependent process stops. It must be made resilient."},
{id:"u12l4-4",t:"u12l4",q:"Which of the following is a benefit of security automation that the exam objectives specifically identify?",a:["Increased complexity","Workforce multiplier","Technical debt","Ongoing supportability costs"],c:1,e:"Automation acts as a workforce multiplier, letting a small team accomplish the work of a larger one. Complexity, technical debt, and supportability are listed as considerations or drawbacks."},
{id:"u12l4-5",t:"u12l4",q:"A script that rotates encryption keys was written years ago by an employee who has since left; nobody understands it and it fails intermittently. Which two automation considerations does this describe?",a:["Reaction time and efficiency","Guard rails and escalation","Technical debt and ongoing supportability","Baselines and scaling"],c:2,e:"Undocumented, unmaintained automation is technical debt, and the lack of anyone able to maintain it is an ongoing supportability problem. Both are recognized drawbacks of automation."},

// u13l1
{id:"u13l1-1",t:"u13l1",q:"Analysis has confirmed that malware is actively spreading from an infected workstation to file shares. What is the NEXT step in the incident response process?",a:["Eradication","Lessons learned","Recovery","Containment"],c:3,e:"Once an incident is confirmed and scoped, containment stops the spread before any cleanup. Eradication and recovery follow containment."},
{id:"u13l1-2",t:"u13l1",q:"All affected systems have been rebuilt from clean images, the vulnerability has been patched, and normal operations have resumed under close monitoring. Which phase is the team in, and what comes next?",a:["Recovery; lessons learned is next","Containment; eradication is next","Eradication; recovery is next","Preparation; detection is next"],c:0,e:"Restoring systems and resuming operations is recovery. The final phase is lessons learned, which reviews the incident and feeds improvements back into preparation."},
{id:"u13l1-3",t:"u13l1",q:"An incident response team meets in a conference room to discuss how they would handle a hypothetical ransomware outbreak, without touching any systems. Which activity is this?",a:["A simulation","A tabletop exercise","Threat hunting","Root cause analysis"],c:1,e:"A tabletop exercise is a discussion-based walkthrough of a scenario that finds gaps in the plan without affecting systems. A simulation is a hands-on drill."},
{id:"u13l1-4",t:"u13l1",q:"After a phishing incident, the team determines that the real reason the attacker gained broad access was the absence of multifactor authentication and excessive account permissions. Which activity produced this conclusion?",a:["Detection","Containment","Root cause analysis","Attestation"],c:2,e:"Root cause analysis looks past the immediate event to the underlying condition that made the incident possible, so the fix prevents recurrence rather than only addressing the symptom."},
{id:"u13l1-5",t:"u13l1",q:"Without any alert having fired, analysts search logs and endpoint data for traces of an attack technique described in a recent threat report. What is this activity called?",a:["Incident detection","Alert tuning","Lessons learned","Threat hunting"],c:3,e:"Threat hunting proactively searches for signs of compromise based on hypotheses and threat intelligence, assuming attackers may already be present and undetected."},

// u13l2
{id:"u13l2-1",t:"u13l2",q:"Legal counsel informs IT that a lawsuit involving a former employee is expected. What must IT do with that employee's mailbox and files?",a:["Preserve them under a legal hold and suspend routine deletion","Delete them according to the normal retention schedule","Reimage the laptop for reuse","Move them to a public share for counsel"],c:0,e:"A legal hold requires preservation of relevant data the moment litigation is reasonably anticipated. Routine retention purges and reimaging must be suspended for that data."},
{id:"u13l2-2",t:"u13l2",q:"A server suspected of compromise is still powered on. Which evidence should be collected FIRST, and why?",a:["The disk image, because it is the largest","Memory contents, because they are lost at power off","Backup tapes, because they are stable","Remote logs, because they are easy to reach"],c:1,e:"Order of volatility dictates capturing the most transient evidence first. Memory holds running processes, keys, and connections and disappears when the system is powered down."},
{id:"u13l2-3",t:"u13l2",q:"An investigator computes a hash of a seized drive before imaging and a hash of the resulting image, and the two match. What does this demonstrate?",a:["The drive contains no malware","The chain of custody is complete","The image is an exact, unaltered copy of the original","The evidence is encrypted"],c:2,e:"Matching hashes prove the image is bit-for-bit identical to the original, supporting the integrity of the evidence. Chain of custody is documented separately."},
{id:"u13l2-4",t:"u13l2",q:"Seized evidence was left on an analyst's desk unattended for an afternoon with no record of who had access. Which forensic principle was violated?",a:["Order of volatility","Legal hold","E-discovery","Chain of custody"],c:3,e:"Chain of custody requires a continuous record of everyone who handled the evidence and when. An undocumented gap allows an opposing party to argue the evidence was altered."},
{id:"u13l2-5",t:"u13l2",q:"Which term describes the overall legal process of identifying, preserving, collecting, and producing electronically stored information for litigation?",a:["E-discovery","Threat hunting","Acquisition","Attestation"],c:0,e:"E-discovery is the legal process for producing electronic evidence in proceedings. Legal hold, chain of custody, and proper acquisition are what make the produced evidence admissible."},

// u13l3
{id:"u13l3-1",t:"u13l3",q:"An investigator needs to determine which internal device was using a specific IP address at 2:15 p.m. yesterday. Which data source answers this?",a:["Application logs","DHCP and network logs","IPS logs","Vulnerability scan results"],c:1,e:"DHCP lease records and network logs map IP addresses to devices over time. Application and IPS logs record activity, not address assignments."},
{id:"u13l3-2",t:"u13l3",q:"An email appears to come from the CEO, but the investigator suspects impersonation. Which data source reveals the servers the message actually passed through?",a:["Firewall logs","Endpoint logs","Email header metadata","Dashboards"],c:2,e:"Email headers are metadata recording every server that handled the message and its true origin, which exposes forged sender addresses."},
{id:"u13l3-3",t:"u13l3",q:"To determine exactly what data was transmitted to an external address during a suspected exfiltration, which source provides the most complete detail?",a:["NetFlow records","Automated reports","Firewall logs","Packet captures"],c:3,e:"Packet captures contain the full contents of network traffic and allow exact reconstruction of what was sent. NetFlow and firewall logs record only summaries and connection details."},
{id:"u13l3-4",t:"u13l3",q:"An analyst needs to know which processes executed on a laptop immediately after a user opened a suspicious attachment. Which log source is appropriate?",a:["Endpoint logs","Firewall logs","OS security logs on the domain controller","Network logs"],c:0,e:"Endpoint logs from the endpoint agent record process starts, file changes, and detections on the device itself. Firewall and network logs show connections, not local execution."},
{id:"u13l3-5",t:"u13l3",q:"Investigators cannot order events across the firewall, server, and endpoint logs because each system reports different times for the same event. Which control was missing?",a:["Log archiving","Time synchronization across systems","Packet capture","Vulnerability scanning"],c:1,e:"Correlating events across sources requires all systems to agree on the time, typically through NTP. Without synchronization the sequence of events cannot be reconstructed."},

// u14l1
{id:"u14l1-1",t:"u14l1",q:"A document states: \"All company laptops must use AES-256 full-disk encryption and TLS 1.2 or higher for all connections.\" Which type of governance document is this?",a:["Policy","Procedure","Standard","Guideline"],c:2,e:"A standard specifies exact, mandatory requirements that implement a policy, such as named algorithms and versions. A policy states what must be done at a high level without the specific settings."},
{id:"u14l1-2",t:"u14l1",q:"A document lists numbered steps for disabling accounts, forwarding email, and collecting equipment when an employee leaves. Which document type is this?",a:["Acceptable use policy","Guideline","Encryption standard","Offboarding procedure"],c:3,e:"Procedures provide step-by-step instructions for performing a task. Offboarding procedures ensure access and equipment are consistently recovered when someone departs."},
{id:"u14l1-3",t:"u14l1",q:"A document says employees are encouraged to use a password manager and to consider enabling automatic updates on home devices. Which document type is this?",a:["Guideline","Standard","Procedure","Policy"],c:0,e:"Guidelines are recommended practices that are not mandatory, signaled by words like encouraged, consider, and should. Policies and standards use must."},
{id:"u14l1-4",t:"u14l1",q:"Which policy defines what users may and may not do with company computers, email, and internet access?",a:["Change management policy","Acceptable use policy","Disaster recovery policy","Software development lifecycle policy"],c:1,e:"The acceptable use policy sets the rules for how employees may use organizational systems and data. The other policies govern changes, recovery, and development."},
{id:"u14l1-5",t:"u14l1",q:"Security analysts follow a predefined step-by-step checklist whenever a user reports a phishing email. What is this document called?",a:["An information security policy","A guideline","A playbook","A standard"],c:2,e:"A playbook is a procedure written for a specific incident type, giving responders defined steps so they do not have to improvise under pressure."},

// u14l2
{id:"u14l2-1",t:"u14l2",q:"A company uses a cloud payroll service that processes employee data strictly according to the company's instructions. In privacy terms, which roles do the company and the service hold?",a:["Company is the processor; service is the controller","Company is the custodian; service is the owner","Both are data subjects","Company is the controller; service is the processor"],c:3,e:"The controller decides why and how personal data is processed, and the processor acts on the controller's instructions. The employees are the data subjects."},
{id:"u14l2-2",t:"u14l2",q:"The finance director decides who may access the general ledger and how it must be protected, while the database team performs backups and grants the approved access. Which roles do they hold?",a:["Director is the owner; team is the custodian","Director is the custodian; team is the owner","Director is the processor; team is the controller","Both are data subjects"],c:0,e:"The data owner is accountable for classification and access decisions, and the custodian or steward handles the data day to day on the owner's behalf."},
{id:"u14l2-3",t:"u14l2",q:"Merchants that accept credit cards must follow security requirements set by the card brands rather than by a government. Which type of external consideration is this?",a:["Regulatory","Industry","Legal","Local"],c:1,e:"Industry requirements are standards imposed by the industry itself, such as payment card security rules from the card brands, as opposed to laws or government regulations."},
{id:"u14l2-4",t:"u14l2",q:"Which governance body holds ultimate accountability for an organization's cyber risk and receives regular risk reports?",a:["The help desk","The change advisory board","The board of directors","The data custodians"],c:2,e:"The board of directors carries ultimate accountability for organizational risk, including cyber risk, and depends on regular reporting to exercise oversight."},
{id:"u14l2-5",t:"u14l2",q:"An organization lets each business division run its own security program while a small central team provides coordination and guidelines. Which governance structure is this, and what is its main trade-off?",a:["Centralized; consistency at the cost of responsiveness","Committee-based; oversight at the cost of ownership","Regulatory; compliance at the cost of speed","Decentralized; responsiveness at the cost of consistency"],c:3,e:"Decentralized governance lets units respond to local needs but makes consistent policy and monitoring harder. Centralized governance is the opposite trade-off."},

// u14l3
{id:"u14l3-1",t:"u14l3",q:"A server is valued at 80,000 and a fire would destroy 50 percent of its value. Fires are expected once every 10 years. What is the annualized loss expectancy?",a:["4,000","40,000","8,000","400"],c:0,e:"SLE = AV x EF = 80,000 x 0.5 = 40,000. ARO = 1/10 = 0.1. ALE = SLE x ARO = 40,000 x 0.1 = 4,000 per year."},
{id:"u14l3-2",t:"u14l3",q:"A risk assessment rates each risk as low, medium, or high for likelihood and impact and plots them on a matrix without dollar values. Which type of analysis is this?",a:["Quantitative","Qualitative","Continuous","Ad hoc"],c:1,e:"Qualitative analysis uses descriptive ratings and judgment rather than monetary values. Quantitative analysis computes figures such as SLE and ALE."},
{id:"u14l3-3",t:"u14l3",q:"A company performs a risk assessment specifically because it is about to acquire another firm, and does not plan to repeat it. Which assessment type is this?",a:["Recurring","Continuous","One-time","Ad hoc"],c:2,e:"A one-time assessment is performed once for a specific event such as an acquisition. Ad hoc assessments arise from a need but may recur; recurring and continuous are scheduled or ongoing."},
{id:"u14l3-4",t:"u14l3",q:"An asset worth 50,000 has a single loss expectancy of 10,000 for a particular threat. What is the exposure factor?",a:["0.5","2","5","0.2"],c:3,e:"SLE = AV x EF, so EF = SLE / AV = 10,000 / 50,000 = 0.2, meaning 20 percent of the asset's value is lost in one incident."},
{id:"u14l3-5",t:"u14l3",q:"A control costs 6,000 per year and reduces the annualized loss expectancy of a risk from 15,000 to 2,000. Which statement is correct?",a:["The control is justified because it reduces ALE by 13,000 at a cost of 6,000","The control is not justified because it costs more than the remaining ALE","The control should be replaced by insurance","The ALE cannot be compared to control cost"],c:0,e:"The control removes 13,000 of expected annual loss for 6,000 per year, a net benefit of 7,000. Comparing ALE reduction to control cost is how quantitative analysis justifies spending."},

// u14l4
{id:"u14l4-1",t:"u14l4",q:"An organization purchases cyber insurance to cover breach response costs. Which risk management strategy is this, and what does it NOT do?",a:["Mitigate; it does not reduce likelihood","Transfer; it does not transfer accountability","Avoid; it does not eliminate the activity","Accept; it does not document the risk"],c:1,e:"Insurance transfers the financial impact of a risk to another party. Accountability to customers and regulators for the outcome remains with the organization."},
{id:"u14l4-2",t:"u14l4",q:"A business impact analysis determines that order processing must be restored within four hours and that no more than 15 minutes of transaction data may be lost. Which two metrics have been defined?",a:["MTTR of 4 hours and MTBF of 15 minutes","RPO of 4 hours and RTO of 15 minutes","RTO of 4 hours and RPO of 15 minutes","MTBF of 4 hours and MTTR of 15 minutes"],c:2,e:"The recovery time objective is the maximum acceptable restoration time, and the recovery point objective is the maximum acceptable data loss measured in time."},
{id:"u14l4-3",t:"u14l4",q:"A company decides to stop offering a feature that collected customers' biometric data because the risk outweighed the benefit. Which risk strategy is this?",a:["Mitigate","Accept","Transfer","Avoid"],c:3,e:"Avoidance eliminates a risk by discontinuing the activity that creates it. Mitigation would add controls while keeping the feature."},
{id:"u14l4-4",t:"u14l4",q:"A fast-growing startup deliberately accepts higher security risk to ship products quickly, while a hospital accepts very little. Which term describes these differing attitudes?",a:["Risk appetite","Risk threshold","Key risk indicator","Risk register"],c:0,e:"Risk appetite is the amount of risk an organization is willing to pursue: expansionary for the startup, conservative for the hospital. Tolerance is the practical limit for a specific risk."},
{id:"u14l4-5",t:"u14l4",q:"Which element of a risk register provides an early, measurable warning that a risk is increasing, such as the count of unpatched critical systems?",a:["Risk owner","Key risk indicator","Risk appetite","Exposure factor"],c:1,e:"Key risk indicators are measurable signals tracked in the risk register; when one crosses its threshold the risk owner must act."},

// u15l1
{id:"u15l1-1",t:"u15l1",q:"A company wants the contractual ability to inspect a vendor's security controls on site. Which contract element provides this?",a:["Service level agreement","Non-disclosure agreement","Right-to-audit clause","Statement of work"],c:2,e:"A right-to-audit clause gives the customer the ability to examine the vendor's controls directly, which is the strongest form of vendor assurance."},
{id:"u15l1-2",t:"u15l1",q:"Which agreement specifies measurable performance commitments such as 99.9 percent uptime and defines remedies if they are not met?",a:["Memorandum of understanding","Master service agreement","Business partnership agreement","Service level agreement"],c:3,e:"A service level agreement defines measurable service targets and the consequences of missing them. An MOU is non-binding intent and an MSA is the umbrella contract."},
{id:"u15l1-3",t:"u15l1",q:"A company signs an umbrella contract with a consulting firm and then issues separate documents defining the deliverables, timeline, and price of each individual project. What are these two document types?",a:["MSA and SOW","SLA and NDA","MOU and BPA","NDA and MOA"],c:0,e:"The master service agreement covers the overall relationship, and each statement of work defines one specific piece of work under it."},

{id:"u15l2-2",t:"u15l2",q:"An organization thoroughly researches a new regulation and then implements the required controls. Which two concepts together describe acting responsibly in this way?",a:["Due diligence and due care","Attestation and acknowledgement","Controller and processor","Internal and external reporting"],c:0,e:"Due diligence is understanding the requirements and risks; due care is taking the reasonable actions that follow. Together they demonstrate responsible conduct."},

/* FieldReady Academy course engine. Reads FRA.course (a course pack manifest) and the pack's data.
   Flow: 10-question starter test (with confidence) -> personalized tutorial -> 50-question test ->
   retraining tutorial built from the misses -> practice tests until three in a row at 85% or better.
   Every test ends with an explanation of each wrong answer and each lucky guess. */
(function () {
  'use strict';

  // ---------- course manifest ----------
  const course = FRA.course;
  if (!course || !Array.isArray(course.domains) || !course.test) throw new Error('FRA.course manifest missing or incomplete');
  const DOMAINS = {}; course.domains.forEach(d => { DOMAINS[d.id] = d; });
  const DOMAIN_IDS = course.domains.map(d => d.id);
  const T = course.test;
  const PASS_PCT = T.passPct, STREAK_NEEDED = T.streakNeeded, EXAM_N = T.questions, EXAM_MINUTES = T.minutes;
  const STARTER_N = DOMAIN_IDS.length * T.starterPerDomain, CHECKPOINT_N = T.checkpointN, CHECKPOINT_PASS = T.checkpointPass;
  const REBUILD_PTS = 3 * T.starterPerDomain; // every starter question in the domain wrong
  const ALL_WORD = T.starterPerDomain === 2 ? 'both' : 'all';
  const CONF = [[1, 'Guess'], [2, 'Unsure'], [3, 'Fairly sure'], [4, 'Sure'], [5, 'Certain']];
  const STORE_KEY = `fra.${course.id}.state.v3`;
  // Feedback delivery. Feedback is always saved in the browser and exportable from the Feedback tab.
  // Optionally set feedbackEndpoint (a URL that accepts POSTed JSON) and/or feedbackEmail in the course manifest.
  const FEEDBACK_ENDPOINT = course.feedbackEndpoint || '';
  const FEEDBACK_EMAIL = course.feedbackEmail || '';
  const FB_CATS = {
    question: ['Answer key is wrong', 'Question is unclear or ambiguous', 'Explanation is wrong or unclear', 'Too easy or off-topic', 'Typo', 'Other'],
    lesson: ['Content is inaccurate', 'Unclear or confusing', 'Missing something the exam covers', 'Too long or too short', 'Typo', 'Other'],
    overall: ['Content accuracy', 'Difficulty', 'Website bug', 'Design or usability', 'Idea or request', 'Other']
  };
  const WHERE_LABEL = { starter: 'Starter test', full: `${EXAM_N}-question test`, practice: 'Practice test', checkpoint: 'Lesson checkpoint', train: 'Drills', 'starter-results': 'Starter test results', 'full-results': `${EXAM_N}-question test results`, 'practice-results': 'Practice test results', callout: 'Lesson callout' };
  const STARTER_POOL = course.starterPool || {};
  const CORE = course.core || {};

  // ---------- data index ----------
  const units = (FRA.units || []).slice().sort((a, b) => a.n - b.n);
  const lessons = []; const L = {};
  units.forEach(u => u.lessons.forEach(l => { l.unit = u; l.index = lessons.length; lessons.push(l); L[l.id] = l; }));
  const bank = FRA.questions || []; const Q = {}; bank.forEach(q => { Q[q.id] = q; });
  const byLesson = {}; bank.forEach(q => { (byLesson[q.t] = byLesson[q.t] || []).push(q); });
  const lessonsByDomain = {}; DOMAIN_IDS.forEach(d => { lessonsByDomain[d] = []; });
  lessons.forEach(l => { if (!lessonsByDomain[l.domain]) throw new Error(`lesson ${l.id} uses unknown domain ${l.domain}`); lessonsByDomain[l.domain].push(l); });
  const gens = FRA.generators || {};
  document.title = course.name;

  // ---------- access ----------
  // Free set: the cheat sheet, the starter test, and the lessons below. Everything else needs entitlement.
  const FREE_SET = new Set();
  (function () { const f = course.free || {}; if (Array.isArray(f.lessons)) f.lessons.forEach(id => FREE_SET.add(id)); else if (typeof f.lessons === 'number') lessons.slice(0, f.lessons).forEach(l => FREE_SET.add(l.id)); })();
  const entitled = () => !!course.freeCourse || window.FRA_ENTITLED === true;
  const lessonLocked = id => !entitled() && !FREE_SET.has(id);
  const testsLocked = kind => !entitled() && kind !== 'starter';
  function paywall(what) {
    const btn = course.upgradeUrl ? `<a class="btn primary" href="${esc(course.upgradeUrl)}">Unlock the full course</a>` : `<button class="btn primary" data-act="upgrade">Unlock the full course</button>`;
    return `<div class="card lift stack paywall"><div class="eyebrow">Full course</div><h3>${esc(what)} is part of the full ${esc(course.name)} course.</h3><p class="ink2">The cheat sheet, the starter test, and the first ${FREE_SET.size} lessons are free. The full course adds every lesson, the ${EXAM_N}-question test, retraining, practice tests, and drills.</p><div class="row">${btn}<button class="btn ghost" data-act="go" data-arg="course">See the free lessons</button></div></div>`;
  }

  // ---------- utilities ----------
  const $ = (sel, root) => (root || document).querySelector(sel);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const pct = (c, t) => t ? Math.round(100 * c / t) : 0;
  const fmtDate = ts => new Date(ts).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
  const letters = ['A', 'B', 'C', 'D'];
  const inline = s => esc(s).replace(/\{\{(.+?)\}\}/g, '<code>$1</code>').replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;

  function renderBody(md) {
    const lines = md.split('\n'); let html = ''; let list = []; let olist = []; let pre = null;
    const flush = () => {
      if (list.length) { html += '<ul>' + list.map(li => `<li>${inline(li)}</li>`).join('') + '</ul>'; list = []; }
      if (olist.length) { html += '<ol>' + olist.map(li => `<li>${inline(li)}</li>`).join('') + '</ol>'; olist = []; }
    };
    for (const raw of lines) {
      if (pre !== null) { if (raw.trim().startsWith('```')) { html += `<pre>${esc(pre.join('\n'))}</pre>`; pre = null; } else pre.push(raw); continue; }
      const line = raw.trim();
      if (line.startsWith('```')) { flush(); pre = []; continue; }
      if (!line) { flush(); continue; }
      if (line.startsWith('## ')) { flush(); html += `<h3>${inline(line.slice(3))}</h3>`; }
      else if (line.startsWith('- ')) { if (olist.length) flush(); list.push(line.slice(2)); }
      else if (/^\d+\. /.test(line)) { if (list.length) flush(); olist.push(line.replace(/^\d+\. /, '')); }
      else if (line.startsWith('> ')) { flush(); html += `<div class="tip">${inline(line.slice(2))}</div>`; }
      else { flush(); html += `<p>${inline(line)}</p>`; }
    }
    if (pre !== null) html += `<pre>${esc(pre.join('\n'))}</pre>`;
    flush(); return html;
  }

  // ---------- state ----------
  function fresh() {
    return { v: 3, course: course.id, view: { name: 'cheatsheet', arg: 'intro' }, lessons: {}, qstats: {}, topics: {}, exams: [], passStreak: 0, plan: null, active: null, settings: { timer: true }, feedback: [], seen: {}, created: Date.now() };
  }
  let S = load();
  function load() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (raw) { const s = JSON.parse(raw); if (s && s.v === 3) return Object.assign(fresh(), s); }
      for (const key of (course.legacyStoreKeys || [])) {
        const old = localStorage.getItem(key);
        if (old) { const s = JSON.parse(old); if (s && s.v === 2) return Object.assign(fresh(), s, { v: 3, course: course.id }); }
      }
    } catch (e) { /* storage unavailable */ }
    return fresh();
  }
  function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) { /* ignore */ } }

  const lstat = id => S.lessons[id] || (S.lessons[id] = { status: 'new', best: 0, attempts: 0, passedAt: 0 });
  const tstat = id => S.topics[id] || (S.topics[id] = { hist: [], attempts: 0, correct: 0, streak: 0, last: 0 });
  const qstat = id => S.qstats[id] || (S.qstats[id] = { seen: 0, correct: 0, wrong: 0, last: 0 });
  // Checkpoint credit: right answers marked Guess or Unsure do not count toward passing the lesson.
  const cpScore = s => s.answers.filter(a => a.correct && a.conf >= 3).length;

  // Priority points. Wrong and confident is the most dangerous state; right but unsure is probably a guess.
  function points(correct, conf) {
    if (!correct) return conf >= 4 ? 4 : 3;
    if (conf <= 2) return 2;
    if (conf === 3) return 1;
    return 0;
  }
  const kindOf = (correct, conf) => !correct ? (conf >= 4 ? 'wrong-confident' : 'wrong') : (conf <= 2 ? 'guess' : conf === 3 ? 'shaky' : 'solid');
  const KIND_LABEL = { 'wrong-confident': 'Wrong and confident', wrong: 'Wrong', guess: 'Right, but a guess', shaky: 'Right, fairly sure', solid: 'Right and confident' };
  function topicPriority(id) { const t = S.topics[id]; if (!t) return 0; return t.hist.reduce((a, b) => a + b, 0); }
  function topicMastered(id) { const t = S.topics[id]; if (!t) return false; return t.streak >= 3 || (t.attempts >= 3 && topicPriority(id) === 0); }

  function recordAnswer(q, choice, conf) {
    const correct = choice === q.c;
    const p = points(correct, conf);
    if (!q.gen) { const qs = qstat(q.id); qs.seen++; qs[correct ? 'correct' : 'wrong']++; qs.last = Date.now(); }
    const t = tstat(q.t); t.attempts++; if (correct) t.correct++; t.hist.push(p); if (t.hist.length > 8) t.hist.shift();
    t.streak = (correct && conf >= 4) ? t.streak + 1 : 0; t.last = Date.now();
    return { correct, p };
  }

  // ---------- question selection ----------
  function leastSeen(pool, used) {
    const cands = pool.filter(q => !used.has(q.id));
    if (!cands.length) return null;
    const scored = shuffle(cands).map(q => ({ q, s: (S.qstats[q.id] || { seen: 0, last: 0 }) }));
    scored.sort((a, b) => a.s.seen - b.s.seen || a.s.last - b.s.last);
    return scored[0].q;
  }
  function pickForLesson(lessonId, n, used, genShare) {
    const out = []; const pool = byLesson[lessonId] || [];
    used = used || new Set();
    for (let i = 0; i < n * 3 && out.length < n; i++) {
      let q = null;
      if (gens[lessonId] && Math.random() < (genShare == null ? 0.35 : genShare)) q = FRA.generate(lessonId);
      else q = leastSeen(pool, used);
      if (!q && gens[lessonId]) q = FRA.generate(lessonId);
      if (!q) break;
      used.add(q.id); out.push(q);
    }
    return out;
  }
  function buildExam() {
    const items = []; const used = new Set();
    for (const d of DOMAIN_IDS) {
      const quota = DOMAINS[d].quota; const ls = shuffle(lessonsByDomain[d]); let i = 0, guard = 0; const target = items.length + quota;
      while (items.length < target && guard < 400) {
        const l = ls[i % ls.length]; i++; guard++;
        let q = null;
        if (gens[l.id] && Math.random() < 0.3) q = FRA.generate(l.id);
        else q = leastSeen(byLesson[l.id] || [], used);
        if (!q) continue;
        used.add(q.id); items.push(q);
      }
    }
    return shuffle(items);
  }
  function buildStarter() {
    const items = []; const used = new Set();
    for (const d of DOMAIN_IDS) {
      const picks = shuffle(STARTER_POOL[d] || lessonsByDomain[d].map(l => l.id)).slice(0, T.starterPerDomain);
      for (const lid of picks) {
        let q = (gens[lid] && Math.random() < 0.5) ? FRA.generate(lid) : leastSeen(byLesson[lid] || [], used);
        if (!q) q = leastSeen(byLesson[lid] || [], new Set());
        if (q) { used.add(q.id); items.push(q); }
      }
    }
    return shuffle(items);
  }
  const slim = q => q.gen ? q : q.id; // generated questions stored inline, bank questions by id
  const fat = x => typeof x === 'string' ? Q[x] : x;

  // ---------- plan (personalized tutorial) ----------
  function planFromStarter(rec, examIdx) {
    const entries = {}; const domPts = {}; const domCount = {}; DOMAIN_IDS.forEach(d => { domPts[d] = 0; domCount[d] = 0; });
    const add = (id, reason) => { if (!L[id]) return; (entries[id] = entries[id] || { id, reasons: [] }).reasons.push(reason); };
    rec.review.forEach(r => {
      const q = fat(r.q); if (!q) return; const d = L[q.t].domain; const p = points(r.correct, r.conf); domPts[d] += p; domCount[d]++;
      const k = kindOf(r.correct, r.conf);
      if (p >= 2) add(q.t, { kind: k, q: r.q, choice: r.choice, conf: r.conf, source: 'starter' });
    });
    const depth = {};
    for (const d of DOMAIN_IDS) {
      if (domPts[d] >= REBUILD_PTS) { depth[d] = 'rebuild'; lessonsByDomain[d].forEach(l => add(l.id, { kind: 'domain', level: 'rebuild', d, pts: domPts[d] })); }
      else if (domPts[d] >= 3) { depth[d] = 'core'; CORE[d].forEach(id => add(id, { kind: 'domain', level: 'core', d, pts: domPts[d] })); }
      else depth[d] = domPts[d] > 0 ? 'light' : 'solid';
    }
    const list = Object.values(entries).sort((a, b) => L[a.id].index - L[b.id].index);
    return { source: 'starter', examIdx, createdAt: Date.now(), lessons: list, domPts, depth };
  }
  function planFromTest(rec, examIdx) {
    const entries = {}; const pts = {};
    rec.review.forEach(r => {
      const q = fat(r.q); if (!q) return; const p = points(r.correct, r.conf); pts[q.t] = (pts[q.t] || 0) + p;
      if (p >= 2) { (entries[q.t] = entries[q.t] || { id: q.t, reasons: [] }).reasons.push({ kind: kindOf(r.correct, r.conf), q: r.q, choice: r.choice, conf: r.conf, source: 'test' }); }
    });
    const list = Object.values(entries).filter(e => (pts[e.id] || 0) >= 2)
      .sort((a, b) => (pts[b.id] - pts[a.id]) || (DOMAINS[L[b.id].domain].pct - DOMAINS[L[a.id].domain].pct) || (L[a.id].index - L[b.id].index));
    return { source: 'test', examIdx, createdAt: Date.now(), lessons: list, pts };
  }
  const planEntry = id => S.plan ? S.plan.lessons.find(e => e.id === id) : null;
  const planDone = id => { const ls = S.lessons[id]; return !!(ls && ls.status === 'passed' && S.plan && ls.passedAt >= S.plan.createdAt); };
  const planRemaining = () => S.plan ? S.plan.lessons.filter(e => !planDone(e.id)) : [];
  const planMinutes = list => list.reduce((a, e) => a + (L[e.id].minutes || 6) + 3, 0);

  // ---------- stage ----------
  function stage() {
    if (!S.exams.some(e => e.kind === 'starter')) return 'starter';
    if (S.plan && planRemaining().length) return S.plan.source === 'starter' ? 'tutorial' : 'retrain';
    if (S.passStreak >= STREAK_NEEDED) return 'ready';
    if (!S.exams.some(e => e.kind === 'full' || e.kind === 'practice')) return 'fulltest';
    return 'practice';
  }
  const STAGE_LABEL = { starter: 'Starter test', tutorial: 'Initial tutorial', fulltest: `${EXAM_N}-question test`, retrain: 'Retraining', practice: 'Practice tests', ready: 'Ready' };

  function lastExam(kind) { for (let i = S.exams.length - 1; i >= 0; i--) if (!kind || S.exams[i].kind === kind) return S.exams[i]; return null; }
  function weakTopics() {
    return lessons.map(l => ({ l, p: topicPriority(l.id) })).filter(x => x.p > 0 && !topicMastered(x.l.id))
      .sort((a, b) => b.p - a.p || DOMAINS[b.l.domain].pct - DOMAINS[a.l.domain].pct).map(x => x.l.id);
  }
  function readiness() {
    const ex = S.exams.filter(e => e.kind === 'practice' || e.kind === 'full').slice(-3);
    const examPart = ex.length ? ex.reduce((a, e) => a + e.pct, 0) / ex.length : 0;
    const touched = lessons.filter(l => (S.topics[l.id] || { attempts: 0 }).attempts > 0);
    const mastered = lessons.filter(l => topicMastered(l.id)).length;
    const masteryPart = touched.length ? 100 * mastered / lessons.length : 0;
    const streakPart = 100 * Math.min(S.passStreak, STREAK_NEEDED) / STREAK_NEEDED;
    if (!ex.length && !touched.length) return 0;
    return Math.round(0.5 * examPart + 0.3 * masteryPart + 0.2 * streakPart);
  }
  function domainAccuracy(d) {
    let c = 0, t = 0;
    for (const l of lessonsByDomain[d]) { const ts = S.topics[l.id]; if (ts) { c += ts.correct; t += ts.attempts; } }
    return { c, t };
  }
  function nextAction() {
    if (S.active) return { label: S.active.kind === 'train' ? 'Resume drills' : S.active.kind === 'checkpoint' ? 'Resume the lesson checkpoint' : 'Resume your test', act: 'resume', arg: '' };
    const st = stage();
    if (st === 'starter') return { label: 'Take the 10-question starter test', act: 'start-exam', arg: 'starter', sub: 'Two questions from each exam domain, with a confidence rating on each. It builds your tutorial.' };

  }

  // ---------- rendering ----------
  const app = $('#app');
  let railOpen = false; let timerHandle = null; let toastHandle = null;
  let deepOpen = null; // lesson id whose deeper explanation is expanded

  function go(name, arg) { S.view = { name, arg }; save(); render(); window.scrollTo(0, 0); }

  function render() {
    const v = S.view || { name: 'home' };

    }

      <div class="shell">
        <header class="topbar">
          <button class="rail-toggle" data-act="toggle-rail" aria-label="Toggle lesson outline">Units</button>

  }

  }
  function ledClass(lessonId) { const s = lstat(lessonId).status; if (s === 'passed') return 'green'; if (s === 'read' || (S.topics[lessonId] && S.topics[lessonId].attempts)) return 'amber'; return 'off'; }

  function viewWelcome() {
    return `<main class="main"><div class="content stack" style="gap:22px;padding-top:24px">
      <div class="stack" style="gap:10px">
        <div class="eyebrow">${esc(course.brand)} · ${esc(course.name)}</div>

  function stageStrip(st) {

  }
  function domainBars() {
    return `<div class="bars">${DOMAIN_IDS.map(d => { const a = domainAccuracy(d); const v = a.t ? pct(a.c, a.t) : 0;
      return `<div class="bar-row"><span class="label">${DOMAINS[d].short} <span class="muted">${DOMAINS[d].pct}%</span></span><div class="track"><i class="${a.t ? '' : 'dim'}" style="width:${a.t ? v : 100}%"></i></div><span class="value">${a.t ? v + '%' : '—'}</span></div>`; }).join('')}</div>`;
  }

  // ---------- tutorial (plan) ----------
  function reasonLabel(r) {
    if (r.kind === 'domain') return r.level === 'rebuild' ? `${DOMAINS[r.d].short}: ${ALL_WORD} starter questions missed` : `${DOMAINS[r.d].short}: gap on the starter test`;

  function reasonPill(e) {

  function viewTutorial() {
    if (!S.plan) {

    const groups = Object.values(byUnit).sort((a, b) => S.plan.source === 'starter' ? a.u.n - b.u.n : Math.min(...a.list.map(e => S.plan.lessons.indexOf(e))) - Math.min(...b.list.map(e => S.plan.lessons.indexOf(e))));

      <div><div class="eyebrow">${S.plan.source === 'starter' ? 'Your tutorial' : 'Retraining tutorial'} · built from your ${S.plan.source === 'starter' ? 'starter test' : 'test'} on ${src ? fmtDate(src.date) : ''}</div>
        <h1>${rem.length ? `${plural(rem.length, 'lesson')} to go, about ${planMinutes(rem)} minutes` : 'Tutorial complete'}</h1>

      ${S.plan.source === 'starter' ? `<div class="card soft stack" style="gap:8px"><div class="eyebrow">How your starter test shaped this</div><div class="row" style="gap:8px">${DOMAIN_IDS.map(d => `<span class="pill ${S.plan.depth[d] === 'rebuild' ? 'bad' : S.plan.depth[d] === 'core' ? 'warn' : S.plan.depth[d] === 'light' ? '' : 'good'}">${DOMAINS[d].short}: ${S.plan.depth[d] === 'rebuild' ? 'all lessons' : S.plan.depth[d] === 'core' ? 'core lessons' : S.plan.depth[d] === 'light' ? 'light review' : 'solid'}</span>`).join('')}</div><p class="ink2" style="font-size:.95rem">Lessons run in course order so each one builds on the last. Lessons tied to a question you missed or guessed open with your answer and the correct one.</p></div>` : `<div class="card soft"><p class="ink2" style="font-size:.95rem">Ordered worst first: topics where you were wrong and confident come before topics you guessed. Each lesson opens with the exact question you missed.</p></div>`}
      ${rem.length ? `<div class="row"><button class="btn primary lg" data-act="lesson" data-arg="${rem[0].id}">${done ? 'Continue' : 'Start'}: ${esc(L[rem[0].id].title)}</button></div>` : `<div class="ready-banner"><strong>All ${S.plan.lessons.length} lessons passed.</strong> ${stage() === 'fulltest' ? `Next: the ${EXAM_N}-question test.` : stage() === 'ready' ? 'You are cleared to book the exam.' : 'Next: a practice test.'} <button class="btn primary small" data-act="start-exam" data-arg="${stage() === 'fulltest' ? 'full' : 'practice'}" style="margin-left:8px">Start it</button></div>`}
      ${groups.map(g => `<div class="card stack" style="gap:8px"><div class="row spread"><h3><span class="muted" style="font-family:var(--font-mono);font-size:.85rem;margin-right:8px">${String(g.u.n).padStart(2, '0')}</span>${esc(g.u.title)}</h3></div>
        ${g.list.map(e => `<button class="option" data-act="lesson" data-arg="${e.id}" style="align-items:center"><span class="led lg ${planDone(e.id) ? 'green' : ledClass(e.id)}"></span><span style="flex:1"><strong>${esc(L[e.id].title)}</strong><br><span class="muted" style="font-size:.88rem">${esc(reasonLabel(e.reasons[0]))}${e.reasons.length > 1 ? ` · +${e.reasons.length - 1} more` : ''}</span></span>${planDone(e.id) ? '<span class="pill good">DONE</span>' : reasonPill(e)}</button>`).join('')}</div>`).join('')}
      <div class="row"><button class="btn ghost" data-act="go" data-arg="course">Browse all ${lessons.length} lessons</button></div>

  function viewCourse() {

      return `<div class="content stack" style="gap:18px">

  // Lesson view with personalization callouts and checkpoint quiz.
  function viewLesson(id) {
    const l = L[id]; if (!l) return viewCourse();
    if (lessonLocked(id)) return `<div class="content stack" style="gap:20px"><div class="lesson-head"><div class="row" style="gap:8px"><span class="pill accent">Unit ${l.unit.n}</span><span class="pill">${DOMAINS[l.domain].short}</span><span class="pill">Objective ${l.obj}</span></div><h1>${esc(l.title)}</h1></div>${paywall('This lesson')}</div>`;

    const entry = planEntry(id); const rem = planRemaining(); const posInPlan = entry ? rem.findIndex(e => e.id === id) : -1;
    const nextInPlan = entry ? rem.find(e => e.id !== id) : null;

      return `<div class="callout ${wrong ? 'bad' : 'warn'}"><div class="eyebrow">${wrong ? 'You missed this' : 'You guessed this right'} on the ${r.source === 'starter' ? 'starter test' : 'last test'} · confidence ${r.conf}/5</div>
        <div class="stem">${esc(q.q)}</div>
        <div class="ans">${wrong ? `<span style="color:var(--bad)">You answered ${r.choice >= 0 ? letters[r.choice] + '. ' + esc(q.a[r.choice]) : 'nothing (skipped)'}.</span> ` : ''}<span style="color:var(--good)">Correct: ${letters[q.c]}. ${esc(q.a[q.c])}</span></div>
        <div class="ans ink2">${esc(q.e)}</div></div>`; }).join('') : '';
    const domainReason = entry ? entry.reasons.find(r => r.kind === 'domain') : null;
    let quiz;
    if (!cp) {
      quiz = `<div class="card lift stack"><div class="row spread"><div><div class="eyebrow">Checkpoint</div><h3>${CHECKPOINT_N} questions on this lesson</h3><p class="ink2">Pass ${CHECKPOINT_PASS} of ${CHECKPOINT_N} to complete it. An answer counts only if you were at least fairly sure.${ls.best ? ` Your best so far: ${ls.best}/${CHECKPOINT_N}.` : ''}</p></div><button class="btn primary" data-act="start-checkpoint" data-arg="${id}">Start checkpoint</button></div></div>`;
    } else if (cp.i >= cp.items.length) {
