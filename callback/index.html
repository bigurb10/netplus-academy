<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Signing you in - FieldReady Academy</title>
<link rel="stylesheet" href="../catalog.css">
<style>
  .cb { max-width: 32rem; margin: 12vh auto; padding: 0 1rem; text-align: center; }
  .cb .err { text-align: left; }
</style>
</head>
<body>
<main class="cb">
  <h1 id="msg">Signing you in...</h1>
  <p id="detail" class="muted"></p>
  <p id="actions" hidden><a class="btn" href="/">Back to the courses</a></p>
</main>
<script src="../engine/auth.js"></script>
<script>
(function () {
  var msg = document.getElementById('msg');
  var detail = document.getElementById('detail');
  var actions = document.getElementById('actions');
  // Overridable the same way the auth module's own config is (FRA_AUTH_CONFIG,
  // FRA_ENTITLED): a test can set window.FRA_REDIRECT before this script runs to
  // capture the target instead of actually navigating.
  var redirect = window.FRA_REDIRECT || function (to) { window.location.replace(to); };
  function fail(text) {
    msg.textContent = 'That sign-in did not complete';
    detail.textContent = text;
    detail.className = 'muted err';
    actions.hidden = false;
  }
  var q = new URLSearchParams(window.location.search);
  if (!q.has('code') && !q.has('state') && !q.has('error')) {
    // A plain visit, not a sign-in in progress -- this happens twice in a normal
    // sign-in (once when the learner opens this page, once after the post-exchange
    // redirect lands back here) and any time the URL is bookmarked or revisited
    // directly. Neither case is a failure, so completeSignIn is never called here.
    if (window.FRAAuth && window.FRAAuth.isSignedIn()) {
      msg.textContent = "You're signed in";
      redirect('/');
    } else {
      msg.textContent = 'Nothing to finish here';
      detail.textContent = 'There is no sign-in in progress.';
      detail.className = 'muted';
      actions.hidden = false;
    }
  } else {
    try {
      window.FRAAuth.completeSignIn(window.location.search).then(function (out) {
        // Same-origin, app-relative only: never send the learner to an absolute URL
        // that arrived from outside, or this page becomes an open redirect.
        var to = out.returnTo || '/';
        if (!/^\/[^/]/.test(to)) to = '/';
        redirect(to);
      }, function (err) {
        fail(String(err && err.message ? err.message : err));
      });
    } catch (e) {
      fail(String(e && e.message ? e.message : e));
    }
  }
})();
</script>
</body>
</html>
